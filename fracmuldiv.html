<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Multiplying and Dividing Fractions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Multiplying and Dividing Fractions (grade 7, Shawn 2026-10-10). Header switches × / ÷ and Learn / Practice.
   Learn walks one example step by step for three kinds: whole × fraction (8 groups of 1/2, jumps on a number line),
   fraction × whole (1/2 of 8, cut a bar of wholes into equal parts), fraction × fraction (2/3 of 5/8, area model);
   and for ÷: how many groups of 3/4 fit in 6, share 3/4 into 2 groups, how many 1/8s fit in 3/4 (common pieces).
   Colors: first number blue, second number orange, answer green.
   Practice asks what the question means (optional), then the answer as a fraction or mixed number,
   with hints for common mistakes; Show the picture / Show me play the same steps on the board. */
.main { grid-template-columns: minmax(0, 1.65fr) minmax(330px, 1fr); }
.seg-btns { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg-btns button { border: 0; border-radius: 0; background: var(--sheet); font-size: 1rem; min-height: 44px; padding: 6px 12px; }
.seg-btns button + button { border-left: 2px solid var(--grid-major); }
.seg-btns button.on { background: var(--pt); color: var(--sheet); }
header .seg-btns button { font-size: 1.15rem; min-height: 48px; padding: 6px 16px; }
header .switches { display: flex; flex-wrap: wrap; gap: 10px; }
.sym { font-family: var(--font-num); font-weight: 700; }
.panel { gap: 12px; }
.card { padding: 12px 14px; }
.card .label { margin-bottom: 6px; }
.kinds button { flex: 1 1 auto; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.label + .row, .row + .row, .seg-btns + .label, .row + .label { margin-top: 10px; }

.ask { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-family: var(--font-num); font-weight: 700; font-size: 1.6rem; }
.ask input { font: inherit; font-size: 1.35rem; color: var(--ink); background: var(--paper); border: 2px solid var(--grid-major); border-radius: 8px; height: 44px; width: 2.8ch; text-align: center; padding: 0 2px; }
.ask input.L { border-color: var(--pt); color: var(--pt); }
.ask input.R { border-color: var(--orange); color: var(--orange); }
.ask input.bad { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--paper)); }
.ask input.ok { border-color: var(--green); color: var(--green); }
.ask .stack { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.ask .stack hr { width: 100%; border: 0; border-top: 3px solid var(--ink); margin: 0; }
.ask .op { color: var(--muted); }
.err { margin: 8px 0 0; color: var(--warn); font-weight: 700; }

.steplbl { margin: 0 0 4px; color: var(--muted); font-weight: 700; font-size: 0.9rem; }
.say { font-size: 1.15rem; margin: 0; min-height: 4.5em; line-height: 1.55; }
.say b.L, .cL { color: var(--pt); } .say b.R, .cR { color: var(--orange); } .say b.A, .cA { color: var(--green); }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-family: var(--font-num); font-weight: 700; font-size: 0.85em; line-height: 1.1; margin: 0 2px; }
.fr > span:first-child { border-bottom: 2px solid currentColor; padding: 0 3px 1px; }
.fr > span:last-child { padding: 1px 3px 0; }
.n { font-family: var(--font-num); font-weight: 700; }

.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns button { font-size: 1.05rem; min-height: 48px; padding: 8px 14px; }
.btns button.go { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.btns button:disabled { opacity: 0.45; cursor: default; }

.opts { display: flex; flex-direction: column; gap: 6px; }
.opts button { text-align: left; font-size: 1.05rem; min-height: 46px; background: var(--sheet); }
.opts button.right { border: 2px solid var(--green); color: var(--green); background: color-mix(in srgb, var(--green) 10%, var(--sheet)); }
.opts button.wrong { border: 2px solid var(--warn); color: var(--warn); text-decoration: line-through; }
.fb { margin: 8px 0 0; font-size: 1.05rem; font-weight: 700; min-height: 1.4em; }
.fb.ok { color: var(--green); } .fb.no { color: var(--warn); } .fb.mid { color: var(--orange); }
.score { font-size: 1.05rem; color: var(--muted); margin: 0; }
.score b { color: var(--ink); font-family: var(--font-num); font-size: 1.3rem; }
.toggles { margin-top: 10px; }
#practice .fb:empty { display: none; }
#practice .ask input { height: 40px; }

/* Board drawing */
.tx { font-family: var(--font-num); font-weight: 700; fill: var(--ink); }
.tx.op { fill: var(--muted); }
.tx.L { fill: var(--pt); } .tx.R { fill: var(--orange); } .tx.A { fill: var(--green); } .tx.m { fill: var(--muted); }
.fbar { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.fbar.L { stroke: var(--pt); } .fbar.R { stroke: var(--orange); } .fbar.A { stroke: var(--green); }
.qbox { fill: none; stroke: var(--muted); stroke-width: 3; stroke-dasharray: 8 6; }
.mean { font-family: var(--font-body); font-weight: 700; fill: var(--ink); }
.mean .L { fill: var(--pt); font-family: var(--font-num); } .mean .R { fill: var(--orange); font-family: var(--font-num); }
.whole { fill: var(--sheet); stroke: var(--ink); stroke-width: 3; }
.wline { stroke: var(--ink); stroke-width: 3; }
.pline { stroke: var(--ink); stroke-width: 1.2; opacity: 0.55; }
.cell { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.5; }
.cell.R { fill: var(--orange); fill-opacity: 0.45; }
.cell.L { fill: var(--pt); fill-opacity: 0.4; }
.shadeR { fill: var(--orange); fill-opacity: 0.38; }
.shadeR2 { fill: var(--orange); fill-opacity: 0.2; }
.shadeL { fill: var(--pt); fill-opacity: 0.32; }
.take { fill: var(--green); fill-opacity: 0.55; stroke: var(--green); stroke-width: 4; }
.gbox { fill: none; stroke: var(--pt); stroke-width: 2.5; stroke-dasharray: 7 5; }
.badge { fill: var(--pt); }
.badge.R { fill: var(--orange); }
.btx { font-family: var(--font-num); font-weight: 700; fill: var(--sheet); text-anchor: middle; }
.cnt { font-family: var(--font-num); font-weight: 700; fill: var(--ink); text-anchor: middle; }
.cut { stroke: var(--pt); stroke-width: 5; stroke-linecap: round; }
.cut.R { stroke: var(--orange); }
.rowline { stroke: var(--pt); stroke-width: 3; stroke-dasharray: 9 6; }
.rowline.R { stroke: var(--orange); }
.brk { fill: none; stroke: var(--pt); stroke-width: 3; stroke-linejoin: round; }
.brk.R { stroke: var(--orange); } .brk.A { stroke: var(--green); }
.part { fill: none; stroke: var(--orange); stroke-width: 3; stroke-dasharray: 8 5; }
.grp { stroke: var(--orange); stroke-width: 3; }
.grp.a { fill: var(--orange); fill-opacity: 0.5; } .grp.b { fill: var(--orange); fill-opacity: 0.25; }
.grp.part { fill: none; stroke-dasharray: 8 5; }
.nl { stroke: var(--ink); stroke-width: 3; }
.tick { stroke: var(--ink); stroke-width: 1.5; }
.tick.big { stroke-width: 3; }
.jump { fill: none; stroke: var(--orange); stroke-width: 4; stroke-linecap: round; }
.land { fill: var(--green); stroke: var(--sheet); stroke-width: 3; }
.lbl { font-family: var(--font-num); font-weight: 700; fill: var(--ink); }
.lbl.L { fill: var(--pt); } .lbl.R { fill: var(--orange); } .lbl.A { fill: var(--green); } .lbl.m { fill: var(--muted); }
.wlbl { font-family: var(--font-body); font-weight: 700; fill: var(--muted); }

.pop { animation: pop 0.45s ease-out both; transform-box: fill-box; transform-origin: center; }
.fade { animation: fade 0.5s ease-out both; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.35s ease-out forwards; }
@keyframes pop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .pop, .fade { animation: none; } .draw { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; } }
@media (max-width: 600px) { .ask { font-size: 1.3rem; } }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Multiplying and Dividing Fractions</h1></div>
    <div class="switches">
      <div class="seg-btns" role="group" aria-label="Operation">
        <button type="button" data-op="mul" class="on"><span class="sym">×</span> Multiply</button><button type="button" data-op="div"><span class="sym">÷</span> Divide</button>
      </div>
      <div class="seg-btns" role="group" aria-label="Mode">
        <button type="button" data-mode="learn" class="on">Learn</button><button type="button" data-mode="practice">Practice</button>
      </div>
    </div>
  </header>

  <div class="main">
    <div class="board"><svg id="svg" viewBox="0 0 1000 640" role="img" aria-label="The fraction question and a picture of what it means."></svg></div>

    <div class="panel" id="learn">
      <section class="card">
        <p class="label">Kind</p>
        <div class="seg-btns kinds" role="group" aria-label="Kind" id="kinds"></div>
        <div class="row">
          <div class="ask" id="editor"></div>
          <button type="button" id="swap" title="Swap the order">⇄ Swap order</button>
        </div>
        <p class="err" id="err" hidden></p>
      </section>
      <section class="card">
        <p class="steplbl" id="steplbl"></p>
        <p class="say" id="say" aria-live="polite"></p>
      </section>
      <div class="btns">
        <button type="button" class="go" id="next">Next step</button>
        <button type="button" id="back">Back</button>
        <button type="button" id="again">Start over</button>
        <button type="button" id="rand">New example</button>
      </div>
    </div>

    <div class="panel" id="practice" hidden>
      <section class="card">
        <div class="seg-btns kinds" role="group" aria-label="Question kind" id="pkinds"></div>
        <div class="row" style="justify-content: space-between">
          <label class="toggles" style="margin: 0"><input type="checkbox" id="askMean" checked> Ask what it means first</label>
          <p class="score">Correct: <b id="right">0</b> of <b id="total">0</b></p>
        </div>
      </section>
      <section class="card" id="meanCard">
        <p class="label">What does it mean?</p>
        <div class="opts" id="opts"></div>
        <p class="fb" id="meanFb" aria-live="polite"></p>
      </section>
      <section class="card" id="ansCard">
        <p class="label">Your answer <span style="text-transform: none; letter-spacing: 0; font-weight: 400">(fraction or mixed number)</span></p>
        <div class="row">
          <div class="ask">
            <input id="aw" type="text" inputmode="numeric" autocomplete="off" aria-label="Whole number part (leave empty if none)">
            <span class="stack"><input id="an" type="text" inputmode="numeric" autocomplete="off" aria-label="Numerator"><hr><input id="ad" type="text" inputmode="numeric" autocomplete="off" aria-label="Denominator"></span>
          </div>
          <div class="btns"><button type="button" class="go" id="check">Check</button><button type="button" id="newq">New question</button></div>
        </div>
        <p class="fb" id="ansFb" aria-live="polite"></p>
        <p class="say" id="psay" style="min-height: 0"></p>
      </section>
      <div class="btns">
        <button type="button" id="hint">Picture hint</button>
        <button type="button" id="showme">Show me</button>
        <button type="button" id="learnThis">Learn this one</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("#svg");
  function E(tag, attrs, parent, text) {

    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
  const lcm = (a, b) => a / gcd(a, b) * b;
  const red = (n, d) => { const g = gcd(n, d) || 1; return [n / g, d / g]; };
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // ---------- words ----------
  const ORD = ["", "whole", "half", "third", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth", "tenth", "eleventh", "twelfth"];
  const ORDS = ["", "wholes", "halves", "thirds", "fourths", "fifths", "sixths", "sevenths", "eighths", "ninths", "tenths", "elevenths", "twelfths"];
  function ordinal(d) { const t = d % 100, s = t >= 11 && t <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[d % 10] || "th"); return d + s; }
  const pieceName = (d, k) => d <= 12 ? (k === 1 ? ORD[d] : ORDS[d]) : (k === 1 ? ordinal(d) : ordinal(d) + "s");
  const hf = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
  const hv = ([n, d]) => d === 1 ? `<span class="n">${n}</span>` : hf(n, d);
  const pl = (k, one, many) => k === 1 ? one : many;
  // "10/24 = 5/12" or "8/2 = 4" or "10/3 = 3 1/3", the last part in green
  function hres(N, D) {
    const [n, d] = red(N, D), out = [D === 1 ? `<span class="n">${N}</span>` : hf(N, D)];
    if (d === 1) { if (D !== 1) out.push(`<span class="n">${n}</span>`); }
    else { if (n !== N) out.push(hf(n, d)); if (n > d) out.push(`<span class="n">${Math.floor(n / d)}</span>${hf(n % d, d)}`); }
    out[out.length - 1] = `<b class="A">${out[out.length - 1]}</b>`;
    return out.join(" = ");
  }
  const sf = ([n, d]) => d === 1 ? String(n) : `${n}/${d}`;

  // ---------- equation tokens ----------
  const CH = 0.61, WF = 46, FF = 36;
  const W = (v, c = "") => ({ k: "w", v, c });
  const Fr = (n, d, c = "") => ({ k: "f", n, d, c });
  const Mx = (w, n, d, c = "") => ({ k: "m", w, n, d, c });
  const O = v => ({ k: "o", v });
  const Q = () => ({ k: "q" });
  const val = ([n, d], c) => d === 1 ? W(n, c) : Fr(n, d, c);
  function result(N, D) {
    const [n, d] = red(N, D), out = [O("="), D === 1 ? W(N) : Fr(N, D)];
    if (d === 1) { if (D !== 1) out.push(O("="), W(n)); }
    else { if (n !== N) out.push(O("="), Fr(n, d)); if (n > d) out.push(O("="), Mx(Math.floor(n / d), n % d, d)); }
    out[out.length - 1].c = "A";
    return out;
  }
  const len = x => String(x).length;
  const fracW = (n, d, fs) => Math.max(len(n), len(d)) * fs * CH + 12;
  function tokW(t) {
    if (t.k === "w") return len(t.v) * WF * CH;
    if (t.k === "f") return fracW(t.n, t.d, FF);
    if (t.k === "m") return len(t.w) * WF * CH + 4 + fracW(t.n, t.d, FF);
    if (t.k === "o") return WF * CH;
    return 56;
  }
  function sfrac(g, cx, cy, n, d, c, fs) {
    const w = fracW(n, d, fs) - 4;
    E("text", { x: cx, y: cy - fs * 0.2, class: "tx " + c, "text-anchor": "middle", "font-size": fs }, g, n);
    E("line", { x1: cx - w / 2, x2: cx + w / 2, y1: cy, y2: cy, class: "fbar " + c }, g);
    E("text", { x: cx, y: cy + fs * 0.95, class: "tx " + c, "text-anchor": "middle", "font-size": fs }, g, d);
  }
  function drawEq(toks, cy) {
    const g = E("g", {});
    const gap = 16, total = toks.reduce((s, t) => s + tokW(t), 0) + gap * (toks.length - 1);
    let x = 500 - total / 2;
    for (const t of toks) {
      const w = tokW(t), cx = x + w / 2;
      if (t.k === "w" || t.k === "o") E("text", { x: cx, y: cy + WF * 0.36, class: "tx " + t.c + (t.k === "o" ? " op" : ""), "text-anchor": "middle", "font-size": WF }, g, t.v);
      else if (t.k === "f") sfrac(g, cx, cy, t.n, t.d, t.c, FF);
      else if (t.k === "m") {
        const ww = len(t.w) * WF * CH;
        E("text", { x: x + ww / 2, y: cy + WF * 0.36, class: "tx " + t.c, "text-anchor": "middle", "font-size": WF }, g, t.w);
        sfrac(g, x + ww + 4 + fracW(t.n, t.d, FF) / 2, cy, t.n, t.d, t.c, FF);
      } else {
        E("rect", { x: cx - 26, y: cy - 36, width: 52, height: 72, rx: 8, class: "qbox" }, g);
        E("text", { x: cx, y: cy + 16, class: "tx m", "text-anchor": "middle", "font-size": WF }, g, "?");
      }
      x += w + gap;
    }
    if (total > 970) { const k = 970 / total; g.setAttribute("transform", `translate(500 ${cy}) scale(${k}) translate(-500 ${-cy})`); }
  }
  function drawMean(segs, y) {
    const t = E("text", { x: 500, y, class: "mean", "text-anchor": "middle", "font-size": 28 });
    for (const [s, c] of segs) E("tspan", c ? { class: c } : {}, t, s);
    const chars = segs.reduce((n, [s]) => n + s.length, 0);
    if (chars * 28 * 0.55 > 960) t.setAttribute("font-size", Math.floor(960 / (chars * 0.55)));
  }

  // ---------- animation ----------
  let NOW = 0, ANIM = false;
  function mk(el, s, i = 0, kind = "pop", dt = 90) {
    if (ANIM && s === NOW) { el.classList.add(kind); el.style.animationDelay = (i * dt) + "ms"; }
    return el;
  }
  const lbl = (x, y, text, c = "", fs = 22, parent) => E("text", { x, y, class: "lbl " + c, "font-size": fs, "text-anchor": "middle" }, parent, text);
  function smallFrac(x, cy, [n, d], c, fs = 22) {
    const g = E("g", {});
    if (d === 1) E("text", { x, y: cy + fs * 0.36, class: "tx " + c, "text-anchor": "middle", "font-size": fs * 1.2 }, g, n);
    else sfrac(g, x, cy, n, d, c, fs);
    return g;
  }
  function badge(x, y, n, c = "", r = 14) {
    const g = E("g", {});
    E("circle", { cx: x, cy: y, r, class: "badge " + c }, g);
    E("text", { x, y: y + r * 0.42, class: "btx", "font-size": r * 1.15 }, g, n);
    return g;
  }
  // A bar of w wholes from x0, width BW; numbers 0..w under it.
  function wholesBar(x0, y, BW, h, w, s) {
    const u = BW / w;
    mk(E("rect", { x: x0, y, width: BW, height: h, class: "whole" }), s, 0, "fade");
    for (let i = 1; i < w; i++) mk(E("line", { x1: x0 + i * u, x2: x0 + i * u, y1: y, y2: y + h, class: "wline" }), s, i, "fade");
    for (let i = 0; i <= w; i++) {
      E("line", { x1: x0 + i * u, x2: x0 + i * u, y1: y + h, y2: y + h + 12, class: "tick big" });
      lbl(x0 + i * u, y + h + 38, i, "", 24);
    }

  }
  function pieceLines(x0, y, h, step, count, s, cls = "pline") {
    for (let i = 1; i < count; i++) mk(E("line", { x1: x0 + i * step, x2: x0 + i * step, y1: y, y2: y + h, class: cls }), s, Math.min(i, 30), "fade", 25);
  }
  // Groups of `size` pieces over `total` pieces of width pw, from x0 at y (height h). Returns [full groups, leftover].
  function groups(x0, y, h, pw, total, size, s, badgeY) {
    const G = Math.floor(total / size), r = total % size;
    for (let k = 0; k < G; k++) {
      const x = x0 + k * size * pw, w = size * pw;
      mk(E("rect", { x, y, width: w, height: h, class: "grp " + (k % 2 ? "b" : "a") }), s, k, "pop", 160);

    }
    if (r) {
      const x = x0 + G * size * pw, w = r * pw;
      mk(E("rect", { x, y, width: w, height: h, class: "grp part" }), s, G, "pop", 160);

  }

  // ---------- the six kinds ----------
  // p = { op: "mul"|"div", kind: "wf"|"fw"|"ff", L: [n, d], R: [n, d] }  (a whole number is [n, 1])
  const key = p => p.op + "-" + p.kind;
  const SQ = { x: 130, y: 210, s: 400 };
  const K = {};

  K["mul-wf"] = {
    steps: 4,
    mean: p => [[String(p.L[0]), "L"], [" groups of "], [sf(p.R), "R"]],
    eq(p, s) {
      const [w] = p.L, [n, d] = p.R, base = [W(w, "L"), O("×"), Fr(n, d, "R")];
      if (s >= 3) return base.concat(result(w * n, d));
      if (s >= 1) return base.concat([O("="), Fr(w * n, d)]);
      return base;
    },
    say(p, s) {
      const [w] = p.L, [n, d] = p.R, f = hf(n, d), N = w * n;
      if (s === 0) return `<b class="L">${w}</b> × <b class="R">${f}</b> means <b><span class="cL">${w}</span> groups of <span class="cR">${f}</span></b>. It's the same as adding ${f} ${w} ${pl(w, "time", "times")}: ${w <= 4 ? Array(w).fill(f).join(" + ") : `${f} + ${f} + ${f} + …`}`;
      if (s === 1) return `Count the shaded pieces: ${w} ${pl(w, "group", "groups")} × ${n} = <span class="n">${N}</span> ${pl(N, "piece", "pieces")}. Each piece is one ${ORD[d]}, so that's ${N} ${pieceName(d, N)}: ${hf(N, d)}.`;
      if (s === 2) return `Put the groups end to end on a number line. ${w} jumps of ${f} land on ${hres(N, d).split(" = ").pop()}.`;
      return `So ${w} × ${f} = ${hres(N, d)}. <b>Multiply the whole number by the top.</b> The bottom stays ${d} because the pieces are still ${ORDS[d]}.`;
    },
    limit(p) { const [w] = p.L, [n, d] = p.R; return Math.max(1, Math.ceil(w * n / d)) * d > 72; },
    draw(p, s) {
      const [w] = p.L, [n, d] = p.R;
      const rows = w <= 6 ? 1 : 2, cols = Math.ceil(w / rows), gw = 920 / cols;
      const bw = Math.min(gw - 26, 200), bh = 34, cw = bw / d;
      let count = 0;
      for (let i = 0; i < w; i++) {
        const r = Math.floor(i / cols), c = i % cols, cx = 40 + gw * (c + 0.5), y = 182 + r * 92;
        const g = mk(E("g", {}), 0, i, "pop", 110);
        E("rect", { x: cx - bw / 2 - 9, y, width: bw + 18, height: 76, rx: 10, class: "gbox" }, g);
        for (let j = 0; j < d; j++) E("rect", { x: cx - bw / 2 + j * cw, y: y + 30, width: cw, height: bh, class: "cell" + (j < n ? " R" : "") }, g);
        E("text", { x: cx - bw / 2, y: y + 21, class: "lbl L", "font-size": 16, "text-anchor": "start" }, g, "group " + (i + 1));
        if (s >= 1) for (let j = 0; j < n; j++) {
          count++;
          if (cw >= 17) mk(lbl(cx - bw / 2 + (j + 0.5) * cw, y + 30 + bh / 2 + 7, count, "", cw >= 26 ? 19 : 14), 1, count - 1, "pop", 60);
        }
      }
      if (s >= 2) {
        const M = Math.max(1, Math.ceil(w * n / d)), x0 = 60, x1 = 940, U = (x1 - x0) / M, y = 560;
        const X = v => x0 + v * U;
        mk(E("line", { x1: x0 - 10, x2: x1 + 10, y1: y, y2: y, class: "nl" }), 2, 0, "fade");
        for (let i = 0; i <= M * d; i++) {
          const big = i % d === 0;
          E("line", { x1: X(i / d), x2: X(i / d), y1: y - (big ? 14 : 8), y2: y + (big ? 14 : 8), class: "tick" + (big ? " big" : "") });
          if (big) lbl(X(i / d), y + 42, i / d, "", 24);
        }

        for (let j = 0; j < w; j++) {
          const a = X(j * n / d), b = a + step;
          mk(E("path", { d: `M${a} ${y} Q${(a + b) / 2} ${y - hgt * 2} ${b} ${y}`, class: "jump", pathLength: 1 }), 2, j, "draw", 220);
          if (step >= 26) mk(lbl((a + b) / 2, y - hgt - 10, j + 1, "R", 18), 2, j, "pop", 220);
        }

    },
  };

  K["mul-fw"] = {
    steps: 4,
    mean: p => [[sf(p.L), "L"], [" of "], [String(p.R[0]), "R"]],
    eq(p, s) {
      const [n, d] = p.L, [w] = p.R, base = [Fr(n, d, "L"), O("×"), W(w, "R")];
      return s >= 3 ? base.concat(result(n * w, d)) : base;
    },
    say(p, s) {
      const [n, d] = p.L, [w] = p.R, f = hf(n, d);
      if (s === 0) return `<b class="L">${f}</b> × <b class="R">${w}</b> means <b><span class="cL">${f}</span> of <span class="cR">${w}</span></b>. Start with ${w} ${pl(w, "whole", "wholes")}.`;
      if (s === 1) return `The bottom number, <b class="L">${d}</b>, says cut the ${w} into ${d} equal parts. Cut every whole into ${ORDS[d] || d + " pieces"}: ${w} × ${d} = ${w * d} pieces, so each part gets ${w} ${pl(w, ORD[d], ORDS[d])}. Each part is ${hv(red(w, d))}.`;

    },
    limit(p) { return p.R[0] * p.L[1] > 72; },
    draw(p, s) {
      const [n, d] = p.L, [w] = p.R, x0 = 50, BW = 900, y = 300, h = 90;
      const u = wholesBar(x0, y, BW, h, w, 0), pw = u / d, part = BW / d;

        pieceLines(x0, y, h, pw, w * d, 1);
        for (let k = 1; k < d; k++) mk(E("line", { x1: x0 + k * part, x2: x0 + k * part, y1: y - 22, y2: y + h + 6, class: "cut" }), 1, k, "pop", 150);
        for (let k = 0; k < d; k++) {
          const a = x0 + k * part + 4, b = x0 + (k + 1) * part - 4;
          mk(E("path", { d: `M${a} ${y - 8} V${y - 22} H${b} V${y - 8}`, class: "brk" }), 1, k, "fade", 150);
          if (part >= 44) mk(smallFrac((a + b) / 2, y - 62, red(w, d), "L", 20), 1, k, "pop", 150);
        }
      }
      if (s >= 2) for (let k = 0; k < n; k++) mk(badge(x0 + (k + 0.5) * part, y + h / 2, k + 1, "", 18), 2, k, "pop", 200);
      if (s >= 3) {
        mk(E("path", { d: `M${x0} ${y + h + 60} V${y + h + 74} H${x0 + n * part} V${y + h + 60}`, class: "brk A" }), 3, 0, "fade");

    },
  };

  K["mul-ff"] = {
    steps: 5,
    mean: p => [[sf(p.L), "L"], [" of "], [sf(p.R), "R"]],
    eq(p, s) {
      const [a, b] = p.L, [c, d] = p.R, base = [Fr(a, b, "L"), O("×"), Fr(c, d, "R")];
      if (s < 3) return base;
      const mid = [O("="), Fr(`${a}×${c}`, `${b}×${d}`)];
      if (s === 3) return base.concat(mid, [O("="), Fr(a * c, b * d)]);
      return base.concat(mid, result(a * c, b * d));
    },
    say(p, s) {
      const [a, b] = p.L, [c, d] = p.R, f1 = hf(a, b), f2 = hf(c, d), N = a * c, D = b * d;
      if (s === 0) return `<b class="L">${f1}</b> × <b class="R">${f2}</b> means <b><span class="cL">${f1}</span> of <span class="cR">${f2}</span></b>. Start with one whole.`;
      if (s === 1) return `Show <b class="R">${f2}</b>: cut the whole into ${d} columns and shade ${c}.`;
      if (s === 2) return `Now take <b class="L">${f1}</b> <i>of the shaded part</i>: cut it into ${b} rows and keep ${a}.`;
      if (s === 3) return `Count. You kept ${a} × ${c} = <span class="n">${N}</span> ${pl(N, "piece", "pieces")}. The whole is now cut into ${b} × ${d} = <span class="n">${D}</span> pieces. So ${f1} × ${f2} = ${hf(N, D)}.`;
      const [rn, rd] = red(N, D);
      let t = rn !== N ? `${hf(N, D)} simplifies to <b class="A">${hv([rn, rd])}</b>.` : `${hf(N, D)} is already in simplest form.`;
      t += ` <b>Shortcut: top × top, bottom × bottom.</b>`;
      const g1 = gcd(a, d), g2 = gcd(c, b);
      if (g1 > 1 || g2 > 1) t += ` You can also simplify first: ${g1 > 1 ? `${a} and ${d} share ${g1}` : ""}${g1 > 1 && g2 > 1 ? ", " : ""}${g2 > 1 ? `${c} and ${b} share ${g2}` : ""}.`;
      t += ` Part of a part is smaller than both fractions.`;
      return t;
    },
    limit: () => false,
    draw(p, s) {
      const [a, b] = p.L, [c, d] = p.R, { x, y, s: S } = SQ, cw = S / d, ch = S / b;
      mk(E("rect", { x, y, width: S, height: S, class: "whole" }), 0, 0, "fade");
      if (s === 0) mk(lbl(x + S / 2, y + S / 2 + 10, "1 whole", "m", 30), 0, 0, "fade");
      if (s >= 1) {
        mk(E("rect", { x, y, width: c * cw, height: S, class: "shadeR" }), 1, 0, "fade");
        for (let i = 1; i < d; i++) mk(E("line", { x1: x + i * cw, x2: x + i * cw, y1: y, y2: y + S, class: "wline" }), 1, i, "fade", 60);
        mk(E("path", { d: `M${x + 3} ${y - 6} V${y - 18} H${x + c * cw - 3} V${y - 6}`, class: "brk R" }), 1, 0, "fade");
        mk(lbl(x + c * cw / 2, y - 26, sf(p.R), "R", 24), 1, 0, "pop");
      }
      if (s >= 2) {
        for (let i = 1; i < b; i++) mk(E("line", { x1: x, x2: x + S, y1: y + i * ch, y2: y + i * ch, class: "rowline" }), 2, i, "fade", 80);
        mk(E("rect", { x, y, width: c * cw, height: a * ch, class: "take" }), 2, 0, "pop");
        mk(E("path", { d: `M${x - 6} ${y + 3} H${x - 18} V${y + a * ch - 3} H${x - 6}`, class: "brk" }), 2, 0, "fade");
        mk(E("text", { x: x - 26, y: y + a * ch / 2 + 8, class: "lbl L", "font-size": 24, "text-anchor": "end" }, svg, sf(p.L)), 2, 0, "pop");
        E("rect", { x, y, width: S, height: S, class: "whole", style: "fill: none" });
      }
      if (s >= 3) {
        let k = 0;
        if (Math.min(cw, ch) >= 24) for (let r = 0; r < a; r++) for (let q = 0; q < c; q++) mk(lbl(x + (q + 0.5) * cw, y + (r + 0.5) * ch + 7, ++k, "", Math.min(22, cw * 0.5, ch * 0.6)), 3, k, "pop", 50);
        const X = 600;
        mk(lbl(X, 300, "kept:", "m", 24), 3, 0, "fade").setAttribute("text-anchor", "start");
        mk(lbl(X, 340, `${a} × ${c} = ${a * c} pieces`, "A", 28), 3, 1, "fade", 250).setAttribute("text-anchor", "start");
        mk(lbl(X, 400, "whole:", "m", 24), 3, 2, "fade", 250).setAttribute("text-anchor", "start");
        mk(lbl(X, 440, `${b} × ${d} = ${b * d} pieces`, "", 28), 3, 3, "fade", 250).setAttribute("text-anchor", "start");
      }
    },
  };

  K["div-wf"] = {
    steps: 5,
    mean: p => [["How many groups of "], [sf(p.R), "R"], [" fit in "], [String(p.L[0]), "L"], ["?"]],
    eq(p, s) {
      const [w] = p.L, [n, d] = p.R, base = [W(w, "L"), O("÷"), Fr(n, d, "R")];
      if (s === 3) return base.concat(result(w * d, n));
      if (s >= 4) return base.concat([O("="), W(w, "L"), O("×"), Fr(d, n, "R")], result(w * d, n));
      return base;
    },
    say(p, s) {
      const [w] = p.L, [n, d] = p.R, f = hf(n, d), T = w * d, G = Math.floor(T / n), r = T % n;
      if (s === 0) return `<b class="L">${w}</b> ÷ <b class="R">${f}</b> asks: <b>how many groups of <span class="cR">${f}</span> fit in <span class="cL">${w}</span>?</b>`;
      if (s === 1) return `Cut each whole into ${ORDS[d]}. ${w} ${pl(w, "whole makes", "wholes make")} ${w} × ${d} = <span class="n">${T}</span> ${pieceName(d, T)}.`;
      if (s === 2) return `One group of ${f} is ${n} ${pieceName(d, n)}. Make groups of ${n}.`;
      if (s === 3) return `${T} ÷ ${n} = <span class="n">${G}</span> ${pl(G, "group", "groups")}${r ? `, with ${r} ${pieceName(d, r)} left over. The leftover is ${hf(r, n)} of a group` : ""}. So ${w} ÷ ${f} = ${hres(T, n)}.`;
      return `<b>Shortcut: dividing by ${f} is the same as multiplying by its flip, ${hf(d, n)}.</b> ${w} × ${hf(d, n)} = ${hres(T, n)}. The × ${d} cuts the wholes into ${ORDS[d]}, and the ÷ ${n} makes the groups.`;
    },
    limit(p) { return p.L[0] * p.R[1] > 72; },
    draw(p, s) {
      const [w] = p.L, [n, d] = p.R, x0 = 50, BW = 900, y = 340, h = 80;
      const u = wholesBar(x0, y, BW, h, w, 0), pw = u / d;
      // the size of one group, above the bar
      const gx = x0, gy = 205, gW = n * pw;
      mk(E("rect", { x: gx, y: gy, width: gW, height: 46, class: "grp a" }), 0, 1, "pop", 200);
      for (let i = 1; i < n; i++) E("line", { x1: gx + i * pw, x2: gx + i * pw, y1: gy, y2: gy + 46, class: "pline" });
      mk(E("text", { x: gx + gW + 14, y: gy + 32, class: "wlbl", "font-size": 24 }, svg, "one group = " + sf(p.R)), 0, 1, "pop", 200);
      if (s >= 1) pieceLines(x0, y, h, pw, w * d, 1);
      if (s >= 2) groups(x0, y, h, pw, w * d, n, 2, y - 26);
      if (s >= 1) mk(E("text", { x: 950, y: y + h + 80, class: "wlbl", "font-size": 22, "text-anchor": "end" }, svg, `${w * d} ${pieceName(d, w * d)}`), 1, 0, "fade");
    },
  };

  K["div-fw"] = {
    steps: 4,
    mean: p => [["Share "], [sf(p.L), "L"], [" equally into "], [String(p.R[0]), "R"], [" groups. How much is in one group?"]],
    eq(p, s) {
      const [n, d] = p.L, [w] = p.R, base = [Fr(n, d, "L"), O("÷"), W(w, "R")];
      return s >= 3 ? base.concat([O("="), Fr(n, d, "L"), O("×"), Fr(1, w, "R")], result(n, d * w)) : base;
    },
    say(p, s) {
      const [n, d] = p.L, [w] = p.R, f = hf(n, d), T = w * d;
      if (s === 0) return `<b class="L">${f}</b> ÷ <b class="R">${w}</b> asks: <b>share <span class="cL">${f}</span> equally into <span class="cR">${w}</span> groups. How much is in one group?</b>`;
      if (s === 1) return `Cut the whole into ${w} rows. The shaded part splits into ${w} equal shares.`;
      if (s === 2) return `One share is ${n} small ${pl(n, "piece", "pieces")}. The whole has ${w} × ${d} = <span class="n">${T}</span> small pieces, so each piece is ${hf(1, T)}.`;
      return `So ${f} ÷ ${w} = ${hres(n, T)}. <b>Sharing into ${w} groups is the same as taking ${hf(1, w)} of it:</b> ${f} × ${hf(1, w)} = ${hres(n, T)}. Each share is smaller than what you started with.`;
    },
    limit: () => false,
    draw(p, s) {
      const [n, d] = p.L, [w] = p.R, { x, y, s: S } = SQ, cw = S / d, ch = S / w;
      mk(E("rect", { x, y, width: S, height: S, class: "whole" }), 0, 0, "fade");
      mk(E("rect", { x, y, width: n * cw, height: S, class: "shadeL" }), 0, 1, "fade", 200);
      for (let i = 1; i < d; i++) mk(E("line", { x1: x + i * cw, x2: x + i * cw, y1: y, y2: y + S, class: "wline" }), 0, 1, "fade", 200);
      mk(E("path", { d: `M${x + 3} ${y - 6} V${y - 18} H${x + n * cw - 3} V${y - 6}`, class: "brk" }), 0, 2, "fade", 200);
      mk(lbl(x + n * cw / 2, y - 26, sf(p.L), "L", 24), 0, 2, "pop", 200);
      if (s >= 1) {
        for (let i = 1; i < w; i++) mk(E("line", { x1: x, x2: x + S, y1: y + i * ch, y2: y + i * ch, class: "rowline R" }), 1, i, "fade", 120);
        for (let i = 0; i < w; i++) {
          mk(E("rect", { x: x + 4, y: y + i * ch + 4, width: n * cw - 8, height: ch - 8, rx: 6, class: "part" }), 1, i, "pop", 120);
          if (ch >= 26) mk(E("text", { x: x + S + 14, y: y + (i + 0.5) * ch + 8, class: "lbl R", "font-size": Math.min(22, ch * 0.6), "text-anchor": "start" }, svg, "share " + (i + 1)), 1, i, "pop", 120);
        }
      }
      if (s >= 2) {
        mk(E("rect", { x, y, width: n * cw, height: ch, class: "take" }), 2, 0, "pop");
        if (Math.min(cw, ch) >= 24) for (let q = 0; q < n; q++) mk(lbl(x + (q + 0.5) * cw, y + ch / 2 + 7, q + 1, "", Math.min(22, cw * 0.5, ch * 0.6)), 2, q, "pop", 80);
        const X = 670;
        mk(lbl(X, 300, "one share:", "m", 24), 2, 0, "fade").setAttribute("text-anchor", "start");
        mk(lbl(X, 340, `${n} ${pl(n, "piece", "pieces")}`, "A", 28), 2, 1, "fade", 250).setAttribute("text-anchor", "start");
        mk(lbl(X, 400, "whole:", "m", 24), 2, 2, "fade", 250).setAttribute("text-anchor", "start");
        mk(lbl(X, 440, `${w} × ${d} = ${w * d} pieces`, "", 28), 2, 3, "fade", 250).setAttribute("text-anchor", "start");
      }
    },
  };

  K["div-ff"] = {
    steps: 5,
    mean: p => [["How many groups of "], [sf(p.R), "R"], [" fit in "], [sf(p.L), "L"], ["?"]],
    eq(p, s) {
      const [a, b] = p.L, [c, d] = p.R, base = [Fr(a, b, "L"), O("÷"), Fr(c, d, "R")];
      const m = lcm(b, d), A = a * m / b, C = c * m / d, common = [O("="), Fr(A, m, "L"), O("÷"), Fr(C, m, "R")];
      if (s === 1 || s === 2) return base.concat(common);
      if (s === 3) return base.concat(common, [O("="), W(A, "L"), O("÷"), W(C, "R")], result(A, C).slice(C === 1 ? 2 : 0));
      if (s >= 4) return base.concat([O("="), Fr(a, b, "L"), O("×"), Fr(d, c, "R")], result(a * d, b * c));
      return base;
    },
    say(p, s) {
      const [a, b] = p.L, [c, d] = p.R, f1 = hf(a, b), f2 = hf(c, d), m = lcm(b, d), A = a * m / b, C = c * m / d, G = Math.floor(A / C), r = A % C;
      if (s === 0) return `<b class="L">${f1}</b> ÷ <b class="R">${f2}</b> asks: <b>how many groups of <span class="cR">${f2}</span> fit in <span class="cL">${f1}</span>?</b>`;
      if (s === 1) return b === d ? `Both fractions are already in ${ORDS[b]}, the same size pieces.` : `Cut both wholes into the same size pieces: ${pieceName(m, 2)}. ${f1} = ${hf(A, m)} and ${f2} = ${hf(C, m)}.`;
      if (s === 2) return `One group is ${C} ${pl(C, "piece", "pieces")}. See how many groups of ${C} fit in ${A} ${pl(A, "piece", "pieces")}.`;
      if (s === 3) {
        if (G === 0) return `Not even one full group fits. ${A} of the ${C} pieces fill ${hf(A, C)} of a group. So ${f1} ÷ ${f2} = ${hres(A, C)}.`;
        return `${A} ÷ ${C} = <span class="n">${G}</span> ${pl(G, "group", "groups")}${r ? `, with ${r} ${pl(r, "piece", "pieces")} left over. The leftover is ${hf(r, C)} of a group` : ""}. So ${f1} ÷ ${f2} = ${hres(A, C)}.`;
      }
      return `<b>Shortcut: keep the first fraction, change ÷ to ×, flip the second.</b> ${f1} × ${hf(d, c)} = ${hres(a * d, b * c)}. Same answer as counting groups.`;
    },
    limit(p) { return lcm(p.L[1], p.R[1]) > 48; },
    draw(p, s) {
      const [a, b] = p.L, [c, d] = p.R, m = lcm(b, d), A = a * m / b, C = c * m / d;
      const x0 = 50, BW = 900, y1 = 225, y2 = 470, h = 70, pw = BW / m;
      mk(E("text", { x: x0, y: y1 - 14, class: "lbl L", "font-size": 26, "text-anchor": "start" }, svg, sf(p.L)), 0, 0, "fade");
      mk(E("rect", { x: x0, y: y1, width: BW, height: h, class: "whole" }), 0, 0, "fade");
      mk(E("rect", { x: x0, y: y1, width: a * BW / b, height: h, class: "shadeL" }), 0, 0, "fade");
      for (let i = 1; i < b; i++) E("line", { x1: x0 + i * BW / b, x2: x0 + i * BW / b, y1: y1, y2: y1 + h, class: "wline" });
      mk(E("text", { x: x0, y: y2 - 14, class: "wlbl", "font-size": 24 }, svg, "one group = " + sf(p.R)), 0, 1, "fade", 200);
      mk(E("rect", { x: x0, y: y2, width: BW, height: h, class: "whole" }), 0, 1, "fade", 200);
      mk(E("rect", { x: x0, y: y2, width: c * BW / d, height: h, class: "shadeR" }), 0, 1, "fade", 200);
      for (let i = 1; i < d; i++) E("line", { x1: x0 + i * BW / d, x2: x0 + i * BW / d, y1: y2, y2: y2 + h, class: "wline" });
      for (const yy of [y1, y2]) { lbl(x0, yy + h + 30, 0, "m", 20); lbl(x0 + BW, yy + h + 30, 1, "m", 20); }
      if (s >= 1 && b !== d) {
        pieceLines(x0, y1, h, pw, m, 1); pieceLines(x0, y2, h, pw, m, 1);
      }
      if (s >= 2) groups(x0, y1, h, pw, A, C, 2, y1 + h + 30);
    },
  };

  // ---------- state ----------
  const KIND_NAMES = {
    mul: { wf: "Whole × fraction", fw: "Fraction × whole", ff: "Fraction × fraction" },
    div: { wf: "Whole ÷ fraction", fw: "Fraction ÷ whole", ff: "Fraction ÷ fraction" },
  };
  const DEF = {
    "mul-wf": [[8, 1], [1, 2]], "mul-fw": [[1, 2], [8, 1]], "mul-ff": [[2, 3], [5, 8]],
    "div-wf": [[6, 1], [3, 4]], "div-fw": [[3, 4], [2, 1]], "div-ff": [[3, 4], [1, 8]],
  };
  let op = "mul", mode = "learn";
  let lp = { op: "mul", kind: "wf", L: [8, 1], R: [1, 2] }, step = 0;
  const S = { kind: "mix", q: null, meaningDone: false, done: false, first: true, right: 0, total: 0, timers: [] };

  function render(p, s, opts = {}) {
    svg.textContent = "";
    const k = K[key(p)];
    NOW = s; ANIM = !!opts.anim;
    drawEq(opts.question ? [...k.eq(p, 0), O("="), Q()] : k.eq(p, s), 62);
    if (opts.hideMean) E("text", { x: 500, y: 150, class: "mean", "text-anchor": "middle", "font-size": 26, style: "fill: var(--muted)" }, svg, "What does it mean?");
    else drawMean(k.mean(p), 150);
    k.draw(p, s);
  }

  // ---------- learn ----------
  function kindsButtons(el, withMix, cur, data) {
    const names = KIND_NAMES[op];
    el.innerHTML = Object.keys(names).map(k => `<button type="button" data-${data}="${k}" class="${k === cur ? "on" : ""}">${names[k]}</button>`).join("")
      + (withMix ? `<button type="button" data-${data}="mix" class="${cur === "mix" ? "on" : ""}">Mixed</button>` : "");
  }
  function operandHTML(v, side) {
    return v[1] === 1 && isWhole(side)
      ? `<input class="${side}" data-side="${side}" data-part="0" type="text" inputmode="numeric" autocomplete="off" aria-label="Whole number" value="${v[0]}">`
      : `<span class="stack"><input class="${side}" data-side="${side}" data-part="0" type="text" inputmode="numeric" autocomplete="off" aria-label="Numerator" value="${v[0]}"><hr><input class="${side}" data-side="${side}" data-part="1" type="text" inputmode="numeric" autocomplete="off" aria-label="Denominator" value="${v[1]}"></span>`;
  }
  const isWhole = side => (side === "L" && lp.kind === "wf") || (side === "R" && lp.kind === "fw");
  function buildEditor() {
    $("#editor").innerHTML = operandHTML(lp.L, "L") + `<span class="op">${lp.op === "mul" ? "×" : "÷"}</span>` + operandHTML(lp.R, "R");
    $("#swap").hidden = !(lp.op === "mul" && lp.kind !== "ff");
    $("#err").hidden = true;
  }
  function readEditor() {
    const v = { L: [...lp.L], R: [...lp.R] }, bad = [];
    document.querySelectorAll("#editor input").forEach(inp => {
      const n = Number(inp.value.trim()), side = inp.dataset.side, part = +inp.dataset.part;
      inp.classList.remove("bad");
      if (!/^\d+$/.test(inp.value.trim())) bad.push([inp, "Type a whole number in each box."]);
      else v[side][part] = n;
    });
    let msg = bad.length ? bad[0][1] : null;
    if (!msg) for (const side of ["L", "R"]) {
      const [n, d] = v[side], ins = document.querySelectorAll(`#editor input[data-side="${side}"]`);
      if (isWhole(side)) { if (n < 1 || n > 12) { msg = "Use whole numbers from 1 to 12."; bad.push([ins[0]]); } }
      else if (d < 2 || d > 12) { msg = "Use a bottom number from 2 to 12."; bad.push([ins[1]]); }
      else if (n < 1 || n >= d) { msg = "Make the top number smaller than the bottom (a fraction less than 1)."; bad.push([ins[0]]); }
    }
    const np = { ...lp, L: v.L, R: v.R };
    if (!msg && K[key(np)].limit(np)) msg = "That makes too many pieces to draw. Try smaller numbers.";
    bad.forEach(([i]) => i.classList.add("bad"));
    $("#err").textContent = msg || ""; $("#err").hidden = !msg;
    if (!msg) { lp = np; step = 0; showLearn(true); }
  }
  function showLearn(anim) {
    const k = K[key(lp)];
    render(lp, step, { anim });
    $("#steplbl").textContent = `Step ${step + 1} of ${k.steps}`;
    $("#say").innerHTML = k.say(lp, step);
    $("#next").disabled = step >= k.steps - 1;
    $("#back").disabled = step === 0;
  }
  function setLearnKind(kind, keepNumbers) {
    if (!keepNumbers) { const d = DEF[op + "-" + kind]; lp = { op, kind, L: [...d[0]], R: [...d[1]] }; }
    step = 0;
    kindsButtons($("#kinds"), false, lp.kind, "kind");
    buildEditor(); showLearn(true);
  }
  $("#kinds").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setLearnKind(b.dataset.kind); });
  $("#editor").addEventListener("input", readEditor);
  $("#next").onclick = () => { if (step < K[key(lp)].steps - 1) { step++; showLearn(true); } };
  $("#back").onclick = () => { if (step > 0) { step--; showLearn(false); } };
  $("#again").onclick = () => { step = 0; showLearn(true); };
  $("#rand").onclick = () => { const q = gen(op, lp.kind, lp); lp = q; step = 0; buildEditor(); showLearn(true); };
  $("#swap").onclick = () => { lp = { op: "mul", kind: lp.kind === "wf" ? "fw" : "wf", L: lp.R, R: lp.L }; step = 0; kindsButtons($("#kinds"), false, lp.kind, "kind"); buildEditor(); showLearn(true); };
  addEventListener("keydown", e => {
    if (mode !== "learn" || e.target.closest("input")) return;
    if (e.key === "ArrowRight") { $("#next").click(); e.preventDefault(); }
    if (e.key === "ArrowLeft") { $("#back").click(); e.preventDefault(); }
  });

  // ---------- questions ----------
  function gen(o, kind, avoid) {
    for (let t = 0; t < 300; t++) {
      let L, R;
      if (kind === "wf") {
        const d = pick([2, 3, 4, 5, 6, 8, 10]), f = red(ri(1, d - 1), d), w = ri(2, o === "mul" ? 9 : 6);
        L = [w, 1]; R = f;
      } else if (kind === "fw") {
        const d = pick([2, 3, 4, 5, 6, 8]), f = red(ri(1, d - 1), d);
        let w = o === "mul" ? ri(2, 12) : ri(2, 5);
        if (o === "mul" && Math.random() < 0.6) w = f[1] * ri(1, Math.max(1, Math.floor(12 / f[1])));
        L = f; R = [w, 1];
      } else {
        const b = ri(2, 9), d = ri(2, 9);
        L = red(ri(1, b - 1), b); R = red(ri(1, d - 1), d);
        if (o === "div" && sf(L) === sf(R)) continue;
      }
      if (kind === "fw" && R[0] < 2) continue;
      const p = { op: o, kind, L, R };
      if (K[key(p)].limit(p)) continue;
      if (kind === "wf" && o === "div" && p.L[0] * p.R[1] > 40) continue;
      if (kind === "fw" && o === "mul" && p.R[0] * p.L[1] > 48) continue;
      if (avoid && sf(avoid.L) === sf(L) && sf(avoid.R) === sf(R) && avoid.kind === kind) continue;
      return p;
    }
    const d = DEF[o + "-" + kind];
    return { op: o, kind, L: [...d[0]], R: [...d[1]] };
  }
  const answer = p => p.op === "mul" ? red(p.L[0] * p.R[0], p.L[1] * p.R[1]) : red(p.L[0] * p.R[1], p.L[1] * p.R[0]);
  const same = (x, y) => x[0] * y[1] === y[0] * x[1];

  function meanings(p) {
    const L = hv(p.L), R = hv(p.R), times = "That's multiplying. ÷ asks how many groups fit, or how much is in each share.",
      divd = "That's dividing. × means groups of, or of.", add = "That's adding, not multiplying.",
      back = "Backwards. Start with the first number.";
    const o = {
      "mul-wf": [[`${L} groups of ${R}`, 1], [`How many groups of ${R} fit in ${L}?`, 0, divd], [`${L} and ${R} more`, 0, add]],
      "mul-fw": [[`${L} of ${R}`, 1], [`Share ${L} into ${R} groups`, 0, divd], [`${R} and ${L} more`, 0, add]],
      "mul-ff": [[`${L} of ${R}`, 1], [`How many groups of ${R} fit in ${L}?`, 0, divd], [`${L} and ${R} more`, 0, add]],
      "div-wf": [[`How many groups of ${R} fit in ${L}?`, 1], [`${L} groups of ${R}`, 0, times], [`How many groups of ${L} fit in ${R}?`, 0, back]],
      "div-fw": [[`Share ${L} equally into ${R} groups`, 1], [`${R} groups of ${L}`, 0, times], [`How many groups of ${L} fit in ${R}?`, 0, back]],
      "div-ff": [[`How many groups of ${R} fit in ${L}?`, 1], [`How many groups of ${L} fit in ${R}?`, 0, back], [`${L} of ${R}`, 0, times]],
    }[key(p)];
    return o.sort(() => Math.random() - 0.5);
  }

  function clearTimers() { S.timers.forEach(clearTimeout); S.timers = []; }
  function play(from, to, question) {
    clearTimers();
    const k = K[key(S.q)];
    let t = 0;
    for (let s = from; s <= to; s++) {
      S.timers.push(setTimeout(() => {
        render(S.q, s, { anim: true, question: question || s < k.steps - 1 });
        if (!question) $("#psay").innerHTML = k.say(S.q, s);
      }, t));
      t += 1500 + (S.q.kind === "wf" && S.q.op === "mul" && s === 2 ? S.q.L[0] * 220 : 0);
    }
  }
  function newQuestion() {
    clearTimers();
    const kind = S.kind === "mix" ? pick(["wf", "fw", "ff"]) : S.kind;
    S.q = gen(op, kind, S.q);
    S.first = true; S.done = false;
    S.meaningDone = !$("#askMean").checked;
    const opts = meanings(S.q);
    $("#opts").innerHTML = opts.map((m, i) => `<button type="button" data-i="${i}">${m[0]}</button>`).join("");
    $("#opts").__opts = opts;
    $("#meanFb").textContent = ""; $("#meanFb").className = "fb";
    $("#meanCard").hidden = S.meaningDone;
    ["aw", "an", "ad"].forEach(id => { const i = $("#" + id); i.value = ""; i.className = ""; i.disabled = false; });
    $("#ansFb").textContent = ""; $("#ansFb").className = "fb"; $("#psay").innerHTML = "";
    $("#ansCard").style.opacity = S.meaningDone ? 1 : 0.45;
    $("#check").disabled = !S.meaningDone;
    render(S.q, 0, { anim: true, question: true, hideMean: !S.meaningDone });
  }
  $("#opts").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || S.meaningDone) return;
    const m = $("#opts").__opts[+b.dataset.i];
    if (m[1]) {
      b.classList.add("right"); S.meaningDone = true;
      $("#meanFb").textContent = "Yes!"; $("#meanFb").className = "fb ok";
      $("#ansCard").style.opacity = 1; $("#meanCard").hidden = true; $("#check").disabled = false;
      render(S.q, 0, { question: true });
      setTimeout(() => $("#an").focus(), 50);
    } else {
      b.classList.add("wrong"); $("#meanFb").textContent = m[2]; $("#meanFb").className = "fb no";
    }
  });
  function finish(ok) {
    S.done = true;
    if (S.first) { S.total++; if (ok) S.right++; }
    S.first = false;
    $("#right").textContent = S.right; $("#total").textContent = S.total;
    $("#check").disabled = true;
    play(0, K[key(S.q)].steps - 1, false);
  }
  function check() {
    if (S.done || !S.meaningDone) return;
    const fb = $("#ansFb"), wv = $("#aw").value.trim(), nv = $("#an").value.trim(), dv = $("#ad").value.trim();
    const say = (t, c) => { fb.innerHTML = t; fb.className = "fb " + c; };
    ["aw", "an", "ad"].forEach(id => $("#" + id).className = "");
    if (![wv, nv, dv].every(v => v === "" || /^\d+$/.test(v)) || (wv === "" && nv === "")) return say("Type your answer as numbers.", "no");
    if ((nv === "") !== (dv === "")) return say(nv === "" ? "Fill in the top number too." : "Fill in the bottom number too.", "no");
    if (dv === "0") return say("The bottom number can't be 0.", "no");
    const w = wv === "" ? 0 : +wv, n = nv === "" ? 0 : +nv, d = dv === "" ? 1 : +dv;
    const v = [w * d + n, d], ans = answer(S.q), p = S.q;
    if (same(v, ans)) {
      const simple = (wv === "" || n < d) && gcd(n || 1, d) === 1 && !(wv !== "" && n === 0 && d !== 1);
      if (!simple) { if (S.first) { S.total++; S.right++; S.first = false; $("#right").textContent = S.right; $("#total").textContent = S.total; }
        return say(wv !== "" && n >= d ? "Right amount! The fraction part should be less than 1." : `Right amount! Now simplify it: ${n} and ${d} share ${gcd(n, d)}.`, "mid"); }
      ["aw", "an", "ad"].forEach(id => $("#" + id).classList.add("ok"));
      say(`Correct! ${sf(p.L)} ${p.op === "mul" ? "×" : "÷"} ${sf(p.R)} = ${hres(ans[0], ans[1]).replace(/<b class="A">|<\/b>/g, "")}`, "ok");
      finish(true);
      return;
    }
    // hints for common mistakes
    const L = p.L, R = p.R, prod = red(L[0] * R[0], L[1] * R[1]), quot = red(L[0] * R[1], L[1] * R[0]);
    let hint = "Not yet. Try Show the picture.";
    const sum = red(L[0] * R[1] + R[0] * L[1], L[1] * R[1]);
    if (same(v, sum)) hint = "That's adding. " + (p.op === "mul" ? "× means groups of, or of." : "÷ asks how many groups fit.");
    else if (p.op === "mul" && same(v, quot)) hint = "That's dividing. For ×, multiply straight across: top × top, bottom × bottom.";
    else if (p.op === "div" && same(v, prod)) hint = "That's multiplying. Flip the second number first, then multiply.";
    else if (p.op === "div" && same(v, red(R[0] * L[1], R[1] * L[0]))) hint = "Backwards. Keep the first number, flip the second.";
    else if (p.op === "mul" && p.kind !== "ff") {
      const wh = p.kind === "wf" ? L[0] : R[0], f = p.kind === "wf" ? R : L;
      if (same(v, [f[0], f[1]])) hint = "Only the top gets multiplied by " + wh + ".";
      else if (same(v, [f[0], f[1] * wh])) hint = `Multiplying by ${wh} makes it bigger. Multiply the top, not the bottom.`;
    } else if (p.op === "div" && p.kind === "fw" && same(v, [L[0] * R[0], L[1]])) hint = `Sharing into ${R[0]} groups makes each share smaller. Multiply the bottom by ${R[0]}.`;
    if (S.first) { S.first = false; S.total++; $("#total").textContent = S.total; }
    $("#an").classList.add("bad"); $("#ad").classList.add("bad"); if (wv) $("#aw").classList.add("bad");
    say(hint, "no");
  }
  $("#check").onclick = check;
  ["aw", "an", "ad"].forEach(id => $("#" + id).addEventListener("keydown", e => { if (e.key === "Enter") check(); }));
  $("#newq").onclick = newQuestion;
  $("#hint").onclick = () => {
    if (S.done) return;
    if (!S.meaningDone) { S.meaningDone = true; $("#opts").querySelectorAll("button").forEach((b, i) => { if ($("#opts").__opts[i][1]) b.classList.add("right"); }); $("#ansCard").style.opacity = 1; $("#meanCard").hidden = true; $("#check").disabled = false; }
    play(0, K[key(S.q)].steps - 2, true);
  };
  $("#showme").onclick = () => {
    if (!S.done) {
      if (S.first) { S.first = false; S.total++; $("#total").textContent = S.total; }
      S.meaningDone = true; $("#opts").querySelectorAll("button").forEach((b, i) => { if ($("#opts").__opts[i][1]) b.classList.add("right"); });
      $("#ansCard").style.opacity = 1; $("#meanCard").hidden = true;
            $("#ansFb").textContent = ""; $("#ansFb").className = "fb";
      S.done = true; $("#check").disabled = true;
    }
    play(0, K[key(S.q)].steps - 1, false);
  };
  $("#learnThis").onclick = () => { clearTimers(); lp = { ...S.q, L: [...S.q.L], R: [...S.q.R] }; setMode("learn", true); };
  $("#askMean").onchange = newQuestion;
  $("#pkinds").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    S.kind = b.dataset.pkind; kindsButtons($("#pkinds"), true, S.kind, "pkind"); newQuestion();
  });

  // ---------- switches ----------
  function setMode(m, keep) {
    mode = m; clearTimers();
    document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
    $("#learn").hidden = m !== "learn"; $("#practice").hidden = m !== "practice";
    if (m === "learn") setLearnKind(keep ? lp.kind : lp.kind, keep || lp.op === op);
    else { kindsButtons($("#pkinds"), true, S.kind, "pkind"); if (!S.q || S.q.op !== op) newQuestion(); else render(S.q, S.done ? K[key(S.q)].steps - 1 : 0, { question: !S.done, hideMean: !S.meaningDone }); }
  }
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
  document.querySelectorAll("[data-op]").forEach(b => b.onclick = () => {
    op = b.dataset.op;
    document.querySelectorAll("[data-op]").forEach(x => x.classList.toggle("on", x === b));
    if (mode === "learn") setLearnKind(lp.kind); else { kindsButtons($("#pkinds"), true, S.kind, "pkind"); newQuestion(); }
  });

  setLearnKind("wf");
})();
</script>

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || SKIP.has(node.tagName) || node.id === "lang-switch") return;
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1 || SKIP.has(node.tagName)) return;
    undoAttrs(node);
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
