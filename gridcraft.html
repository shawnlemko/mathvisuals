<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script data-goatcounter="https://shawnlemko.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<title>Blueprinting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Blueprinting: a house and room planner on a blueprint grid (1 unit = 1 m).
   Draw rooms (rectangles) and walls (lines), read side lengths, area (shoelace formula), perimeter and angles,
   add doors and furniture (Indoor) or yard items (Outdoor) from the one toolbar under the plan, then export the plan with its name.
   The grid widens to fill the screen. A small toolbar beside the selected shape turns, flips, copies or deletes it.
   The page always uses the dark blueprint look (Shawn's spec), in light and dark mode alike. */
:root:not(#gc) {
  --paper: #061a33; --sheet: #0a2342; --grid: #1a4170; --grid-major: #2b5a90;
  --ink: #e6f1ff; --muted: #93b4da; --line: #e6f1ff;
  --pt: #22d3ee; --pt-ring: #0a2342; --green: #34d399; --orange: #fbbf24; --pool: #7c9bff;
  --chip: #10325c; --warn: #ff8a9b; color-scheme: dark;
}
.wrap { max-width: 1500px; }
header { margin-bottom: 10px; }
h1 { letter-spacing: 0.01em; font-size: clamp(1.5rem, 2.2vw, 2.1rem); }
@media (min-width: 861px) {
  header { flex-wrap: nowrap; }
  header > div:first-child { flex-wrap: nowrap; flex: none; }
  h1 { white-space: nowrap; }
  header .hud { flex-wrap: nowrap; min-width: 0; }
  header .hud > * { min-width: 0; }
}
h1 em { font-style: normal; color: var(--pt); }

/* Top HUD: cursor position and project totals. */
.hud { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.hud > * { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 3px 10px; display: flex; flex-direction: column; justify-content: center; }
.hud .k { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; line-height: 1.2; }
.hud b { font-family: var(--font-num); font-size: 1.25rem; line-height: 1.25; white-space: nowrap; }
.ptitle input { font: inherit; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; color: var(--ink); background: transparent; border: 0; border-bottom: 2px dashed var(--grid-major); padding: 0 2px; width: 12rem; min-width: 0; }
.ptitle input:focus { outline: none; border-bottom-color: var(--pt); }
.tele { flex-direction: row !important; align-items: center; gap: 6px; font-family: var(--font-num); border-color: var(--pt) !important; }
.tele span { color: var(--muted); font-weight: 700; }
.tele b { color: var(--pt); min-width: 3.2ch; display: inline-block; }
#totC { color: var(--orange); }

/* Work area: tools | blueprint (with the furniture bar under it). */
.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
.stage > .bcol { position: relative; display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: visible; }
.bcol > .board { flex: 1 1 auto; min-height: 0; }
.board { background: var(--sheet); padding: 6px; border-color: var(--grid-major); }
#cad.t-line, #cad.t-rect, #cad.t-poly { cursor: crosshair; }
#cad.t-erase { cursor: not-allowed; }
#cad.t-erase .sh:hover > * { stroke: #ff6b81 !important; }
#cad.t-select .sh { cursor: move; }
#cad .handle { cursor: grab; }
#cad .resize { cursor: nwse-resize; }
/* Furniture can be stretched, so its lines keep one thickness whatever its size. */
#cad .sh * { vector-effect: non-scaling-stroke; }
#cad .dash { stroke-dasharray: 6 4; }
#cad .cut { stroke-width: 8px; }
.fitems .dash { stroke-dasharray: 0.12 0.08; }
.fitems .cut { stroke-width: 0.2; }

.io { display: flex; gap: 0; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; flex: none; }
.io button { border: 0; border-radius: 0; padding: 6px 12px; background: transparent; font-weight: 800; white-space: nowrap; }
.io button[aria-pressed="true"] { background: var(--green); color: var(--paper); }

/* The one toolbar under the plan: draw, grid, edit and export on top, the item picker below. */
.dock { display: flex; flex-direction: column; gap: 6px; background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 6px 8px; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.tools .sep { width: 1px; align-self: stretch; background: var(--grid-major); margin: 0 4px; }
.tools button { display: flex; align-items: center; gap: 6px; padding: 4px 9px; min-height: 36px; background: transparent; border-color: transparent; line-height: 1.1; font-size: 0.9rem; white-space: nowrap; }
.tools button svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tools button:hover { border-color: var(--pt); }
.tools button[aria-pressed="true"] { background: var(--pt); color: var(--paper); border-color: var(--pt); }
.tools .tog[aria-pressed="true"] { background: var(--chip); color: var(--pt); border-color: var(--pt); }
.tools .exp { border-color: var(--grid-major); font-family: var(--font-num); }
.tools .push { margin-left: auto; }

.hintbar { margin: 0; display: flex; gap: 14px; align-items: baseline; font-weight: 700; font-size: 0.98rem; min-height: 1.5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hintbar .msg { color: var(--orange); }

/* Furniture bar: room groups on the left, that group's items, then Turn. */
.fbar { display: flex; align-items: stretch; gap: 10px; border-top: 1px solid var(--grid-major); padding-top: 6px; }
.ftabs { display: grid; grid-template-columns: repeat(3, auto); gap: 4px; align-content: center; }
.ftabs button { padding: 3px 8px; font-size: 0.82rem; background: transparent; }
.ftabs button[aria-pressed="true"] { background: var(--chip); color: var(--orange); border-color: var(--orange); }
.fitems { display: flex; gap: 5px; flex: 1; min-width: 0; overflow-x: auto; }
.fitems button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 3px 6px; min-width: 4.6rem; background: var(--paper); font-size: 0.78rem; line-height: 1.1; }
.fitems button svg { width: 36px; height: 26px; }
.fitems button[aria-pressed="true"] { border: 2px solid var(--orange); color: var(--orange); background: var(--chip); }
.fbar .turn { align-self: center; white-space: nowrap; }

/* Context toolbar that floats beside the selected shape. */
.ctx { position: absolute; z-index: 5; display: flex; align-items: center; gap: 4px; padding: 4px; background: var(--paper); border: 2px solid var(--orange); border-radius: 10px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45); white-space: nowrap; }
.ctx .nm { padding: 0 6px; font-weight: 800; font-family: var(--font-display); }
.ctx .ms { padding: 0 4px; font-family: var(--font-num); font-weight: 700; color: var(--pt); }
.ctx button { padding: 4px 8px; font-size: 0.85rem; background: var(--sheet); }
.ctx button i { font-style: normal; margin-right: 3px; }
.ctx .del { color: var(--warn); border-color: var(--warn); }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Blue<em>printing</em></h1>
    <div class="io" id="io" role="group" aria-label="Indoor or outdoor"><button type="button" data-io="in" aria-pressed="true">🏠 Indoor</button><button type="button" data-io="out" aria-pressed="false">🌲 Outdoor</button></div></div>
    <div class="hud">
      <div class="ptitle"><label class="k" for="planName">Plan name</label><input id="planName" type="text" maxlength="40" value="My House Plan"></div>
      <div class="tele" aria-label="Cursor position"><span>X:</span><b id="tx">–</b><span>Y:</span><b id="ty">–</b></div>
      <div><span class="k">Total area</span><b id="totA">0 m²</b></div>
      <div><span class="k">Total perimeter</span><b id="totP">0 m</b></div>
    </div>
  </header>

  <div class="stage">

    <div class="bcol" id="bcol">
      <p class="hintbar" aria-live="polite"><span id="howto"></span><span class="msg" id="msg"></span></p>
      <div class="board" id="board">
        <svg id="cad" class="t-select" viewBox="0 0 880 880" role="img" aria-label="Blueprint grid with shapes">
          <defs>
            <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
            <clipPath id="gridClip"><rect id="gridClipR" x="34" y="34" width="812" height="812"/></clipPath>
            <clipPath id="dimClip"><rect id="dimClipR" x="14" y="14" width="852" height="852"/></clipPath>
          </defs>
          <g id="gGrid"></g>
          <g id="gOther" clip-path="url(#gridClip)" pointer-events="none" opacity="0.3"></g>
          <g id="gShapes" clip-path="url(#gridClip)"></g>
          <g id="gDims" pointer-events="none" clip-path="url(#dimClip)"></g>
          <g id="gTop"></g>
        </svg>
      </div>
      <div class="dock">
        <div class="tools" id="tools" role="toolbar" aria-label="Drawing tools">
      <button type="button" data-tool="select" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 3l6.5 17 2.4-7.1L21 10.5z"/></svg><span>Select</span></button>
      <button type="button" data-tool="line" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M6.5 17.5l11-11"/></svg><span id="lineLbl">Line / Wall</span></button>
      <button type="button" data-tool="rect" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1"/></svg><span id="rectLbl">Rectangle</span></button>
      <button type="button" data-tool="erase" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.6 14.6l9.2-9.2a2 2 0 0 1 2.8 0l2.9 2.9a2 2 0 0 1 0 2.8L11.6 19H8.9z"/><path d="M9 10l5 5"/></svg><span>Eraser</span></button>
      <span class="sep"></span>
      <button type="button" data-mode="axes" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 3v16h16"/></svg><span>Quadrant I</span></button>
      <button type="button" data-mode="plain" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 3h18v18H3zM9 3v18M15 3v18M3 9h18M3 15h18"/></svg><span>Plain grid</span></button>
      <button type="button" class="tog" id="halfBtn" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="5" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="19" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="19" cy="19" r="1"/></svg><span>Half-Snap</span></button>
      <button type="button" class="tog" id="dimBtn" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7.5 12.5l2 2M10.5 9.5l2 2M13.5 6.5l2 2"/></svg><span>Dimensions</span></button>
      <span class="sep"></span>
      <button type="button" id="undoBtn"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span>Undo</span></button>
      <button type="button" id="clearBtn"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg><span>Clear</span></button>
      <button type="button" class="exp push" id="pngBtn" title="Export my plan">⤓ PNG</button><button type="button" class="exp" id="svgBtn" title="Export my plan">⤓ SVG</button>
    </div>
      <div class="fbar" aria-label="Doors and furniture">
        <div class="ftabs" id="ftabs" role="group" aria-label="Rooms"></div>
        <div class="fitems" id="fitems" role="group" aria-label="Furniture"></div>
        <button type="button" class="turn" id="turnGhost">↺ Turn 90°</button>
      </div>
      </div>
      <div class="ctx" id="ctx" hidden></div>

      if (!S.draft) { S.draft = { type: S.tool, a: g }; drag = { kind: "draw" }; }
      else if (!eq(g, S.draft.a)) commitTwo(g);
    }
    render();
  });
  svg.addEventListener("pointermove", e => {
    const g = gridPt(e); if (!g) return;
    const same = S.cursor && eq(S.cursor, g);
    S.cursor = g;
    if (drag && !anim) {
      const sh = cur();
      if (drag.kind === "vertex" && sh && !eq(sh.pts[drag.i], g)) { sh.pts[drag.i] = g; drag.moved = true; }
      if (drag.kind === "resize" && sh) {            // stretch: the lower-left corner stays, the dragged corner snaps
        const it = ITEMS[sh.type], vert = sh.rot % 180 !== 0, st = step();

        if (!it.h) { if (vert) ww = 0; else hh = 0; }
        const [w, h] = vert ? [hh, ww] : [ww, hh], nb = itemBox(sh.type, sh.rot, w, h);
        if (w !== sizeOf(sh)[0] || h !== sizeOf(sh)[1]) { sh.w = w; sh.h = h; sh.x = clean(drag.x0 - nb[0]); sh.y = clean(drag.y0 - nb[1]); drag.moved = true; }
      }
      if (drag.kind === "move" && sh && sh.kind === "item") {
        const b = drag.b;
        const dx = Math.min(COLS - b[2], Math.max(-b[0], Math.round(g[0] - drag.start[0])));
        const dy = Math.min(ROWS - b[3], Math.max(-b[1], Math.round(g[1] - drag.start[1])));
        sh.x = clean(drag.ox + dx); sh.y = clean(drag.oy + dy);
        if (dx || dy) drag.moved = true;
      } else if (drag.kind === "move" && sh) {
        const b = bbox(drag.orig);
        const dx = Math.min(COLS - b[2], Math.max(-b[0], g[0] - drag.start[0]));
        const dy = Math.min(ROWS - b[3], Math.max(-b[1], g[1] - drag.start[1]));
        sh.pts = drag.orig.map(p => [clean(p[0] + dx), clean(p[1] + dy)]);
        drag.inner.forEach(([it, x, y]) => { it.x = clean(x + dx); it.y = clean(y + dy); });

      }
    }
    if (!same) render();
  });
  function endDrag(e) {
    if (!drag) return;
    if ((drag.kind === "vertex" || drag.kind === "move" || drag.kind === "resize") && drag.moved) pushUndo(drag.before);
    if (drag.kind === "draw" && S.draft && S.draft.a) { const g = gridPt(e); if (g && !eq(g, S.draft.a)) commitTwo(g); }
    drag = null; render();
  }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  svg.addEventListener("pointerleave", () => { if (!drag) { S.cursor = null; render(); } });

  // ---- Transformations, animated so students see the slide, flip or turn happen.
  function animate(sh, to, rot) {
    const from = sh.pts.map(p => p.slice());
    const done = () => { sh.pts = to.map(p => [clean(p[0]), clean(p[1])]); anim = false; render();
      if (offGrid(sh.pts)) say("Part of the image is off the grid. Press Undo or move it back."); };
    if (reduce) { done(); return; }
    anim = true;
    const t0 = performance.now(), D = rot ? 700 : 500;
    (function frame(now) {
      const k = Math.min(1, (now - t0) / D), e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
      if (rot) { const a = rot.deg * e * Math.PI / 180, [px, py] = rot.p;
        sh.pts = from.map(([x, y]) => [px + (x - px) * Math.cos(a) - (y - py) * Math.sin(a), py + (x - px) * Math.sin(a) + (y - py) * Math.cos(a)]);
      } else sh.pts = from.map((p, i) => [p[0] + (to[i][0] - p[0]) * e, p[1] + (to[i][1] - p[1]) * e]);
      render();
      if (k < 1) requestAnimationFrame(frame); else done();
    })(t0);
  }
  function rotatePts(P, deg, [px, py]) {
    const a = deg * Math.PI / 180, c = Math.round(Math.cos(a)), s = Math.round(Math.sin(a));
    return P.map(([x, y]) => [px + (x - px) * c - (y - py) * s, py + (x - px) * s + (y - py) * c]);
  }
  // Where a copy goes: beside the original (right, left, above, below) when there is room, else on top of it.
  function copyShift(b) {
    const w = b[2] - b[0], h = b[3] - b[1];
    if (b[2] + w <= COLS) return [w, 0];
    if (b[0] - w >= 0) return [-w, 0];
    if (b[3] + h <= ROWS) return [0, h];
    if (b[1] - h >= 0) return [0, -h];
    return [0, 0];
  }
  function act(a) {
    const sh = cur(); if (!sh || anim) return;
    if (a === "delete") { pushUndo(); S.shapes = S.shapes.filter(s => s !== sh); S.selId = null; render(); return; }
    if (a === "copy") {
      pushUndo();
      const [dx, dy] = copyShift(sh.kind === "item" ? itemBounds(sh) : bbox(sh.pts));
      const copy = sh.kind === "item" ? { ...sh, id: S.nextId++, x: sh.x + dx, y: sh.y + dy }
        : { id: S.nextId++, kind: sh.kind, pts: sh.pts.map(p => [p[0] + dx, p[1] + dy]), mat: sh.mat };
      S.shapes.push(copy); S.selId = copy.id; render(); return;
    }
    if (sh.kind === "item") {
      if (a !== "turn") return;
      pushUndo();                                   // turn in place: the box keeps its lower-left corner
      const b0 = itemBounds(sh), r = (sh.rot + 90) % 360, nb = itemBox(sh.type, r, ...sizeOf(sh));
      const fit = itemAt(sh.type, r, [b0[0] + (nb[2] - nb[0]) / 2, b0[1] + (nb[3] - nb[1]) / 2], sizeOf(sh));
      sh.rot = r; sh.x = fit.x; sh.y = fit.y;
      render(); return;
    }
    if (sh.kind !== "poly") return;
    const P = sh.pts;
    let to = null, rot = null;
    if (a === "flip") { const b = bbox(P); to = P.map(p => [b[0] + b[2] - p[0], p[1]]); }
    if (a === "turn") { const pv = pivotPt(sh); to = rotatePts(P, 90, pv); rot = { deg: 90, p: pv }; }
    if (!to) return;
    pushUndo(); say("");
    animate(sh, to, rot);
  }

  // ---- Controls.
  function setTool(t) {
    S.tool = t; S.draft = null;
    document.querySelectorAll("[data-tool]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tool === t)));
    svg.setAttribute("class", "t-" + t);
    say(""); render();
  }
  $("tools").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.tool) setTool(b.dataset.tool);
    if (b.dataset.mode) {
      S.axes = b.dataset.mode === "axes"; S.draft = null;
      document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      renderGrid(); render();
    }
  });
  $("halfBtn").addEventListener("click", () => { S.half = !S.half; $("halfBtn").setAttribute("aria-pressed", String(S.half)); render(); });
  $("dimBtn").addEventListener("click", () => { S.dims = !S.dims; $("dimBtn").setAttribute("aria-pressed", String(S.dims)); render(); });
  $("undoBtn").addEventListener("click", undo);
  $("clearBtn").addEventListener("click", () => {
    if (!S.shapes.length) return;
    pushUndo(); S.shapes = []; S.selId = null; S.draft = null;
    say("Canvas cleared. Press Undo to bring it back."); render();
  });
  $("ftabs").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (b) { S.group = +b.dataset.g; renderFurnBar(); render(); } });
  $("fitems").addEventListener("click", e => {
    const b = e.target.closest("[data-item]"); if (!b) return;
    S.item = b.dataset.item; S.itemRot = 0; setTool("furn");
  });
  $("turnGhost").addEventListener("click", () => { if (S.tool === "furn") { S.itemRot = (S.itemRot + 90) % 360; render(); } else act("turn"); });
  $("io").addEventListener("click", e => {
    const b = e.target.closest("[data-io]"); if (!b) return;
    const out = b.dataset.io === "out";
    if (out === S.out) return;
    // Indoor and Outdoor are two plans on the same grid: each keeps its own shapes and undo steps,
    // and the other one shows faintly underneath so the yard can be planned around the house.
    if (S.draft) cancelDraft();
    [S.shapes, S.other] = [S.other, S.shapes];
    const h = history.splice(0); history.push(...S.otherHist); S.otherHist = h;
    S.selId = null; S.out = out; GROUPS = S.out ? OUT : IN; S.group = 0;
    document.querySelectorAll("[data-io]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("lineLbl").textContent = S.out ? "Line / Fence" : "Line / Wall";
    $("rectLbl").textContent = S.out ? "Yard" : "Rectangle";

    renderFurnBar(); render();
  });
  $("ctx").addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b) act(b.dataset.act); });

  document.addEventListener("keydown", e => {
    const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); undo(); return; }

  // ---- Export: a clean blueprint (no cursor, handles or selection) with a title strip.
  function blueprintSVG() {
    const T = totals(), WD = W(), H = HGT + 60;
    const title = esc($("planName").value.trim() || "My House Plan");

      `<text x="24" y="${HGT + 38}" font-size="26" font-weight="700" fill="${C.cyan}" font-family="'Bricolage Grotesque', system-ui, sans-serif">${title}</text>` +
      `<text x="${WD - 24}" y="${HGT + 36}" text-anchor="end" font-size="18" font-weight="700" fill="${C.ink}">Area ${num(T.area, 3)} m² · Perimeter ${approx(T.per, 1)} m</text>`;
    const shapes = shapesSVG(null);
    const dims = S.dims ? S.shapes.filter(s => s.kind !== "item").map(s => dimsSVG(s, false)).join("") : "";

      `<style>.sh *{vector-effect:non-scaling-stroke}.dash{stroke-dasharray:6 4}.cut{stroke-width:8px}</style><defs><clipPath id="c"><rect x="34" y="34" width="${WD - 68}" height="${HGT - 68}"/></clipPath></defs>${gridSVG()}<g clip-path="url(#c)"><g opacity="0.3">${shapesSVG(null, S.other)}</g>${shapes}</g><g>${dims}</g>${strip}</svg>`;
  }
  const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const fileName = ext => (($("planName").value.trim() || "My House Plan").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() || "plan") + "." + ext;
  // In the claude.ai viewer the save goes through its downloads capability (the viewer confirms);
  // on the website it is an ordinary browser download.
  let dlP = null;
  async function download(blob, name) {
    if (window.claude && typeof window.claude.use === "function") {
      dlP = dlP || window.claude.use("downloads").catch(() => null);
      const dl = await dlP;
      if (dl) { try { await dl.save({ filename: name, data: blob }); } catch (e) { if (e && e.code !== "declined") say("The file could not be saved here."); } return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  $("svgBtn").addEventListener("click", () => download(new Blob([blueprintSVG()], { type: "image/svg+xml" }), fileName("svg")));
  $("pngBtn").addEventListener("click", () => {
    const img = new Image(), src = blueprintSVG();
    img.onload = () => {
      const cv = document.createElement("canvas"); cv.width = img.width * 2; cv.height = img.height * 2;
      const cx = cv.getContext("2d"); cx.scale(2, 2); cx.drawImage(img, 0, 0);
      cv.toBlob(b => b && download(b, fileName("png")), "image/png");
    };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(src);
  });

  // ---- Start with one L-shaped room so the labels show right away.
  S.shapes.push({ id: S.nextId++, kind: "poly", pts: [[2, 2], [8, 2], [8, 5], [5, 5], [5, 8], [2, 8]], mat: "room" });
  S.shapes.push({ id: S.nextId++, kind: "item", type: "door", x: 4, y: 2, rot: 0 });

  const fits = matchMedia("(min-width: 861px) and (min-height: 520px)");

})();

  "Rooms": "Pièces",
  "Doors and furniture": "Portes et meubles",
  "{0}Turn": "{0}Tourner",
  "{0}Flip": "{0}Retourner",
  "{0}Copy": "{0}Copier",
  "{0}Delete": "{0}Supprimer",

  "A rectangle needs width and height. Try again.": "Un rectangle a besoin d'une largeur et d'une hauteur. Essaie encore.",
  "Canvas cleared. Press Undo to bring it back.": "Tout est effacé. Appuie sur Annuler pour le ravoir."
};
</script>
<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
