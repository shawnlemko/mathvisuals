<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Area and Volume through Repetition</title>
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 16px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Area and Volume through Repetition: one page, an Area/Volume switch at the top.
   Each dimension keeps one color everywhere: length orange, width green, height and rows purple. */
:root {
  --len: #c2571a; --wid: #1f7a5a; --hgt: #6a4bc4;
  --front-a: #bcd5ef; --front-b: #a6c6e8; --top: #9fcca8; --top-line: #2f6b3c;
  --row-a: #bcd5ef; --row-b: #a6c6e8;
  --side-a: #b3a5e3; --side-b: #a091db; --edge: #1b2733; --shadow: #1b2733; --cyl-dark: #6f93bd;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --len: #f08a4b; --wid: #4cc49a; --hgt: #a98ef5; --shadow: #000000; } }
:root[data-theme="dark"] { --len: #f08a4b; --wid: #4cc49a; --hgt: #a98ef5; --shadow: #000000; }
</style>
<style>
.wrap { max-width: 1500px; }
.prompt { margin: 6px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.5rem, 2.8vw, 2.2rem); color: var(--pt); text-wrap: balance; }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }
.board { padding: 12px; }
#v-view .board svg { width: min(100%, calc((100vh - 340px) * 1530 / 1070)); margin: 0 auto; }
#a-view .board svg { width: min(100%, calc((100vh - 340px) * 1130 / 970)); margin: 0 auto; }
#a-view .stage.no-calc { grid-template-columns: minmax(0, 1fr) auto; }
@media (max-width: 900px) { #a-view .stage.no-calc { grid-template-columns: 1fr; } }

/* Tracks and draggable points */
.track { stroke-width: 9; stroke-linecap: round; opacity: 0.85; }
.tick { opacity: 0.45; }
.len { stroke: var(--len); fill: var(--len); } .wid { stroke: var(--wid); fill: var(--wid); } .hgt { stroke: var(--hgt); fill: var(--hgt); }
.knob { cursor: grab; outline: none; }
.knob.drag { cursor: grabbing; }
.knob .halo { opacity: 0.18; stroke: none; transition: opacity .15s; }
.knob:hover .halo, .knob:focus-visible .halo, .knob.drag .halo { opacity: 0.38; }
.knob .dot { stroke: var(--sheet); stroke-width: 5; }
.val { font-family: var(--font-display); font-weight: 800; font-size: 74px; stroke: none; }
.tname { font-family: var(--font-body); font-weight: 700; font-size: 30px; letter-spacing: 0.12em; stroke: none; }

/* The solids */
.f { stroke: var(--edge); stroke-width: 3; stroke-linejoin: round; }
.front.a { fill: var(--front-a); } .front.b { fill: var(--front-b); }
.side.a { fill: var(--side-a); } .side.b { fill: var(--side-b); }
.top { fill: var(--top); stroke: var(--top-line); }
.cell { stroke: var(--edge); stroke-width: 1.5; stroke-opacity: 0.55; }
.cell.top-c { stroke: var(--top-line); stroke-opacity: 0.8; }
.layer { stroke: var(--edge); stroke-width: 2.5; }
.layer.soft { stroke-opacity: 0.35; stroke-width: 2; }
.band.a { fill: url(#cylA); } .band.b { fill: url(#cylB); }
.radius { stroke: var(--len); stroke-width: 5; stroke-dasharray: 10 7; stroke-linecap: round; }
.center { fill: var(--len); }
.shadow { fill: var(--shadow); opacity: 0.16; }
.stop-edge { stop-color: var(--cyl-dark); } .stop-a { stop-color: var(--front-a); } .stop-b { stop-color: var(--front-b); }

/* Side panel: shape choice, then calculations */
.side-panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button, .calc button { min-height: 56px; font-size: 1.3rem; }
.seg button[aria-pressed="true"] { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.calc { display: flex; flex-direction: column; gap: 14px; }
.calc button[aria-pressed="false"] { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.rows { display: flex; flex-direction: column; gap: 16px; }
.rows .label { margin: 0 0 4px; font-size: 1rem; }
.line { font-family: var(--font-num); font-weight: 700; font-size: 2rem; line-height: 1.3; overflow-wrap: anywhere; }
.total { font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; line-height: 1.15; }
.total b { background: var(--chip); border-radius: 10px; padding: 0 12px; }
.c-len { color: var(--len); } .c-wid { color: var(--wid); } .c-hgt { color: var(--hgt); }
.terms { font-size: 1.6rem; }

/* Area view */
.row { stroke: var(--edge); stroke-width: 3; stroke-linejoin: round; }
.row.a { fill: var(--row-a); } .row.b { fill: var(--row-b); }
.rlen { fill: var(--len); font-family: var(--font-display); font-weight: 800; font-size: 40px; }
.kv { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; line-height: 1.2; }
.kv b { font-family: var(--font-num); font-size: 2.6rem; }
.nw { white-space: nowrap; }
#a-area { font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; line-height: 1.4; }
.ans { background: var(--chip); border-radius: 8px; padding: 0 10px; }

/* Master switch: Area or Volume */
.master { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; margin-top: 12px; background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 14px; }
.master button { min-height: 60px; min-width: 9em; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; border-radius: 10px; }
.master button[aria-pressed="true"] { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Area and Volume through Repetition</h1>
    <div class="master" role="group" aria-label="Area or volume">
      <button type="button" data-view="a" aria-pressed="true">Area</button>
      <button type="button" data-view="v" aria-pressed="false">Volume</button>
    </div>
    <p class="prompt" id="prompt">Set the base length. How many groups of it do you have?</p></div>
  </header>
  <section id="a-view">
  <div class="stage" id="a-stage">
    <div class="board"><svg id="a-svg" role="img" aria-label="A rectangle of unit squares built from equal rows. Drag the points on the two tracks to change the length and the number of rows."></svg></div>
    <aside class="card calc">
      <button type="button" id="a-toggle" aria-pressed="true" aria-controls="a-rows">Hide calculations</button>
      <div class="rows" id="a-rows" aria-live="polite">
        <div class="kv">Size of base: <b id="a-base" class="c-len"></b></div>
        <div class="kv">How many groups?: <b id="a-groups" class="c-hgt"></b></div>
        <div><div class="kv">Area:</div><div class="line" id="a-area"></div></div>
      </div>
    </aside>
  </div>
  </section>
  <section id="v-view" hidden>
  <div class="stage">
    <div class="board"><svg id="v-svg" role="img" aria-label="A solid built from layers of its base. Drag the points on the tracks to change the base and the height."></svg></div>
    <div class="side-panel">
      <div class="card seg" role="group" aria-label="Shape">
        <button type="button" data-mode="cubes" aria-pressed="true">Cubes</button>
        <button type="button" data-mode="prism" aria-pressed="false">Prism</button>
        <button type="button" data-mode="cyl" aria-pressed="false">Cylinder</button>
      </div>
      <aside class="card calc">
        <button type="button" id="v-toggle" aria-pressed="true" aria-controls="v-rows">Hide calculations</button>
        <div class="rows" id="v-rows" aria-live="polite">
          <div class="total">Volume = <b id="v-vol"></b></div>
          <div><p class="label">Base area</p><div class="line" id="v-base"></div></div>
          <div><p class="label">Base area × height</p><div class="line" id="v-prod"></div></div>
          <div><p class="label">Groups of the base area</p><div class="line terms" id="v-layers"></div></div>
        </div>
      </aside>
    </div>
  </div>
  </section>
</div>

<script>
// Master switch: show one tool at a time and swap the instruction line.
(() => {
  const prompts = { a: "Set the base length. How many groups of it do you have?", v: "Set the base area. How many groups of it do you have?" };
  const btns = document.querySelectorAll(".master button");
  for (const b of btns) b.addEventListener("click", () => {
    const k = b.dataset.view;
    for (const o of btns) o.setAttribute("aria-pressed", o === b);
    document.getElementById("a-view").hidden = k !== "a";
    document.getElementById("v-view").hidden = k !== "v";
    document.getElementById("prompt").textContent = prompts[k];
  });
})();
</script>
<script>
// ---- Area: rows of the base length ----
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const svg = $("a-svg");
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    parent.appendChild(e);
    return e;
  };
  const W = 1130, H = 970, U = 66, MAX = 10, OX = 270, OY = 760;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const seg = (a, b, cls, g) => el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: cls }, g);

  const defs = el("defs", {}, svg);
  const f = el("filter", { id: "a-soft", x: "-20%", y: "-20%", width: "140%", height: "140%" }, defs);
  el("feGaussianBlur", { stdDeviation: 8 }, f);

  const v = { l: 4, r: 3 };
  const tracks = {
    r: { cls: "hgt", name: "ROWS", at: n => [OX - 100, OY - n * U], lbl: [-54, 26, "end"], tag: [0, -60, "middle"] },
    l: { cls: "len", name: "LENGTH", at: n => [OX + n * U, OY + 80], lbl: [0, 104, "middle"], tag: [22, 8, "start"] },
  };

  const shape = el("g", {}, svg), knobs = {};
  for (const k in tracks) {
    const t = tracks[k], a = t.at(0), b = t.at(MAX);
    seg(a, b, `track ${t.cls}`, svg);
    for (let n = 1; n <= MAX; n++) { const [x, y] = t.at(n); el("circle", { cx: x, cy: y, r: 5, class: `tick ${t.cls}` }, svg); }
    el("text", { x: b[0] + t.tag[0], y: b[1] + t.tag[1], class: `tname ${t.cls}`, "text-anchor": t.tag[2] }, svg, t.name);
    const g = el("g", { class: `knob ${t.cls}`, tabindex: 0, role: "slider", "aria-valuemin": 1, "aria-valuemax": MAX, "aria-label": t.name.toLowerCase() }, svg);
    el("circle", { r: 40, class: "halo" }, g);
    el("circle", { r: 17, class: "dot" }, g);
    knobs[k] = { g, txt: el("text", { class: "val", x: t.lbl[0], y: t.lbl[1], "text-anchor": t.lbl[2] }, g) };
    dragify(k, g);
  }

  function draw() {
    const { l, r } = v;
    shape.textContent = "";
    el("rect", { x: OX + 10, y: OY - r * U + 12, width: l * U, height: r * U, class: "shadow", filter: "url(#a-soft)" }, shape);
    // Rows of length l, stacked from the bottom; shades alternate so each row reads as one length.
    for (let j = 0; j < r; j++) {
      const y = OY - (j + 1) * U;
      el("rect", { x: OX, y, width: l * U, height: U, class: "row " + (j % 2 ? "b" : "a") }, shape);
      for (let i = 1; i < l; i++) seg([OX + i * U, y], [OX + i * U, y + U], "cell", shape);
      // Each row's length, just past its right end, shown with the calculations.
      if (!$("a-rows").hidden) el("text", { x: OX + l * U + 14, y: y + U / 2 + 11, class: "rlen" }, shape, l);
    }

    for (const k in tracks) {
      const [x, y] = tracks[k].at(v[k]);
      knobs[k].g.setAttribute("transform", `translate(${x} ${y})`);
      knobs[k].g.setAttribute("aria-valuenow", v[k]);
      knobs[k].txt.textContent = v[k];
    }

    const L = `<span class="c-len">${l}</span>`;
    const G = `<span class="c-hgt">${r}</span>`;
    $("a-base").textContent = l;
    $("a-groups").textContent = r;
    $("a-area").innerHTML = `<span class="nw">${G} groups of ${L}</span> <span class="nw">= ${G} × ${L}</span> <span class="nw">= <span class="ans">${l * r}</span></span>`;
  }

  // Drag: project the pointer onto the track and snap to a whole number from 1 to 10.
  function dragify(k, g) {
    const t = tracks[k];
    const toVal = e => {
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      const a = t.at(0), b = t.at(1), dx = b[0] - a[0], dy = b[1] - a[1];
      const n = ((p.x - a[0]) * dx + (p.y - a[1]) * dy) / (dx * dx + dy * dy);
      return Math.min(MAX, Math.max(1, Math.round(n)));
    };
    g.addEventListener("pointerdown", e => { e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add("drag"); g.focus(); });
    g.addEventListener("pointermove", e => {
      if (!g.hasPointerCapture(e.pointerId)) return;
      const n = toVal(e); if (n !== v[k]) { v[k] = n; draw(); }
    });
    const end = () => g.classList.remove("drag");
    g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
    g.addEventListener("keydown", e => {
      const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
      if (!d) return;
      e.preventDefault(); v[k] = Math.min(MAX, Math.max(1, v[k] + d)); draw();
    });
  }

  $("a-toggle").addEventListener("click", () => {
    const show = $("a-rows").hidden;
    $("a-rows").hidden = !show;
    $("a-stage").classList.toggle("no-calc", !show);
    $("a-toggle").setAttribute("aria-pressed", show);
    $("a-toggle").textContent = show ? "Hide calculations" : "Show calculations";
    draw();
  });

  draw();
})();
</script>
<script>
// ---- Volume: layers of the base area ----
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const svg = $("v-svg");
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    parent.appendChild(e);
    return e;
  };
  // Oblique drawing: x (length) right, z (height) up, y (width) up-right at 45°.
  const W = 1530, H = 1070, U = 64, D = 0.28 * U, MAX = 10, RMAX = 5, OX = 300, OY = 850;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const P = (x, y, z) => [OX + U * x + D * y, OY - U * z - D * y];
  const pts = a => a.map(p => p.join(",")).join(" ");
  const poly = (a, cls, g) => el("polygon", { points: pts(a), class: cls }, g);
  const seg = (a, b, cls, g) => el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: cls }, g);

  // Cylinder: fixed center so the radius track starts there; the ellipse is squashed to 30% for depth.
  const CX = OX + RMAX * U, SQ = 0.3;

  const defs = el("defs", {}, svg);
  const f = el("filter", { id: "v-soft", x: "-20%", y: "-20%", width: "140%", height: "140%" }, defs);
  el("feGaussianBlur", { stdDeviation: 8 }, f);
  // Curved side of the cylinder: darker at the edges, lighter in the middle.
  for (const [id, mid] of [["cylA", "stop-a"], ["cylB", "stop-b"]]) {
    const g = el("linearGradient", { id, x1: 0, x2: 1, y1: 0, y2: 0 }, defs);
    el("stop", { offset: "0", class: "stop-edge" }, g);
    el("stop", { offset: "0.45", class: mid }, g);
    el("stop", { offset: "1", class: "stop-edge" }, g);
  }

  const v = { l: 4, w: 3, h: 1, r: 3 };
  let mode = "cubes";
  const WX = OX + MAX * U + MAX * D + 60;
  const tracks = {
    h: { cls: "hgt", name: "HEIGHT", max: MAX, at: n => [OX - 100, OY - n * U], lbl: [-54, 26, "end"], tag: [0, -60, "middle"] },
    l: { cls: "len", name: "LENGTH", max: MAX, at: n => [OX + n * U, OY + 80], lbl: [0, 104, "middle"], tag: [22, 8, "start"] },
    w: { cls: "wid", name: "WIDTH", max: MAX, at: n => [WX + n * D, OY - n * D], lbl: [54, 26, "start"], tag: [0, -60, "middle"] },
    r: { cls: "len", name: "RADIUS", max: RMAX, at: n => [CX + n * U, OY + 80], lbl: [0, 104, "middle"], tag: [22, 8, "start"] },
  };

  const shape = el("g", {}, svg), knobs = {};
  for (const k in tracks) {
    const t = tracks[k], a = t.at(0), b = t.at(t.max);
    const wrap = el("g", {}, svg);
    seg(a, b, `track ${t.cls}`, wrap);
    for (let n = 1; n <= t.max; n++) { const [x, y] = t.at(n); el("circle", { cx: x, cy: y, r: 5, class: `tick ${t.cls}` }, wrap); }
    el("text", { x: b[0] + t.tag[0], y: b[1] + t.tag[1], class: `tname ${t.cls}`, "text-anchor": t.tag[2] }, wrap, t.name);
    const g = el("g", { class: `knob ${t.cls}`, tabindex: 0, role: "slider", "aria-valuemin": 1, "aria-valuemax": t.max, "aria-label": t.name.toLowerCase() }, wrap);
    el("circle", { r: 40, class: "halo" }, g);
    el("circle", { r: 17, class: "dot" }, g);
    knobs[k] = { wrap, g, txt: el("text", { class: "val", x: t.lbl[0], y: t.lbl[1], "text-anchor": t.lbl[2] }, g) };
    dragify(k, g);
  }

  function drawBox(cubes) {
    const { l, w, h } = v;
    el("polygon", { points: pts([P(0,0,0), P(l,0,0), P(l,w,0), P(0,w,0)].map(([x, y]) => [x + 10, y + 12])), class: "shadow", filter: "url(#v-soft)" }, shape);
    for (let k = 0; k < h; k++) {
      const s = k % 2 ? "b" : "a", t = Math.min(k + 1, h);
      poly([P(0,0,k), P(l,0,k), P(l,0,t), P(0,0,t)], `f front ${s}`, shape);
      poly([P(l,0,k), P(l,w,k), P(l,w,t), P(l,0,t)], `f side ${s}`, shape);
      if (cubes) {
        for (let i = 1; i < l; i++) seg(P(i,0,k), P(i,0,t), "cell", shape);
        for (let j = 1; j < w; j++) seg(P(l,j,k), P(l,j,t), "cell", shape);
      }
    }
    // Layer lines mark each group of the base area; softer on the prism, which has no cubes.
    const lc = cubes ? "layer" : "layer soft";
    for (let k = 1; k < h; k++) { seg(P(0,0,k), P(l,0,k), lc, shape); seg(P(l,0,k), P(l,w,k), lc, shape); }
    poly([P(0,0,h), P(l,0,h), P(l,w,h), P(0,w,h)], "f top", shape);
    if (cubes) {
      for (let i = 1; i < l; i++) seg(P(i,0,h), P(i,w,h), "cell top-c", shape);
      for (let j = 1; j < w; j++) seg(P(0,j,h), P(l,j,h), "cell top-c", shape);
    }
  }

  function drawCylinder() {
    const { r, h } = v, rx = r * U, ry = rx * SQ, cy0 = OY - ry;
    const Y = z => cy0 - z * U;
    el("ellipse", { cx: CX + 10, cy: cy0 + 12, rx, ry, class: "shadow", filter: "url(#v-soft)" }, shape);
    // One band per unit of height: the front of the curved side between two levels.
    for (let k = 0; k < h; k++) {
      const a = Y(Math.min(k + 1, h)), b = Y(k);
      el("path", { d: `M${CX - rx},${a} A${rx},${ry} 0 0 0 ${CX + rx},${a} L${CX + rx},${b} A${rx},${ry} 0 0 1 ${CX - rx},${b} Z`,
        class: `f band ${k % 2 ? "b" : "a"}` }, shape);
    }
    for (let k = 1; k < h; k++) el("path", { d: `M${CX - rx},${Y(k)} A${rx},${ry} 0 0 0 ${CX + rx},${Y(k)}`, class: "layer", fill: "none" }, shape);
    el("ellipse", { cx: CX, cy: Y(h), rx, ry, class: "f top" }, shape);
    seg([CX, Y(h)], [CX + rx, Y(h)], "radius", shape);
    el("circle", { cx: CX, cy: Y(h), r: 7, class: "center" }, shape);
  }

  // Numbers to at most two decimals, without trailing zeros (2.50 shows as 2.5).
  const fmt = x => String(+(Math.round(x * 100) / 100).toFixed(2));
  // Whole groups of the base, plus the part of one more group when the height is a decimal (2.5 → 12 + 12 + 0.5 × 12).
  const groups = (b, h) => {
    const n = Math.floor(h + 1e-9), part = +(h - n).toFixed(1), terms = Array(n).fill(fmt(b));
    if (part > 0) terms.push(`${fmt(part)} × ${fmt(b)}`);
    return terms.join(" + ");
  };

  function draw() {
    const cyl = mode === "cyl";
    shape.textContent = "";
    cyl ? drawCylinder() : drawBox(mode === "cubes");
    const shown = cyl ? ["h", "r"] : ["h", "l", "w"];
    for (const k in tracks) {
      knobs[k].wrap.style.display = shown.includes(k) ? "" : "none";
      const [x, y] = tracks[k].at(v[k]);
      knobs[k].g.setAttribute("transform", `translate(${x} ${y})`);
      knobs[k].g.setAttribute("aria-valuenow", v[k]);
      knobs[k].txt.textContent = fmt(v[k]);
    }

    const { l, w, h, r } = v, Hh = `<span class="c-hgt">${fmt(h)}</span>`;
    if (cyl) {
      // Uses 3.14 for pi, and the rounded base area carries through, so each line checks by hand.
      const b = +fmt(3.14 * r * r), V = fmt(b * h), R = `<span class="c-len">${fmt(r)}</span>`;
      $("v-vol").textContent = V;
      $("v-base").innerHTML = `3.14 × ${R}² = ${fmt(b)}`;
      $("v-prod").innerHTML = `${fmt(b)} × ${Hh} = ${V}`;
      $("v-layers").innerHTML = `${groups(b, h)} = ${V}`;
    } else {
      const b = +fmt(l * w), V = fmt(b * h);
      $("v-vol").textContent = V;
      $("v-base").innerHTML = `<span class="c-len">${fmt(l)}</span> × <span class="c-wid">${fmt(w)}</span> = ${fmt(b)}`;
      $("v-prod").innerHTML = `${fmt(b)} × ${Hh} = ${V}`;
      $("v-layers").innerHTML = `${groups(b, h)} = ${V}`;
    }
  }

  // Drag: project the pointer onto the track and snap to a whole number.
  function dragify(k, g) {
    const t = tracks[k];
    const step = () => mode === "cubes" ? 1 : 0.1;
    const clamp = n => +Math.min(t.max, Math.max(step(), Math.round(n / step()) * step())).toFixed(1);
    const toVal = e => {
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      const a = t.at(0), b = t.at(1), dx = b[0] - a[0], dy = b[1] - a[1];
      return clamp(((p.x - a[0]) * dx + (p.y - a[1]) * dy) / (dx * dx + dy * dy));
    };
    g.addEventListener("pointerdown", e => { e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add("drag"); g.focus(); });
    g.addEventListener("pointermove", e => {
      if (!g.hasPointerCapture(e.pointerId)) return;
      const n = toVal(e); if (n !== v[k]) { v[k] = n; draw(); }
    });
    const end = () => g.classList.remove("drag");
    g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
    g.addEventListener("keydown", e => {
      const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
      if (!d) return;
      e.preventDefault(); v[k] = clamp(v[k] + d * step()); draw();
    });
  }

  for (const b of document.querySelectorAll("#v-view .seg button")) b.addEventListener("click", () => {
    mode = b.dataset.mode;
    // The cube box needs whole numbers; round anything left over from the prism.
    if (mode === "cubes") for (const k of ["l", "w", "h"]) v[k] = Math.max(1, Math.round(v[k]));
    for (const o of document.querySelectorAll("#v-view .seg button")) o.setAttribute("aria-pressed", o === b);
    draw();
  });

  $("v-toggle").addEventListener("click", () => {
    const show = $("v-rows").hidden;
    $("v-rows").hidden = !show;
    $("v-toggle").setAttribute("aria-pressed", show);
    $("v-toggle").textContent = show ? "Hide calculations" : "Show calculations";
  });

  draw();
})();
</script>
