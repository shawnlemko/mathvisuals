<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Powers and Roots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Powers and Roots (Alberta Math 9, 10C, 20-1, 20-2). A course picker turns on the skills that course covers;
   the checkboxes choose what goes into Practice, and a skill's name opens it in Learn.
   Learn: a worked example, one step at a time, with a visual (factor chips, radical "house" with groups that come out,
   area squares, like-radical tiles, multiplication grids). Practice: typed answers checked for value and for form.
   Colours: blue and orange for the parts being combined, green for results, purple for coefficients. */
:root { --purple: #6a4fc4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --purple: #b39dff; } }
:root[data-theme="dark"] { --purple: #b39dff; }
.main { grid-template-columns: minmax(220px, 0.78fr) minmax(0, 2.3fr) minmax(290px, 1fr); }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.seg-btns { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg-btns button { border: 0; border-radius: 0; background: var(--sheet); font-size: 1.1rem; min-height: 46px; padding: 6px 14px; }
.seg-btns button + button { border-left: 2px solid var(--grid-major); }
.seg-btns button.on { background: var(--pt); color: var(--sheet); }

/* Skills column */
.skills { display: flex; flex-direction: column; gap: 4px; padding: 12px; }
.skills .label { margin: 8px 0 2px; }
.skills .label:first-child { margin-top: 0; }
.sk { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2px 8px; padding: 3px 6px; border-radius: 8px; border: 2px solid transparent; }
.sk input { width: 20px; height: 20px; accent-color: var(--pt); margin: 0; cursor: pointer; }
.sk .skn { all: unset; cursor: pointer; font-size: 0.95rem; line-height: 1.25; padding: 3px 0; }
.sk .skn:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; border-radius: 4px; }
.sk .tag { grid-column: 2; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.sk.on { border-color: var(--pt); background: color-mix(in srgb, var(--pt) 10%, var(--sheet)); }
.sk.locked { opacity: 0.42; }
.sk.locked .skn, .sk.locked input { cursor: not-allowed; }
.skills .hint { margin: 8px 0 0; font-size: 0.85rem; }

/* Board */
#board { display: flex; flex-direction: column; justify-content: flex-start; gap: 10px; padding: 14px 18px; min-width: 0; }
.ask { margin: 0; color: var(--muted); font-size: 1.1rem; font-weight: 700; }
.eqn { font-family: var(--font-num); font-weight: 700; font-size: clamp(1.7rem, 2.3vw + 0.5rem, 3.1rem); line-height: 1.7; color: var(--ink); }
.eqn .res { color: var(--green); }
.scene { flex: 1 1 auto; min-height: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px 20px; padding: 6px; overflow: auto; }
.words { margin: 0; font-size: 1.25rem; min-height: 1.6em; }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px dashed var(--grid-major); padding-top: 10px; }
.nav button { font-size: 1.1rem; min-height: 50px; padding: 8px 18px; }
.nav button.go, .btns button.go { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.nav button:disabled, .btns button:disabled { opacity: 0.4; cursor: default; }
.nav .stepn { color: var(--muted); font-weight: 700; }

/* Math notation (board, panel, preview) */
sup { font-size: 0.6em; line-height: 0; vertical-align: 0.95em; margin-left: 0.04em; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: 0.8em; line-height: 1.15; margin: 0 0.08em; }
.fr > span:first-child { border-bottom: 0.08em solid currentColor; padding: 0 0.2em 0.04em; }
.fr > span:last-child { padding: 0.04em 0.2em 0; }
.fr > span { white-space: nowrap; align-self: stretch; text-align: center; }
sup .fr { font-size: 0.85em; vertical-align: 0.1em; }
sup .fr > span:first-child { border-bottom-width: 0.1em; }
.rad { display: inline-flex; align-items: baseline; white-space: nowrap; }
.rad .ri { font-size: 0.5em; vertical-align: 1.1em; margin-right: -0.32em; line-height: 0; position: relative; top: -0.55em; }
.rad .rs { font-family: var(--font-body); font-weight: 400; transform: scaleY(1.1); display: inline-block; }
.rad .rc { border-top: 0.07em solid currentColor; padding: 0.06em 0.08em 0 0.06em; margin-left: -0.04em; line-height: 1.15; }
.rad .rc .fr { font-size: 0.75em; }
i { font-family: var(--font-display); font-weight: 800; font-style: italic; }
.cb { color: var(--pt); } .co { color: var(--orange); } .cg { color: var(--green); } .cp { color: var(--purple); } .cr { color: var(--warn); }
.k-b { --k: var(--pt); } .k-o { --k: var(--orange); } .k-g { --k: var(--green); } .k-p { --k: var(--purple); } .k-r { --k: var(--warn); } .k-n { --k: var(--muted); }

/* Scenes */
.chip { display: inline-grid; place-items: center; min-width: 2.1em; height: 2.1em; padding: 0 0.35em; border-radius: 0.5em; font-family: var(--font-num); font-weight: 700; font-size: clamp(1rem, 1.1vw + 0.45rem, 1.7rem); border: 2.5px solid var(--k); background: color-mix(in srgb, var(--k) 16%, var(--sheet)); color: var(--ink); transition: opacity 0.4s; white-space: nowrap; }
.chip .fr { font-size: 0.7em; }
.chip.cut { opacity: 0.28; background: var(--sheet); text-decoration: line-through; text-decoration-thickness: 3px; }
.new { animation: popin 0.5s ease both; }
@keyframes popin { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .new { animation: none; } }
.crow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
.grp { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.grp > .items { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; padding: 7px; border: 2px dashed var(--grid-major); border-radius: 12px; }
.grp.plain > .items { border-color: transparent; }
.grp .cap { font-family: var(--font-num); font-weight: 700; color: var(--muted); font-size: 1.05rem; }
.sep { font-family: var(--font-num); font-weight: 700; font-size: 1.6rem; color: var(--muted); }
.cfrac { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; }
.cfrac .bar { align-self: stretch; height: 4px; border-radius: 2px; background: var(--ink); }
.cres { font-family: var(--font-num); font-weight: 700; font-size: clamp(1.6rem, 2vw + 0.6rem, 2.8rem); color: var(--green); }
.ring { display: inline-flex; gap: 4px; padding: 4px; border: 3px solid var(--green); border-radius: 999px; }
.ring.cut { border-style: dashed; opacity: 0.5; }
.rhouse { display: inline-flex; align-items: center; gap: 10px; }
.rout { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rroot { position: relative; display: inline-flex; align-items: stretch; padding-left: 2.2rem; }
.rroot svg { position: absolute; left: 0; top: 0; width: 2.3rem; height: 100%; overflow: visible; }
.rroot svg path { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.rroot .ridx { position: absolute; left: 0.1rem; top: 0.6rem; font-family: var(--font-num); font-weight: 700; font-size: 1.15rem; color: var(--pt); }
.rin { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; border-top: 4px solid var(--ink); padding: 10px 10px 6px; min-height: 3.4rem; min-width: 3rem; }
.ladder { display: flex; flex-direction: column; align-items: stretch; font-family: var(--font-num); font-weight: 700; font-size: clamp(1.2rem, 1.2vw + 0.6rem, 1.9rem); }
.lrow { display: grid; grid-template-columns: 4.2em 1.2em minmax(3em, auto); align-items: center; padding: 2px 12px; border-radius: 8px; border: 2px solid transparent; }
.lrow > span:first-child { text-align: right; }
.lrow.hl { border-color: var(--k); background: color-mix(in srgb, var(--k) 14%, var(--sheet)); }
.lop { font-size: 0.6em; color: var(--orange); padding-left: 2.6em; line-height: 1.2; }
.sortc { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.sortc > div { border: 2px solid var(--k); border-radius: 12px; padding: 8px 14px; min-width: 7.5em; background: color-mix(in srgb, var(--k) 8%, var(--sheet)); }
.sortc h3 { margin: 0 0 4px; font-size: 0.95rem; color: var(--k); text-transform: uppercase; letter-spacing: 0.05em; }
.sortc p { margin: 0; font-family: var(--font-num); font-weight: 700; font-size: clamp(1.1rem, 1vw + 0.6rem, 1.6rem); line-height: 1.9; }
.lanes { display: flex; flex-direction: column; gap: 10px; font-family: var(--font-num); font-weight: 700; font-size: clamp(1.2rem, 1.2vw + 0.6rem, 2rem); }
.lanes > div { display: flex; align-items: center; gap: 14px; border-left: 6px solid var(--k); padding: 4px 14px; background: color-mix(in srgb, var(--k) 9%, var(--sheet)); border-radius: 6px; }
.lanes .ln { font-family: var(--font-body); font-size: 0.6em; color: var(--k); min-width: 5.5em; text-transform: uppercase; letter-spacing: 0.04em; }
.area { display: grid; gap: 4px; font-family: var(--font-num); font-weight: 700; font-size: clamp(1.1rem, 1vw + 0.6rem, 1.7rem); }
.area .ah { white-space: nowrap; display: grid; place-items: center; padding: 6px 12px; color: var(--muted); }
.area .ah.col { color: var(--orange); border-bottom: 3px solid var(--orange); }
.area .ah.row { color: var(--pt); border-right: 3px solid var(--pt); justify-items: end; }
.acell { display: grid; place-items: center; text-align: center; min-width: 4.5em; min-height: 3.2em; padding: 6px 10px; border: 2px solid var(--k); border-radius: 8px; background: color-mix(in srgb, var(--k) 12%, var(--sheet)); }
.acell small { display: block; font-size: 0.6em; color: var(--muted); font-weight: 500; }
.acell.cut { opacity: 0.35; text-decoration: line-through; }
.dist { display: flex; flex-direction: column; gap: 6px; font-family: var(--font-num); font-weight: 700; font-size: clamp(1.2rem, 1.2vw + 0.6rem, 2rem); }
.dtop { margin-bottom: 6px; }
.drow { display: grid; grid-template-columns: auto auto auto; gap: 14px; justify-content: start; padding: 2px 10px; border-left: 4px solid var(--grid-major); }
.drow.cut > span:last-child { text-decoration: line-through; opacity: 0.4; }
.tiles { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.tgrp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tcount { font-family: var(--font-num); font-weight: 700; font-size: 1.3rem; min-width: 4.2em; color: var(--k); }
.tile { display: inline-grid; place-items: center; min-width: 2.8em; height: 2.3em; padding: 0 0.4em; border-radius: 6px; font-family: var(--font-num); font-weight: 700; font-size: clamp(0.95rem, 0.8vw + 0.5rem, 1.4rem); background: color-mix(in srgb, var(--k) 22%, var(--sheet)); border: 2px solid var(--k); }
.tile.neg { background: var(--sheet); border-style: dashed; color: var(--warn); }
.tgrp.cut .tile { opacity: 0.3; }
.mapbox { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; justify-content: center; font-family: var(--font-num); font-weight: 700; font-size: clamp(1.8rem, 2.4vw + 0.6rem, 3.4rem); }
.mapbox .eqs { color: var(--muted); }

<script>
(function () {
const $ = s => document.querySelector(s);

/* ---------- small math helpers ---------- */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const Q = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return [n / g, d / g]; };
const Qadd = (a, b) => Q(a[0] * b[1] + b[0] * a[1], a[1] * b[1]);
const Qsub = (a, b) => Q(a[0] * b[1] - b[0] * a[1], a[1] * b[1]);
const Qmul = (a, b) => Q(a[0] * b[0], a[1] * b[1]);
const Qv = a => a[0] / a[1];
/* n = a^k × r with r free of k-th powers */
function splitRoot(n, k) { let a = 1, r = n; for (let p = 2; p ** k <= r; p++) { const pk = p ** k; while (r % pk === 0) { r /= pk; a *= p; } } return [a, r]; }
function primes(n) { const out = []; for (let p = 2; p * p <= n; p++) while (n % p === 0) { out.push(p); n /= p; } if (n > 1) out.push(n); return out; }
const M = n => n < 0 ? "−" + (-n) : String(n);
const pM = n => n < 0 ? `(${M(n)})` : M(n);

/* ---------- notation as HTML ---------- */
const P = (b, e) => `${b}<sup>${e}</sup>`;
const fr = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const C = (c, s) => `<span class="${c}">${s}</span>`;
const rad = (inner, k = 2) => `<span class="rad">${k > 2 ? `<span class="ri">${k}</span>` : ""}<span class="rs">√</span><span class="rc">${inner}</span></span>`;
const xi = v => `<i>${v}</i>`;
const FH = f => f[1] === 1 ? M(f[0]) : (f[0] < 0 ? "−" : "") + fr(Math.abs(f[0]), f[1]);
const FT = f => f[1] === 1 ? String(f[0]) : `(${f[0]}/${f[1]})`;
const coefH = c => c === 1 ? "" : c === -1 ? "−" : M(c);
const coefT = c => c === 1 ? "" : c === -1 ? "-" : String(c);
const pvH = (v, e) => e === 0 ? "" : e === 1 ? xi(v) : P(xi(v), M(e));
const pvT = (v, e) => e === 0 ? "" : e === 1 ? v : `${v}^${e < 0 ? `(${e})` : e}`;
const rootT = k => k === 2 ? "√" : k === 3 ? "∛" : "∜";
const baseH = b => b < 0 ? `(${M(b)})` : String(b);
const baseT = b => b < 0 ? `(${b})` : String(b);
/* radicand: number then variables */
function radiH(n, vs) { const v = (vs || []).map(([x, e]) => pvH(x, e)).join(""); return (n !== 1 || !v ? String(n) : "") + v; }
function radiT(n, vs) { const v = (vs || []).filter(([, e]) => e).map(([x, e]) => pvT(x, e)).join(""); return (n !== 1 || !v ? String(n) : "") + v; }

/* square-root expressions: list of terms {c, r}, r square-free (1 = whole number) */
const rx = (c, r = 1) => { const [a, t] = splitRoot(r, 2); return { c: c * a, r: t }; };
function rxMul(A, B) { const out = []; for (const a of A) for (const b of B) out.push(rx(a.c * b.c, a.r * b.r)); return out; }
function rxCombine(T) { const m = new Map(); for (const t of T) m.set(t.r, (m.get(t.r) || 0) + t.c); return [...m].filter(([, c]) => c).map(([r, c]) => ({ c, r })).sort((a, b) => a.r - b.r); }
const rxTermH = (t, first) => { const s = t.c < 0 ? (first ? "−" : " − ") : (first ? "" : " + "); const a = Math.abs(t.c); return s + (t.r === 1 ? a : (a === 1 ? "" : a) + rad(t.r)); };
const rxH = T => T.length ? T.map((t, i) => rxTermH(t, i === 0)).join("") : "0";
const rxSignedH = t => (t.c < 0 ? "−" : "+") + (t.r === 1 ? Math.abs(t.c) : (Math.abs(t.c) === 1 ? "" : Math.abs(t.c)) + rad(t.r));
const rxTermT = (t, first) => { const s = t.c < 0 ? "-" : (first ? "" : "+"); const a = Math.abs(t.c); return s + (t.r === 1 ? a : (a === 1 ? "" : a) + `√(${t.r})`); };
const rxT = T => T.length ? T.map((t, i) => rxTermT(t, i === 0)).join("") : "0";
const rxVal = T => T.reduce((s, t) => s + t.c * Math.sqrt(t.r), 0);

/* ---------- scenes ---------- */
const ch = (x, k = "b", s = "") => ({ x, k, s });
const rep = (n, f) => Array.from({ length: n }, (_, i) => f(i));
const chipH = it => `<span class="chip k-${it.k} ${it.s}">${it.x}</span>`;
function grpH(g) {
  const inner = g.rings ? g.rings.map(r => r.ring ? `<span class="ring ${r.s || ""}">${r.items.map(chipH).join("")}</span>` : r.items.map(chipH).join("")).join("") : g.items.map(chipH).join("");
  return `<span class="grp${g.plain ? " plain" : ""}"><span class="items">${inner}</span>${g.cap ? `<span class="cap">${g.cap}</span>` : ""}</span>`;
}
const rowH = row => `<div class="crow">${row.map((g, i) => (i && g.sep !== "" ? `<span class="sep">${g.sep || "×"}</span>` : "") + grpH(g)).join("")}</div>`;
const resH = r => r ? `<span class="sep">=</span><span class="cres new">${r}</span>` : "";
const RSVG = `<svg viewBox="0 0 40 100" preserveAspectRatio="none" aria-hidden="true"><path d="M2 62 L10 56 L22 98 L40 0"/></svg>`;
function sceneH(s) {
  if (!s) return "";
  switch (s.t) {
    case "chips": return (s.frac ? `<div class="cfrac">${rowH(s.rows[0])}<div class="bar"></div>${rowH(s.rows[1])}</div>` : `<div>${s.rows.map(rowH).join("")}</div>`) + resH(s.res) + (s.note ? `<p class="note">${s.note}</p>` : "");
    case "rad": {
      const ins = s.ins.map(g => g.ring ? `<span class="ring ${g.s || ""}">${g.items.map(chipH).join("")}</span>` : g.items.map(chipH).join("")).join("");
      return `<div class="rhouse"><span class="rout">${s.out.map(chipH).join("")}</span><span class="rroot">${RSVG}${s.k > 2 ? `<span class="ridx">${s.k}</span>` : ""}<span class="rin">${ins}</span></span></div>` + resH(s.res) + (s.note ? `<p class="note">${s.note}</p>` : "");
    }
    case "ladder": return `<div class="ladder">${s.rows.map((r, i) => `${i ? `<div class="lop">↓ ${s.op}</div>` : ""}<div class="lrow k-${r.k || "g"} ${r.hl ? "hl" : ""}"><span>${r.l}</span><span>=</span><span>${r.r}</span></div>`).join("")}</div>` + (s.note ? `<p class="note">${s.note}</p>` : "");
    case "sort": return `<div class="sortc">${s.cols.map(c => `<div class="k-${c.k}"><h3>${c.h}</h3>${c.lines.map(l => `<p>${l}</p>`).join("")}</div>`).join("")}</div>`;
    case "lanes": return `<div class="lanes">${s.rows.map(r => `<div class="k-${r.k}"><span class="ln">${r.l}</span><span>${r.h}</span></div>`).join("")}</div>`;
    case "area": {
      let h = `<div class="area" style="grid-template-columns: auto repeat(${s.cols.length}, minmax(0, auto))"><span class="ah">×</span>`;
      s.cols.forEach(c => h += `<span class="ah col">${c}</span>`);
      s.rows.forEach((r, i) => { h += `<span class="ah row">${r}</span>`; s.cells[i].forEach(c => h += `<span class="acell k-${c.k || "g"} ${c.s || ""}">${c.sub ? `<small>${c.sub}</small>` : ""}<span>${c.h}</span></span>`); });
      return h + "</div>" + resH(s.res) + (s.note ? `<p class="note">${s.note}</p>` : "");
    }
    case "tiles": return `<div class="tiles">${s.groups.map(g => { const neg = g.n < 0, m = Math.abs(g.n); const t = m <= 12 ? rep(m, () => `<span class="tile ${neg ? "neg" : ""}">${neg ? "−" : ""}${g.lab}</span>`).join("") : `<span class="tile ${neg ? "neg" : ""}">${m} × ${g.lab}</span>`; return `<div class="tgrp k-${g.k} ${g.s || ""}"><span class="tcount">${g.cap}</span>${t}</div>`; }).join("")}</div>` + resH(s.res) + (s.note ? `<p class="note">${s.note}</p>` : "");
    case "sq": return sqSVG(s);
    case "bar": return barSVG(s);
    case "html": return s.h;
  }
  return "";
}
/* squares: grid (n×n cells, shade m×m), plain (side √q, area q), est (lo² < n < hi²) */
function sqSVG(s) {
  const W = 420, H = 280;
  let g = "";
  if (s.m === "grid") {
    const S = 230, x0 = 80, y0 = 18, c = S / s.n;
    const sh = s.shade * c;
    g += `<rect x="${x0}" y="${y0 + S - sh}" width="${sh}" height="${sh}" style="fill: var(--pt); fill-opacity: 0.28"/>`;
    for (let i = 0; i <= s.n; i++) g += `<line x1="${x0 + i * c}" y1="${y0}" x2="${x0 + i * c}" y2="${y0 + S}" style="stroke: var(--grid-major); stroke-width: 1"/><line x1="${x0}" y1="${y0 + i * c}" x2="${x0 + S}" y2="${y0 + i * c}" style="stroke: var(--grid-major); stroke-width: 1"/>`;
    g += `<rect x="${x0}" y="${y0 + S - sh}" width="${sh}" height="${sh}" style="fill: none; stroke: var(--pt); stroke-width: 4"/>`;
    if (s.unit) g += `<rect x="${x0}" y="${y0}" width="${S}" height="${S}" style="fill: none; stroke: var(--ink); stroke-width: 2.5"/><text x="${x0 + S + 10}" y="${y0 + 22}" style="fill: var(--ink); font-size: 18px">1 × 1</text>`;
    g += `<text x="${x0 + sh / 2}" y="${y0 + S + 26}" text-anchor="middle" style="fill: var(--orange); font-size: 22px">${s.side}</text>`;
    g += `<text x="${x0 - 10}" y="${y0 + S - sh / 2 + 7}" text-anchor="end" style="fill: var(--orange); font-size: 22px">${s.side}</text>`;
    g += `<text x="${x0 + sh / 2}" y="${y0 + S - sh / 2 + 8}" text-anchor="middle" style="fill: var(--ink); font-size: 22px; paint-order: stroke; stroke: var(--sheet); stroke-width: 5px">${s.area}</text>`;
    return `<svg class="pic" viewBox="0 0 ${W} ${H}" role="img" aria-label="square with area ${s.area}">${g}</svg>`;
  }
  if (s.m === "plain") {
    const x0 = 120, y0 = 20, S = 200;
    g += `<rect x="${x0}" y="${y0}" width="${S}" height="${S}" style="fill: var(--green); fill-opacity: 0.18; stroke: var(--green); stroke-width: 4"/>`;
    g += `<text x="${x0 + S / 2}" y="${y0 + S + 34}" text-anchor="middle" style="fill: var(--orange); font-size: 26px">√${s.q}</text>`;
    g += `<text x="${x0 - 12}" y="${y0 + S / 2 + 9}" text-anchor="end" style="fill: var(--orange); font-size: 26px">√${s.q}</text>`;
    g += `<text x="${x0 + S / 2}" y="${y0 + S / 2 - 4}" text-anchor="middle" style="fill: var(--ink); font-size: 22px">area</text><text x="${x0 + S / 2}" y="${y0 + S / 2 + 28}" text-anchor="middle" style="fill: var(--green); font-size: 34px">${s.q}</text>`;
    return `<svg class="pic" viewBox="0 0 ${W} ${H}" role="img" aria-label="square with side root ${s.q} and area ${s.q}">${g}</svg>`;
  }
  /* estimate */
  const S = 210, x0 = 20, y0 = 30, base = y0 + S, k = S / s.hi;
  const sq = (side, st) => `<rect x="${x0}" y="${base - side * k}" width="${side * k}" height="${side * k}" style="${st}"/>`;
  g += sq(s.hi, "fill: var(--orange); fill-opacity: 0.1; stroke: var(--orange); stroke-width: 3");
  g += sq(Math.sqrt(s.n), "fill: var(--green); fill-opacity: 0.18; stroke: var(--green); stroke-width: 3; stroke-dasharray: 8 5");
  g += sq(s.lo, "fill: var(--pt); fill-opacity: 0.18; stroke: var(--pt); stroke-width: 3");
  g += `<text x="${x0 + 6}" y="${base - 8}" style="fill: var(--pt); font-size: 16px">${s.lo}² = ${s.lo * s.lo}</text>`;
  g += `<text x="${x0 + 6}" y="${base - S + 20}" style="fill: var(--orange); font-size: 16px">${s.hi}² = ${s.hi * s.hi}</text>`;
  g += `<text x="${x0 + Math.sqrt(s.n) * k - 6}" y="${base - Math.sqrt(s.n) * k + 20}" text-anchor="end" style="fill: var(--green); font-size: 16px">${s.n}</text>`;
  const L = 260, R = 400, ly = 160, X = v => L + (v - s.lo) * (R - L);
  g += `<line x1="${L}" y1="${ly}" x2="${R}" y2="${ly}" style="stroke: var(--ink); stroke-width: 3"/>`;
  for (let i = 0; i <= 10; i++) g += `<line x1="${X(s.lo + i / 10)}" y1="${ly - (i % 5 ? 6 : 12)}" x2="${X(s.lo + i / 10)}" y2="${ly + (i % 5 ? 6 : 12)}" style="stroke: var(--ink); stroke-width: 2"/>`;
  g += `<text x="${L}" y="${ly + 36}" text-anchor="middle" style="fill: var(--pt); font-size: 20px">${s.lo}</text><text x="${R}" y="${ly + 36}" text-anchor="middle" style="fill: var(--orange); font-size: 20px">${s.hi}</text>`;
  if (s.show) {
    const v = Math.sqrt(s.n);
    g += `<circle cx="${X(v)}" cy="${ly}" r="9" style="fill: var(--green); stroke: var(--sheet); stroke-width: 3"/><text x="${X(v)}" y="${ly - 22}" text-anchor="middle" style="fill: var(--green); font-size: 20px">√${s.n}</text>`;
  }
  return `<svg class="pic" viewBox="0 0 ${W} ${H}" role="img" aria-label="estimating the square root of ${s.n}">${g}</svg>`;
}
/* fraction exponents on one strip of L parts */
function barSVG(s) {
  const W = 440, cell = Math.min(36, 400 / s.L), x0 = 20;
  let g = "", y = 14;
  for (const row of s.rows) {
    for (let i = 0; i < s.L; i++) g += `<rect x="${x0 + i * cell}" y="${y}" width="${cell}" height="30" style="fill: ${i < row.n ? `var(--${row.k})` : "var(--sheet)"}; fill-opacity: ${i < row.n ? 0.45 : 1}; stroke: var(--grid-major); stroke-width: 1.5"/>`;
    g += `<text x="${x0 + s.L * cell + 12}" y="${y + 22}" style="fill: var(--ink); font-size: 18px">${row.lab}</text>`;
    y += 44;
  }
  return `<svg class="pic" viewBox="0 0 ${W} ${y + 4}" role="img" aria-label="fraction strips">${g}</svg>` + (s.note ? `<p class="note">${s.note}</p>` : "");
}

/* ---------- problem generators ----------
   Each returns { ask, q, a (typed answer), kind, val(V), base?, hint, steps: [{e, say, scene}] }
   The board shows q, then " = " and the step's e. */
const ST = (e, say, scene, rel) => ({ e, say, scene, rel });

function genMeaning() {
  const t = pick(["pos", "neg", "negnob", "frac"]);
  if (t === "frac") {
    const qd = ri(2, 5); let p; do p = ri(1, qd - 1); while (gcd(p, qd) !== 1);
    const n = ri(2, 3), f = fr(p, qd), qh = P(`(${f})`, n);
    const chips = rep(n, () => ch(fr(p, qd), "b"));
    return { ask: "Evaluate.", q: qh, a: `${p ** n}/${qd ** n}`, kind: "num", val: () => (p / qd) ** n, hint: `Use ${f} as a factor ${n} times: multiply the tops, multiply the bottoms.`,
      steps: [ST("", `The exponent ${n} says how many times the base ${f} is a factor.`, { t: "chips", rows: [[{ items: chips, cap: `${n} factors` }]] }),
        ST(rep(n, () => f).join(" × "), "Multiply the tops and multiply the bottoms.", { t: "chips", rows: [[{ items: chips, cap: `${n} factors` }]] }),
        ST(C("res", fr(p ** n, qd ** n)), `${rep(n, () => p).join(" × ")} = ${p ** n} and ${rep(n, () => qd).join(" × ")} = ${qd ** n}.`, { t: "chips", rows: [[{ items: chips, cap: `${n} factors` }]], res: fr(p ** n, qd ** n) })] };
  }
  const b = ri(2, t === "pos" ? 5 : 4), n = b <= 3 ? ri(2, 5) : ri(2, 3);
  if (t === "pos") {
    const v = b ** n, chips = rep(n, () => ch(b, "b"));
    return { ask: "Evaluate.", q: P(b, n), a: String(v), kind: "num", val: () => v, hint: `Write ${b} as a factor ${n} times, then multiply.`,
      steps: [ST("", `The exponent ${n} says how many times the base ${b} is a factor.`, { t: "chips", rows: [[{ items: chips, cap: `${n} factors` }]] }),
        ST(rep(n, () => b).join(" × "), "Write the base as a factor that many times.", { t: "chips", rows: [[{ items: chips, cap: `${n} factors` }]] }),

/* monomial c·x^a·y^b; final form with positive exponents */
function monoH(c, X, a, Y, b) { const v = pvH(X, a) + pvH(Y, b); return (c[1] !== 1 ? FH(c) : (v ? coefH(c[0]) : M(c[0]))) + v; }
function monoPosH(c, X, a, Y, b) {
  const top = pvH(X, a > 0 ? a : 0) + pvH(Y, b > 0 ? b : 0), bot = pvH(X, a < 0 ? -a : 0) + pvH(Y, b < 0 ? -b : 0);
  const n = Math.abs(c[0]), sg = c[0] < 0 ? "−" : "";
  const T = (n !== 1 || !top ? n : "") + top, D = (c[1] !== 1 || !bot ? c[1] : "") + bot;
  return sg + (D === 1 ? T : fr(T, D));
}
function monoPosT(c, X, a, Y, b) {
  const top = [pvT(X, a > 0 ? a : 0), pvT(Y, b > 0 ? b : 0)].join(""), bot = [pvT(X, a < 0 ? -a : 0), pvT(Y, b < 0 ? -b : 0)].join("");
  const n = Math.abs(c[0]), sg = c[0] < 0 ? "-" : "";
  const T = (n !== 1 || !top ? n : "") + top, D = (c[1] !== 1 || !bot ? c[1] : "") + bot;
  return sg + (D === 1 ? T : `(${T})/(${D})`);
}
function genVarLaws() {
  const [X, Y] = pick([["x", "y"], ["a", "b"], ["m", "n"]]);
  const nz = (lo, hi) => { let v; do v = ri(lo, hi); while (!v); return v; };
  for (;;) {
    const form = pick(["prod", "pow", "quot"]);
    let q, cf, ex, ey, cols, say1;
    if (form === "prod") {
      const c1 = nz(-5, 6), c2 = nz(-4, 5), a = nz(-3, 5), b = nz(-3, 4), d = nz(-4, 4), e = nz(-3, 4);
      cf = Q(c1 * c2); ex = a + d; ey = b + e;
      q = `(${monoH(Q(c1), X, a, Y, b)})(${monoH(Q(c2), X, d, Y, e)})`;
      cols = [[`${M(c1)} × ${pM(c2)}`, `= ${M(cf[0])}`], [`${pvH(X, a) || "1"} × ${P(xi(X), M(d))}`, `= ${P(xi(X), `${M(a)} + ${pM(d)}`)}`, `= ${P(xi(X), M(ex))}`], [`${P(xi(Y), M(b))} × ${P(xi(Y), M(e))}`, `= ${P(xi(Y), `${M(b)} + ${pM(e)}`)}`, `= ${P(xi(Y), M(ey))}`]];
      say1 = "Sort by base. Multiply the numbers. Same base: add the exponents.";
    } else if (form === "pow") {
      const c = pick([2, 3, -2]), a = nz(-3, 4), b = nz(-2, 3), n = pick([2, 3, -2]);
      if (n === 3 && Math.abs(c) === 3) continue;
      cf = n > 0 ? Q(c ** n) : Q(1, c ** -n); ex = a * n; ey = b * n;
      q = P(`(${monoH(Q(c), X, a, Y, b)})`, M(n));
      cols = [[P(pM(c), M(n)), `= ${FH(cf)}`], [P(`(${P(xi(X), M(a))})`, M(n)), `= ${P(xi(X), `${M(a)} × ${pM(n)}`)}`, `= ${P(xi(X), M(ex))}`], [P(`(${P(xi(Y), M(b))})`, M(n)), `= ${P(xi(Y), `${M(b)} × ${pM(n)}`)}`, `= ${P(xi(Y), M(ey))}`]];
      say1 = "Every factor in the brackets gets the exponent. Power of a power: multiply.";
    } else {
      const c2 = pick([2, 3, 4, -2, 6]), c1 = c2 * nz(-4, 5) * pick([1, 1, 1, 2]) / pick([1, 1, 2]);
      if (!Number.isInteger(c1)) continue;
      const a = nz(-3, 6), b = nz(-2, 5), d = nz(-3, 5), e = nz(-2, 4);
      cf = Q(c1, c2); ex = a - d; ey = b - e;
      q = fr(monoH(Q(c1), X, a, Y, b), monoH(Q(c2), X, d, Y, e));
      cols = [[`${M(c1)} ÷ ${pM(c2)}`, `= ${FH(cf)}`], [`${P(xi(X), M(a))} ÷ ${P(xi(X), M(d))}`, `= ${P(xi(X), `${M(a)} − ${pM(d)}`)}`, `= ${P(xi(X), M(ex))}`], [`${P(xi(Y), M(b))} ÷ ${P(xi(Y), M(e))}`, `= ${P(xi(Y), `${M(b)} − ${pM(e)}`)}`, `= ${P(xi(Y), M(ey))}`]];
      say1 = "Sort by base. Divide the numbers. Same base: subtract the exponents.";
    }
    if (!ex && !ey) continue;
    if (Math.abs(ex) > 12 || Math.abs(ey) > 12 || Math.abs(cf[0]) > 200) continue;
    const sortS = n => ({ t: "sort", cols: [{ h: "Numbers", k: "p", lines: cols[0].slice(0, n ? 9 : 1) }, { h: xi(X), k: "b", lines: cols[1].slice(0, n ? 9 : 1) }, { h: xi(Y), k: "o", lines: cols[2].slice(0, n ? 9 : 1) }] });
    const fin = monoPosH(cf, X, ex, Y, ey), mid = monoH(cf, X, ex, Y, ey);
    const steps = [ST("", "Sort the factors by base.", sortS(0)), ST(mid, say1, sortS(1))];
    if (ex < 0 || ey < 0 || cf[1] !== 1) steps.push(ST(C("res", fin), ex < 0 || ey < 0 ? "Negative exponents move to the denominator and become positive." : "Simplify the coefficient.", sortS(1)));
    else steps[1].e = C("res", mid);
    return { ask: "Simplify. Use positive exponents only.", q, a: monoPosT(cf, X, ex, Y, ey), kind: "mono", val: V => Qv(cf) * V[X] ** ex * V[Y] ** ey, hint: "Sort by base. Multiply: add exponents. Divide: subtract. Power: multiply.", steps };
  }
}

  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
