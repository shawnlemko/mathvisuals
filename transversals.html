<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<!-- Parallel Lines and Transversals (grades 7-9, Geometry; Shawn 2026-10-15). Modeled on Triangle Congruence.
     Learn: pick an angle pair type, Next step reveals the first angle (blue), the second (orange), the shape
     they make (purple: F, Z, C, X, straight line), then the student drags the transversal and sees the
     relationship hold. Practice: name the pair, say how they relate, then find the second angle.
     Challenge: multi-step number-only puzzles, no algebra (Shawn 2026-10-15): an angle chain, a bowtie, a triangle, a bent path, two pairs of
     parallel lines); Show me reveals the work one line at a time. -->
<style>
:root { --purple: #7a3fc4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --purple: #b98cff; } }
:root[data-theme="dark"] { --purple: #b98cff; }

.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }

.rel button { font-size: 1.2rem; padding: 10px 8px; }
button.right { background: var(--green); color: var(--sheet); border-color: var(--green); }
button.wrong { background: var(--warn); color: var(--sheet); border-color: var(--warn); }
.types button:disabled, .rel button:disabled { cursor: default; }

.ans input.bad { border-color: var(--warn); }
.ans button { font-size: 1.1rem; padding: 9px 16px; background: var(--pt); color: var(--sheet); border-color: var(--pt); }

      <div class="nav">
        <button type="button" id="back">Back</button>
        <button type="button" id="next">Next step</button>
      </div>
      <div class="verdict-card" id="verdict" hidden></div>
    </div>

    <!-- PRACTICE -->
    <div class="panel" id="pracP" hidden>
      <div class="card score"><span class="label" id="pnum">Question 1</span><span>Score <b id="pscore">0 / 0</b></span><button type="button" id="pskip">New question</button></div>
      <div class="part" id="p1">
        <p class="q">What kind of angle pair?</p>
        <div class="types" id="types"></div>
        <p class="done-line" id="p1done" hidden></p>
      </div>
      <div class="part" id="p2" hidden>
        <p class="q">How are they related?</p>
        <div class="rel" id="rels"></div>
        <p class="done-line" id="p2done" hidden></p>
      </div>
      <div class="part" id="p3" hidden>
        <p class="q" id="p3q"></p>
        <div class="ans"><span class="lbl" id="p3lbl"></span><input id="p3in" inputmode="numeric" autocomplete="off" aria-label="Your answer"><span class="lbl">°</span><button type="button" id="p3check">Check</button></div>
        <div class="work" id="p3work"></div>
      </div>
      <div class="help" id="phelp"><button type="button" id="phint">Hint</button><button type="button" id="pshow">Show me</button></div>
      <p class="fb" id="pfb" aria-live="polite"></p>
      <button type="button" class="next-btn" id="pnext" hidden>Next question</button>
    </div>

    <!-- CHALLENGE -->
    <div class="panel" id="chalP" hidden>
      <div class="card score"><span class="label" id="cnum">Puzzle 1</span><span>Score <b id="cscore">0 / 0</b></span><button type="button" id="cskip">New puzzle</button></div>
      <div class="card">
        <p class="ctitle" id="ctitle"></p>
        <p class="cq" id="cq"></p>
        <div class="ans" style="margin-top: 6px"><span class="lbl" id="clbl"></span><input id="cin" inputmode="numeric" autocomplete="off" aria-label="Your answer"><span class="lbl" id="cunit">°</span><button type="button" id="ccheck">Check</button></div>
      </div>
      <div class="help"><button type="button" id="chint">Hint</button><button type="button" id="cshow">Show me</button></div>
      <p class="fb" id="cfb" aria-live="polite"></p>
      <div class="work" id="cwork"></div>
      <button type="button" class="next-btn" id="cnext" hidden>Next puzzle</button>
    </div>
  </div>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const svg = $("svg");
  const W = 1000, H = 640, D = Math.PI / 180;
  const el = (tag, attrs, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const P = (x, y) => ({ x, y });
  const sub = (p, q) => P(p.x - q.x, p.y - q.y), add = (p, q) => P(p.x + q.x, p.y + q.y), mul = (p, k) => P(p.x * k, p.y * k);
  const len = p => Math.hypot(p.x, p.y), unit = p => mul(p, 1 / (len(p) || 1));
  const neg = p => mul(p, -1);
  // Direction at angle a (degrees, counterclockwise from the right) in screen coordinates (y down).
  const dirDeg = a => P(Math.cos(a * D), -Math.sin(a * D));
  const MINUS = "−";
  const num = n => (n < 0 ? MINUS + (-n) : String(n));
  const parseNum = s => { const t = s.replace(/[°\s]/g, "").replace(/[−–]/g, "-"); return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN; };

  // ---------- Drawing helpers ----------
  function line(p, q, cls) { return el("line", { x1: p.x, y1: p.y, x2: q.x, y2: q.y, class: cls }); }
  function arcPath(v, d1, d2, r) {
    const a1 = Math.atan2(d1.y, d1.x), a2 = Math.atan2(d2.y, d2.x);
    let d = a2 - a1; while (d <= -Math.PI) d += 2 * Math.PI; while (d > Math.PI) d -= 2 * Math.PI;
    const s = P(v.x + r * Math.cos(a1), v.y + r * Math.sin(a1)), e = P(v.x + r * Math.cos(a1 + d), v.y + r * Math.sin(a1 + d));
    return `M${v.x} ${v.y} L${s.x} ${s.y} A${r} ${r} 0 0 ${d > 0 ? 1 : 0} ${e.x} ${e.y} Z`;
  }
  const wedge = (v, d1, d2, r, cls) => el("path", { d: arcPath(v, d1, d2, r), class: "wd " + cls });
  // Point inside the angle, far enough out to clear both sides.
  function inAngle(v, d1, d2, deg, r) {
    const rr = Math.min(170, Math.max(r, (r * 0.42) / Math.sin((deg / 2) * D)));
    return add(v, mul(unit(add(unit(d1), unit(d2))), rr));
  }
  function chip(c, text, cls) {
    const g = el("g", {});
    const w = 22 + 17 * [...text].length;
    el("rect", { x: c.x - w / 2, y: c.y - 22, width: w, height: 44, rx: 10, class: "chip-bg " + cls }, g);
    el("text", { x: c.x, y: c.y + 1, class: "chip " + cls }, g).textContent = text;
    return g;
  }
  function ndot(c, text, cls) {
    el("circle", { cx: c.x, cy: c.y, r: 23, class: "ndot " + cls });
    el("text", { x: c.x, y: c.y + 1, class: "ntxt" }).textContent = text;
  }
  // Parallel marks: count chevrons pointing along d, centred at p.
  function chevrons(p, d, count) {
    const n = P(-d.y, d.x);
    for (let i = 0; i < count; i++) {
      const c = add(p, mul(d, (i - (count - 1) / 2) * 15));
      const tip = add(c, mul(d, 8)), b1 = add(sub(c, mul(d, 8)), mul(n, 11)), b2 = sub(sub(c, mul(d, 8)), mul(n, 11));
      el("path", { d: `M${b1.x} ${b1.y} L${tip.x} ${tip.y} L${b2.x} ${b2.y}`, class: "chev" });
    }
  }
  function vname(p, away, name) {
    const q = add(p, mul(unit(sub(p, away)), 30));
    el("circle", { cx: p.x, cy: p.y, r: 6, class: "vdot" });
    el("text", { x: q.x, y: q.y, class: "vname" }).textContent = name;
  }

  // ---------- The standard figure: two parallel lines and one transversal ----------
  // Angles are numbered 1 to 8: at each crossing 1 above-left, 2 above-right, 3 below-left, 4 below-right
  // (5 to 8 at the bottom crossing). With the transversal at theta, angles 2, 3, 6, 7 are theta; 1, 4, 5, 8 are 180 − theta.
  const UP = [1, 2, 5, 6], SMALLSET = [2, 3, 6, 7], INSIDE = [3, 4, 5, 6];
  function figure(theta, phi = 0, gap = 300, cx = 500, cy = 320) {
    const c = P(cx, cy);
    const rotV = v => P(v.x * Math.cos(phi * D) + v.y * Math.sin(phi * D), -v.x * Math.sin(phi * D) + v.y * Math.cos(phi * D));
    const rot = p => add(c, rotV(sub(p, c)));
    const cot = Math.cos(theta * D) / Math.sin(theta * D);
    const f = { theta, phi, gap, c, rot };
    f.Ld = rotV(P(1, 0)); f.Tu = rotV(dirDeg(theta));
    f.X = [rot(P(cx + (gap / 2) * cot, cy - gap / 2)), rot(P(cx - (gap / 2) * cot, cy + gap / 2))];
    f.lines = [[rot(P(cx - 460, cy - gap / 2)), rot(P(cx + 460, cy - gap / 2))], [rot(P(cx - 460, cy + gap / 2)), rot(P(cx + 460, cy + gap / 2))]];
    const tl = gap / 2 / Math.sin(theta * D) + 130;
    f.T = [add(c, mul(f.Tu, tl)), sub(c, mul(f.Tu, tl))];
    f.vtx = i => f.X[i <= 4 ? 0 : 1];
    f.rays = i => [i % 2 ? neg(f.Ld) : f.Ld, UP.includes(i) ? f.Tu : neg(f.Tu)];
    f.meas = i => (SMALLSET.includes(i) ? theta : 180 - theta);
    f.lab = (i, r = 70) => { const [a, b] = f.rays(i); return inAngle(f.vtx(i), a, b, f.meas(i), r); };
    return f;
  }
  function drawFigure(f, tword) {
    for (const [a, b] of f.lines) { line(a, b, "pl"); chevrons(add(a, mul(f.Ld, 110)), f.Ld, 1); }
    line(f.T[0], f.T[1], "tl");
    if (tword) {
      const p = f.T[1];
      const t = el("text", { x: p.x + 16, y: p.y + 6, class: "tword" }); t.textContent = "transversal";
    }
  }
  function drawAngle(f, i, cls, r = 58) { const [a, b] = f.rays(i); wedge(f.vtx(i), a, b, r, cls); }
  // The purple shape two angles make (F, Z, C, X or a straight line): both sides of each angle, plus the
  // piece of transversal between the crossings.
  function drawShape(f, a, b) {
    const g = el("g", {});
    for (const i of [a, b]) for (const d of f.rays(i)) el("line", { x1: f.vtx(i).x, y1: f.vtx(i).y, x2: f.vtx(i).x + d.x * 170, y2: f.vtx(i).y + d.y * 170, class: "shape" }, g);
    if ((a <= 4) !== (b <= 4)) el("line", { x1: f.X[0].x, y1: f.X[0].y, x2: f.X[1].x, y2: f.X[1].y, class: "shape" }, g);
  }

  // ---------- Pair types ----------
  const TYPES = {
    corr: { name: "Corresponding", eq: true, pairs: [[1, 5], [2, 6], [3, 7], [4, 8]], key: "Same spot at each crossing.", rule: "Corresponding angles are equal." },
    altI: { name: "Alternate interior", eq: true, pairs: [[3, 6], [4, 5]], key: "Inside the parallel lines, on opposite sides of the transversal.", rule: "Alternate interior angles are equal." },
    altE: { name: "Alternate exterior", eq: true, pairs: [[1, 8], [2, 7]], key: "Outside the parallel lines, on opposite sides of the transversal.", rule: "Alternate exterior angles are equal." },
    vert: { name: "Vertically opposite", eq: true, pairs: [[1, 4], [2, 3], [5, 8], [6, 7]], key: "Across from each other where two lines cross.", rule: "Vertically opposite angles are equal." },
    coI: { name: "Co-interior", also: "same-side interior", eq: false, pairs: [[3, 5], [4, 6]], key: "Inside the parallel lines, on the same side of the transversal.", rule: "Co-interior angles add to 180°." },
    lin: { name: "Linear pair", eq: false, pairs: [[1, 2], [3, 4], [5, 6], [7, 8], [1, 3], [2, 4], [5, 7], [6, 8]], key: "Side by side. Together they make a straight line.", rule: "Angles in a linear pair add to 180°." },
  };
  const ORDER = ["corr", "altI", "altE", "vert", "coI", "lin"];
  const typeLabel = t => `<span>${TYPES[t].name}</span>` + (TYPES[t].also ? `<small>(${TYPES[t].also})</small>` : "");
  const typeOf = (a, b) => ORDER.find(t => TYPES[t].pairs.some(([x, y]) => (x === a && y === b) || (x === b && y === a)));
  const side = i => (i % 2 ? "left" : "right");

  // ================= LEARN =================
  const L = { t: "corr", k: 0, step: 0, theta: 62 };
  function learnSteps() {
    const [a, b] = TYPES[L.t].pairs[L.k];
    const where = i => `∠${i} is ${INSIDE.includes(i) ? "inside" : "outside"} the parallel lines, ${side(i)} of the transversal.`;
    const spot = i => `∠${i} is ${UP.includes(i) ? "above" : "below"} the ${i <= 4 ? "top" : "bottom"} line, ${side(i)} of the transversal.`;
    const drag = TYPES[L.t].eq ? "Drag the orange dot to tilt the transversal. Watch the two angles." : "Drag the orange dot to tilt the transversal. Add the two angles.";
    return {
      corr: [spot(a), `∠${b} is in the same spot at the other crossing.`, "Together they make an F shape. It can be flipped or turned.", drag],
      altI: [where(a), `∠${b} is also inside, but on the other side of the transversal.`, "Together they make a Z shape. It can be flipped or turned.", drag],
      altE: [where(a), `∠${b} is also outside, but on the other side of the transversal.`, "Alternate means opposite sides. Exterior means outside.", drag],
      vert: [`∠${a} is at the ${a <= 4 ? "top" : "bottom"} crossing.`, `∠${b} is across from it, at the same crossing.`, "The two lines make an X. The opposite angles match.", drag],
      coI: [where(a), `∠${b} is also inside, on the same side of the transversal.`, "Together they make a C shape. It can be flipped or turned.", drag],
      lin: [spot(a), `∠${b} is right beside it. They share one side.`, "Their other sides make a straight line. A straight line is 180°.", drag],
    }[L.t];
  }

  function drawLearn() {
    svg.textContent = "";
    const f = figure(L.theta), [a, b] = TYPES[L.t].pairs[L.k], st = L.step, last = st === 3;
    if (st >= 2) drawShape(f, a, b);
    drawFigure(f, true);
    drawAngle(f, a, "B");
    if (st >= 1) drawAngle(f, b, "O");
    for (let i = 1; i <= 8; i++) {
      const p = f.lab(i);
      if (i === a) ndot(p, i, "B");
      else if (i === b && st >= 1) ndot(p, i, "O");
      else el("text", { x: p.x, y: p.y, class: "ngrey" }).textContent = i;
    }
    if (last) {
      chip(f.lab(a, 135), f.meas(a) + "°", "B");
      chip(f.lab(b, 135), f.meas(b) + "°", "O");
      handle(add(f.c, mul(f.Tu, f.gap / 2 / Math.sin(f.theta * D) + 75)));
    }
    const h = $("hint");
    if (!last) h.textContent = "The > marks mean the two lines are parallel. Press Next step.";
    else if (TYPES[L.t].eq) h.textContent = `∠${a} = ${f.meas(a)}° and ∠${b} = ${f.meas(b)}°. Equal!`;
    else h.textContent = `∠${a} + ∠${b} = ${f.meas(a)}° + ${f.meas(b)}° = 180°`;
  }

  function handle(p) {
    const g = el("g", { class: "handle", tabindex: 0, role: "slider", "aria-label": "Tilt the transversal", "aria-valuenow": L.theta });
    el("circle", { cx: p.x, cy: p.y, r: 32, fill: "transparent" }, g);
    el("circle", { cx: p.x, cy: p.y, r: 22, class: "ring" }, g);
    el("circle", { cx: p.x, cy: p.y, r: 12, class: "dot" }, g);
    g.addEventListener("pointerdown", e => startDrag(e, g));
    g.addEventListener("keydown", e => {
      if (e.key === "ArrowRight" || e.key === "ArrowDown") { setTheta(L.theta - 1); e.preventDefault(); }
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") { setTheta(L.theta + 1); e.preventDefault(); }
      requestAnimationFrame(() => svg.querySelector(".handle")?.focus());
    });
  }
  function setTheta(t) { L.theta = Math.max(25, Math.min(155, Math.round(t))); drawLearn(); }
  function startDrag(e, g) {
    e.preventDefault();
    g.classList.add("drag");
    const move = ev => {
      const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      const q = pt.matrixTransform(svg.getScreenCTM().inverse());
      let t = Math.atan2(320 - q.y, q.x - 500) / D;
      if (t < 0) t += 180;
      setTheta(t);
    };
    const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up); };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
  }

  function renderLearn() {
    const T = TYPES[L.t], [a, b] = T.pairs[L.k], steps = learnSteps();
    document.querySelectorAll(".cbtns button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.t === L.t)));
    $("pname").innerHTML = `<span>${T.name}</span> <span class="pair-ab"><span class="c-blue">∠${a}</span> <span class="c-orange">∠${b}</span></span>`;
    $("pkey").textContent = T.key;
    $("another").hidden = T.pairs.length < 2;
    $("steps").innerHTML = steps.slice(0, L.step + 1).map((t, i) => `<li class="step ${i === L.step ? "now" : "old"}"><span class="n">${i + 1}</span><span>${t}</span></li>`).join("");
    $("back").disabled = L.step === 0;
    $("next").disabled = L.step === 3;
    const v = $("verdict");
    v.hidden = L.step !== 3;
    v.className = "verdict-card" + (T.eq ? "" : " sup");
    v.innerHTML = `<span class="tag">${T.eq ? "Equal" : "Add to 180°"}</span><span>${T.rule}</span>`;
    drawLearn();
  }
  const setType = t => { L.t = t; L.k = 0; L.step = 0; renderLearn(); };
  const goStep = n => { L.step = Math.max(0, Math.min(3, n)); renderLearn(); };
  $("eqBtns").innerHTML = ["corr", "altI", "altE", "vert"].map(t => `<button type="button" data-t="${t}">${typeLabel(t)}</button>`).join("");
  $("supBtns").innerHTML = ["coI", "lin"].map(t => `<button type="button" data-t="${t}">${typeLabel(t)}</button>`).join("");
  document.querySelectorAll(".cbtns button").forEach(x => x.addEventListener("click", () => setType(x.dataset.t)));
  $("next").addEventListener("click", () => goStep(L.step + 1));
  $("back").addEventListener("click", () => goStep(L.step - 1));
  $("another").addEventListener("click", () => { L.k = (L.k + 1) % TYPES[L.t].pairs.length; L.step = 0; renderLearn(); });

  // ---------- Work lines (shared by Practice and Challenge) ----------
  function workHTML(rows, n, all) {
    return rows.slice(0, n).map((r, i) => {
      const now = i === n - 1 ? " now" : "", res = all && i === rows.length - 1 ? " res" : "";
      if (r.text) return `<div class="wide${now}">${r.text}</div>`;
      return `<div class="L${now}">${r.L}</div><div class="Q${now}">=</div><div class="Rt${now}${res}">${r.R}</div><div class="note${now}">${r.note || ""}</div>`;
    }).join("");
  }

  // ================= PRACTICE =================
  const PS = { n: 0, right: 0, total: 0 };
  let pq = null;
  function newPractice() {
    PS.n++;
    const t = pick(ORDER);
    const pr = shuffle(pick(TYPES[t].pairs));
    let theta; do { theta = rnd(35, 145); } while (Math.abs(theta - 90) < 12);
    const phi = pick([0, 0, rnd(-28, 28), rnd(-28, 28), 180 + rnd(-20, 20)]);
    const labs = shuffle([1, 2, 3, 4, 5, 6, 7, 8]);
    pq = { t, a: pr[0], b: pr[1], f: figure(theta, phi, rnd(260, 320)), la: labs[0], lb: labs[1], part: 1, hint: false, shown: false, first: true, done: false };
    $("p1").hidden = false; $("p2").hidden = true; $("p3").hidden = true;
    $("types").hidden = false; $("p1done").hidden = true; $("rels").hidden = false; $("p2done").hidden = true;
    $("types").innerHTML = ORDER.map(x => `<button type="button" data-t="${x}">${typeLabel(x)}</button>`).join("");
    $("types").querySelectorAll("button").forEach(x => x.addEventListener("click", () => answerType(x.dataset.t)));
    $("rels").innerHTML = `<button type="button" data-r="eq">Equal</button><button type="button" data-r="sup">Add to 180°</button>`;
    $("rels").querySelectorAll("button").forEach(x => x.addEventListener("click", () => answerRel(x.dataset.r === "eq")));
    $("p3in").value = ""; $("p3in").className = ""; $("p3work").innerHTML = "";
    $("pfb").innerHTML = ""; $("pnext").hidden = true; $("phelp").hidden = false;
    renderPracScore(); drawPractice();
  }
  const renderPracScore = () => { $("pnum").textContent = "Question " + PS.n; $("pscore").textContent = PS.right + " / " + PS.total; };
  function drawPractice() {
    svg.textContent = "";
    const f = pq.f;
    if (pq.hint && pq.part === 1 || pq.part > 1) drawShape(f, pq.a, pq.b);
    drawFigure(f, false);
    drawAngle(f, pq.a, "B"); drawAngle(f, pq.b, "O");
    ndot(f.lab(pq.a), pq.la, "B"); ndot(f.lab(pq.b), pq.lb, "O");
    if (pq.part >= 3) {
      chip(f.lab(pq.a, 135), f.meas(pq.a) + "°", "B");
      chip(f.lab(pq.b, 135), pq.done ? f.meas(pq.b) + "°" : "?", "O");
    }
    $("hint").textContent = "The > marks mean the two lines are parallel.";
  }
  // One-line clue about where the two angles sit.
  function clue() {
    const { a, b } = pq, same = (a <= 4) === (b <= 4);
    if (same) return pq.t === "vert" ? "Both angles are at the same crossing. They are across from each other." : "Both angles are at the same crossing. They share a side.";
    const ins = [a, b].filter(i => INSIDE.includes(i)).length;
    const s1 = ins === 2 ? "Both angles are inside the parallel lines." : ins === 0 ? "Both angles are outside the parallel lines." : "One angle is inside the parallel lines and one is outside.";
    return s1 + (a % 2 === b % 2 ? " They are on the same side of the transversal." : " They are on opposite sides of the transversal.");
  }
  function answerType(t) {
    if (pq.part !== 1) return;
    const good = t === pq.t;
    if (pq.first) { PS.total++; if (good) PS.right++; }
    pq.first = true;
    $("types").querySelectorAll("button").forEach(x => { x.disabled = true; if (x.dataset.t === pq.t) x.classList.add("right"); else if (x.dataset.t === t) x.classList.add("wrong"); });
    $("pfb").innerHTML = `<span class="head ${good ? "yes" : "no"}">${good ? "Yes!" : "Not quite."} ${TYPES[pq.t].name}.</span><span>${TYPES[pq.t].key}</span>`;
    pq.part = 2; pq.hint = false;
    renderPracScore();
    setTimeout(() => {
      if (pq.part !== 2) return;
      $("types").hidden = true;
      const d = $("p1done"); d.hidden = false;
      d.innerHTML = `<span class="${good ? "ok" : "no"}">${good ? "✓" : "✗"}</span> <span>${TYPES[pq.t].name}</span>`;
      $("p2").hidden = false;
    }, 900);
    drawPractice();
  }
  function answerRel(eq) {
    if (pq.part !== 2) return;
    const T = TYPES[pq.t], good = eq === T.eq;
    if (pq.first) { PS.total++; if (good) PS.right++; }
    pq.first = true;
    $("rels").querySelectorAll("button").forEach(x => { x.disabled = true; const isEq = x.dataset.r === "eq"; if (isEq === T.eq) x.classList.add("right"); else if (isEq === eq) x.classList.add("wrong"); });
    $("pfb").innerHTML = `<span class="head ${good ? "yes" : "no"}">${good ? "Yes!" : "Not quite."}</span><span>${T.rule}</span>`;
    pq.part = 3; pq.hint = false;
    renderPracScore();
    setTimeout(() => {
      if (pq.part !== 3) return;
      $("rels").hidden = true;
      const d = $("p2done"); d.hidden = false;
      d.innerHTML = `<span class="${good ? "ok" : "no"}">${good ? "✓" : "✗"}</span> <span>${T.eq ? "Equal" : "Add to 180°"}</span>`;
      $("p3").hidden = false;
      $("p3q").textContent = `∠${pq.la} = ${pq.f.meas(pq.a)}°. Find ∠${pq.lb}.`;
      $("p3lbl").textContent = `∠${pq.lb} =`;
      $("pfb").innerHTML = "";
      $("p3in").focus();
      drawPractice();
    }, 900);
  }
  function p3rows() {
    const T = TYPES[pq.t], ma = pq.f.meas(pq.a), mb = pq.f.meas(pq.b), A = `∠${pq.la}`, B = `∠${pq.lb}`;
    if (T.eq) return [{ L: B, R: A, note: T.rule }, { L: "", R: mb + "°" }];
    return [{ L: `${A} + ${B}`, R: "180°", note: T.rule }, { L: B, R: `180° ${MINUS} ${A}`, note: "Subtract from 180°" }, { L: "", R: `180° ${MINUS} ${ma}°` }, { L: "", R: mb + "°" }];
  }
  function finishP3(good) {
    pq.done = true; pq.part = 4;
    const rows = p3rows();
    $("p3work").innerHTML = workHTML(rows, rows.length, true);
    $("p3in").value = pq.f.meas(pq.b); $("p3in").className = "good";
    $("pfb").innerHTML = good ? `<span class="head yes">Yes! ∠${pq.lb} = ${pq.f.meas(pq.b)}°</span>` : "";
    $("phelp").hidden = true; $("pnext").hidden = false;
    renderPracScore(); drawPractice();
  }
  function checkP3() {
    if (pq.part !== 3) return;
    const v = parseNum($("p3in").value);
    if (isNaN(v)) { $("pfb").innerHTML = `<span class="head no">Type a number.</span>`; return; }
    const good = v === pq.f.meas(pq.b);
    if (pq.first) { PS.total++; if (good) PS.right++; pq.first = false; }
    if (good) { finishP3(true); return; }
    $("p3in").className = "bad";
    const ma = pq.f.meas(pq.a);
    const extra = TYPES[pq.t].eq && v === 180 - ma ? " These angles are equal." : !TYPES[pq.t].eq && v === ma ? " These angles add to 180°." : "";
    $("pfb").innerHTML = `<span class="head no">Not quite. Try again.</span><span>${extra}</span>`;
    renderPracScore();
  }
  $("p3check").addEventListener("click", checkP3);
  $("p3in").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); if (pq.part === 3) checkP3(); else if (pq.done) newPractice(); } });
  $("phint").addEventListener("click", () => {
    pq.hint = true;
    const h = pq.part === 1 ? clue() + " Look at the purple shape."
      : pq.part === 2 ? "Is one angle small and the other big? Then they add to 180°. If they look the same, they are equal."
      : TYPES[pq.t].rule;
    $("pfb").innerHTML = `<span class="head hint">Hint</span><span>${h}</span>`;
    drawPractice();
  });
  $("pshow").addEventListener("click", () => {
    if (pq.part === 1) { pq.first = false; PS.total++; answerType(pq.t); }
    else if (pq.part === 2) { pq.first = false; PS.total++; answerRel(TYPES[pq.t].eq); }
    else if (pq.part === 3) { if (pq.first) { PS.total++; pq.first = false; } finishP3(false); }
  });
  $("pnext").addEventListener("click", newPractice);
  $("pskip").addEventListener("click", newPractice);

  // ================= CHALLENGE =================
  // Each puzzle: { title, ask (label), unit, answer, rows (work), hint, draw(shown, hint) }.
  // Two angles with no name of their own: a third angle links them. Numbers only.
  function genChain() {
    let theta; do { theta = rnd(50, 130); } while (Math.abs(theta - 90) < 8);
    const f = figure(theta, pick([0, 0, rnd(-10, 10)]));
    const [a, b] = shuffle(pick([[1, 6], [1, 7], [2, 5], [2, 8], [3, 8], [4, 7]]));
    // The linking angle: prefer a first step that is corresponding or vertically opposite.
    const links = [1, 2, 3, 4, 5, 6, 7, 8].filter(c => c !== a && c !== b && typeOf(a, c) && typeOf(c, b));
    const c = links.find(k => ["corr", "vert"].includes(typeOf(a, k))) ?? links[0];
    const t1 = TYPES[typeOf(a, c)], t2 = TYPES[typeOf(c, b)];
    const ga = f.meas(a), vc = f.meas(c), x = f.meas(b);
    const rows = [
      ...(t1.eq ? [{ L: `∠${c}`, R: ga + "°", note: t1.rule }] : [{ L: `∠${c}`, R: `180° ${MINUS} ${ga}°`, note: t1.rule }, { L: "", R: vc + "°" }]),
      ...(t2.eq ? [{ L: "x", R: `∠${c}`, note: t2.rule }, { L: "", R: x + "°" }]
        : [{ L: "x", R: `180° ${MINUS} ∠${c}`, note: t2.rule }, { L: "", R: `180° ${MINUS} ${vc}°` }, { L: "", R: x + "°" }]),
    ];
    const cDone = t1.eq ? 1 : 2;
    return {
      title: "Angle chain", q: "Find x.", ask: "x =", unit: "°", answer: x, rows,
      tip: `These two angles have no name together. Use ∠${c} to link them.`,
      draw(shown, hint) {
        if (hint || shown >= 1) drawShape(f, a, c);
        drawFigure(f, false);
        drawAngle(f, a, "B"); drawAngle(f, b, "O");
        if (hint || shown >= 1) { drawAngle(f, c, "P"); ndot(f.lab(c), c, "P"); if (shown >= cDone) chip(f.lab(c, 150), vc + "°", "P"); }
        chip(f.lab(a, 120), ga + "°", "B");
        chip(f.lab(b, 120), shown >= rows.length ? x + "°" : "x", "O");
      },
    };
  }
  // Two crossing transversals make a bowtie between the parallel lines. Ask for the bottom angle at O.
  function genBowtie() {
    let a, b, x;
    do { a = rnd(40, 75); b = rnd(40, 75); x = 180 - a - b; } while (x < 35);
    const e = 180 - a, yT = 110, yB = 530, h1 = rnd(170, 230), h2 = yB - yT - h1;
    const flip = Math.random() < 0.5, X = v => (flip ? W - v : v);
    const cot = d => 1 / Math.tan(d * D);
    const O = P(X(500), yT + h1);
    const A = P(X(500 - h1 * cot(a)), yT), B = P(X(500 + h1 * cot(b)), yT);
    const Dp = P(X(500 + h2 * cot(a)), yB), C = P(X(500 - h2 * cot(b)), yB);
    const right = P(flip ? -1 : 1, 0), left = neg(right);
    const ext = (p, q, k) => add(q, mul(unit(sub(q, p)), k));
    const rows = [
      { L: "∠OAB", R: `180° ${MINUS} ${e}°`, note: "Angles in a linear pair add to 180°." },
      { L: "", R: a + "°" },
      { L: "∠ODC", R: a + "°", note: "Alternate interior angles are equal." },
      { L: "x", R: `180° ${MINUS} ${a}° ${MINUS} ${b}°`, note: "The angles in a triangle add to 180°." },
      { L: "", R: x + "°" },
    ];
    return {
      title: "Bowtie", q: "Find x.", ask: "x =", unit: "°", answer: x, rows,
      tip: "Find the other two angles in the bottom triangle. The three angles add to 180°.",
      draw(shown, hint) {
        if (hint || shown >= 3) { // the Z for the alternate angles at A and D
          const g = el("g", {});
          for (const [p1, p2] of [[A, add(A, mul(right, 160))], [A, Dp], [Dp, add(Dp, mul(left, 160))]]) el("line", { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, class: "shape" }, g);
        }
        line(P(60, yT), P(940, yT), "pl"); line(P(60, yB), P(940, yB), "pl");
        chevrons(P(flip ? 870 : 130, yT), P(1, 0), 1); chevrons(P(flip ? 870 : 130, yB), P(1, 0), 1);
        line(ext(Dp, A, 50), ext(A, Dp, 50), "tl"); line(ext(C, B, 50), ext(B, C, 50), "tl");
        const dAO = unit(sub(O, A)), dCO = unit(sub(O, C)), dDO = unit(sub(O, Dp)), dOC = neg(dCO), dOD = neg(dDO);
        wedge(A, left, dAO, 52, "B"); chip(inAngle(A, left, dAO, e, 110), e + "°", "B");
        wedge(C, right, dCO, 52, "B"); chip(inAngle(C, right, dCO, b, 110), b + "°", "B");
        wedge(O, dOC, dOD, 48, "O"); chip(inAngle(O, dOC, dOD, x, 105), shown >= rows.length ? x + "°" : "x", "O");
        if (shown >= 2) { wedge(A, right, dAO, 48, "P"); chip(inAngle(A, right, dAO, a, 105), a + "°", "P"); }
        if (shown >= 3) { wedge(Dp, left, dDO, 48, "P"); chip(inAngle(Dp, left, dDO, a, 105), a + "°", "P"); }
        vname(A, add(A, P(0, 1)), "A"); vname(B, add(B, P(0, 1)), "B");
        vname(C, sub(C, P(0, 1)), "C"); vname(Dp, sub(Dp, P(0, 1)), "D");
        vname(O, add(O, mul(right, flip ? 1 : 1)), "O");
      },
    };
  }
  // A triangle between the parallel lines. Ask for the top angle x.
  function genTri() {
    let q, r, x;
    do { q = rnd(45, 80); r = rnd(40, 80); x = 180 - q - r; } while (x < 30);
    const e = 180 - q, yT = 110, yB = 530, h = yB - yT;
    const cq = h / Math.tan(q * D), cr = h / Math.tan(r * D);
    const flip = Math.random() < 0.5, X = v => (flip ? W - v : v);
    const Qx = 500 - (cq + cr) / 2, Px = Qx + cq, Rx = Qx + cq + cr;
    const Pp = P(X(Px), yT), Qp = P(X(Qx), yB), Rp = P(X(Rx), yB);
    const right = P(flip ? -1 : 1, 0), left = neg(right);
    const ext = (a, b, k) => add(b, mul(unit(sub(b, a)), k));
    const rows = [
      { L: "∠PQR", R: `180° ${MINUS} ${e}°`, note: "Angles in a linear pair add to 180°." },
      { L: "", R: q + "°" },
      { L: "∠PRQ", R: r + "°", note: "Alternate interior angles are equal." },
      { L: "x", R: `180° ${MINUS} ${q}° ${MINUS} ${r}°`, note: "The angles in a triangle add to 180°." },
      { L: "", R: x + "°" },
    ];
    return {
      title: "Triangle between the lines", q: "Find x.", ask: "x =", unit: "°", answer: x, rows,
      tip: "Find the other two angles inside the triangle. The three angles add to 180°.",
      draw(shown, hint) {
        if (hint || shown >= 3) { // the Z for the alternate angles at P and R
          const g = el("g", {});
          for (const [p1, p2] of [[Pp, add(Pp, mul(right, 160))], [Pp, Rp], [Rp, add(Rp, mul(left, 160))]]) el("line", { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, class: "shape" }, g);
        }
        line(P(60, yT), P(940, yT), "pl"); line(P(60, yB), P(940, yB), "pl");
        chevrons(P(130, yT), P(1, 0), 1); chevrons(P(130, yB), P(1, 0), 1);
        line(Pp, ext(Pp, Qp, 70), "tl"); line(Pp, ext(Pp, Rp, 70), "tl");
        const dQP = unit(sub(Pp, Qp)), dPR = unit(sub(Rp, Pp)), dPQ = neg(dQP), dRP = neg(dPR);
        wedge(Qp, left, dQP, 52, "B"); chip(inAngle(Qp, left, dQP, e, 110), e + "°", "B");
        wedge(Pp, right, dPR, 52, "B"); chip(inAngle(Pp, right, dPR, r, 110), r + "°", "B");
        wedge(Pp, dPQ, dPR, 48, "O"); chip(inAngle(Pp, dPQ, dPR, x, 105), shown >= rows.length ? x + "°" : "x", "O");
        if (shown >= 2) { wedge(Qp, right, dQP, 48, "P"); chip(inAngle(Qp, right, dQP, q, 105), q + "°", "P"); }
        if (shown >= 3) { wedge(Rp, left, dRP, 48, "P"); chip(inAngle(Rp, left, dRP, r, 105), r + "°", "P"); }
        const cen = P((Pp.x + Qp.x + Rp.x) / 3, (Pp.y + Qp.y + Rp.y) / 3);
        vname(Pp, add(Pp, P(0, 1)), "P"); vname(Qp, sub(Qp, add(mul(unit(sub(Rp, Qp)), 0.7), P(0, 1))), "Q"); vname(Rp, sub(Rp, add(mul(unit(sub(Qp, Rp)), 0.7), P(0, 1))), "R");
      },
    };
  }
  // A bent path between the parallel lines. x = the two outside angles added.
  function genBend() {
    const a = rnd(25, 62), b = rnd(25, 62), x = a + b, yT = 110, yB = 530;
    const h1 = rnd(170, 250), h2 = yB - yT - h1;
    const flip = Math.random() < 0.5;
    let mx = 640;
    const ax = mx - h1 / Math.tan(a * D), bx = mx - h2 / Math.tan(b * D);
    const shift = Math.max(0, 150 - Math.min(ax, bx));
    const X = v => (flip ? W - (v + shift) : v + shift);
    const M = P(X(mx), yT + h1), A = P(X(ax), yT), B = P(X(bx), yB);
    const right = P(flip ? -1 : 1, 0);
    const rows = [
      { text: "Draw a helper line through M, parallel to the other two lines." },
      { L: "∠1", R: a + "°", note: "Alternate interior angles are equal." },
      { L: "∠2", R: b + "°", note: "Alternate interior angles are equal." },
      { L: "x", R: "∠1 + ∠2", note: "x is made of the two parts" },
      { L: "", R: `${a}° + ${b}°` },
      { L: "", R: x + "°" },
    ];
    return {
      title: "Bent path", q: "Find x.", ask: "x =", unit: "°", answer: x, rows,
      tip: "Draw a line through M, parallel to the other two. It cuts x into two parts.",
      draw(shown, hint) {
        line(P(60, yT), P(940, yT), "pl"); line(P(60, yB), P(940, yB), "pl");
        chevrons(P(flip ? 870 : 130, yT), P(1, 0), 1); chevrons(P(flip ? 870 : 130, yB), P(1, 0), 1);
        if (hint || shown >= 1) { line(P(60, M.y), P(940, M.y), "helper"); chevrons(P(flip ? 870 : 130, M.y), P(1, 0), 1); }
        line(A, M, "tl"); line(M, B, "tl");
        const dAM = unit(sub(M, A)), dBM = unit(sub(M, B)), dMA = neg(dAM), dMB = neg(dBM), back = neg(right);
        wedge(A, right, dAM, 50, "B"); chip(inAngle(A, right, dAM, a, 108), a + "°", "B");
        wedge(B, right, dBM, 50, "B"); chip(inAngle(B, right, dBM, b, 108), b + "°", "B");
        if (shown >= 2) { wedge(M, back, dMA, 44, "P"); ndot(add(M, mul(unit(add(back, dMA)), 100)), 1, "P"); }
        if (shown >= 3) { wedge(M, back, dMB, 44, "P"); ndot(add(M, mul(unit(add(back, dMB)), 100)), 2, "P"); }
        if (shown < 2) wedge(M, dMA, dMB, 50, "O");
        chip(add(M, mul(unit(add(dMA, dMB)), shown >= 2 ? 190 : 105)), shown >= rows.length ? x + "°" : "x", "O");
        vname(M, add(M, mul(back, 1)), "M");
        vname(A, P(A.x, yT + 50), "A"); vname(B, P(B.x, yB - 50), "B");
      },
    };
  }
  // Two pairs of parallel lines (> and >>). Slide the angle along one line, then the other.
  function genPairs() {
    let theta; do { theta = rnd(48, 132); } while (Math.abs(theta - 90) < 12);
    const yL = [160, 480], mxs = [320, 680], Mu = dirDeg(theta), cot = Math.cos(theta * D) / Math.sin(theta * D);
    const X = (i, j) => P(mxs[j] + (320 - yL[i]) * cot, yL[i]);
    const meas = qd => ([2, 3].includes(qd) ? theta : 180 - theta);
    const rays = qd => [qd % 2 ? P(-1, 0) : P(1, 0), [1, 2].includes(qd) ? Mu : neg(Mu)];
    const i0 = rnd(0, 1), j0 = rnd(0, 1), qg = rnd(1, 4);
    const qx = pick([1, 2, 3, 4].filter(v => v !== qg));
    const vertical = qg + qx === 5;
    const g = meas(qg), x = meas(qx);
    const rows = [
      { L: "∠1", R: g + "°", note: "Corresponding angles are equal (>> lines)." },
      { L: "∠2", R: g + "°", note: "Corresponding angles are equal (> lines)." },
      ...(vertical ? [{ L: "x", R: "∠2", note: "Vertically opposite angles are equal." }, { L: "", R: x + "°" }]
        : [{ L: "x", R: `180° ${MINUS} ∠2`, note: "Angles in a linear pair add to 180°." }, { L: "", R: `180° ${MINUS} ${g}°` }, { L: "", R: x + "°" }]),
    ];
    const at = (i, j, qd, cls, r) => { const [d1, d2] = rays(qd); wedge(X(i, j), d1, d2, r, cls); return inAngle(X(i, j), d1, d2, meas(qd), r === 54 ? 120 : 76); };
    return {
      title: "Two pairs of parallel lines", q: "Find x.", ask: "x =", unit: "°", answer: x, rows,
      tip: "Slide the angle to the next crossing along a line. Corresponding angles are equal.",
      draw(shown, hint) {
        for (const y of yL) { line(P(60, y), P(940, y), "pl"); chevrons(P(120, y), P(1, 0), 1); }
        for (const mx of mxs) {
          const c = P(mx, 320), k = 160 / Math.sin(theta * D) + 95;
          line(add(c, mul(Mu, k)), sub(c, mul(Mu, k)), "pl");
          chevrons(c, Mu, 2);
        }
        chip(at(i0, j0, qg, "B", 54), g + "°", "B");
        const c2 = at(1 - i0, 1 - j0, qx, "O", 54);
        if (hint || shown >= 1) { const p = at(i0, 1 - j0, qg, "P", 44); ndot(p, 1, "P"); }
        if (shown >= 2) { const p = at(1 - i0, 1 - j0, qg, "P", 44); ndot(p, 2, "P"); }
        chip(c2, shown >= rows.length ? x + "°" : "x", "O");
      },
    };
  }
  const GENS = [genChain, genBowtie, genTri, genBend, genPairs];
  const CS = { n: 0, right: 0, total: 0, bag: [] };
  let cz = null;
  function newChallenge() {
    CS.n++;
    if (!CS.bag.length) CS.bag = shuffle(GENS);
    cz = CS.bag.pop()();
    Object.assign(cz, { shown: 0, hint: false, first: true, done: false });
    $("ctitle").textContent = cz.title; $("cq").textContent = cz.q;
    $("clbl").textContent = cz.ask; $("cunit").hidden = !cz.unit;
    $("cin").value = ""; $("cin").className = "";
    $("cfb").innerHTML = ""; $("cwork").innerHTML = ""; $("cnext").hidden = true;
    $("cshow").textContent = "Show me"; $("cshow").disabled = false; $("chint").disabled = false;
    renderChal();
  }
  function renderChal() {
    $("cnum").textContent = "Puzzle " + CS.n;
    $("cscore").textContent = CS.right + " / " + CS.total;
    $("cwork").innerHTML = workHTML(cz.rows, cz.shown, cz.done);
    svg.textContent = "";
    cz.draw(cz.shown, cz.hint);
    $("hint").textContent = "The same marks (> or >>) mean the lines are parallel.";
  }
  function finishC(good) {
    cz.done = true; cz.shown = cz.rows.length;
    $("cin").value = cz.answer; $("cin").className = "good";
    if (good) $("cfb").innerHTML = `<span class="head yes">Yes! ${cz.ask} ${cz.answer}${cz.unit}</span>`;
    $("cshow").disabled = true; $("chint").disabled = true; $("cnext").hidden = false;
    renderChal();
  }
  function checkC() {
    if (cz.done) return;
    const v = parseNum($("cin").value);
    if (isNaN(v)) { $("cfb").innerHTML = `<span class="head no">Type a number.</span>`; return; }
    const good = v === cz.answer;
    if (cz.first) { CS.total++; if (good) CS.right++; cz.first = false; }
    if (good) { finishC(true); return; }
    $("cin").className = "bad";
    $("cfb").innerHTML = `<span class="head no">Not quite. Try again.</span><span>Press Hint or Show me for help.</span>`;
    renderChal();
  }
  $("ccheck").addEventListener("click", checkC);
  $("cin").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); if (cz.done) newChallenge(); else checkC(); } });
  $("chint").addEventListener("click", () => { cz.hint = true; $("cfb").innerHTML = `<span class="head hint">Hint</span><span>${cz.tip}</span>`; renderChal(); });
  $("cshow").addEventListener("click", () => {
    if (cz.done) return;
    if (cz.first) { CS.total++; cz.first = false; }
    cz.shown++;
    $("cfb").innerHTML = "";
    if (cz.shown >= cz.rows.length) finishC(false);
    else { $("cshow").textContent = "Next step"; renderChal(); }
  });
  $("cnext").addEventListener("click", newChallenge);
  $("cskip").addEventListener("click", newChallenge);

  // ================= Mode switch =================
  let mode = "learn";
  function setMode(m) {
    mode = m;
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.mode === m)));
    $("learnP").hidden = m !== "learn"; $("pracP").hidden = m !== "practice"; $("chalP").hidden = m !== "challenge";
    if (m === "learn") renderLearn();
    else if (m === "practice") { if (!pq) newPractice(); else drawPractice(); }
    else { if (!cz) newChallenge(); else renderChal(); }
  }
  document.querySelectorAll("[data-mode]").forEach(x => x.addEventListener("click", () => setMode(x.dataset.mode)));
  document.addEventListener("keydown", e => {
    if (mode !== "learn" || e.target.closest?.(".handle") || e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") goStep(L.step + 1);
    if (e.key === "ArrowLeft") goStep(L.step - 1);
  });
  renderLearn();
})();

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
