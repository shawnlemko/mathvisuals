<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Permutations and Combinations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
:root { --purple: #7a3fc4; --red: #c8323c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --purple: #b98cff; --red: #ff6b74; } }
:root[data-theme="dark"] { --purple: #b98cff; --red: #ff6b74; }
.main { grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
.panel { gap: 12px; }

/* The four parts, in order */
.seg { display: inline-flex; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--sheet); font-size: 1rem; min-height: 46px; padding: 4px 14px; line-height: 1.2; text-align: left; }
.seg button + button { border-left: 2px solid var(--grid-major); }
.seg button small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
.seg button[aria-pressed="true"] { background: var(--pt); color: var(--sheet); }
.seg button[aria-pressed="true"] small { color: var(--sheet); }

/* Number pickers */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; }
.pickers { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.pick { display: flex; align-items: center; gap: 6px; }
.pick span { font-weight: 700; font-size: 1.05rem; margin-right: 4px; }
.pick output { font-family: var(--font-num); font-weight: 700; font-size: 1.6rem; min-width: 1.6em; text-align: center; }
.pick button { font-size: 1.4rem; line-height: 1; width: 44px; padding: 4px 0; min-height: 44px; }
.pick button:disabled { opacity: .35; cursor: default; }

/* What is happening now */
.say { font-size: 1.2rem; line-height: 1.4; margin: 0; min-height: 2.8em; }
.say b { color: var(--orange); }
.nav { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 12px; }
.nav button { font-family: var(--font-display); font-size: 1.2rem; min-height: 52px; }
#next { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
#next:hover { background: var(--sheet); color: var(--pt); }
.nav button:disabled { opacity: .4; cursor: default; }

/* The work: one line per step, = signs lined up, step names on the right */
.work { display: grid; grid-template-columns: auto auto max-content minmax(7ch, 1fr); align-items: center; gap: 4px 10px;
  font-family: var(--font-num); font-size: 1.25rem; }
.work .lhs { text-align: right; white-space: nowrap; }
.work .eqs { text-align: center; }
.work .rhs { white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.work .why { font-family: var(--font-body); font-size: .85rem; color: var(--muted); text-align: right; max-width: 15ch; line-height: 1.2; }
.work .new { color: var(--orange); }
.work .new.why { color: var(--orange); font-weight: 700; }
.work .formula { color: var(--green); font-weight: 700; }
.work .frac > span:first-child { padding-bottom: 2px; }
.work .frac { vertical-align: middle; }
.fac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; }
.fac small { font-family: var(--font-body); font-size: .7rem; font-weight: 700; }
.x { position: relative; display: inline-block; }
.x::after { content: ""; position: absolute; left: -2px; right: -2px; top: 50%; border-top: 3px solid var(--red); transform: rotate(-50deg); }
.work.long { font-size: 1.05rem; }
@media (max-height: 800px) { .work { font-size: 1.12rem; gap: 2px 10px; } .say { font-size: 1.1rem; } .card { padding: 12px 16px; } }
.pr sub { font-size: .7em; }
.empty { color: var(--muted); font-family: var(--font-body); font-size: 1rem; margin: 0; }

/* Board drawing */
.col-h { font-family: var(--font-display); font-weight: 800; font-size: 28px; fill: var(--ink); }
.col-n { font-family: var(--font-body); font-weight: 700; font-size: 20px; }
.edge { fill: none; stroke: var(--grid-major); stroke-width: 2.5; }
.edge.hot { stroke: var(--orange); stroke-width: 3; }
.icon { stroke: var(--ink); stroke-width: .04; stroke-linejoin: round; }
.start { fill: var(--ink); }
.leaf-n { font-family: var(--font-num); font-weight: 700; fill: var(--orange); }
.pop { animation: pop .5s ease both; }
@keyframes pop { from { opacity: 0; } to { opacity: 1; } }
.box { fill: var(--sheet); stroke: var(--grid-major); stroke-width: 3; stroke-dasharray: 9 7; }
.box.full { stroke: var(--pt); stroke-dasharray: none; }
.box.now { stroke: var(--orange); stroke-width: 5; stroke-dasharray: none; }
.box.ghost { stroke: var(--muted); fill: none; opacity: .6; }
.box-lbl { font-family: var(--font-display); font-weight: 800; font-size: 24px; fill: var(--ink); }
.box-lbl.ghost { fill: var(--muted); font-size: 20px; }
.wait { fill: var(--chip); stroke: var(--grid-major); stroke-width: 2; }
.wait-lbl { font-family: var(--font-display); font-weight: 800; font-size: 24px; fill: var(--muted); }
.choice { font-family: var(--font-num); font-weight: 700; font-size: 46px; fill: var(--orange); }
.choice.ghost { fill: var(--muted); opacity: .7; }
.choice.cross { fill: var(--muted); }
.times { font-family: var(--font-num); font-weight: 700; font-size: 36px; fill: var(--ink); }
.strike { stroke: var(--red); stroke-width: 5; stroke-linecap: round; }
.kid { transition: transform .7s ease, opacity .5s ease; }
.kid .ring { fill: none; stroke: var(--orange); stroke-width: 5; opacity: 0; transition: opacity .3s; }
.kid.ask .ring { opacity: 1; }
.kid-i { font-family: var(--font-display); font-weight: 800; font-size: 30px; fill: #fff; pointer-events: none; }
.kid-n { font-family: var(--font-body); font-weight: 700; font-size: 20px; fill: var(--ink); }
.card-r { fill: var(--sheet); stroke: var(--grid-major); stroke-width: 2.5; transition: stroke .4s; }
.tcard { transition: transform .8s ease, opacity .5s ease; }
.tcard.keep .card-r { stroke-width: 5; }
.big-note { font-family: var(--font-display); font-weight: 800; font-size: 30px; fill: var(--green); }
@media (prefers-reduced-motion: reduce) { .kid, .tcard { transition: none; } .pop { animation: none; } }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Permutations and Combinations</h1></div>
    <div class="bar">
    <div class="seg" id="parts" role="group" aria-label="Part">
      <button type="button" data-p="0" aria-pressed="true">1 Outfits<small>Counting principle</small></button>
      <button type="button" data-p="1" aria-pressed="false">2 All seats<small>Factorial</small></button>
      <button type="button" data-p="2" aria-pressed="false">3 Some seats<small>Permutations</small></button>
      <button type="button" data-p="3" aria-pressed="false">4 Teams<small>Combinations</small></button>
    </div>
    <div class="pickers" id="pickers"></div>
    </div>
  </header>

  <div class="main">
    <div class="board">
      <svg id="stage" viewBox="0 0 1000 620" role="img" aria-label="Counting picture"></svg>
    </div>

    <div class="panel">
      <div class="card">
        <p class="say" id="say" aria-live="polite"></p>
        <div class="nav">
          <button type="button" id="back">Back</button>
          <button type="button" id="next">Next step</button>
        </div>
      </div>
      <div class="card">
        <p class="label">Work</p>
        <div class="work" id="work"></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const svg = $("stage");
  const fact = n => (n <= 1 ? 1 : n * fact(n - 1));
  const perm = (n, r) => fact(n) / fact(n - r);
  const comb = (n, r) => perm(n, r) / fact(r);
  const down = (n, k) => Array.from({ length: k }, (_, i) => n - i);   // n, n-1, ... (k numbers)
  const times = a => a.join(" × ");
  const frac = (t, b) => `<span class="frac"><span>${t}</span><span>${b}</span></span>`;
  const P = (n, r) => `<span class="pr"><sub>${n}</sub>P<sub>${r}</sub></span>`;
  const Cn = (n, r) => `<span class="pr"><sub>${n}</sub>C<sub>${r}</sub></span>`;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // Students: name and colour (shared by parts 2 to 4)
  const KIDS = [
    ["Ava", "#d64545"], ["Ben", "#2f6fd8"], ["Cal", "#1f8a5a"], ["Dev", "#c27a00"],
    ["Eli", "#8a4fd0"], ["Fay", "#d4458f"], ["Gus", "#2a8f9e"], ["Hana", "#6b6f2a"]];

  const S = { part: 0, step: 0, shirts: 2, pants: 3, hats: 2, n2: 4, n3: 4, r3: 2, n4: 4, r4: 2 };

  // ---------- Pickers ----------
  const PICKS = [
    [["shirts", "Shirts", 1, 3], ["pants", "Pants", 1, 3], ["hats", "Hats", 1, 3]],
    [["n2", "Students and seats", 2, 6]],
    [["n3", "Students", 2, 8], ["r3", "Seats", 1, 8]],
    [["n4", "Students", 2, 6], ["r4", "On the team", 1, 3]]];
  function limits(key) {
    const def = PICKS[S.part].find(p => p[0] === key);
    let lo = def[2], hi = def[3];
    if (key === "r3") hi = S.n3;
    if (key === "n3") lo = Math.max(lo, S.r3);
    if (key === "r4") hi = Math.min(hi, S.n4);
    if (key === "n4") lo = Math.max(lo, S.r4);
    return [lo, hi];
  }
  // Part 4 lists every ordered card, so keep it to 60 cards or fewer.
  const tooMany = (n, r) => perm(n, r) > 60;
  function drawPickers() {
    const box = $("pickers");
    box.replaceChildren();
    for (const [key, label] of PICKS[S.part]) {
      const row = document.createElement("div");
      row.className = "pick";
      row.innerHTML = `<span>${label}</span><button type="button" aria-label="One less">−</button><output>${S[key]}</output><button type="button" aria-label="One more">+</button>`;
      const [minus, plus] = row.querySelectorAll("button");
      const [lo, hi] = limits(key);
      minus.disabled = S[key] <= lo;
      let up = S[key] + 1;
      plus.disabled = up > hi || (S.part === 3 && (key === "n4" ? tooMany(up, S.r4) : tooMany(S.n4, up)));
      minus.onclick = () => change(key, -1);
      plus.onclick = () => change(key, 1);
      box.appendChild(row);
    }
  }
  function change(key, d) {
    S[key] += d;
    // Part 1 keeps its place so the tree changes in front of you; the other parts start over.
    if (S.part !== 0) { S.step = 0; fresh = true; }
    S.step = Math.min(S.step, phases().length - 1);
    drawPickers();
    render(false);
  }

  // ---------- Phases of each part ----------
  function phases() {
    if (S.part === 0) return ["intro", "shirts", "pants", "hats", "count"];
    if (S.part === 1) return ["intro", ...down(S.n2, S.n2).map((_, i) => "seat" + i), "fact", "answer"];
    if (S.part === 2) {
      const left = S.n3 - S.r3;
      return ["intro", ...down(S.r3, S.r3).map((_, i) => "seat" + i), "stop",
        ...(left ? ["pretend", "cancel"] : []), "fact", "formula"];
    }
    return ["intro", "ordered", "group", "divide", "nPr", "formula"];
  }
  const phase = () => phases()[S.step];
  const at = name => phases().indexOf(name) <= S.step && phases().indexOf(name) >= 0;

  // ---------- Work lines ----------
  function drawWork(lines) {
    const w = $("work");
    w.classList.remove("long");
    w.replaceChildren();
    if (!lines.length) { w.innerHTML = `<p class="empty" style="grid-column:1/-1">Press Next step to start.</p>`; return; }
    lines.forEach((ln, i) => {
      const cls = (i === lines.length - 1 && ln.isNew ? " new" : "") + (ln.formula ? " formula" : "");
      w.insertAdjacentHTML("beforeend",
        `<span class="lhs${cls}">${ln.l || ""}</span><span class="eqs${cls}">=</span><span class="rhs${cls}">${ln.r}</span><span class="why${cls}">${ln.why}</span>`);
    });
    const card = w.parentElement;
    card.scrollIntoView({ block: "nearest" });
  }
  function say(sentences) { $("say").textContent = sentences.filter(Boolean).join(" "); }

  // ================= Part 1: outfits tree =================
  const SHIRTS = [["#d64545", "Red"], ["#2f6fd8", "Blue"], ["#e8b400", "Yellow"]];
  const PANTS = [["#2b2f36", "Black"], ["#c8a165", "Tan"], ["#8a8f99", "Grey"]];
  const HATS = [["#1f9a5a", "Green"], ["#8a4fd0", "Purple"], ["#e07020", "Orange"]];
  const SHAPE = {
    shirt: "M-0.5,-0.28 L-0.2,-0.45 Q0,-0.33 0.2,-0.45 L0.5,-0.28 L0.38,-0.05 L0.27,-0.12 L0.27,0.45 L-0.27,0.45 L-0.27,-0.12 L-0.38,-0.05 Z",
    pants: "M-0.3,-0.45 L0.3,-0.45 L0.35,0.45 L0.08,0.45 L0,-0.08 L-0.08,0.45 L-0.35,0.45 Z",
    hat: "M-0.24,-0.4 L0.24,-0.4 L0.24,0.12 L0.46,0.12 L0.46,0.26 L-0.46,0.26 L-0.46,0.12 L-0.24,0.12 Z" };
  function icon(kind, color, x, y, size, parent) {
    const g = el("g", { transform: `translate(${x} ${y}) scale(${size})` }, parent);
    el("path", { class: "icon", d: SHAPE[kind], fill: color }, g);
    return g;
  }

  function part1() {
    const { shirts: s, pants: p, hats: h } = S;
    const st = S.step;
    const top = 112, bottom = 606, X = [50, 250, 470, 690, 880];
    const L = s * p * h, gap = (bottom - top) / L;
    const leafY = i => top + gap * (i + 0.5);
    const levels = [s, p, h];
    const KIND = ["shirt", "pants", "hat"], SETS = [SHIRTS, PANTS, HATS];
    const COLS = ["var(--red)", "var(--muted)", "var(--green)"];

    // Column headings with the number of choices
    el("text", { class: "col-h", x: X[0], y: 50, "text-anchor": "middle" }, svg, "Start");
    const heads = ["Shirt", "Pants", "Hat"];
    for (let k = 0; k < 3; k++) {
      if (st < k + 1) continue;
      const g = el("g", { class: st === k + 1 ? "pop" : "" }, svg);
      el("text", { class: "col-h", x: X[k + 1], y: 50, "text-anchor": "middle" }, g, heads[k]);
      el("text", { class: "col-n", x: X[k + 1], y: 78, "text-anchor": "middle", fill: COLS[k] }, g, `${levels[k]} ${levels[k] === 1 ? "choice" : "choices"}`);
    }
    if (st >= 4) {
      const g = el("g", { class: st === 4 ? "pop" : "" }, svg);
      el("text", { class: "col-h", x: X[4], y: 50, "text-anchor": "middle" }, g, "Outfits");
      el("text", { class: "col-n", x: X[4], y: 78, "text-anchor": "middle", fill: "var(--orange)" }, g, `${L} in all`);
    }

    // Node y for level k (0 = shirt), index i: middle of its leaves
    const per = [p * h, h, 1];
    const nodeY = (k, i) => top + gap * (i * per[k] + per[k] / 2);
    const edges = el("g", {}, svg), nodes = el("g", {}, svg);
    el("circle", { class: "start", cx: X[0], cy: (top + bottom) / 2, r: 12 }, nodes);
    const counts = [s, s * p, s * p * h];
    for (let k = 0; k < 3; k++) {
      if (st < k + 1) break;
      const fresh = st === k + 1;
      const eg = el("g", { class: fresh ? "pop" : "" }, edges), ng = el("g", { class: fresh ? "pop" : "" }, nodes);
      const size = Math.max(16, Math.min(k === 0 ? 70 : 54, gap * per[k] * 0.8));
      for (let i = 0; i < counts[k]; i++) {
        const y = nodeY(k, i);
        const px = k === 0 ? X[0] + 12 : X[k] + 30, py = k === 0 ? (top + bottom) / 2 : nodeY(k - 1, Math.floor(i / levels[k]));
        const x1 = X[k + 1] - size * 0.55;
        el("path", { class: "edge" + (fresh ? " hot" : ""), d: `M${px},${py} C${(px + x1) / 2},${py} ${(px + x1) / 2},${y} ${x1},${y}` }, eg);
        icon(KIND[k], SETS[k][i % levels[k]][0], X[k + 1], y, size, ng);
      }
    }
    // Leaves: the finished outfit and its number
    if (st >= 4) {
      const g = el("g", { class: "pop" }, svg);
      const size = Math.max(13, Math.min(34, gap * 0.8));
      for (let i = 0; i < L; i++) {
        const y = leafY(i);
        const a = Math.floor(i / (p * h)), b = Math.floor(i / h) % p, c = i % h;
        el("path", { class: "edge", d: `M${X[3] + 30},${y} L${X[4] - size * 1.9},${y}`, "stroke-dasharray": "4 5" }, g);
        icon("hat", HATS[c][0], X[4] - size * 1.2, y, size, g);
        icon("shirt", SHIRTS[a][0], X[4], y, size, g);
        icon("pants", PANTS[b][0], X[4] + size * 1.1, y, size, g);
        el("text", { class: "leaf-n", x: X[4] + size * 1.8 + 6, y: y + size * 0.3, "font-size": Math.min(26, Math.max(13, gap * 0.75)) }, g, i + 1);
      }
    }
    svg.setAttribute("aria-label", `Tree diagram: ${s} shirts, ${p} pants, ${h} hats`);

    // Words and work
    const facs = [];
    const word = ["shirt", "pants", "hat"], wordP = ["shirts", "pants", "hats"];
    for (let k = 0; k < Math.min(st, 3); k++)
      facs.push(`<span class="fac"><b style="color:${COLS[k]}">${levels[k]}</b><small style="color:${COLS[k]}">${levels[k] === 1 ? word[k] : wordP[k]}</small></span>`);
    const lines = [];
    if (st >= 1) lines.push({ l: "Outfits", r: facs.join("<span>×</span>"), why: "Choices at each step", isNew: st <= 3 });
    if (st >= 4) lines.push({ l: "", r: `<b>${L}</b>`, why: "Multiply", isNew: true });
    drawWork(lines);
    say({
      intro: ["Get dressed: pick a shirt, then pants, then a hat.", "How many different outfits can you make?"],
      shirts: [`Shirt choices: ${s}.`, "Each shirt gets its own branch."],
      pants: [`Each shirt gets ${p} pants branches: ${s} × ${p} = ${s * p}.`],
      hats: [`Each shirt and pants pair gets ${h} hat branches: ${s * p} × ${h} = ${L}.`],
      count: [`Count the ends of the branches: ${L} outfits.`, "Fundamental Counting Principle: multiply the number of choices at each step.", "Clothes can be used again: the same shirt is in many outfits."],
    }[phase()]);
  }

  // ================= Parts 2 and 3: seats =================
  let order = [];       // who sits in seat 1, 2, ... (shuffled so any student could be first)
  let fresh = true;     // a new seating order is needed
  function seatsPart() {
    const two = S.part === 1;
    const n = two ? S.n2 : S.n3, r = two ? S.n2 : S.r3, left = n - r;
    if (fresh || order.length !== n) { order = shuffle([...Array(n).keys()]); fresh = false; }
    const ph = phase(), st = S.step;
    const filled = Math.min(r, Math.max(0, st));                     // seats with someone in them
    const pretend = !two && at("pretend");
    const boxes = r + (pretend ? left : 0);
    const gapX = Math.min(150, 900 / Math.max(boxes, 1)), bw = Math.min(110, gapX - 22);
    const x0 = 500 - gapX * (boxes - 1) / 2;
    const seatX = i => x0 + gapX * i;
    const BY = 70, BH = 150;                                         // seat boxes
    const kidR = Math.min(34, bw * 0.34);

    // Seat boxes
    for (let i = 0; i < boxes; i++) {
      const ghost = i >= r;
      const cls = ghost ? "box ghost" : i < filled ? "box full" : "box";
      el("rect", { class: cls + (!ghost && i === filled - 1 && ph.startsWith("seat") ? " now" : ""), x: seatX(i) - bw / 2, y: BY, width: bw, height: BH, rx: 12 }, svg);
      el("text", { class: "box-lbl" + (ghost ? " ghost" : ""), x: seatX(i), y: BY - 14, "text-anchor": "middle" }, svg, ghost ? "Pretend" : `Seat ${i + 1}`);
    }
    // Choices under each seat: n, n-1, ...
    const choiceY = BY + BH + 62;
    const shown = pretend ? boxes : filled;
    for (let i = 0; i < shown; i++) {
      const ghost = i >= r;
      const t = el("text", { class: "choice" + (ghost ? " ghost" : ""), x: seatX(i), y: choiceY, "text-anchor": "middle" }, svg, n - i);
      if (i === filled - 1 && ph.startsWith("seat")) t.classList.add("pop");
      if (i > 0) el("text", { class: "times", x: seatX(i) - gapX / 2, y: choiceY - 4, "text-anchor": "middle", opacity: ghost ? 0.6 : 1 }, svg, "×");
      if (ghost && at("cancel")) {
        const l = el("line", { class: "strike pop", x1: seatX(i) - 22, y1: choiceY + 4, x2: seatX(i) + 22, y2: choiceY - 38 }, svg);
      }
    }
    if (shown && (ph === "fact" || ph === "answer" || ph === "stop" || ph === "formula")) {
      const total = two ? fact(n) : perm(n, r);
      el("text", { class: "big-note pop", x: 500, y: choiceY + 52, "text-anchor": "middle" }, svg, `${total} ways`);
    }

    // Waiting area
    const WY = 360, WH = 230;
    el("rect", { class: "wait", x: 40, y: WY, width: 920, height: WH, rx: 16 }, svg);
    el("text", { class: "wait-lbl", x: 64, y: WY + 36 }, svg, filled === n ? "Everyone has a seat" : two || !at("stop") ? "Waiting for a seat" : "Left standing");
    const slotGap = Math.min(110, 860 / n);
    const slotX = j => 500 - slotGap * (n - 1) / 2 + slotGap * j;
    const kidG = el("g", {}, svg);
    for (let j = 0; j < n; j++) {
      const [name, color] = KIDS[j];
      const seat = order.indexOf(j);                      // which seat this student takes
      let x = slotX(j), y = WY + 120, op = 1, ask = false;
      if (seat >= 0 && seat < filled) { x = seatX(seat); y = BY + 58; }
      else if (pretend && seat >= r) { x = seatX(seat); y = BY + 58; op = 0.45; }
      if (ph.startsWith("seat") && seat >= filled - 1) ask = true;   // the choices for this seat
      const g = el("g", { class: "kid" + (ask ? " ask" : ""), style: `transform: translate(${x}px, ${y}px); opacity:${op}` }, kidG);
      el("circle", { class: "ring", r: kidR + 8 }, g);
      el("circle", { r: kidR, fill: color }, g);
      el("text", { class: "kid-i", y: 10, "text-anchor": "middle", "font-size": Math.round(kidR * 0.9) }, g, name[0]);
      el("text", { class: "kid-n", y: kidR + 26, "text-anchor": "middle" }, g, name);
      g.dataset.kid = j;
    }
    // Animate: students for this seat are ringed first, then the chosen one walks to the seat.
    if (animateNext && ph.startsWith("seat")) {
      const chosen = order[filled - 1];
      const g = kidG.querySelector(`[data-kid="${chosen}"]`);
      const to = g.style.transform;
      g.style.transition = "none";
      g.style.transform = `translate(${slotX(chosen)}px, ${WY + 120}px)`;
      g.getBoundingClientRect();
      g.style.transition = "";
      setTimeout(() => { if (g.isConnected) { g.style.transform = to; } }, 650);
    }
    svg.setAttribute("aria-label", `${n} students and ${r} seats`);

    // Work
    const facs = down(n, filled);
    const lines = [];
    if (filled) lines.push({ l: "Ways", r: times(facs), why: "Choices for each seat", isNew: ph.startsWith("seat") });
    if (two) {
      if (at("fact")) lines.push({ l: "", r: `${n}!`, why: `${n} factorial`, isNew: ph === "fact" });
      if (at("answer")) lines.push({ l: "", r: `<b>${fact(n)}</b>`, why: "Multiply", isNew: true });
    } else {
      if (at("stop")) lines.push({ l: "", r: `<b>${perm(n, r)}</b>`, why: "Multiply", isNew: ph === "stop" });
      if (at("pretend")) {
        const mark = at("cancel") ? k => `<span class="x">${k}</span>` : k => k;
        const used = times(down(n, r)), rest = times(down(left, left).map(mark));
        lines.push({ l: "", r: frac(`${used} × ${rest}`, rest), why: "Same on top and bottom", isNew: ph === "pretend" || ph === "cancel" });
      }
      if (at("fact")) lines.push({ l: "", r: frac(`${n}!`, `(${n} − ${r})!`), why: left ? "Write with factorials" : "Zero factorial is 1", isNew: ph === "fact" });
      if (at("formula")) lines.push({ l: "<i>n</i>P<i>r</i>", r: frac("<i>n</i>!", "(<i>n</i> − <i>r</i>)!"), why: "Permutation formula", formula: true });
    }
    drawWork(lines);
    $("work").classList.toggle("long", n >= 7);

    // Words
    const k = filled, rem = n - k + 1;
    let words;
    if (ph === "intro") words = two ? [`${n} students and ${n} seats.`, "How many different ways can they sit?"]
                                    : [`${n} students but only ${r} seats.`, "How many different ways can they sit?"];
    else if (ph.startsWith("seat")) words = k === 1 ? [`Seat 1: any of the ${n} students can sit here.`, `${n} choices.`]
      : rem === 1 ? [`Seat ${k}: only 1 student is left.`, "1 choice."]
      : [`Seat ${k}: a student who already sat down can't be copied!`, `${rem} students are left.`, `${rem} choices.`];
    else if (ph === "fact") words = two ? [`Multiplying down to 1 is called ${n} factorial, written ${n}!.`]
      : left ? [`The top is ${n}!.`, `The bottom is the ${left} students left standing: (${n} − ${r})!.`]
      : ["Nobody is left standing, and zero factorial is 1.", `So the answer is ${n}!.`];
    else if (ph === "answer") words = [`There are ${fact(n)} ways for ${n} students to sit in ${n} seats.`];
    else if (ph === "stop") words = left ? [`All ${r} seats are full, so we stop: ${times(down(n, r))} = ${perm(n, r)}.`, `We do not keep going with ${times(down(left, left))}.`]
      : [`All ${r} seats are full: ${times(down(n, r))} = ${perm(n, r)}.`];
    else if (ph === "pretend") words = [`To use ${n}!, pretend the ${left} students left standing get seats too: ${times(down(left, left))}.`, "Then divide by it, so nothing changes."];
    else if (ph === "cancel") words = [`The ${times(down(left, left))} on the top and bottom cancel.`, `We are back to ${times(down(n, r))}.`];
    else if (ph === "formula") words = ["This is the permutation formula.", "n students, r seats, and order matters: who sits where."];
    say(words);
  }

  // ================= Part 4: teams =================
  let cards = null, cardKey = "";
  function perms(arr, r) {
    if (!r) return [[]];
    const out = [];
    arr.forEach((a, i) => perms(arr.filter((_, j) => j !== i), r - 1).forEach(rest => out.push([a, ...rest])));
    return out;
  }
  function part4() {
    const n = S.n4, r = S.r4, ph = phase();
    const all = perms([...Array(n).keys()], r);           // in order: AB, AC, ... BA, ...
    const teamKey = c => [...c].sort((a, b) => a - b).join(",");
    const teams = [...new Set(all.map(teamKey))];
    const rep = fact(r);
    const nP = all.length, nC = teams.length;

    // Students along the top
    const sg = Math.min(120, 900 / n);
    for (let j = 0; j < n; j++) {
      const x = 500 - sg * (n - 1) / 2 + sg * j;
      el("circle", { cx: x, cy: 44, r: 26, fill: KIDS[j][1] }, svg);
      el("text", { class: "kid-i", x, y: 53, "text-anchor": "middle", "font-size": 26 }, svg, KIDS[j][0][0]);
      el("text", { class: "kid-n", x, y: 94, "text-anchor": "middle" }, svg, KIDS[j][0]);
    }
    if (ph === "intro") {
      el("text", { class: "col-h", x: 500, y: 300, "text-anchor": "middle" }, svg, `Pick ${r} for a team.`);
      el("text", { class: "col-n", x: 500, y: 345, "text-anchor": "middle", fill: "var(--muted)" }, svg, "A team has no seats, so order does not matter.");
    }

    // Card layouts. Area for cards: x 30..970, y 120..610
    const cw = r * 52 + 16, ch = 62, g = 12, AX = 30, AY = 120, AW = 940, AH = 490;
    function fit(cols, rows, w, h) { return Math.min(1.25, AW / (cols * (w + g)), AH / (rows * (h + g))); }
    // Ordered grid: best number of columns
    let best = { s: 0 };
    for (let cols = 1; cols <= nP; cols++) {
      const rows = Math.ceil(nP / cols), s = fit(cols, rows, cw, ch);
      if (s > best.s) best = { s, cols, rows };
    }
    const ordered = all.map((c, i) => {
      const s = best.s, col = i % best.cols, row = Math.floor(i / best.cols);
      const ox = AX + (AW - best.cols * (cw + g) * s) / 2, oy = AY + (AH - best.rows * (ch + g) * s) / 2;
      return { x: ox + col * (cw + g) * s, y: oy + row * (ch + g) * s, s };
    });
    // Grouped: one row per team (rep cards), rows split into blocks of columns
    const bw = rep * (cw + g) + 24;
    let bestG = { s: 0 };
    for (let bc = 1; bc <= nC; bc++) {
      const rowsPer = Math.ceil(nC / bc), s = Math.min(1.25, AW / (bc * bw), AH / (rowsPer * (ch + g)));
      if (s > bestG.s) bestG = { s, bc, rowsPer };
    }
    const grouped = all.map(c => {
      const t = teams.indexOf(teamKey(c)), k = all.filter(d => teamKey(d) === teamKey(c)).indexOf(c);
      const s = bestG.s, block = Math.floor(t / bestG.rowsPer), row = t % bestG.rowsPer;
      const ox = AX + (AW - bestG.bc * bw * s) / 2, oy = AY + (AH - bestG.rowsPer * (ch + g) * s) / 2;
      return { x: ox + (block * bw + k * (cw + g)) * s, y: oy + row * (ch + g) * s, s, t, k };
    });

    if (ph !== "intro") {
      const key = `${n},${r}`;
      const layer = el("g", {}, svg);
      const gp = at("group"), dv = at("divide");
      all.forEach((c, i) => {
        const pos = gp ? grouped[i] : ordered[i];
        const hue = grouped[i].t * 360 / nC;
        const keep = grouped[i].k === 0;
        const cg = el("g", { class: "tcard" + (dv && keep ? " keep" : ""),
          style: `transform: translate(${pos.x}px, ${pos.y}px) scale(${pos.s}); opacity:${dv && !keep ? 0.15 : 1}` }, layer);
        const rr = el("rect", { class: "card-r", width: cw, height: ch, rx: 10 }, cg);
        if (gp) rr.style.stroke = `hsl(${hue} 65% 50%)`;
        c.forEach((kid, m) => {
          const cx = 8 + 26 + m * 52;
          el("circle", { cx, cy: ch / 2, r: 22, fill: KIDS[kid][1] }, cg);
          el("text", { class: "kid-i", x: cx, y: ch / 2 + 8, "text-anchor": "middle", "font-size": 22 }, cg, KIDS[kid][0][0]);
        });
      });
      // Slide from the last layout when the step changes
      if (animateNext && (ph === "group")) {
        layer.querySelectorAll(".tcard").forEach((cg, i) => {
          const to = cg.style.transform, o = ordered[i];
          cg.style.transition = "none";
          cg.style.transform = `translate(${o.x}px, ${o.y}px) scale(${o.s})`;
          cg.getBoundingClientRect();
          cg.style.transition = "";
          requestAnimationFrame(() => (cg.style.transform = to));
        });
      }
      cardKey = key;
    }
    svg.setAttribute("aria-label", `${n} students, teams of ${r}`);

    // Work
    const lines = [];
    if (at("ordered")) lines.push({ l: "In order", r: times(down(n, r)), why: "Like seats", isNew: ph === "ordered" });
    if (at("group")) lines.push({ l: "Repeats", r: times(down(r, r)), why: "Ways to order one team", isNew: ph === "group" });
    if (at("divide")) {
      lines.push({ l: "Teams", r: frac(times(down(n, r)), times(down(r, r))), why: "Divide out the repeats", isNew: false });
      lines.push({ l: "", r: `<b>${nC}</b>`, why: "Simplify", isNew: ph === "divide" });
    }
    if (at("nPr")) {
      lines.push({ l: Cn(n, r), r: frac(P(n, r), `${r}!`), why: "In order, over repeats", isNew: false });
      lines.push({ l: "", r: frac(`${n}!`, `(${n} − ${r})! ${r}!`), why: "Use the permutation formula", isNew: ph === "nPr" });
    }
    if (at("formula")) lines.push({ l: "<i>n</i>C<i>r</i>", r: frac("<i>n</i>!", "(<i>n</i> − <i>r</i>)! <i>r</i>!"), why: "Combination formula", formula: true });
    drawWork(lines);

    say({
      intro: [`${n} students.`, `Pick ${r} for a team.`, "A team has no seats, so order does not matter."],
      ordered: [`If order mattered, like seats, there would be ${nP} ways.`, "Here they all are."],
      group: [`Cards with the same students are the same team.`, `Each team shows up ${rep} times, once for each way to order ${r} students.`],
      divide: [`Keep one card for each team: ${nC} teams.`, "Dividing by the repeats takes away the copies."],
      nPr: ["Write it with the permutation formula on top.", `Put the repeats (${r}!) in the bottom too.`],
      formula: ["This is the combination formula.", "Choose r from n when order does not matter."],
    }[ph]);
  }

  // ---------- Drawing and steps ----------
  let animateNext = false;
  function render(animate) {
    animateNext = animate;
    svg.replaceChildren();
    if (S.part === 0) part1(); else if (S.part === 3) part4(); else seatsPart();
    $("back").disabled = S.step === 0;
    const last = S.step >= phases().length - 1;
    $("next").disabled = last;
    animateNext = false;
  }
  $("next").onclick = () => { if (S.step < phases().length - 1) { S.step++; render(true); } };
  $("back").onclick = () => { if (S.step > 0) { S.step--; render(false); } };
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "ArrowLeft") $("back").click();
  });
  $("parts").querySelectorAll("button").forEach(b => (b.onclick = () => {

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];

    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed

    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }

    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();

      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }

    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
