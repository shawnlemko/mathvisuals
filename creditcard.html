<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Credit Card Debt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Credit Card Debt (grades 7-9 and 10-12; Shawn 2026-10-21: only the simplest case, very simple).
   The simplest defensible model, stated on the page:
     - interest is charged once a month on the balance at the start of the month,
     - monthly rate = yearly rate over 12,
     - no new purchases, the same payment every month, interest rounded to the cent.
   (Real cards use the average daily balance and a minimum payment that changes; that is left out.)
   One month: Monthly rate, As a decimal, Interest, Add the interest, Subtract the payment,
   then a bar that splits the payment into the part that went to interest and the part that paid the debt.
   Month by month: a table, one month per Next step, then when the card is paid off and the total interest.
   Practice: one month, two boxes (Interest, New balance), Check with feedback for the usual mistakes,
   Hint, Show me. Colours: balance blue, interest orange, payment green. */
:root { --cbal: #2f5fd0; --cint: #c2571a; --cpay: #1f7a5a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cbal: #7aa2ff; --cint: #f08a4b; --cpay: #4cc49a; } }
:root[data-theme="dark"] { --cbal: #7aa2ff; --cint: #f08a4b; --cpay: #4cc49a; }
@media (min-width: 861px) { .main { grid-template-columns: minmax(0, 1.9fr) minmax(320px, 1fr); } }
.seg-btns { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg-btns button { border: 0; border-radius: 0; background: var(--sheet); color: var(--ink); font: inherit; font-size: 1.1rem; min-height: 48px; padding: 6px 14px; cursor: pointer; }
.seg-btns button + button { border-left: 2px solid var(--grid-major); }
.seg-btns button.on { background: var(--pt); color: var(--sheet); font-weight: 700; }
header .seg-btns button { font-size: 1.2rem; padding: 6px 20px; }
.wide { display: flex; width: 100%; }
.wide button { flex: 1 1 0; padding: 6px 8px; font-size: 1.05rem; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (min-width: 861px) and (min-height: 520px) { .side { overflow-y: auto; } }
.panel { gap: 12px; }
.card { padding: 12px 14px; }
.card .label { margin: 0 0 6px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.story { font-size: 1.3rem; line-height: 1.45; margin: 0; }
.story b { font-family: var(--font-num); }
.model { margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--grid-major); color: var(--muted); font-size: 0.95rem; line-height: 1.4; }
.steplbl { margin: 0 0 4px; color: var(--muted); font-weight: 700; font-size: 0.95rem; }
.say { font-size: 1.3rem; margin: 0; min-height: 3em; line-height: 1.45; }
.say b { font-family: var(--font-num); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns button { font: inherit; font-size: 1.1rem; min-height: 52px; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--grid-major); background: var(--sheet); color: var(--ink); cursor: pointer; }
.btns button.go { background: var(--pt); color: var(--sheet); border-color: var(--pt); font-weight: 700; }
.btns button:disabled { opacity: 0.45; cursor: default; }
.k-bal { color: var(--cbal); font-weight: 700; } .k-int { color: var(--cint); font-weight: 700; } .k-pay { color: var(--cpay); font-weight: 700; }
/* Practice answers */
.arow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.2fr); align-items: center; gap: 8px; margin-bottom: 8px; }
.arow label { font-weight: 700; font-size: 1.1rem; }
.unit { font-family: var(--font-num); font-weight: 700; font-size: 1.8rem; }
.big-in { font-family: var(--font-num); font-weight: 700; font-size: 1.8rem; color: var(--ink); background: var(--paper); border: 2px solid var(--grid-major); border-radius: 10px; height: 58px; width: 100%; min-width: 0; padding: 0 10px; text-align: right; }
.big-in.bad { border-color: var(--warn); }
.big-in.ok { border-color: var(--green); color: var(--green); }
.fb { margin: 8px 0 0; font-size: 1.2rem; font-weight: 700; min-height: 1.45em; }
.fb.ok { color: var(--green); } .fb.no { color: var(--warn); }
.score { font-size: 1.1rem; color: var(--muted); margin: 4px 0 0; }
.score b { color: var(--ink); font-family: var(--font-num); font-size: 1.35rem; }

/* Board: the three numbers as boxes, then the work (or the table). */
.board { gap: 12px; padding: 12px 16px; }
@media (min-width: 861px) and (min-height: 520px) { .board { justify-content: flex-start; } }
.inputs { display: flex; flex-wrap: wrap; gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 2px; padding: 4px 12px 8px; border-radius: 10px; background: var(--chip); border-left: 6px solid currentColor; }
.fld label { font-size: 0.9rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.fld .box { display: flex; align-items: center; gap: 4px; font-family: var(--font-num); font-weight: 700; font-size: 1.7rem; }
.fld input { font: inherit; color: inherit; width: 4.2em; min-width: 0; height: 2.6rem; padding: 0 8px; border: 2px solid var(--grid-major); border-radius: 8px; background: var(--sheet); text-align: right; }
.fld input.bad { border-color: var(--warn); }
.fld input[readonly] { border-color: transparent; background: transparent; padding: 0 2px; width: auto; field-sizing: content; }
.fld .der { font-size: 0.95rem; color: var(--muted); font-weight: 700; font-family: var(--font-num); }
.warnline { color: var(--warn); font-weight: 700; font-size: 1.1rem; margin: 0; }
.body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.work { --wf: 34px; font-size: var(--wf); display: grid; grid-template-columns: max-content max-content max-content minmax(0, 1fr); align-content: start; align-items: center; column-gap: 0.35em; row-gap: 0.35em; overflow: hidden; min-height: 0; flex: 1 1 auto; font-family: var(--font-num); font-weight: 700; padding-top: 0.3em; }
.work > div { white-space: nowrap; line-height: 1.45; }
.work .l { text-align: right; font-family: var(--font-body); }
.work .e { color: var(--muted); text-align: center; }
.work .n { font-family: var(--font-body); font-size: clamp(0.85rem, 0.52em, 1.15rem); color: var(--muted); text-align: right; padding-left: 0.8em; }
.work .new { animation: pop 0.45s ease-out both; }
.frac { display: inline-flex; flex-direction: column; text-align: center; vertical-align: middle; line-height: 1.1; }
.frac > span:first-child { border-bottom: 0.08em solid currentColor; padding: 0 0.15em 0.04em; }
.frac > span:last-child { padding: 0.04em 0.15em 0; }
.op { color: var(--muted); padding: 0 0.1em; }
/* Where the payment goes */
.split { flex: none; }
.split .cap { font-size: 1.15rem; font-weight: 700; margin: 0 0 4px; }
.split .cap b { font-family: var(--font-num); }
.bar { display: flex; height: 64px; border-radius: 10px; overflow: hidden; border: 2px solid var(--grid-major); }
.bar > div { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; color: #fff; font-family: var(--font-num); font-weight: 700; font-size: 1.35rem; white-space: nowrap; padding: 0 6px; }
.bar .bi { background: var(--cint); } .bar .bp { background: var(--cpay); }
:root[data-theme="dark"] .bar > div { color: #0f161d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bar > div { color: #0f161d; } }
.keys { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 4px; font-size: 1.05rem; }
.keys span::before { content: ""; display: inline-block; width: 0.9em; height: 0.9em; border-radius: 3px; margin-right: 6px; vertical-align: -0.1em; background: currentColor; }
/* Month by month */
.tbl { --tf: 26px; font-size: var(--tf); flex: 1 1 auto; min-height: 0; overflow: hidden; }
.tbl table { border-collapse: collapse; width: 100%; font-family: var(--font-num); font-weight: 700; }
.tbl th { font-family: var(--font-body); font-size: 0.62em; color: var(--muted); text-align: right; padding: 0 0.5em 0.3em; border-bottom: 2px solid var(--grid-major); white-space: nowrap; }
.tbl td { text-align: right; padding: 0.18em 0.5em; border-bottom: 1px solid var(--grid); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: center; }
.tbl td.barc { width: 28%; padding-right: 0; }
.tbl .mini { height: 0.7em; background: var(--cbal); border-radius: 4px; }
.tbl tr.new td { animation: pop 0.45s ease-out both; }
.tbl tr.hid td { visibility: hidden; }
.sum { flex: none; font-size: 1.35rem; font-weight: 700; margin: 0; }
.sum b { font-family: var(--font-num); }
.main > * { min-width: 0; }
@media (max-height: 800px) { .story, .say { font-size: 1.2rem; } .say { min-height: 0; } .side { gap: 10px; } }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .work .new, .tbl tr.new td { animation: none; } }
@media (max-width: 860px), (max-height: 519px) {
  .work { font-size: 1.3rem; overflow-x: auto; }
  .tbl { font-size: 1.1rem; overflow-x: auto; }
}
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Credit Card Debt</h1></div>
    <div class="seg-btns" role="group" aria-label="Mode" id="modes">
      <button type="button" data-mode="learn" class="on">Learn</button><button type="button" data-mode="practice">Practice</button>
    </div>
  </header>

  <div class="main">
    <div class="board">
      <div class="inputs" id="inputs">
        <div class="fld k-bal"><label for="inBal">Balance owed</label><div class="box">$<input id="inBal" type="text" inputmode="decimal" autocomplete="off"></div></div>
        <div class="fld k-int"><label for="inRate">Yearly interest rate</label><div class="box"><input id="inRate" type="text" inputmode="decimal" autocomplete="off">%</div></div>
        <div class="fld k-pay"><label for="inPay">Payment each month</label><div class="box">$<input id="inPay" type="text" inputmode="decimal" autocomplete="off"></div></div>
      </div>
      <p class="warnline" id="warn" hidden></p>
      <div class="body" id="oneView">
        <div class="work" id="work" aria-live="polite"></div>
        <div class="split" id="split" hidden></div>
      </div>
      <div class="body" id="monthView" hidden>
        <div class="tbl" id="tbl"></div>
        <p class="sum" id="sum"></p>
      </div>
    </div>

    <div class="side">
      <section class="card" id="viewCard">
        <p class="label">Show</p>
        <div class="seg-btns wide" role="group" aria-label="View" id="views">
          <button type="button" data-view="one" class="on">One month</button><button type="button" data-view="months">Month by month</button>
        </div>
      </section>
      <section class="card">
        <p class="label">Question</p>
        <p class="story" id="story"></p>
        <p class="model">Simple model: interest is charged once a month on the balance. No new purchases.</p>
      </section>

      <div class="panel" id="learn">
        <section class="card">
          <p class="steplbl" id="steplbl"></p>
          <p class="say" id="say"></p>
        </section>
        <div class="btns">
          <button type="button" class="go" id="next">Next step</button>
          <button type="button" id="back">Back</button>
          <button type="button" id="all">Show all</button>
          <button type="button" id="newex">New example</button>
        </div>
      </div>

      <div class="panel" id="practice" hidden>
        <section class="card">
          <div class="arow"><label for="ansInt" class="k-int">Interest this month</label><span class="unit">$</span><input class="big-in" id="ansInt" type="text" inputmode="decimal" autocomplete="off"></div>
          <div class="arow"><label for="ansBal" class="k-bal">New balance</label><span class="unit">$</span><input class="big-in" id="ansBal" type="text" inputmode="decimal" autocomplete="off"></div>
          <div class="btns"><button type="button" class="go" id="check">Check</button></div>
          <p class="fb" id="fb" aria-live="polite"></p>
          <p class="score">Correct: <b id="right">0</b> of <b id="total">0</b></p>
        </section>
        <div class="btns">
          <button type="button" id="hint">Hint</button>
          <button type="button" id="showme">Show me</button>
          <button type="button" id="newq">New question</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const isFr = () => document.documentElement.lang === "fr";

  // ---------- numbers ----------
  const r2 = v => Math.round(v * 100 + 1e-9) / 100;
  const trim = (v, d) => { const s = (+v).toFixed(d); return s.includes(".") ? s.replace(/0+$/, "").replace(/\.$/, "") : s; };
  // Thousands get a space once there are 5 or more digits (12 500).
  const grp = s => { const [i, f] = s.split("."); return (i.length >= 5 ? i.replace(/\B(?=(\d{3})+$)/g, " ") : i) + (f != null ? "." + f : ""); };
  const mnum = v => Number.isInteger(r2(v)) ? String(r2(v)) : r2(v).toFixed(2);
  // Money: $1015.50, or 1015,50 $ in French.
  function money(v) {
    const s = grp(mnum(v));
    return isFr() ? s.replace(".", ",") + " $" : "$" + s;
  }
  const pct = v => trim(v, 4) + "%";
  const dec = v => trim(v / 100, 6);
  const fr = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
  const K = (k, s) => `<span class="k-${k}">${s}</span>`;
  const B = s => `<b>${s}</b>`;
  const num = s => { const v = parseFloat(String(s).replace(/\s/g, "").replace(",", ".").replace(/^\$/, "")); return isFinite(v) ? v : NaN; };

  // ---------- the model ----------
  function month(bal, rate, pay) {
    const mr = rate / 12;
    const int = r2(bal * mr / 100);
    const owe = r2(bal + int);
    const paid = Math.min(pay, owe);
    return { bal, rate, pay, mr, int, owe, paid, end: r2(owe - paid) };
  }

  // ---------- state ----------
  let mode = "learn", view = "one", step = 0, lastShown = 0;
  let q = { name: "Sam", bal: 1000, rate: 18, pay: 50 };
  let pr = { right: 0, total: 0, done: false };
  const NAMES = ["Sam", "Maya", "Liam", "Priya", "Noah", "Aiyana", "Owen", "Sofia", "Ethan", "Amara", "Jonah", "Mei"];
  const RATES = [12, 15, 18, 21, 24];           // monthly 1%, 1.25%, 1.5%, 1.75%, 2%
  const BALS = [400, 500, 600, 800, 1000, 1200, 1500, 2000, 2400, 3000];

  function newQuestion() {
    let n;
    do {
      const bal = pick(BALS), rate = pick(RATES);
      const int = bal * rate / 1200;
      const lo = Math.max(30, Math.ceil(int * 2 / 10) * 10), hi = Math.max(lo, Math.round(bal * 0.1 / 10) * 10);
      const pay = lo + 10 * Math.floor(Math.random() * ((hi - lo) / 10 + 1));
      n = { name: pick(NAMES), bal, rate, pay };
    } while (n.bal === q.bal && n.rate === q.rate && n.pay === q.pay);
    q = n;
  }

  // ---------- one month: the work, one step at a time ----------
  const ONE_STEPS = 5;
  function oneLines(m) {
    const L = [];
    const row = (l, r, n, s) => L.push({ l, r, n, s });
    row("Monthly rate", fr(K("int", pct(m.rate)), "12"), "Yearly rate over 12", 1);
    row("", K("int", pct(m.mr)), "", 1);
    row("", K("int", dec(m.mr)), "As a decimal", 2);
    row("Interest", `${K("bal", money(m.bal))} <span class="op">×</span> ${K("int", dec(m.mr))}`, "Balance × monthly rate", 3);
    row("", K("int", money(m.int)), "", 3);
    row("Amount owed", `${K("bal", money(m.bal))} <span class="op">+</span> ${K("int", money(m.int))}`, "Add the interest", 4);
    row("", money(m.owe), "", 4);
    row("New balance", `${money(m.owe)} <span class="op">−</span> ${K("pay", money(m.paid))}`, "Subtract the payment", 5);
    row("", K("bal", money(m.end)), "", 5);
    return L;
  }
  function oneSay(m, s) {
    if (s === 0) return `<span>A credit card charges interest every month on what you owe. Press Next step.</span>`;
    if (s === 1) return `<span>The rate on a card is for a whole year. Share it over the 12 months: ${B(pct(m.rate))} over 12 is ${B(pct(m.mr))} each month.</span>`;
    if (s === 2) return `<span>To multiply by a percent, write it as a decimal. Move the decimal point 2 places left: ${B(dec(m.mr))}.</span>`;
    if (s === 3) return `<span>Interest for one month is the balance times the monthly rate: ${B(money(m.int))}.</span>`;
    if (s === 4) return `<span>The interest is added to what you owe: ${B(money(m.owe))}.</span>`;
    if (m.end === 0) return `<span>The payment covers everything. The card is paid off.</span>`;
    if (m.paid <= m.int) return `<span>The whole payment went to interest. The debt grew to ${B(money(m.end))}.</span>`;
    return `<span>Only ${B(money(r2(m.paid - m.int)))} of the payment paid down the debt. The other ${B(money(m.int))} went to interest.</span>`;
  }
  function splitHtml(m) {
    const toInt = Math.min(m.int, m.paid), toDebt = r2(m.paid - toInt);
    const wi = toInt / m.paid * 100, wd = toDebt / m.paid * 100;
    return `<p class="cap">Where the ${K("pay", money(m.paid))} payment goes</p>
      <div class="bar">${toInt > 0 ? `<div class="bi" style="flex:${Math.max(wi, 0.5)} 1 0">${wi >= 12 ? money(toInt) : ""}</div>` : ""}${toDebt > 0 ? `<div class="bp" style="flex:${wd} 1 0">${wd >= 12 ? money(toDebt) : ""}</div>` : ""}</div>
      <div class="keys"><span class="k-int"><b>${money(toInt)}</b> to interest</span><span class="k-pay"><b>${money(toDebt)}</b> to the debt</span></div>`;
  }

  // ---------- month by month ----------
  const MONTHS_SHOWN = 6;
  function schedule(bal, rate, pay) {
    const rows = []; let b = bal, total = 0;
    while (b > 0 && rows.length < 600) {
      const m = month(b, rate, pay);
      rows.push(m); total = r2(total + m.int);
      if (m.end >= b && rows.length >= MONTHS_SHOWN) return { rows, total, never: true };
      b = m.end;
    }
    return { rows, total, never: b > 0 };
  }
  function monthSay(S, s, last) {
    if (s === 0) return `<span>Each row is one month. The new balance becomes next month's balance. Press Next step.</span>`;
    if (!last) {
      const m = S.rows[s - 1];
      return `<span>Month ${s}: interest ${B(money(m.int))}, then the payment comes off. ${B(money(m.end))} left.</span>`;
    }
    if (S.never) return `<span>The payment is not more than the interest, so the debt never goes away.</span>`;
    return `<span>Keep paying the same amount: the card is paid off in month ${B(S.rows.length)}. Total interest: ${B(money(S.total))}.</span>`;
  }
  const monthSteps = S => Math.min(MONTHS_SHOWN, S.rows.length) + 1;

  // ---------- drawing ----------
  let warnMsg = "";
  function stepsTotal() {
    if (mode === "practice") return ONE_STEPS;
    return view === "one" ? ONE_STEPS : monthSteps(schedule(q.bal, q.rate, q.pay));
  }
  function render() {
    const learn = mode === "learn";
    $("#learn").hidden = !learn; $("#practice").hidden = learn; $("#viewCard").hidden = !learn;
    $$("#modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
    $$("#views button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
    for (const [id, k] of [["#inBal", "bal"], ["#inRate", "rate"], ["#inPay", "pay"]]) {
      const el = $(id); el.readOnly = !learn;
      if (document.activeElement !== el) el.value = k === "rate" ? trim(q.rate, 4) : grp(mnum(q[k]));
    }
    const w = $("#warn"); w.hidden = !warnMsg; w.textContent = warnMsg;
    $("#story").innerHTML = mode === "practice" || view === "one"
      ? `<span><span class="who">${q.name}</span> owes ${K("bal", money(q.bal))} on a credit card that charges ${K("int", pct(q.rate))} a year. <span class="who">${q.name}</span> pays ${K("pay", money(q.pay))} this month. Find the interest and the new balance.</span>`
      : `<span><span class="who">${q.name}</span> owes ${K("bal", money(q.bal))} at ${K("int", pct(q.rate))} a year and pays ${K("pay", money(q.pay))} every month. How long until the card is paid off?</span>`;

    const months = learn && view === "months";
    $("#oneView").hidden = months; $("#monthView").hidden = !months;
    if (warnMsg) { $("#work").innerHTML = ""; $("#split").hidden = true; $("#tbl").innerHTML = ""; $("#sum").innerHTML = ""; $("#say").innerHTML = ""; $("#steplbl").textContent = ""; return; }

    const total = stepsTotal();
    if (!months) {
      const m = month(q.bal, q.rate, q.pay);
      $("#work").innerHTML = oneLines(m).filter(r => r.s <= step).map(r => {
        const nw = r.s > lastShown ? " new" : "";
        return `<div class="l${nw}">${r.l}</div><div class="e${nw}">=</div><div class="r${nw}">${r.r}</div><div class="n${nw}">${r.n}</div>`;
      }).join("");
      $("#split").hidden = step < ONE_STEPS;
      if (step >= ONE_STEPS) $("#split").innerHTML = splitHtml(m);
      $("#say").innerHTML = oneSay(m, step);
    } else {
      const S = schedule(q.bal, q.rate, q.pay);
      const shown = Math.min(step, MONTHS_SHOWN);
      const rows = S.rows.slice(0, Math.min(MONTHS_SHOWN, S.rows.length));
      $("#tbl").innerHTML = `<table><thead><tr><th>Month</th><th>Balance</th><th>+ Interest</th><th>− Payment</th><th>New balance</th><th></th></tr></thead><tbody>${
        rows.map((m, i) => {
          const cls = i >= shown ? "hid" : (i + 1 > lastShown ? "new" : "");
          const wpct = Math.min(100, m.end / Math.max(q.bal, m.end) * 100);
          return `<tr class="${cls}"><td>${i + 1}</td><td class="k-bal">${money(m.bal)}</td><td class="k-int">${money(m.int)}</td><td class="k-pay">${money(m.paid)}</td><td>${money(m.end)}</td><td class="barc"><div class="mini" style="width:${wpct}%"></div></td></tr>`;
        }).join("")}</tbody></table>`;
      $("#sum").innerHTML = step === total ? monthSay(S, step, true) : "";
      $("#say").innerHTML = monthSay(S, step, step === total);
    }
    $("#steplbl").textContent = step === 0 ? "Start" : `Step ${step} of ${total}`;
    $("#next").disabled = step >= total; $("#back").disabled = step === 0; $("#all").disabled = step >= total;
    lastShown = step;
    fit();
  }

  // Shrink the work (or the table) until it fits the board.
  function fit() {
    if (window.innerWidth <= 860 || window.innerHeight < 520) { $("#work").style.removeProperty("--wf"); $("#tbl").style.removeProperty("--tf"); return; }
    for (const [el, v, f0] of [[$("#work"), "--wf", 40], [$("#tbl"), "--tf", 30]]) {
      if (el.offsetParent === null) continue;
      let f = f0; el.style.setProperty(v, f + "px");
      while (f > 14 && (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)) { f -= 1; el.style.setProperty(v, f + "px"); }
    }
  }

  // ---------- Learn: typing in the boxes ----------
  function readInputs() {
    const bal = num($("#inBal").value), rate = num($("#inRate").value), pay = num($("#inPay").value);
    $("#inBal").classList.toggle("bad", !(bal > 0)); $("#inRate").classList.toggle("bad", !(rate > 0)); $("#inPay").classList.toggle("bad", !(pay > 0));
    if (!(bal > 0 && bal <= 100000 && rate > 0 && rate <= 60 && pay > 0)) { warnMsg = "Type a balance, a rate and a payment greater than 0."; render(); return; }
    warnMsg = "";
    q = { name: q.name, bal: r2(bal), rate, pay: r2(pay) };
    render();
  }
  ["#inBal", "#inRate", "#inPay"].forEach(id => {
    $(id).addEventListener("input", () => { if (mode === "learn") { lastShown = step; readInputs(); } });
    $(id).addEventListener("change", () => { if (mode === "learn" && !warnMsg) render(); });
  });

  // ---------- buttons ----------
  $("#next").onclick = () => { if (step < stepsTotal()) { step++; render(); } };
  $("#back").onclick = () => { if (step > 0) { step--; lastShown = step; render(); } };
  $("#all").onclick = () => { step = stepsTotal(); render(); };
  $("#newex").onclick = () => { newQuestion(); warnMsg = ""; step = 0; lastShown = 0; render(); };
  $$("#modes button").forEach(b => b.onclick = () => {
    if (mode === b.dataset.mode) return;
    mode = b.dataset.mode; warnMsg = "";
    if (mode === "practice") startPractice(); else { step = 0; lastShown = 0; render(); }
  });
  $$("#views button").forEach(b => b.onclick = () => { view = b.dataset.view; step = 0; lastShown = 0; render(); });

  // ---------- Practice ----------
  function startPractice() {
    newQuestion(); step = 0; lastShown = 0; pr.done = false;
    for (const id of ["#ansInt", "#ansBal"]) { $(id).value = ""; $(id).classList.remove("bad", "ok"); }
    $("#fb").textContent = ""; $("#fb").className = "fb";
    render();
  }
  function feedback(m, gi, gb) {
    const near = (a, b) => Math.abs(a - b) < 0.006;
    const okI = near(gi, m.int), okB = near(gb, m.end);
    if (!okI) {
      if (near(gi, r2(m.bal * m.rate / 100))) return [okI, okB, "That uses the yearly rate. Use the monthly rate: the yearly rate over 12."];
      if (near(gi, r2(m.bal * m.mr))) return [okI, okB, "Write the monthly rate as a decimal before you multiply."];
      if (near(gi, r2(m.bal * m.rate))) return [okI, okB, "Write the rate as a decimal before you multiply."];
      return [okI, okB, "Check the interest: balance × monthly rate."];
    }
    if (!okB) {
      if (near(gb, r2(m.bal - m.paid))) return [okI, okB, "Add the interest before you subtract the payment."];
      if (near(gb, m.owe)) return [okI, okB, "Now subtract the payment."];
      return [okI, okB, "Check the new balance: balance + interest − payment."];
    }
    return [okI, okB, ""];
  }
  $("#check").onclick = () => {
    const m = month(q.bal, q.rate, q.pay);
    const gi = num($("#ansInt").value), gb = num($("#ansBal").value);
    if (isNaN(gi) || isNaN(gb)) { $("#fb").className = "fb no"; $("#fb").textContent = "Fill in both boxes."; return; }
    const [okI, okB, msg] = feedback(m, gi, gb);
    $("#ansInt").classList.toggle("ok", okI); $("#ansInt").classList.toggle("bad", !okI);
    $("#ansBal").classList.toggle("ok", okB); $("#ansBal").classList.toggle("bad", !okB);
    if (!pr.done) { pr.total++; if (okI && okB) pr.right++; pr.done = true; }
    $("#right").textContent = pr.right; $("#total").textContent = pr.total;
    $("#fb").className = "fb " + (okI && okB ? "ok" : "no");
    $("#fb").textContent = okI && okB ? "Correct!" : msg;
    if (okI && okB) { step = ONE_STEPS; render(); }
  };
  ["#ansInt", "#ansBal"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") $("#check").click(); }));
  $("#hint").onclick = () => { if (step < 2) { step = 2; render(); } };
  $("#showme").onclick = () => { if (step < ONE_STEPS) { step++; render(); } };
  $("#newq").onclick = startPractice;

  window.addEventListener("resize", fit);
  window.addEventListener("langchange", render);
  render();
})();
</script>

  "{0} owes {1} at {2} a year and pays {3} every month. How long until the card is paid off?": "{0} doit {1} à {2} par année et paie {3} chaque mois. Combien de temps avant que la carte soit remboursée?",
  "Type a balance, a rate and a payment greater than 0.": "Écris un solde, un taux et un paiement plus grands que 0.",
  "Fill in both boxes.": "Remplis les deux cases.",
  "That uses the yearly rate. Use the monthly rate: the yearly rate over 12.": "Tu as utilisé le taux annuel. Utilise le taux mensuel : le taux annuel sur 12.",
  "Write the monthly rate as a decimal before you multiply.": "Écris le taux mensuel en décimale avant de multiplier.",
  "Write the rate as a decimal before you multiply.": "Écris le taux en décimale avant de multiplier.",
  "Check the interest: balance × monthly rate.": "Vérifie l'intérêt : solde × taux mensuel.",
  "Add the interest before you subtract the payment.": "Ajoute l'intérêt avant de soustraire le paiement.",
  "Now subtract the payment.": "Maintenant, soustrais le paiement.",
  "Check the new balance: balance + interest − payment.": "Vérifie le nouveau solde : solde + intérêt − paiement."
};
</script>
<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
