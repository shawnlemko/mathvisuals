<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Math Fact Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
:root { --bad: #c8323c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bad: #ff6b74; } }
:root[data-theme="dark"] { --bad: #ff6b74; }

/* Choice buttons: every option looks like a big button; the chosen one is filled blue with a check mark. */
.pick { display: inline-flex; align-items: center; justify-content: center; gap: 0.4em; min-height: 58px; padding: 0.35em 0.9em; background: var(--sheet); color: var(--ink); border: 3px solid var(--grid-major); border-radius: 14px; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.2rem, 2.8vh, 1.7rem); line-height: 1.15; }
.pick:hover { border-color: var(--pt); background: var(--sheet); }
.pick[aria-pressed="true"] { background: var(--pt); border-color: var(--pt); color: var(--sheet); box-shadow: 0 3px 0 color-mix(in srgb, var(--pt) 55%, var(--ink)); }
.pick[aria-pressed="true"]::before { content: "✓"; }
.pick .sym { font-family: var(--font-body); font-size: 1.25em; word-spacing: -0.1em; }
.group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

.stage { display: grid; background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 12px; padding: clamp(14px, 2.5vh, 28px) clamp(14px, 2vw, 32px); }
.stage > section { min-width: 0; }

/* Setup: kind of facts across the top; numbers, count and Start on the left; the strategy list down the right. */
.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: auto minmax(0, 1fr); gap: clamp(12px, 2.5vh, 28px) clamp(16px, 3vw, 48px); }
@media (max-width: 860px) { .setup { grid-template-columns: 1fr; } }
.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px 40px; justify-content: center; padding-bottom: clamp(10px, 2vh, 22px); border-bottom: 2px dashed var(--grid); }
.left { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: clamp(14px, 4vh, 40px); text-align: center; min-height: 0; }
.right { display: flex; flex-direction: column; min-height: 0; }
.setup h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.25rem, 2.8vh, 1.6rem); margin: 0 0 10px; }
.list { display: grid; gap: clamp(5px, 1vh, 10px); grid-auto-flow: column; grid-template-rows: repeat(var(--rows), auto); min-height: 0; }
.item { display: grid; grid-template-columns: 1.7em minmax(0, 1fr) auto; align-items: center; gap: 0.6em; text-align: left; padding: 0.15em 0.7em; min-height: clamp(44px, 6.6vh, 64px); background: var(--sheet); color: var(--ink); border: 3px solid var(--grid-major); border-radius: 12px; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.1rem, 2.6vh, 1.55rem); line-height: 1.1; }
.item:hover { border-color: var(--pt); background: var(--sheet); }
.item .n { display: grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--chip); font-family: var(--font-num); font-size: 0.8em; }
.item .ex { word-spacing: -0.3em; font-family: var(--font-num); font-weight: 700; color: var(--muted); font-size: 0.9em; white-space: nowrap; }
.item[aria-pressed="true"] { background: var(--pt); border-color: var(--pt); color: var(--sheet); }
.item[aria-pressed="true"] .n { background: var(--sheet); color: var(--pt); }
.item[aria-pressed="true"] .n::before { content: "✓"; font-family: var(--font-display); }
.item[aria-pressed="true"] .n span { display: none; }
.item[aria-pressed="true"] .ex { color: var(--sheet); }
.go { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.8rem, 4.5vh, 2.6rem); padding: 0.4em 1.6em; border-radius: 16px; background: var(--green); border: 3px solid var(--green); color: var(--sheet); box-shadow: 0 4px 0 color-mix(in srgb, var(--green) 55%, var(--ink)); }
.go:hover { background: var(--sheet); color: var(--green); border-color: var(--green); }

/* Practice */
.play { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(16px, 2.5vw, 40px); align-items: stretch; }
@media (max-width: 860px) { .play { grid-template-columns: 1fr; } }
.qcard { display: flex; flex-direction: column; min-height: 0; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.prog { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; margin-right: auto; }
.prog b { font-family: var(--font-num); }
.topbar button { font-family: var(--font-display); font-size: 1.2rem; padding: 10px 20px; border: 3px solid var(--grid-major); border-radius: 12px; background: var(--sheet); }
.timer { font-family: var(--font-num); font-weight: 700; font-size: 1.8rem; color: var(--pt); min-width: 4ch; }
.qbox { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; min-height: 0; }
.q { word-spacing: -0.3em; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0 0.3em; font-family: var(--font-num); font-weight: 700; font-size: clamp(3.4rem, min(16vh, 9vw), 10rem); line-height: 1.1; white-space: nowrap; }
.ans { display: inline-flex; align-items: center; justify-content: center; min-width: 2.2ch; padding: 0 0.15em; border: 6px solid var(--grid-major); border-radius: 0.18em; color: var(--pt); background: var(--paper); }
.ans:empty::before { content: "?"; color: var(--grid-major); }
.ans.typing { border-color: var(--pt); }
.ans.right { border-color: var(--green); color: var(--green); }
.ans.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through; text-decoration-thickness: 0.08em; }
.fb { min-height: 1.3em; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 6vh, 3.4rem); text-align: center; }
.fb.right { color: var(--green); }
.fb.wrong { color: var(--ink); }
.fb.wrong b { color: var(--green); font-family: var(--font-num); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(6px, 1.2vh, 12px); align-self: center; width: clamp(240px, 26vw, 400px); }
.pad button { font-family: var(--font-num); font-size: clamp(1.6rem, 5vh, 2.8rem); padding: 0; height: clamp(54px, 12vh, 104px); border-radius: 12px; background: var(--paper); }
.pad button:hover { background: var(--chip); }
.pad .ok { background: var(--green); border-color: var(--green); color: var(--sheet); font-family: var(--font-display); font-size: clamp(1.1rem, 3vh, 1.7rem); }
.pad .ok:hover { background: var(--sheet); color: var(--green); }

/* Results */
.done { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2.4vh, 26px); text-align: center; }
.cheer { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 8vh, 4.4rem); color: var(--green); }
.score { display: flex; align-items: baseline; justify-content: center; gap: 0.2em; font-family: var(--font-num); font-weight: 700; font-size: clamp(3rem, 14vh, 8rem); line-height: 1; }
.score b { color: var(--green); }
.score small { font-family: var(--font-display); font-size: 0.4em; color: var(--muted); }
.rate { display: flex; align-items: baseline; justify-content: center; gap: 0.3em; font-family: var(--font-num); font-weight: 700; font-size: clamp(1.6rem, 6vh, 3.4rem); color: var(--pt); }
.rate small { font-family: var(--font-display); font-size: 0.6em; color: var(--muted); }
.miss { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 12px; max-width: 60rem; }
.miss h2 { width: 100%; margin: 0; font-family: var(--font-display); font-size: 1.25rem; }
.miss span { font-family: var(--font-num); font-weight: 700; font-size: 1.4rem; background: var(--chip); border-radius: 8px; padding: 4px 12px; }
.btns { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.btns button { font-family: var(--font-display); font-size: 1.3rem; padding: 12px 24px; border-radius: 12px; }
.btns .go { align-self: auto; font-size: 1.5rem; padding: 12px 32px; }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Math Fact Practice</h1></div>
  </header>

  <div class="stage">
    <section class="setup" id="setup">
      <div class="top">
        <div class="group" id="fam" role="group" aria-label="Kind of facts"></div>
        <div class="group" id="op" role="group" aria-label="Operation"></div>
      </div>
      <div class="left">
        <div id="sizeRow"><h2 id="sizeName">Numbers up to</h2><div class="group" id="size" role="group" aria-labelledby="sizeName"></div></div>
        <div><h2 id="countName">How many questions?</h2><div class="group" id="count" role="group" aria-labelledby="countName"></div></div>
        <button type="button" class="go" id="start">Start ▶</button>
      </div>
      <div class="right">
        <h2 id="stratName">Pick a strategy</h2>
        <div class="list" id="strat" role="group" aria-labelledby="stratName"></div>
      </div>
    </section>

    <section class="play" id="play" hidden>
      <div class="qcard">
        <div class="topbar">
          <span class="prog">Question <b id="qNum">1</b> of <b id="qTot">20</b></span>
          <span class="timer" id="timer" hidden aria-live="off">0:00</span>
          <button type="button" id="timerBtn">Show timer</button>
          <button type="button" id="stop">Stop</button>
        </div>
        <div class="qbox">
          <div class="q" aria-live="polite"><span id="qText"></span><span>=</span><span class="ans" id="ans"></span></div>
          <div class="fb" id="fb"></div>
        </div>
      </div>
      <div class="pad" id="pad" aria-label="Number keys"></div>
    </section>

    <section class="done" id="done" hidden>
      <p class="cheer" id="cheer"></p>
      <div class="score"><b id="right"></b> <small>right</small> / <span id="outOf"></span></div>
      <div class="rate"><span id="rate"></span> <small id="rateUnit">seconds</small> / 1 <small>question</small></div>
      <div class="miss" id="miss"></div>
      <div class="btns">
        <button type="button" class="go" id="again">Practice again</button>
        <button type="button" id="change">Change practice</button>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const FAMS = [["as", "+ −", "Add & Subtract"], ["md", "× ÷", "Multiply & Divide"]];
  const OPS = { as: [["add", "+", "Add"], ["sub", "−", "Subtract"], ["mix", "+ −", "Mix"]], md: [["mul", "×", "Multiply"], ["div", "÷", "Divide"], ["mix", "× ÷", "Mix"]] };
  // Addition strategy progression (subtraction uses the same one), with a sample fact for + and for −.
  const ADD_STRATS = [["five", "Facts to five", "2 + 3", "5 − 3"], ["ten", "Facts to ten", "6 + 4", "10 − 4"], ["on", "Counting on", "7 + 2", "9 − 2"], ["dbl", "Doubles", "4 + 4", "8 − 4"], ["near", "Near doubles", "4 + 5", "9 − 5"], ["nine", "Fast nines", "9 + 6", "15 − 9"], ["tricky", "Tricky ones", "7 + 5", "12 − 5"], ["mix", "Mixed", "", ""]];
  // Times tables in teaching order (division uses the same one).
  const MUL_STRATS = [["01", "1 and 0", "1 × 7", "7 ÷ 1"], ...[2, 10, 5, 3, 4, 6, 8, 9, 7, 11, 12].map(n => [String(n), n + "s", `${n} × 3`, `${n * 3} ÷ ${n}`]), ["mix", "Mixed", "", ""]];
  const SIZES = [10, 12, 20];
  const COUNTS = [10, 20, 30, 50];

  const st = { fam: "as", op: "add", strat: { as: "five", md: "01" }, size: 10, count: 20, showTimer: false };

  function pickRow(box, items, current, pick) {
    box.replaceChildren(...items.map(([v, sym, word]) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "pick";
      if (word) b.append(Object.assign(document.createElement("span"), { className: "sym", textContent: sym }), " " + word);
      else b.textContent = sym;
      b.setAttribute("aria-pressed", String(v === current));
      b.onclick = () => pick(v);
      return b;
    }));
  }
  const fixedSize = () => st.fam === "as" && ["five", "ten", "tricky"].includes(st.strat.as);

  function drawControls() {
    pickRow($("fam"), FAMS, st.fam, v => { if (v === st.fam) return; st.fam = v; st.op = v === "as" ? "add" : "mul"; drawControls(); });
    pickRow($("op"), OPS[st.fam], st.op, v => { st.op = v; drawControls(); });
    const list = st.fam === "as" ? ADD_STRATS : MUL_STRATS, back = st.op === "sub" || st.op === "div";
    $("stratName").textContent = st.fam === "as" ? "Pick a strategy" : "Pick a times table";
    const box = $("strat");
    box.style.setProperty("--rows", list.length > 8 ? Math.ceil(list.length / 2) : list.length);
    box.replaceChildren(...list.map(([v, name, exA, exB], i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "item";
      b.setAttribute("aria-pressed", String(v === st.strat[st.fam]));
      const n = Object.assign(document.createElement("span"), { className: "n" });
      n.append(Object.assign(document.createElement("span"), { textContent: i + 1 }));
      b.append(n, Object.assign(document.createElement("span"), { textContent: name }), Object.assign(document.createElement("span"), { className: "ex", textContent: back ? exB : exA }));
      b.onclick = () => { st.strat[st.fam] = v; drawControls(); };
      return b;
    }));
    $("sizeRow").hidden = fixedSize();
    pickRow($("size"), SIZES.map(n => [n, String(n)]), st.size, v => { st.size = v; drawControls(); });
    pickRow($("count"), COUNTS.map(n => [n, String(n)]), st.count, v => { st.count = v; drawControls(); });
  }

  // ---------- Fact pools ----------
  function addPairs(strat, N) {
    const out = [];
    const lim = strat === "five" ? 5 : strat === "ten" ? 10 : strat === "tricky" ? 8 : N;
    const on = (a, b) => (a >= 1 && a <= 3) || (b >= 1 && b <= 3);
    for (let a = 0; a <= lim; a++) for (let b = 0; b <= lim; b++) {
      const s = a + b;
      const ok = {
        five: s <= 5,
        ten: s <= 10,
        on: on(a, b),
        dbl: a === b,
        near: Math.abs(a - b) === 1,
        nine: a === 9 || b === 9,
        // Shawn: sums 11 to 14 whose numbers differ by 2 to 5, no nines: 7 & 4, 8 & 3, 7 & 5, 8 & 4, 8 & 5, 8 & 6.
        tricky: s >= 11 && s <= 14 && Math.abs(a - b) >= 2 && Math.abs(a - b) <= 5,
        mix: true,
      }[strat];
      if (ok) out.push([a, b]);
    }
    return out;
  }
  function mulPairs(strat, N) {
    const tables = strat === "01" ? [0, 1] : strat === "mix" ? [...Array(13).keys()] : [Number(strat)];
    const out = [];
    for (const t of tables) for (let k = 0; k <= N; k++) out.push([t, k]);
    return out;
  }
  function pool() {
    const facts = new Map();
    const put = (text, ans) => facts.set(text, { text, ans });
    const doAdd = st.op === "add" || st.op === "mix", doSub = st.op === "sub" || st.op === "mix";
    const doMul = st.op === "mul" || st.op === "mix", doDiv = st.op === "div" || st.op === "mix";
    if (st.fam === "as") {
      for (const [a, b] of addPairs(st.strat.as, st.size)) {
        if (doAdd) put(`${a} + ${b}`, a + b);
        if (doSub) { put(`${a + b} − ${a}`, b); put(`${a + b} − ${b}`, a); }
      }
    } else {
      for (const [t, k] of mulPairs(st.strat.md, st.size)) {
        if (doMul) { put(`${t} × ${k}`, t * k); put(`${k} × ${t}`, t * k); }
        if (doDiv) {
          if (t !== 0) put(`${t * k} ÷ ${t}`, k);
          if (k !== 0) put(`${t * k} ÷ ${k}`, t);
        }
      }
    }
    return [...facts.values()];
  }
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function deck(n) {
    const p = pool(), out = [];
    while (out.length < n) {
      const s = shuffle(p.slice());
      if (out.length && s.length > 1 && s[0] === out[out.length - 1]) s.push(s.shift());
      out.push(...s);
    }
    return out.slice(0, n);
  }

  // ---------- Screens ----------
  const screens = ["setup", "play", "done"];
  const show = id => screens.forEach(s => { $(s).hidden = s !== id; });
  function toSetup() { stopClock(); game = null; drawControls(); show("setup"); }

  let game = null;
  // The clock only runs while a question is waiting for an answer, so the rate is thinking time.
  let clockMs = 0, clockFrom = 0, tick = 0;
  const elapsed = () => clockMs + (clockFrom ? performance.now() - clockFrom : 0);
  const fmt = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  function runClock() { if (!clockFrom) clockFrom = performance.now(); if (!tick) tick = setInterval(drawClock, 250); }
  function pauseClock() { if (clockFrom) { clockMs += performance.now() - clockFrom; clockFrom = 0; } }
  function stopClock() { pauseClock(); clearInterval(tick); tick = 0; }
  const drawClock = () => { $("timer").textContent = fmt(elapsed()); };
  function drawTimerBtn() { $("timer").hidden = !st.showTimer; $("timerBtn").textContent = st.showTimer ? "Hide timer" : "Show timer"; }

  function start() {
    game = { qs: deck(st.count), i: 0, right: 0, missed: [], typed: "", busy: false };
    clockMs = 0; clockFrom = 0;
    $("qTot").textContent = st.count;
    drawTimerBtn(); drawClock();
    show("play");
    ask();
  }
  function ask() {
    const q = game.qs[game.i];
    game.typed = ""; game.busy = false;
    $("qNum").textContent = game.i + 1;
    $("qText").textContent = q.text;
    $("ans").textContent = ""; $("ans").className = "ans";
    $("fb").textContent = ""; $("fb").className = "fb";
    runClock();
  }
  function type(k) {
    if (!game || game.busy) return;
    if (k === "back") game.typed = game.typed.slice(0, -1);
    else if (k === "ok") return check();
    else if (game.typed.length < 3) game.typed = (game.typed === "0" ? "" : game.typed) + k;
    $("ans").textContent = game.typed;
    $("ans").classList.toggle("typing", game.typed !== "");
  }
  function check() {
    if (game.typed === "") return;
    pauseClock();
    game.busy = true;
    const q = game.qs[game.i], ok = Number(game.typed) === q.ans;
    $("ans").className = "ans " + (ok ? "right" : "wrong");
    const fb = $("fb");
    fb.className = "fb " + (ok ? "right" : "wrong");
    if (ok) { game.right++; fb.textContent = "✓ Yes!"; }
    else {
      game.missed.push(q);
      fb.replaceChildren(`${q.text} = `, Object.assign(document.createElement("b"), { textContent: q.ans }));
    }
    setTimeout(next, ok ? 700 : 1800);
  }
  function next() {
    if (!game) return;
    game.i++;
    if (game.i < game.qs.length) return ask();
    stopClock();
    finish();
  }
  function finish() {
    const n = game.qs.length, r = game.right, frac = r / n;
    $("cheer").textContent = frac === 1 ? "Perfect! 🎉" : frac >= 0.8 ? "Great job!" : frac >= 0.5 ? "Nice work!" : "Keep practicing!";
    $("right").textContent = r; $("outOf").textContent = n;
    const per = Math.round(elapsed() / 1000 / n * 10) / 10;
    $("rate").textContent = per;
    $("rateUnit").textContent = per === 1 ? "second" : "seconds";
    const miss = $("miss");
    const uniq = [...new Map(game.missed.map(q => [q.text, q])).values()];
    miss.replaceChildren();
    if (uniq.length) {
      miss.append(Object.assign(document.createElement("h2"), { textContent: "Practice these" }));
      for (const q of uniq.slice(0, 12)) miss.append(Object.assign(document.createElement("span"), { textContent: `${q.text} = ${q.ans}` }));
    }
    show("done");
  }

  // Keypad and keyboard
  const pad = $("pad");
  for (const k of ["7", "8", "9", "4", "5", "6", "1", "2", "3", "back", "0", "ok"]) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = k === "back" ? "⌫" : k === "ok" ? "Check" : k;
    if (k === "back") b.setAttribute("aria-label", "Erase");
    if (k === "ok") b.className = "ok";
    b.onclick = () => type(k);
    pad.append(b);
  }
  document.addEventListener("keydown", e => {
    if ($("play").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)) type(e.key);
    else if (e.key === "Backspace") type("back");
    else if (e.key === "Enter") { e.preventDefault(); type("ok"); }
    else return;
    if (e.key !== "Enter") e.preventDefault();
  });

  $("start").onclick = start;
  $("again").onclick = start;
  $("change").onclick = toSetup;
  $("stop").onclick = toSetup;
  $("timerBtn").onclick = () => { st.showTimer = !st.showTimer; drawTimerBtn(); drawClock(); };

  drawControls();
})();
</script>

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression

  const KEY = "mv-lang";

  });

  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
