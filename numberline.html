<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Fractions on the Number Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Fractions on the Number Line: a bar from 0 to 1 (or 2, 3) cut into denominator-many pieces, with the
   numerator's worth shaded, sitting on a number line whose ticks follow the same pieces and are labeled as decimals. */
.entry { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; }
.fin { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; color: var(--green); padding: 8px 12px; border: 2px solid currentColor; border-radius: 10px; }
.fin .bar { width: 100%; height: 4px; background: currentColor; border-radius: 2px; }
.fin input { width: 92px; height: 64px; font-family: var(--font-num); font-weight: 700; font-size: 2.6rem; color: var(--ink); background: var(--paper); border: 1px solid var(--grid-major); border-radius: 6px; text-align: center; -moz-appearance: textfield; }
.fin input::-webkit-inner-spin-button, .fin input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.equals { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; font-family: var(--font-num); font-weight: 700; font-size: 3.4rem; }
.equals .frac { color: var(--green); }
.equals .frac > span:first-child { border-bottom-width: 4px; }
.equals .decv { color: var(--pt); }
.equals .mixed { font-size: 0.6em; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
.equals .mixed .frac { color: var(--muted); }
.side { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg button { white-space: nowrap; border: 0; border-radius: 0; background: var(--sheet); font-family: var(--font-num); font-size: 1.3rem; padding: 10px 16px; min-height: 56px; }
.seg button + button { border-left: 1px solid var(--grid-major); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.seg button:disabled { color: var(--grid-major); cursor: not-allowed; }
.side .label { margin: 0; font-size: 1rem; }
#reset { font-size: 1.2rem; min-height: 56px; padding: 10px 18px; }
.err { margin: 12px 0 0; color: var(--warn); font-weight: 700; font-size: 1.2rem; }
.entry-card { margin-bottom: 20px; }

.board { padding: 12px; }
.piece { stroke: none; }
.piece.on { fill: var(--green); fill-opacity: 0.38; }
.piece.off { fill: var(--sheet); }
.cut { stroke: var(--ink); stroke-width: 2; }
/* Thick border around each whole so it reads as one "whole" (Shawn). */
.edge { fill: none; stroke: var(--ink); stroke-width: 9; stroke-linejoin: miter; }
.guide { stroke: var(--grid-major); stroke-width: 1.5; stroke-dasharray: 3 5; }
.target { stroke: var(--pt); stroke-width: 9; stroke-dasharray: 16 10; } /* as thick as the whole border (Shawn) */
.nl { stroke: var(--ink); stroke-width: 3.5; }
.nl-arrow { fill: var(--ink); }
.tick { stroke: var(--ink); stroke-width: 2.5; }
.tick.whole { stroke-width: 4; }
.tlbl { fill: var(--ink); font-family: var(--font-num); font-weight: 700; font-size: 30px; text-anchor: middle; }
.tlbl.whole { font-size: 38px; }
.dot { fill: var(--pt); stroke: var(--sheet); stroke-width: 4; }
.tchip rect { fill: var(--pt); }
.tchip text { fill: var(--sheet); font-family: var(--font-num); font-weight: 700; font-size: 36px; text-anchor: middle; }
.plbl { fill: var(--ink); font-family: var(--font-num); font-weight: 700; text-anchor: middle; }
@media (max-width: 600px) { .equals { font-size: 2.4rem; } .fin input { width: 76px; height: 56px; font-size: 2.1rem; } .side { margin-left: 0; } }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Fractions on the Number Line</h1></div>
  </header>

  <section class="card entry-card">
    <div class="entry">
      <div class="fin" role="group" aria-label="Fraction">
        <input id="n" type="number" inputmode="numeric" min="0" max="60" aria-label="Numerator">
        <span class="bar"></span>
        <input id="d" type="number" inputmode="numeric" min="1" max="20" aria-label="Denominator">
      </div>
      <div class="equals" id="eq" aria-live="polite"></div>
      <div class="side">
        <p class="label">Line</p>
        <div class="seg" id="len" role="group" aria-label="Number line length">
          <button type="button" data-len="1">0 to 1</button>
          <button type="button" data-len="2">0 to 2</button>
          <button type="button" data-len="3">0 to 3</button>
        </div>
        <button type="button" id="reset">Start over</button>
      </div>
    </div>
    <p class="err" id="err" hidden></p>
  </section>

  <div class="board"><svg id="svg" viewBox="0 0 1200 330" role="img" aria-label="Fraction bar above a number line"></svg></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("svg");
  const X0 = 60, X1 = 1140, BAR_TOP = 24, BAR_BOT = 150, LINE_Y = 214, LBL_Y = 262;
  let len = 1;

  const el = (tag, attrs, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  const gcd = (a, b) => b ? gcd(b, a % b) : a;

  // Decimal text for n/d. Terminating decimals are exact; repeating ones are cut short with "…" (full)
  // or rounded to two places (tick labels, where space is tight).
  function terminates(d) { while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1; }
  function decimal(n, d, short) {
    const g = gcd(n, d); n /= g; d /= g;
    if (terminates(d)) return String(+(n / d).toFixed(6));
    if (short) return (n / d).toFixed(2);
    return (n / d).toFixed(3) + "…";
  }

  function read() {
    const n = $("n").value === "" ? NaN : +$("n").value;
    const d = $("d").value === "" ? NaN : +$("d").value;
    if (!Number.isInteger(n) || !Number.isInteger(d)) return { err: "Type a whole number on top and on the bottom." };
    if (d < 1 || d > 20) return { err: "Use a bottom number from 1 to 20." };
    if (n < 0) return { err: "Use a top number of 0 or more." };
    if (n > 3 * d) return { err: "That is more than 3. The line goes up to 3." };
    return { n, d };
  }

  function render() {
    const f = read();
    $("err").hidden = !f.err;
    if (f.err) { $("err").textContent = f.err; $("eq").innerHTML = ""; svg.replaceChildren(); return; }
    const { n, d } = f;
    const need = Math.max(1, Math.ceil(n / d));
    if (len < need) len = need;
    document.querySelectorAll("#len button").forEach(b => {
      b.setAttribute("aria-pressed", String(+b.dataset.len === len));
      b.disabled = +b.dataset.len < need;
    });
    readout(n, d);
    draw(n, d);
  }

  function readout(n, d) {
    let html = `<span class="frac"><span>${n}</span><span>${d}</span></span><span>=</span><span class="decv">${decimal(n, d, false)}</span>`;
    if (n > d && n % d) html += `<span class="mixed">(${Math.floor(n / d)}<span class="frac"><span>${n % d}</span><span>${d}</span></span>)</span>`;
    $("eq").innerHTML = html;
  }

  function draw(n, d) {
    svg.replaceChildren();
    const total = len * d, w = (X1 - X0) / total, x = k => X0 + k * w;

    // Faint guides from every cut down to the line, so each piece lines up with its tick.
    for (let k = 1; k < total; k++) el("line", { class: "guide", x1: x(k), y1: BAR_BOT, x2: x(k), y2: LINE_Y });

    // The bar: shaded pieces, cuts, heavier lines at each whole.
    for (let k = 0; k < total; k++) el("rect", { class: "piece " + (k < n ? "on" : "off"), x: x(k), y: BAR_TOP, width: w, height: BAR_BOT - BAR_TOP });
    for (let k = 1; k < total; k++) if (k % d) el("line", { class: "cut", x1: x(k), y1: BAR_TOP, x2: x(k), y2: BAR_BOT });
    for (let i = 0; i < len; i++) el("rect", { class: "edge", x: x(i * d), y: BAR_TOP, width: d * w, height: BAR_BOT - BAR_TOP });
    // Each piece names its size when there is room.
    // Pieces count up (1/5, 2/5, 3/5 ...) so students can count the numerator; just the count when space is tight.
    const fit = chars => Math.min(30, (w - 18) / chars / 0.72);
    const full = fit(String(total).length + String(d).length + 1) >= 24;
    const pFont = full ? fit(String(total).length + String(d).length + 1) : fit(String(total).length);
    if (pFont >= 18) for (let k = 0; k < total; k++) {
      const t = el("text", { class: "plbl", x: x(k) + w / 2, y: (BAR_TOP + BAR_BOT) / 2 + pFont * 0.35, "font-size": pFont });
      t.textContent = full ? `${k + 1}/${d}` : String(k + 1);
    }

    // Number line with an arrow past the end.
    el("line", { class: "nl", x1: X0 - 20, y1: LINE_Y, x2: X1 + 34, y2: LINE_Y });
    el("path", { class: "nl-arrow", d: `M${X1 + 50} ${LINE_Y} l-20 -10 v20 z` });

    // Ticks at every piece; label as many as fit (always the wholes), using a step that divides the piece count.
    const widest = Math.max(...Array.from({ length: total + 1 }, (_, k) => decimal(k, d, true).length));
    const room = widest * 30 * 0.62 + 16;
    const steps = [];
    for (let s = 1; s <= d; s++) if (d % s === 0) steps.push(s);
    const step = steps.find(s => s * w >= room) || d;

    // Where the shaded part ends: dashed marker and a chip with its decimal.
    const tx = x(n);
    const chipText = decimal(n, d, true);
    const chipW = chipText.length * 36 * 0.62 + 28;
    const chipX = Math.min(Math.max(tx - chipW / 2, 4), 1196 - chipW);

    for (let k = 0; k <= total; k++) {
      const whole = k % d === 0;
      el("line", { class: "tick" + (whole ? " whole" : ""), x1: x(k), y1: LINE_Y - (whole ? 16 : 11), x2: x(k), y2: LINE_Y + (whole ? 16 : 11) });
      if (k % step && !whole) continue;
      if (k === n) continue; // the chip shows this one
      const label = whole ? String(k / d) : decimal(k, d, true);
      const half = label.length * (whole ? 38 : 30) * 0.31 + 6;
      if (x(k) + half > chipX && x(k) - half < chipX + chipW) continue; // keep the chip readable
      el("text", { class: "tlbl" + (whole ? " whole" : ""), x: x(k), y: LBL_Y + (whole ? 6 : 0) }).textContent = label;
    }

    el("line", { class: "target", x1: tx, y1: BAR_TOP - 10, x2: tx, y2: LINE_Y });
    el("circle", { class: "dot", cx: tx, cy: LINE_Y, r: 12 });
    const chip = el("g", { class: "tchip" });
    el("rect", { x: chipX, y: LBL_Y + 6, width: chipW, height: 50, rx: 10 }, chip);
    el("text", { x: chipX + chipW / 2, y: LBL_Y + 44 }, chip).textContent = chipText;
    svg.setAttribute("aria-label", `${n}/${d} of a bar from 0 to ${len} is shaded; it ends at ${decimal(n, d, false)} on the number line.`);
  }

  ["n", "d"].forEach(id => $(id).addEventListener("input", render));
  document.querySelectorAll("#len button").forEach(b => b.addEventListener("click", () => { len = +b.dataset.len; render(); }));
  $("reset").addEventListener("click", () => { $("n").value = 1; $("d").value = 5; len = 1; render(); });
  $("reset").click();
})();
</script>

</body>
</html>
