<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script data-goatcounter="https://shawnlemko.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<title>Circles: Radius, Diameter, Circumference, Area</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* One colour per measure, the same everywhere: radius blue, diameter green, circumference orange, area purple. */
:root { --purple: #7b3fc4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --purple: #b48cff; } }
:root[data-theme="dark"] { --purple: #b48cff; }
.k-r { color: var(--pt); } .k-b { color: var(--orange); } .k-D { color: var(--green); } .k-C { color: var(--orange); } .k-A { color: var(--purple); }

.main { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.board { display: flex; flex-direction: column; gap: 6px; }
.caption { margin: 2px 8px 0; font-size: 1.35rem; line-height: 1.3; min-height: 2.6em; font-weight: 700; text-wrap: balance; }
#bd { width: 100%; display: block; touch-action: none; }

/* Drawing */
.gl { stroke: var(--grid); stroke-width: 1; }
.rim { fill: none; stroke: var(--ink); stroke-width: 3; }
.rim.ghost { stroke: var(--grid-major); stroke-dasharray: 8 8; }
.rimC { fill: none; stroke: var(--orange); stroke-width: 9; stroke-linecap: round; }
.trace { stroke-dasharray: 100; animation: trace 1.4s ease forwards; }
@keyframes trace { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
.fillA { fill: var(--purple); fill-opacity: .22; stroke: none; }
.fillA.fade { animation: fadeIn .8s ease; }
@keyframes fadeIn { from { fill-opacity: 0; } }
.ctr { fill: var(--ink); }
.ln { stroke-width: 7; stroke-linecap: round; }
.ln.r { stroke: var(--pt); } .ln.D { stroke: var(--green); } .ln.C { stroke: var(--orange); }
.ln.thin { stroke-width: 4; opacity: .55; }
.sq { fill: var(--purple); fill-opacity: .12; stroke: var(--purple); stroke-width: 3; }
.sq.dash { fill-opacity: 0; stroke-dasharray: 10 8; }
.tick { stroke: var(--green); stroke-width: 4; }
.lbl { font-family: var(--font-num); font-weight: 700; font-size: 32px; paint-order: stroke; stroke: var(--sheet); stroke-width: 7px; stroke-linejoin: round; text-anchor: middle; dominant-baseline: central; }
.lbl.r { fill: var(--pt); } .lbl.D { fill: var(--green); } .lbl.C { fill: var(--orange); } .lbl.A { fill: var(--purple); }
.lbl.small { font-size: 24px; }
.num { font-family: var(--font-num); font-weight: 700; font-size: 17px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.key { font-family: var(--font-body); font-weight: 700; font-size: 24px; fill: var(--ink); dominant-baseline: central; }

/* Header: Learn / Practice */
.seg { display: inline-flex; }
.seg button { border-radius: 0; font-size: 1.15rem; padding: 10px 20px; }
.seg button:first-child { border-radius: 10px 0 0 10px; }
.seg button:last-child { border-radius: 0 10px 10px 0; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }

/* Learn panel */
.panel { gap: 12px; }
.panel .card { padding: 12px 16px; }
.rrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rrow label { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; }
.rval { font-family: var(--font-num); font-weight: 700; font-size: 1.7rem; color: var(--pt); }
.terms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.term { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 8px 4px; border: 3px solid var(--grid-major); border-radius: 12px; background: var(--sheet); color: var(--ink); font: inherit; font-family: var(--font-display); font-weight: 800; font-size: 1.02rem; cursor: pointer; line-height: 1.2; }
.term .sym { font-family: var(--font-num); font-size: 1.7rem; line-height: 1.1; }
.term[data-t="r"] .sym { color: var(--pt); } .term[data-t="D"] .sym { color: var(--green); }
.term[data-t="C"] .sym { color: var(--orange); } .term[data-t="A"] .sym { color: var(--purple); }
.term[aria-pressed="true"][data-t="r"] { border-color: var(--pt); background: color-mix(in srgb, var(--pt) 12%, var(--sheet)); }
.term[aria-pressed="true"][data-t="D"] { border-color: var(--green); background: color-mix(in srgb, var(--green) 12%, var(--sheet)); }
.term[aria-pressed="true"][data-t="C"] { border-color: var(--orange); background: color-mix(in srgb, var(--orange) 12%, var(--sheet)); }
.term[aria-pressed="true"][data-t="A"] { border-color: var(--purple); background: color-mix(in srgb, var(--purple) 12%, var(--sheet)); }
.def { margin: 0; font-size: 1.2rem; line-height: 1.35; }
.def b { font-family: var(--font-display); }
.nav { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.nav .stepno { font-weight: 700; color: var(--muted); margin-right: auto; }
.nav .next { font-family: var(--font-display); font-size: 1.25rem; padding: 10px 20px; background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.nav .next:hover { background: var(--sheet); color: var(--pt); }
.nav button:disabled { opacity: .4; cursor: default; }
.more { display: inline-block; margin-top: 10px; font-weight: 700; color: var(--purple); }

/* The work: = signs in one column, the step name in a column on the right */
.work { margin-top: 12px; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; font-family: var(--font-num); font-weight: 500; font-size: 1.35rem; }
.work:empty { display: none; }
.work .lhs { text-align: right; white-space: nowrap; font-weight: 700; }
.work .rhs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.work .name { font-family: var(--font-body); font-size: 1rem; color: var(--muted); border-left: 3px solid var(--grid-major); padding-left: 8px; white-space: nowrap; }
.work .new { animation: rowIn .45s ease; }
@keyframes rowIn { from { opacity: 0; transform: translateY(6px); } }
.work .other { grid-column: 1 / -1; border-top: 2px dashed var(--grid-major); margin-top: 4px; }
.work .ans { font-weight: 700; }
.work input { width: 4.2em; height: 1.65em; font-family: var(--font-num); font-weight: 700; font-size: 1.35rem; color: var(--ink); background: var(--paper); border: 2px solid var(--grid-major); border-radius: 8px; text-align: center; padding: 0 4px; }
.work select { font-family: var(--font-num); font-weight: 700; font-size: 1.25rem; height: 1.75em; padding: 0 6px; border: 2px solid var(--grid-major); border-radius: 8px; background: var(--paper); color: var(--ink); }
.work select.bad { border-color: var(--warn); } .work select.ok { border-color: var(--green); } .work select.shown { border-color: var(--orange); }
.work input.bad { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--paper)); }
.work input.ok { border-color: var(--green); }
.work input.shown { border-color: var(--orange); }
.work .frac { font-weight: 700; }

/* Practice */
#practice { gap: 10px; }
.qcard { font-size: 1.3rem; line-height: 1.4; font-weight: 700; }
.step { background: var(--sheet); border: 2px solid var(--grid); border-radius: 12px; padding: 8px 14px; }
.step.now { border-color: var(--pt); }
.step.todo { opacity: .45; }
.step.todo .body, .step.done.fold .body { display: none; }
.step h3 { display: flex; align-items: center; gap: 10px; margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; }
.step h3 .num { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--ink); color: var(--sheet); font-size: .9rem; flex: none; }
.step.now h3 .num { background: var(--pt); }
.step.done h3 .num { background: var(--green); }
.step h3 .mark { margin-left: auto; font-family: var(--font-num); font-size: 1.2rem; color: var(--green); white-space: nowrap; }
.step .body { margin-top: 8px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 12px; align-items: center; text-align: left; padding: 10px 12px; border: 3px solid var(--grid-major); border-radius: 12px; background: var(--sheet); color: var(--ink); font: inherit; cursor: pointer; }
.choice:hover { border-color: var(--pt); }
.choice svg { grid-row: span 2; width: 52px; height: 52px; }
.choice b { font-family: var(--font-num); font-size: 1.6rem; line-height: 1.15; }
.choice > span { font-size: 1rem; line-height: 1.25; color: var(--muted); }
.choice.bad { border-color: var(--warn); opacity: .6; text-decoration: line-through; text-decoration-color: var(--warn); }
.choice.ok { border-color: var(--green); background: var(--chip); }
.fb { margin: 8px 0 0; font-size: 1.15rem; font-weight: 700; line-height: 1.35; }
.fb:empty { display: none; }
.fb.ok { color: var(--green); } .fb.bad { color: var(--warn); } .fb.tip { color: var(--muted); }
.pbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pbtns button { font-size: 1.1rem; padding: 8px 16px; }
.pbtns .go { background: var(--pt); color: var(--sheet); border-color: var(--pt); font-family: var(--font-display); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
.foot .score { color: var(--muted); font-weight: 700; font-size: 1.05rem; }
.foot .score b { color: var(--ink); font-family: var(--font-num); }
#newQ { font-size: 1.1rem; padding: 10px 18px; }
#newQ.ready { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
@media (min-width: 861px) and (min-height: 520px) { .panel { overflow-y: auto; } }
@media (max-width: 560px) { .terms { grid-template-columns: repeat(2, minmax(0, 1fr)); } .choices { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Circles</h1></div>
    <div class="seg" role="group" aria-label="Learn or practice">
      <button type="button" data-mode="learn" aria-pressed="true">Learn</button>
      <button type="button" data-mode="practice" aria-pressed="false">Practice</button>
    </div>
  </header>

  <div class="main">
    <div class="board">
      <p class="caption" id="caption" aria-live="polite"></p>
      <svg id="bd" viewBox="0 0 1000 620" role="img" aria-label="A circle with its measures"></svg>
    </div>

    <!-- Learn -->
    <div class="panel" id="learnPanel">
      <div class="card">
        <div class="rrow"><label for="rad">Radius</label><span class="rval" id="rval">r = 4 cm</span></div>
        <input type="range" id="rad" min="1" max="10" step="1" value="4">
      </div>
      <div class="terms" role="group" aria-label="Pick a measure">
        <button type="button" class="term" data-t="r" aria-pressed="true"><span class="sym">r</span><span>Radius</span></button>
        <button type="button" class="term" data-t="D" aria-pressed="false"><span class="sym">D</span><span>Diameter</span></button>
        <button type="button" class="term" data-t="C" aria-pressed="false"><span class="sym">C</span><span>Circumference</span></button>
        <button type="button" class="term" data-t="A" aria-pressed="false"><span class="sym">A</span><span>Area</span></button>
      </div>
      <div class="card">
        <p class="def" id="def"></p>
        <div class="nav">
          <span class="stepno" id="stepno"></span>
          <button type="button" id="back">Back</button>
          <button type="button" class="next" id="next">Next step</button>
        </div>
        <div class="work" id="lwork"></div>
      </div>
    </div>

    <!-- Practice: pick the formula, then work it out -->
    <div class="panel" id="practice" hidden>
      <div class="card qcard" id="question"></div>
      <div class="step" id="ps1">
        <h3><span class="num">1</span><span>Which formula?</span><span class="mark" id="mark1"></span></h3>
        <div class="body">
          <div class="choices">
            <button type="button" class="choice" data-f="C">
              <svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="21" fill="none" stroke="var(--orange)" stroke-width="6"/></svg>
              <b>C = πD</b><span>Distance around</span>
            </button>
            <button type="button" class="choice" data-f="A">
              <svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="21" fill="var(--purple)" fill-opacity=".35" stroke="var(--purple)" stroke-width="3"/></svg>
              <b>A = πr²</b><span>Space inside</span>
            </button>
          </div>
          <p class="fb" id="fb1"></p>
        </div>
      </div>
      <div class="step" id="ps2">
        <h3><span class="num">2</span><span>Work it out</span><span class="mark" id="mark2"></span></h3>
        <div class="body">
          <div class="work" id="pwork"></div>
          <div class="pbtns">
            <button type="button" class="go" id="pCheck">Check</button>
            <button type="button" id="pHint">Hint</button>
            <button type="button" id="pShow">Show me</button>
          </div>
          <p class="fb" id="fb2"></p>
        </div>
      </div>
      <div class="foot">
        <span class="score">First try: <b id="score">0 of 0</b></span>
        <button type="button" id="newQ">New question</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("bd");
  const el = (tag, attrs, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  const text = (x, y, s, cls) => { const t = el("text", { x, y, class: cls }); t.textContent = s; return t; };
  const PI = 3.14;
  const fmt = x => String(Math.round(x * 100) / 100);
  const frac = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;

  // ---------- Board geometry ----------
  // The drawing matches the board's shape, so the circle is as big as the board allows.
  // The grid never stretches: 1 square is always 1 cm (or 1 m), and the circle grows on it.
  let W = 1000, H = 620, UH, UP, UR, GROUND;
  function layout() {
    const b = svg.getBoundingClientRect();
    H = 620; W = b.width > 50 && b.height > 50 ? Math.max(560, Math.min(1500, H * b.width / b.height)) : 1000;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const fit = Math.min(W / 2 - 40, H / 2 - 60);
    UH = fit / 10;   // Learn: pixels per cm, so the biggest circle (r = 10) just fits
    UP = fit / 12;   // Practice: radius up to 12
    UR = Math.min(150, (W - 60) / (2 * Math.PI + 2)) / 10;   // rolling out the circumference needs a smaller square
    GROUND = Math.min(H - 140, H / 2 + 10 * UR - 40);
  }
  layout();

  const home = (rad, u) => ({ cx: W / 2, cy: H / 2 + 6, R: rad * u, u });
  const rollStart = () => ({ cx: 30 + r * UR, cy: GROUND - r * UR, R: r * UR, u: UR });
  function grid(g) {
    const u = g.u;
    const ox = g.gx ?? g.cx, oy = g.gy ?? g.cy;
    for (let x = ox - Math.floor(ox / u) * u; x <= W; x += u) el("line", { x1: x, y1: 0, x2: x, y2: H, class: "gl" });
    for (let y = oy - Math.floor(oy / u) * u; y <= H; y += u) el("line", { x1: 0, y1: y, x2: W, y2: y, class: "gl" });
  }
  const pt = (g, a, k = 1) => [g.cx + k * g.R * Math.cos(a), g.cy + k * g.R * Math.sin(a)];
  function radius(g, a, label, cls = "") {
    const [x, y] = pt(g, a);
    el("line", { x1: g.cx, y1: g.cy, x2: x, y2: y, class: "ln r " + cls });
    if (label) {
      const mx = (g.cx + x) / 2, my = (g.cy + y) / 2, nx = -Math.sin(a), ny = Math.cos(a);
      text(mx - nx * 40, my - ny * 40, label, "lbl r");
    }
  }
  // A clear key in the corner: one square, drawn at the real size, and what it stands for.
  function legend(u, unit) {
    const h = 50, y = H - h - 8;
    el("rect", { x: 8, y, width: 330, height: h, rx: 10, fill: "var(--sheet)", stroke: "var(--grid-major)", "stroke-width": 2 });
    el("rect", { x: 22, y: y + h / 2 - u / 2, width: u, height: u, fill: "var(--chip)", stroke: "var(--ink)", "stroke-width": 3 });
    text(22 + u + 12, y + h / 2 + 1, `1 square = 1 ${unit} by 1 ${unit}`, "key");
  }
  function centre(g) { el("circle", { cx: g.cx, cy: g.cy, r: 8, class: "ctr" }); }
  function rim(g, cls = "rim") { return el("circle", { cx: g.cx, cy: g.cy, r: g.R, class: cls }); }

  // ---------- Learn ----------
  const L = { t: "r", step: 0 };
  let r = 4;
  const DEFS = {
    r: "The radius is the distance from the centre to any point on the circle.",
    D: "The diameter is the distance across the circle, through the centre. It is 2 radii long.",
    C: "The circumference is the distance around the circle. It is the circle's perimeter.",
    A: "The area is the space inside the circle. It is measured in square units.",
  };
  // Each step: caption, how many work rows show, and what the board draws.
  function steps(t) {
    const D = 2 * r, C = PI * D, A = PI * r * r;
    const given = { l: "r", r: `${r} cm`, n: "Given" };
    if (t === "r") return [
      { cap: "The radius goes from the centre to the circle.", rows: [given] },
      { cap: "Every radius of a circle is the same length.", rows: [given] },
    ];
    if (t === "D") return [
      { cap: "The diameter goes all the way across, through the centre.", rows: [given] },
      { cap: "One diameter is two radii.", rows: [given, { l: "D", r: "2r", n: "Formula" }] },
      { cap: "Put in the radius.", rows: [given, { l: "D", r: "2r", n: "Formula" }, { l: "D", r: `2 × ${r}`, n: "Substitute" }] },
      { cap: `The diameter is ${D} cm. Going back, the radius is half the diameter.`, rows: [given, { l: "D", r: "2r", n: "Formula" }, { l: "D", r: `2 × ${r}`, n: "Substitute" }, { l: "D", r: `${D} cm`, n: "Answer", ans: 1 }, { l: "r", r: frac("D", 2), n: "Other way", other: 1 }] },
    ];
    if (t === "C") {
      const base = [given, { l: "D", r: `2 × ${r} = ${D} cm`, n: "Diameter" }, { l: "C", r: "πD", n: "Formula" }];
      return [
        { cap: "The circumference is the distance around the circle.", rows: [given] },
        { cap: "Roll the circle along a line. The circumference becomes a straight line.", rows: [given] },
        { cap: "The line is a bit more than 3 diameters long: about 3.14 diameters. This number is π (pi).", rows: base },
        { cap: "Put in the diameter. Use 3.14 for π.", rows: [...base, { l: "C", r: `3.14 × ${D}`, n: "Substitute" }] },
        { cap: `The circumference is ${fmt(C)} cm. Going back, the diameter is the circumference over π.`, rows: [...base, { l: "C", r: `3.14 × ${D}`, n: "Substitute" }, { l: "C", r: `${fmt(C)} cm`, n: "Answer", ans: 1 }, { l: "D", r: frac("C", "π"), n: "Other way", other: 1 }] },
      ];
    }
    const f = { l: "A", r: "πr²", n: "Formula" };
    const pb = { l: "b", r: "πr", n: "Base: half of C" }, pa = { l: "A", r: "πr × r", n: "Base × height" };
    return [
      { cap: "The area is all the space inside the circle.", rows: [given] },
      { cap: "Cut the circle into 16 equal slices.", rows: [given] },
      { cap: "Line the slices up, one pointing up, one pointing down. They make a shape like a parallelogram.", rows: [given] },
      { cap: "The base is half the circumference: πr. The height is the radius: r.", rows: [given, pb] },
      { cap: "Area of a parallelogram is base × height.", rows: [given, pb, pa] },
      { cap: "πr × r is πr². That is the area formula for a circle.", rows: [given, pb, pa, f] },
      { cap: "Put in the radius. Use 3.14 for π.", rows: [given, f, { l: "A", r: `3.14 × ${r}²`, n: "Substitute" }] },
      { cap: `r² means r × r: ${r} × ${r} = ${r * r}.`, rows: [given, f, { l: "A", r: `3.14 × ${r}²`, n: "Substitute" }, { l: "A", r: `3.14 × ${r * r}`, n: "Square the radius" }] },
      { cap: `The area is ${fmt(A)} cm². Area is in square units.`, rows: [given, f, { l: "A", r: `3.14 × ${r}²`, n: "Substitute" }, { l: "A", r: `3.14 × ${r * r}`, n: "Square the radius" }, { l: "A", r: `${fmt(A)} cm²`, n: "Answer", ans: 1 }] },
    ];
  }

  function workRows(box, rows, prevCount) {
    box.innerHTML = rows.map((w, i) => {
      const cls = i >= prevCount ? " new" : "";
      return (w.other ? `<span class="other${cls}"></span>` : "") + `<span class="lhs k-${w.l}${cls}">${w.l}</span><span class="${cls.trim()}">=</span><span class="rhs${w.ans ? " ans" : ""}${cls}">${w.r}</span><span class="name${cls}">${w.n}</span>`;
    }).join("");
  }

  let anim = null;
  function stopAnim() { if (anim) cancelAnimationFrame(anim); anim = null; }
  function tween(ms, fn, done) {
    stopAnim();
    const t0 = performance.now();
    const tick = now => {
      const k = Math.min(1, (now - t0) / ms);
      fn(k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
      if (k < 1) anim = requestAnimationFrame(tick); else { anim = null; done && done(); }
    };
    anim = requestAnimationFrame(tick);
  }
  const lerp = (a, b, k) => ({ cx: a.cx + (b.cx - a.cx) * k, cy: a.cy + (b.cy - a.cy) * k, R: a.R + (b.R - a.R) * k, u: a.u + (b.u - a.u) * k });

  // Circumference rolling out: after rolling a share k of one turn, the orange left on the circle is the rest.
  function rolled(k, showD) {
    const RR = r * UR, X0 = 30 + RR;
    const g = { cx: X0 + k * 2 * Math.PI * RR, cy: GROUND - RR, R: RR, u: UR, gx: X0, gy: GROUND };
    grid(g);
    el("line", { x1: 20, y1: GROUND, x2: W - 20, y2: GROUND, stroke: "var(--grid-major)", "stroke-width": 3 });
    rim(g);
    const th = k * 2 * Math.PI, a1 = Math.PI / 2 + th, a2 = Math.PI / 2 + 2 * Math.PI;
    if (k < 1) {
      const [x1, y1] = pt(g, a1), [x2, y2] = pt(g, a2 - 1e-4);
      el("path", { d: `M${x1} ${y1} A${RR} ${RR} 0 ${2 * Math.PI - th > Math.PI ? 1 : 0} 1 ${x2} ${y2}`, class: "rimC" });
    }
    if (k > 0) el("line", { x1: X0, y1: GROUND, x2: g.cx, y2: GROUND, class: "rimC" });
    // Number the grid along the line, in cm, starting where the roll starts.
    const every = UR >= 24 ? 1 : UR >= 12 ? 2 : 5;
    for (let n = 0; X0 + n * UR <= W - 20; n += every) {
      el("line", { x1: X0 + n * UR, y1: GROUND, x2: X0 + n * UR, y2: GROUND + 8, stroke: "var(--ink)", "stroke-width": 2 });
      text(X0 + n * UR, GROUND + 20, String(n), "num");
    }
    radius(g, a1, "", "thin");
    centre(g);
    if (showD) {
      const y = GROUND + 50, L2 = 2 * RR;
      for (let i = 0; i < 3; i++) {
        const xa = X0 + i * L2, xb = xa + L2;
        el("line", { x1: xa + 3, y1: y, x2: xb - 3, y2: y, class: "ln D" });
        el("line", { x1: xa + 3, y1: y - 14, x2: xa + 3, y2: y + 14, class: "tick" });
        el("line", { x1: xb - 3, y1: y - 14, x2: xb - 3, y2: y + 14, class: "tick" });
        text((xa + xb) / 2, y + 42, "D", "lbl D");
      }
      const xs = X0 + 3 * L2, xe = X0 + 2 * Math.PI * RR;
      el("line", { x1: xs + 3, y1: y, x2: xe, y2: y, class: "ln D", opacity: .55 });
      text(Math.max((xs + xe) / 2 + 6, xs + 30), y + 42, "0.14", "lbl D small");
      // the same diameter, inside the rolled circle
      el("line", { x1: g.cx - RR, y1: g.cy, x2: g.cx + RR, y2: g.cy, class: "ln D" });
      text(g.cx, g.cy - RR - 26, "D", "lbl D");
      text(Math.max(X0 + Math.PI * RR, 170), GROUND - 32, `C ≈ 3.14 × D`, "lbl C");
    }
    legend(UR, "cm");
  }

  // Area: 16 slices of the circle slide into a row, alternating up and down, to make a parallelogram.
  const N = 16;
  function slices(g, k, labels) {
    const a = 2 * Math.PI / N, h = a / 2, R = g.R, c = 2 * R * Math.sin(h), hc = R * Math.cos(h);
    const x0 = g.cx - (N / 2 + .5) * c / 2, ybot = g.cy + hc / 2, ytop = ybot - hc;
    const shape = `M0 0 L${R * Math.cos(-h)} ${R * Math.sin(-h)} A${R} ${R} 0 0 1 ${R * Math.cos(h)} ${R * Math.sin(h)} Z`;
    const arc = `M${R * Math.cos(-h)} ${R * Math.sin(-h)} A${R} ${R} 0 0 1 ${R * Math.cos(h)} ${R * Math.sin(h)}`;
    const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
    for (let i = 0; i < N; i++) {
      const m = (i + .5) * a, bottom = i < N / 2;
      // bottom-half slices end up pointing up (arc on the bottom); top-half slices point down (arc on top)
      const j = bottom ? N / 2 - 1 - i : i - N / 2;
      const tx = bottom ? x0 + (j + 1) * c : x0 + (j + .5) * c, ty = bottom ? ytop : ybot;
      const tr = bottom ? Math.PI / 2 : 3 * Math.PI / 2;
      const kk = ease(Math.min(1, Math.max(0, k * 1.6 - (i % (N / 2)) * .6 / (N / 2))));   // slices move one after another
      const x = g.cx + (tx - g.cx) * kk, y = g.cy + (ty - g.cy) * kk, rot = (m + (tr - m) * kk) * 180 / Math.PI;
      const grp = el("g", { transform: `translate(${x} ${y}) rotate(${rot})` });
      el("path", { d: shape, fill: "var(--purple)", "fill-opacity": bottom ? .22 : .45, stroke: "var(--sheet)", "stroke-width": 2, "stroke-linejoin": "round" }, grp);
      el("path", { d: arc, fill: "none", stroke: "var(--orange)", "stroke-width": 5, "stroke-linecap": "round" }, grp);
    }
    if (k === 0) centre(g);
    if (labels) {
      const xl = x0 + .5 * c, xr = x0 + (N / 2) * c;
      el("line", { x1: x0, y1: ytop - 26, x2: xr, y2: ytop - 26, class: "ln C", "stroke-width": 4 });
      el("line", { x1: x0, y1: ytop - 38, x2: x0, y2: ytop - 14, class: "tick", stroke: "var(--orange)" });
      el("line", { x1: xr, y1: ytop - 38, x2: xr, y2: ytop - 14, class: "tick", stroke: "var(--orange)" });
      text((x0 + xr) / 2, ytop - 58, "base = half of C = πr", "lbl C small");
      el("line", { x1: xl, y1: ybot, x2: xl, y2: ytop, class: "ln r", "stroke-width": 5 });
      text(xl - 14, (ytop + ybot) / 2, "height = r", "lbl r small").setAttribute("text-anchor", "end");
    }
  }

  function drawLearn(animate) {
    stopAnim();
    svg.innerHTML = "";
    const g = home(r, UH), t = L.t, s = L.step, D = 2 * r, small = g.R < 110;
    if (t === "C" && s >= 1) {
      if (animate && s === 1) {
        tween(700, k => { svg.innerHTML = ""; const h = lerp(home(r, UH), rollStart(), k); grid(h); rim(h); el("circle", { cx: h.cx, cy: h.cy, r: h.R, class: "rimC" }); centre(h); },
          () => tween(2600, k => { svg.innerHTML = ""; rolled(k, false); }));
      } else rolled(1, s >= 2);
      return;
    }
    grid(g);
    if (t === "A" && s >= 1) {
      if (s === 2 && animate) tween(2200, k => { svg.innerHTML = ""; grid(g); slices(g, k, false); legend(UH, "cm"); });
      else { slices(g, s >= 2 ? 1 : 0, s >= 3); legend(UH, "cm"); }
      return;
    }
    if (t === "A") el("circle", { cx: g.cx, cy: g.cy, r: g.R, class: "fillA" + (animate && s === 0 ? " fade" : "") });
    rim(g);
    if (t === "C") { const c = el("circle", { cx: g.cx, cy: g.cy, r: g.R, class: "rimC" + (animate ? " trace" : ""), pathLength: 100, transform: `rotate(90 ${g.cx} ${g.cy})` }); text(g.cx, small ? g.cy - g.R - 26 : g.cy - g.R + 32, "C", "lbl C"); }
    if (t === "r") {
      if (s >= 1) for (let i = 1; i < 8; i++) radius(g, -Math.PI / 5 + i * Math.PI / 4, "", "thin");
      radius(g, -Math.PI / 5, `r = ${r} cm`);
    }
    if (t === "D") {
      el("line", { x1: g.cx - g.R, y1: g.cy, x2: g.cx + g.R, y2: g.cy, class: "ln D" });
      text(g.cx, small ? g.cy + g.R + 30 : g.cy + 42, s >= 3 ? `D = ${D} cm` : "D", "lbl D");
      if (s >= 1) {
        el("line", { x1: g.cx - g.R, y1: g.cy - 14, x2: g.cx - 6, y2: g.cy - 14, class: "ln r", "stroke-width": 5 });
        el("line", { x1: g.cx + 6, y1: g.cy - 14, x2: g.cx + g.R, y2: g.cy - 14, class: "ln r", "stroke-width": 5 });
        if (small) {
          text(g.cx - g.R - 14, g.cy - 14, s >= 2 ? `r = ${r}` : "r", "lbl r").setAttribute("text-anchor", "end");
          text(g.cx + g.R + 14, g.cy - 14, s >= 2 ? `r = ${r}` : "r", "lbl r").setAttribute("text-anchor", "start");
        } else {
          text(g.cx - g.R / 2, g.cy - 48, s >= 2 ? `r = ${r}` : "r", "lbl r");
          text(g.cx + g.R / 2, g.cy - 48, s >= 2 ? `r = ${r}` : "r", "lbl r");
        }
      }
    }
    if (t === "A" && s === 0) text(g.cx, small ? g.cy + g.R + 30 : g.cy + g.R / 2, "A", "lbl A");
    if (t === "A") radius(g, Math.PI * 0.75, s >= 1 ? "r" : "");
    centre(g);
    legend(UH, "cm");
  }

  let lastRows = 0;
  function showLearn(animate = true) {
    const all = steps(L.t), s = all[L.step];
    $("caption").textContent = s.cap;
    $("def").textContent = DEFS[L.t];
    $("stepno").textContent = `Step ${L.step + 1} of ${all.length}`;
    $("back").disabled = L.step === 0;
    $("next").disabled = L.step === all.length - 1;
    workRows($("lwork"), s.rows, animate ? lastRows : s.rows.length);
    lastRows = s.rows.length;
    drawLearn(animate);
  }
  document.querySelectorAll(".term").forEach(b => b.addEventListener("click", () => {
    L.t = b.dataset.t; L.step = 0; lastRows = 0;
    document.querySelectorAll(".term").forEach(x => x.setAttribute("aria-pressed", x === b));
    showLearn();
  }));
  $("next").addEventListener("click", () => { if (L.step < steps(L.t).length - 1) { L.step++; showLearn(); } });
  $("back").addEventListener("click", () => { if (L.step > 0) { L.step--; lastRows = 99; showLearn(); } });
  $("rad").addEventListener("input", e => { r = +e.target.value; $("rval").textContent = `r = ${r} cm`; showLearn(false); });

  // ---------- Practice ----------
  // Each task is a real situation: f = the formula it needs, g = what you are given, ask = what to find.
  const TASKS = [
    { f: "C", u: "cm", s: "A bike wheel has a {g}.", q: "How far does the bike roll in one full turn of the wheel?" },
    { f: "C", u: "m", s: "A round garden has a {g}.", q: "How much fence goes around the edge?" },
    { f: "C", u: "cm", s: "A round cake has a {g}.", q: "How long a ribbon wraps once around the side?" },
    { f: "C", u: "m", s: "A circular track has a {g}.", q: "How far is one lap?" },
    { f: "C", u: "m", s: "A round trampoline has a {g}.", q: "How long is the padding around its edge?" },
    { f: "A", u: "m", s: "A round rug has a {g}.", q: "How much floor does it cover?" },
    { f: "A", u: "cm", s: "A pizza has a {g}.", q: "What is the area of the top of the pizza?" },
    { f: "A", u: "m", s: "A round pond has a {g}.", q: "How big a cover does the pond need?" },
    { f: "A", u: "m", s: "A circular lawn has a {g}.", q: "How much ground needs grass seed?" },
    { f: "A", u: "cm", s: "A round clock has a {g}.", q: "How much glass covers the clock face?" },
    { f: "C", u: "cm", s: "A tree trunk measures {g} around.", q: "What is the diameter of the trunk?", rev: 1 },
    { f: "C", u: "cm", s: "A round plate is {g} around.", q: "What is the diameter of the plate?", rev: 1 },
    { f: "C", u: "m", s: "A circular pool has an edge {g} long.", q: "What is the diameter of the pool?", rev: 1 },
  ];
  const P = { q: null, step: 1, firstTry: true, solved: false, right: 0, total: 0, shown: 0 };
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  let lastTask = -1;

  function newQuestion() {
    let i; do i = rnd(0, TASKS.length - 1); while (i === lastTask); lastTask = i;
    const T = TASKS[i], useD = !T.rev && Math.random() < .5;
    const rr = rnd(2, 12), D = 2 * rr, u = T.u;
    const q = { ...T, r: rr, D, useD, C: PI * D, A: PI * rr * rr };
    // The given measure and the work rows. Blanks: { a: number } or { s: text, opts } for a pick list.
    // Nothing is pre-worked: students choose what the formula needs, do each calculation and pick the units.
    const units = { s: T.f === "A" && !T.rev ? `${u}²` : u, opts: [u, `${u}²`], unit: 1 };
    const need = T.f === "C" ? "D" : "r", needVal = need === "D" ? D : rr;
    const needRow = { l: { s: need, opts: ["r", "D"], need: 1 }, r: [{ a: needVal, needV: 1 }], n: "What the formula needs" };
    if (T.rev) {
      q.given = `${fmt(q.C)} ${u}`;
      q.ask = "D";
      q.rows = [
        { l: "C", r: ["πD"], n: "Formula" },
        { l: { a: q.C }, r: ["3.14 × D"], n: "Substitute" },
        { l: "D", r: [{ frac: [{ a: q.C }, { a: PI }] }], n: "Get D alone" },
        { l: "D", r: [{ a: D, ans: 1 }, units], n: "Answer" },
      ];
    } else if (T.f === "C") {
      q.given = useD ? `diameter of ${D} ${u}` : `radius of ${rr} ${u}`;
      q.ask = "C";
      q.rows = [
        needRow,
        { l: "C", r: ["πD"], n: "Formula" },
        { l: "C", r: ["3.14 ×", { a: D }], n: "Substitute" },
        { l: "C", r: [{ a: q.C, ans: 1 }, units], n: "Answer" },
      ];
    } else {
      q.given = useD ? `diameter of ${D} ${u}` : `radius of ${rr} ${u}`;
      q.ask = "A";
      q.rows = [
        needRow,
        { l: "A", r: ["πr²"], n: "Formula" },
        { l: "A", r: ["3.14 ×", { a: rr, sq: 1 }], n: "Substitute" },
        { l: "A", r: ["3.14 ×", { a: rr * rr }], n: "Square the radius" },
        { l: "A", r: [{ a: q.A, ans: 1 }, units], n: "Answer" },
      ];
    }
    q.blanks = [];
    const add = (p, w) => { if (typeof p !== "object") return; if (p.frac) return p.frac.forEach(x => add(x, w)); q.blanks.push(Object.assign(p, { w })); };
    q.rows.forEach(w => [w.l, ...w.r].forEach(p => add(p, w)));
    q.blanks.forEach((b, i) => b.i = i);
    P.q = q; P.step = 1; P.firstTry = true; P.solved = false; P.counted = false;
    const sentence = T.s.replace("{g}", q.given);
    $("question").innerHTML = `<span>${sentence}</span> <span>${T.q}</span>`;
    document.querySelectorAll(".choice").forEach(c => c.classList.remove("bad", "ok"));
    $("fb1").textContent = ""; $("fb2").textContent = ""; $("fb2").className = "fb";
    $("mark1").textContent = ""; $("mark2").textContent = "";
    $("newQ").classList.remove("ready");
    renderWork();
    setSteps();
    drawPractice();
  }

  function renderWork() {
    const q = P.q;
    const part = p => typeof p !== "object" ? p
      : p.frac ? `<span class="frac"><span>${part(p.frac[0])}</span><span>${part(p.frac[1])}</span></span>`
      : p.sq ? `<span style="white-space:nowrap">${inputFor(p)}²</span>` : inputFor(p);
    $("pwork").innerHTML = q.rows.map(w => {
      const lhs = part(w.l), rhs = w.r.map(part).join(" ");
      return `<span class="lhs${typeof w.l === "object" ? "" : " k-" + w.l}">${lhs}</span><span>=</span><span class="rhs">${rhs}</span><span class="name">${w.n}</span>`;
    }).join("");
  }
  const inputFor = b => b.opts ? `<select data-b="${b.i}" aria-label="${b.unit ? "Units" : "Radius or diameter"}"><option value="">?</option>${b.opts.map(o => `<option>${o}</option>`).join("")}</select>`
    : `<input data-b="${b.i}" inputmode="decimal" data-pad="dec" autocomplete="off" aria-label="Answer box">`;
  const empty = e => e.value.trim() === "";
  const right = (e, b) => b.s ? e.value === b.s : val(e) !== null && near(val(e), b.a);

  function setSteps() {
    const s1 = $("ps1"), s2 = $("ps2");
    s1.className = "step " + (P.step === 1 ? "now" : "done fold");
    s2.className = "step " + (P.step === 2 ? "now" : P.step > 2 ? "done" : "todo");
  }

  function drawPractice() {
    stopAnim();
    svg.innerHTML = "";
    const q = P.q, g = home(q.r, UP), small = g.R < 110;
    grid(g);
    const known = P.step >= 2, done = P.solved, u = q.u;
    if (q.ask === "A" && known) el("circle", { cx: g.cx, cy: g.cy, r: g.R, class: "fillA" });
    rim(g);
    if (q.rev || (q.ask === "C" && known)) el("circle", { cx: g.cx, cy: g.cy, r: g.R, class: "rimC" });
    if (q.rev) {
      text(g.cx, g.cy - g.R - 24, `C = ${fmt(q.C)} ${u}`, "lbl C");
      if (known) {
        el("line", { x1: g.cx - g.R, y1: g.cy, x2: g.cx + g.R, y2: g.cy, class: "ln D" });
        text(g.cx, small ? g.cy + g.R + 30 : g.cy + 42, done ? `D = ${q.D} ${u}` : "D = ?", "lbl D");
      }
    } else if (q.useD) {
      el("line", { x1: g.cx - g.R, y1: g.cy, x2: g.cx + g.R, y2: g.cy, class: "ln D" });
      text(g.cx, small ? g.cy + g.R + 30 : g.cy + 42, `D = ${q.D} ${u}`, "lbl D");
    } else radius(g, -Math.PI / 5, `r = ${q.r} ${u}`);
    if (known && q.ask === "C") text(g.cx, g.cy - g.R - 24, done ? `C = ${fmt(q.C)} ${u}` : "C = ?", "lbl C");
    if (known && q.ask === "A") text(g.cx, small ? g.cy + g.R + 30 : g.cy + g.R * .55, done ? `A = ${fmt(q.A)} ${u}²` : "A = ?", "lbl A");
    centre(g);
    legend(UP, u);
    $("caption").textContent = P.step === 1 ? "Read the question. Does it ask for the distance around, or the space inside?"
      : done ? "Solved!" : q.ask === "D" ? "You know the circumference. Work back to the diameter."
      : q.ask === "C" ? "Distance around: the circumference." : "Space inside: the area.";
  }

  // Step 1: pick the formula
  document.querySelectorAll(".choice").forEach(c => c.addEventListener("click", () => {
    if (P.step !== 1) return;
    const q = P.q, fb = $("fb1");
    if (c.dataset.f === q.f) {
      c.classList.add("ok");
      $("mark1").textContent = q.f === "C" ? "✓ C = πD" : "✓ A = πr²";
      P.step = 2; setSteps(); drawPractice();
      $("fb2").textContent = "Fill in the boxes, then press Check."; $("fb2").className = "fb tip";
      const first = $("pwork").querySelector("input"); if (first && matchMedia("(pointer: fine)").matches) first.focus();
    } else {
      c.classList.add("bad"); P.firstTry = false;
      fb.className = "fb bad";
      fb.textContent = q.rev ? "You know the distance around. C = πD links the circumference to the diameter."
        : q.f === "C" ? "This asks for a distance around the edge. That is the circumference, not the area."
        : "This asks for the space inside, covering a surface. That is the area, not the circumference.";
    }
  }));

  // Step 2: check the boxes
  const val = inp => { const s = inp.value.trim().replace(",", "."); return s === "" || isNaN(+s) ? null : +s; };
  const near = (a, b) => Math.abs(a - b) < 0.006;
  function why(b, v) {
    const q = P.q, last = !!b.ans;
    if (b.need) return q.f === "C" ? "C = πD uses the diameter, D." : "A = πr² uses the radius, r.";
    if (b.unit) return q.ask === "A" ? "Area covers a surface, so it is in square units." : "This is a length, so it is not in square units.";
    if (b.needV && q.f === "C" && near(v, q.r)) return "That is the radius. The diameter is 2 radii.";
    if (b.needV && q.f === "A" && near(v, q.D)) return "That is the diameter. The radius is half the diameter.";
    if (q.ask === "C" && last) {
      if (near(v, PI * q.r)) return "That used the radius. C = πD needs the diameter.";
      if (near(v, q.A)) return "That is the area. This question asks for the distance around.";
    }
    if (q.ask === "A" && last) {
      if (near(v, PI * q.D * q.D)) return "That used the diameter. A = πr² needs the radius.";
      if (near(v, PI * q.r * 2)) return "r² means r × r, not r × 2.";
      if (near(v, q.C)) return "That is the circumference. This question asks for the space inside.";
    }
    if (q.ask === "A" && b.a === q.r * q.r && near(v, q.r * 2)) return "r² means r × r, not r × 2.";
    if (q.ask === "C" && !b.needV && b.a === q.D && near(v, q.r) && b.w.n === "Substitute") return "C = πD needs the diameter, not the radius.";
    if (q.ask === "D" && last && near(v, q.C * PI)) return "D is the circumference over 3.14. Divide, don't multiply.";
    return null;
  }
  function hintFor(b) {
    const q = P.q, n = b.w.n;
    if (b.need) return "Look at the formula you picked. Which letter is in it, r or D?";
    if (b.needV) return q.f === "C" ? (q.useD ? "The question gives the diameter." : `The diameter is 2 radii: 2 × ${q.r}.`)
      : (q.useD ? `The radius is half the diameter: ${q.D} over 2.` : "The question gives the radius.");
    if (b.unit) return q.ask === "A" ? "Area is in square units." : "A length is not in square units.";
    if (n === "Get D alone") return b === b.w.r[0].frac[0] ? "The top is the circumference." : "Divide both sides by 3.14.";    if (n === "Find the diameter") return `The diameter is 2 radii: 2 × ${q.r}.`;
    if (n === "Find the radius") return `The radius is half the diameter: ${q.D} over 2.`;
    if (n === "Substitute" && q.ask === "D") return "Put the circumference in for C.";
    if (n === "Substitute" && q.ask === "C") return `Put the diameter in for D. D = ${q.D}.`;
    if (n === "Substitute") return `Put the radius in for r. r = ${q.r}.`;
    if (n === "Square the radius") return `r² means r × r: ${q.r} × ${q.r}.`;
    if (q.ask === "D") return `Work out ${fmt(q.C)} over 3.14.`;
    if (q.ask === "C") return `Multiply: 3.14 × ${q.D}.`;
    return `Multiply: 3.14 × ${q.r * q.r}.`;
  }
  const inputs = () => [...$("pwork").querySelectorAll("input, select")];
  function check() {
    if (P.step !== 2 || P.solved) return;
    const q = P.q, fb = $("fb2");
    let bad = null, emptyEl = null;
    inputs().forEach(inp => {
      const b = q.blanks[+inp.dataset.b];
      inp.classList.remove("bad", "ok");
      if (empty(inp)) { if (!emptyEl) emptyEl = inp; return; }
      if (right(inp, b)) inp.classList.add("ok"); else { inp.classList.add("bad"); if (!bad) bad = inp; }
    });
    if (bad) {
      P.firstTry = false;
      const b = q.blanks[+bad.dataset.b];
      fb.className = "fb bad"; fb.textContent = why(b, val(bad)) || "Not yet. Check the red box. " + hintFor(b);
      bad.focus(); return;
    }
    if (emptyEl) { fb.className = "fb tip"; fb.textContent = "Good so far. Fill in the next box."; emptyEl.focus(); return; }
    solved();
  }
  function solved() {
    const q = P.q;
    P.solved = true; P.step = 3; setSteps();
    if (!P.counted) { P.total++; if (P.firstTry) P.right++; P.counted = true; }
    $("score").textContent = `${P.right} of ${P.total}`;
    const ans = q.ask === "D" ? `D = ${q.D} ${q.u}` : q.ask === "C" ? `C = ${fmt(q.C)} ${q.u}` : `A = ${fmt(q.A)} ${q.u}²`;
    $("mark2").textContent = "✓ " + ans;
    $("fb2").className = "fb ok"; $("fb2").textContent = P.firstTry ? "Correct on the first try!" : "Correct!";
    $("newQ").classList.add("ready");
    drawPractice();
  }
  $("pCheck").addEventListener("click", check);
  $("pwork").addEventListener("change", e => { if (e.target.tagName === "SELECT") e.target.classList.remove("bad", "ok"); });
  $("pwork").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  $("pHint").addEventListener("click", () => {
    if (P.step !== 2 || P.solved) return;
    const q = P.q, inp = inputs().find(i => !right(i, q.blanks[+i.dataset.b]));
    if (!inp) return check();
    $("fb2").className = "fb tip"; $("fb2").textContent = hintFor(q.blanks[+inp.dataset.b]);
    inp.focus();
  });
  // Show me fills one box at a time, top to bottom.
  $("pShow").addEventListener("click", () => {
    if (P.step !== 2 || P.solved) return;
    const q = P.q, inp = inputs().find(i => !right(i, q.blanks[+i.dataset.b]));
    if (!inp) return check();
    P.firstTry = false;
    const b = q.blanks[+inp.dataset.b];
    inp.value = b.s ?? fmt(b.a); inp.classList.remove("bad"); inp.classList.add("shown");
    $("fb2").className = "fb tip"; $("fb2").textContent = hintFor(b);
    if (inputs().every(i => right(i, q.blanks[+i.dataset.b]))) solved();
  });
  $("newQ").addEventListener("click", newQuestion);

  // ---------- Mode switch ----------
  function setMode(m) {
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
    $("learnPanel").hidden = m !== "learn";
    $("practice").hidden = m !== "practice";
    if (m === "learn") showLearn(false);
    else if (!P.q) newQuestion(); else drawPractice();
  }
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { layout(); if ($("practice").hidden) showLearn(false); else drawPractice(); }, 120); });
  showLearn(false);
})();
</script>
<script>
/* Keypad: a big on-screen number pad for tablets, shared by the K-6 tools.
   Opt in per box: <input data-pad>            digits only
                   <input data-pad="dec">      digits and a decimal point
                   <input data-pad="neg">      digits and a minus sign
                   <input data-pad="dec neg">  both
   When a box is tapped with a finger or pen, the iPad keyboard stays away and this pad opens beside the box.
   A mouse click still uses the normal keyboard. Each key is sent to the box as a real key press (keydown, then
   input), so the tool's own typing rules still apply; ✓ sends Enter. Boxes made later are picked up too.
   Steppers: <input data-step min="1" max="20"> gets big − and + buttons on its sides (data-step="below": under it).
   They count by 1 inside min and max and send input and change, like typing would. */
(function () {
  const css = `
.kpad { position: fixed; z-index: 1000; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px;
  width: 260px; background: var(--sheet, #fff); border: 3px solid var(--grid-major, #b9c9d8); border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.kpad[hidden] { display: none; }
.kpad button { font-family: var(--font-num, inherit); font-size: 2rem; font-weight: 700; height: 62px; padding: 0; margin: 0;
  border-radius: 12px; border: 2px solid var(--grid-major, #b9c9d8); background: var(--paper, #f5f8fb); color: var(--ink, #1b2733);
  touch-action: manipulation; }
.kpad button:active { background: var(--chip, #eaf0f6); border-color: var(--pt, #2f5fd0); }
.kpad .kp-ok { background: var(--green, #1f7a5a); border-color: var(--green, #1f7a5a); color: var(--sheet, #fff); }
.kpad .kp-x { grid-column: 3; font-size: 1.3rem; height: 40px; }
.kpad .kp-wide { grid-column: span 2; }
.kstep { display: inline-flex; align-items: center; gap: 8px; }
.kstep.below { display: inline-grid; grid-template-columns: 1fr 1fr; }
.kstep.below > input { grid-column: 1 / -1; order: -1; width: auto !important; }
.kstep > button { font-family: var(--font-num, inherit); font-size: 2rem; font-weight: 700; line-height: 1; min-width: 52px; height: 52px; padding: 0;
  border-radius: 12px; border: 2px solid var(--grid-major, #b9c9d8); background: var(--paper, #f5f8fb); color: var(--pt, #2f5fd0); touch-action: manipulation; }
.kstep > button:active { background: var(--chip, #eaf0f6); border-color: var(--pt, #2f5fd0); }`;
  const st = document.createElement("style");
  st.textContent = css;
  document.head.appendChild(st);

  const pad = document.createElement("div");
  pad.className = "kpad"; pad.hidden = true;
  pad.setAttribute("role", "group"); pad.setAttribute("aria-label", "Number keys");
  let box = null, touch = false;

  function key(label, k, cls) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.dataset.k = k;
    if (cls) b.className = cls;
    if (k === "Backspace") b.setAttribute("aria-label", "Delete");
    if (k === "Enter") b.setAttribute("aria-label", "Done");
    if (k === "Close") b.setAttribute("aria-label", "Close keypad");
    return b;
  }
  function draw(kind) {
    const dec = /dec/.test(kind), neg = /neg/.test(kind);
    pad.textContent = "";
    pad.append(key("✕", "Close", "kp-x"));
    for (const n of [7, 8, 9, 4, 5, 6, 1, 2, 3]) pad.append(key(String(n), String(n)));
    // Bottom rows: 0 with the extra keys (. or −) beside it, then delete and ✓.
    const extra = [];
    if (neg) extra.push(key("−", "-"));
    if (dec) extra.push(key(".", "."));
    pad.append(key("0", "0", extra.length ? "" : "kp-wide"));
    if (extra.length === 2) { pad.append(...extra); pad.append(key("⌫", "Backspace")); pad.append(key("✓", "Enter", "kp-ok kp-wide")); }
    else { if (extra.length) pad.append(extra[0]); pad.append(key("⌫", "Backspace")); pad.append(key("✓", "Enter", "kp-ok kp-wide")); pad.lastChild.style.gridColumn = "1 / -1"; }
  }

  // The boxes that go together (hour and minute, top and bottom of a fraction), so the pad covers none of them.
  function area() {
    let p = box.parentElement;
    for (let i = 0; i < 3 && p && p.parentElement; i++) {
      if (p.querySelectorAll("input[data-pad]").length > 1) break;
      p = p.parentElement;
    }
    const els = [...(p ? p.querySelectorAll("input[data-pad]") : [box])].filter(e => e.offsetParent).map(e => e.closest(".kstep") || e);
    const rs = (els.length ? els : [box]).map(e => e.getBoundingClientRect());
    const left = Math.min(...rs.map(r => r.left)), right = Math.max(...rs.map(r => r.right)), top = Math.min(...rs.map(r => r.top)), bottom = Math.max(...rs.map(r => r.bottom));
    return { left, right, top, bottom, width: right - left, height: bottom - top };
  }
  // Put the pad beside the box: right, then left, then below, then above; always kept on screen.
  function place() {
    if (!box || pad.hidden) return;
    const r = area(), w = pad.offsetWidth, h = pad.offsetHeight, W = innerWidth, H = innerHeight, g = 12;
    let x, y;
    if (r.right + g + w <= W) { x = r.right + g; y = r.top + r.height / 2 - h / 2; }
    else if (r.left - g - w >= 0) { x = r.left - g - w; y = r.top + r.height / 2 - h / 2; }
    else { x = r.left + r.width / 2 - w / 2; y = r.bottom + g + h <= H ? r.bottom + g : r.top - g - h; }
    pad.style.left = Math.max(4, Math.min(W - w - 4, x)) + "px";
    pad.style.top = Math.max(4, Math.min(H - h - 4, y)) + "px";
  }
  function open(el) {
    if (box !== el || pad.hidden) { box = el; draw(el.dataset.pad || ""); }
    if (!pad.isConnected) document.body.appendChild(pad);
    pad.hidden = false; place();
  }
  function close() { pad.hidden = true; box = null; }

  // A finger or pen tap on a pad box: no iPad keyboard, and the pad opens once the box has focus.
  document.addEventListener("pointerdown", e => {
    if (pad.contains(e.target)) return;
    const el = e.target.closest && e.target.closest("input[data-pad]");
    touch = e.pointerType !== "mouse";
    // Every pad box at once, so a box the tool moves focus to next (like the next digit) also skips the keyboard.
    document.querySelectorAll("input[data-pad]").forEach(b => b.setAttribute("inputmode", touch ? "none" : b.dataset.pad.includes("dec") ? "decimal" : "numeric"));
    if (!el && !pad.hidden) close();
  }, true);
  document.addEventListener("focusin", e => {
    const el = e.target;
    if (el.matches && el.matches("input[data-pad]") && touch && !el.readOnly && !el.disabled) { el.setAttribute("inputmode", "none"); open(el); }
    else if (!pad.contains(el)) close();
  });
  addEventListener("resize", place);
  addEventListener("scroll", place, true);

  // Keys never take focus from the box.
  pad.addEventListener("pointerdown", e => e.preventDefault());
  pad.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || !box) return;
    const k = b.dataset.k;
    if (k === "Close") { close(); return; }
    const el = box;
    const ev = new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true });
    if (el.dispatchEvent(ev)) {
      if (k === "Enter") {
        el.dispatchEvent(new KeyboardEvent("keyup", { key: k, bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
        if (el.form && el.form.requestSubmit) el.form.requestSubmit();
      } else {
        const v = el.value;
        let s = v.length, t = v.length;
        // Keys go at the end, unless the tool has selected the box's text (then they replace it).
        try { if (el.selectionStart != null && el.selectionStart !== el.selectionEnd) { s = el.selectionStart; t = el.selectionEnd; } } catch (_) {}
        let nv, at;
        if (k === "Backspace") { if (s === t) s = Math.max(0, s - 1); nv = v.slice(0, s) + v.slice(t); at = s; }
        else {
          const max = el.maxLength > 0 ? el.maxLength : Infinity;
          if (v.length - (t - s) >= max) return;
          nv = v.slice(0, s) + k + v.slice(t); at = s + 1;
        }
        el.value = nv;
        try { el.setSelectionRange(at, at); } catch (_) {}
        el.dispatchEvent(new InputEvent("input", { bubbles: true, data: k === "Backspace" ? null : k, inputType: k === "Backspace" ? "deleteContentBackward" : "insertText" }));
      }
    }
    // The tool may have moved focus to another box (or away); follow it.
    requestAnimationFrame(() => {
      const a = document.activeElement;
      if (a && a.matches && a.matches("input[data-pad]")) open(a);
      else if (a !== el) close();
      else place();
    });
  });

  // − and + buttons around a number box.
  function stepper(el) {
    const wrap = document.createElement("span");
    wrap.className = "kstep" + (el.dataset.step === "below" ? " below" : "");
    el.replaceWith(wrap);
    const btn = (label, d, name) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label; b.setAttribute("aria-label", name);

/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression

  const KEY = "mv-lang";

  const norm = s => s.replace(/\s+/g, " ").trim();

  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
