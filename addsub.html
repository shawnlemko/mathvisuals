<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

</head>
<body>
<title>Adding and Subtracting Fractions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
</style>
<style>
/* Adding and Subtracting Fractions: two mixed numbers drawn as strips, circles or squares (squares match
   Fraction Size Match: the first is cut in columns, the second in rows, and blue cuts make the pieces the same size).
   Next step walks through one step at a time; new cuts are blue and the numerals they change turn blue too.
   Strategy: Stay mixed (wholes with wholes, pieces with pieces, regroup as needed) or Improper fractions. */
:root { --res: #6a4bc4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --res: #a98ef5; } }
:root[data-theme="dark"] { --res: #a98ef5; }

.entry-card { margin-bottom: 14px; padding: 12px 16px; }
.entry { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.seg { display: inline-flex; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--sheet); font-size: 1.05rem; padding: 8px 14px; min-height: 46px; }
.seg button + button { border-left: 2px solid var(--grid-major); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.seg.op button { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; padding: 8px 20px; min-height: 56px; }
.seg.op button[aria-pressed="true"] { background: var(--pt); color: var(--sheet); }
.opt { display: inline-flex; flex-direction: column; gap: 2px; }
.opt .label { margin: 0; }
.problem { display: inline-flex; align-items: center; gap: 12px; }
.mixed { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; border: 2px solid currentColor; }
.mixed.a { color: var(--green); } .mixed.b { color: var(--orange); }
.mixed .stack { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.mixed .bar { width: 100%; height: 3px; background: currentColor; border-radius: 2px; }
.mixed input { font-family: var(--font-num); font-weight: 700; color: var(--ink); background: var(--paper); border: 1px solid var(--grid-major); border-radius: 6px; text-align: center; -moz-appearance: textfield; }
.mixed input::-webkit-inner-spin-button, .mixed input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.mixed .whole { width: 64px; height: 76px; font-size: 2.2rem; }
.mixed .whole::placeholder { color: var(--grid-major); }
.mixed .stack input { width: 58px; height: 40px; font-size: 1.5rem; }
.opsign { font-family: var(--font-num); font-weight: 700; font-size: 2.4rem; color: var(--ink); min-width: 1ch; text-align: center; }
.opts { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-left: auto; }
.err { margin: 8px 0 0; color: var(--warn); font-weight: 700; font-size: 1.1rem; }

/* Board: the question on top (numerals change as the steps go), then the picture. */
.board { padding: 10px 14px; }
.q { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 14px; font-family: var(--font-num); font-weight: 700;
  font-size: 2.1rem; padding: 2px 0 10px; border-bottom: 1px dashed var(--grid-major); margin-bottom: 4px; }
.q .op { color: var(--muted); }
.mx { display: inline-flex; align-items: center; gap: 6px; }
.mx .w { font-size: 1.3em; }
.mx.a { color: var(--green); } .mx.b { color: var(--orange); } .mx.r { color: var(--res); }
.hl { color: var(--pt) !important; background: var(--chip); border-radius: 6px; padding: 0 4px; }
.ans { display: inline-flex; border: 3px solid var(--res); border-radius: 12px; padding: 2px 12px; background: var(--chip); }
.times { color: var(--pt); font-size: 0.8em; }

/* Panel */
.stepcard .count { margin: 0; }
.stepcard h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1.15; margin: 2px 0 8px; }
.stepcard .text { font-size: 1.15rem; margin: 0; }
.calc { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.calc:empty { display: none; }
.calc .ln { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-family: var(--font-num); font-weight: 700; font-size: 1.5rem; padding: 6px 10px; background: var(--paper); border-radius: 8px; }
.calc .ln .tag { font-family: var(--font-display); font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); width: 100%; }
.nav { display: flex; gap: 10px; margin-bottom: 14px; }
.calc .say { font-family: var(--font-body); font-weight: 400; font-size: 1.1rem; }
.nav button { min-height: 56px; font-size: 1.1rem; }
button.next { flex: 1; background: var(--pt); color: var(--sheet); border: 2px solid var(--pt); font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; }
button.next:hover { background: var(--sheet); color: var(--pt); }
button:disabled { opacity: 0.4; cursor: default; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; counter-reset: s; }
.list button { width: 100%; text-align: left; background: none; border: 1px solid transparent; font-size: 1rem; padding: 6px 10px; display: flex; gap: 10px; }
.list button::before { counter-increment: s; content: counter(s); font-family: var(--font-num); color: var(--muted); min-width: 1.2em; }
.list button[aria-current="step"] { background: var(--chip); border-color: var(--pt); color: var(--pt); }
.list li.later button { color: var(--muted); font-weight: 400; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--grid-major); }
.foot .label { margin: 0 4px 0 0; }

/* Board drawing */
.num { font-family: var(--font-num); font-weight: 700; }
.num.a { fill: var(--green); } .num.b { fill: var(--orange); } .num.r { fill: var(--res); }
.num.hl { fill: var(--pt); }
.fbar { stroke-width: 3.5; } .fbar.a { stroke: var(--green); } .fbar.b { stroke: var(--orange); } .fbar.r { stroke: var(--res); }
.sign { font-family: var(--font-num); font-weight: 700; font-size: 50px; fill: var(--muted); }
.sep { stroke: var(--grid-major); stroke-width: 2; stroke-dasharray: 8 6; }
.pc { stroke: none; }
.pc.off { fill: var(--sheet); }
.pc.a { fill: var(--green); fill-opacity: 0.38; } .pc.b { fill: var(--orange); fill-opacity: 0.38; } .pc.r { fill: var(--res); fill-opacity: 0.38; }
.pc.gone { fill-opacity: 0.1; }
.hatch { fill: url(#hatch); stroke: none; }
.hline { stroke: var(--warn); stroke-width: 3; }
.cut { stroke: var(--ink); stroke-width: 2.2; }
.kcut { stroke: var(--pt); stroke-width: 2.4; }
line.new { stroke-dasharray: 100; animation: draw 0.7s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 100; } }
@media (prefers-reduced-motion: reduce) { line.new { animation: none; } }
.edge { fill: none; stroke: var(--ink); stroke-width: 3; }
.edge.hl { stroke: var(--pt); stroke-width: 6; }
.cap { font-family: var(--font-num); font-weight: 700; fill: var(--ink); }
.cap.hl { fill: var(--pt); }
.row.faded { opacity: 0.35; }

@media (min-width: 861px) { .main { grid-template-columns: minmax(0, 1fr) clamp(320px, 30vw, 520px); align-items: stretch; } }
@media (max-width: 600px) { .q { font-size: 1.5rem; } .opts { margin-left: 0; } }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Adding and Subtracting Fractions</h1></div>
  </header>

  <section class="card entry-card">
    <div class="entry">
      <div class="seg op" id="opSeg" role="group" aria-label="Add or subtract">
        <button type="button" data-v="+">Add</button>
        <button type="button" data-v="-">Subtract</button>
      </div>
      <div class="problem">
        <div class="mixed a" role="group" aria-label="First mixed number">
          <input class="whole" id="aw" placeholder="0" type="number" inputmode="numeric" min="0" max="5" aria-label="First whole number">
          <span class="stack">
            <input id="an" type="number" inputmode="numeric" min="0" max="11" aria-label="First numerator">
            <span class="bar"></span>
            <input id="ad" type="number" inputmode="numeric" min="1" max="12" aria-label="First denominator">
          </span>
        </div>
        <span class="opsign" id="opSign" aria-hidden="true">+</span>
        <div class="mixed b" role="group" aria-label="Second mixed number">
          <input class="whole" id="bw" placeholder="0" type="number" inputmode="numeric" min="0" max="5" aria-label="Second whole number">
          <span class="stack">
            <input id="bn" type="number" inputmode="numeric" min="0" max="11" aria-label="Second numerator">
            <span class="bar"></span>
            <input id="bd" type="number" inputmode="numeric" min="1" max="12" aria-label="Second denominator">
          </span>
        </div>
      </div>
      <div class="opts">
        <div class="opt"><p class="label">Model</p>
          <div class="seg" id="modelSeg" role="group" aria-label="Model">
            <button type="button" data-v="strips">Strips</button>
            <button type="button" data-v="circles">Circles</button>
            <button type="button" data-v="squares">Squares</button>
          </div></div>
        <div class="opt"><p class="label">Strategy</p>
          <div class="seg" id="stratSeg" role="group" aria-label="Strategy">
            <button type="button" data-v="mixed">Stay mixed</button>
            <button type="button" data-v="improper">Improper fractions</button>
          </div></div>
      </div>
    </div>
    <p class="err" id="err" hidden></p>
  </section>

  <div class="main">
    <div class="board">
      <div class="q" id="q" aria-live="polite"></div>
      <svg id="svg" role="img" aria-label="The two numbers drawn as shapes"></svg>
    </div>
    <div class="panel">
      <section class="card stepcard" aria-live="polite">
        <div class="nav">
          <button type="button" id="back">← Back</button>
          <button type="button" class="next" id="next">Next step →</button>
        </div>
        <p class="label count" id="count"></p>
        <h2 id="title"></h2>
        <p class="text" id="text"></p>
        <div class="calc" id="math"></div>
      </section>
      <section class="card">
        <ol class="list" id="list"></ol>
        <div class="foot">
          <p class="label">Try</p>
          <button type="button" data-p="2,1,4,+,1,2,3">2 ¼ + 1 ⅔</button>
          <button type="button" data-p="0,3,4,+,0,5,6">¾ + ⅚</button>
          <button type="button" data-p="3,1,4,-,1,2,3">3 ¼ − 1 ⅔</button>
          <button type="button" data-p="4,1,2,-,2,1,3">4 ½ − 2 ⅓</button>
          <button type="button" id="reset">Start over</button>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("svg");
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    parent.appendChild(e);
    return e;
  };
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
  const lcm = (a, b) => a / gcd(a, b) * b;
  const NAMES = [, "wholes", "halves", "thirds", "fourths", "fifths", "sixths", "sevenths", "eighths", "ninths", "tenths",
    "elevenths", "twelfths", "thirteenths", "fourteenths", "fifteenths", "sixteenths", "seventeenths", "eighteenths", "nineteenths", "twentieths"];
  const ONE = [, "whole", "half", "third", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth", "tenth",
    "eleventh", "twelfth", "thirteenth", "fourteenth", "fifteenth", "sixteenth", "seventeenth", "eighteenth", "nineteenth", "twentieth"];
  const pl = d => NAMES[d] || `pieces of size 1/${d}`;
  const pc = (n, d) => (d < NAMES.length ? `${n} ${n === 1 ? ONE[d] : NAMES[d]}` : `${n} pieces of size 1/${d}`);
  const SHAPE = { strips: "strip", circles: "circle", squares: "square" };

  const st = { op: "+", model: "strips", strat: "mixed", step: 0 };

  // Reads the three boxes for one mixed number. Returns {w, n, d} or an error message.
  function read(p, label) {
    const raw = ["w", "n", "d"].map(k => $(p + k).value.trim());
    const [w, n, d] = raw.map(v => (v === "" ? 0 : Number(v)));
    if (raw[2] === "") return `Type a denominator for the ${label} number.`;
    if (![w, n, d].every(Number.isInteger) || w < 0 || n < 0) return `Use whole numbers 0 or more in the ${label} number.`;
    if (d < 1 || d > 12) return `Keep the ${label} denominator between 1 and 12.`;
    if (w > 5) return `Keep the ${label} whole number at 5 or less.`;
    if (n >= d && d > 1) return `In a mixed number the numerator is smaller than the denominator. Try ${w + Math.floor(n / d)} and ${n % d}/${d} for the ${label} number.`;
    if (d === 1 && n > 0) return `With a denominator of 1, type the ${label} number as a whole number.`;
    return { w, n, d };
  }

  // ---------- Numerals (HTML) ----------
  const H = (v, on) => (on ? `<span class="hl">${v}</span>` : v);
  const fr = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
  function mx(w, n, d, cls = "", hl = {}) {
    if (!w && !n) return `<span class="mx ${cls}"><span class="w">0</span></span>`;
    let h = "";
    if (w) h += `<span class="w">${H(w, hl.w)}</span>`;
    if (n) h += `<span class="frac"><span>${H(n, hl.n)}</span><span>${H(d, hl.d)}</span></span>`;
    return `<span class="mx ${cls}">${h}</span>`;
  }
  const frX = (n, d, k) => `<span class="frac"><span>${n} <span class="times">× ${k}</span></span><span>${d} <span class="times">× ${k}</span></span></span>`;
  const O = s => `<span class="op">${s}</span>`;
  const ln = (h, tag) => `<div class="ln">${tag ? `<span class="tag">${tag}</span>` : ""}${h}</div>`;

  // ---------- Shapes ----------
  // A unit is one whole shape: d pieces, each cut again into k (k > 1 draws blue cuts). fill[i] colors piece i,
  // cross marks pieces taken away. Squares: tilt turns the cuts sideways (the second number, as in Fraction Size Match).
  const U = (d, k, count, cls, o = {}) => {
    const fill = Array(d * k).fill("");
    for (let i = 0; i < Math.min(count, d * k); i++) fill[i] = cls;
    return { d, k, fill, cross: new Set(), ...o };
  };
  const whole = (c, cls, tilt, o = {}) => Array.from({ length: c }, () => U(1, 1, 1, cls, { tilt, ...o }));
  // Lay pieces of size 1/(d*k) into whole shapes, one after another.
  function pack(parts, d, k) {
    const units = [];
    let u = null, i = 0;
    parts.forEach(([c, cls]) => {
      for (let j = 0; j < c; j++) {
        if (!u || i === d * k) { u = U(d, k, 0, ""); units.push(u); i = 0; }
        u.fill[i++] = cls;
      }
    });
    return units;
  }
  function crossFromEnd(units, c) {
    for (let ui = units.length - 1; ui >= 0 && c > 0; ui--) {
      const u = units[ui];
      for (let i = u.fill.length - 1; i >= 0 && c > 0; i--) if (u.fill[i] && !u.cross.has(i)) { u.cross.add(i); c--; }
    }
  }
  const row = (key, label, units, o = {}) => ({ key, label, units, ...o });
  const lab = (w, n, d, hl = {}) => ({ w, n, d, hl });

  // ---------- Steps ----------
  function build() {
    const A = read("a", "first"), B = read("b", "second");
    if (typeof A === "string") return A;
    if (typeof B === "string") return B;
    const add = st.op === "+", sgn = add ? "+" : "−", tB = st.model === "squares", shape = SHAPE[st.model];
    const L = lcm(A.d, B.d), kA = L / A.d, kB = L / B.d, NA = A.n * kA, NB = B.n * kB;
    const IA = A.w * A.d + A.n, IB = B.w * B.d + B.n, PA = IA * kA, PB = IB * kB;
    if (!add && PA < PB) return "For subtraction, make the first number at least as big as the second.";
    const total = add ? PA + PB : PA - PB, W = Math.floor(total / L), r = total % L, g = gcd(r, L) || 1;
    const hasFr = F => F.n > 0 || F.w === 0;
    const S = [];

    const qA = row("a", lab(A.w, A.n, A.d), whole(A.w, "a", false).concat(hasFr(A) ? [U(A.d, 1, A.n, "a")] : []));
    const qB = row("b", lab(B.w, B.n, B.d), whole(B.w, "b", tB).concat(hasFr(B) ? [U(B.d, 1, B.n, "b", { tilt: tB })] : []), { sign: sgn });
    const eqQ = mx(A.w, A.n, A.d, "a") + O(sgn) + mx(B.w, B.n, B.d, "b");
    const say = F => (F.w && F.n ? `${F.w} ${F.w === 1 ? "whole" : "wholes"} and ${pc(F.n, F.d)}` : F.n ? pc(F.n, F.d) : `${F.w} ${F.w === 1 ? "whole" : "wholes"}`);
    S.push({ title: "The question", eq: eqQ, rows: [qA, qB],
      text: `Green is the first number and orange is the second. Each ${shape} is 1 whole.`,
      math: ln(`${mx(A.w, A.n, A.d, "a")}<span class="say">is ${say(A)}</span>`) + ln(`${mx(B.w, B.n, B.d, "b")}<span class="say">is ${say(B)}</span>`) });

    const sameText = A.d === B.d
      ? `Both fractions are already in ${pl(L)}. The pieces are the same size, so no new cuts are needed.`
      : `${cap(pl(A.d))} and ${pl(B.d)} are different sizes. ${L} is the smallest number both ${A.d} and ${B.d} go into, so cut the pieces into ${pl(L)}. The blue cuts are new: the pieces get smaller, but the amount stays the same.`;
    const matchLine = (F, k, cls, num, base) => (k > 1
      ? `${mx(base.w, base.n, base.d, cls)}${O("=")}${base.w ? `<span class="mx ${cls}"><span class="w">${base.w}</span>${frX(base.n, base.d, k)}</span>` : `<span class="mx ${cls}">${frX(base.n, base.d, k)}</span>`}${O("=")}${mx(base.w, base.n * k, L, cls, { n: 1, d: 1 })}`
      : `${mx(base.w, base.n, base.d, cls)}<span class="say">already uses ${pl(L)}</span>`);
    let last; // the rows and question line from the step before, so later steps build on them

    if (st.strat === "mixed") {
      const mU = (F, k, cls, tilt, isNew) => whole(F.w, cls, tilt).concat(hasFr(F) ? [U(F.d, k, F.n * k, cls, { tilt, newK: isNew && k > 1 })] : []);
      const hlA = { n: kA > 1 && A.n > 0, d: kA > 1 && A.n > 0 }, hlB = { n: kB > 1 && B.n > 0, d: kB > 1 && B.n > 0 };
      const mA = isNew => row("a", lab(A.w, NA, L, isNew ? hlA : {}), mU(A, kA, "a", false, isNew));
      const mB = (isNew, o = {}) => row("b", lab(B.w, NB, L, isNew ? hlB : {}), mU(B, kB, "b", tB, isNew), { sign: sgn, ...o });
      const eqM = mx(A.w, NA, L, "a") + O(sgn) + mx(B.w, NB, L, "b");
      S.push({ title: "Make the pieces the same size", rows: [mA(true), mB(true)], text: sameText,
        eq: mx(A.w, NA, L, "a", hlA) + O(sgn) + mx(B.w, NB, L, "b", hlB),
        math: ln(A.n ? matchLine(A, kA, "a", NA, A) : `${mx(A.w, 0, 1, "a")}<span class="say">has no fraction part</span>`) + ln(B.n ? matchLine(B, kB, "b", NB, B) : `${mx(B.w, 0, 1, "b")}<span class="say">has no fraction part</span>`) });

      if (add) {
        const N = NA + NB, Ws = A.w + B.w;
        const rU = regroup => {
          const p = pack([[NA, "a"], [NB, "b"]], A.d, kA);
          if (regroup && N >= L) Object.assign(p[0], { hl: true, cap: "1 whole" });
          return whole(A.w, "a", false).concat(whole(B.w, "b", false), p);
        };
        const eqC = eqM + O("=") + mx(Ws, N, L, "r");
        S.push({ title: "Add the wholes, then add the pieces", rows: [mA(false), mB(false), row("r", lab(Ws, N, L, { w: 1, n: 1 }), rU(false), { sign: "=" })],
          text: "The pieces are the same size now, so they can be counted together: wholes with wholes, pieces with pieces.",
          eq: eqM + O("=") + mx(Ws, N, L, "r", { w: 1, n: 1 }),
          math: ln(`${A.w} + ${B.w} = ${Ws}`, "Wholes") + ln(`${fr(NA, L)}${O("+")}${fr(NB, L)}${O("=")}${fr(N, L)}`, "Pieces") });
        last = { rows: [mA(false), mB(false)], eq: eqC };
        if (N >= L) {
          S.push({ title: "Regroup the pieces", rows: [mA(false), mB(false), row("r", lab(Ws + 1, N - L, L, { w: 1, n: 1 }), rU(true), { sign: "=" })],
            text: `${N} ${pl(L)} is more than a whole. ${L} of them fill one ${shape}, so trade them for 1 whole.`,
            eq: eqC + O("=") + mx(Ws + 1, N - L, L, "r", { w: 1, n: 1 }),
            math: ln(`${fr(N, L)}${O("=")}${fr(L, L)}${O("+")}${fr(N - L, L)}`) + ln(`${fr(L, L)} = 1`) + ln(`${Ws} + 1 = ${Ws + 1}`, "Wholes") });
          last.eq = S[S.length - 1].eq;
        }
      } else {
        const trade = NA < NB, aW = trade ? A.w - 1 : A.w, aN = trade ? NA + L : NA;
        const aU = (isNew, crossIt) => {
          const ws = whole(aW, "a", false), fu = [];
          if (trade) fu.push(U(A.d, kA, L, "a", isNew ? { newD: true, newK: kA > 1, hl: true, cap: `${L}/${L}` } : {}));
          if (A.n > 0 || A.w === 0) fu.push(U(A.d, kA, NA, "a"));
          if (crossIt) {
            ws.slice(ws.length - B.w).forEach(u => u.cross.add(0));
            crossFromEnd(fu, NB);
          }
          return ws.concat(fu);
        };
        let eqA = eqM;
        if (trade) {
          eqA = mx(aW, aN, L, "a") + O("−") + mx(B.w, NB, L, "b");
          S.push({ title: "Regroup: trade 1 whole", rows: [row("a", lab(aW, aN, L, { w: 1, n: 1 }), aU(true, false)), mB(false)],
            text: `${NA}/${L} is not enough to take away ${NB}/${L}. Trade 1 whole for ${L}/${L}: cut it into ${pl(L)}.`,
            eq: mx(aW, aN, L, "a", { w: 1, n: 1 }) + O("−") + mx(B.w, NB, L, "b"),
            math: ln(`${mx(A.w, NA, L, "a")}${O("=")}${aW}${O("+")}${fr(L, L)}${O("+")}${fr(NA, L)}${O("=")}${mx(aW, aN, L, "a", { w: 1, n: 1 })}`) });
        }
        const rW = aW - B.w, rN = aN - NB;
        const rUnits = whole(rW, "a", false).concat(rN > 0 ? [U(A.d, kA, rN, "a")] : []);
        const rowsT = [row("a", lab(aW, aN, L), aU(false, true)), mB(false, { faded: true }), row("r", lab(rW, rN, L, { w: 1, n: 1 }), rUnits, { sign: "=" })];
        S.push({ title: "Take away", rows: rowsT,
          text: `Cross out the second number from the first: ${say({ w: B.w, n: NB, d: L })}. What is left is the answer.`,
          eq: eqA + O("=") + mx(rW, rN, L, "r", { w: 1, n: 1 }),
          math: ln(`${aW} − ${B.w} = ${rW}`, "Wholes") + ln(`${fr(aN, L)}${O("−")}${fr(NB, L)}${O("=")}${fr(rN, L)}`, "Pieces") });
        last = { rows: rowsT.slice(0, 2), eq: eqA + O("=") + mx(rW, rN, L, "r") };
      }
    } else {
      // Improper: cut the wholes into pieces first, then make the pieces the same size, then count.
      const iU = (F, k, cls, tilt, newD, newK) => Array.from({ length: F.w }, () => U(F.d, k, F.d * k, cls, { tilt, newD: newD && F.d > 1, newK: newK && k > 1 }))
        .concat(hasFr(F) ? [U(F.d, k, F.n * k, cls, { tilt, newK: newK && k > 1 })] : []);
      if (A.w || B.w) {
        const line = (F, cls, I) => (F.w
          ? `${mx(F.w, F.n, F.d, cls)}${O("=")}<span class="mx ${cls}">${fr(`${F.w} × ${F.d} + ${F.n}`, F.d)}</span>${O("=")}${mx(0, I, F.d, cls, { n: 1 })}`
          : `${mx(0, F.n, F.d, cls)}<span class="say">is already a fraction</span>`);
        S.push({ title: "Change to improper fractions",
          rows: [row("a", lab(0, IA, A.d, { n: A.w > 0 }), iU(A, 1, "a", false, true, false)), row("b", lab(0, IB, B.d, { n: B.w > 0 }), iU(B, 1, "b", tB, true, false), { sign: sgn })],
          text: "Cut each whole into the same pieces as its fraction, so everything is counted in pieces.",
          eq: mx(0, IA, A.d, "a", { n: A.w > 0 }) + O(sgn) + mx(0, IB, B.d, "b", { n: B.w > 0 }),
          math: ln(line(A, "a", IA)) + ln(line(B, "b", IB)) });
      }
      const hlA = { n: kA > 1 && IA > 0, d: kA > 1 && IA > 0 }, hlB = { n: kB > 1 && IB > 0, d: kB > 1 && IB > 0 };
      const iA = (isNew, o = {}) => row("a", lab(0, PA, L, isNew ? hlA : {}), iU(A, kA, "a", false, false, isNew), o);
      const iB = (isNew, o = {}) => row("b", lab(0, PB, L, isNew ? hlB : {}), iU(B, kB, "b", tB, false, isNew), { sign: sgn, ...o });
      const eqI = mx(0, PA, L, "a") + O(sgn) + mx(0, PB, L, "b");
      S.push({ title: "Make the pieces the same size", rows: [iA(true), iB(true)], text: sameText,
        eq: mx(0, PA, L, "a", hlA) + O(sgn) + mx(0, PB, L, "b", hlB),
        math: ln(matchLine(A, kA, "a", PA, { w: 0, n: IA, d: A.d })) + ln(matchLine(B, kB, "b", PB, { w: 0, n: IB, d: B.d })) });
      let rowsC;
      if (add) {
        rowsC = [iA(false), iB(false)];
        S.push({ title: "Add the numerators", rows: rowsC.concat(row("r", lab(0, total, L, { n: 1 }), pack([[PA, "a"], [PB, "b"]], A.d, kA), { sign: "=" })),
          text: `The pieces are the same size, so count them all together. The denominator stays ${L}: it names the size of the pieces.`,
          eq: eqI + O("=") + mx(0, total, L, "r", { n: 1 }),
          math: ln(`${fr(PA, L)}${O("+")}${fr(PB, L)}${O("=")}${fr(total, L)}`) });
      } else {
        const a = iA(false);
        crossFromEnd(a.units, PB);
        rowsC = [a, iB(false, { faded: true })];
        S.push({ title: "Take away", rows: rowsC.concat(row("r", lab(0, total, L, { n: 1 }), pack([[total, "a"]], A.d, kA), { sign: "=" })),
          text: `Cross out ${pc(PB, L)} from the first number. The pieces left are the answer. The denominator stays ${L}.`,
          eq: eqI + O("=") + mx(0, total, L, "r", { n: 1 }),
          math: ln(`${fr(PA, L)}${O("−")}${fr(PB, L)}${O("=")}${fr(total, L)}`) });
      }
      const eqT = eqI + O("=") + mx(0, total, L, "r");
      last = { rows: rowsC, eq: eqT };
      if (total >= L) {
        const p = pack(add ? [[PA, "a"], [PB, "b"]] : [[total, "a"]], A.d, kA);
        p.forEach(u => { if (u.fill.every(Boolean)) Object.assign(u, { hl: true, cap: "1 whole" }); });
        S.push({ title: "Change back to a mixed number", rows: rowsC.concat(row("r", lab(W, r, L, { w: 1, n: 1 }), p, { sign: "=" })),
          text: `Every ${L} pieces fill one ${shape}. ${W} ${W === 1 ? shape + " is" : shape + "s are"} full${r ? `, with ${pc(r, L)} left over` : ""}.`,
          eq: eqT + O("=") + mx(W, r, L, "r", { w: 1, n: 1 }),
          math: ln(`${total} ÷ ${L} = ${W} R ${r}`) + ln(`${fr(total, L)}${O("=")}${mx(W, r, L, "r", { w: 1, n: 1 })}`) });
        last.eq = eqT + O("=") + mx(W, r, L, "r");
      }
    }

    // Simplify: join every g small pieces into one bigger piece.
    const fin = cls => whole(W, cls, false).concat(r ? [U(L / g, 1, r / g, cls)] : []);
    if (r && g > 1) {
      S.push({ title: "Simplify", rows: last.rows.concat(row("r", lab(W, r / g, L / g, { n: 1, d: 1 }), fin("r"), { sign: "=" })),
        text: `${r} and ${L} can both be divided by ${g}. Join every ${g} small pieces into one bigger piece: the same amount, in fewer pieces.`,
        eq: last.eq + O("=") + mx(W, r / g, L / g, "r", { n: 1, d: 1 }),
        math: ln(`${fr(r, L)}${O("=")}${fr(`${r} ÷ ${g}`, `${L} ÷ ${g}`)}${O("=")}${fr(r / g, L / g)}`) });
    }
    S.push({ title: "The answer", rows: [qA, qB, row("r", lab(W, r / g, L / g), fin("r"), { sign: "=" })],
      text: "The same question, now with its answer.",
      eq: eqQ + O("=") + `<span class="ans">${mx(W, r / g, L / g, "r")}</span>`,
      math: ln(`${mx(A.w, A.n, A.d, "a")}${O(sgn)}${mx(B.w, B.n, B.d, "b")}${O("=")}${mx(W, r / g, L / g, "r")}`) });
    return S;
  }
  const cap = s => s[0].toUpperCase() + s.slice(1);

  // ---------- Drawing ----------
  function numeral(g, x, cy, { w, n, d, hl = {} }, key) {
    const T = (t, tx, ty, size, on, anchor = "start") =>
      el("text", { x: tx, y: ty, class: `num ${key}${on ? " hl" : ""}`, "font-size": size, "text-anchor": anchor }, g, String(t));
    let cx = x;
    if (w || !n) { T(w, cx, cy + 17, 50, hl.w); cx += 31 * String(w).length + 10; }
    if (n) {
      const fw = 21 * Math.max(String(n).length, String(d).length) + 12, mid = cx + fw / 2;
      T(n, mid, cy - 9, 34, hl.n, "middle");
      el("line", { x1: cx, x2: cx + fw, y1: cy, y2: cy, class: `fbar ${key}` }, g);
      T(d, mid, cy + 33, 34, hl.d, "middle");
    }
  }

  function unit(g, x, y, bw, bh, u, animate) {
    const N = u.d * u.k, m = st.model, tilt = m === "squares" && u.tilt;
    const cx = x + bw / 2, cy = y + bh / 2, R = Math.min(bw, bh) / 2 - 1;
    const ang = f => -Math.PI / 2 + 2 * Math.PI * f;
    const at = f => [cx + R * Math.cos(ang(f)), cy + R * Math.sin(ang(f))];
    const piece = i => {
      if (m === "strips") return ["rect", { x: x + bw * i / N, y, width: bw / N, height: bh }];
      if (m === "circles") {
        if (N === 1) return ["circle", { cx, cy, r: R }];
        return ["path", { d: `M${cx},${cy} L${at(i / N)} A${R},${R} 0 ${N === 1 ? 1 : 0} 1 ${at((i + 1) / N)} Z` }];
      }
      const a = Math.floor(i / u.k), b = i % u.k;   // a: original piece, b: its smaller piece
      return tilt ? ["rect", { x: x + bw * b / u.k, y: y + bh * a / u.d, width: bw / u.k, height: bh / u.d }]
                  : ["rect", { x: x + bw * a / u.d, y: y + bh * b / u.k, width: bw / u.d, height: bh / u.k }];
    };
    for (let i = 0; i < N; i++) {
      const [tag, a] = piece(i), gone = u.cross.has(i);
      el(tag, { ...a, class: `pc ${u.fill[i] || "off"}${gone ? " gone" : ""}` }, g);
      if (gone) el(tag, { ...a, class: "hatch" }, g);
    }
    // Cuts: the shape's own pieces in ink (blue while new), the extra same-size cuts in blue.
    const kw = Math.max(1.1, Math.min(2.4, 30 * bw / 150 / N + 0.6));
    const cut = (x1, y1, x2, y2, base) => {
      const isNew = base ? u.newD : u.newK;
      const l = el("line", { x1, y1, x2, y2, class: (base && !u.newD ? "cut" : "kcut") + (isNew && animate ? " new" : ""), pathLength: 100 }, g);
      if (!base) l.style.strokeWidth = kw;
    };
    if (m === "strips") {
      for (let i = 1; i < N; i++) { const X = x + bw * i / N; cut(X, y, X, y + bh, i % u.k === 0); }
    } else if (m === "circles") {
      if (N > 1) for (let i = 0; i < N; i++) { const base = i % u.k === 0 && u.d > 1; cut(cx, cy, ...at(i / N), base); }
    } else {
      for (let j = 1; j < u.d; j++) tilt ? cut(x, y + bh * j / u.d, x + bw, y + bh * j / u.d, true) : cut(x + bw * j / u.d, y, x + bw * j / u.d, y + bh, true);
      for (let j = 1; j < u.k; j++) tilt ? cut(x + bw * j / u.k, y, x + bw * j / u.k, y + bh, false) : cut(x, y + bh * j / u.k, x + bw, y + bh * j / u.k, false);
    }
    if (m === "circles") el("circle", { cx, cy, r: R, class: "edge" + (u.hl ? " hl" : "") }, g);
    else el("rect", { x, y, width: bw, height: bh, class: "edge" + (u.hl ? " hl" : "") }, g);
    const c = u.fill.filter(Boolean).length;
    const text = u.cap ?? (N === 1 ? String(c) : `${c}/${N}`);
    el("text", { x: cx, y: y + bh + 25, class: "cap" + (u.hl ? " hl" : ""), "font-size": Math.max(14, Math.min(22, bw / 4.2)), "text-anchor": "middle" }, g, text);
  }

  // Lays out the rows: label numerals on the left, shapes to the right; shapes shrink (and wrap) to fit.
  function draw(rows, animate) {
    svg.textContent = "";
    const strip = st.model === "strips";
    const Wd = 1000, LW = 200, GX = 14, GY = 16, CAP = 32, PAD = 18, HMAX = 620;
    const layout = s => {
      const bw = strip ? s * 1.6 : s, bh = strip ? s * 0.6 : s;
      const per = Math.max(1, Math.floor((Wd - LW + GX) / (bw + GX)));
      let Ht = 0;
      const hs = rows.map(r => { const lines = Math.ceil(Math.max(1, r.units.length) / per), h = lines * (bh + CAP) + (lines - 1) * GY + PAD * 2; Ht += h; return h; });
      return { bw, bh, per, hs, Ht };
    };
    let s = 150, Lo = layout(s);
    while (Lo.Ht > HMAX && s > 40) Lo = layout(s -= 4);
    const { bw, bh, per, hs, Ht } = Lo;
    svg.setAttribute("viewBox", `0 0 ${Wd} ${Math.max(Ht, 200)}`);
    const defs = el("defs", {}, svg);
    const pat = el("pattern", { id: "hatch", width: 10, height: 10, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
    el("line", { x1: 0, y1: 0, x2: 0, y2: 10, class: "hline" }, pat);
    let y = 0;
    rows.forEach((r, ri) => {
      if (ri && r.key === "r") el("line", { x1: 0, x2: Wd, y1: y, y2: y, class: "sep" }, svg);
      const g = el("g", { class: `row ${r.key}${r.faded ? " faded" : ""}` }, svg);
      const top = y + PAD, cy = top + bh / 2;
      if (r.sign) el("text", { x: 18, y: cy + 17, class: "sign", "text-anchor": "middle" }, g, r.sign);
      numeral(g, 44, cy, r.label, r.key);
      const units = r.units.length ? r.units : [U(1, 1, 0, "", { cap: "0" })];
      units.forEach((u, i) => unit(g, LW + (i % per) * (bw + GX), top + Math.floor(i / per) * (bh + CAP + GY), bw, bh, u, animate));
      y += hs[ri];
    });
  }

  // ---------- Page ----------
  function render(animate = false) {
    document.querySelectorAll(".seg button").forEach(b => {
      const key = { opSeg: "op", modelSeg: "model", stratSeg: "strat" }[b.parentElement.id];
      b.setAttribute("aria-pressed", String(st[key] === b.dataset.v));
    });
    $("opSign").textContent = st.op === "+" ? "+" : "−";
    const S = build();
    const err = typeof S === "string" ? S : "";
    $("err").hidden = !err;
    $("err").textContent = err;
    if (err) { $("next").disabled = $("back").disabled = true; return; }
    st.step = Math.max(0, Math.min(st.step, S.length - 1));
    const s = S[st.step];
    $("q").innerHTML = s.eq;
    draw(s.rows, animate);
    $("count").textContent = `Step ${st.step + 1} of ${S.length}`;
    $("title").textContent = s.title;
    $("text").textContent = s.text;
    $("math").innerHTML = s.math || "";
    $("back").disabled = st.step === 0;
    $("next").disabled = st.step === S.length - 1;
    $("next").textContent = st.step === S.length - 2 ? "Show the answer →" : "Next step →";
    $("list").innerHTML = S.map((x, i) => `<li class="${i > st.step ? "later" : ""}"><button type="button" data-i="${i}"${i === st.step ? ' aria-current="step"' : ""}>${x.title}</button></li>`).join("");
  }

  const go = i => { const fwd = i > st.step; st.step = i; render(fwd); };
  $("next").addEventListener("click", () => go(st.step + 1));
  $("back").addEventListener("click", () => go(st.step - 1));
  $("list").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); });
  document.addEventListener("keydown", e => {
    if (e.target.closest("input")) return;
    if (e.key === "ArrowRight" && !$("next").disabled) go(st.step + 1);
    if (e.key === "ArrowLeft" && !$("back").disabled) go(st.step - 1);
  });
  [["opSeg", "op"], ["modelSeg", "model"], ["stratSeg", "strat"]].forEach(([id, key]) =>
    $(id).addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      st[key] = b.dataset.v;
      if (key !== "model") st.step = 0;   // a new model keeps the step; a new question or strategy starts over
      render(key === "model");
    }));
  ["aw", "an", "ad", "bw", "bn", "bd"].forEach(id => $(id).addEventListener("input", () => { st.step = 0; render(); }));

  function setInputs(v) {
    // A whole part of 0 leaves the box empty, so proper fractions read as proper fractions.
    ["aw", "an", "ad"].forEach((id, i) => ($(id).value = i === 0 && !+v[i] ? "" : v[i]));
    st.op = v[3];
    ["bw", "bn", "bd"].forEach((id, i) => ($(id).value = i === 0 && !+v[4 + i] ? "" : v[4 + i]));
    st.step = 0;
    render();
  }
  document.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => setInputs(b.dataset.p.split(","))));
  $("reset").addEventListener("click", () => setInputs([2, 1, 4, "+", 1, 2, 3]));
  setInputs([2, 1, 4, "+", 1, 2, 3]);
})();
</script>

</body>
