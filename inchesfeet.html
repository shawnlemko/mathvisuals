<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Inches, Feet and Yards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Inches, Feet and Yards (grade 9-10, Shawn 2026-10-15; simplified 2026-10-20 to one tape measure, no steps).
   One yellow tape measure, 0 to 108 inches (3 yards), runs all the way across the screen with a mark per inch.
   Make feet: every 12 inches gets a blue 1 ft bar and the skip count 12 + 12 + ... runs under the tape.
   Make yards: every 3 feet gets a green 1 yd bracket. Zoom in: one foot is drawn large under the tape, inches 0 to 12
   below and feet 0, 0.25, 0.5, 0.75, 1 above, so 3 in lines up with 0.25 ft. Drag along the tape to measure a piece.
   Make a length: a slider sets the length and the board reads it. Read a length: the tape shows a length and
   students type it in inches, feet and inches, yards feet and inches, or decimal feet. Never the ÷ sign. */
.board { padding: 4px; }
.dock { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; align-items: stretch; }
.dock .card { padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.dock .grow { flex: 1 1 420px; }
.seg-btns { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg-btns button { border: 0; border-radius: 0; background: var(--sheet); font-size: 1rem; min-height: 44px; padding: 6px 14px; }
.seg-btns button + button { border-left: 2px solid var(--grid-major); }
.seg-btns button.on { background: var(--pt); color: var(--sheet); }
header .seg-btns button { font-size: 1.15rem; min-height: 48px; padding: 6px 18px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns button { font-size: 1.1rem; min-height: 50px; padding: 8px 16px; }
.btns button.go { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.tool.on { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.tool.yd.on { background: var(--green); border-color: var(--green); }
.tool.zm.on { background: var(--orange); border-color: var(--orange); }
.len { display: flex; align-items: center; gap: 12px; }
.len input[type=range] { flex: 1 1 auto; min-width: 160px; height: 36px; }
.len output { font-family: var(--font-num); font-weight: 700; font-size: 1.8rem; min-width: 5ch; text-align: right; white-space: nowrap; }
.len button { font-size: 1.5rem; min-width: 50px; min-height: 50px; padding: 0; }
.tip { margin: 0; color: var(--muted); font-size: 0.95rem; }
#ans { display: inline-flex; flex-wrap: wrap; gap: 8px 14px; }
.fld { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-num); font-weight: 700; font-size: 1.4rem; }
.fld input { font: inherit; font-size: 1.6rem; color: var(--ink); background: var(--paper); border: 2px solid var(--grid-major); border-radius: 8px; height: 52px; width: 3.4ch; text-align: center; padding: 0 2px; }
.fld input.wide { width: 4.8ch; }
.fld input.bad { border-color: var(--warn); }
.fld input.ok { border-color: var(--green); color: var(--green); }
.fld .u-yd { color: var(--green); } .fld .u-ft { color: var(--pt); } .fld .u-in { color: var(--orange); }
.fb { margin: 0; font-size: 1.1rem; font-weight: 700; min-height: 1.4em; }
.fb.ok { color: var(--green); } .fb.no { color: var(--warn); } .fb.mid { color: var(--orange); }
.score { font-size: 1rem; color: var(--muted); margin: 0; }
.score b { color: var(--ink); font-family: var(--font-num); font-size: 1.2rem; }

/* Board. The tape is tape-measure yellow in both themes. */
:root { --tape: #f3d35b; --tape-edge: #b99a1f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tape: #6e5c16; --tape-edge: #a8902e; } }
:root[data-theme="dark"] { --tape: #6e5c16; --tape-edge: #a8902e; }
.tape { fill: var(--tape); stroke: var(--tape-edge); stroke-width: 2; cursor: crosshair; }
.tk { stroke: var(--ink); stroke-width: 1.6; pointer-events: none; }
.tk.half { stroke-width: 2.2; }
.tk.foot { stroke-width: 3.5; }
.tk.foot.b { stroke: var(--pt); }
.meas { fill: var(--pt); opacity: 0.18; pointer-events: none; }
.meas.in { fill: var(--orange); opacity: 0.45; }
.ftbar { fill: var(--pt); }
.inbar { fill: var(--orange); }
.barlbl { font-family: var(--font-num); font-weight: 700; fill: var(--sheet); }
.endmk { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; pointer-events: none; }
.yardb { fill: none; stroke: var(--green); stroke-width: 4; stroke-linejoin: round; }
.sel { fill: var(--green); opacity: 0.3; pointer-events: none; }
.seledge { stroke: var(--green); stroke-width: 4; pointer-events: none; }
.selbox { fill: var(--sheet); stroke: var(--green); stroke-width: 3; }
.zoombox { fill: var(--tape); stroke: var(--tape-edge); stroke-width: 3; }
.zfill { fill: var(--orange); opacity: 0.5; }
.zframe { fill: none; stroke: var(--orange); stroke-width: 4; pointer-events: none; }
.ztk { stroke: var(--ink); stroke-width: 2; }
.zlink { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
.zdiv { stroke: var(--pt); stroke-width: 5; stroke-linecap: round; }
.ztitle { font-family: var(--font-body); font-weight: 700; fill: var(--muted); }
.tx { font-family: var(--font-num); font-weight: 700; fill: var(--ink); pointer-events: none; }
.tx.b { fill: var(--pt); } .tx.o { fill: var(--orange); } .tx.g { fill: var(--green); } .tx.op { fill: var(--muted); }
.tx.m { fill: var(--muted); font-weight: 500; }
.bar { stroke: var(--ink); stroke-linecap: round; }
.bar.b { stroke: var(--pt); } .bar.o { stroke: var(--orange); } .bar.g { stroke: var(--green); }
.lit { animation: lit 0.45s ease-out both; }
.pop { animation: pop 0.4s ease-out both; transform-box: fill-box; transform-origin: center; }
@keyframes lit { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .lit, .pop { animation: none !important; } }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Inches, Feet and Yards</h1></div>
    <div class="seg-btns" role="group" aria-label="Mode">
      <button type="button" data-mode="make" class="on">Make a length</button><button type="button" data-mode="read">Read a length</button>
    </div>
  </header>

  <div class="board"><svg id="svg" viewBox="0 0 1600 390" role="img" aria-label="A tape measure from 0 to 108 inches. Inches group into feet, and feet group into yards."></svg></div>

  <div class="dock">
    <section class="card grow" id="make">
      <p class="label">Length</p>
      <div class="len">
        <button type="button" id="minus" aria-label="1 inch less">−</button>
        <input type="range" id="slider" min="1" max="108" step="1" value="70" aria-label="Length in inches">
        <button type="button" id="plus" aria-label="1 inch more">+</button>
        <output id="lenOut">70 in</output>
      </div>
    </section>

    <section class="card grow" id="read" hidden>
      <div class="row">
        <span class="label" style="margin:0">How long is it? Answer in</span>
        <div class="seg-btns" role="group" aria-label="Answer in" id="units">
          <button type="button" data-u="in" class="on">in</button><button type="button" data-u="ftin">ft in</button><button type="button" data-u="ydftin">yd ft in</button><button type="button" data-u="dec">ft (decimal)</button>
        </div>
      </div>
      <div class="row">
        <span id="ans"></span>
        <div class="btns"><button type="button" class="go" id="check">Check</button><button type="button" id="showme">Show me</button><button type="button" id="newq">New length</button></div>
      </div>
      <div class="row"><p class="fb" id="fb" aria-live="polite"></p><p class="score">Correct: <b id="right">0</b> of <b id="total">0</b></p></div>
    </section>

    <section class="card">
      <div class="btns">
        <button type="button" class="tool" id="tFeet" aria-pressed="false">Make feet</button>
        <button type="button" class="tool yd" id="tYards" aria-pressed="false">Make yards</button>
        <button type="button" class="tool zm" id="tZoom" aria-pressed="false">Zoom in</button>
      </div>
      <p class="tip">Drag along the tape to measure a piece. Tap a foot to zoom in on it.</p>
    </section>
  </div>
</div>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("#svg");
  function E(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const gcd = (a, b) => b ? gcd(b, a % b) : a;
  const dec = x => String(+x.toFixed(2)); // 1.25, 0.5

  // ---------- state ----------
  const MAX = 108; // 3 yards
  let mode = "make", n = 70;
  let feet = false, yards = false, zoom = false, zf = null; // zf: the zoomed foot (null = the foot where the length ends)
  let sel = null;   // a dragged piece of tape: [from, to] in inches
  let solved = false, anim = {};

  // A length in inches, split into yards, feet and inches.
  function parts(n) {
    const F = Math.floor(n / 12), R = n % 12, Y = Math.floor(F / 3), Fy = F % 3;
    return { n, F, R, Y, Fy, D: n / 12, exact: R % 3 === 0 };
  }

  // ---------- small layout: text and fractions that know their width ----------
  const CW = 0.62; // width of one character of the number font, in em
  function T(s, fs, cls) {
    s = String(s);
    return { w: s.length * CW * fs, draw(g, x, y) { E("text", { x: x + this.w / 2, y: y + fs * 0.36, class: "tx " + (cls || ""), "text-anchor": "middle", "font-size": fs }, g, s); } };
  }
  function Fr(a, b, fs, cls) {
    const f = fs * 0.78, t = T(a, f, cls), d = T(b, f, cls), w = Math.max(t.w, d.w) + fs * 0.3;
    return { w, draw(g, x, y) {
      E("line", { x1: x, x2: x + w, y1: y, y2: y, class: "bar " + (cls || ""), "stroke-width": 3.5 }, g);
      t.draw(g, x + (w - t.w) / 2, y - f * 0.62); d.draw(g, x + (w - d.w) / 2, y + f * 0.62);
    } };
  }
  function Row(items, sp) {
    const w = items.reduce((t, i) => t + i.w, 0) + sp * (items.length - 1);
    return { w, draw(g, x, y) { for (const i of items) { i.draw(g, x, y); x += i.w + sp; } } };
  }
  // An item is [value, unit, colour], "=", or { fr: [top, bottom], u, c }.
  function quant(it, fs) {
    if (typeof it === "string") return T(it, fs, "op");
    if (it.fr) return Row([Fr(it.fr[0], it.fr[1], fs, it.c), T(it.u, fs, it.c)], fs * 0.2);
    return Row([T(it[0], fs, it[2]), T(it[1], fs, it[2])], fs * 0.2);
  }
  const say = (items, fs) => Row(items.map(i => quant(i, fs)), fs * 0.4);
  // 5 ft 10 in, or 1 yd 2 ft 10 in, leaving out zero parts.
  function ftIn(p, withYd) {
    const out = [];
    if (withYd && p.Y) out.push([p.Y, "yd", "g"]);
    const F = withYd ? p.Fy : p.F;
    if (F || (!out.length && !p.R)) out.push([F, "ft", "b"]);
    if (p.R) out.push([p.R, "in", "o"]);
    return out;
  }
  // Inches inside one foot, in feet: 3 in = 3/12 ft = 1/4 ft = 0.25 ft
  function inchFeet(m) {
    const out = [[m, "in", "o"], "=", { fr: [m, 12], u: "ft", c: "o" }];
    const g = gcd(m, 12);
    if (g > 1) out.push("=", { fr: [m / g, 12 / g], u: "ft", c: "o" });
    if (m % 3 === 0) out.push("=", [dec(m / 12), "ft", "o"]);
    return out;
  }
  // What the board says about the length, as far as the buttons have gone.
  function readout(p) {
    const out = [[p.n, "in", ""]];
    if (feet && p.n >= 12) out.push("=", ...ftIn(p, false));
    if (yards && p.F >= 3) out.push("=", ...ftIn(p, true));
    if (zoom && p.exact && p.R) out.push("=", [dec(p.D), "ft", "b"]);
    return out;
  }

  // ---------- drawing ----------
  const W = 1600, TX0 = 60, TX1 = 1540, sc = (TX1 - TX0) / MAX, X = i => TX0 + i * sc;
  const TOP_Y = 44, YD_Y = 130, BAR_Y = 142, BAR_H = 40, TAPE_Y = 192, TAPE_H = 70, LBL_Y = 296, SKIP_Y = 336;
  const ZX0 = 330, ZX1 = 1270, ZY = 440, ZH = 64, zs = (ZX1 - ZX0) / 12;
  const lit = (el, ms) => { if (ms != null) { el.classList.add("lit"); el.style.animationDelay = ms + "ms"; } return el; };

  function render() {
    svg.innerHTML = "";
    const p = parts(n), a = anim; anim = {};
    // Without the zoom, the board is shorter so the tape can use the whole width.
    svg.setAttribute("viewBox", `0 0 ${W} ${zoom ? 630 : 390}`);

    // Top: what the length is (in Read a length, only once it is solved).
    if (mode === "make" || solved) {
      const r = say(readout(p), 46), g = E("g", { class: a.top ? "pop" : "" });
      r.draw(g, (W - r.w) / 2, TOP_Y);
    }

    // The tape, 0 to 108 inches, with the measured length shaded.
    E("rect", { x: TX0, y: TAPE_Y, width: TX1 - TX0, height: TAPE_H, rx: 4, class: "tape" });
    if (feet) {
      E("rect", { x: TX0, y: TAPE_Y, width: p.F * 12 * sc, height: TAPE_H, class: "meas" });
      if (p.R) E("rect", { x: X(p.F * 12), y: TAPE_Y, width: p.R * sc, height: TAPE_H, class: "meas in" });
    } else E("rect", { x: TX0, y: TAPE_Y, width: p.n * sc, height: TAPE_H, class: "meas" });
    for (let i = 0; i <= MAX; i++) {
      const foot = i % 12 === 0, len = foot ? TAPE_H : i % 6 === 0 ? 32 : i % 3 === 0 ? 22 : 13;
      E("line", { x1: X(i), x2: X(i), y1: TAPE_Y, y2: TAPE_Y + len, class: "tk" + (foot ? " foot" + (feet && i && i <= p.F * 12 ? " b" : "") : i % 6 === 0 ? " half" : "") });
    }
    // Inch numbers at every foot, like a real tape. Blue once those inches are made into feet.
    for (let k = 0; k * 12 <= MAX; k++) {
      const on = feet && k && k <= p.F;
      E("text", { x: X(12 * k), y: LBL_Y, class: "tx " + (on ? "b" : "m"), "text-anchor": "middle", "font-size": 26 }, svg, String(12 * k));
    }
    E("line", { x1: X(p.n), x2: X(p.n), y1: TAPE_Y - 12, y2: TAPE_Y + TAPE_H + 12, class: "endmk" });

    // Make feet: a 1 ft bar over every 12 inches, one after another, and the skip count under the tape.
    if (feet) {
      for (let k = 0; k < p.F; k++) {
        const ms = a.feet ? k * 220 : null, g = lit(E("g", {}), ms);
        E("rect", { x: X(12 * k) + 2, y: BAR_Y, width: 12 * sc - 4, height: BAR_H, rx: 8, class: "ftbar" }, g);
        E("text", { x: X(12 * k) + 6 * sc, y: BAR_Y + BAR_H / 2 + 9, class: "barlbl", "text-anchor": "middle", "font-size": 26 }, g, "1 ft");
        const s = lit(E("g", {}), ms);
        E("text", { x: X(12 * k) + 6 * sc, y: SKIP_Y, class: "tx b", "text-anchor": "middle", "font-size": 30 }, s, "12");
        if (k) E("text", { x: X(12 * k), y: SKIP_Y, class: "tx op", "text-anchor": "middle", "font-size": 30 }, s, "+");
      }
      if (p.R) {
        const ms = a.feet ? p.F * 220 : null, g = lit(E("g", {}), ms), x0 = X(p.F * 12), wd = p.R * sc;
        E("rect", { x: x0 + 2, y: BAR_Y, width: Math.max(4, wd - 4), height: BAR_H, rx: 8, class: "inbar" }, g);
        if (wd > 70) E("text", { x: x0 + wd / 2, y: BAR_Y + BAR_H / 2 + 9, class: "barlbl", "text-anchor": "middle", "font-size": 24 }, g, `${p.R} in`);
        const s = lit(E("g", {}), ms);
        if (p.F) E("text", { x: x0, y: SKIP_Y, class: "tx op", "text-anchor": "middle", "font-size": 30 }, s, "+");
        E("text", { x: x0 + Math.max(wd / 2, 28), y: SKIP_Y, class: "tx o", "text-anchor": "middle", "font-size": 30 }, s, String(p.R));
      }
    }
    // Make yards: a green bracket over every 3 feet.
    if (yards) for (let y = 0; y < p.Y; y++) {
      const g = lit(E("g", {}), a.yards ? (a.feet ? p.F * 220 : 0) + y * 350 : null), x1 = X(36 * y) + 4, x2 = X(36 * y + 36) - 4;
      E("path", { d: `M${x1} ${BAR_Y - 4} V${YD_Y - 14} H${x2} V${BAR_Y - 4}`, class: "yardb" }, g);
      E("text", { x: (x1 + x2) / 2, y: YD_Y - 24, class: "tx g", "text-anchor": "middle", "font-size": 30 }, g, "1 yd");
    }

    // Zoom in: one foot drawn large. Inches below (0 to 12), feet above (0, 0.25, 0.5, 0.75, 1).
    if (zoom) {
      const k = zf != null ? zf : Math.max(0, Math.min(p.R ? p.F : p.F - 1, MAX / 12 - 1));
      const m = Math.max(0, Math.min(12, n - 12 * k));
      const g = lit(E("g", {}), a.zoom ? 0 : null), Z = i => ZX0 + i * zs;
      E("path", { d: `M${X(12 * k)} ${TAPE_Y + TAPE_H} L${ZX0} ${ZY} M${X(12 * k + 12)} ${TAPE_Y + TAPE_H} L${ZX1} ${ZY}`, class: "zlink" }, g);
      E("rect", { x: X(12 * k), y: TAPE_Y, width: 12 * sc, height: TAPE_H, class: "zframe" }, g);
      E("rect", { x: ZX0, y: ZY, width: ZX1 - ZX0, height: ZH, class: "zoombox" }, g);
      if (m) E("rect", { x: ZX0, y: ZY, width: m * zs, height: ZH, class: "zfill" }, g);
      for (let i = 1; i < 48; i++) { // quarter-inch marks, like a real tape
        const len = i % 4 === 0 ? ZH * 0.55 : i % 2 === 0 ? ZH * 0.32 : ZH * 0.2;
        E("line", { x1: ZX0 + i * zs / 4, x2: ZX0 + i * zs / 4, y1: ZY + ZH - len, y2: ZY + ZH, class: "ztk" }, g);
      }
      for (let i = 0; i <= 12; i++) E("text", { x: Z(i), y: ZY + ZH + 32, class: "tx " + (i === m && m % 12 ? "o" : "m"), "text-anchor": "middle", "font-size": 28 }, g, String(i));
      E("text", { x: ZX1 + 30, y: ZY + ZH + 32, class: "tx m", "font-size": 28 }, g, "in");
      for (let q = 1; q < 4; q++) E("line", { x1: Z(3 * q), x2: Z(3 * q), y1: ZY - 8, y2: ZY + ZH * 0.45, class: "zdiv" }, g);
      for (let q = 0; q <= 4; q++) E("text", { x: Z(3 * q), y: ZY - 18, class: "tx " + (3 * q === m && q % 4 ? "o" : "b"), "text-anchor": "middle", "font-size": 28 }, g, q === 4 ? "1" : dec(q / 4));
      E("text", { x: ZX1 + 30, y: ZY - 18, class: "tx b", "font-size": 28 }, g, "ft");
      E("text", { x: ZX0 - 26, y: ZY + ZH / 2 + 9, class: "ztitle", "text-anchor": "end", "font-size": 26 }, g, "1 foot");
      if (m && m < 12 && (mode === "make" || solved)) {
        const r = say(inchFeet(m), 32);
        r.draw(g, (W - r.w) / 2, ZY + ZH + 98);
      }
    }

    // A dragged piece of tape, with its length.
    if (sel && sel[1] !== sel[0]) {
      const s0 = Math.min(...sel), s1 = Math.max(...sel), m = s1 - s0, sp = parts(m);
      E("rect", { x: X(s0), y: TAPE_Y - 6, width: m * sc, height: TAPE_H + 12, class: "sel" });
      for (const s of [s0, s1]) E("line", { x1: X(s), x2: X(s), y1: TAPE_Y - 10, y2: TAPE_Y + TAPE_H + 10, class: "seledge" });
      const q = [[m, "in", "g"]];
      if (m >= 12) q.push("=", ...ftIn(sp, false).map(x => [x[0], x[1], "g"]));
      if (m >= 36) q.push("=", ...ftIn(sp, true).map(x => [x[0], x[1], "g"]));
      const r = say(q, 30), cx = Math.min(Math.max(X((s0 + s1) / 2), TX0 + r.w / 2 + 12), TX1 - r.w / 2 - 12);
      E("rect", { x: cx - r.w / 2 - 12, y: BAR_Y - 6, width: r.w + 24, height: 50, rx: 10, class: "selbox" });
      r.draw(svg, cx - r.w / 2, BAR_Y + 19);
    }
  }

  // ---------- drag along the tape to measure a piece; tap a foot to zoom in on it ----------
  const toSvg = e => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const v = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { i: Math.max(0, Math.min(MAX, Math.round((v.x - TX0) / sc))), x: v.x, y: v.y };
  };
  let dragging = false;
  svg.addEventListener("pointerdown", e => {
    const v = toSvg(e);
    if (v.y < TAPE_Y - 20 || v.y > TAPE_Y + TAPE_H + 20 || v.x < TX0 - 10 || v.x > TX1 + 10) {
      if (sel) { sel = null; render(); }
      return;
    }
    dragging = true; svg.setPointerCapture(e.pointerId);
    sel = [v.i, v.i]; render();
  });
  svg.addEventListener("pointermove", e => {
    if (!dragging) return;
    const i = toSvg(e).i;
    if (i !== sel[1]) { sel[1] = i; render(); }
  });
  svg.addEventListener("pointerup", e => {
    if (!dragging) return;
    dragging = false;
    if (sel[0] === sel[1]) { // a tap: zoom in on that foot
      const k = Math.floor((toSvg(e).x - TX0) / sc / 12);
      sel = null; zf = Math.max(0, Math.min(k, MAX / 12 - 1));
      if (!zoom) { zoom = true; anim.zoom = 1; }
      tools();
    }
    render();
  });

  // ---------- the three buttons ----------
  function tools() {
    [["#tFeet", feet], ["#tYards", yards], ["#tZoom", zoom]].forEach(([s, on]) => { $(s).classList.toggle("on", on); $(s).setAttribute("aria-pressed", on); });
  }
  $("#tFeet").onclick = () => { feet = !feet; if (!feet) yards = false; anim = { feet, top: 1 }; tools(); render(); };
  $("#tYards").onclick = () => { yards = !yards; anim = { yards, top: 1 }; if (yards && !feet) { feet = true; anim.feet = 1; } tools(); render(); };
  $("#tZoom").onclick = () => { zoom = !zoom; zf = null; anim = { zoom, top: 1 }; tools(); render(); };

  // ---------- Make a length ----------
  function setLen(v) {
    n = Math.max(1, Math.min(MAX, v)); zf = null; sel = null;
    $("#slider").value = n; $("#lenOut").textContent = `${n} in`;
    render();
  }
  $("#slider").oninput = e => setLen(+e.target.value);
  $("#minus").onclick = () => setLen(n - 1);
  $("#plus").onclick = () => setLen(n + 1);

  // ---------- Read a length ----------
  const UNITS = { in: ["in"], ftin: ["ft", "in"], ydftin: ["yd", "ft", "in"], dec: ["ft"] };
  let unit = "in", ans = [], right = 0, total = 0, counted = false;
  function boxes() {
    const box = $("#ans"); box.innerHTML = "";
    ans = UNITS[unit].map(u => {
      const l = document.createElement("label"); l.className = "fld";
      const inp = document.createElement("input");
      inp.type = "text"; inp.autocomplete = "off"; inp.inputMode = unit === "dec" ? "decimal" : "numeric";
      if (unit === "dec") inp.className = "wide";
      inp.setAttribute("aria-label", `Your answer (${u})`);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
      const s = document.createElement("span"); s.className = "u-" + u; s.textContent = u;
      l.append(inp, s); box.append(l);
      return inp;
    });
  }
  const fb = (t, c) => { $("#fb").textContent = t; $("#fb").className = "fb " + c; };
  const mark = c => ans.forEach(i => { i.classList.remove("ok", "bad"); if (c) i.classList.add(c); });
  function newLength() {
    let v;
    if (unit === "dec") v = 12 * ri(1, 8) + pick([3, 6, 9]);
    else if (unit === "ydftin") v = ri(38, 107);
    else v = ri(14, 107);
    if (v % 12 === 0) v += pick([1, 5, 7]);
    n = v; solved = false; counted = false; feet = yards = zoom = false; zf = null; sel = null;
    tools(); boxes(); fb("", ""); render();
    ans[0].focus({ preventScroll: true });
  }
  function want() {
    const p = parts(n);
    return unit === "in" ? [p.n] : unit === "ftin" ? [p.F, p.R] : unit === "ydftin" ? [p.Y, p.Fy, p.R] : [p.D];
  }
  function check() {
    if (solved) return;
    const raw = ans.map(i => i.value.trim());
    if (raw.every(s => s === "")) { fb("Type your answer in the boxes.", "mid"); return; }
    const got = raw.map(s => s === "" ? 0 : unit === "dec" ? (/^\d*\.?\d+$/.test(s) ? +s : NaN) : (/^\d+$/.test(s) ? +s : NaN));
    if (got.some(isNaN)) { fb(unit === "dec" ? "Type a decimal, like 2.5." : "Type whole numbers.", "mid"); return; }
    const w = want(), p = parts(n);
    if (!counted) { total++; counted = true; }
    if (got.every((g, j) => Math.abs(g - w[j]) < 1e-9)) {
      right++; solved = true; mark("ok");
      fb("Yes! That's it.", "ok"); score(); anim.top = 1; render(); return;
    }
    mark("bad");
    let msg = "Not yet. Try Make feet to see the groups of 12.";
    if (unit === "dec" && Math.abs(got[0] - n / 10) < 1e-9) msg = "Not yet. A foot is 12 inches, not 10.";
    else if (unit === "dec" && Math.abs(got[0] - (p.F + p.R / 10)) < 1e-9) msg = `Not yet. ${p.R} inches is not 0.${p.R} ft. Zoom in to see it.`;
    else if (unit === "dec") msg = "Not yet. Zoom in on the last foot and read the feet on top.";
    else if (unit !== "in" && got[got.length - 1] >= 12) msg = "Not yet. 12 inches or more make another foot.";
    else if (unit === "ydftin" && got[1] >= 3) msg = "Not yet. 3 feet make another yard.";
    else if (unit === "ydftin") msg = "Not yet. Make feet, then make yards.";
    fb(msg, "no"); score();
  }
  function score() { $("#right").textContent = right; $("#total").textContent = total; }
  $("#check").onclick = check;
  $("#newq").onclick = newLength;
  $("#showme").onclick = () => {
    if (solved) return;
    if (!counted) { total++; counted = true; score(); }
    solved = true;
    feet = n >= 12; yards = unit === "ydftin"; zoom = unit === "dec"; zf = null;
    anim = { feet, yards, zoom, top: 1 };
    want().forEach((v, j) => { ans[j].value = unit === "dec" ? dec(v) : v; });
    mark("ok"); fb("Here is how to read it.", "mid"); tools(); render();
  };
  $("#units").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    unit = b.dataset.u;
    document.querySelectorAll("[data-u]").forEach(x => x.classList.toggle("on", x === b));
    newLength();
  });

  // ---------- modes ----------
  let keepN = 70;
  function setMode(m) {
    if (m === mode) return;
    if (mode === "make") keepN = n;
    mode = m;
    document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
    $("#make").hidden = m !== "make"; $("#read").hidden = m !== "read";
    if (m === "make") { solved = false; feet = yards = zoom = false; tools(); setLen(keepN); }
    else newLength();
  }
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
  setLen(70);
})();
</script>

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
