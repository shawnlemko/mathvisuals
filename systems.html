<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Solving Linear Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Solving Linear Systems: type two equations, pick Elimination or Substitution, then Next step walks the algebra.
   Every step also shows on the graph: a multiplied equation pulses as the same line, an equation with one letter left
   is a vertical or horizontal purple line through the crossing, and the answer is the green point where the lines cross. */
:root { --l1: var(--pt); --l2: var(--orange); --help: #7a3fc4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --help: #b88cff; } }
:root[data-theme="dark"] { --help: #b88cff; }
@media (min-width: 861px) { .main { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } }
@media (min-width: 861px) and (min-height: 520px) { .panel { overflow: hidden !important; } }
.panel { gap: 12px; }
.card { padding: 12px 16px; }
header .seg-btns { display: inline-flex; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
header .seg-btns button { border: 0; border-radius: 0; background: var(--sheet); font-family: var(--font-display); font-size: 1.2rem; min-height: 48px; padding: 6px 20px; }
header .seg-btns button + button { border-left: 2px solid var(--grid-major); }
header .seg-btns button.on { background: var(--pt); color: var(--sheet); }

/* Practice: answer boxes, Check, one line of feedback, Show me / New system. */
#practice { padding-bottom: 10px; border-bottom: 1px solid var(--grid); margin-bottom: 8px; }
.ask-q { margin: 0 0 8px; font-weight: 700; font-size: 1.15rem; }
.ask { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; font-family: var(--font-num); font-weight: 700; font-size: 1.6rem; }
.ask input { font: inherit; width: 4ch; height: 54px; text-align: center; color: var(--ink); background: var(--paper); border: 2px solid var(--grid-major); border-radius: 10px; }
.ask input[aria-invalid="true"] { border-color: var(--warn); }
.ask button, .pnav button { font-family: var(--font-display); font-size: 1.15rem; padding: 10px 18px; }
#check { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.fb { margin: 8px 0; min-height: 1.4em; font-weight: 700; font-size: 1.15rem; }
.fb.ok { color: var(--green); } .fb.no { color: var(--warn); }
.pnav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.score { margin-left: auto; color: var(--muted); font-weight: 700; }
.eqin input[readonly] { background: var(--paper); }

.tabs { display: flex; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
.tabs button { flex: 1; border: 0; border-radius: 0; background: var(--sheet); font-family: var(--font-display); font-size: 1.15rem; padding: 10px 6px; }
.tabs button + button { border-left: 2px solid var(--grid-major); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }

.eqin { display: flex; align-items: center; gap: 10px; }
.eqin + .eqin { margin-top: 8px; }
.eqin label { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; width: 1.4em; text-align: center; }
.eqin input { flex: 1; min-width: 0; font-family: var(--font-num); font-weight: 700; font-size: 1.35rem; padding: 6px 10px; border-radius: 8px;
  border: 2px solid var(--grid-major); border-left: 8px solid var(--c); background: var(--sheet); color: var(--ink); }
.eqin input[aria-invalid="true"] { border-color: var(--warn); }
.e1 { --c: var(--l1); } .e2 { --c: var(--l2); }
.e1 label { color: var(--l1); } .e2 label { color: var(--l2); }
.err { color: var(--warn); font-weight: 700; margin: 6px 0 0; }

.steps { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
#work { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
/* Steps line up in one grid: left side | = | right side | what we did. The = signs stay in one column. */
.grid { position: relative; display: grid; grid-template-columns: max-content max-content max-content minmax(9em, 1fr); align-items: center; }
.grid > * { opacity: 0.5; padding: 3px 0; }
.grid > .now, .grid > .flyer { opacity: 1; }
.grid > .top { border-top: 1px dashed var(--grid); padding-top: 8px; }
.grid > .first { border-top: 0; }
.L, .Q, .Rt, .wide { font-family: var(--font-num); font-weight: 700; font-size: 1.5rem; white-space: nowrap; }
.L { grid-column: 1; text-align: right; } .Q { grid-column: 2; padding: 3px 10px; } .Rt { grid-column: 3; }
.wide { grid-column: 1 / 4; }
.note { grid-column: 4; font-weight: 700; font-size: 1rem; line-height: 1.3; margin-left: 16px; padding-left: 12px; border-left: 3px solid var(--grid); align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
.now.note { border-left-color: var(--help); }
.note .more { font-weight: 400; color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
.text { grid-column: 1 / 5; font-weight: 700; font-size: 1.05rem; }
.op { color: var(--help); font-size: 1.25rem; }
.grid.narrow { grid-template-columns: max-content max-content minmax(0, 1fr); }
.grid.narrow .note, .grid.narrow .text { grid-column: 1 / 4; margin-left: 0; padding-left: 0; border-left: 0; }
.fr.big { font-size: 0.85em; }
.row { font-family: var(--font-num); font-weight: 700; font-size: 1.5rem; }
.row i, .el i { font-style: normal; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: 0.7em; line-height: 1.1; margin: 0 1px; }
.fr > span:first-child { border-bottom: 2px solid currentColor; padding: 0 2px; }
.grid i { font-style: normal; }
.etag, .eop, .ex, .ey { display: inline-block; white-space: pre; }
.etag { min-width: 3.2em; text-align: left; font-family: var(--font-display); font-size: 1.1rem; color: var(--muted); }
.eop { min-width: 1.2ch; color: var(--muted); }
.ex { min-width: 5ch; text-align: right; } .ey { min-width: 7ch; text-align: right; }
.r1 .etag { color: var(--l1); } .r2 .etag { color: var(--l2); }
.gone { text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: var(--warn); color: var(--muted); }
.grid > .L.sum, .grid > .Q.sum, .grid > .Rt.sum { border-top: 3px solid var(--ink); }
.answer.big { font-family: var(--font-num); font-size: 1.8rem; color: var(--green); }
.answer.no { color: var(--warn); font-size: 1.4rem; }
.nav { display: flex; gap: 10px; padding-top: 10px; border-top: 1px solid var(--grid); }
.nav button { font-family: var(--font-display); font-size: 1.2rem; padding: 12px 16px; }
.nav #next { flex: 1; background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.nav #next:hover { background: var(--sheet); color: var(--pt); }
.nav button:disabled { opacity: 0.4; cursor: default; }

/* Board drawing */
.ln { stroke-width: 5; stroke-linecap: round; fill: none; }
.ln.l1 { stroke: var(--l1); } .ln.l2 { stroke: var(--l2); }
.ln.l2.same { stroke-dasharray: 14 12; }
.ln.pulse { animation: pulse 0.9s ease-in-out 2; }
@keyframes pulse { 50% { stroke-width: 13; } }
.hl { stroke: var(--help); stroke-width: 4; stroke-dasharray: 12 8; }
.hl.new { animation: pop 0.7s ease-out; }
@keyframes pop { from { opacity: 0; } }
.lbl { font-family: var(--font-num); font-size: 21px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 6px; stroke-linejoin: round; }
.lbl.l1 { fill: var(--l1); } .lbl.l2 { fill: var(--l2); } .lbl.hp { fill: var(--help); } .lbl.sol { fill: var(--green); font-size: 24px; }
.sol-dot { fill: var(--green); stroke: var(--sheet); stroke-width: 4; }
.sol-ring { fill: none; stroke: var(--green); stroke-width: 3; opacity: 0.45; }
/* Substitution: the bracket slides out of the rearranged equation into the letter it replaces. */
.grid .mark { color: var(--from); text-decoration: underline 3px; text-underline-offset: 5px; }
.src { color: var(--muted); font-size: 1.25rem; }
.src .tg { color: var(--from); font-family: var(--font-display); }
.src .fly, .slot .new, .flyer { color: var(--from); }
.slot { display: inline-block; white-space: nowrap; transition: width 3s ease-in-out; }
.slot .old { display: none; transition: opacity 1.2s; }
.flyer { position: absolute; margin: 0; white-space: nowrap; pointer-events: none; z-index: 2; }
@media (prefers-reduced-motion: reduce) { .ln.pulse, .hl.new { animation: none; } }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Solving Linear Systems</h1></div>
    <div class="seg-btns" id="mode" role="group" aria-label="Mode">
      <button type="button" data-mode="learn" class="on">Learning</button><button type="button" data-mode="practice">Practice</button>
    </div>
  </header>

  <div class="main">
    <div class="board">
      <svg id="plane" role="img" aria-label="Coordinate plane with the two lines of the system"></svg>
    </div>

    <div class="panel">
      <section class="card">
        <div class="tabs" id="tabs">
          <button type="button" data-m="elim" aria-pressed="true">Elimination</button>
          <button type="button" data-m="sub" aria-pressed="false">Substitution</button>
        </div>
        <div class="eqin e1"><label for="in1">①</label><input id="in1" value="2x + 3y = 12" autocomplete="off" spellcheck="false" aria-label="Equation 1"></div>
        <div class="eqin e2"><label for="in2">②</label><input id="in2" value="x − y = 1" autocomplete="off" spellcheck="false" aria-label="Equation 2"></div>
        <p class="err" id="err" hidden></p>
      </section>

      <section class="card steps">
        <div id="practice" hidden>
          <p class="ask-q" id="askq"></p>
          <div class="ask">
            <label>x = <input id="ax" inputmode="numeric" autocomplete="off" aria-label="x"></label>
            <label>y = <input id="ay" inputmode="numeric" autocomplete="off" aria-label="y"></label>
            <button type="button" id="check">Check</button>
          </div>
          <p class="fb" id="fb" aria-live="polite"></p>
          <div class="pnav">
            <button type="button" id="showme">Show me</button>
            <button type="button" id="newq">New system ▶</button>
            <span class="score" id="score"></span>
          </div>
        </div>
        <div id="work" aria-live="polite"></div>
        <div class="nav">
          <button type="button" id="back">◀ Back</button>
          <button type="button" id="next">Next step ▶</button>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
/* MathBoard: a coordinate-plane board shared by the concept visuals.
   Usage:
     const b = MathBoard.create(svgEl, { min: -10, max: 10 });
     const A = b.point({ name: "A", x: -3, y: -2, onMove: render });
     const ln = b.line();            // b.lineThrough(ln, A, B) extends it across the plane
     const s  = b.segment("green");  // b.setSegment(s, p, q, { arrow: true })
     const t  = b.label("green");    // t.set("rise = 4", x, y, "start") / t.hide()
     const f  = b.fill("green");     // b.setPolygon(f, [p, q, r])
   Points snap to integers and stay inside [min, max]. Helpers: MathBoard.fmt (true minus sign), MathBoard.gcd. */
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const set = (e, attrs) => { for (const k in attrs) e.setAttribute(k, attrs[k]); };
  const fmt = n => (n < 0 ? "−" + Math.abs(n) : String(n));
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };

  function create(svg, opts = {}) {
    const min = opts.min ?? -10, max = opts.max ?? 10, unit = opts.unit ?? 30, pad = opts.pad ?? 30;
    const size = (max - min) * unit + pad * 2;
    svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
    const sx = x => pad + (x - min) * unit;
    const sy = y => pad + (max - y) * unit;
    const clamp = v => Math.max(min, Math.min(max, v));

    const defs = el("defs", {}, svg);
    ["green", "orange"].forEach(c => {
      const m = el("marker", { id: `mb-arr-${c}`, viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 5, markerHeight: 5, orient: "auto-start-reverse" }, defs);
      el("path", { d: "M0,0 L10,5 L0,10 z", class: `mb-arrow ${c}` }, m);
    });

    // Layers keep drawing order fixed: grid, fills, lines, labels, points.
    const layers = {};
    ["grid", "fills", "lines", "labels", "points"].forEach(n => (layers[n] = el("g", {}, svg)));

    const g = layers.grid;
    const major = opts.majorEvery ?? 0, tickEvery = opts.tickEvery ?? 1; // grade 8: every line labeled, counting by 1
    for (let i = min; i <= max; i++) {
      const cls = i === 0 ? "mb-axis" : major && i % major === 0 ? "mb-major" : "mb-minor";
      el("line", { x1: sx(i), y1: sy(min), x2: sx(i), y2: sy(max), class: cls }, g);
      el("line", { x1: sx(min), y1: sy(i), x2: sx(max), y2: sy(i), class: cls }, g);
    }
    for (let i = min; i <= max; i++) {
      if (i === 0 || i % tickEvery) continue;
      el("text", { x: sx(i), y: sy(0) + 22, class: "mb-tick", "text-anchor": "middle" }, g).textContent = fmt(i);
      el("text", { x: sx(0) - 6, y: sy(i) + 6, class: "mb-tick", "text-anchor": "end" }, g).textContent = fmt(i);
    }
    el("text", { x: sx(max) - 4, y: sy(0) - 10, class: "mb-tick", "text-anchor": "end" }, g).textContent = "x";
    el("text", { x: sx(0) + 8, y: sy(max) + 16, class: "mb-tick" }, g).textContent = "y";

    function toPlane(evt) {
      const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      return { x: clamp(Math.round((p.x - pad) / unit + min)), y: clamp(Math.round(max - (p.y - pad) / unit)) };
    }

    const show = (e, on) => { e.style.display = on ? "" : "none"; };

    const board = {
      svg, min, max, sx, sy, clamp, toPlane, layers, show,
      line(cls = "") { return el("line", { class: `mb-line ${cls}` }, layers.lines); },
      segment(color) { return el("line", { class: `mb-seg ${color}` }, layers.lines); },
      fill(color) { return el("path", { class: `mb-fill ${color}` }, layers.fills); },

      // Draw `line` through plane points p and q, extended to the edges of the plane.
      lineThrough(line, p, q) {
        const dx = q.x - p.x, dy = q.y - p.y;
        if (dx === 0 && dy === 0) return show(line, false);
        show(line, true);
        if (dx === 0) return set(line, { x1: sx(p.x), y1: sy(min), x2: sx(p.x), y2: sy(max) });
        const m = dy / dx, pts = [];
        [min, max].forEach(x => { const y = p.y + m * (x - p.x); if (y >= min - 1e-9 && y <= max + 1e-9) pts.push([x, y]); });
        if (m !== 0) [min, max].forEach(y => { const x = p.x + (y - p.y) / m; if (x > min && x < max) pts.push([x, y]); });
        const a = pts[0], b = pts[pts.length - 1];
        set(line, { x1: sx(a[0]), y1: sy(a[1]), x2: sx(b[0]), y2: sy(b[1]) });
      },

      // Segment from p to q in plane units. `arrow` adds an arrowhead at q; `gap` stops short of q (px), e.g. to clear a point.
      setSegment(seg, p, q, { arrow = false, gap = 0 } = {}) {
        let x2 = sx(q.x), y2 = sy(q.y);
        const L = Math.hypot(x2 - sx(p.x), y2 - sy(p.y));
        if (gap && L > gap) { x2 -= (x2 - sx(p.x)) / L * gap; y2 -= (y2 - sy(p.y)) / L * gap; }
        set(seg, { x1: sx(p.x), y1: sy(p.y), x2, y2 });
        const color = seg.classList.contains("green") ? "green" : "orange";
        arrow ? seg.setAttribute("marker-end", `url(#mb-arr-${color})`) : seg.removeAttribute("marker-end");
      },

      setPolygon(path, pts) {
        path.setAttribute("d", pts.map((p, i) => `${i ? "L" : "M"}${sx(p.x)},${sy(p.y)}`).join(" ") + " Z");
      },

      // Text with a backing chip so grid lines never cut through it. x, y are in px.
      label(color = "") {
        const bg = el("rect", { class: "mb-lbl-bg", rx: 5 }, layers.labels);
        const t = el("text", { class: `mb-lbl ${color}` }, layers.labels);
        return {
          set(text, x, y, anchor = "middle") {
            t.textContent = text; set(t, { x, y, "text-anchor": anchor });
            show(t, true); show(bg, true);
            const b = t.getBBox();
            set(bg, { x: b.x - 5, y: b.y - 2, width: b.width + 10, height: b.height + 4 });
          },
          hide() { show(t, false); show(bg, false); }
        };
      },

      /* Draggable, keyboard-movable point. onMove(point) runs after every move.
         `allow(x, y)` can veto a position (return false). */
      point({ name, x, y, onMove, allow, showCoords = true }) {
        const h = el("g", { class: "mb-handle", tabindex: 0, role: "slider", "aria-label": `Point ${name}. Use arrow keys to move.` }, layers.points);
        el("circle", { class: "hit", r: 26 }, h);
        const ring = el("circle", { class: "ring", r: 18 }, h);
        el("circle", { class: "dot", r: 14 }, h);
        el("text", { class: "mb-name", "text-anchor": "middle", dy: 6.5 }, h).textContent = name;
        const coord = el("text", { class: "mb-coord" }, h);
        const P = {
          name, x, y, el: h, showCoords,
          moveTo(nx, ny, silent) {
            nx = clamp(nx); ny = clamp(ny);
            if (nx === P.x && ny === P.y) return;
            if (allow && !allow(nx, ny)) return;
            P.x = nx; P.y = ny; P.draw();
            if (!silent && onMove) onMove(P);
          },
          // Place the coordinate tag; `away` is a point the tag should face away from.
          draw(away) {
            h.setAttribute("transform", `translate(${sx(P.x)},${sy(P.y)})`);
            h.setAttribute("aria-valuetext", `(${P.x}, ${P.y})`);
            coord.textContent = `(${fmt(P.x)}, ${fmt(P.y)})`;
            let dx = away && P.x < away.x ? -1 : 1, dy = away && P.y < away.y ? -1 : 1;
            if (P.x >= max - 2) dx = -1; if (P.x <= min + 2) dx = 1;
            if (P.y >= max - 1) dy = -1; if (P.y <= min + 1) dy = 1;
            set(coord, { x: dx * 20, y: dy > 0 ? -18 : 34, "text-anchor": dx > 0 ? "start" : "end" });
            show(coord, P.showCoords);
          }
        };
        h.addEventListener("pointerdown", e => { e.preventDefault(); h.setPointerCapture(e.pointerId); h.classList.add("drag"); ring.setAttribute("r", 24); h.focus(); });
        h.addEventListener("pointermove", e => { if (h.hasPointerCapture(e.pointerId)) { const p = toPlane(e); P.moveTo(p.x, p.y); } });
        const end = e => { if (h.hasPointerCapture(e.pointerId)) h.releasePointerCapture(e.pointerId); h.classList.remove("drag"); ring.setAttribute("r", 18); };
        h.addEventListener("pointerup", end); h.addEventListener("pointercancel", end);
        h.addEventListener("keydown", e => {
          const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
          if (!d) return; e.preventDefault(); P.moveTo(P.x + d[0], P.y + d[1]);
        });
        P.draw();
        return P;
      }
    };
    return board;
  }

  window.MathBoard = { create, fmt, gcd };
})();
</script>
<script>
(() => {
  const { fmt, gcd } = MathBoard;
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const svg = $("plane");
  const b = MathBoard.create(svg, { min: -10, max: 10 });
  const { sx, sy, min, max, layers } = b;
  const TAG = ["①", "②"];

  /* ---------- Fractions (answers are not always whole numbers) ---------- */
  const R = (n, d = 1) => { if (typeof n === "object") return n; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return { n: n / g, d: d / g }; };
  const add = (p, q) => R(p.n * q.d + q.n * p.d, p.d * q.d);
  const sub = (p, q) => add(p, R(-q.n, q.d));
  const mul = (p, q) => R(p.n * q.n, p.d * q.d);
  const div = (p, q) => R(p.n * q.d, p.d * q.n);
  const isZ = p => p.n === 0, isOne = p => p.n === 1 && p.d === 1;
  const abs = p => R(Math.abs(p.n), p.d);
  const val = p => p.n / p.d;
  const neg = p => R(-R(p).n, R(p).d);
  const numH = r => r.d === 1 ? fmt(r.n) : (r.n < 0 ? "−" : "") + `<span class="fr"><span>${Math.abs(r.n)}</span><span>${r.d}</span></span>`;
  const numT = r => r.d === 1 ? fmt(r.n) : `${fmt(r.n)}/${r.d}`;

  /* Terms are [coef, "x" | "y" | "" (a number) | "(", inner(H)] and print like 2x − 3y + 4 or 2(x − 1). */
  function ex(terms, H) {
    const N = H ? numH : numT;
    let out = "";
    for (const [c, v, inner] of terms) {
      if (isZ(c)) continue;
      const first = out === "", neg = c.n < 0, mag = abs(c), one = isOne(mag);
      const C = !H && mag.d !== 1 && v !== "" ? "(" + N(mag) + ")" : N(mag);   // (3/2)x reads better than 3/2x
      const body = v === "" ? N(mag) : v === "(" ? (one ? "" : C) + "(" + inner(H) + ")" : (one ? "" : C) + (H ? `<i>${v}</i>` : v);
      out += first ? (neg ? "−" : "") + body : (neg ? " − " : " + ") + body;
    }
    return out || "0";
  }
  const eqn = (L, Rt, H) => ex(L, H) + " = " + ex(Rt, H);
  const both = (L, Rt) => ({ h: eqn(L, Rt, true), t: eqn(L, Rt, false) });
  const std = q => [[R(q.a), "x"], [R(q.b), "y"]];
  const stdEq = q => both(std(q), [[R(q.c), ""]]);
  const other = v => (v === "x" ? "y" : "x");
  const co = (q, v) => (v === "x" ? q.a : q.b);

  /* ---------- Reading what the teacher types ---------- */
  // Any linear equation in x and y: 2x + 3y = 12, y = 2x − 1, 3x = 2y + 6, x = 4, (1/2)x + y = 3, y = −3/4x + 1.5.
  // Fractions and decimals are kept as fractions; a, b, c also get a whole-number copy (times the common denominator) for the graph and elimination.
  const dec = s => { const [w, f = ""] = s.split("."); return R(+(w + f), 10 ** f.length); };
  function parseSide(s) {
    const t = { x: R(0), y: R(0), k: R(0), n: 0 };
    const re = /([+-])?(?:(\()?(\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?(\))?)?([xy])?(?:\/(\d+))?/y;
    let pos = 0;
    while (pos < s.length) {
      re.lastIndex = pos;
      const m = re.exec(s);
      if (!m || m[0] === "" || (!m[3] && !m[6]) || (pos > 0 && !m[1]) || !m[2] !== !m[5] || (m[7] && !m[6])) return null;
      if (m[3] && m[3].length > 5) return null;
      let c = m[3] ? dec(m[3]) : R(1);
      if (m[4]) { const d = dec(m[4]); if (isZ(d)) return null; c = div(c, d); }
      if (m[7]) { if (+m[7] === 0) return null; c = div(c, R(+m[7])); }
      if (m[1] === "-") c = neg(c);
      t[m[6] || "k"] = add(t[m[6] || "k"], c); t.n++;
      pos = re.lastIndex;
    }
    return t.n ? t : null;
  }
  function parse(str) {
    const s = str.replace(/\s+/g, "").replace(/[−–—]/g, "-").replace(/[XY]/g, c => c.toLowerCase()).replace(/÷/g, "/");
    const parts = s.split("=");
    if (parts.length !== 2) return { err: "Type an equation like 2x + 3y = 12." };
    const L = parseSide(parts[0]), Rt = parseSide(parts[1]);
    if (!L || !Rt) return { err: "Type an equation like 2x + 3y = 12 or y = 1/2x − 3." };
    const fr = { a: sub(L.x, Rt.x), b: sub(L.y, Rt.y), c: sub(Rt.k, L.k) };
    if (isZ(fr.a) && isZ(fr.b)) return { err: "The equation needs an x or a y." };
    const lcd = [fr.a, fr.b, fr.c].reduce((m, r) => m * r.d / gcd(m, r.d), 1);
    const q = { a: fr.a.n * lcd / fr.a.d, b: fr.b.n * lcd / fr.b.d, c: fr.c.n * lcd / fr.c.d, fr, lcd };
    if ([q.a, q.b, q.c].some(n => Math.abs(n) > 9999)) return { err: "Those numbers are too big. Try simpler fractions." };
    const side = t => [[t.x, "x"], [t.y, "y"], [t.k, ""]];
    q.typed = both(side(L), side(Rt));
    q.std = isZ(Rt.x) && isZ(Rt.y) && isZ(L.k);           // already ax + by = c
    q.iso = ["x", "y"].find(v => isOne(L[v]) && L.n === 1 && isZ(Rt[v])) || null; // typed as y = ... or x = ...
    return q;
  }

  /* ---------- Steps ---------- */
  let E = [], method = "elim", steps = [], at = 0;
  let sc;                                              // the graph for the step being built
  const T = i => TAG[i];
  const scene = ch => (sc = { ...sc, lab: sc.lab.slice(), help: sc.help.map(h => ({ ...h })), hi: -1, ...ch });
  // A step: its note (cap, plus an optional graph sentence `more`) and its body: rows of working, or one wide piece of HTML.
  // Rows: { eq: "left = right" } or { op: "− 3" } (done to both sides, written under each side).
  const push = (cap, body, more = "") => steps.push({ cap, body, more, sc });
  const rowH = h => [{ eq: h }];
  const fracH = (top, bot) => `<span class="fr big"><span>${top}</span><span>${bot}</span></span>`;
  const paren = r => (r.n < 0 ? `(${numH(r)})` : numH(r));
  // Divide both sides by K, written as a fraction under each side (or × the flip when K is a fraction), then the result.
  const divRows = (K, Lt, Rt, res) => K.d === 1
    ? [{ eq: fracH(ex(Lt, true), numH(K)) + " = " + fracH(ex(Rt, true), numH(K)) }, { eq: res }]
    : [{ op: "× " + paren(div(R(1), K)) }, { eq: res }];
  const setHelp = (v, value, text) => {
    const h = sc.help.find(h => h.v === v);
    if (h) { h.val = value; h.text = text; } else sc.help.push({ v, val: value, text });
  };
  // Dividing by a fraction reads better as multiplying by its flip.
  const divCap = K => (K.d === 1 ? `Divide both sides by ${numT(K)}.` : `Multiply both sides by ${numT(div(R(1), K))}.`);
  const dirWord = u => (u === "x" ? "straight up-and-down" : "flat");

  function solution() {
    const [p, q] = E, D = p.a * q.b - q.a * p.b;
    if (D) return { x: R(p.c * q.b - q.c * p.b, D), y: R(p.a * q.c - q.a * p.c, D) };
    return null;
  }

  // Finish an equation with one letter: K·w + M = C. Pushes the move and divide rows; returns w.
  function finishOne(w, K, M, C) {
    let rhs = sub(C, M);
    if (!isZ(M)) {
      const r = both([[K, w]], [[rhs, ""]]);
      setHelp(w, div(rhs, K), r.t); scene({});
      push(M.n > 0 ? `Subtract ${numT(M)} from both sides.` : `Add ${numT(abs(M))} to both sides.`,
        [{ op: (M.n > 0 ? "− " : "+ ") + numH(abs(M)) }, { eq: r.h }]);
    }
    const x = div(rhs, K);
    if (!isOne(K)) {
      const r = both([[R(1), w]], [[x, ""]]);
      setHelp(w, x, r.t); scene({});
      push(divCap(K), divRows(K, [[K, w]], [[rhs, ""]], r.h));
    }
    return x;
  }

  // Put a known value into an equation q (in x, y order) and solve for the other letter.
  function plugIn(u, value, q, j) {
    const v = other(u), cu = R(co(q, u)), cv = R(co(q, v));
    const plain = isOne(abs(cu)) && value.d === 1 && value.n > 0;
    const known = plain ? [mul(cu, value), ""] : [cu, "(", H => (H ? numH : numT)(value)];
    const terms = u === "x" ? [known, [cv, v]] : [[cv, v], known];
    const vv = div(sub(R(q.c), mul(cu, value)), cv);
    const r1 = both(terms, [[R(q.c), ""]]);
    setHelp(v, vv, r1.t); scene({});
    push(`Put ${u} = ${numT(value)} into equation ${T(j)}.`, rowH(r1.h));
    const M = mul(cu, value);
    if (!plain) {
      const t2 = u === "x" ? [[M, ""], [cv, v]] : [[cv, v], [M, ""]];
      const r2 = both(t2, [[R(q.c), ""]]);
      setHelp(v, vv, r2.t); scene({});
      push("Multiply.", rowH(r2.h));
    }
    return finishOne(v, cv, M, R(q.c));
  }

  function answer() {
    const s = solution();
    const off = Math.abs(val(s.x)) > 10 || Math.abs(val(s.y)) > 10;
    scene({ point: true });
    push(`The lines cross at (${numT(s.x)}, ${numT(s.y)}). That point works in both equations.`,
      `<span class="answer big">(${numH(s.x)}, ${numH(s.y)})</span>`, off ? "The crossing is off this grid." : "");
  }
  function noAnswer(always) {
    scene({ hi: 2 });
    if (always) push("Both equations make the same line. Every point on it works, so there are infinitely many solutions.", `<span class="answer no">Infinitely many solutions</span>`);
    else push("The lines are parallel. They never cross, so there is no solution.", `<span class="answer no">No solution</span>`);
  }

  // Elimination rows: tag | sign | x term | y term = number, written into the step grid so their = lines up with every
  // other step. The terms sit in fixed-width boxes (the font is monospaced), so x's stack over x's and y's over y's.
  // `gone` strikes the letter that cancels; the sum row gets a line over it.
  function table(rows) {
    return rows.map(r => {
      const a = R(r.q.a), bb = R(r.q.b);
      const xs = isZ(a) ? "" : ex([[a, "x"]], true);
      const ys = isZ(bb) ? "" : !isZ(a) ? (bb.n < 0 ? "− " : "+ ") + ex([[abs(bb), "y"]], true) : ex([[bb, "y"]], true);
      const zero = r.sum && isZ(a) && isZ(bb);
      const g = v => (r.gone && r.gone.includes(v) ? " gone" : "");
      const L = `<span class="etag">${r.tag || ""}</span><span class="eop">${r.op || ""}</span>` +
        `<span class="ex${g("x")}">${zero ? "0" : xs}</span><span class="ey${g("y")}">${ys}</span>`;
      return { eq: `${L} = ${numH(R(r.q.c))}`, cls: (r.cls || "") + (r.sum ? " sum" : "") };
    });
  }

  function elimination() {
    // Flip a rewritten equation so it starts with a positive term.
    const flip = E.map(q => !q.std && (q.a < 0 || (!q.a && q.b < 0)) ? -1 : 1);
    let A = E.map((q, i) => ({ a: mul(q.fr.a, R(flip[i])), b: mul(q.fr.b, R(flip[i])), c: mul(q.fr.c, R(flip[i])) }));
    if (!E[0].std || !E[1].std) {
      scene({ lab: A.map(q => stdEq(q).t) });
      push("Line up the x's, the y's and the numbers.", table(A.map((q, i) => ({ q, tag: T(i), cls: "r" + (i + 1) }))));
    }
    // Fractions: multiply by the common denominator first.
    A = E.map((q, i) => ({ a: q.a * flip[i], b: q.b * flip[i], c: q.c * flip[i] }));
    [0, 1].forEach(i => {
      if (E[i].lcd === 1) return;
      scene({ hi: i }); sc.lab[i] = stdEq(A[i]).t;
      push(`Multiply equation ${T(i)} by ${E[i].lcd} to clear the fractions.`,
        table([{ q: A[i], tag: `${T(i)}×${E[i].lcd}`, cls: "r" + (i + 1) }]), "On the graph it's still the same line!");
    });
    const D = A[0].a * A[1].b - A[1].a * A[0].b;
    // One equation already has only one letter: solve it, then put it in the other.
    const lone = D ? [0, 1].find(i => !A[i].a || !A[i].b) : undefined;
    if (lone !== undefined) {
      const q = A[lone], w = q.a ? "x" : "y", K = R(co(q, w));
      scene({});
      setHelp(w, div(R(q.c), K), stdEq(q).t);
      push(`Equation ${T(lone)} only has ${w}, so there is nothing to cancel.`, rowH(stdEq(q).h));
      const x = finishOne(w, K, R(0), R(q.c));
      const o = A[1 - lone];
      if (co(o, w)) plugIn(w, x, o, 1 - lone);
      else {
        // The other equation only has the other letter too.
        const v = other(w);
        scene({}); setHelp(v, R(o.c, co(o, v)), stdEq(o).t);
        push(`Equation ${T(1 - lone)} only has ${v}.`, rowH(stdEq(o).h));
        finishOne(v, R(co(o, v)), R(0), R(o.c));
      }
      return answer();
    }
    // Pick the letter to cancel: fewest equations to multiply, no negative multiplier if we can help it.
    const plans = ["y", "x"].filter(v => co(A[0], v) && co(A[1], v)).map(v => {
      const p = co(A[0], v), q = co(A[1], v), L = Math.abs(p * q) / gcd(p, q);
      let m1 = L / Math.abs(p), m2 = L / Math.abs(q);
      if (Math.sign(p) === Math.sign(q)) { if (m2 > 1 || m1 === 1) m2 = -m2; else m1 = -m1; }
      const cost = (m1 !== 1) + (m2 !== 1) + (m1 < 0 || m2 < 0 ? 0.5 : 0);
      return { v, m: [m1, m2], cost, L };
    }).sort((p, q) => p.cost - q.cost || p.L - q.L);
    const { v, m } = plans[0], u = other(v);
    const S = A.map((q, i) => ({ a: q.a * m[i], b: q.b * m[i], c: q.c * m[i] }));
    const tagOf = i => (m[i] === 1 ? T(i) : `${T(i)}×${m[i] < 0 ? "(" + fmt(m[i]) + ")" : m[i]}`);
    [0, 1].forEach(i => {
      if (m[i] === 1) return;
      scene({ hi: i }); sc.lab[i] = stdEq(S[i]).t;
      push(`Multiply equation ${T(i)} by ${fmt(m[i])} so the ${v}'s are opposites.`,
        table([{ q: S[i], tag: tagOf(i), cls: "r" + (i + 1) }]), "On the graph it's still the same line!");
    });
    const sum = { a: S[0].a + S[1].a, b: S[0].b + S[1].b, c: S[0].c + S[1].c };
    const tbl = table([{ q: S[0], tag: tagOf(0), cls: "r1", gone: D ? v : "xy" },
                       { q: S[1], tag: tagOf(1), cls: "r2", op: "+", gone: D ? v : "xy" },
                       { q: sum, sum: true }]);
    if (!D) {
      scene({ hi: 2 });
      push(`Add the equations. Everything cancels, and 0 = ${fmt(sum.c)} is ${sum.c ? "never" : "always"} true.`, tbl);
      return noAnswer(!sum.c);
    }
    const K = R(co(sum, u)), C = R(sum.c);
    scene({}); setHelp(u, div(C, K), both([[K, u]], [[C, ""]]).t);
    push(`Add the equations. The ${v}'s cancel!`, tbl, `With only ${u} left, the graph is a ${dirWord(u)} line through the crossing.`);
    const x = finishOne(u, K, R(0), C);
    // Put it back into the equation with the simplest other letter.
    const j = [0, 1].sort((p, q) => Math.abs(co(A[p], v)) - Math.abs(co(A[q], v)))[0];
    plugIn(u, x, A[j], j);
    answer();
  }

  function substitution() {
    const F = E.map(q => ({ ...q, a: q.fr.a, b: q.fr.b, c: q.fr.c }));
    const nv = (q, v) => val(co(q, v));
    // Pick the equation and letter that are easiest to get alone: already alone, then a plain +1 letter (one move),
    // then −1 (an extra divide by −1), then other numbers, with a penalty when dividing leaves fractions. y wins ties.
    let best = null;
    [0, 1].forEach(i => ["y", "x"].forEach(v => {
      const k = nv(F[i], v), l = nv(F[i], other(v)), kj = nv(F[1 - i], v);
      if (!k) return;
      const K = R(co(F[i], v)), frac = [div(R(co(F[i], other(v))), K), div(R(F[i].c), K)].some(r => r.d !== 1);
      const score = (F[i].iso === v ? -1 : !l ? 0 : Math.abs(k) === 1 ? 1 : 2 + Math.abs(k)) + (k < 0 ? 0.5 : 0) + (frac ? 1 : 0)
        + (kj ? 0 : 10) + (v === "x" ? 0.2 : 0) + i * 0.01;
      if (!best || score < best.score) best = { i, v, score };
    }));
    const { i, v } = best, u = other(v), j = 1 - i, q = F[i], Q = F[j];
    const k = R(co(q, v)), l = R(co(q, u)), c = R(q.c);
    const pp = div(neg(co(q, u)), k), qq = div(c, k);
    const Ex = H => ex([[pp, u], [qq, ""]], H);
    const iso = both([[R(1), v]], [[pp, u], [qq, ""]]);
    if (q.iso !== v) {
      let moved = false;
      if (!isZ(l) || !q.std) {
        const r = both([[k, v]], [[neg(co(q, u)), u], [c, ""]]);
        scene({ hi: i }); sc.lab[i] = r.t;
        // Written out: the equation, the term taken away from both sides, the result.
        const rows = q.std && !isZ(l) ? [{ eq: stdEq(q).h }, { op: (l.n > 0 ? "− " : "+ ") + ex([[abs(l), u]], true) }, { eq: r.h }] : rowH(r.h);
        push(`Get ${v} by itself in equation ${T(i)}.` + (isZ(l) ? "" : ` Move the ${u} term to the other side.`), rows, "It's still the same line!");
        moved = true;
      }
      if (!isOne(k)) {
        scene({ hi: i }); sc.lab[i] = iso.t;
        push((moved ? "" : `Get ${v} by itself in equation ${T(i)}. `) + divCap(k), divRows(k, [[k, v]], [[neg(l), u], [c, ""]], iso.h));
      }
    }
    const s = solution();
    let w;
    const kj = R(co(Q, v)), lj = R(co(Q, u)), cj = R(Q.c);
    if (isZ(kj)) {
      // The other equation has no v at all: it already has only u.
      scene({}); setHelp(u, s ? s[u] : R(0), stdEq(Q).t);
      push(isOne(lj) ? `Equation ${T(j)} already says ${Q.typed.t}.` : `Equation ${T(j)} only has ${u}, so solve it.`, rowH(Q.typed.h));
      w = finishOne(u, lj, R(0), cj);
    } else {
      const put = [kj, "(", Ex], mine = [lj, u];
      const r1 = both(v === "x" ? [put, mine] : [mine, put], [[cj, ""]]);
      // Start from equation j as it is, with its v marked in the colour of the equation the bracket comes from.
      const start = both(std(Q), [[cj, ""]]).h;
      scene({ hi: j });
      const from = `--from: var(--l${i + 1})`;
      push(`Start with equation ${T(j)}. Find the ${v} in it.`, [{ eq: start.replace(`<i>${v}</i>`, `<i class="mark">${v}</i>`), style: from }]);
      // Then the bracket slides out of the rearranged equation and into v's place (animated in show()).
      const slot = `<span class="slot"><i class="old mark">${v}</i><span class="new">(${Ex(true)})</span></span>`;
      const into = eqn(v === "x" ? [[kj, "(", () => "\u0001"], mine] : [mine, [kj, "(", () => "\u0001"]], [[cj, ""]], true).replace("(\u0001)", slot);
      scene({}); if (s) setHelp(u, s[u], r1.t); else sc.hi = 2;
      push(`Put (${Ex(false)}) in place of ${v} in equation ${T(j)}.`,
        [{ eq: `<span class="tg">${T(i)}</span> <i>${v}</i> = <span class="fly">${Ex(true)}</span>`, cls: "src", style: from }, { eq: into, style: from }],
        s ? `With only ${u} left, the graph is a ${dirWord(u)} line through the crossing.` : "");
      const a1 = [mul(kj, pp), u], a2 = [mul(kj, qq), ""];
      const r2 = both(v === "x" ? [a1, a2, mine] : [mine, a1, a2], [[cj, ""]]);
      scene({}); if (s) setHelp(u, s[u], r2.t); else sc.hi = 2;
      push("Multiply to clear the brackets.", rowH(r2.h));
      const K = add(mul(kj, pp), lj), M = mul(kj, qq);
      const r3 = both([[K, u], [M, ""]], [[cj, ""]]);
      if (isZ(K)) {
        const ok = M.n * cj.d === cj.n * M.d;
        scene({ hi: 2 });
        push(`Combine the ${u}'s. They cancel, and ${r3.t} is ${ok ? "always" : "never"} true.`, rowH(r3.h));
        return noAnswer(ok);
      }
      if (!isZ(mul(kj, pp)) && !isZ(lj)) { scene({}); setHelp(u, s[u], r3.t); push(`Combine the ${u}'s.`, rowH(r3.h)); }
      w = finishOne(u, K, M, cj);
    }
    if (!s) return noAnswer(false);
    // Back into v = ...
    if (isZ(pp)) {
      scene({}); setHelp(v, qq, iso.t);
      push(`Equation ${T(i)} already says ${iso.t}.`, rowH(iso.h));
    } else {
      const r1 = both([[R(1), v]], [[pp, "(", H => (H ? numH : numT)(w)], [qq, ""]]);
      scene({}); setHelp(v, s[v], r1.t);
      push(`Put ${u} = ${numT(w)} into ${iso.t}.`, rowH(r1.h));
      const r2 = both([[R(1), v]], [[s[v], ""]]);
      if (r2.t !== r1.t) { scene({}); setHelp(v, s[v], r2.t); push("Work it out.", rowH(r2.h)); }
    }
    answer();
  }

  function build() {
    steps = []; at = 0;
    sc = { lab: [E[0].typed.t, E[1].typed.t], hi: -1, help: [], point: false };
    push("The answer is where the two lines cross. Press Next step.", "");
    if (method === "elim") elimination(); else substitution();
  }

  /* ---------- Drawing ---------- */
  const gLines = el("g", {}, layers.lines), gHelp = el("g", {}, layers.lines);
  const gLbl = el("g", {}, layers.labels), gPt = el("g", {}, layers.points);
  // Where a·x + b·y = c meets the edge of the grid.
  function clip(a, b2, c) {
    const pts = [];
    const ok = t => t >= min - 1e-9 && t <= max + 1e-9;
    if (b2) [min, max].forEach(x => { const y = (c - a * x) / b2; if (ok(y)) pts.push([x, y]); });
    if (a) [min, max].forEach(y => { const x = (c - b2 * y) / a; if (ok(x)) pts.push([x, y]); });
    if (pts.length < 2) return null;
    let best = [pts[0], pts[1]], d = -1;
    pts.forEach(p => pts.forEach(q => { const e = Math.hypot(p[0] - q[0], p[1] - q[1]); if (e > d) { d = e; best = [p, q]; } }));
    return d > 1e-9 ? best : null;
  }
  function label(text, x, y, cls, anchor = "middle") {
    const t = el("text", { x, y, class: "lbl " + cls, "text-anchor": anchor }, gLbl);
    t.textContent = text;
    // Keep the label on the board.
    const bb = t.getBBox(), lo = sx(min) - 20, hi = sx(max) + 20;
    let dx = 0;
    if (bb.x < lo) dx = lo - bb.x; else if (bb.x + bb.width > hi) dx = hi - bb.x - bb.width;
    if (dx) t.setAttribute("x", x + dx);
    return t;
  }
  let lastHelp = "", lastHi = "";
  const hitBox = (p, q) => p.x < q.x + q.width && q.x < p.x + p.width && p.y < q.y + q.height && q.y < p.y + p.height;
  function draw() {
    gLines.replaceChildren(); gHelp.replaceChildren(); gLbl.replaceChildren(); gPt.replaceChildren();
    if (mode === "practice" && !revealed) return;          // practice: no lines until it is answered or shown
    const s = steps.length ? steps[at].sc : null;
    const same = E[0] && E[1] && E[0].a * E[1].b === E[1].a * E[0].b && E[0].a * E[1].c === E[1].a * E[0].c && E[0].b * E[1].c === E[1].b * E[0].c;
    const segs = [], boxes = [];  // what a line's label should stay off
    const base = E.map((q, i) => {
      if (!q) return null;
      const seg = clip(q.a, q.b, q.c);
      if (!seg) return null;
      const ln = el("line", { x1: sx(seg[0][0]), y1: sy(seg[0][1]), x2: sx(seg[1][0]), y2: sy(seg[1][1]), class: `ln l${i + 1}${i && same ? " same" : ""}` }, gLines);
      if (s && (s.hi === i || s.hi === 2) && lastHi !== at + ":" + i) ln.classList.add("pulse");
      segs.push({ i, seg });
      return seg;
    });
    if (s) {
      if (s.hi >= 0) lastHi = at + ":" + (s.hi === 2 ? 1 : s.hi);
      s.help.forEach(h => {
        const v = val(h.val);
        if (v < min || v > max) return;
        const seg = h.v === "x" ? [[v, min], [v, max]] : [[min, v], [max, v]];
        const ln = el("line", { x1: sx(seg[0][0]), y1: sy(seg[0][1]), x2: sx(seg[1][0]), y2: sy(seg[1][1]), class: "hl" }, gHelp);
        if (!lastHelp.includes("|" + h.v + v + "|")) ln.classList.add("new");
        segs.push({ i: -1, seg });
        if (h.text.length > 16) return;                   // long working rows stay in the panel
        // Put the label on the far side of the grid from the crossing.
        const so = solution(), far = h.v === "x" ? (so && val(so.y) < 0 ? 8.6 : -8.6) : (so && val(so.x) < 0 ? 8.6 : -8.6);
        const t = h.v === "x" ? label(h.text, sx(v) + (v > 5 ? -10 : 10), sy(far) + 8, "hp", v > 5 ? "end" : "start")
                              : label(h.text, sx(far), sy(v) + (v > 8 ? 26 : -10), "hp", far > 0 ? "end" : "start");
        boxes.push(t.getBBox());
      });
      lastHelp = "|" + s.help.map(h => h.v + val(h.val)).join("|") + "|";
      if (s.point) {
        const sol = solution(), X = val(sol.x), Y = val(sol.y);
        if (X >= min && X <= max && Y >= min && Y <= max) {
          el("circle", { cx: sx(X), cy: sy(Y), r: 20, class: "sol-ring" }, gPt);
          el("circle", { cx: sx(X), cy: sy(Y), r: 11, class: "sol-dot" }, gPt);
          const right = X < 4;
          boxes.push(label(`(${numT(sol.x)}, ${numT(sol.y)})`, sx(X) + (right ? 26 : -26), sy(Y) + (Y > 8 ? 34 : -16), "sol", right ? "start" : "end").getBBox());
        }
      }
    }
    // Each line's equation sits beside it, at the spot that stays clear of the axes, the other lines and other labels.
    const sol = E[0] && E[1] ? solution() : null;
    const cross = sol ? { x: sx(val(sol.x)), y: sy(val(sol.y)) } : null;
    const axisX = { x: sx(min) - 30, y: sy(0) - 22, width: sx(max) - sx(min) + 60, height: 48 };
    const axisY = { x: sx(0) - 40, y: sy(max) - 30, width: 44, height: sy(min) - sy(max) + 60 };
    base.forEach((seg, i) => {
      if (!seg) return;
      const [p0, p1] = seg;
      const nx = -(sy(p1[1]) - sy(p0[1])), ny = sx(p1[0]) - sx(p0[0]), L = Math.hypot(nx, ny) || 1;
      let ox = nx / L, oy = ny / L;
      if (oy > 0) { ox = -ox; oy = -oy; }
      let best = null;
      for (let k = 0; k <= 16; k++) {
        const t = 0.08 + 0.84 * k / 16;
        for (const side of [1, -1]) {
          const px = sx(p0[0] + (p1[0] - p0[0]) * t) + ox * 22 * side, py = sy(p0[1] + (p1[1] - p0[1]) * t) + oy * 22 * side + 7;
          const anchor = ox * side < -0.3 ? "end" : ox * side > 0.3 ? "start" : "middle";
          const tx = label(s ? s.lab[i] : E[i].typed.t, px, py, "l" + (i + 1), anchor);
          const bb = tx.getBBox(); tx.remove();
          let pen = Math.abs(t - (i ? 0.75 : 0.25)) + (side < 0 ? 0.3 : 0);
          if (bb.y < sy(max) - 24 || bb.y + bb.height > sy(min) + 24 || bb.x < sx(min) - 24 || bb.x + bb.width > sx(max) + 24) pen += 50;
          if (hitBox(bb, axisX)) pen += 6; if (hitBox(bb, axisY)) pen += 6;
          boxes.forEach(o => { if (hitBox(bb, o)) pen += 20; });
          segs.forEach(o => {
            if (o.i === i) return;
            for (let m = 0; m <= 40; m++) {
              const X = sx(o.seg[0][0] + (o.seg[1][0] - o.seg[0][0]) * m / 40), Y = sy(o.seg[0][1] + (o.seg[1][1] - o.seg[0][1]) * m / 40);
              if (X > bb.x - 4 && X < bb.x + bb.width + 4 && Y > bb.y - 4 && Y < bb.y + bb.height + 4) { pen += 10; break; }
            }
          });
          if (cross && Math.hypot(bb.x + bb.width / 2 - cross.x, bb.y + bb.height / 2 - cross.y) < 60) pen += 8;
          if (!best || pen < best.pen) best = { pen, px, py, anchor, bb };
        }
      }
      label(s ? s.lab[i] : E[i].typed.t, best.px, best.py, "l" + (i + 1), best.anchor);
      boxes.push(best.bb);
    });
  }

  /* ---------- Panel ---------- */
  // Every step goes into one grid so the = signs line up down the page; each step's note sits in the column on the right.
  function show() {
    const work = $("work");
    const narrow = work.clientWidth > 0 && work.clientWidth < 520;   // phones: each note goes on its own line above its working
    let r = 1, html = "";
    steps.slice(0, at + 1).forEach((s, k) => {
      const now = k === at ? " now" : "";
      const rows = Array.isArray(s.body) ? s.body : s.body ? [{ wide: s.body }] : [];
      if (!rows.length) { html += `<div class="text${now}${k ? " top" : ""}" style="grid-row: ${r}">${s.cap}</div>`; r++; return; }
      const note = `${s.cap}${s.more ? `<span class="more">${s.more}</span>` : ""}`;
      if (narrow) { html += `<div class="note${now}${k ? " top" : ""}" style="grid-row: ${r}">${note}</div>`; r++; }
      rows.forEach((w, i) => {
        const cls = now + (i === 0 && k && !narrow ? " top" : "") + (w.cls ? " " + w.cls : ""), st = `grid-row: ${r + i};${w.style || ""}`;
        const d = (c, inner) => `<div class="${c}${cls}" style="${st}">${inner}</div>`;
        if (w.wide) html += d("wide", w.wide);
        else if (w.op) html += d("L op", w.op) + d("Q", "") + d("Rt op", w.op);
        else { const m = w.eq.indexOf(" = "); html += d("L", w.eq.slice(0, m)) + d("Q", "=") + d("Rt", w.eq.slice(m + 3)); }
      });
      if (!narrow) html += `<div class="note${now}${k ? " top" : ""}" style="grid-row: ${r} / span ${rows.length}">${note}</div>`;
      r += rows.length;
    });
    work.innerHTML = `<div class="grid${narrow ? " narrow" : ""}">${html}</div>`;
    work.scrollTop = work.scrollHeight;
    $("back").disabled = at === 0;
    $("next").disabled = !steps.length;
    $("next").textContent = at === steps.length - 1 ? "Start over ↺" : "Next step ▶";
    draw();
    if (play) slide(work.firstElementChild);
    play = false;
  }

  // Slowly slide the bracket from the rearranged equation into the letter's place: the bracket lifts off and travels
  // down while the gap opens up, then it settles in. Only on Next, never on Back.
  let play = false, run = 0;
  function slide(grid) {
    const slot = grid && grid.querySelector(".now .slot"), src = grid && grid.querySelector(".now .fly");
    if (!slot || !src || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const id = ++run, old = slot.querySelector(".old"), nw = slot.querySelector(".new");
    const box = grid.getBoundingClientRect(), rel = r => ({ x: r.left - box.left, y: r.top - box.top, w: r.width });
    // Hold the columns at their finished widths so the rows above stay still while the gap opens.
    grid.style.gridTemplateColumns = getComputedStyle(grid).gridTemplateColumns;
    const end = rel(nw.getBoundingClientRect()), wNew = slot.offsetWidth;
    old.style.display = "inline"; nw.style.display = "none";
    const wOld = slot.offsetWidth;
    slot.style.width = wOld + "px";
    const fly = document.createElement("div");
    fly.className = "row flyer"; fly.style.setProperty("--from", getComputedStyle(src).color);
    fly.innerHTML = nw.innerHTML;
    grid.appendChild(fly);
    const from = rel(src.getBoundingClientRect());
    from.x -= (fly.offsetWidth - from.w) / 2;
    fly.style.left = from.x + "px"; fly.style.top = from.y + "px";
    src.style.opacity = "0.35";
    const later = (ms, f) => setTimeout(() => { if (id === run && grid.isConnected) f(); }, ms);
    fly.animate([{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: 1000 });
    later(1000, () => {
      slot.style.width = wNew + "px"; old.style.opacity = "0";
      fly.animate([{ transform: "translate(0, 0)" }, { transform: `translate(${end.x - from.x}px, ${end.y - from.y}px)` }],
        { duration: 3000, easing: "ease-in-out", fill: "forwards" });
    });
    later(4000, () => {
      fly.remove(); src.style.opacity = ""; old.style.display = ""; nw.style.display = ""; slot.style.width = "";
      grid.style.gridTemplateColumns = "";
    });
  }

  /* ---------- Practice: the same two skills, on a new system each time ---------- */
  // Answers are whole numbers from −6 to 6. Substitution systems always have a lone x or y (sometimes already written
  // y = ...); elimination systems need at least one equation multiplied first. The graph stays hidden until answered.
  let mode = "learn", saved = ["", ""], revealed = false, walking = false, tried = false, right = 0, total = 0;
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const nz = (a, b) => { let n; do n = rnd(-b, b); while (Math.abs(n) < a); return n; };
  const termStr = terms => {
    let out = "";
    terms.forEach(([c, v]) => {
      if (!c) return;
      const m = Math.abs(c), body = v && m === 1 ? v : m + v;
      out += out ? (c < 0 ? " − " : " + ") + body : (c < 0 ? "−" : "") + body;
    });
    return out || "0";
  };
  function makeSystem(m) {
    for (;;) {
      const x = rnd(-6, 6), y = rnd(-6, 6);
      if (!x && !y) continue;
      let p, q;
      if (m === "sub") {
        p = [Math.random() < 0.75 ? 1 : -1, nz(1, 5)];
        q = [nz(2, 5), nz(1, 5)];
        if (Math.random() < 0.5) p.reverse();
        if (Math.random() < 0.5) q.reverse();
      } else {
        p = [nz(2, 6), nz(1, 6)]; q = [nz(2, 6), nz(2, 6)];
        if (Math.random() < 0.5) p.reverse();
        if (Math.abs(p[0]) === Math.abs(q[0]) || Math.abs(p[1]) === Math.abs(q[1])) continue;
      }
      if (p[0] < 0 || (p[0] === 0 && p[1] < 0)) p = p.map(n => -n);   // start each equation with a positive term
      if (q[0] < 0) q = q.map(n => -n);
      if (p[0] * q[1] === q[0] * p[1] || gcd(Math.abs(p[0]), Math.abs(p[1])) > 1 || gcd(Math.abs(q[0]), Math.abs(q[1])) > 1) continue;
      const pc = p[0] * x + p[1] * y, qc = q[0] * x + q[1] * y;
      if (Math.abs(pc) > 40 || Math.abs(qc) > 40) continue;
      let ps = `${termStr([[p[0], "x"], [p[1], "y"]])} = ${termStr([[pc, ""]])}`;
      const lone = p[1] === 1 ? "y" : p[0] === 1 ? "x" : null;
      if (m === "sub" && lone && Math.random() < 0.35)     // already alone: y = 3x − 2
        ps = lone === "y" ? `y = ${termStr([[-p[0], "x"], [pc, ""]])}` : `x = ${termStr([[-p[1], "y"], [pc, ""]])}`;
      const qs = `${termStr([[q[0], "x"], [q[1], "y"]])} = ${termStr([[qc, ""]])}`;

  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
