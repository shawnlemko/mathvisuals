<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Buy or Lease a Car (Alberta Math 30-3 Number SO2; Shawn 2026-10-22).
   2.2 compare the total cost of buying, leasing and leasing to own; 2.3 justify a choice with personal factors.
   Three columns side by side, each with its own few inputs and one tall bar of its total cost:
     Buy            = down payment + monthly × months       (you keep a car worth ___ at the end)
     Lease          = fees + monthly × months               (you give the car back)
     Lease then buy = the lease total + the buyout price    (you own the car)
   The monthly payments already include interest; taxes are left out. Learn: Next step reveals the work one line
   at a time (vertical, = lined up, step names on the right) and each bar appears when its total is found.
   "What matters to you?" cards each favour one choice and say why. Practice: a person's numbers and two facts
   about them; find the three totals and pick the best fit; Show me.
   Colours: up front (down payment, fees) purple, monthly payments blue, buyout orange, the car's value green. */
:root { --cx: #7a3fb8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cx: #c09bf5; } }
:root[data-theme="dark"] { --cx: #c09bf5; }
@media (min-width: 861px) { .main { grid-template-columns: minmax(0, 1.9fr) minmax(320px, 1fr); } }
.k-up { color: var(--cx); } .k-pay { color: var(--pt); } .k-out { color: var(--orange); } .k-val { color: var(--green); }

.seg-btns { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg-btns button { border: 0; border-radius: 0; background: var(--sheet); color: var(--ink); font-size: 1.1rem; min-height: 48px; padding: 6px 14px; }
.seg-btns button + button { border-left: 2px solid var(--grid-major); }
.seg-btns button.on { background: var(--pt); color: var(--sheet); }
header .seg-btns button { font-size: 1.2rem; padding: 6px 20px; }
.wide { display: flex; width: 100%; }
.wide button { flex: 1 1 0; padding: 6px 8px; font-size: 1.05rem; }

/* Board: three columns, inputs on top, a tall bar below. */
.board { gap: 8px; padding: 10px 14px; }
.lead { margin: 0; font-size: clamp(1rem, min(1.5vw, 2.9vh), 1.3rem); line-height: 1.3; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; flex: 1 1 auto; min-height: 0; }
.col { display: flex; flex-direction: column; gap: 4px; min-width: 0; min-height: 0; padding: 8px 10px; border-radius: 12px; background: var(--chip); border: 3px solid transparent; }
.col.best { border-color: var(--green); }
.col h2 { margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 6px; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.15rem, min(1.8vw, 3.4vh), 1.6rem); line-height: 1.15; }
.fits { flex: none; font-family: var(--font-body); font-size: 0.85rem; font-weight: 700; color: var(--green); white-space: nowrap; }
.f { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 2.2rem; }
.f label, .f .lab { font-size: 0.95rem; font-weight: 700; line-height: 1.15; min-width: 0; }
.f .box { flex: none; display: flex; align-items: baseline; gap: 2px; font-family: var(--font-num); font-weight: 700; font-size: clamp(1rem, min(1.5vw, 2.8vh), 1.3rem); }
.f input { font: inherit; color: inherit; width: 4.6em; padding: 1px 5px; text-align: right; border: 2px solid var(--grid-major); border-radius: 8px; background: var(--sheet); }
.f input[readonly] { border-color: transparent; background: transparent; }
.f .same { font-family: var(--font-num); font-weight: 700; font-size: clamp(1rem, min(1.5vw, 2.8vh), 1.3rem); }
.cur.post { margin-left: 3px; }
.barbox { position: relative; flex: 1 1 auto; min-height: 110px; margin-top: 4px; border-bottom: 3px solid var(--grid-major); }
.bar { position: absolute; bottom: 0; left: 14%; right: 14%; display: flex; flex-direction: column-reverse; transition: height 0.3s ease; }
.seg { display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; color: #fff; text-align: center; line-height: 1.1; min-height: 0; font-weight: 700; font-size: clamp(0.75rem, min(1.1vw, 2.1vh), 1rem); }
.seg b { font-family: var(--font-num); font-size: 1.1em; }
.seg:last-child { border-radius: 8px 8px 0 0; }
.seg.up { background: var(--cx); } .seg.pay { background: var(--pt); } .seg.out { background: var(--orange); }
.tot { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--font-num); font-weight: 700; font-size: clamp(1.2rem, min(2.1vw, 4vh), 2rem); line-height: 1.1; }
.ghost { position: absolute; bottom: 0; left: 14%; right: 14%; height: 45%; border: 3px dashed var(--grid-major); border-bottom: 0; border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-num); font-weight: 700; font-size: 2.4rem; color: var(--muted); }
.keep { margin: 2px 0 0; text-align: center; font-size: clamp(0.85rem, min(1.25vw, 2.4vh), 1.1rem); line-height: 1.25; min-height: 2.5em; }
.keep b { font-family: var(--font-num); }
@media (max-width: 640px) { .cols { grid-template-columns: 1fr; } .barbox { min-height: 200px; } }

/* Panel. */
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel { gap: 12px; }
.card { padding: 12px 14px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns button { font-size: 1.05rem; min-height: 48px; padding: 8px 14px; border-radius: 10px; }
.btns button.go { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.say { margin: 0 0 8px; font-size: clamp(1rem, min(1.4vw, 2.7vh), 1.25rem); line-height: 1.35; }
.say b { font-family: var(--font-num); }
.note { margin: 10px 0 0; padding-top: 8px; border-top: 1px dashed var(--grid-major); color: var(--muted); font-size: 0.9rem; line-height: 1.35; }
/* Work: one step per line, = lined up, step names in their own column on the right. */
.work { display: grid; grid-template-columns: max-content max-content max-content minmax(5.5em, 1fr); column-gap: 0.35em; row-gap: 0.12em; align-items: baseline; font-family: var(--font-num); font-weight: 700; font-size: clamp(0.85rem, 1.05vw, 1.1rem); }
.work > div { white-space: nowrap; }
.work .why { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: 0.8rem; white-space: normal; padding-left: 0.6em; line-height: 1.2; }
.work .gap { grid-column: 1 / -1; height: 0.35em; }
.work .eq { color: var(--muted); }
.work .new { animation: pop 0.4s ease; }
@keyframes pop { from { background: var(--chip); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .work .new { animation: none; } .bar { transition: none; } }
/* What matters to you? */
.facts { display: flex; flex-direction: column; gap: 6px; }
.fact { display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 0 6px; text-align: left; font-weight: 700; font-size: 1rem; line-height: 1.25; padding: 7px 10px; border-radius: 10px; background: var(--sheet); border: 2px solid var(--grid-major); }
.fact .tick { font-size: 1.1rem; color: var(--muted); }
.fact.on { border-color: var(--green); }
.fact.on .tick { color: var(--green); }
.fact .why { grid-column: 2; font-weight: 400; color: var(--muted); font-size: 0.9rem; margin-top: 3px; }
.fact .to { font-weight: 700; color: var(--green); }
/* Practice. */
.story { margin: 0; font-size: 1.1rem; line-height: 1.4; }
.story ul { margin: 6px 0 0; padding-left: 1.2em; }
.arow { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.arow label { flex: 1 1 auto; font-weight: 700; }
.arow .mark { flex: none; width: 1.4em; text-align: center; }
.arow input { font-family: var(--font-num); font-weight: 700; font-size: 1.25rem; width: 6em; padding: 3px 6px; text-align: right; border: 2px solid var(--grid-major); border-radius: 8px; background: var(--sheet); color: var(--ink); }
.arow .mark { font-weight: 700; font-size: 1.2rem; }
.mark.ok { color: var(--green); } .mark.no { color: var(--warn); }
.ask { margin: 12px 0 6px; font-weight: 700; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { flex: 1 1 auto; min-height: 44px; background: var(--sheet); }
.pick button.on { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.fb { margin: 10px 0 0; min-height: 1.4em; line-height: 1.35; }
.fb.ok { color: var(--green); font-weight: 700; } .fb.no { color: var(--warn); }
.score { margin: 6px 0 0; color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Buy or Lease a Car</h1></div>
    <div class="seg-btns" role="group" aria-label="Mode" id="modes">
      <button type="button" data-mode="learn" class="on" aria-pressed="true">Learn</button><button type="button" data-mode="practice" aria-pressed="false">Practice</button>
    </div>
  </header>

  <div class="main">
    <div class="board">
      <p class="lead" id="lead"></p>
      <div class="cols">
        <section class="col" id="colBuy">
          <h2><span>Buy</span><span class="fits" id="fitsBuy"></span></h2>
          <div class="f"><label for="bDown" class="k-up">Down payment</label><span class="box"><span class="cur pre">$</span><input id="bDown" type="text" inputmode="numeric" autocomplete="off"><span class="cur post">$</span></span></div>
          <div class="f"><label for="bPay" class="k-pay">Monthly payment</label><span class="box"><span class="cur pre">$</span><input id="bPay" type="text" inputmode="numeric" autocomplete="off"><span class="cur post">$</span></span></div>
          <div class="f"><label for="bMonths">Months</label><span class="box"><input id="bMonths" type="text" inputmode="numeric" autocomplete="off"></span></div>
          <div class="f"><label for="bWorth" class="k-val">Car is worth at the end</label><span class="box"><span class="cur pre">$</span><input id="bWorth" type="text" inputmode="numeric" autocomplete="off"><span class="cur post">$</span></span></div>
          <div class="barbox" id="barBuy"></div>

        </section>
        <section class="col" id="colLease">
          <h2><span>Lease</span><span class="fits" id="fitsLease"></span></h2>
          <div class="f"><label for="lFees" class="k-up">Fees up front</label><span class="box"><span class="cur pre">$</span><input id="lFees" type="text" inputmode="numeric" autocomplete="off"><span class="cur post">$</span></span></div>
          <div class="f"><label for="lPay" class="k-pay">Monthly payment</label><span class="box"><span class="cur pre">$</span><input id="lPay" type="text" inputmode="numeric" autocomplete="off"><span class="cur post">$</span></span></div>
          <div class="f"><label for="lMonths">Months</label><span class="box"><input id="lMonths" type="text" inputmode="numeric" autocomplete="off"></span></div>
          <div class="f"></div>
          <div class="barbox" id="barLease"></div>
          <p class="keep" id="keepLease"></p>
        </section>
        <section class="col" id="colLtb">
          <h2><span>Lease then buy</span><span class="fits" id="fitsLtb"></span></h2>
          <div class="f"><span class="lab">The same lease</span><span class="same" id="sameLease"></span></div>
          <div class="f"><label for="lOut" class="k-out">Buyout price</label><span class="box"><span class="cur pre">$</span><input id="lOut" type="text" inputmode="numeric" autocomplete="off"><span class="cur post">$</span></span></div>
          <div class="f"></div>
          <div class="f"></div>
          <div class="barbox" id="barLtb"></div>
          <p class="keep" id="keepLtb"></p>
        </section>
      </div>
    </div>

    <div class="side">
      <div class="panel" id="learn">
        <div class="seg-btns wide" role="group" aria-label="Panel">
          <button type="button" id="tabMath" class="on" aria-pressed="true">The math</button><button type="button" id="tabFit" aria-pressed="false">What matters to you?</button>
        </div>
        <section class="card" id="mathCard">
          <p class="say" id="say"></p>
          <div class="work" id="work" aria-live="polite"></div>
          <p class="note">The monthly payments already include interest. Taxes are left out.</p>
        </section>
        <div class="btns" id="stepBtns">
          <button type="button" class="go" id="next">Next step</button>
          <button type="button" id="back">Back</button>
          <button type="button" id="all">Show all</button>
          <button type="button" id="restart">Start over</button>
        </div>
        <section class="card" id="fitCard" hidden>
          <p class="say">Tap what is true for you. Each one points to a choice.</p>
          <div class="facts" id="facts"></div>
        </section>
      </div>

      <div class="panel" id="practice" hidden>
        <section class="card">
          <div class="story" id="story"></div>
          <div class="arow"><label for="aBuy">Buy total</label><span class="cur pre">$</span><input id="aBuy" type="text" inputmode="numeric" autocomplete="off"><span class="cur post">$</span><span class="mark" id="mBuy"></span></div>
          <div class="arow"><label for="aLease">Lease total</label><span class="cur pre">$</span><input id="aLease" type="text" inputmode="numeric" autocomplete="off"><span class="cur post">$</span><span class="mark" id="mLease"></span></div>
          <div class="arow"><label for="aLtb">Lease then buy total</label><span class="cur pre">$</span><input id="aLtb" type="text" inputmode="numeric" autocomplete="off"><span class="cur post">$</span><span class="mark" id="mLtb"></span></div>
          <p class="ask" id="ask"></p>
          <div class="pick" role="group" aria-label="Best fit" id="pick">
            <button type="button" data-c="buy">Buy</button><button type="button" data-c="lease">Lease</button><button type="button" data-c="ltb">Lease then buy</button>
          </div>
          <p class="fb" id="fb" aria-live="polite"></p>
          <p class="score">Correct: <b id="right">0</b> of <b id="total">0</b></p>
        </section>
        <div class="btns">
          <button type="button" class="go" id="check">Check</button>
          <button type="button" id="showme">Show me</button>
          <button type="button" id="newq">New question</button>
        </div>
        <section class="card" id="pWorkCard" hidden>
          <div class="work" id="pWork"></div>
        </section>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const fr = () => !!(window.I18N && I18N.lang === "fr");
  const L = (en, f) => (fr() ? f : en);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rnd = (lo, hi, step) => lo + step * Math.floor(Math.random() * ((hi - lo) / step + 1));
  // Thousands get a space once there are 5 or more digits (31 200), as on the other pages.
  const grp = v => { const s = String(Math.round(v)); return s.length >= 5 ? s.replace(/\B(?=(\d{3})+$)/g, " ") : s; };
  const money = v => (fr() ? grp(v) + " $" : "$" + grp(v));
  const num = s => { const v = parseFloat(String(s).replace(/[\s$]/g, "").replace(/,(?=\d{3}\b)/g, "").replace(",", ".")); return isFinite(v) ? v : NaN; };
  const K = (k, s) => `<span class="k-${k}">${s}</span>`;

  // ---------- the model ----------
  function totals(v) {
    const bPays = v.bPay * v.bMonths, lPays = v.lPay * v.lMonths;
    const buy = v.bDown + bPays, lease = v.lFees + lPays, ltb = lease + v.lOut;
    return { bPays, lPays, buy, lease, ltb, net: buy - v.bWorth };
  }
  const NAMES = { buy: ["Buy", "Acheter"], lease: ["Lease", "Louer"], ltb: ["Lease then buy", "Louer puis acheter"] };
  const nm = c => L(NAMES[c][0], NAMES[c][1]);

  // What matters to you: each card favours one choice (outcome 2.3).
  const FACTS = [
    { id: "km", to: "buy", en: "I drive a lot (more than 20 000 km a year)", f: "Je conduis beaucoup (plus de 20 000 km par année)",
      p: ["drives a lot (about 30 000 km a year)", "conduit beaucoup (environ 30 000 km par année)"],
      why: ["A lease allows about 20 000 km a year. Each extra km costs about 10¢ to 20¢.", "Une location permet environ 20 000 km par année. Chaque km de plus coûte de 10 ¢ à 20 ¢."] },
    { id: "long", to: "buy", en: "I want to keep the car a long time", f: "Je veux garder l’auto longtemps",
      p: ["wants to keep the car for 10 years", "veut garder l’auto 10 ans"],
      why: ["Once the loan is paid, you drive with no payments.", "Une fois le prêt payé, tu conduis sans paiements."] },
    { id: "ins", to: "buy", en: "I want to pay less for insurance", f: "Je veux payer moins d’assurance",
      p: ["wants to pay less for insurance later on", "veut payer moins d’assurance plus tard"],
      why: ["A lease needs full coverage the whole time. A car you own and have paid off can have less.", "Une location exige une couverture complète tout le temps. Une auto payée peut en avoir moins."] },
    { id: "new", to: "lease", en: "I like a new car every few years", f: "J’aime avoir une auto neuve aux quelques années",
      p: ["likes a new car every 3 or 4 years", "aime avoir une auto neuve aux 3 ou 4 ans"],
      why: ["At the end of a lease you hand back the keys and lease a new one.", "À la fin de la location, tu rends les clés et tu en loues une neuve."] },
    { id: "low", to: "lease", en: "I need a low monthly payment", f: "J’ai besoin d’un petit paiement mensuel",
      p: ["needs a low monthly payment", "a besoin d’un petit paiement mensuel"],
      why: ["Lease payments are lower, since you pay only for the part of the car you use.", "Les paiements de location sont plus bas : tu paies seulement la partie de l’auto que tu utilises."] },
    { id: "fix", to: "lease", en: "I don’t want big repair bills", f: "Je ne veux pas de grosses factures de réparation",
      p: ["does not want big repair bills", "ne veut pas de grosses factures de réparation"],
      why: ["A lease usually ends before the warranty does, so most repairs are covered.", "Une location finit souvent avant la garantie, donc la plupart des réparations sont couvertes."] },
    { id: "try", to: "ltb", en: "I want to try the car first, then maybe keep it", f: "Je veux essayer l’auto d’abord, puis peut-être la garder",
      p: ["is not sure about this car and wants to try it first", "a des doutes sur cette auto et veut l’essayer d’abord"],
      why: ["You decide at the end of the lease. The buyout price is set in the contract.", "Tu décides à la fin de la location. Le prix de rachat est fixé dans le contrat."] },
  ];

  // ---------- state ----------
  let mode = "learn", tabFit = false, step = 0, lastStep = 0;
  const lv = { bDown: 3000, bPay: 520, bMonths: 60, bWorth: 13000, lFees: 2000, lPay: 390, lMonths: 48, lOut: 15000 };
  const on = new Set();
  let q = null, pr = { right: 0, total: 0, done: false, shown: false, okBuy: false, okLease: false, okLtb: false, chosen: null };
  const PEOPLE = ["Sam", "Maya", "Liam", "Priya", "Noah", "Aiyana", "Owen", "Sofia", "Ethan", "Amara", "Jonah", "Mei"];
  const STEPS = 6;
  const IDS = ["bDown", "bPay", "bMonths", "bWorth", "lFees", "lPay", "lMonths", "lOut"];

  function newQuestion() {
    const target = pick(["buy", "lease", "ltb"]);
    const pool = FACTS.filter(f => f.to === target);
    const facts = target === "ltb"
      ? [pool[0], { p: ["wants to own the car if it works out", "veut garder l’auto si tout va bien"], why: ["Lease then buy lets you own it in the end, after a trial.", "Louer puis acheter permet de l’avoir à la fin, après un essai."] }]
      : pool.slice().sort(() => Math.random() - 0.5).slice(0, 2);
    q = {
      name: pick(PEOPLE), target, facts,
      v: { bDown: rnd(1000, 5000, 500), bPay: rnd(400, 650, 10), bMonths: pick([48, 60, 72]), bWorth: rnd(8000, 16000, 1000),
           lFees: rnd(1000, 3000, 250), lPay: rnd(280, 450, 10), lMonths: pick([36, 48]), lOut: rnd(12000, 20000, 500) },
    };
    pr = Object.assign(pr, { done: false, shown: false, okBuy: false, okLease: false, okLtb: false, chosen: null });
    ["aBuy", "aLease", "aLtb"].forEach(id => { $(id).value = ""; });
    $("fb").textContent = ""; $("fb").className = "fb";
  }

  // ---------- drawing ----------
  function seg(cls, val, max, en, f) {
    const d = document.createElement("div");
    d.className = "seg " + cls;
    d.style.height = (val / max * 100) + "%";
    d.innerHTML = `<span>${L(en, f)}</span><b>${money(val)}</b>`;
    d.title = `${L(en, f)} ${money(val)}`;
    return d;
  }
  function drawBar(host, segs, total, max, shown) {
    host.replaceChildren();
    if (!shown) { const g = document.createElement("div"); g.className = "ghost"; g.textContent = "?"; host.appendChild(g); return; }
    const h = total / max * 82; // room on top for the total
    const bar = document.createElement("div");
    bar.className = "bar"; bar.style.height = h + "%";
    segs.forEach(([cls, v, en, f]) => { if (v > 0) bar.appendChild(seg(cls, v, total, en, f)); });
    const t = document.createElement("div");
    t.className = "tot"; t.style.bottom = `calc(${h}% + 4px)`; t.textContent = money(total);
    host.append(bar, t);
  }
  // A segment's words go if they do not fit, then its amount: the hover title keeps both.
  function fitSegs() {
    document.querySelectorAll(".seg").forEach(d => {
      if (d.scrollHeight <= d.clientHeight + 1) return;
      d.firstChild.remove();
      if (d.scrollHeight > d.clientHeight + 1) d.textContent = "";
    });
  }

  // The work, one step per line. Returns lines tagged with the step that shows them.
  function workLines(v, t) {
    const W = [];
    const line = (s, a, b, why) => W.push({ s, h: `<div>${a}</div><div class="eq">=</div><div>${b}</div><div class="why">${why || ""}</div>` });
    const gap = s => W.push({ s, h: '<div class="gap"></div>' });
    line(1, L("Buy payments", "Paiements (achat)"), `${K("pay", money(v.bPay))} × ${v.bMonths}`, L("monthly × months", "mensuel × mois"));
    line(1, "", K("pay", money(t.bPays)));
    line(2, L("Buy total", "Total (achat)"), `${K("up", money(v.bDown))} + ${K("pay", money(t.bPays))}`, L("down payment + payments", "mise de fonds + paiements"));
    line(2, "", `<b>${money(t.buy)}</b>`);
    gap(3);
    line(3, L("Lease payments", "Paiements (location)"), `${K("pay", money(v.lPay))} × ${v.lMonths}`, L("monthly × months", "mensuel × mois"));
    line(3, "", K("pay", money(t.lPays)));
    line(4, L("Lease total", "Total (location)"), `${K("up", money(v.lFees))} + ${K("pay", money(t.lPays))}`, L("fees + payments", "frais + paiements"));
    line(4, "", `<b>${money(t.lease)}</b>`);
    gap(5);
    line(5, L("Lease then buy", "Louer puis acheter"), `${money(t.lease)} + ${K("out", money(v.lOut))}`, L("lease total + buyout", "total location + rachat"));
    line(5, "", `<b>${money(t.ltb)}</b>`);
    gap(6);
    line(6, L("Buy, then sell", "Acheter, puis vendre"), `${money(t.buy)} − ${K("val", money(v.bWorth))}`, L("buy total − what the car is worth", "total achat − valeur de l’auto"));
    line(6, "", `<b>${money(t.net)}</b>`);
    return W;
  }

  function sayStep(v, t) {
    const lo = ["buy", "lease", "ltb"].reduce((a, c) => (t[c] < t[a] ? c : a), "buy");
    return [
      L("Three ways to get the same car. Press <b>Next step</b> to find what each one costs in total.",
        "Trois façons d’avoir la même auto. Appuie sur <b>Étape suivante</b> pour trouver le coût total de chacune."),
      L("<b>Buy.</b> Multiply the monthly payment by the number of months.", "<b>Acheter.</b> Multiplie le paiement mensuel par le nombre de mois."),
      L(`Add the down payment. Buying costs <b>${money(t.buy)}</b> in total.`, `Ajoute la mise de fonds. Acheter coûte <b>${money(t.buy)}</b> au total.`),
      L("<b>Lease.</b> Multiply the monthly payment by the number of months.", "<b>Louer.</b> Multiplie le paiement mensuel par le nombre de mois."),
      L(`Add the fees. Leasing costs <b>${money(t.lease)}</b>, but you give the car back.`, `Ajoute les frais. Louer coûte <b>${money(t.lease)}</b>, mais tu rends l’auto.`),
      L(`<b>Lease then buy.</b> The lease plus the buyout price: <b>${money(t.ltb)}</b>, and you own the car.`,
        `<b>Louer puis acheter.</b> La location plus le prix de rachat : <b>${money(t.ltb)}</b>, et l’auto est à toi.`),
      L(`The lowest total is <b>${nm(lo)}</b>. But buying leaves you a car worth <b class="k-val">${money(v.bWorth)}</b>. If you sell it, buying really costs <b>${money(t.net)}</b>.`,
        `Le plus petit total : <b>${nm(lo)}</b>. Mais acheter te laisse une auto qui vaut <b class="k-val">${money(v.bWorth)}</b>. Si tu la vends, acheter coûte vraiment <b>${money(t.net)}</b>.`),
    ][step];
  }

  function drawBoard(v, show, editable) {
    const t = totals(v);
    IDS.forEach(id => {
      const el = $(id);
      el.readOnly = !editable;
      if (document.activeElement !== el) el.value = v[id];
    });
    document.querySelectorAll(".cur.pre").forEach(e => { e.hidden = fr(); });
    document.querySelectorAll(".cur.post").forEach(e => { e.hidden = !fr(); });
    $("sameLease").textContent = show.lease ? money(t.lease) : L("from Lease", "voir Louer");
    const max = Math.max(t.buy, t.ltb, t.lease, 1);
    drawBar($("barBuy"), [["up", v.bDown, "Down", "Mise de fonds"], ["pay", t.bPays, "Payments", "Paiements"]], t.buy, max, show.buy);
    drawBar($("barLease"), [["up", v.lFees, "Fees", "Frais"], ["pay", t.lPays, "Payments", "Paiements"]], t.lease, max, show.lease);
    drawBar($("barLtb"), [["up", v.lFees, "Fees", "Frais"], ["pay", t.lPays, "Payments", "Paiements"], ["out", v.lOut, "Buyout", "Rachat"]], t.ltb, max, show.ltb);
    $("keepBuy").innerHTML = show.buy ? L(`You keep a car worth <b class="k-val">${money(v.bWorth)}</b>`, `Tu gardes une auto qui vaut <b class="k-val">${money(v.bWorth)}</b>`) : "";
    $("keepLease").innerHTML = show.lease ? L("You give the car back", "Tu rends l’auto") : "";
    $("keepLtb").innerHTML = show.ltb ? L("You own the car", "L’auto est à toi") : "";
    return t;
  }

  function render() {
    const learn = mode === "learn";
    $("learn").hidden = !learn; $("practice").hidden = learn;
    document.querySelectorAll("#modes button").forEach(b => { const o = b.dataset.mode === mode; b.classList.toggle("on", o); b.setAttribute("aria-pressed", String(o)); });
    if (learn) renderLearn(); else renderPractice();
    requestAnimationFrame(fitSegs);
  }

  function renderLearn() {
    const v = lv;
    const t = drawBoard(v, { buy: step >= 2, lease: step >= 4, ltb: step >= 5 }, true);
    $("lead").innerHTML = L("The same car, three ways to get it. Change any number.", "La même auto, trois façons de l’avoir. Change n’importe quel nombre.");
    $("say").innerHTML = sayStep(v, t);
    $("work").innerHTML = workLines(v, t).filter(w => w.s <= step)
      .map(w => (w.s === step && step > lastStep ? w.h.replace(/<div( class="[^"]*")?>/g, (m, c) => `<div class="${c ? c.slice(8, -1) + " " : ""}new">`) : w.h)).join("");
    lastStep = step;
    $("next").disabled = step >= STEPS; $("back").disabled = step <= 0;
    $("mathCard").hidden = tabFit; $("stepBtns").hidden = tabFit; $("fitCard").hidden = !tabFit;
    $("tabMath").classList.toggle("on", !tabFit); $("tabFit").classList.toggle("on", tabFit);
    $("tabMath").setAttribute("aria-pressed", String(!tabFit)); $("tabFit").setAttribute("aria-pressed", String(tabFit));
    // Fit cards: how many of the tapped cards point to each choice.
    $("facts").innerHTML = FACTS.map(f => `<button type="button" class="fact${on.has(f.id) ? " on" : ""}" data-id="${f.id}" aria-pressed="${on.has(f.id)}"><span class="tick">${on.has(f.id) ? "✓" : "○"}</span><span>${L(f.en, f.f)}</span>${on.has(f.id) ? `<span class="why"><span class="to">→ ${nm(f.to)}.</span> ${L(f.why[0], f.why[1])}</span>` : ""}</button>`).join("");
    const n = { buy: 0, lease: 0, ltb: 0 };
    FACTS.forEach(f => { if (on.has(f.id)) n[f.to]++; });
    const top = Math.max(n.buy, n.lease, n.ltb);
    [["buy", "Buy"], ["lease", "Lease"], ["ltb", "Ltb"]].forEach(([c, k]) => {
      $("fits" + k).textContent = n[c] ? L(`✓ ${n[c]} fit${n[c] === 1 ? "s" : ""} you`, `✓ ${n[c]} pour toi`) : "";
      $("col" + k).classList.toggle("best", top > 0 && n[c] === top);
    });
  }

  function renderPractice() {
    if (!q) newQuestion();
    const v = q.v, all = pr.shown;
    const t = drawBoard(v, { buy: all || pr.okBuy, lease: all || pr.okLease, ltb: all || pr.okLtb }, false);
    ["Buy", "Lease", "Ltb"].forEach(k => { $("fits" + k).textContent = ""; $("col" + k).classList.toggle("best", (pr.done || all) && q.target === k.toLowerCase()); });
    $("lead").innerHTML = L(`${q.name}’s three offers for the same car. Find each total cost.`, `Les trois offres de ${q.name} pour la même auto. Trouve chaque coût total.`);
    $("story").innerHTML = L(`<b>${q.name}</b> needs a car.`, `<b>${q.name}</b> a besoin d’une auto.`) +
      `<ul>${q.facts.map(f => `<li>${q.name} ${L(f.p[0], f.p[1])}.</li>`).join("")}</ul>`;
    $("ask").textContent = L(`Which choice fits ${q.name} best?`, `Quel choix convient le mieux à ${q.name}?`);
    document.querySelectorAll("#pick button").forEach(b => { b.classList.toggle("on", b.dataset.c === pr.chosen); b.textContent = nm(b.dataset.c); });
    $("mBuy").textContent = pr.okBuy ? "✓" : ""; $("mLease").textContent = pr.okLease ? "✓" : ""; $("mLtb").textContent = pr.okLtb ? "✓" : "";
    ["mBuy", "mLease", "mLtb"].forEach(id => { $(id).className = "mark ok"; });
    $("pWorkCard").hidden = !all;
    if (all) $("pWork").innerHTML = workLines(v, t).map(w => w.h).join("");
    $("right").textContent = pr.right; $("total").textContent = pr.total;
  }

  // Practice: check the three totals and the choice.
  function check() {
    if (pr.done || pr.shown) return;
    const v = q.v, t = totals(v), fb = $("fb");
    const msgs = [];
    const box = (id, mark, want, okKey, hints) => {
      const a = num($(id).value);
      if (!isFinite(a)) { msgs.push(L("Fill in all three totals.", "Remplis les trois totaux.")); return false; }
      const ok = Math.abs(a - want) < 0.5;
      pr[okKey] = ok;
      if (!ok) { $(mark).textContent = "✗"; $(mark).className = "mark no"; const h = hints.find(([bad]) => Math.abs(a - bad) < 0.5); msgs.push(h ? h[1] : L(`Check the ${nm(okKey === "okBuy" ? "buy" : okKey === "okLease" ? "lease" : "ltb").toLowerCase()} total.`, `Vérifie le total pour « ${nm(okKey === "okBuy" ? "buy" : okKey === "okLease" ? "lease" : "ltb")} ».`)); }
      return ok;
    };
    const a = box("aBuy", "mBuy", t.buy, "okBuy", [[t.bPays, L("Buy: add the down payment too.", "Acheter : ajoute aussi la mise de fonds.")], [t.net, L("Buy: the total is what you pay. Don’t subtract the car’s value.", "Acheter : le total est ce que tu paies. Ne soustrais pas la valeur de l’auto.")]]);
    const b = box("aLease", "mLease", t.lease, "okLease", [[t.lPays, L("Lease: add the fees too.", "Louer : ajoute aussi les frais.")]]);
    const c = box("aLtb", "mLtb", t.ltb, "okLtb", [[v.lOut, L("Lease then buy: add the whole lease total to the buyout.", "Louer puis acheter : ajoute tout le total de la location au rachat.")], [t.lPays + v.lOut, L("Lease then buy: include the fees.", "Louer puis acheter : inclus les frais.")]]);
    if (!pr.chosen) msgs.push(L(`Pick the choice that fits ${q.name} best.`, `Choisis ce qui convient le mieux à ${q.name}.`));
    const d = pr.chosen === q.target;
    if (pr.chosen && !d) msgs.push(L(`Not the best fit. Look again at what matters to ${q.name}.`, `Pas le meilleur choix. Relis ce qui compte pour ${q.name}.`));
    if (a && b && c && d) {
      pr.done = true; pr.right++; pr.total++;
      fb.className = "fb ok";
      fb.textContent = L(`Correct! ${whyFit()}`, `Bravo! ${whyFit()}`);
    } else {
      fb.className = "fb no";
      fb.textContent = [...new Set(msgs)].join(" ");
    }
    render();
    // render() resets the marks; put the ✗ back where an answer is wrong.
    [["aBuy", "mBuy", "okBuy"], ["aLease", "mLease", "okLease"], ["aLtb", "mLtb", "okLtb"]].forEach(([i, m, k]) => { if (!pr[k] && $(i).value.trim()) { $(m).textContent = "✗"; $(m).className = "mark no"; } });
  }
  function whyFit() { return q.facts.map(f => L(f.why[0], f.why[1])).join(" "); }
  function showMe() {
    if (pr.shown) return;
    if (!pr.done) pr.total++;
    pr.shown = true;
    const t = totals(q.v);
    $("aBuy").value = grp(t.buy); $("aLease").value = grp(t.lease); $("aLtb").value = grp(t.ltb);
    pr.chosen = q.target; pr.okBuy = pr.okLease = pr.okLtb = true;
    $("fb").className = "fb";
    $("fb").textContent = L(`${nm(q.target)} fits ${q.name} best. ${whyFit()}`, `« ${nm(q.target)} » convient le mieux à ${q.name}. ${whyFit()}`);
    render();
  }

  // ---------- events ----------
  IDS.forEach(id => {
    const el = $(id);
    el.addEventListener("input", () => { if (mode !== "learn") return; const v = num(el.value); if (isFinite(v) && v >= 0) { lv[id] = Math.min(Math.round(v), id.endsWith("Months") ? 120 : 1000000); render(); } });
    el.addEventListener("blur", render);
    el.addEventListener("keydown", e => { if (e.key === "Enter") el.blur(); });
  });
  $("next").addEventListener("click", () => { step = Math.min(STEPS, step + 1); render(); });
  $("back").addEventListener("click", () => { step = Math.max(0, step - 1); render(); });
  $("all").addEventListener("click", () => { step = STEPS; render(); });
  $("restart").addEventListener("click", () => { step = 0; lastStep = 0; render(); });
  $("tabMath").addEventListener("click", () => { tabFit = false; render(); });
  $("tabFit").addEventListener("click", () => { tabFit = true; render(); });
  $("facts").addEventListener("click", e => { const b = e.target.closest(".fact"); if (!b) return; const id = b.dataset.id; on.has(id) ? on.delete(id) : on.add(id); render(); });
  document.querySelectorAll("#modes button").forEach(b => b.addEventListener("click", () => { mode = b.dataset.mode; render(); }));
  document.querySelectorAll("#pick button").forEach(b => b.addEventListener("click", () => { if (pr.done || pr.shown) return; pr.chosen = b.dataset.c; render(); }));
  ["aBuy", "aLease", "aLtb"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") check(); }));
  $("check").addEventListener("click", check);
  $("showme").addEventListener("click", showMe);
  $("newq").addEventListener("click", () => { newQuestion(); render(); });
  document.addEventListener("keydown", e => {
    if (mode !== "learn" || tabFit || e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "ArrowLeft") $("back").click();
  });
  window.addEventListener("resize", render);
  window.addEventListener("langchange", render);
  render();
})();
</script>

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
