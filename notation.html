<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Geometry Notation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Geometry Notation Workbench (grade 7): segments, rays, lines, angles, triangles, polygons, ∥ and ⊥.
   Learn: one picture holds every object; tapping a definition card lights up its object.
   Name it: read a picture, write the notation (Level 1 buttons; Levels 2 and 3 mix buttons and typing).
   Build it: read a notation, draw it on a snap-to grid. Sandbox: draw anything, see its names.
   Rules kept everywhere: a ray's endpoint comes first, shared vertices need 3-letter angle names,
   and lines are only parallel or perpendicular when they carry the marks (looks are not proof). */
.main { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.board { padding: 6px; gap: 6px; }
.tabs button, .lv button { min-height: 50px; padding: 6px 14px; font-size: 1.05rem; white-space: nowrap; }
header { flex-wrap: nowrap; }
header h1 { font-size: clamp(1.4rem, 2.3vw, 2.3rem); }
@media (max-width: 860px) { header { flex-wrap: wrap; } }
.seg { display: inline-flex; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--sheet); }
.seg button + button { border-left: 2px solid var(--grid-major); }
.seg button[aria-pressed="true"] { background: var(--pt); color: var(--sheet); }
/* Notation: letters with a bar, ray arrow or line arrow drawn over them. */
.nt { font-family: var(--font-body), "Cambria Math", "STIX Two Math", serif; font-weight: 800; display: inline-flex; flex-wrap: wrap; align-items: last baseline; gap: 0 0.14em; line-height: 1.05; }
.sym { font-family: "Cambria Math", "STIX Two Math", "Segoe UI Symbol", serif; font-weight: 700; }
.ov { display: inline-flex; flex-direction: column; align-items: stretch; line-height: 1; }
.ov .mk { position: relative; height: 0.34em; margin: 0 0.03em 0.05em; }
.ov .mk::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 0.075em; background: currentColor; transform: translateY(-50%); border-radius: 1px; }
.ov .mk i { position: absolute; top: 50%; width: 0.2em; height: 0.2em; border: solid currentColor; border-width: 0.075em 0.075em 0 0; }
.ov .mk .hr { right: 0.01em; transform: translateY(-50%) rotate(45deg); }
.ov .mk .hl { left: 0.01em; transform: translateY(-50%) rotate(-135deg); }
.ov.ray .hl, .ov.sg i { display: none; }
.box { display: inline-block; width: 0.75em; height: 0.85em; border: 0.07em dashed currentColor; border-radius: 0.08em; opacity: 0.7; }
.cant { font-family: var(--font-display); font-weight: 800; }
.panel { gap: 10px; }
.card { padding: 12px 14px; }
.card.read { display: flex; flex-direction: column; gap: 8px; }
.kind { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0; }
.big { font-size: 3rem; color: var(--orange); display: flex; flex-wrap: wrap; align-items: last baseline; gap: 4px 22px; min-height: 1.3em; }
.big .eqs { color: var(--ink); font-weight: 700; }
.big .eqs.w { font-size: 1.4rem; color: var(--muted); }
.big .bad { color: var(--warn); }
.gap { display: inline-block; width: 0.6em; border-bottom: 0.08em solid var(--muted); margin: 0 0.05em; }
.words { margin: 0; font-size: 1.35rem; line-height: 1.4; }
.defs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.defs button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 8px 12px; background: var(--sheet); border: 2px solid var(--grid-major); min-height: 0; }
.defs button .nt { font-size: 1.9rem; color: var(--ink); }
.defs button b { font-size: 1.05rem; }
.defs button small { font-size: 0.9rem; font-weight: 400; color: var(--muted); line-height: 1.25; }
.defs button[aria-pressed="true"] { border-color: var(--orange); background: color-mix(in srgb, var(--orange) 10%, var(--sheet)); }
.defs button[aria-pressed="true"] .nt { color: var(--orange); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row button { min-height: 48px; padding: 6px 14px; font-size: 1.1rem; background: var(--sheet); border: 2px solid var(--grid-major); }
.row button.go { background: var(--orange); border-color: var(--orange); color: #fff; }
.row button:disabled { opacity: 0.45; cursor: default; }
.count { color: var(--muted); font-weight: 700; font-size: 1.1rem; }
.lvrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px; }
.lvdesc { margin: 0; color: var(--muted); font-size: 1.05rem; }
.q { margin: 0; font-size: 1.35rem; font-weight: 700; line-height: 1.35; }
.spot { margin: 0; font-size: 1.15rem; line-height: 1.4; padding: 8px 12px; border-left: 5px solid var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--sheet)); border-radius: 6px; }
.spot .nt { font-size: 1.3em; color: var(--warn); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opts button { font-size: 2.2rem; min-height: 76px; background: var(--sheet); border: 2px solid var(--grid-major); display: flex; align-items: center; justify-content: center; }
.opts button .cant { font-size: 1.5rem; }
.opts button.right { border: 3px solid var(--green); color: var(--green); background: color-mix(in srgb, var(--green) 12%, var(--sheet)); }
.opts button.wrong { border: 3px solid var(--warn); color: var(--warn); opacity: 0.7; }
.typed { font-size: 2.3rem; min-height: 1.7em; display: flex; align-items: center; gap: 0.15em; padding: 4px 14px; border: 3px solid var(--pt); border-radius: 12px; background: var(--sheet); }
.typed .ph { font-size: 1.1rem; color: var(--muted); font-weight: 400; }
.typed .cant { font-size: 1.6rem; }
.caret { width: 3px; height: 1.1em; background: var(--pt); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.keys { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.keys button { min-height: 46px; font-size: 1.7rem; padding: 2px; background: var(--sheet); border: 2px solid var(--grid-major); display: flex; align-items: center; justify-content: center; }
.keys button.small { font-size: 1.05rem; }
.keys button.letter { font-size: 1.6rem; font-weight: 800; background: var(--chip); }
.keys button.cantk { grid-column: span 2; font-size: 0.95rem; line-height: 1.1; border-color: var(--muted); }
.fb { margin: 0; font-size: 1.3rem; line-height: 1.4; min-height: 1.4em; }
.fb.good { color: var(--green); font-weight: 700; }
.fb.bad { color: var(--warn); font-weight: 700; }
.fb .nt { font-size: 1.25em; }
.score { margin: 0; color: var(--muted); font-size: 1.05rem; }
.draw { margin: 0; font-size: 1.2rem; font-weight: 700; color: var(--muted); }
.target { font-size: 2.8rem; color: var(--orange); display: flex; flex-wrap: wrap; gap: 6px 28px; align-items: last baseline; }
/* Drawing toolbar (Build it, Sandbox) */
.tools { display: flex; gap: 5px; }
.tools button { display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 0; flex: 1 1 0; padding: 4px 2px 3px; font-size: 0.82rem; line-height: 1.1; background: var(--sheet); border: 2px solid var(--grid-major); white-space: nowrap; }
.tools button svg { width: 34px; height: 24px; }
.tools button svg * { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.tools button svg .f { fill: currentColor; stroke: none; }
.tools button[aria-pressed="true"] { border-color: var(--orange); color: var(--orange); background: color-mix(in srgb, var(--orange) 12%, var(--sheet)); }
.tools .sep { width: 6px; flex: none; }
.status { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--muted); min-height: 1.5em; text-align: center; }
.status.bad { color: var(--warn); }
.seen { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.seen li { display: flex; align-items: baseline; gap: 12px; font-size: 1.15rem; }
.seen li .k { color: var(--muted); font-weight: 700; min-width: 7.5em; }
.seen li .nt { font-size: 1.7rem; }
.seen li.note { color: var(--warn); font-weight: 700; font-size: 1.05rem; display: block; }
.seen li.note .nt { font-size: 1.3rem; }
.empty { margin: 0; color: var(--muted); font-size: 1.15rem; }
/* Board drawing */
.gl { stroke: var(--grid); stroke-width: 1.5; }
.obj { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; fill: none; }
.objf { fill: var(--ink); }
.poly { stroke: var(--ink); stroke-width: 4; fill: none; stroke-linejoin: round; }
.hi .obj, .poly.hi { stroke: var(--orange); stroke-width: 7; }
.hi .objf { fill: var(--orange); }
.poly.hi { fill: color-mix(in srgb, var(--orange) 14%, transparent); }
.hi2 .obj { stroke: var(--pt); stroke-width: 6; }
.poly.hi { stroke: var(--orange); stroke-width: 7; }
.hi2 .objf { fill: var(--pt); }
.faint .obj, .poly.faint { stroke: var(--grid-major); }
.faint .objf { fill: var(--grid-major); }
.sel .obj { stroke: var(--orange); stroke-width: 7; stroke-dasharray: 14 9; }
.badpath { stroke: var(--warn); stroke-width: 5; fill: none; stroke-dasharray: 12 9; stroke-linejoin: round; }
.pendpath { stroke: var(--orange); stroke-width: 4; fill: none; stroke-dasharray: 10 8; }
.arc { stroke: var(--orange); stroke-width: 4; fill: color-mix(in srgb, var(--orange) 22%, transparent); }
.arc.ink { stroke: var(--ink); stroke-width: 3; fill: none; }
.arc.blue { stroke: var(--pt); fill: color-mix(in srgb, var(--pt) 20%, transparent); }
.arc.green { stroke: var(--green); fill: none; stroke-dasharray: 8 6; }
.mark { stroke: var(--ink); stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.mark.new { stroke: var(--green); stroke-width: 4.5; }
.dot { fill: var(--pt); stroke: var(--sheet); stroke-width: 3; }
.dot.hi, .dot.pend { fill: var(--orange); }
.ring { fill: none; stroke: var(--orange); stroke-width: 3; }
.ptname { font-family: var(--font-body); font-weight: 800; font-size: 32px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--sheet); stroke-width: 7px; stroke-linejoin: round; pointer-events: none; }
.lcname { font-family: var(--font-display); font-weight: 800; font-style: italic; font-size: 32px; fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
.lcname.hi { fill: var(--orange); }
.ptname.hi { fill: var(--orange); font-size: 40px; }
.dim { stroke: var(--green); stroke-width: 3; fill: none; }
.dimt { font-family: var(--font-num); font-weight: 700; font-size: 30px; fill: var(--green); text-anchor: middle; paint-order: stroke; stroke: var(--sheet); stroke-width: 6px; }
.ghost { fill: var(--orange); opacity: 0.5; pointer-events: none; }
svg.draw-on { cursor: crosshair; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } .big, .target { font-size: 2.3rem; } .opts button { font-size: 1.8rem; } .tools { flex-wrap: wrap; } .tools button { flex: 1 1 18%; } }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Geometry Notation</h1></div>
    <div class="seg tabs" role="group" aria-label="Mode">
      <button type="button" data-tab="learn" aria-pressed="true">Learn</button>
      <button type="button" data-tab="name" aria-pressed="false">Name it</button>
      <button type="button" data-tab="build" aria-pressed="false">Build it</button>
      <button type="button" data-tab="sand" aria-pressed="false">Sandbox</button>
    </div>
  </header>

  <div class="main">
    <div class="board">
      <div class="tools" id="tools" hidden></div>
      <svg id="svg" viewBox="0 0 988 640" role="img" aria-label="Geometry picture"></svg>
      <p class="status" id="status" hidden></p>
    </div>

    <div class="panel">
      <section class="card lvrow" id="levelBox" hidden>
        <div class="seg lv" role="group" aria-label="Level">
          <button type="button" data-lv="1" aria-pressed="true">Level 1</button>
          <button type="button" data-lv="2" aria-pressed="false">Level 2</button>
          <button type="button" data-lv="3" aria-pressed="false">Level 3</button>
        </div>
        <p class="lvdesc" id="lvdesc"></p>
      </section>

      <div class="panel" id="pLearn">
        <p class="draw">Tap a symbol to find it in the picture.</p>
        <section class="defs" id="defs"></section>
      </div>

      <div class="panel" id="pName" hidden>
        <section class="card read" aria-live="polite">
          <p class="q" id="nQ"></p>
          <p class="spot" id="nSpot" hidden></p>
          <div id="nAns"></div>
        </section>
        <div class="row">
          <button type="button" class="go" id="nCheck">Check</button>
          <button type="button" id="nHint">Hint</button>
          <button type="button" id="nShow">Show me</button>
          <button type="button" id="nNew">New question</button>
        </div>
        <p class="fb" id="nFb" aria-live="polite"></p>
        <p class="score" id="nScore"></p>
      </div>

      <div class="panel" id="pBuild" hidden>
        <section class="card read">
          <p class="draw">Draw this:</p>
          <div class="target" id="bTarget"></div>
        </section>
        <div class="row">
          <button type="button" class="go" id="bCheck">Check</button>
          <button type="button" id="bHint">Hint</button>
          <button type="button" id="bShow">Show me</button>
          <button type="button" id="bNew">New task</button>
        </div>
        <p class="fb" id="bFb" aria-live="polite"></p>
        <p class="score" id="bScore"></p>
      </div>

      <div class="panel" id="pSand" hidden>
        <section class="card read">
          <p class="kind">What I see</p>
          <ul class="seen" id="seen"></ul>
          <p class="empty" id="seenEmpty">Draw something. Its name shows up here.</p>
        </section>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("svg");

  // ---------- Grid: 16 by 10 squares, points snap to the corners ----------
  const W = 16, H = 10, S = 58, M = 30, VW = 2 * M + W * S, VH = 2 * M + H * S;
  const px = p => [M + p[0] * S, M + p[1] * S];

  const rnd = n => Math.floor(Math.random() * n);
  const pick = a => a[rnd(a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const LETTERS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const letters = n => shuffle([...LETTERS]).slice(0, n);
  const NAMES = ["Jasmine", "Sam", "Priya", "Leo", "Ava", "Noah", "Mia", "Kai", "Omar", "Lily"];

  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const mul = (a, k) => [a[0] * k, a[1] * k];
  const cross = (a, b) => a[0] * b[1] - a[1] * b[0];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const unit = v => { const d = Math.hypot(v[0], v[1]) || 1; return [v[0] / d, v[1] / d]; };
  const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
  const dkey = v => { const g = gcd(Math.abs(v[0]), Math.abs(v[1])) || 1; return v[0] / g + "," + v[1] / g; };
  const col = (a, b, c) => cross(sub(b, a), sub(c, a)) === 0;
  const setEq = (a, b) => a.length === b.length && a.every(x => b.includes(x));
  const inGrid = p => p[0] >= 0 && p[0] <= W && p[1] >= 0 && p[1] <= H;
  const inner = p => p[0] >= 2 && p[0] <= W - 2 && p[1] >= 1 && p[1] <= H - 1;

  // ---------- Notation as HTML ----------
  const ov = (s, k) => `<span class="ov ${k}"><span class="mk"><i class="hl"></i><i class="hr"></i></span><span>${s}</span></span>`;
  const sym = s => `<span class="sym">${s}</span>`;
  const nt = (...p) => `<span class="nt">${p.join("")}</span>`;
  const MK = { seg: "sg", ray: "ray", line: "line" };
  const RSYM = { par: "∥", perp: "⊥", cong: "≅" };
  const SYMR = { "∥": "par", "⊥": "perp", "≅": "cong" };
  function pieces(s) {
    switch (s.t) {
      case "seg": case "ray": case "line": return ov(s.p.join(""), MK[s.t]);
      case "len": case "plain": case "poly": return s.p.join("");
      case "angle": return sym("∠") + s.p.join("");
      case "angle1": return sym("∠") + s.p[0];
      case "tri": return sym("△") + s.p.join("");
      case "rel": return pieces(s.a) + sym(RSYM[s.r]) + pieces(s.b);
      case "cant": return `<span class="cant">Can’t tell</span>`;
    }
    return "";
  }
  const fmt = s => nt(pieces(s));
  const sh = (t, ...p) => ({ t, p });
  const rel = (r, a, b) => ({ t: "rel", r, a, b });
  const SEG = (a, b) => sh("seg", a, b), RAY = (a, b) => sh("ray", a, b), LINE = (a, b) => sh("line", a, b);
  const LIN = { seg: 1, ray: 1, line: 1 };

  // ---------- Geometry of written names ----------
  // Two names are the same object when they pick out the same thing in the picture:
  // segment AB = BA, ray AB = ray AC when C is past B, line AB = line AC on one line, ∠ABC = ∠CBA, polygons in order.
  function cyc(a, b) {
    const n = a.length;
    if (b.length !== n) return false;
    for (let r = 0; r < n; r++) for (const d of [1, -1]) if (a.every((x, i) => x === b[(r + d * i + 2 * n) % n])) return true;
    return false;
  }
  const carrierEq = (x, y, P) => col(P[x.p[0]], P[x.p[1]], P[y.p[0]]) && col(P[x.p[0]], P[x.p[1]], P[y.p[1]]);
  function same(a, b, P) {
    if (!a || !b) return false;
    const q = n => P[n];
    if (a.t === "tri" || a.t === "poly") return (b.t === "tri" || b.t === "poly") && cyc(a.p, b.p);
    // Grade 7 (Alberta): a segment may be written with a bar or as plain letters, AB.
    if (a.t === "len") a = SEG(...a.p); if (b.t === "len") b = SEG(...b.p);
    if (a.t !== b.t) return false;
    switch (a.t) {
      case "seg": return setEq(a.p, b.p);
      case "ray": return a.p[0] === b.p[0] && col(q(a.p[0]), q(a.p[1]), q(b.p[1])) && dot(sub(q(a.p[1]), q(a.p[0])), sub(q(b.p[1]), q(b.p[0]))) > 0;
      case "line": return carrierEq(a, b, P);
      case "angle": {
        if (a.p[1] !== b.p[1]) return false;
        const v = q(a.p[1]), arms = s => [dkey(sub(q(s.p[0]), v)), dkey(sub(q(s.p[2]), v))].sort().join("|");
        return arms(a) === arms(b);
      }
      case "rel": {
        const m = a.r === "cong" ? (x, y) => setEq(x.p, y.p) : (x, y) => carrierEq(x, y, P);
        return a.r === b.r && ((m(a.a, b.a) && m(a.b, b.b)) || (m(a.a, b.b) && m(a.b, b.a)));
      }
      case "cant": return true;
    }
    return false;
  }

  // Directions of the arms leaving point v (for 1-letter angle names and for placing letters).
  function armsAt(fig, v) {
    const P = fig.pts, pv = P[v], set = new Map();
    const put = w => set.set(dkey(w), w);
    for (const o of fig.objs) {
      const q = o.p.map(n => P[n]);
      if (LIN[o.t]) {
        const [a, b] = q, d = sub(b, a);
        if (!col(a, b, pv)) continue;
        const t = dot(sub(pv, a), d) / dot(d, d);
        const lo = o.t === "line" ? -Infinity : 0, hi = o.t === "seg" ? 1 : Infinity;
        if (t < lo - 1e-9 || t > hi + 1e-9) continue;
        if (t > lo + 1e-9) put([-d[0], -d[1]]);
        if (t < hi - 1e-9) put(d);
      } else if (o.t === "poly") {
        const n = o.p.length, i = o.p.indexOf(v);
        if (i >= 0) { put(sub(q[(i + 1) % n], pv)); put(sub(q[(i + n - 1) % n], pv)); }
      } else if (o.t === "angle" && o.p[1] === v) { put(sub(q[0], pv)); put(sub(q[2], pv)); }
    }
    return [...set.values()];
  }

  // ---------- Drawing ----------
  function el(tag, attrs, parent = svg) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }
  // How far a line can run from p in direction d before it leaves the board.
  function clipT(p, d) {
    const x0 = 10, x1 = VW - 10, y0 = 10, y1 = VH - 10;
    let t = Infinity;
    if (d[0] > 1e-9) t = Math.min(t, (x1 - p[0]) / d[0]); if (d[0] < -1e-9) t = Math.min(t, (x0 - p[0]) / d[0]);
    if (d[1] > 1e-9) t = Math.min(t, (y1 - p[1]) / d[1]); if (d[1] < -1e-9) t = Math.min(t, (y0 - p[1]) / d[1]);
    return t;
  }
  function extent(o, P) {
    const a = px(P[o.p[0]]), b = px(P[o.p[1]]), d = unit(sub(b, a));
    if (o.t === "seg") return [a, b, false, false];
    // o.ext: stop the arrows a short way past the named points (the Learn picture), instead of at the board's edge.
    const fwd = o.ext ? Math.hypot(...sub(b, a)) + o.ext : clipT(a, d), back = o.ext ? o.ext : clipT(a, mul(d, -1));
    if (o.t === "ray") return [a, add(a, mul(d, fwd)), false, true];
    return [add(a, mul(d, -back)), add(a, mul(d, fwd)), true, true];
  }
  function head(g, tip, d) {
    const L = 24, w = 11, b = sub(tip, mul(d, L));
    el("polygon", { class: "objf", points: `${tip[0]},${tip[1]} ${b[0] - d[1] * w},${b[1] + d[0] * w} ${b[0] + d[1] * w},${b[1] - d[0] * w}` }, g);
  }
  function drawLinear(o, P, cls = "", off = 0) {
    const g = el("g", { class: cls });
    let [s, e, hs, he] = extent(o, P);
    const d = unit(sub(e, s));
    if (off) { const n = [-d[1] * off, d[0] * off]; s = add(s, n); e = add(e, n); }
    const s2 = hs ? add(s, mul(d, 16)) : s, e2 = he ? sub(e, mul(d, 16)) : e;
    el("line", { class: "obj", x1: s2[0], y1: s2[1], x2: e2[0], y2: e2[1] }, g);
    if (hs) head(g, s, mul(d, -1));
    if (he) head(g, e, d);
  }
  function arc(a, v, b, P, cls = "", r = 46) {
    const V = px(P[v]), ua = unit(sub(px(P[a]), V)), ub = unit(sub(px(P[b]), V));
    const sw = cross(ua, ub) > 0 ? 1 : 0, A = add(V, mul(ua, r)), B = add(V, mul(ub, r));
    el("path", { class: "arc " + cls, d: `M${V[0]},${V[1]} L${A[0]},${A[1]} A${r},${r} 0 0 ${sw} ${B[0]},${B[1]} Z` });
  }
  function meet(o1, o2, P) {
    const a = px(P[o1.p[0]]), b = px(P[o1.p[1]]), c = px(P[o2.p[0]]), d = px(P[o2.p[1]]);
    const r = sub(b, a), s = sub(d, c), den = cross(r, s);
    if (Math.abs(den) < 1e-9) return null;
    const t = cross(sub(c, a), s) / den, u = cross(sub(c, a), r) / den;
    return { p: add(a, mul(r, t)), t, u };
  }
  const onObj = (o, t) => (o.t === "line" || t >= -1e-6) && (o.t !== "seg" || t <= 1 + 1e-6);
  function drawMarks(fig) {
    const P = fig.pts;
    for (const m of fig.marks || []) {
      const cls = "mark" + (m.fresh ? " new" : "");
      if (m.t === "par") {
        m.o.forEach(i => {
          const o = fig.objs[i], a = px(P[o.p[0]]), b = px(P[o.p[1]]);
          let d = unit(sub(b, a)); if (d[0] < -1e-9 || (Math.abs(d[0]) < 1e-9 && d[1] < 0)) d = mul(d, -1);
          const n = [-d[1], d[0]], c0 = mul(add(a, b), 0.5);
          for (let k = 0; k < m.n; k++) {
            const c = add(c0, mul(d, k * 14 - (m.n - 1) * 7 + 8));
            const p1 = add(sub(c, mul(d, 14)), mul(n, 12)), p2 = sub(sub(c, mul(d, 14)), mul(n, 12));
            el("path", { class: cls, d: `M${p1[0]},${p1[1]} L${c[0]},${c[1]} L${p2[0]},${p2[1]}` });
          }
        });
      } else if (m.t === "perp") {
        const o1 = fig.objs[m.o[0]], o2 = fig.objs[m.o[1]], I = meet(o1, o2, P);
        if (!I) continue;
        const far = o => { const a = px(P[o.p[0]]), b = px(P[o.p[1]]); return Math.hypot(...sub(a, I.p)) > Math.hypot(...sub(b, I.p)) ? a : b; };
        const u = unit(sub(far(o1), I.p)), w = unit(sub(far(o2), I.p)), s = 22;
        const A = add(I.p, mul(u, s)), B = add(A, mul(w, s)), C = add(I.p, mul(w, s));
        el("path", { class: cls, d: `M${A[0]},${A[1]} L${B[0]},${B[1]} L${C[0]},${C[1]}` });
      } else if (m.t === "tick") {
        m.o.forEach(i => {
          const o = fig.objs[i], a = px(P[o.p[0]]), b = px(P[o.p[1]]), d = unit(sub(b, a)), n = [-d[1], d[0]], c0 = mul(add(a, b), 0.5);
          for (let k = 0; k < m.n; k++) {
            const c = add(c0, mul(d, k * 10 - (m.n - 1) * 5)), p1 = add(c, mul(n, 12)), p2 = sub(c, mul(n, 12));
            el("line", { class: cls, x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] });
          }
        });
      }
    }
  }
  // Put each letter in the widest open gap between the arms at its point.
  function labelPos(fig, n) {
    const p = px(fig.pts[n]);
    const dirs = armsAt(fig, n).map(v => Math.atan2(v[1], v[0]));
    for (const h of fig.hi || []) {
      const hs = h.t === "rel" ? [h.a, h.b] : [h];
      for (const s of hs) if (s.p && s.p.includes(n) && s.t !== "angle") dirs.push(...armsAt({ pts: fig.pts, objs: [s.t === "tri" ? sh("poly", ...s.p) : s] }, n).map(v => Math.atan2(v[1], v[0])));
      if (h.t === "angle" && h.p[1] === n) [h.p[0], h.p[2]].forEach(k => { const v = sub(fig.pts[k], fig.pts[n]); dirs.push(Math.atan2(v[1], v[0])); });
    }
    let best = -Math.PI * 0.75, bestScore = -Infinity;
    for (let k = 0; k < 24; k++) {
      const a = -Math.PI + (k * Math.PI) / 12;
      const gap = dirs.length ? Math.min(...dirs.map(d => Math.abs(((a - d + 3 * Math.PI) % (2 * Math.PI)) - Math.PI))) : Math.PI;
      const q = [p[0] + Math.cos(a) * 32, p[1] + Math.sin(a) * 32];
      const inside = q[0] > 22 && q[0] < VW - 22 && q[1] > 22 && q[1] < VH - 22;
      const score = gap + (inside ? 0 : -5) + (Math.sin(a) < 0 ? 0.01 : 0);
      if (score > bestScore) { bestScore = score; best = a; }
    }
    return [p[0] + Math.cos(best) * 32, p[1] + Math.sin(best) * 32];
  }

  function render(fig, live = {}) {
    svg.replaceChildren();
    const P = fig.pts;
    for (let i = 0; i <= W; i++) el("line", { class: "gl", x1: M + i * S, y1: M, x2: M + i * S, y2: M + H * S });
    for (let j = 0; j <= H; j++) el("line", { class: "gl", x1: M, y1: M + j * S, x2: M + W * S, y2: M + j * S });
    fig.objs.forEach((o, i) => {
      const cls = (o.cls || "") + ((live.sel || []).includes(i) ? " sel" : "");
      if (o.t === "poly") el("polygon", { class: "poly " + cls, points: o.p.map(n => px(P[n]).join(",")).join(" ") });
      else if (LIN[o.t]) drawLinear(o, P, cls, o.off || 0);
      else if (o.t === "angle") { drawLinear(RAY(o.p[1], o.p[0]), P, cls); drawLinear(RAY(o.p[1], o.p[2]), P, cls); arc(o.p[0], o.p[1], o.p[2], P, "ink", 36); }
    });
    for (const h of fig.hi || []) {
      if (LIN[h.t]) drawLinear(h, P, "hi");
      else if (h.t === "tri" || h.t === "poly") el("polygon", { class: "poly hi", points: h.p.map(n => px(P[n]).join(",")).join(" ") });
      else if (h.t === "rel") { drawLinear(h.a, P, "hi"); drawLinear(h.b, P, "hi"); }
    }
    for (const h of fig.hi || []) if (h.t === "angle") arc(h.p[0], h.p[1], h.p[2], P);
    for (const a of fig.arcs || []) arc(a.p[0], a.p[1], a.p[2], P, a.cls || "", a.r || 46);
    drawMarks(fig);
    for (const x of fig.extra || []) {
      if (x.k === "path") el("path", { class: x.cls, d: x.d });
      if (x.k === "text") el("text", { class: x.cls, x: x.at[0], y: x.at[1] }).textContent = x.text;
    }
    const pend = live.pend || [];
    if (pend.length > 1) el("polyline", { class: "pendpath", points: pend.map(n => px(P[n]).join(",")).join(" ") });
    for (const n in P) {
      const p = px(P[n]), hot = (fig.hotPts || []).includes(n), pe = pend.includes(n);
      if (pe) el("circle", { class: "ring", cx: p[0], cy: p[1], r: 17 });
      el("circle", { class: "dot" + (hot ? " hi" : "") + (pe ? " pend" : ""), cx: p[0], cy: p[1], r: hot ? 11 : 8 });
      const l = labelPos(fig, n);
      el("text", { class: "ptname" + (hot ? " hi" : ""), x: l[0], y: l[1] }).textContent = n;
    }
  }

  // ---------- Learn: every object in one picture, a card for each symbol ----------
  const fig = (pts, objs = [], more = {}) => Object.assign({ pts, objs }, more);
  const X = s => Object.assign(s, { ext: 40 });
  const LP = {
    A: [1, 1], B: [4, 1], C: [6, 1], D: [9, 1], E: [11.5, 1], F: [14.5, 1],
    G: [3, 3], H: [1, 5], J: [4.5, 5], K: [6, 5], L: [9, 5], M: [7.5, 3], P: [11, 3], Q: [14, 3], R: [15, 5], S: [11.5, 5],
    T: [1.5, 7], U: [5.5, 7], V: [1.5, 9], W: [5.5, 9], X: [8, 8], Y: [12, 8], Z: [10, 6.5], N: [10, 9.3],
  };
  const LOBJ = [SEG("A", "B"), X(RAY("C", "D")), X(LINE("E", "F")), X(RAY("H", "G")), X(RAY("H", "J")), sh("poly", "K", "L", "M"), sh("poly", "P", "Q", "R", "S"),
    X(LINE("T", "U")), X(LINE("V", "W")), X(LINE("X", "Y")), X(LINE("Z", "N"))];
  const LMARKS = [{ t: "par", o: [7, 8], n: 1 }, { t: "perp", o: [9, 10] }];
  // Each card: the symbol, its name, a one-line meaning, and which objects (by index) it lights up.
  const DEFS = [
    { s: SEG("A", "B"), name: "Line segment", def: "Two endpoints. It stops at both ends. Write it with a bar, or just AB.", on: [0] },
    { s: RAY("C", "D"), name: "Ray", def: "One endpoint, then on forever one way. The endpoint letter comes first.", on: [1] },
    { s: LINE("E", "F"), name: "Line", def: "On forever both ways. Name it with two points on it, or one small letter: line m.", on: [2] },
    { s: sh("angle", "G", "H", "J"), name: "Angle", def: "Two rays from one vertex. The vertex letter goes in the middle.", on: [3, 4], arc: ["G", "H", "J"] },
    { s: sh("tri", "K", "L", "M"), name: "Triangle", def: "Three sides. Name its corners going around.", on: [5] },
    { s: sh("poly", "P", "Q", "R", "S"), name: "Polygon", def: "Name the corners in order around it. No jumping across.", on: [6] },
    { s: rel("par", LINE("T", "U"), LINE("V", "W")), name: "Parallel", def: "Never meet. Matching arrow marks show it.", on: [7, 8] },
    { s: rel("perp", LINE("X", "Y"), LINE("Z", "N")), name: "Perpendicular", def: "Meet at a right angle (90°). The small square shows it.", on: [9, 10] },
  ];
  let defSel = 0;
  function buildDefs() {
    DEFS.forEach((d, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.i = i;
      b.innerHTML = `${fmt(d.s)}<b>${d.name}</b><small>${d.def}</small>`;
      b.addEventListener("click", () => { defSel = i; showLearn(); });
      $("defs").appendChild(b);
    });
  }
  function showLearn() {
    const d = DEFS[defSel];
    document.querySelectorAll("#defs button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.i === defSel));

        const A = r.a.p.join(""), B = r.b.p.join("");
        return r.r === "par" ? `They look parallel, but you have to show it. Use the ∥ Mark tool: tap line ${A}, then line ${B}.`
          : `It looks like a right angle, but you have to show it. Use the ⊥ Mark tool: tap line ${A}, then line ${B}.`;
      }
    }
    return "Not quite. Try again.";
  }
  $("bCheck").addEventListener("click", () => {
    if (btask.done) return;
    const miss = btask.reqs.find(r => !has(r));
    btask.tries++;
    if (!miss) {
      btask.done = true;
      score.b.total++; if (btask.tries === 1) score.b.right++;
      setFb("bFb", "Yes! Your drawing matches.", "good");
      $("bScore").textContent = `Score: ${score.b.right} of ${score.b.total}`;
    } else setFb("bFb", diag(miss), "bad");
  });
  $("bHint").addEventListener("click", () => {
    if (btask.done) return;
    const miss = btask.reqs.find(r => !has(r));
    setFb("bFb", miss ? HINT[miss.t] : "It all looks done. Press Check.", "");
  });
  $("bShow").addEventListener("click", () => {
    if (btask.done) return;
    btask.done = true;
    btask.D = D = startD(btask);
    for (const r of btask.reqs) {
      if (r.t === "rel") D.marks.push({ t: r.r, o: [lineIdx(r.a), lineIdx(r.b)], n: 1, fresh: true });
      else D.objs.push(sh(r.t === "tri" ? "poly" : r.t, ...r.p));
    }
    pend = []; selObj = [];
    drawD();
    setFb("bFb", "Here is one way. Press New task to try another.", "good");
  });
  $("bNew").addEventListener("click", newBuild);

  // ---------- Sandbox: name everything that is drawn ----------
  const KNAME = { seg: "Segment", ray: "Ray", line: "Line", angle: "Angle", par: "Parallel", perp: "Perpendicular" };
  function detect() {
    const P = D.pts, rows = [], notes = [], angles = [];
    D.objs.forEach(o => {
      if (o.t === "poly") { const n = o.p.length; rows.push([n === 3 ? "Triangle" : n === 4 ? "Quadrilateral" : "Polygon", fmt(n === 3 ? sh("tri", ...o.p) : o)]); }
      else { rows.push([KNAME[o.t], fmt(o)]); if (o.t === "angle") angles.push(o); }
    });
    // Angles made by segments and rays that share an endpoint.
    for (const v in P) {
      const arms = [];
      D.objs.forEach(o => {
        if (o.t === "seg" && o.p.includes(v)) arms.push(o.p[0] === v ? o.p[1] : o.p[0]);
        if (o.t === "ray" && o.p[0] === v) arms.push(o.p[1]);
      });
      for (let i = 0; i < arms.length; i++) for (let j = i + 1; j < arms.length; j++) {
        if (cross(sub(P[arms[i]], P[v]), sub(P[arms[j]], P[v])) === 0) continue;
        const a = sh("angle", arms[i], v, arms[j]);
        if (angles.some(x => same(x, a, P))) continue;
        angles.push(a); rows.push(["Angle", fmt(a)]);
      }
    }
    D.marks.forEach(m => rows.push([KNAME[m.t], nt(pieces(D.objs[m.o[0]]) + sym(RSYM[m.t]) + pieces(D.objs[m.o[1]]))]));
    // Looks are not proof: point out pairs that look parallel or perpendicular but have no marks.
    const lin = D.objs.map((o, i) => [o, i]).filter(([o]) => LIN[o.t]);
    for (let x = 0; x < lin.length; x++) for (let y = x + 1; y < lin.length; y++) {
      const [a, i] = lin[x], [b, j] = lin[y];
      const da = sub(P[a.p[1]], P[a.p[0]]), db = sub(P[b.p[1]], P[b.p[0]]);
      const marked = t => D.marks.some(m => m.t === t && setEq(m.o, [i, j]));
      const I = meet(a, b, P);
      if (cross(da, db) === 0 && !carrierEq(a, b, P) && !marked("par")) notes.push(`${fmt(a)} and ${fmt(b)} look parallel. Mark them with ∥ to show it.`);
      if (dot(da, db) === 0 && I && onObj(a, I.t) && onObj(b, I.u) && !marked("perp")) notes.push(`${fmt(a)} and ${fmt(b)} look perpendicular. Mark them with ⊥ to show it.`);
    }
    $("seen").innerHTML = rows.map(([k, h]) => `<li><span class="k">${k}</span>${h}</li>`).join("") + notes.slice(0, 3).map(n => `<li class="note">${n}</li>`).join("");
    $("seenEmpty").hidden = rows.length > 0;
  }

  // ---------- Tabs and levels ----------
  function setTab(t) {
    tab = t;
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === t));
    $("pLearn").hidden = t !== "learn"; $("pName").hidden = t !== "name"; $("pBuild").hidden = t !== "build"; $("pSand").hidden = t !== "sand";
    $("levelBox").hidden = !(t === "name" || t === "build");

    document.querySelector('#tools [data-tool="move"]').hidden = t !== "sand";
    $("tools").hidden = !drawing; $("status").hidden = !drawing;

    pend = []; selObj = []; statusMsg = null;
    if (t === "learn") showLearn();
    if (t === "name") { if (!nq || nq.level !== level) newName(); else showName(); }
    if (t === "build") { if (!btask || btask.level !== level) newBuild(); else { D = btask.D; tool = level === 1 ? TOOLFOR[btask.reqs[0].t] : "point"; drawD(); } }
    if (t === "sand") { sandD = sandD || freshD(); D = sandD; tool = "seg"; changed(); }
  }
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
  function setLevel(l) {
    level = l;
    document.querySelectorAll(".lv button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.lv === l));
    $("lvdesc").textContent = LVDESC[l];
    if (tab === "name") { nCount = 0; newName(); }
    if (tab === "build") newBuild();
  }
  document.querySelectorAll(".lv button").forEach(b => b.addEventListener("click", () => setLevel(+b.dataset.lv)));

  buildDefs();
  buildTools();
  $("lvdesc").textContent = LVDESC[1];
  setTab("learn");
})();
</script>

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
