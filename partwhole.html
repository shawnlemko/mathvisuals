<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Fraction and Percent of a Number (grades 6-7, Shawn 2026-10-10).
   Find the part: "3/4 of 20 = ?" on a bar over a number line, cut into 4 equal parts, then count 3 of them.
   Find the whole: "15 is 3/4 of ?" as 4 equal groups; 15 (tens and ones) is shared into 3 of them, the last group
   gets the same, and the 4 groups make the whole. Percents use the same pictures (75% = 3/4, 4 parts of 25%).
   Learn steps through it. "Show the procedure" adds the written work, top to bottom, in fraction notation with
   cancelling (no ÷ sign, Shawn 2026-10-13). Practice works each question on the board, as a strip the student cuts
   into equal parts and fills in, or as the written procedure with boxes to fill (flip, cancel, answer). */
.main { grid-template-columns: minmax(0, 1.5fr) minmax(330px, 1fr); }
.seg-btns { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg-btns button { border: 0; border-radius: 0; background: var(--sheet); font-size: 1rem; min-height: 44px; padding: 6px 12px; }
.seg-btns button + button { border-left: 2px solid var(--grid-major); }
.seg-btns button.on { background: var(--pt); color: var(--sheet); }
header .seg-btns button { font-size: 1.2rem; min-height: 48px; padding: 6px 18px; }
.proc-tg { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; cursor: pointer; min-height: 40px; }
.proc-tg input { width: 24px; height: 24px; accent-color: var(--pt); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }

.ask { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-family: var(--font-num); font-weight: 700; font-size: 1.6rem; }
#ask { margin-top: 14px; }
.ask .stack input { height: 46px; }
.ask input { font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--grid-major); border-radius: 10px; height: 52px; width: 3.4ch; text-align: center; padding: 0 4px; }
.ask input.f { border-color: var(--green); color: var(--green); width: 2.6ch; }
.ask input.n { border-color: var(--pt); color: var(--pt); width: 3.6ch; }
.ask input.ans { width: 4.6ch; border-color: var(--pt); color: var(--pt); }
.ask .word { font-family: var(--font-body); font-size: 1.2rem; color: var(--muted); }
.ask .stack { display: inline-flex; flex-direction: column; align-items: center; gap: 5px; }
.ask .stack hr { width: 100%; border: 0; border-top: 3px solid var(--green); margin: 0; }
.ask .q { color: var(--muted); }
.say { font-size: 1.15rem; font-weight: 700; margin: 12px 0 0; padding-top: 10px; border-top: 1px dashed var(--grid-major); min-height: 2.4em; }
.panel { gap: 12px; }
.panel .card { padding: 12px 16px; }
.err { margin: 8px 0 0; color: var(--warn); font-weight: 700; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btns { gap: 8px; }
.btns button { font-size: 1rem; min-height: 48px; padding: 8px 12px; }
.btns button.go { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.btns button:disabled { opacity: 0.45; cursor: default; }
.ask .stack.ro { gap: 2px; color: var(--green); }
.ask .stack.ro hr { border-top-width: 3px; }
.ask .f { color: var(--green); } .ask .n { color: var(--pt); }
.fb { margin: 0; font-size: 1.15rem; font-weight: 700; min-height: 1.5em; }
.fb.ok { color: var(--green); }
.fb.no { color: var(--warn); }
.score { font-size: 1.1rem; color: var(--muted); margin: 0 0 0 auto; align-self: center; }
.score b { color: var(--ink); font-family: var(--font-num); font-size: 1.4rem; }

/* Procedure: the written steps, one line per board step */
#proc { margin-top: 8px; border-top: 1px dashed var(--grid-major); padding-top: 10px; }
.proc .eq { font-size: 1.15rem; gap: 4px 8px; }
.proc .eq + .eq { margin-top: 2px; }
.proc .note { font-family: var(--font-body); font-size: 0.95rem; color: var(--muted); font-weight: 700; }
.proc .frac { font-size: 0.85em; }
.proc .res { color: var(--green); font-weight: 700; }
.proc .wait { margin: 0; color: var(--muted); }

/* Board drawing */
.qt { font-family: var(--font-num); font-weight: 700; fill: var(--ink); }
.qt.f { fill: var(--green); } .qt.n { fill: var(--pt); } .qt.q { fill: var(--muted); } .qt.a { fill: var(--green); }
.qt.w { font-family: var(--font-body); fill: var(--muted); }
.fbar { stroke-width: 3.5; stroke-linecap: round; stroke: var(--ink); }
.fbar.f { stroke: var(--green); } .fbar.a { stroke: var(--green); }
.part { fill: var(--sheet); stroke: var(--ink); stroke-width: 3; }
.part.on { fill: var(--green); fill-opacity: 0.32; }
.whole { fill: none; stroke: var(--ink); stroke-width: 4; }
.nl { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.tick { stroke: var(--ink); stroke-width: 3; }
.cut { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 4 5; }
.lbl { font-family: var(--font-num); font-weight: 700; fill: var(--ink); text-anchor: middle; }
.lbl.top { fill: var(--muted); }
.lbl.hit { fill: var(--green); }
.pv { font-family: var(--font-num); font-weight: 700; fill: var(--pt); text-anchor: middle; }
.jump { fill: none; stroke: var(--green); stroke-width: 3.5; stroke-linecap: round; }
.jumpt { font-family: var(--font-num); font-weight: 700; fill: var(--green); text-anchor: middle; font-size: 24px; }
.ring { fill: none; stroke: var(--green); stroke-width: 3.5; }
.big { font-family: var(--font-num); font-weight: 700; fill: var(--green); text-anchor: middle; }
.brace { fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.bracet { font-family: var(--font-body); font-weight: 700; fill: var(--muted); text-anchor: middle; font-size: 26px; }
.bracet .num { font-family: var(--font-num); }
.bracet.done { fill: var(--green); }
.grp { fill: var(--sheet); stroke: var(--grid-major); stroke-width: 2.5; stroke-dasharray: 9 7; }
.grp.given { stroke: var(--green); stroke-dasharray: none; stroke-width: 4; fill: var(--green); fill-opacity: 0.08; }
.grp.copy { stroke: var(--orange); stroke-dasharray: none; stroke-width: 4; fill: var(--orange); fill-opacity: 0.07; }
.ten, .one { stroke: var(--sheet); stroke-width: 1.5; }
.ten { fill: var(--pt); } .one { fill: var(--pt); }
.ten.cp, .one.cp { fill: var(--orange); }
.one.traded { fill: var(--orange); }
.tencell { stroke: var(--sheet); stroke-width: 1; opacity: 0.55; }
.tray { fill: none; stroke: var(--grid-major); stroke-width: 2; stroke-dasharray: 8 6; }
.trayt { font-family: var(--font-num); font-weight: 700; fill: var(--pt); text-anchor: end; font-size: 44px; }
.note { font-family: var(--font-body); font-weight: 700; fill: var(--orange); font-size: 22px; }
.gv { font-family: var(--font-num); font-weight: 700; text-anchor: middle; font-size: 34px; fill: var(--pt); }
.gv.cp { fill: var(--orange); }
/* cancelling: the crossed-out number with its new value above it */
.cx { position: relative; display: inline-block; }
.cx > s { text-decoration-color: var(--warn); text-decoration-thickness: 3px; }
.cx > sup { position: absolute; top: -0.9em; right: -0.75em; font-size: 0.7em; color: var(--warn); }
.cx > .bx.sup { position: absolute; top: -1.35em; right: -1.3em; font-size: 0.55em; width: 2.4ch; height: 1.5em; }
.cx.dn > sup { top: auto; bottom: -0.8em; }
.cx.dn > .bx.sup { top: auto; bottom: -1.35em; }
.proc .eq .frac > span:last-child { padding-top: 1px; padding-bottom: 6px; }
.pl .frac > span:last-child { padding-bottom: 12px; }
.proc .eq .frac > span { padding-inline: 10px; }
.proc .eq .frac > span:first-child { padding-top: 6px; padding-bottom: 1px; }

/* Practice board (HTML, replaces the picture in Practice) */
.pb { display: flex; flex-direction: column; justify-content: center; gap: 20px; padding: 8px 18px; min-height: 0; flex: 1 1 auto; overflow: auto; font-family: var(--font-num); font-weight: 700; }
.pq { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; font-size: 2.1rem; }
.pq .w { font-family: var(--font-body); font-size: 0.75em; color: var(--muted); }
.pq .f { color: var(--green); } .pq .n { color: var(--pt); }
.bx { font: inherit; width: 3.2ch; height: 1.6em; text-align: center; border: 2px solid var(--grid-major); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 0 2px; }
.bx.ans { border-color: var(--pt); color: var(--pt); width: 4ch; }
.bx.bad { border-color: var(--warn); color: var(--warn); }
.bx.good { border-color: var(--green); color: var(--green); }
.cutrow { display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--font-body); font-size: 1.3rem; }
.cutrow button { min-width: 48px; min-height: 48px; font-size: 1.5rem; padding: 0; }
.cutrow output { font-family: var(--font-num); font-size: 2rem; color: var(--pt); min-width: 2ch; text-align: center; }
.over { position: relative; height: 16px; margin-top: 2.4rem; border: 3px solid var(--green); border-bottom: 0; border-radius: 8px 8px 0 0; }
.over span { position: absolute; left: 50%; transform: translateX(-50%); top: -2.3rem; color: var(--green); font-size: 1.7rem; white-space: nowrap; }
.strip { display: flex; border: 4px solid var(--ink); border-radius: 4px; height: 120px; background: var(--sheet); }
.cell { flex: 1; min-width: 0; border-left: 3px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.cell:first-child { border-left: 0; }
.cell.on { background: color-mix(in srgb, var(--green) 28%, var(--sheet)); }
.cell .fl { font-size: 0.95rem; color: var(--muted); }
.cell .fl .frac { font-size: 0.95rem; }
.cell .bx { font-size: 1.5rem; width: min(3.4ch, 92%); }
.under { position: relative; height: 16px; border: 3px solid var(--grid-major); border-top: 0; border-radius: 0 0 8px 8px; margin-bottom: 2.2rem; }
.under span { position: absolute; left: 50%; transform: translateX(-50%); bottom: -2.2rem; color: var(--muted); font-family: var(--font-body); font-size: 1.4rem; white-space: nowrap; }
.under b { font-family: var(--font-num); color: var(--pt); }
.plines { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; font-size: 1.75rem; margin: 0 auto; }
.pl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pl .frac > span { padding-inline: 10px; }
.pl .frac > span:first-child { padding-top: 10px; }
.pl .nt { font-family: var(--font-body); font-size: 1rem; color: var(--muted); margin-left: 10px; }
.pl .f { color: var(--green); } .pl .n { color: var(--pt); }
@media (max-width: 600px) { .ask { font-size: 1.3rem; } .ask input { height: 46px; } }

    <div class="panel">
      <div class="panel" id="learn">
        <section class="card">
          <div class="row">
            <div class="seg-btns" role="group" aria-label="Find">
              <button type="button" data-skill="part" class="on">Find the part</button><button type="button" data-skill="whole">Find the whole</button>
            </div>
            <div class="seg-btns" role="group" aria-label="Fraction or percent">
              <button type="button" data-form="frac" class="on">Fraction</button><button type="button" data-form="pct">Percent</button>
            </div>
          </div>
          <div class="ask" id="ask"></div>
          <p class="err" id="err" hidden></p>
          <p class="say" id="say" aria-live="polite"></p>
        </section>
        <div class="btns">
          <button type="button" class="go" id="next">Next step</button>
          <button type="button" id="back">Back</button>
          <button type="button" id="again">Start over</button>
          <button type="button" id="rand">New example</button>
        </div>
      </div>

      <div class="panel" id="practice" hidden>
        <section class="card">
          <div class="row">
          <div class="seg-btns" role="group" aria-label="Practice: find">
            <button type="button" data-pskill="part">Find the part</button><button type="button" data-pskill="whole">Find the whole</button><button type="button" data-pskill="mix" class="on">Both</button>
          </div>
          <div class="seg-btns" role="group" aria-label="Practice: fraction or percent">
            <button type="button" data-pform="frac">Fractions</button><button type="button" data-pform="pct">Percents</button><button type="button" data-pform="mix" class="on">Both</button>
          </div>
          <div class="seg-btns" role="group" aria-label="Work it out with">
            <button type="button" data-pway="strip" class="on">Strip</button><button type="button" data-pway="proc">Procedure</button>
          </div>
          </div>
        </section>
        <section class="card">
          <p class="fb" id="fb" aria-live="polite">Fill in the boxes on the board, then press Check.</p>
        </section>
        <div class="btns">
          <button type="button" class="go" id="check">Check</button>
          <button type="button" id="showme">Show me</button>
          <button type="button" id="newq">New question</button>
          <p class="score">Correct: <b id="right">0</b> of <b id="tried">0</b></p>
        </div>
      </div>

      <section class="card proc" id="procCard">
        <label class="proc-tg"><input type="checkbox" id="procOn"> Show the procedure</label>
        <div id="proc" hidden></div>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("svg");
  const el = (tag, attrs, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  const gcd = (a, b) => { while (b) [a, b] = [b, a % b]; return a; };
  const LAST = { part: 4, whole: 5 };
  const PCTS = [10, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90];   // each is a fraction with 10 or fewer parts

  // A problem: skill "part" (a/b of n = ?) or "whole" (n is a/b of ?), as a fraction or a percent (p%).
  // info() works out the parts: b equal parts of size s; the answer is a parts (part) or all b parts (whole).
  function info(p) {
    let a = p.a, b = p.b;
    // Percents use parts that read as percents: 10 parts of 10% (60% = 6 of 10), or 4 parts of 25% for 25% and 75%.
    if (p.form === "pct") { b = p.p % 10 ? 4 : 10; a = p.p * b / 100; }
    const s = p.skill === "part" ? p.n / b : p.n / a;
    return { a, b, s, ans: p.skill === "part" ? a * s : b * s };
  }
  // The fraction or percent as text (for sentences) and as pieces (for the board).
  const ftext = p => p.form === "pct" ? `${p.p}%` : `${p.a}/${p.b}`;
  const dec = p => String(p.p / 100).replace(/^0/, "0");

  let mode = "learn";
  let ex = { skill: "part", form: "frac", a: 3, b: 4, p: 75, n: 20, ns: { part: 20, whole: 15 }, step: 0 };
  let pq = null;
  const cur = () => mode === "learn" ? ex : pq;

  // ---------- board helpers ----------
  // A stacked fraction centred at cx with its bar at y. Returns its width.
  function sfrac(g, cx, y, n, d, size, cls) {
    const t1 = el("text", { class: `qt ${cls}`, x: cx, y: y - size * 0.2, "font-size": size, "text-anchor": "middle" }, g);
    t1.textContent = n;
    const t2 = el("text", { class: `qt ${cls}`, x: cx, y: y + size * 0.86, "font-size": size, "text-anchor": "middle" }, g);
    t2.textContent = d;
    const w = Math.max(t1.getComputedTextLength(), t2.getComputedTextLength()) + 10;
    el("line", { class: `fbar ${cls}`, x1: cx - w / 2, x2: cx + w / 2, y1: y, y2: y }, g);
    return w;
  }
  // A sentence of pieces centred at cx; pieces are text {t, c} or fractions {n, d, c}. y is the middle line.
  function sentence(cx, y, size, pieces) {
    const g = el("g", {});
    const widths = [], items = [];
    pieces.forEach(pc => {
      const sub = el("g", {}, g);
      if (pc.d != null) {
        widths.push(sfrac(sub, 0, y, pc.n, pc.d, size * 0.72, pc.c));
        items.push({ sub, center: true });
      } else {
        const t = el("text", { class: `qt ${pc.c || ""}`, x: 0, y: y + size * 0.36, "font-size": pc.c === "w" ? size * 0.8 : size }, sub);
        t.textContent = pc.t;
        widths.push(t.getComputedTextLength());
        items.push({ sub, center: false });
      }
    });
    const gap = size * 0.3, tot = widths.reduce((s, w) => s + w, 0) + gap * (widths.length - 1);
    let x = cx - tot / 2;
    items.forEach((it, i) => {
      it.sub.setAttribute("transform", `translate(${it.center ? x + widths[i] / 2 : x},0)`);
      x += widths[i] + gap;
    });
  }
  function fpiece(p, c) { return p.form === "pct" ? { t: `${p.p}%`, c } : { n: p.a, d: p.b, c }; }
  // Curly brace over x1..x2, tip pointing up at height y.
  // dir -1 turns it over: ends up, tip down.
  function brace(x1, x2, y, dir = 1) {
    const m = (x1 + x2) / 2, h = 14 * dir, r = 16;
    el("path", { class: "brace", d: `M${x1},${y + h} Q${x1},${y} ${x1 + r},${y} L${m - r},${y} Q${m},${y} ${m},${y - h} Q${m},${y} ${m + r},${y} L${x2 - r},${y} Q${x2},${y} ${x2},${y + h}` });
  }

  function draw() {
    svg.replaceChildren();
    const p = cur(); if (!p || p.bad) return;
    if (p.skill === "part") drawPart(p); else drawWhole(p);
  }

  // ---------- find the part: bar over a number line ----------
  function drawPart(p) {
    const I = info(p), s = p.step, done = s >= LAST.part;
    const X0 = 100, X1 = 1100, pw = (X1 - X0) / I.b;
    const xs = k => X0 + k * pw;
    sentence(600, 62, 54, [fpiece(p, "f"), { t: "of", c: "w" }, { t: String(p.n), c: "n" }, { t: "=", c: "w" }, done ? { t: String(I.ans), c: "a" } : { t: "?", c: "q" }]);

    // the whole, under the number line
    brace(X0, X1, 576, -1);
    const bt = el("text", { class: "bracet", x: 600, y: 616 });
    bt.innerHTML = `the whole = <tspan class="num">${p.n}</tspan>`;

    // fraction (or percent) names above each cut
    const BY = 262, BH = 86, LY = 412;
    const topLbl = k => {
      if (p.form === "pct") {
        el("text", { class: "lbl top", x: xs(k), y: 232, "font-size": 26 }).textContent = `${Math.round(k * 100 / I.b)}%`;
      } else if (k === 0) {
        el("text", { class: "lbl top", x: xs(k), y: 232, "font-size": 26 }).textContent = "0";
      } else sfrac(el("g", {}), xs(k), 214, k, I.b, 24, "q");
    };
    topLbl(0);
    if (s >= 1) for (let k = 1; k <= I.b; k++) topLbl(k);
    else if (p.form === "pct") topLbl(I.b);
    else el("text", { class: "lbl top", x: xs(I.b), y: 232, "font-size": 26 }).textContent = "1";

    // bar: one piece until it is cut, then b equal parts; the first a shade green once counted
    if (s < 1) el("rect", { class: "part", x: X0, y: BY, width: X1 - X0, height: BH });
    else for (let k = 0; k < I.b; k++) el("rect", { class: "part" + (s >= 3 && k < I.a ? " on" : ""), x: xs(k), y: BY, width: pw, height: BH });
    el("rect", { class: "whole", x: X0, y: BY, width: X1 - X0, height: BH });
    if (s >= 2) {
      const fs = Math.min(40, pw * 0.42);
      for (let k = 0; k < I.b; k++) el("text", { class: "pv", x: xs(k) + pw / 2, y: BY + BH / 2 + fs * 0.36, "font-size": fs }).textContent = I.s;
    }

    // number line under the bar, with the cuts carried down to it
    el("line", { class: "nl", x1: X0 - 30, x2: X1 + 30, y1: LY, y2: LY });
    for (let k = 0; k <= I.b; k++) {
      if (s < 1 && k > 0 && k < I.b) continue;
      if (k > 0 && k < I.b) el("line", { class: "cut", x1: xs(k), x2: xs(k), y1: BY + BH, y2: LY });
      el("line", { class: "tick", x1: xs(k), x2: xs(k), y1: LY - 12, y2: LY + 12 });
      const v = k * I.s;
      const known = k === 0 || k === I.b || s >= 2;
      if (!known) continue;
      const fs = Math.min(30, pw * 0.34 + 6);
      el("text", { class: "lbl" + (s >= 3 && k === I.a ? " hit" : ""), x: xs(k), y: LY + 46, "font-size": fs }).textContent = v;
      if (done && k === I.a) el("circle", { class: "ring", cx: xs(k), cy: LY + 36, r: Math.max(26, String(v).length * fs * 0.36 + 12) });
    }

    // count a parts: one jump each, from 0
    if (s >= 3) {
      const JY = LY + 72;
      for (let k = 0; k < I.a; k++) {
        const x1 = xs(k) + 6, x2 = xs(k + 1) - 6, m = (x1 + x2) / 2;
        el("path", { class: "jump", d: `M${x1},${JY} Q${m},${JY + 66} ${x2},${JY}` });
        el("path", { class: "jump", d: `M${x2 - 12},${JY + 4} L${x2},${JY} L${x2 + 1},${JY + 13}` });
        el("text", { class: "jumpt", x: m, y: JY + 64, "font-size": Math.min(24, pw * 0.3) }).textContent = (k + 1);
      }
    }
    if (done) sentence(600, 676, 40, [fpiece(p, "a"), { t: "of", c: "w" }, { t: String(p.n), c: "n" }, { t: "=", c: "w" }, { t: String(I.ans), c: "a" }]);
  }

  // ---------- find the whole: b equal groups of tens and ones ----------
  // Draws `tens` rods and `ones` units with unit u, left edge x, bottom y. Returns nothing.
  function blocks(x, bottom, u, tens, ones, cls = "", traded = 0) {
    const gap = 4;
    for (let i = 0; i < tens; i++) {
      const rx = x + i * (u + gap);
      el("rect", { class: `ten ${cls}`, x: rx, y: bottom - 10 * u, width: u, height: 10 * u, rx: 2 });
      for (let j = 1; j < 10; j++) el("line", { class: "tencell", x1: rx, x2: rx + u, y1: bottom - j * u, y2: bottom - j * u });
    }
    const ox = x + tens * (u + gap);
    for (let i = 0; i < ones; i++) {
      const c = Math.floor(i / 5), r = i % 5;
      const t = i >= ones - traded ? " traded" : "";
      el("rect", { class: `one ${cls}${t}`, x: ox + c * (u + gap), y: bottom - (r + 1) * (u + 2) + 2, width: u, height: u, rx: 2 });
    }
  }
  const blocksWidth = (u, tens, ones) => {
    const cols = tens + Math.ceil(ones / 5);
    return cols ? cols * (u + 4) - 4 : 0;
  };

  function drawWhole(p) {
    const I = info(p), s = p.step, done = s >= LAST.whole;
    const T = Math.floor(p.n / 10), O = p.n % 10;
    const q = Math.floor(I.s / 10), r = I.s % 10;     // each group gets q tens and r ones
    const traded = T - I.a * q;                         // tens that can't be shared evenly, traded for ones
    sentence(600, 52, 50, [{ t: String(p.n), c: "n" }, { t: "is", c: "w" }, fpiece(p, "f"), { t: "of", c: "w" }, done ? { t: String(I.ans), c: "a" } : { t: "?", c: "q" }]);

    // the tray: n as tens and ones, until it is shared out
    const TU = 12, TB = 238;
    let tT = T, tO = O, tTr = 0;
    if (s >= 2) { tT = 0; tO = O + 10 * traded; tTr = 10 * traded; }
    if (s >= 3) { tT = 0; tO = 0; }
    if (tT + tO > 0) {
      const w = blocksWidth(TU, tT, tO), x = 600 - w / 2 + 40;
      el("rect", { class: "tray", x: x - 16, y: TB - 10 * TU - 14, width: w + 32, height: 10 * TU + 28, rx: 10 });
      el("text", { class: "trayt", x: x - 34, y: TB - 44 }).textContent = s >= 2 ? `${tO}` : `${p.n}`;
      blocks(x, TB, TU, tT, tO, "", tTr);
      if (s === 2 && traded > 0) el("text", { class: "note", x: x + w + 32, y: TB - 52 }).textContent = `${traded} ten${traded > 1 ? "s" : ""} → ${10 * traded} ones`;
    }

    // the whole: b equal groups
    const X0 = 60, X1 = 1140, GY = 324, GH = 250, gap = I.b > 6 ? 12 : 22;
    const gw = (X1 - X0 - gap * (I.b - 1)) / I.b;
    brace(X0, X1, 300);
    const bt = el("text", { class: "bracet" + (done ? " done" : ""), x: 600, y: 276 });
    bt.innerHTML = done ? `the whole = <tspan class="num">${I.b} × ${I.s} = ${I.ans}</tspan>` : `the whole = <tspan class="num">?</tspan>`;

    const cols = q + Math.ceil(r / 5);
    const u = Math.max(5, Math.min(24, (GH - 36) / 10, cols ? (gw - 20) / cols - 4 : 20));
    for (let k = 0; k < I.b; k++) {
      const gx = X0 + k * (gw + gap), given = k < I.a;
      const cls = s >= 1 && given ? " given" : s >= 4 && !given ? " copy" : "";
      el("rect", { class: "grp" + cls, x: gx, y: GY, width: gw, height: GH, rx: 12 });
      // what is in this group so far
      let t = 0, o = 0;
      if (given && s >= 2) t = q;
      if (given && s >= 3) o = r;
      if (!given && s >= 4) { t = q; o = r; }
      if (t + o > 0) {
        const w = blocksWidth(u, t, o);
        blocks(gx + (gw - w) / 2, GY + GH / 2 + 5 * u, u, t, o, given ? "" : "cp");
      }
      if (s >= 1) {
        const cx = gx + gw / 2;
        if (p.form === "pct") el("text", { class: "lbl top", x: cx, y: 620, "font-size": Math.min(28, gw * 0.3) }).textContent = `${100 / I.b}%`;
        else sfrac(el("g", {}), cx, 608, 1, I.b, Math.min(26, gw * 0.3), "q");
      }
      if ((given && s >= 3) || (!given && s >= 4)) el("text", { class: "gv" + (given ? "" : " cp"), x: gx + gw / 2, y: 692, "font-size": Math.min(34, gw * 0.36) }).textContent = I.s;
    }
  }

  // ---------- step words ----------
  function say(p) {
    const I = info(p), s = p.step, F = ftext(p), pl = (k, w) => `${k} ${w}${k === 1 ? "" : "s"}`;
    const pctNote = p.form === "pct" ? `${p.p}% = ${I.a}/${I.b}. ` : "";
    if (p.skill === "part") {
      const counts = Array.from({ length: I.a }, (_, k) => (k + 1) * I.s).join(", ");
      return [
        `What is ${F} of ${p.n}?`,
        `${pctNote}Cut ${p.n} into ${I.b} equal parts${p.form === "pct" ? ` (${100 / I.b}% each)` : ""}.`,
        `${I.b} equal parts make ${p.n}, so each part is ${I.s}.`,
        `Count ${pl(I.a, "part")}: ${counts}.`,
        `${F} of ${p.n} = ${I.ans}`,
      ][s];
    }
    const T = Math.floor(p.n / 10), q = Math.floor(I.s / 10), r = I.s % 10, traded = T - I.a * q;
    const tradeNote = traded > 0 ? ` Trade the ${pl(traded, "ten")} left for ${10 * traded} ones.` : "";
    const tens = T === 0 ? "No tens to share, so go to the ones."
      : q === 0 ? `${pl(T, "ten")} can't go into ${I.a} groups. Trade ${T === 1 ? "it" : "them"} for ${10 * T} ones.`
      : `Share the tens: each group gets ${pl(q, "ten")}.${tradeNote}`;
    return [
      `${pctNote}The denominator is ${I.b}. There are ${I.b} equal parts in the whole.`,
      `The numerator is ${I.a}. Therefore, ${I.a} of the parts ${I.a === 1 ? "is" : "make"} ${p.n}.`,
      tens,
      r ? `Share the ones: each group gets ${r}. Each group is ${I.s}.` : `No ones to share. Each group is ${I.s}.`,
      I.b > I.a ? `The other ${I.b - I.a === 1 ? "group gets" : `${I.b - I.a} groups get`} ${I.s} too. Equal groups!` : `All the groups are full.`,
      `The whole is ${I.b} × ${I.s} = ${I.ans}. ${p.n} is ${F} of ${I.ans}.`,
    ][s];
  }

  // ---------- procedure (written steps, top to bottom; each line appears at its board step) ----------
  // Fraction notation only (no ÷): "of" becomes ×, whole numbers go over 1, and common factors cancel.
  const hf = (n, d, c = "") => `<span class="frac ${c}"><span>${n}</span><span>${d}</span></span>`;
  const cxs = (v, nv, dn) => `<span class="cx${dn ? " dn" : ""}"><s>${v}</s><sup>${nv}</sup></span>`;
  function procLines(p) {
    const I = info(p), lines = [];
    const add = (step, html, note) => lines.push([step, html + (note ? ` <span class="note">${note}</span>` : "")]);
    const res = v => `<span class="res">${v}</span>`;
    const F = p.form === "pct" ? `${p.p}%` : hf(p.a, p.b);
    if (p.skill === "part") {
      const g = gcd(p.n, I.b);
      add(0, `${F} of ${p.n}`);
      add(p.form === "pct" ? 1 : 0, `= ${hf(I.a, I.b)} × ${hf(p.n, 1)}`, p.form === "pct" ? `${p.p}% = ${p.p}/100 = ${I.a}/${I.b}` : "“of” means ×");
      add(2, `= ${hf(`${I.a} × ${cxs(p.n, p.n / g)}`, `${cxs(I.b, I.b / g, true)} × 1`)}`, `cancel: both share ${g}` );
      add(3, `= ${hf(I.ans, 1)} = ${res(I.ans)}`);
    } else {
      const g = gcd(p.n, I.a);
      add(0, `${F} of ? = ${p.n}`);
      add(1, `${hf(I.a, I.b)} × ? = ${p.n}`, p.form === "pct" ? `${p.p}% = ${p.p}/100 = ${I.a}/${I.b}` : "“of” means ×");
      add(3, `? = ${hf(p.n, 1)} × ${hf(I.b, I.a)}`, `multiply by the flip of ${I.a}/${I.b}`);
      if (g > 1) add(4, `= ${hf(`${cxs(p.n, p.n / g)} × ${I.b}`, `1 × ${cxs(I.a, I.a / g, true)}`)}`, `cancel: both share ${g}`);
      add(5, `= ${hf(I.ans, 1)} = ${res(I.ans)}`);
    }
    return lines;
  }
  function renderProc() {
    const on = $("procOn").checked, p = cur();
    $("proc").hidden = !on;
    if (!on) return;
    if (!p || p.bad) { $("proc").innerHTML = ""; return; }
    const shown = procLines(p).filter(([st]) => st <= p.step);
    $("proc").innerHTML = shown.map(([, h]) => `<div class="eq">${h}</div>`).join("") ||
      `<p class="wait">The steps show here.</p>`;
  }
  $("procOn").addEventListener("change", renderProc);

  // ---------- learn ----------
  const int = v => /^\s*\d+\s*$/.test(v) ? parseInt(v, 10) : NaN;
  function buildAsk() {
    const f = ex.form === "pct"
      ? `<input id="ip" class="f" type="text" inputmode="numeric" autocomplete="off" aria-label="Percent" value="${ex.p}"><span>%</span>`
      : `<span class="stack"><input id="ia" class="f" type="text" inputmode="numeric" autocomplete="off" aria-label="Numerator" value="${ex.a}"><hr><input id="ib" class="f" type="text" inputmode="numeric" autocomplete="off" aria-label="Denominator" value="${ex.b}"></span>`;
    const n = `<input id="in" class="n" type="text" inputmode="numeric" autocomplete="off" aria-label="Number" value="${ex.ns[ex.skill]}">`;
    $("ask").innerHTML = ex.skill === "part"
      ? `${f}<span class="word">of</span>${n}<span>=</span><span class="q">?</span>`
      : `${n}<span class="word">is</span>${f}<span class="word">of</span><span class="q">?</span>`;
    $("ask").querySelectorAll("input").forEach(i => i.addEventListener("input", restart));
  }
  function exCheck() {
    const n = int($("in").value);
    let a = ex.a, b = ex.b, P = ex.p, msg = "";
    if (ex.form === "pct") {
      P = int($("ip").value);
      if (!PCTS.includes(P)) msg = "Use 10%, 20%, 25%, 30% ... 75%, 80% or 90%.";
    } else {
      a = int($("ia").value); b = int($("ib").value);
      if (!(b >= 2 && b <= 10)) msg = "Make the bottom number 2 to 10.";
      else if (!(a >= 1 && a < b)) msg = `Make the top number 1 to ${b - 1}.`;
    }
    if (!msg && !(n >= 1)) msg = "Type a whole number.";
    if (!msg) {
      const t = info({ skill: ex.skill, form: ex.form, a, b, p: P, n });
      if (ex.skill === "part") {
        if (n > 1000) msg = "Keep the number 1000 or less.";
        else if (n % t.b) msg = `${n} can't be cut into ${t.b} equal whole parts. Try a number ${t.b} divides into.`;
      } else {
        if (n > 100) msg = "Keep the number 100 or less.";
        else if (n % t.a) msg = `${n} can't be shared equally into ${t.a} groups. Try a number ${t.a} divides into.`;
        else if (n / t.a > 50) msg = "That makes very big groups. Try a smaller number.";
      }
    }
    $("err").hidden = !msg; $("err").textContent = msg;
    ex.bad = !!msg;
    if (!msg) { ex.a = a; ex.b = b; ex.p = P; ex.n = ex.ns[ex.skill] = n; }
    return !msg;
  }
  function exRender() {
    if (!exCheck()) { svg.replaceChildren(); $("say").textContent = ""; $("next").disabled = $("back").disabled = true; renderProc(); return; }
    draw();
    $("say").textContent = say(ex);
    $("next").disabled = ex.step >= LAST[ex.skill]; $("back").disabled = ex.step <= 0;
    renderProc();
  }
  const restart = () => { ex.step = 0; exRender(); };
  const seg = (sel, on) => document.querySelectorAll(sel).forEach(on);
  seg("[data-skill]", b => b.addEventListener("click", () => {
    ex.skill = b.dataset.skill; seg("[data-skill]", x => x.classList.toggle("on", x === b)); buildAsk(); restart();
  }));
  seg("[data-form]", b => b.addEventListener("click", () => {
    ex.form = b.dataset.form; seg("[data-form]", x => x.classList.toggle("on", x === b)); buildAsk(); restart();
  }));
  $("next").addEventListener("click", () => { if (ex.step < LAST[ex.skill]) { ex.step++; exRender(); } });
  $("back").addEventListener("click", () => { if (ex.step > 0) { ex.step--; exRender(); } });
  $("again").addEventListener("click", restart);
  $("rand").addEventListener("click", () => {
    const q = makeProblem(ex.skill, ex.form);
    Object.assign(ex, { a: q.a, b: q.b, p: q.p, step: 0 }); ex.ns[ex.skill] = q.n;
    buildAsk(); exRender();
  });
  addEventListener("keydown", e => {
    if (mode !== "learn" || e.target.matches("input")) return;
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "ArrowLeft") $("back").click();
  });

  // ---------- practice ----------
  // Each question is worked on the board: a strip to cut into equal parts and fill in, or the procedure with boxes.
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  function makeProblem(skill, form) {
    let a, b, P = 50;
    if (form === "pct") { P = pick(PCTS); b = P % 10 ? 4 : 10; a = P * b / 100; }
    else { do { b = rnd(2, 10); a = rnd(1, b - 1); } while (gcd(a, b) > 1 && Math.random() < 0.8); }
    // s is one part: small enough for mental math, and the numbers stay friendly
    let s, n;
    if (skill === "part") { do { s = rnd(2, 12); n = b * s; } while (n > 120); }
    else { do { s = rnd(2, 25); n = a * s; } while (n > 100 || n < 4); }
    return { skill, form, a, b, p: P, n, step: 0 };
  }
  let pSkill = "mix", pForm = "mix", pWay = "strip", right = 0, tried = 0;
  const pb = $("pb");
  const bx = (id, cls = "") => `<input id="${id}" class="bx ${cls}" type="text" inputmode="numeric" autocomplete="off" aria-label="Box">`;
  const cxb = (v, id, dn) => `<span class="cx${dn ? " dn" : ""}"><s>${v}</s>${bx(id, "sup")}</span>`;
  const fq = p => p.form === "pct" ? `<span class="f">${p.p}%</span>` : `<span class="f">${hf(p.a, p.b)}</span>`;

  function newQuestion() {
    pq = makeProblem(pSkill === "mix" ? pick(["part", "whole"]) : pSkill, pForm === "mix" ? pick(["frac", "pct"]) : pForm);
    Object.assign(pq, { k: 1, v: {}, done: false, counted: false });
    $("fb").className = "fb"; $("fb").textContent = "Fill in the boxes on the board, then press Check.";
    renderP();
  }
  // The question, with the answer box where the ? goes.
  function qLine(p) {
    return p.skill === "part"
      ? `<div class="pq">${fq(p)}<span class="w">of</span><span class="n">${p.n}</span><span>=</span>${bx("pa", "ans")}</div>`
      : `<div class="pq"><span class="n">${p.n}</span><span class="w">is</span>${fq(p)}<span class="w">of</span>${bx("pa", "ans")}</div>`;
  }
  function stripHTML(p) {
    const I = info(p), k = p.k, ok = k === I.b;
    const lbl = p.form === "pct" ? `${+(100 / k).toFixed(1)}%` : hf(1, k);
    let cells = "";
    for (let i = 0; i < k; i++) cells += `<div class="cell${ok && i < I.a ? " on" : ""}"><span class="fl">${k > 1 ? lbl : ""}</span>${bx("c" + i)}</div>`;
    const over = p.skill === "whole" && ok ? `<div class="over" style="width:${100 * I.a / k}%"><span>${p.n}</span></div>` : `<div style="height:${p.skill === "whole" ? "calc(2.4rem + 16px)" : "0"}"></div>`;
    return `${qLine(p)}
      <div class="cutrow">Cut the strip into <button type="button" id="kDn" aria-label="Fewer parts">−</button><output>${k}</output><button type="button" id="kUp" aria-label="More parts">+</button> equal parts</div>
      <div>${over}<div class="strip">${cells}</div>
      <div class="under"><span>the whole = <b>${p.skill === "part" ? p.n : "?"}</b></span></div></div>`;
  }
  function procHTML(p) {
    const I = info(p), F = fq(p), L = (h, nt) => `<div class="pl">${h}${nt ? `<span class="nt">${nt}</span>` : ""}</div>`;
    const conv = p.form === "pct" ? L(`<span class="f">${p.p}%</span> = ${hf(p.p, 100)} = ${hf(bx("q1"), bx("q2"))}`, "as a fraction") : "";
    if (p.skill === "part") return `<div class="plines">
      ${L(`${F} of <span class="n">${p.n}</span>`)}${conv}
      ${L(`= ${hf(I.a, I.b)} × ${hf(p.n, 1)}`, "“of” means ×")}
      ${L(`= ${hf(`${I.a} × ${cxb(p.n, "c1")}`, `${cxb(I.b, "c2", true)} × 1`)}`, "cancel")}
      ${L(`= ${bx("pa", "ans")}`)}</div>`;
    return `<div class="plines">
      ${L(`${F} of ? = <span class="n">${p.n}</span>`)}${conv}
      ${L(`${hf(I.a, I.b)} × ? = ${p.n}`, "“of” means ×")}
      ${L(`? = ${hf(p.n, 1)} × ${hf(bx("f1"), bx("f2"))}`, `multiply by the flip of ${I.a}/${I.b}`)}
      ${gcd(p.n, I.a) > 1 ? L(`= ${hf(`${cxb(p.n, "c1")} × ${I.b}`, `1 × ${cxb(I.a, "c2", true)}`)}`, "cancel") : ""}
      ${L(`= ${bx("pa", "ans")}`)}</div>`;
  }
  function renderP() {
    pb.innerHTML = pWay === "strip" ? stripHTML(pq) : procHTML(pq);
    pb.querySelectorAll(".bx").forEach(i => {
      if (pq.v[i.id] != null) i.value = pq.v[i.id];
      i.disabled = pq.done;
      i.addEventListener("input", () => { pq.v[i.id] = i.value; i.classList.remove("bad", "good"); });
      i.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
    });
    if (pWay === "strip") {
      const setK = k => { if (pq.done) return; pq.k = Math.max(1, Math.min(12, k)); for (const id in pq.v) if (id[0] === "c") delete pq.v[id]; renderP(); };
      $("kDn").onclick = () => setK(pq.k - 1);
      $("kUp").onclick = () => setK(pq.k + 1);
      $("kDn").disabled = pq.done || pq.k <= 1; $("kUp").disabled = pq.done || pq.k >= 12;
    }
    $("check").disabled = $("showme").disabled = pq.done;
  }
  function tally(ok) {
    if (pq.counted) return;
    pq.counted = true; tried++; if (ok) right++;
    $("right").textContent = right; $("tried").textContent = tried;
  }
  const val = id => int(pq.v[id] ?? "");
  const mark = (ids, good) => ids.forEach(id => { const e = $(id); if (e) { e.classList.toggle("good", good); e.classList.toggle("bad", !good); } });
  function no(msg) { tally(false); $("fb").className = "fb no"; $("fb").textContent = msg; }
  // The right values for every box, for checking and for Show me.
  function key(p) {
    const I = info(p), K = { pa: I.ans };
    if (p.form === "pct" && pWay === "proc") Object.assign(K, { q1: I.a, q2: I.b });
    if (pWay === "strip") { for (let i = 0; i < I.b; i++) K["c" + i] = I.s; }
    else if (p.skill === "part") { const g = gcd(p.n, I.b); Object.assign(K, { c1: p.n / g, c2: I.b / g }); }
    else { Object.assign(K, { f1: I.b, f2: I.a }); const g = gcd(p.n, I.a); if (g > 1) Object.assign(K, { c1: p.n / g, c2: I.a / g }); }
    return K;
  }
  function check() {
    if (pq.done) return;
    const I = info(pq), F = ftext(pq);
    if (val("pa") === I.ans) return ok();
    if (pWay === "strip") {
      if (pq.k !== I.b) return no(`${pq.form === "pct" ? `${pq.p}% = ${I.a}/${I.b}. ` : ""}Look at the denominator. How many equal parts make the whole?`);
      const ids = Array.from({ length: I.b }, (_, i) => "c" + i), bad = ids.filter(id => val(id) !== I.s);
      mark(ids.filter(id => !bad.includes(id)), true); mark(bad, false);
      if (bad.length) return no(pq.skill === "part"
        ? `The ${I.b} parts are equal, and together they make ${pq.n}. What goes in each part?`
        : `${I.a} equal part${I.a > 1 ? "s" : ""} make${I.a > 1 ? "" : "s"} ${pq.n}. What goes in each part?`);
      mark(["pa"], false);
      return no(pq.skill === "part" ? `Add the ${I.a} shaded part${I.a > 1 ? "s" : ""}.` : `The whole is all ${I.b} parts together.`);
    }
    // procedure
    if (pq.form === "pct") {
      const a = val("q1"), b = val("q2");
      if (!(a >= 1 && b >= 1 && a * 100 === b * pq.p)) { mark(["q1", "q2"], false); return no(`Write ${pq.p}/100 as an equal fraction.`); }
      mark(["q1", "q2"], true);
    }
    if (pq.skill === "whole") {
      if (val("f1") !== I.b || val("f2") !== I.a) { mark(["f1", "f2"], false); return no(`Flip ${I.a}/${I.b} upside down.`); }
      mark(["f1", "f2"], true);
    }
    if ($("c1")) {
      const den = pq.skill === "part" ? I.b : I.a, c1 = val("c1"), c2 = val("c2");
      if (!(c1 >= 1 && c2 >= 1 && c1 * den === pq.n * c2 && c1 < pq.n)) { mark(["c1", "c2"], false); return no(`Cancel: ${pq.n} and ${den} share a factor. Write what is left of each.`); }
      mark(["c1", "c2"], true);
    }
    mark(["pa"], false);
    return no("Multiply what is left on top. The bottom is 1.");
  }
  function finish() {
    pq.done = true;
    if (pWay === "strip") pq.k = info(pq).b;
    Object.assign(pq.v, key(pq));
    renderP();
    pb.querySelectorAll(".bx").forEach(i => i.classList.add("good"));
  }
  function ok() { tally(true); $("fb").className = "fb ok"; $("fb").textContent = "Correct!"; finish(); }
  $("check").addEventListener("click", check);
  $("showme").addEventListener("click", () => { if (pq.done) return; tally(false); $("fb").className = "fb"; $("fb").textContent = "Here it is worked out."; finish(); });
  $("newq").addEventListener("click", newQuestion);
  seg("[data-pskill]", b => b.addEventListener("click", () => {
    pSkill = b.dataset.pskill; seg("[data-pskill]", x => x.classList.toggle("on", x === b)); newQuestion();
  }));
  seg("[data-pform]", b => b.addEventListener("click", () => {
    pForm = b.dataset.pform; seg("[data-pform]", x => x.classList.toggle("on", x === b)); newQuestion();
  }));
  seg("[data-pway]", b => b.addEventListener("click", () => {
    pWay = b.dataset.pway; seg("[data-pway]", x => x.classList.toggle("on", x === b)); newQuestion();
  }));

  // ---------- mode switch ----------
  seg("[data-mode]", b => b.addEventListener("click", () => {
    if (b.dataset.mode === mode) return;
    mode = b.dataset.mode;
    seg("[data-mode]", x => x.classList.toggle("on", x === b));
    const pr = mode === "practice";
    $("learn").hidden = pr; $("practice").hidden = !pr;
    svg.style.display = pr ? "none" : ""; pb.hidden = !pr; $("procCard").hidden = pr;  // an <svg> has no .hidden property
    if (pr) { if (!pq) newQuestion(); }
    else exRender();
  }));

  buildAsk();
  exRender();
  // Text widths are measured, so redraw once the fonts arrive.
  if (document.fonts) document.fonts.ready.then(() => draw());
})();
</script>

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }

    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;

      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;

    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);

    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");

    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];

    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
