<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Sequences and Series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Sequences and Series (Alberta Math 20-1): arithmetic tₙ = t₁ + (n − 1)d and geometric tₙ = t₁rⁿ⁻¹,
   with the sums Sₙ and S∞. The board shows the first terms as cards (with the +d or ×r jump between them)
   and a bar for each term, so arithmetic grows in a straight line and geometric curves.
   Colours: term numbers n blue, t₁ purple, d green, r orange. */
:root { --purple: #7a3fc4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --purple: #b98cff; } }
:root[data-theme="dark"] { --purple: #b98cff; }
h1 { font-size: clamp(1.4rem, 2.6vw, 2rem); }
h1 .m { color: var(--pt); }
.tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; font-size: 1rem; padding: 9px 14px; }
.seg button:first-child { border-radius: 10px 0 0 10px; }
.seg button:last-child { border-radius: 0 10px 10px 0; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.main { grid-template-columns: minmax(0, 1.2fr) minmax(420px, 1fr); gap: 16px; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
.panel { gap: 10px; }
.card { padding: 10px 14px; }
.card .label { margin-bottom: 6px; }
.find { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.find .label { margin: 0 4px 0 0; }
.find button { font-size: 0.92rem; padding: 6px 9px; }
.find button[aria-pressed="true"] { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.q { margin: 0 0 6px; font-size: 1.2rem; font-weight: 700; line-height: 1.35; }
.seq { font-family: var(--font-num); font-weight: 700; font-size: 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.mono { font-family: var(--font-num); font-weight: 700; }
sup { font-size: 0.62em; vertical-align: 0.6em; line-height: 0; }
.frac { font-size: 0.85em; vertical-align: middle; }
/* Work: one line per step, every = lined up, the step's name in a column on the right. */
.work { display: grid; grid-template-columns: max-content max-content max-content minmax(0, 1fr); column-gap: 10px; row-gap: 3px; align-items: center;
  font-family: var(--font-num); font-weight: 700; font-size: 1.22rem; }
.work .l { justify-self: end; text-align: right; }
.work .why { justify-self: end; text-align: right; font-family: var(--font-body); font-size: 0.9rem; color: var(--muted); font-weight: 700; padding-left: 10px; }
.work .note { grid-column: 1 / -1; font-family: var(--font-body); font-size: 1.05rem; color: var(--ink); }
.work .new { animation: fadein .35s ease-out; }
.work .ans { color: var(--green); }
.work .empty { grid-column: 1 / -1; color: var(--muted); font-family: var(--font-body); font-weight: 700; font-size: 1rem; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
/* The work scrolls inside its own card, so the question and the buttons stay in view. */
.panel > .card.grow { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.seq .frac { margin: 0 4px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.go { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.bar button { font-size: 1.05rem; padding: 9px 16px; }
.bar button:disabled { opacity: 0.4; cursor: default; }
.bar .grow { margin-left: auto; }
/* Practice */
.arow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: var(--font-num); font-weight: 700; font-size: 1.5rem; }
.in { font: inherit; font-family: var(--font-num); font-weight: 700; font-size: 1.4rem; width: 5.2em; padding: 4px 8px; border: 2px solid var(--grid-major); border-radius: 8px; background: var(--sheet); color: var(--ink); }
.in.sm { width: 3.6em; }
.in.ok { border-color: var(--green); } .in.bad { border-color: var(--warn); }
.pick button { font-size: 1.1rem; padding: 9px 16px; }
.pick button.ok { background: var(--green); color: var(--sheet); border-color: var(--green); }
.pick button.bad { border-color: var(--warn); color: var(--warn); text-decoration: line-through; }
.fb { margin: 8px 0 0; font-weight: 700; min-height: 1.5em; }
.fb.ok { color: var(--green); } .fb.bad { color: var(--warn); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
.foot .score { color: var(--muted); font-weight: 700; }
.foot .score b { color: var(--ink); font-family: var(--font-num); }
#newQ.ready { background: var(--pt); color: var(--sheet); border-color: var(--pt); }
/* Board drawing */
.cardbox { fill: var(--sheet); stroke: var(--grid-major); stroke-width: 2; }
.cardbox.tgt { stroke: var(--pt); stroke-width: 3; stroke-dasharray: 8 6; }
.cardbox.tgt.done { stroke-dasharray: none; }
.tname { font-family: var(--font-display); font-weight: 800; font-size: 24px; fill: var(--pt); text-anchor: middle; }
.tval { font-family: var(--font-num); font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.tval.q { fill: var(--muted); }
.gapsym { font-family: var(--font-num); font-weight: 700; font-size: 32px; fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
.jump { fill: none; stroke-width: 3; }
.jump.A { stroke: var(--green); } .jump.G { stroke: var(--orange); }
.jlab { font-family: var(--font-num); font-weight: 700; font-size: 24px; text-anchor: middle; paint-order: stroke; stroke: var(--sheet); stroke-width: 6px; stroke-linejoin: round; }
.jlab.A { fill: var(--green); } .jlab.G { fill: var(--orange); }
.axis { stroke: var(--muted); stroke-width: 2; }
.b1 { fill: var(--purple); } .bd { fill: var(--green); }
.bA { fill: var(--green); fill-opacity: 0.55; } .bG { fill: var(--orange); fill-opacity: 0.6; }
.sep { stroke: var(--sheet); stroke-width: 1.5; }
.hi { fill: none; stroke: var(--pt); stroke-width: 4; }
.copy { fill: var(--orange); fill-opacity: 0.22; stroke: var(--orange); stroke-width: 1.5; stroke-dasharray: 5 4; }
.dash { stroke: var(--pt); stroke-width: 2.5; stroke-dasharray: 9 7; }
.dash.o { stroke: var(--orange); }
.psum { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 6 5; }
.pdot { fill: var(--ink); stroke: var(--sheet); stroke-width: 2; }
.vlab { font-family: var(--font-num); font-weight: 700; font-size: 20px; fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.nlab { font-family: var(--font-num); font-weight: 700; font-size: 20px; fill: var(--pt); text-anchor: middle; }
.leg { font-family: var(--font-num); font-weight: 700; font-size: 22px; paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.leg.p { fill: var(--purple); } .leg.g { fill: var(--green); } .leg.o { fill: var(--orange); } .leg.b { fill: var(--pt); } .leg.k { fill: var(--ink); }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Sequences <span class="m">and Series</span></h1></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Learn or practice">
        <button type="button" data-mode="learn" aria-pressed="true">Learn</button>
        <button type="button" data-mode="practice" aria-pressed="false">Practice</button>
      </div>
      <div class="seg" role="group" aria-label="Kind of sequence">
        <button type="button" data-kind="A" aria-pressed="true">Arithmetic</button>
        <button type="button" data-kind="G" aria-pressed="false">Geometric</button>
        <button type="button" data-kind="M" aria-pressed="false">Mixed</button>
      </div>
      <div class="seg" role="group" aria-label="Level">
        <button type="button" data-level="1" aria-pressed="true">Level 1</button>
        <button type="button" data-level="2" aria-pressed="false">Level 2</button>
      </div>
    </div>
  </header>

  <div class="main">
    <div class="board">
      <svg id="svg" viewBox="0 0 1000 680" role="img" aria-label="The first terms as cards, and a bar for each term"></svg>
    </div>

    <div class="panel">
      <div class="card">
        <div class="find" id="find"></div>
      </div>
      <div class="card">
        <p class="q" id="q"></p>
        <div class="seq" id="seq"></div>
      </div>

      <!-- Learn: Next step reveals the work one line at a time -->
      <div class="card grow" id="learnWork">
        <div class="work" id="work"></div>
      </div>
      <div class="bar" id="learnBar">
        <button type="button" id="back">Back</button>
        <button type="button" id="next" class="go">Next step</button>
        <button type="button" id="newEx" class="grow">New example</button>
      </div>

      <!-- Practice: answer, Check, Hint (one more line of work), Show me (all of it) -->
      <div class="card" id="pracCard" hidden>
        <div id="pickRow" hidden>
          <p class="q">Is it arithmetic or geometric?</p>
          <div class="bar pick" id="pick">
            <button type="button" data-k="A">Arithmetic (+ d)</button>
            <button type="button" data-k="G">Geometric (× r)</button>
          </div>
        </div>
        <div id="ansRow">
          <div class="arow" id="arow"></div>
          <div class="bar" style="margin-top:10px">
            <button type="button" id="check" class="go">Check</button>
            <button type="button" id="hint">Hint</button>
            <button type="button" id="show">Show me</button>
          </div>
        </div>
        <p class="fb" id="fb"></p>
      </div>
      <div class="card grow" id="pracWork" hidden>
        <div class="work" id="pwork"></div>
      </div>
      <div class="foot" id="pracFoot" hidden>
        <span class="score">First try: <b id="score">0 of 0</b></span>
        <button type="button" id="newQ">New question</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const svg = $("svg");
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // ---------- Exact numbers (fractions), so 1/3 stays 1/3 ----------
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const Q = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const dec = x => Q(Math.round(x * 10000), 10000);
  const add = (a, b) => Q(a.n * b.d + b.n * a.d, a.d * b.d);
  const sub = (a, b) => Q(a.n * b.d - b.n * a.d, a.d * b.d);
  const mul = (a, b) => Q(a.n * b.n, a.d * b.d);
  const div = (a, b) => Q(a.n * b.d, a.d * b.n);
  const pow = (a, k) => { let r = Q(1); for (let i = 0; i < k; i++) r = mul(r, a); return r; };
  const neg = a => Q(-a.n, a.d), abs = a => Q(Math.abs(a.n), a.d);
  const val = a => a.n / a.d;
  const eq = (a, b) => a.n === b.n && a.d === b.d;
  const isInt = a => a.d === 1;
  const ONE = Q(1);
  // A fraction ends as a decimal when its bottom is made of 2s and 5s only.
  const terminates = a => { let d = a.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1 && a.d <= 100000; };
  const M = "−";
  const decStr = a => { const v = Math.abs(val(a)); return (a.n < 0 ? M : "") + String(+v.toFixed(10)); };

  // How numbers are written for the current question: whole numbers, decimals, or fractions.
  let FL = "int";
  const frac = (t, b) => `<span class="frac"><span>${t}</span><span>${b}</span></span>`;
  function fH(a) {
    if (isInt(a)) return (a.n < 0 ? M : "") + Math.abs(a.n);
    if (FL === "dec" && terminates(a)) return decStr(a);
    return (a.n < 0 ? M : "") + frac(Math.abs(a.n), a.d);
  }
  function fT(a) {   // plain text (board, step names)
    if (isInt(a)) return (a.n < 0 ? M : "") + Math.abs(a.n);
    if (FL === "dec" && terminates(a)) return decStr(a);
    return (a.n < 0 ? M : "") + Math.abs(a.n) + "/" + a.d;
  }
  const br = a => `(${fH(a)})`;                                  // always in brackets: (5), (−2)
  const brNeg = a => (a.n < 0 ? br(a) : fH(a));                  // brackets only when negative
  const base = a => (isInt(a) && a.n > 0 ? fH(a) : br(a));       // a power's base: 2, (−2), (1/2)
  const plus = (a, b) => `${fH(a)} ${b.n < 0 ? M : "+"} ${fH(abs(b))}`;
  const SUBS = "₀₁₂₃₄₅₆₇₈₉";
  const subs = k => String(k).replace(/\d/g, c => SUBS[c]);
  const tN = k => `t<sub>${k}</sub>`, sN = k => `S<sub>${k}</sub>`;          // in the panel
  const tNu = k => "t" + subs(k), sNu = k => "S" + subs(k);                 // on the board
  const SINF = "S<sub>∞</sub>", TN = "t<sub>n</sub>";
  // dn + k written simply: 5n − 3, n + 4, −2n, (3/4)n − 1/4
  function lin(c, k) {
    let s = eq(c, ONE) ? "n" : eq(c, neg(ONE)) ? M + "n" : `${fH(c)}n`;
    if (k.n !== 0) s += ` ${k.n < 0 ? M : "+"} ${fH(abs(k))}`;
    return s;
  }
  function linT(c, k) {
    let s = eq(c, ONE) ? "n" : eq(c, neg(ONE)) ? M + "n" : `${fT(c)}n`;
    if (k.n !== 0) s += ` ${k.n < 0 ? M : "+"} ${fT(abs(k))}`;
    return s;
  }
  const SUPD = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹" };

  // ---------- Questions ----------
  // A problem: kind A (t₁, d) or G (t₁, r); type term | which | general | count | sum; n; infinite sums for −1 < r < 1.
  const TYPES = ["term", "which", "general", "count", "sum"];
  const TYPE_NAME = { any: "Any", term: "A term", which: "Which term", general: "General term", count: "How many terms", sum: "Sum" };

  function genA(level, type) {
    let t1, d, flav = "int";
    if (level === 1) { t1 = Q(rnd(1, 12)); d = Q(rnd(2, 9)); }
    else if (Math.random() < 0.6) {
      flav = "dec";
      const den = pick([2, 4, 10]);
      const dn = { 2: [1, 3, 5, -1, -3, -5], 4: [1, 3, 5, -1, -3], 10: [2, 4, 12, 15, -5, -8, 25] }[den];
      t1 = Q(rnd(-3 * den, 10 * den), den); d = Q(pick(dn), den);
    } else {
      flav = "frac";
      const den = pick([2, 3, 4]);
      do { d = Q(pick([1, 2, 3, 5, -1, -2]), den); } while (isInt(d));
      t1 = Q(rnd(-2 * den, 6 * den), den);
    }
    const lo = level === 1 ? 8 : 6, hi = level === 1 ? 20 : 15;
    const n = type === "sum" ? rnd(level === 1 ? 6 : 5, level === 1 ? 12 : 10) : type === "general" ? 6 : rnd(lo, hi);
    return { kind: "A", t1, d, flav, type, n, level };
  }
  // Geometric choices keep every term small and friendly: [r, flavour, first terms, largest n]
  const G1 = [[2, [1, 5], 9], [2, [1, 5], 9], [3, [1, 4], 6], [3, [1, 4], 6], [4, [1, 3], 5], [5, [1, 2], 5]];
  const G2 = [
    [Q(1, 2), "frac", [64, 128, 96, 160, 48], 7], [Q(1, 3), "frac", [81, 243, 162, 54], 6],
    [Q(-2), "int", [1, 2, 3, 4, 5], 8], [Q(-3), "int", [1, 2, 3, 4], 6], [Q(-1, 2), "frac", [64, 32, 128], 7],
    [Q(1, 2), "dec", [100, 40, 80, 20], 6], [Q(3, 2), "dec", [16, 32, 64], 6], [Q(2, 3), "frac", [81, 243], 6],
    [Q(1, 10), "dec", [2000, 5000, 3000], 6]];
  function genG(level, type) {
    let t1, r, flav = "int", nmax;
    // Which term / how many terms need at least one hidden term between t₄ and the last one.
    const need = type === "which" || type === "count" ? 6 : 4;
    let c;
    do c = pick(level === 1 ? G1 : G2); while (c.at(-1) < need);
    if (level === 1) { r = Q(c[0]); t1 = Q(rnd(c[1][0], c[1][1])); nmax = c[2]; }
    else { r = c[0]; flav = c[1]; t1 = Q(pick(c[2])); nmax = c[3]; }
    const inf = type === "sum" && Math.abs(val(r)) < 1 && Math.random() < 0.5;
    let n = type === "sum" ? rnd(4, Math.min(nmax, level === 1 ? 7 : 6)) : type === "general" ? 6 : rnd(need === 6 ? 6 : 5, nmax);
    // A decimal sum needs rⁿ: keep it to 4 decimal places (1.5⁴ = 5.0625, not 1.5⁶ = 11.390625).
    if (type === "sum" && flav === "dec" && !inf) while (n > 3 && 10000 % pow(r, n).d) n--;
    return { kind: "G", t1, r, flav, type, n, inf, level };
  }
  const T = (p, k) => p.kind === "A" ? add(p.t1, mul(Q(k - 1), p.d)) : mul(p.t1, pow(p.r, k - 1));
  const S = (p, k) => { let s = Q(0); for (let i = 1; i <= k; i++) s = add(s, T(p, i)); return s; };
  const SInf = p => div(p.t1, sub(ONE, p.r));
  function answerOf(p) {
    if (p.type === "term") return T(p, p.n);
    if (p.type === "which" || p.type === "count") return Q(p.n);
    if (p.type === "sum") return p.inf ? SInf(p) : S(p, p.n);
    return null;   // general: two boxes
  }

  // ---------- The work, as steps (each step is one or more lines) ----------
  // A line: { l, r, why } is "l = r   why"; { note } is a sentence across the work. Flags set what the board shows.
  function findJump(p, mixed) {
    const [a, b, c] = [T(p, 1), T(p, 2), T(p, 3)];
    const out = [];
    const diff = (x, y) => ({ l: `${fH(y)} ${M} ${brNeg(x)}`, r: fH(sub(y, x)), why: "difference" });
    const ratio = (x, y) => ({ l: frac(fH(y), fH(x)), r: fH(div(y, x)), why: "ratio" });
    // Mixed: test the differences (and the ratios). Once the work moves on, only the verdict stays, to keep the panel short.
    const fold = g => Object.assign(g, { fold: true });
    if (mixed) {
      out.push(fold([diff(a, b), diff(b, c)]));
      if (p.kind === "A") out.push([{ note: "Same difference each time, so it is arithmetic." }, { l: "d", r: fH(p.d), why: "common difference", arrows: true }]);
      else out.push(fold([{ note: "Not the same. Check the ratios." }, ratio(a, b), ratio(b, c)]),
        [{ note: "Same ratio each time, so it is geometric." }, { l: "r", r: fH(p.r), why: "common ratio", arrows: true }]);
      return out;
    }
    if (p.kind === "A") out.push([{ l: "d", r: `${fH(b)} ${M} ${brNeg(a)}`, why: "difference" }, { l: "", r: fH(p.d), arrows: true }]);
    else out.push([{ l: "r", r: frac(fH(b), fH(a)), why: "ratio" }, { l: "", r: fH(p.r), arrows: true }]);
    return out;
  }

  function solve(p, mixed) {
    FL = p.flav;
    const steps = findJump(p, mixed);
    // A line that only repeats the one above (153/2 = 153/2) is dropped; its flags move up.
    const s = (...lines) => {
      const prev = steps.at(-1)?.at(-1), L = lines[0];
      if (lines.length === 1 && prev && L.l === "" && L.r === prev.r) { Object.assign(prev, L, { why: prev.why }); return; }
      steps.push(lines);
    };
    const { t1, n } = p;
    if (p.kind === "A") {
      const d = p.d, tn = T(p, n);
      const FORM = { l: TN, r: "t<sub>1</sub> + (n − 1)d", why: "formula" };
      if (p.type === "term") {
        s(FORM);
        s({ l: tN(n), r: `${fH(t1)} + (${n} − 1)${br(d)}`, why: "substitute" });
        s({ l: "", r: `${fH(t1)} + ${n - 1}${br(d)}`, why: "brackets first" });
        s({ l: "", r: plus(t1, mul(Q(n - 1), d)), why: "multiply" });
        s({ l: "", r: fH(tn), why: "add", ans: true, reveal: true });
      } else if (p.type === "which" || p.type === "count") {
        if (p.type === "count") s({ l: TN, r: fH(tn), why: "the last term" });
        s(FORM);
        s({ l: fH(tn), r: `${fH(t1)} + (n − 1)${br(d)}`, why: "substitute" });
        const rest = sub(tn, t1);
        s({ l: fH(rest), r: `(n − 1)${br(d)}`, why: t1.n >= 0 ? `subtract ${fT(t1)} from both sides` : `add ${fT(abs(t1))} to both sides` });
        if (isInt(d) || (FL === "dec" && terminates(d))) s({ l: frac(fH(rest), fH(d)), r: "n − 1", why: `divide both sides by ${fT(d)}` }, { l: String(n - 1), r: "n − 1" });
        else { const rc = div(ONE, d); s({ l: `${fH(rest)}${br(rc)}`, r: "n − 1", why: `multiply both sides by ${fT(rc)}` }, { l: String(n - 1), r: "n − 1" }); }
        s({ l: String(n), r: "n", why: "add 1 to both sides", ans: true, reveal: true });
      } else if (p.type === "general") {
        s(FORM);
        s({ l: TN, r: `${fH(t1)} + (n − 1)${br(d)}`, why: "substitute" });
        s({ l: "", r: `${fH(t1)} ${d.n < 0 ? M : "+"} ${lin(abs(d), Q(0))} ${d.n < 0 ? "+" : M} ${fH(abs(d))}`, why: "distribute" });
        s({ l: "", r: lin(d, sub(t1, d)), why: "combine like terms", ans: true, reveal: true });
      } else {
        const sn = S(p, n), pair = add(t1, tn);
        s({ l: tN(n), r: `${fH(t1)} + (${n} − 1)${br(d)}`, why: "find the last term" }, { l: "", r: fH(tn), tn: true });
        s({ l: "S<sub>n</sub>", r: frac("n(t<sub>1</sub> + t<sub>n</sub>)", "2"), why: "formula", pair: true });
        s({ l: sN(n), r: frac(`${n}(${plus(t1, tn)})`, "2"), why: "substitute" });
        s({ l: "", r: frac(`${n}${br(pair)}`, "2"), why: "add" });
        s({ l: "", r: frac(fH(mul(Q(n), pair)), "2"), why: "multiply" });
        s({ l: "", r: fH(sn), why: "simplify", ans: true, reveal: true });
      }
    } else {
      const r = p.r, tn = T(p, n);
      const FORM = { l: TN, r: "t<sub>1</sub>r<sup>n − 1</sup>", why: "formula" };
      if (p.type === "term") {
        s(FORM);
        s({ l: tN(n), r: `${fH(t1)}${br(r)}<sup>${n} − 1</sup>`, why: "substitute" });
        s({ l: "", r: `${fH(t1)}${br(r)}<sup>${n - 1}</sup>`, why: "exponent" });
        s({ l: "", r: `${fH(t1)}${br(pow(r, n - 1))}`, why: "power" });
        s({ l: "", r: fH(tn), why: "multiply", ans: true, reveal: true });
      } else if (p.type === "which" || p.type === "count") {
        if (p.type === "count") s({ l: TN, r: fH(tn), why: "the last term" });
        s(FORM);
        s({ l: fH(tn), r: `${fH(t1)}${br(r)}<sup>n − 1</sup>`, why: "substitute" });
        const q = div(tn, t1);
        if (!eq(t1, ONE)) {
          if (isInt(tn) && isInt(t1)) s({ l: frac(fH(tn), fH(t1)), r: `${base(r)}<sup>n − 1</sup>`, why: `divide both sides by ${fT(t1)}` }, { l: fH(q), r: `${base(r)}<sup>n − 1</sup>` });
          else s({ l: fH(q), r: `${base(r)}<sup>n − 1</sup>`, why: `divide both sides by ${fT(t1)}` });
        }
        s({ l: `${base(r)}<sup>${n - 1}</sup>`, r: `${base(r)}<sup>n − 1</sup>`, why: `write as a power of ${fT(r)}` });
        s({ l: String(n - 1), r: "n − 1", why: "exponents match" });
        s({ l: String(n), r: "n", why: "add 1 to both sides", ans: true, reveal: true });
      } else if (p.type === "general") {
        s(FORM);
        s({ l: TN, r: `${fH(t1)}${br(r)}<sup>n − 1</sup>`, why: "substitute", ans: true, reveal: true });
        s({ note: "Keep the power. Do not multiply t<sub>1</sub> by r." });
      } else if (p.inf) {
        const one = sub(ONE, r), sinf = SInf(p);
        s({ l: SINF, r: frac("t<sub>1</sub>", "1 − r"), why: "formula, −1 < r < 1" });
        s({ l: SINF, r: frac(fH(t1), `1 ${M} ${brNeg(r)}`), why: "substitute" });
        s({ l: "", r: frac(fH(t1), fH(one)), why: "subtract" });
        if (!isInt(one) && !(FL === "dec" && terminates(one))) s({ l: "", r: `${fH(t1)}${br(div(ONE, one))}`, why: "multiply by the reciprocal" });
        s({ l: "", r: fH(sinf), why: "simplify", ans: true, reveal: true, partial: true });
      } else {
        const rn = pow(r, n), top = sub(rn, ONE), bot = sub(r, ONE), sn = S(p, n);
        s({ l: "S<sub>n</sub>", r: frac("t<sub>1</sub>(r<sup>n</sup> − 1)", "r − 1"), why: "formula" });
        s({ l: sN(n), r: frac(`${fH(t1)}(${base(r)}<sup>${n}</sup> − 1)`, `${fH(r)} − 1`), why: "substitute" });
        s({ l: "", r: frac(`${fH(t1)}(${fH(rn)} − 1)`, fH(bot)), why: "power" });
        s({ l: "", r: frac(`${fH(t1)}${br(top)}`, fH(bot)), why: "subtract" });
        s({ l: "", r: frac(fH(mul(t1, top)), fH(bot)), why: "multiply" });
        s({ l: "", r: fH(sn), why: eq(bot, ONE) ? "simplify" : "divide", ans: true, reveal: true, partial: true });
      }
    }
    return steps;
  }

  // ---------- Panel text ----------
  function questionHTML(p) {
    FL = p.flav;
    let q;
    if (p.type === "term") q = `Find <span class="mono">${tN(p.n)}</span>.`;
    else if (p.type === "which") q = `Which term is <span class="mono">${fH(T(p, p.n))}</span>?`;
    else if (p.type === "general") q = `Find the general term <span class="mono">t<sub>n</sub></span>.`;
    else if (p.type === "count") q = "How many terms are in this sequence?";
    else if (p.inf) q = "Find the sum of this infinite series.";
    else q = `Find <span class="mono">${sN(p.n)}</span>, the sum of the first ${p.n} terms.`;
    return { q };
  }
  // A finite sum lists its last term; build it without a stray "+ −".
  function seqHTML(p) {
    FL = p.flav;
    const terms = [1, 2, 3, 4].map(k => T(p, k));
    if (p.type === "sum") {
      const sg = t => ` ${t.n < 0 ? M : "+"} ${fH(abs(t))}`;
      return fH(terms[0]) + terms.slice(1).map(sg).join("") + " + …" + (p.inf ? "" : sg(T(p, p.n)));
    }
    return terms.map(fH).join(", ") + ", …" + (p.type === "count" ? ", " + fH(T(p, p.n)) : "");
  }

  function renderWork(box, steps, shown, fresh) {
    box.innerHTML = "";
    if (!shown) { box.innerHTML = `<div class="empty">${st.mode === "learn" ? "Press Next step to start." : ""}</div>`; return; }
    const verdict = steps.findIndex(g => g.some(L => L.arrows));
    steps.slice(0, shown).forEach((lines, i) => (lines.fold && shown > verdict + 1 ? [] : lines).forEach(L => {
      const cls = i === shown - 1 && fresh ? " new" : "";
      if (L.note) { box.insertAdjacentHTML("beforeend", `<div class="note${cls}">${L.note}</div>`); return; }
      const a = L.ans ? " ans" : "";
      box.insertAdjacentHTML("beforeend",
        `<div class="l${cls}${a}">${L.l}</div><div class="${cls}${a}">=</div><div class="r${cls}${a}">${L.r}</div><div class="why${cls}">${L.why || ""}</div>`);
    }));
    if (fresh && box.lastElementChild) box.lastElementChild.scrollIntoView({ block: "nearest" });
  }
  function flagsOf(steps, shown) {
    const f = {};
    steps.slice(0, shown).forEach(lines => lines.forEach(L => { for (const k of ["arrows", "reveal", "pair", "partial", "tn"]) if (L[k]) f[k] = true; }));
    return f;
  }

  // ---------- The board ----------
  const fitsScreen = matchMedia("(min-width: 861px) and (min-height: 520px)");
  function draw(p, f) {
    FL = p.flav;
    svg.innerHTML = "";
    const W = 1000;
    let H = 680;
    if (fitsScreen.matches && svg.clientWidth > 0) H = Math.max(560, Math.min(900, W * svg.clientHeight / svg.clientWidth));
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const kind = p.kind;

    // Cards: the four given terms, then … and the term the question is about.
    const cw = 140, gap = 40, y0 = 62, ch = 116;
    const cx = i => 30 + i * (cw + gap);
    const series = p.type === "sum";
    const gsym = series ? "+" : ",";
    const card = (x, w, name, value, opts = {}) => {
      el("rect", { class: "cardbox" + (opts.tgt ? " tgt" : "") + (opts.done ? " done" : ""), x, y: y0, width: w, height: ch, rx: 12 }, svg);
      el("text", { class: "tname", x: x + w / 2, y: y0 + 32 }, svg, name);
      const len = value.length;
      const size = Math.min(38, (w - 16) / (0.62 * Math.max(1, len)));
      el("text", { class: "tval" + (value === "?" ? " q" : ""), x: x + w / 2, y: y0 + 80, "font-size": size }, svg, value);
    };
    for (let i = 0; i < 4; i++) {
      card(cx(i), cw, tNu(i + 1), fT(T(p, i + 1)));
      if (i < 3) el("text", { class: "gapsym", x: cx(i) + cw + gap / 2, y: y0 + ch / 2 + 6 }, svg, gsym);
    }
    // Jumps between the cards
    if (f.arrows) for (let i = 0; i < 3; i++) {
      const xa = cx(i) + cw * 0.62, xb = cx(i + 1) + cw * 0.38, mid = (xa + xb) / 2;
      el("path", { class: "jump " + kind, d: `M${xa} ${y0 - 2} Q${mid} ${y0 - 46} ${xb} ${y0 - 2}` }, svg);
      el("path", { class: "jump " + kind, d: `M${xb - 9} ${y0 - 12} L${xb} ${y0 - 2} L${xb + 4} ${y0 - 14}` }, svg);
      const lab = kind === "A" ? (p.d.n < 0 ? fT(p.d) : "+" + fT(p.d)) : "×" + (p.r.n < 0 ? `(${fT(p.r)})` : fT(p.r));
      el("text", { class: "jlab " + kind, x: mid, y: y0 - 28 }, svg, lab);
    }
    const tx = cx(4);
    const ell = (x) => el("text", { class: "gapsym", x, y: y0 + ch / 2 + 6 }, svg, series ? "+ …" : ", …");
    if (p.type === "sum" && p.inf) ell(tx + 30);
    else {
      const far = p.n > 5 || p.type === "which" || p.type === "general";
      if (far) ell(tx + 30); else el("text", { class: "gapsym", x: tx - gap / 2, y: y0 + ch / 2 + 6 }, svg, gsym);
      const x = far ? tx + 80 : tx, w = Math.min(220, W - 20 - x);
      const tv = T(p, p.n);
      if (p.type === "term") card(x, w, tNu(p.n), f.reveal ? fT(tv) : "?", { tgt: true, done: f.reveal });
      else if (p.type === "which" || p.type === "count") card(x, w, f.reveal ? tNu(p.n) : "t?", fT(tv), { tgt: true, done: f.reveal });
      else if (p.type === "general") card(x, w, "tₙ", f.reveal ? (kind === "A" ? linT(p.d, sub(p.t1, p.d)) : `${fT(p.t1)}(${fT(p.r)})ⁿ⁻¹`) : "?", { tgt: true, done: f.reveal });
      else card(x, w, tNu(p.n), f.tn || f.reveal || f.pair ? fT(tv) : "?", { tgt: true, done: f.tn || f.reveal });
    }

    // Bars: one for each term. Which bars show depends on how far the work has gone.
    const top = 250, bottom = H - 50, left = 70, right = W - 30;
    let shownN = 4, finalN;
    if (p.type === "general") finalN = 6;
    else if (p.type === "sum" && p.inf) finalN = 8;
    else finalN = p.n;
    if (f.reveal || f.pair || (p.type === "general")) shownN = finalN;
    const slots = Math.max(6, finalN);
    const slotW = (right - left) / slots, bw = Math.min(64, slotW * 0.68);
    const X = k => left + slotW * (k - 0.5);
    // One scale for the whole question, so bars do not jump when more appear
    const vs = [0];
    for (let k = 1; k <= finalN; k++) vs.push(val(T(p, k)));
    const canPair = kind === "A" && series && !p.inf && vs.every(v => v >= 0);
    if (canPair) vs.push(val(add(p.t1, T(p, p.n))));
    if (kind === "G" && series) for (let k = 1; k <= finalN; k++) vs.push(val(S(p, k)));
    if (kind === "G" && p.inf) vs.push(val(SInf(p)));
    let lo = Math.min(...vs), hi = Math.max(...vs);
    if (hi === lo) hi = lo + 1;
    const pad = (hi - lo) * 0.08;
    hi += pad; if (lo < 0) lo -= pad;
    const Y = v => top + (hi - v) / (hi - lo) * (bottom - top);
    const blocks = kind === "A" && p.flav === "int" && p.t1.n > 0 && p.d.n > 0;

    // Legend
    let lx = left - 40;
    const leg = (cls, txt) => { const t = el("text", { class: "leg " + cls, x: lx, y: top - 26 }, svg, txt); lx += txt.length * 14 + 26; return t; };
    if (blocks) { leg("p", "■ t₁ = " + fT(p.t1)); if (f.arrows) leg("g", "■ d = " + fT(p.d)); }
    else if (kind === "A" && f.arrows) leg("g", "d = " + fT(p.d));
    if (kind === "G" && f.arrows) leg("o", "r = " + fT(p.r));
    if (f.reveal && p.type === "general") leg("b", "tₙ = " + (kind === "A" ? linT(p.d, sub(p.t1, p.d)) : `${fT(p.t1)}(${fT(p.r)})ⁿ⁻¹`));

    el("line", { class: "axis", x1: left - 20, y1: Y(0), x2: right, y2: Y(0) }, svg);
    const target = (p.type === "term" || p.type === "which" || p.type === "count" || (series && !p.inf)) ? p.n : 0;
    const labelAll = slots <= 10;
    for (let k = 1; k <= shownN; k++) {
      const v = val(T(p, k)), x = X(k) - bw / 2;
      if (blocks) {
        const d = val(p.d), t1 = val(p.t1);
        el("rect", { class: "b1", x, y: Y(t1), width: bw, height: Y(0) - Y(t1) }, svg);
        if (k > 1) {
          el("rect", { class: "bd", x, y: Y(v), width: bw, height: Y(t1) - Y(v) }, svg);
          if (Y(0) - Y(d) >= 4) for (let j = 1; j < k; j++) el("line", { class: "sep", x1: x, x2: x + bw, y1: Y(t1 + j * d), y2: Y(t1 + j * d) }, svg);
        }
      } else {
        const y = Math.min(Y(v), Y(0)), h = Math.max(1.5, Math.abs(Y(v) - Y(0)));
        el("rect", { class: kind === "A" ? "bA" : "bG", x, y, width: bw, height: h }, svg);
      }
      if (canPair && f.pair) {
        const v2 = val(T(p, p.n + 1 - k));
        el("rect", { class: "copy", x, y: Y(v + v2), width: bw, height: Y(v) - Y(v + v2) }, svg);
      }
      if (k === target && (f.reveal || f.pair || f.tn)) el("rect", { class: "hi", x: x - 3, y: Math.min(Y(v), Y(0)) - 3, width: bw + 6, height: Math.abs(Y(v) - Y(0)) + 6 }, svg);
      if ((labelAll || k <= 4 || k === target || k === shownN) && !(k === target && (p.type === "which" || p.type === "count"))) {
        const yl = v >= 0 ? Y(v) - 10 : Y(v) + 24;
        if (!(canPair && f.pair)) el("text", { class: "vlab", x: X(k), y: yl }, svg, fT(T(p, k)));
      }
      if (slots <= 12 || k <= 4 || k % 5 === 0 || k === target) el("text", { class: "nlab", x: X(k), y: H - 20 }, svg, String(k));
    }
    el("text", { class: "nlab", x: left - 40, y: H - 20, "font-style": "italic" }, svg, "n");
    // Which term: a line at the value we are looking for
    if (p.type === "which" || p.type === "count") {
      const yv = Y(val(T(p, p.n)));
      el("line", { class: "dash", x1: left - 20, x2: right, y1: yv, y2: yv }, svg);
      el("text", { class: "leg b", x: left - 20, y: yv - 10 }, svg, fT(T(p, p.n)));
    }
    // Arithmetic sum: a second copy turned upside down makes every column t₁ + tₙ
    if (canPair && f.pair) {
      const yv = Y(val(add(p.t1, T(p, p.n))));
      el("line", { class: "dash o", x1: left - 20, x2: right, y1: yv, y2: yv }, svg);
      el("text", { class: "leg o", x: right, y: yv - 10, "text-anchor": "end" }, svg, `t₁ + ${tNu(p.n)} = ${fT(add(p.t1, T(p, p.n)))}`);
    }
    // Geometric sum: the running total after each term
    if (kind === "G" && series && f.partial) {
      let d = "";
      for (let k = 1; k <= finalN; k++) d += (k === 1 ? "M" : "L") + X(k) + " " + Y(val(S(p, k)));
      el("path", { class: "psum", d }, svg);
      for (let k = 1; k <= finalN; k++) el("circle", { class: "pdot", cx: X(k), cy: Y(val(S(p, k))), r: 6 }, svg);
      if (p.inf) {
        const yv = Y(val(SInf(p)));
        el("line", { class: "dash", x1: left - 20, x2: right, y1: yv, y2: yv }, svg);
        el("text", { class: "leg b", x: right, y: yv - 12, "text-anchor": "end" }, svg, "S∞ = " + fT(SInf(p)));
      } else el("text", { class: "leg k", x: X(finalN) - 14, y: Y(val(S(p, finalN))) - 16, "text-anchor": "end" }, svg, `${sNu(p.n)} = ${fT(S(p, p.n))}`);
    }
  }

  // ---------- State ----------
  const st = { mode: "learn", kind: "A", level: 1, find: "term", pfind: "any", p: null, steps: [], shown: 0 };
  const pr = { picked: false, shown: 0, done: false, first: true, tries: 0 };
  const score = { ok: 0, total: 0 };
  const isMixed = () => st.kind === "M";

  function newProblem(type) {
    const kind = st.kind === "M" ? pick(["A", "G"]) : st.kind;
    let p, guard = 0;
    do { p = kind === "A" ? genA(st.level, type) : genG(st.level, type); }
    while (st.p && guard++ < 20 && eq(p.t1, st.p.t1) && p.kind === st.p.kind && p.n === st.p.n);
    return p;
  }

  function renderFind() {
    const list = st.mode === "learn" ? TYPES : ["any", ...TYPES];
    const cur = st.mode === "learn" ? st.find : st.pfind;
    $("find").innerHTML = list.map(t => `<button type="button" data-find="${t}" aria-pressed="${t === cur}">${TYPE_NAME[t]}</button>`).join("");
  }
  function renderQuestion() {
    const { q } = questionHTML(st.p);
    $("q").innerHTML = q;
    $("seq").innerHTML = seqHTML(st.p);
  }

  // Learn
  function learnNew(first) {
    st.p = first ? { kind: "A", t1: Q(2), d: Q(5), flav: "int", type: "term", n: 12, level: 1 } : newProblem(st.find);
    st.steps = solve(st.p, isMixed());
    st.shown = 0;
    renderQuestion();
    learnShow(false);
  }
  function learnShow(fresh) {
    renderWork($("work"), st.steps, st.shown, fresh);
    $("back").disabled = st.shown === 0;
    $("next").disabled = st.shown >= st.steps.length;
    $("newEx").classList.toggle("go", st.shown >= st.steps.length);
    draw(st.p, flagsOf(st.steps, st.shown));
  }
  $("next").onclick = () => { if (st.shown < st.steps.length) { st.shown++; learnShow(true); } };
  $("back").onclick = () => { if (st.shown > 0) { st.shown--; learnShow(false); } };
  $("newEx").onclick = () => learnNew(false);

  // Practice
  function pracNew() {
    const type = st.pfind === "any" ? pick(TYPES) : st.pfind;
    st.p = newProblem(type);
    st.steps = solve(st.p, isMixed());
    Object.assign(pr, { picked: !isMixed(), shown: 0, done: false, first: true, tries: 0 });
    renderQuestion();
    $("pick").querySelectorAll("button").forEach(b => { b.className = ""; b.disabled = false; });
    buildAnswer();
    $("fb").textContent = ""; $("fb").className = "fb";
    $("newQ").classList.remove("ready");
    pracShow(false);
  }
  function buildAnswer() {
    const p = st.p; FL = p.flav;
    const box = cls => `<input class="in${cls ? " " + cls : ""}" inputmode="text" autocomplete="off" spellcheck="false">`;
    let h;
    if (p.type === "term") h = `<span>${tN(p.n)}</span> = ${box()}`;
    else if (p.type === "which" || p.type === "count") h = `n = ${box("sm")}`;
    else if (p.type === "sum") h = `<span>${p.inf ? SINF : sN(p.n)}</span> = ${box()}`;
    else if (p.kind === "A") h = `<span>${TN}</span> = ${box("sm")}n + ${box("sm")}`;
    else h = `<span>${TN}</span> = ${box("sm")}<span>(</span>${box("sm")}<span>)<sup>n − 1</sup></span>`;
    $("arow").innerHTML = h;
    $("arow").querySelectorAll("input").forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") check(); }));
  }
  function pracShow(fresh) {
    $("pickRow").hidden = pr.picked;
    $("ansRow").hidden = !pr.picked;
    $("pracWork").hidden = pr.shown === 0;
    renderWork($("pwork"), st.steps, pr.shown, fresh);
    $("hint").disabled = $("show").disabled = pr.done;
    $("check").disabled = pr.done;
    const f = flagsOf(st.steps, pr.shown);
    if (pr.done) Object.assign(f, flagsOf(st.steps, st.steps.length));
    draw(st.p, f);
  }
  $("pick").addEventListener("click", e => {
    const b = e.target.closest("button[data-k]"); if (!b || pr.picked) return;
    if (b.dataset.k === st.p.kind) {
      b.className = "ok";
      pr.picked = true;
      fb(st.p.kind === "A" ? "Yes! The same amount is added each time." : "Yes! Each term is multiplied by the same number.", true);
      if (pr.shown < 2) pr.shown = Math.max(pr.shown, st.steps.findIndex(L => L.some(x => x.arrows)) + 1);
      pracShow(true);
      const i = $("arow").querySelector("input"); if (i) i.focus();
    } else { b.className = "bad"; b.disabled = true; pr.first = false; fb("Not this one. Look at the differences, then the ratios.", false); }
  });
  function fb(text, ok) { $("fb").textContent = text; $("fb").className = "fb " + (ok ? "ok" : "bad"); }

  // Reads 57, −2.5, 3/4, −1 1/2
  function parse(s) {
    s = s.trim().replace(/−/g, "-").replace(/\s+/g, " ");
    if (!s) return null;
    let m;
    if ((m = s.match(/^(-?)(\d+) (\d+)\/(\d+)$/))) { const q = add(Q(+m[2]), Q(+m[3], +m[4])); return m[1] ? neg(q) : q; }
    if ((m = s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/))) { const b = dec(+m[2]); return b.n === 0 ? null : div(dec(+m[1]), b); }
    if (/^-?\d*\.?\d+$/.test(s)) return { ...dec(+s), typed: s };
    return null;
  }
  // Exact, or a rounded decimal (2 places or more) for an answer like 1/3.
  function same(x, a) {
    if (!x) return false;
    if (eq(Q(x.n, x.d), a)) return true;
    return !!x.typed && /\.\d{2,}/.test(x.typed) && !terminates(a) && Math.abs(val(x) - val(a)) < 0.006;
  }
  function check() {
    if (pr.done || !pr.picked) return;
    const p = st.p, ins = [...$("arow").querySelectorAll("input")];
    const vals = ins.map(i => parse(i.value));
    if (vals.some(v => v == null)) { fb("Type a number, like 57, −2.5 or 3/4.", false); return; }
    let oks;
    if (p.type === "general") {
      const want = p.kind === "A" ? [p.d, sub(p.t1, p.d)] : [p.t1, p.r];
      oks = vals.map((v, i) => same(v, want[i]));
    } else oks = [same(vals[0], answerOf(p))];
    ins.forEach((i, k) => { i.classList.toggle("ok", oks[k]); i.classList.toggle("bad", !oks[k]); });
    pr.tries++;
    if (oks.every(Boolean)) {
      if (pr.first && pr.tries === 1) score.ok++;
      score.total++;
      pr.done = true;
      fb("Yes! That's it.", true);
      pr.shown = st.steps.length;
      finish();
    } else { pr.first = false; fb(oks.length > 1 && oks.some(Boolean) ? "One box is right. Check the other one." : "Not yet. Try a Hint.", false); }
  }
  function finish() {
    $("score").textContent = `${score.ok} of ${score.total}`;
    $("newQ").classList.add("ready");
    pracShow(true);
  }
  $("check").onclick = check;
  $("hint").onclick = () => {
    if (pr.done) return;
    pr.first = false;
    if (pr.shown < st.steps.length) pr.shown++;
    if (!pr.picked && st.steps.slice(0, pr.shown).some(L => L.some(x => x.arrows))) { pr.picked = true; }
    pracShow(true);
  };
  $("show").onclick = () => {
    if (pr.done) return;
    pr.picked = true; pr.done = true; pr.shown = st.steps.length;
    score.total++;
    fb("Here is the whole thing. Try a new question.", true);
    $("fb").className = "fb";
    finish();
  };
  $("newQ").onclick = pracNew;

  // ---------- Header switches ----------
  function setPressed(attr, v) { document.querySelectorAll(`[data-${attr}]`).forEach(b => { if (b.closest(".seg")) b.setAttribute("aria-pressed", b.dataset[attr] === String(v)); }); }
  function setMode(m) {
    st.mode = m; setPressed("mode", m);
    const L = m === "learn";
    $("learnWork").hidden = $("learnBar").hidden = !L;
    $("pracCard").hidden = $("pracFoot").hidden = L;
    $("pracWork").hidden = true;
    renderFind();
    st.p = null;
    L ? learnNew(false) : pracNew();
  }
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
  document.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { st.kind = b.dataset.kind; setPressed("kind", st.kind); st.mode === "learn" ? learnNew(false) : pracNew(); });
  document.querySelectorAll("[data-level]").forEach(b => b.onclick = () => { st.level = +b.dataset.level; setPressed("level", st.level); st.mode === "learn" ? learnNew(false) : pracNew(); });
  $("find").addEventListener("click", e => {
    const b = e.target.closest("button[data-find]"); if (!b) return;
    if (st.mode === "learn") { st.find = b.dataset.find; renderFind(); learnNew(false); }
    else { st.pfind = b.dataset.find; renderFind(); pracNew(); }
  });
  addEventListener("resize", () => { if (st.p) st.mode === "learn" ? learnShow(false) : pracShow(false); });

  renderFind();
  learnNew(true);
})();
</script>

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
