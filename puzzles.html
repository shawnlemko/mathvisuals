<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script data-goatcounter="https://shawnlemko.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

<body>
<title>Number and Logic Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
:root { --bad: #c8323c; --purple: #7346c9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bad: #ff6b74; --purple: #b99bff; } }
:root[data-theme="dark"] { --bad: #ff6b74; --purple: #b99bff; }

/* Segmented toggles: one choice pressed at a time. */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--chip); border: 1px solid var(--grid-major); border-radius: 12px; }
.seg button { background: transparent; border: 0; border-radius: 9px; padding: 8px 16px; min-height: 46px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; color: var(--ink); }
.seg button:hover { background: var(--sheet); }
.seg button[aria-pressed="true"] { background: var(--pt); color: var(--sheet); }
.seg.fam button { font-family: var(--font-num); font-size: 1.5rem; padding: 4px 18px; letter-spacing: 0.08em; }
.ops { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) clamp(250px, 23vw, 380px); gap: clamp(14px, 2vw, 28px); }
@media (max-width: 860px) { .stage { grid-template-columns: 1fr; } }
#board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 12px; padding: clamp(10px, 2vh, 24px); display: flex; align-items: center; justify-content: center; min-height: 0; min-width: 0; --t: 80px; }
@media (max-width: 860px) { #board { min-height: 60vh; } }
.side { display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 14px); }
.side > * { flex: none; }
/* Instructions sit at the top, above the puzzle (Shawn). */
.rule { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.4rem, 3.4vh, 2rem); line-height: 1.25; margin: 0 0 clamp(8px, 1.4vh, 14px); }
.rule em { font-style: normal; color: var(--green); }
.prog { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; margin: 0; color: var(--muted); }
.prog b { font-family: var(--font-num); color: var(--ink); }
.msg { min-height: 1.3em; margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; }
.msg.right { color: var(--green); }
.msg.wrong { color: var(--bad); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btns button { font-family: var(--font-display); font-size: 1.05rem; padding: 10px 12px; border-radius: 10px; min-height: 48px; }
.go { background: var(--green); border: 2px solid var(--green); color: var(--sheet); }
.go:hover { background: var(--sheet); color: var(--green); border-color: var(--green); }

/* ---------- Kakooma ---------- */
.kak { display: flex; flex-direction: column; gap: calc(var(--t) * 0.22); }
.krow { display: flex; align-items: center; gap: calc(var(--t) * 0.12); }
.tile, .slot { width: var(--t); height: var(--t); flex: none; padding: 0; border-radius: calc(var(--t) * 0.16); font-family: var(--font-num); font-weight: 700; font-size: calc(var(--t) * 0.42); line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.tile { background: var(--paper); border: 3px solid var(--grid-major); color: var(--ink); }
.tile:hover { border-color: var(--pt); background: var(--chip); }
.tile.part { border-color: var(--pt); color: var(--pt); background: var(--chip); }
.tile.ans { border-color: var(--green); background: var(--green); color: var(--sheet); }
.tile.miss { border-color: var(--bad); color: var(--bad); animation: shake 0.4s; }
.tile.x { border-color: var(--bad); color: var(--bad); text-decoration: line-through; text-decoration-thickness: 3px; }
.tile.reveal { border-color: var(--orange); color: var(--orange); border-width: 4px; }
.krow.done .tile:not(.part):not(.ans):not(.reveal) { opacity: 0.35; }
.slot.filled.missed { border-style: solid; border-color: var(--orange); color: var(--orange); }
.eqn .left { color: var(--bad); font-family: var(--font-display); font-size: 1.1em; }
.arrow { font-size: calc(var(--t) * 0.4); color: var(--muted); width: calc(var(--t) * 0.5); text-align: center; flex: none; }
.slot { border: 3px dashed var(--grid-major); background: transparent; color: var(--green); cursor: default; }
.slot.filled { border-style: solid; border-color: var(--green); }
.kak.final .slot.filled { border-color: var(--purple); color: var(--purple); cursor: pointer; background: var(--paper); }
.kak.final .slot.filled:hover { background: var(--chip); }
.slot.fpart { border-color: var(--pt) !important; color: var(--pt) !important; }
.slot.fans { border-color: var(--purple) !important; background: var(--purple) !important; color: var(--sheet) !important; }
.slot.x { border-color: var(--bad) !important; color: var(--bad) !important; text-decoration: line-through; }
.slot.freveal { border-color: var(--orange) !important; color: var(--orange) !important; border-width: 4px; }
.slot.miss { border-color: var(--bad) !important; color: var(--bad) !important; animation: shake 0.4s; }
.eqn { width: calc(var(--t) * 3.4); flex: none; font-family: var(--font-num); font-weight: 700; font-size: calc(var(--t) * 0.3); line-height: 1.25; padding-left: calc(var(--t) * 0.15); }
.narrow .eqn { display: none; }
.eqn span { display: block; }
.eqn span + span { color: var(--muted); font-size: 0.8em; }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* ---------- Crossword ---------- */
.cw { display: grid; gap: calc(var(--t) * 0.06); }
.cw > * { display: flex; align-items: center; justify-content: center; font-family: var(--font-num); font-weight: 700; line-height: 1; }
.cw .num { border-radius: calc(var(--t) * 0.12); font-size: calc(var(--t) * 0.4); background: var(--paper); border: 3px solid var(--grid-major); color: var(--ink); }
.cw .op { font-size: calc(var(--t) * 0.5); color: var(--orange); }
.cw .eq { font-size: calc(var(--t) * 0.5); color: var(--muted); }
.cw .blank { padding: 0; border: 3px dashed var(--pt); background: var(--sheet); color: var(--pt); cursor: pointer; }
.cw .blank:empty::before { content: "?"; color: var(--grid-major); }
.cw .blank.sel { border-style: solid; border-width: 4px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--pt) 25%, transparent); }
.cw .blank.right { border-style: solid; border-color: var(--green); color: var(--green); }
.cw .blank.wrong { border-style: solid; border-color: var(--bad); color: var(--bad); }
.cw .blank.shown { border-style: solid; border-color: var(--green); color: var(--green); background: var(--chip); }
.cw .eq.down { transform: rotate(90deg); }
.cw .block { background: var(--grid); border-radius: calc(var(--t) * 0.1); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pad button { font-family: var(--font-num); font-size: clamp(1.4rem, 4vh, 2.2rem); padding: 0; height: clamp(42px, 6.9vh, 80px); border-radius: 10px; background: var(--paper); }
.pad button:hover { background: var(--chip); }
.pad .ok { background: var(--green); border-color: var(--green); color: var(--sheet); font-family: var(--font-display); font-size: clamp(1rem, 2.6vh, 1.5rem); }
.pad .ok:hover { background: var(--sheet); color: var(--green); }

/* ---------- If-Then ---------- */
/* The if-part is always blue and the then-part orange, so students can see the parts switch places. */
.ift { width: min(100%, 980px); display: flex; flex-direction: column; gap: clamp(8px, 1.8vh, 20px); font-family: var(--font-display); }
.card { border: 3px solid var(--grid-major); border-radius: 14px; padding: clamp(10px, 1.8vh, 18px) clamp(14px, 2vw, 24px); background: var(--paper); font-weight: 800; font-size: clamp(1.15rem, 3.4vh, 2.2rem); line-height: 1.4; margin: 0; }
.card .tag { display: block; font-size: 0.55em; color: var(--muted); margin-bottom: 2px; }
.ph { padding: 0 0.22em; border-radius: 8px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.ph.p { background: color-mix(in srgb, var(--pt) 16%, transparent); color: var(--pt); }
.ph.q { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.choices { display: flex; flex-wrap: wrap; gap: 12px; }
.choices.stack { flex-direction: column; }
.choices button { flex: 1 1 0; min-width: 8em; min-height: clamp(48px, 8vh, 88px); font-family: var(--font-display); font-weight: 800; font-size: clamp(1.05rem, 2.9vh, 1.7rem); border-radius: 12px; border: 3px solid var(--grid-major); background: var(--paper); color: var(--ink); padding: 8px 16px; }
.choices.stack button { text-align: left; min-height: clamp(44px, 6.6vh, 72px); }
.choices button:hover:not(:disabled) { border-color: var(--pt); background: var(--chip); }
.choices button.right { border-color: var(--green); background: var(--green); color: var(--sheet); }
.choices button.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.choices button:disabled { cursor: default; }
.choices button:disabled:not(.right):not(.wrong) { opacity: 0.4; }
.why { font-weight: 800; font-size: clamp(1.1rem, 2.9vh, 1.6rem); margin: 0; min-height: 1.4em; }
.why.right { color: var(--green); }
.why.wrong { color: var(--bad); }
.hint { border: 1px solid var(--grid-major); border-radius: 12px; background: var(--paper); padding: 10px 12px; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; }
.hint .pat { line-height: 1.3; }
.hint .pat small { display: block; white-space: normal; font-size: 0.8em; color: var(--muted); }
.hint .ph { font-family: var(--font-num); white-space: nowrap; }

/* ---------- Logic Grid ---------- */
.lg { display: grid; gap: calc(var(--t) * 0.06); }
.lg .hd { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font-family: var(--font-display); font-weight: 800; font-size: max(0.9rem, calc(var(--t) * 0.2)); line-height: 1.1; text-align: center; padding-bottom: 4px; }
.lg .hd .em { font-size: calc(var(--t) * 0.46); line-height: 1.1; }
.lg .nm { display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; font-family: var(--font-display); font-weight: 800; font-size: max(1rem, calc(var(--t) * 0.3)); }
.lg .cell { width: var(--t); height: var(--t); padding: 0; border-radius: calc(var(--t) * 0.12); border: 3px solid var(--grid-major); background: var(--paper); font-family: var(--font-display); font-weight: 800; font-size: calc(var(--t) * 0.52); line-height: 1; display: flex; align-items: center; justify-content: center; color: var(--ink); }
.lg .cell:hover { border-color: var(--pt); }
.lg .cell.yes { color: var(--green); border-color: var(--green); background: color-mix(in srgb, var(--green) 14%, var(--paper)); }
.lg .cell.no { color: var(--muted); }
.lg .cell.auto { color: var(--grid-major); }
.lg .cell.bad { border-color: var(--bad); color: var(--bad); }
.lgwrap { display: flex; align-items: center; gap: clamp(16px, 3vw, 40px); width: 100%; height: 100%; justify-content: center; }
@media (max-width: 860px) { .lgwrap { flex-direction: column; } }
.lgwrap .clues { flex: 0 1 clamp(220px, 28vw, 400px); }
.clues { margin: 0; padding: 0 0 0 1.5em; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.05rem, 2.6vh, 1.4rem); line-height: 1.3; display: flex; flex-direction: column; gap: 8px; }
.clues li { cursor: pointer; }
.clues li.used { text-decoration: line-through; color: var(--muted); }
.tip { margin: 0; color: var(--muted); font-size: 0.95rem; }

/* ---------- Number Place ---------- */

.np > * { width: var(--t); height: var(--t); display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 0; border: 1px solid var(--grid-major); background: var(--paper); font-family: var(--font-num); font-weight: 700; font-size: calc(var(--t) * 0.52); line-height: 1; color: var(--ink); }
.np .bx-r { border-right: 4px solid var(--ink); }
.np .bx-b { border-bottom: 4px solid var(--ink); }
.np .blank { color: var(--pt); background: var(--sheet); cursor: pointer; }
.np .blank:hover { background: var(--chip); }

</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Number and Logic Puzzles</h1></div>
    <div class="ops">
      <div class="seg" id="game" role="group" aria-label="Puzzle"></div>
      <div class="seg fam" id="fam" role="group" aria-label="Operations"></div>
      <div class="seg" id="level" role="group" aria-label="Level"></div>
    </div>
  </header>

  <p class="rule" id="rule"></p>
  <div class="stage">
    <div id="board"></div>
    <div class="side">
      <div class="hint" id="hint" hidden></div>
      <p class="prog" id="prog"></p>
      <p class="msg" id="msg" aria-live="polite"></p>
      <div class="pad" id="pad" aria-label="Number keys" hidden></div>
      <div class="btns">
        <button type="button" class="go" id="new">New puzzle</button>
        <button type="button" id="check" hidden>Check</button>
        <button type="button" id="hintbtn" hidden>Hide hint</button>
        <button type="button" id="show">Show answers</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  const st = { game: "kak", fam: "as", level: "easy" };
  const GAMES = [["kak", "Kakooma"], ["cw", "Crossword"], ["ift", "If-Then"], ["lg", "Logic Grid"], ["np", "Number Place"]];
  const FAMS = [["as", "+ −"], ["md", "× ÷"]];
  const LEVELS = [["easy", "Easy"], ["med", "Medium"], ["hard", "Hard"]];

  function seg(box, items, current, choose) {
    box.replaceChildren(...items.map(([v, txt]) => {
      const b = el("button", "", txt);
      b.type = "button";
      b.setAttribute("aria-pressed", String(v === current));
      b.onclick = () => { if (v !== current) choose(v); };
      return b;
    }));
  }
  function drawControls() {
    seg($("game"), GAMES, st.game, v => { st.game = v; newPuzzle(); });
    // + − and × ÷ only belong to the number puzzles.
    $("fam").hidden = st.game !== "kak" && st.game !== "cw";
    seg($("fam"), FAMS, st.fam, v => { st.fam = v; newPuzzle(); });
    seg($("level"), LEVELS, st.level, v => { st.level = v; newPuzzle(); });
  }
  const say = (text, cls = "") => { $("msg").textContent = text; $("msg").className = "msg " + cls; };

  // ================= Kakooma =================
  // Each row hides one number that is the sum (or product) of two others in that row.
  // On Medium and Hard the row answers then make one last puzzle of the same kind.
  const KAK = {
    as: { easy: { rows: 4, k: 4, max: 10, final: false }, med: { rows: 4, k: 5, max: 20, final: true }, hard: { rows: 5, k: 6, max: 50, final: true } },
    // Multiplying sticks to times-table facts (Shawn): every pair of factors is at most f.
    md: { easy: { rows: 4, k: 4, f: 5, final: false }, med: { rows: 4, k: 5, f: 10, final: true }, hard: { rows: 5, k: 6, f: 12, final: true } },
  };
  const GUESSES = 2;
  const combine = (a, b) => st.fam === "as" ? a + b : a * b;
  const low = () => st.fam === "as" ? 1 : 2;
  // Ways to make t from two different numbers in range.
  function pairsFor(t) {
    const out = [];
    for (let a = low(); a * 2 < t || (st.fam === "md" && a * a < t); a++) {
      if (st.fam === "as") { const b = t - a; if (b > a) out.push([a, b]); }
      else if (t % a === 0 && t / a > a && t / a <= KAK.md[st.level].f) out.push([a, t / a]);
    }
    return out;
  }
  // Index of every number in the row that is made by two others; the puzzle needs exactly one.
  function makers(row) {
    const found = [];
    row.forEach((x, i) => {
      for (let p = 0; p < row.length; p++) for (let q = p + 1; q < row.length; q++)
        if (p !== i && q !== i && combine(row[p], row[q]) === x) found.push({ i, p, q });
    });
    return found;
  }
  // A row of k numbers where t is the only one made by two others; extras come from pool.
  function kakRow(t, k, pool) {
    const pairs = pairsFor(t).filter(([a, b]) => pool.includes(a) && pool.includes(b));
    if (!pairs.length || pool.length < k) return null;
    for (let tries = 0; tries < 400; tries++) {
      const row = [...pick(pairs), t];
      while (row.length < k) { const x = pick(pool); if (!row.includes(x)) row.push(x); }
      shuffle(row);
      const m = makers(row);
      if (m.length === 1 && row[m[0].i] === t) return { nums: row, ...m[0] };
    }
    return null;
  }
  function genKak() {
    const c = KAK[st.fam][st.level];
    const all = [];
    // Multiplying uses only factors up to f and their products.
    if (st.fam === "md") { for (let x = 2; x <= c.f * c.f; x++) if (x <= c.f || pairsFor(x).length) all.push(x); }
    else for (let x = low(); x <= c.max; x++) all.push(x);
    const targets = all.filter(t => pairsFor(t).length);
    for (let tries = 0; tries < 500; tries++) {
      let answers, final = null;
      if (c.final) {
        // The answers are a puzzle of their own, so build that row first.
        const f = kakRow(pick(targets), c.rows, targets);
        if (!f) continue;
        answers = f.nums; final = f;
      } else answers = shuffle(targets.slice()).slice(0, c.rows);
      const rows = answers.map(t => kakRow(t, c.k, all));
      if (rows.every(Boolean)) return { rows, answers, final };
    }
    return null;
  }
  function kakLines(a, b, t) {
    return st.fam === "as" ? [`${a} + ${b} = ${t}`, `${t} − ${b} = ${a}`] : [`${a} × ${b} = ${t}`, `${t} ÷ ${b} = ${a}`];
  }
  const word = () => st.fam === "as" ? "sum" : "product";

  let kak = null;
  function startKak() {
    kak = genKak();
    kak.solved = kak.rows.map(() => false);
    kak.missed = kak.rows.map(() => false);
    kak.wrong = kak.rows.map(() => []);
    kak.finalDone = false; kak.finalMissed = false; kak.finalWrong = [];
    drawKak();
    say("");
  }
  function kakRule() {
    const finalTime = kak.final && kak.solved.every(Boolean) && !kak.finalDone;
    $("rule").innerHTML = finalTime
      ? `Last step: which <em>answer</em> is the ${word()} of two other answers?`
      : `In each row, find the number that is the <em>${word()}</em> of two others.`;
    const n = kak.solved.filter((d, i) => d && !kak.missed[i]).length;
    $("prog").innerHTML = `Rows found: <b>${n}</b> of <b>${kak.rows.length}</b>` + (kak.final ? `<br>Last step: <b>${kak.finalDone ? kakLines(kak.answers[kak.final.p], kak.answers[kak.final.q], kak.answers[kak.final.i])[0] : "—"}</b>` : "");
    if (finalTime && kak.finalWrong.length) $("prog").innerHTML += `<br><span class="c-orange">1 guess left</span>`;
  }
  function drawKak() {
    const box = el("div", "kak");
    const allRows = kak.solved.every(Boolean);
    if (kak.final && allRows && !kak.finalDone) box.classList.add("final");
    kak.rows.forEach((r, ri) => {
      const row = el("div", "krow" + (kak.solved[ri] ? " done" : ""));
      r.nums.forEach((x, i) => {
        const b = el("button", "tile", x);
        b.type = "button";
        if (kak.solved[ri] && (i === r.i || i === r.p || i === r.q)) b.classList.add(i !== r.i ? "part" : kak.missed[ri] ? "reveal" : "ans");
        else if (kak.wrong[ri].includes(i)) b.classList.add("x");
        b.onclick = () => tapTile(ri, i, b);
        row.append(b);
      });
      row.append(el("span", "arrow", "→"));
      const slot = el("button", "slot", kak.solved[ri] ? r.nums[r.i] : "");
      slot.type = "button";
      if (kak.solved[ri]) slot.classList.add("filled");
      if (kak.missed[ri]) slot.classList.add("missed");
      if (kak.finalWrong.includes(ri)) slot.classList.add("x");
      if (kak.finalDone) {
        if (ri === kak.final.i) slot.classList.add(kak.finalMissed ? "freveal" : "fans");
        else if (ri === kak.final.p || ri === kak.final.q) slot.classList.add("fpart");
      }
      slot.onclick = () => tapSlot(ri, slot);
      row.append(slot);
      const eqn = el("div", "eqn");
      if (kak.solved[ri]) kakLines(r.nums[r.p], r.nums[r.q], r.nums[r.i]).forEach(t => eqn.append(el("span", "", t)));
      else if (kak.wrong[ri].length) eqn.append(el("span", "left", `${GUESSES - kak.wrong[ri].length} guess left`));
      row.append(eqn);
      box.append(row);
    });
    $("board").replaceChildren(box);
    kakRule();
    fit();
  }
  function shake(b) { b.classList.remove("miss"); void b.offsetWidth; b.classList.add("miss"); setTimeout(() => b.classList.remove("miss"), 600); }
  function tapTile(ri, i, b) {
    const r = kak.rows[ri];
    if (kak.solved[ri] || kak.wrong[ri].includes(i)) return;
    // Two guesses per row: after a second miss the row shows its answer in orange.
    const right = i === r.i;
    if (!right) kak.wrong[ri].push(i);
    if (right || kak.wrong[ri].length >= GUESSES) {
      kak.solved[ri] = true;
      kak.missed[ri] = !right;
      drawKak();
      const fact = kakLines(r.nums[r.p], r.nums[r.q], r.nums[r.i])[0];
      if (kak.solved.every(Boolean)) say(kak.final ? `All rows done! Now look at the answers.` : "Puzzle done! 🎉", "right");
      else if (right) say(`Yes! ${fact}`, "right");
      else say(`It was ${r.nums[r.i]}: ${fact}`, "wrong");
    } else {
      drawKak();
      shake($("board").querySelectorAll(".krow")[ri].children[i]);
      say(`${r.nums[i]} is not the ${word()} of two others. 1 guess left.`, "wrong");
    }
  }
  function tapSlot(ri, b) {
    if (!kak.final || kak.finalDone || !kak.solved.every(Boolean) || kak.finalWrong.includes(ri)) return;
    const f = kak.final, right = ri === f.i;
    if (!right) kak.finalWrong.push(ri);
    if (right || kak.finalWrong.length >= GUESSES) {
      kak.finalDone = true;
      kak.finalMissed = !right;
      drawKak();
      if (right) say("Puzzle solved! 🎉", "right");
      else say(`It was ${kak.answers[f.i]}.`, "wrong");
    } else {
      drawKak();
      shake($("board").querySelectorAll(".slot")[ri]);
      say(`${kak.answers[ri]} is not the ${word()} of two other answers. 1 guess left.`, "wrong");
    }
  }
  function showKak() {
    kak.solved = kak.rows.map(() => true);
    if (kak.final) kak.finalDone = true;
    drawKak();
    say("Here are the answers.");
  }

  // ================= Crossword =================
  // Number spots sit in an N by N grid (3, 4 or 5 by level); grey spots are blocked. Every run of three
  // spots across or down is one equation: first op second = third. Numbers stay small at every level:
  // harder levels are bigger grids with more blanks that have to be solved in a chain.
  const CW_SIZE = { easy: 3, med: 4, hard: 5 };
  // Patterns (1 = number spot) where every run across and down is 1 or 3 long and every spot is in an equation.
  const CW_TEMPLATES = {
    easy: ["111111111"],
    med: ["0001011101111110", "0111111011101000", "1000111011100111", "1110011101110001"],
    hard: ["0011100010101111110110111", "0011110010101111110100111", "0011111101101111001000111", "0011111101101111001001110", "0111000010101111110110111", "0111001000111011011111101", "0111001001111011011111100", "0111010010101111110100111", "1011111101101110001000111", "1011111101101110001001110", "1110001000111011011111101", "1110001001111011011111100", "1110010111111010100101110", "1110010111111010100111100", "1110110111111010100001110", "1110110111111010100011100"],
  };
  const CW_NUMS = { as: { lo: 1, max: 20 }, md: { lo: 1, max: 60 } };
  // Share of the number spots left blank, and the fewest solving rounds the blanks must need.
  const CW_BLANKS = { easy: { share: 0.34, rounds: 1 }, med: { share: 0.5, rounds: 2 }, hard: { share: 0.45, rounds: 3 } };
  const apply = (a, op, b) => {
    if (op === "+") return a + b;
    if (op === "−") return a - b;
    if (op === "×") return a * b;
    return b !== 0 && a % b === 0 ? a / b : NaN;
  };
  // Turn and flip a pattern so the same shapes show up in different directions.
  function orient(pat, n) {
    let g = [...Array(n)].map((_, r) => [...pat.slice(r * n, r * n + n)]);
    if (Math.random() < 0.5) g = g[0].map((_, c) => g.map(row => row[c]));
    if (Math.random() < 0.5) g = g.map(row => row.reverse());
    if (Math.random() < 0.5) g.reverse();
    return g.flat().map(Number);
  }
  function equationsOf(white, n) {
    const eqs = [];
    for (const dir of ["across", "down"]) for (let a = 0; a < n; a++) {
      let run = [];
      for (let b = 0; b <= n; b++) {
        const i = dir === "across" ? a * n + b : b * n + a;
        if (b < n && white[i]) { run.push(i); continue; }
        if (run.length === 3) eqs.push({ cells: run, dir });
        run = [];
      }
    }
    return eqs;
  }
  // Fill the one missing number of an equation; NaN when it can't be a whole number in range.
  function missing(op, [a, b, c], unk) {
    if (unk === 2) return apply(a, op, b);
    const inv = { "+": "−", "−": "+", "×": "÷", "÷": "×" }[op];
    if (unk === 0) return apply(c, inv, b);
    return op === "+" || op === "×" ? apply(c, inv, a) : apply(a, op, c);
  }
  function propagate(vals, eqs, lim) {
    for (let changed = true; changed;) {
      changed = false;
      for (const e of eqs) {
        const v = e.cells.map(i => vals[i]);
        const unk = v.map((x, k) => x === undefined ? k : -1).filter(k => k >= 0);
        if (unk.length === 0) { if (apply(v[0], e.op, v[1]) !== v[2]) return false; }
        else if (unk.length === 1) {
          const x = missing(e.op, v, unk[0]);
          if (!Number.isInteger(x) || x < lim.lo || x > lim.max) return false;
          vals[e.cells[unk[0]]] = x;
          changed = true;
        }
      }
    }
    return true;
  }
  // Backtracking search: guess small numbers, let the equations fill in what they force.
  function fillNumbers(cells, eqs, lim) {
    let budget = 3000;
    const tryFill = vals => {
      if (--budget < 0) return null;
      const open = cells.filter(i => vals[i] === undefined);
      if (!open.length) return vals;
      const at = open[Math.floor(Math.random() * open.length)];
      const top = st.fam === "as" ? 12 : 9;
      for (const x of shuffle([...Array(top - lim.lo + 1).keys()].map(k => k + lim.lo)).slice(0, 6)) {
        const next = { ...vals, [at]: x };
        if (!propagate(next, eqs, lim)) continue;
        const done = tryFill(next);
        if (done) return done;
      }
      return null;
    };
    return tryFill({});
  }
  // Rounds needed to fill the blanks when each round solves equations with one unknown; null when stuck.
  function solveRounds(cells, eqs, hidden) {
    const known = new Set(cells.filter(i => !hidden.has(i)));
    let rounds = 0;
    while (known.size < cells.length) {
      const add = [];
      for (const e of eqs) { const unk = e.cells.filter(i => !known.has(i)); if (unk.length === 1) add.push(unk[0]); }
      if (!add.length) return null;
      add.forEach(i => known.add(i));
      rounds++;
    }
    return rounds;
  }
  function genCw() {
    const n = CW_SIZE[st.level], lim = CW_NUMS[st.fam], bl = CW_BLANKS[st.level];
    const opsOf = st.fam === "as" ? ["+", "−"] : ["×", "÷"];
    for (let tries = 0; tries < 300; tries++) {
      const white = orient(pick(CW_TEMPLATES[st.level]), n);
      const cells = white.map((w, i) => w ? i : -1).filter(i => i >= 0);
      const eqs = equationsOf(white, n);
      // Easy keeps one operation per puzzle; Medium and Hard mix both.
      const one = pick(opsOf);
      eqs.forEach(e => { e.op = st.level === "easy" ? one : pick(opsOf); });
      if (st.level !== "easy" && new Set(eqs.map(e => e.op)).size < 2) continue;
      const vals = fillNumbers(cells, eqs, lim);
      if (!vals) continue;
      const v = cells.map(i => vals[i]);
      if (v.filter(x => x === 1).length > 1 || new Set(v).size < v.length * 0.6) continue;
      const count = Math.round(cells.length * bl.share);
      for (let h = 0; h < 400; h++) {
        const hidden = new Set(shuffle(cells.slice()).slice(0, count));
        const rounds = solveRounds(cells, eqs, hidden);
        if (rounds === null || rounds < bl.rounds || (st.level === "easy" && rounds !== 1)) continue;
        return { n, white, eqs, v: vals, hidden };
      }
    }
    return null;
  }

  let cw = null;
  function startCw() {
    cw = null;
    while (!cw) cw = genCw();
    cw.typed = {};
    cw.sel = [...cw.hidden].sort((a, b) => a - b)[0];
    cw.marks = {};
    cw.shown = false;
    $("rule").innerHTML = "Fill in the missing numbers so every row and column is a <em>true equation</em>.";
    drawCw();
    say("Read across → and down ↓.");
  }
  function drawCw() {
    const n = cw.n, size = 2 * n - 1;
    const grid = el("div", "cw");
    const track = [...Array(size)].map((_, k) => k % 2 ? "calc(var(--t) * 0.62)" : "var(--t)").join(" ");
    grid.style.gridTemplateColumns = track;
    grid.style.gridTemplateRows = track;
    // What sits between two number spots: the operation, the = sign, or a grey block.
    const between = (i, j, dir) => {
      for (const e of cw.eqs) {
        if (e.dir !== dir) continue;
        const k = e.cells.indexOf(i);
        if (k >= 0 && e.cells[k + 1] === j) return k === 0 ? { op: e.op } : { eq: true };
      }
      return null;
    };
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
      let cell = null;
      if (r % 2 === 0 && c % 2 === 0) { const i = (r / 2) * n + c / 2; if (cw.white[i]) cell = { num: i }; }
      else if (r % 2 === 0) cell = between((r / 2) * n + (c - 1) / 2, (r / 2) * n + (c + 1) / 2, "across");
      else if (c % 2 === 0) { cell = between(((r - 1) / 2) * n + c / 2, ((r + 1) / 2) * n + c / 2, "down"); if (cell && cell.eq) cell.down = true; }
      if (!cell) { grid.append(el("div", "block")); continue; }
      if (cell.num !== undefined) {
        const i = cell.num;
        if (cw.hidden.has(i)) {
          const b = el("button", "num blank");
          b.type = "button";
          b.setAttribute("aria-label", "Missing number");
          b.textContent = cw.shown && cw.marks[i] !== "right" ? cw.v[i] : (cw.typed[i] || "");
          if (cw.shown && cw.marks[i] !== "right") b.classList.add("shown");
          else if (cw.marks[i]) b.classList.add(cw.marks[i]);
          if (i === cw.sel && !cw.shown) b.classList.add("sel");
          b.onclick = () => { cw.sel = i; drawCw(); };
          grid.append(b);
        } else grid.append(el("div", "num", cw.v[i]));
      } else if (cell.op) grid.append(el("div", "op", cell.op));
      else grid.append(el("div", cell.down ? "eq down" : "eq", "="));
    }
    $("board").replaceChildren(grid);
    const blanks = [...cw.hidden];
    const filled = blanks.filter(n => cw.typed[n]).length;
    $("prog").innerHTML = `Filled: <b>${filled}</b> of <b>${blanks.length}</b>`;
    fit();
  }
  function cwKey(k) {
    if (!cw || cw.shown) return;
    const order = [...cw.hidden].sort((a, b) => a - b);
    const n = cw.sel;
    if (k === "ok") return checkCw();
    if (k === "next" || k === "prev") {
      const i = order.indexOf(n);
      cw.sel = order[(i + (k === "next" ? 1 : order.length - 1)) % order.length];
    } else if (k === "back") { cw.typed[n] = (cw.typed[n] || "").slice(0, -1); delete cw.marks[n]; }
    else if ((cw.typed[n] || "").length < 3) { cw.typed[n] = ((cw.typed[n] === "0" ? "" : cw.typed[n]) || "") + k; delete cw.marks[n]; }
    drawCw();
  }
  function checkCw() {
    const blanks = [...cw.hidden];
    let right = 0, wrong = 0;
    for (const n of blanks) {
      if (!cw.typed[n]) { delete cw.marks[n]; continue; }
      const ok = Number(cw.typed[n]) === cw.v[n];
      cw.marks[n] = ok ? "right" : "wrong";
      ok ? right++ : wrong++;
    }

  let np = null;
  function startNp() {
    np = genNp();
    np.typed = {};
    np.marks = {};
    np.shown = false;
    np.sel = [...np.hidden].sort((a, b) => a - b)[0];
    $("rule").innerHTML = `Fill the grid so every row, column, and box has <em>1 to ${np.n}</em> once.`;
    drawNp();
    say("Tap a ? box, then a number.");
  }
  function drawNp() {
    const { n, bw, bh } = np, g = el("div", "np");
    g.style.gridTemplateColumns = `repeat(${n}, var(--t))`;
    for (let i = 0; i < n * n; i++) {
      const r = Math.floor(i / n), c = i % n;
      let cell;
      if (np.hidden.has(i)) {
        cell = el("button", "blank");
        cell.type = "button";
        cell.setAttribute("aria-label", "Missing number");
        const showIt = np.shown && np.marks[i] !== "right";
        cell.textContent = showIt ? np.sol[i] : (np.typed[i] || "");
        if (showIt) cell.classList.add("shown");
        else if (np.marks[i]) cell.classList.add(np.marks[i]);
        if (i === np.sel && !np.shown) cell.classList.add("sel");
        cell.onclick = () => { np.sel = i; drawNp(); };
      } else cell = el("div", "", np.sol[i]);
      if (c % bw === bw - 1 && c < n - 1) cell.classList.add("bx-r");
      if (r % bh === bh - 1 && r < n - 1) cell.classList.add("bx-b");
      g.append(cell);
    }
    $("board").replaceChildren(g);
    const filled = [...np.hidden].filter(i => np.typed[i]).length;
    $("prog").innerHTML = `Filled: <b>${filled}</b> of <b>${np.hidden.size}</b>`;
    fit();
  }
  function npKey(k) {
    if (!np || np.shown) return;
    const order = [...np.hidden].sort((a, b) => a - b), i = np.sel;
    if (k === "ok") return checkNp();
    if (k === "next" || k === "prev") np.sel = order[(order.indexOf(i) + (k === "next" ? 1 : order.length - 1)) % order.length];
    else if (k === "back") { delete np.typed[i]; delete np.marks[i]; }
    else if (Number(k) >= 1 && Number(k) <= np.n) { np.typed[i] = k; delete np.marks[i]; }
    drawNp();
  }
  function checkNp() {
    const blanks = [...np.hidden];
    let right = 0, wrong = 0;
    for (const i of blanks) {
      if (!np.typed[i]) { delete np.marks[i]; continue; }
      const ok = Number(np.typed[i]) === np.sol[i];
      np.marks[i] = ok ? "right" : "wrong";
      ok ? right++ : wrong++;
    }
    drawNp();
    if (right === blanks.length) say("Puzzle solved! 🎉", "right");
    else if (wrong) say(`${wrong} red: try again.`, "wrong");
    else if (right) say(`${right} right so far. Keep going!`, "right");
    else say("Type a number in a ? box first.");
  }
  function showNp() { np.shown = true; drawNp(); say("Here are the answers."); }

  // On-screen keypad for the crossword and Number Place (both also work with the keyboard).
  const padKey = k => st.game === "np" ? npKey(k) : cwKey(k);
  function buildPad() {
    const keys = st.game === "np" ? [...[...Array(NP[st.level].n).keys()].map(k => String(k + 1)), "back", "ok"]
      : ["7", "8", "9", "4", "5", "6", "1", "2", "3", "back", "0", "ok"];
    $("pad").replaceChildren(...keys.map(k => {
      const b = el("button", k === "ok" ? "ok" : "", k === "back" ? "⌫" : k === "ok" ? "Check" : k);
      b.type = "button";
      if (k === "back") b.setAttribute("aria-label", "Erase");
      b.onclick = () => padKey(k);
      return b;
    }));
  }
  document.addEventListener("keydown", e => {
    if ((st.game !== "cw" && st.game !== "np") || e.ctrlKey || e.metaKey || e.altKey) return;
    const map = { Backspace: "back", Delete: "back", Enter: "ok", ArrowRight: "next", ArrowDown: "next", ArrowLeft: "prev", ArrowUp: "prev", Tab: e.shiftKey ? "prev" : "next" };
    const k = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
    if (!k) return;
    if (k === "ok" && e.target.closest && e.target.closest(".seg, .btns")) return;
    e.preventDefault();
    padKey(k);
  });

  // ================= Sizing =================
  // Tiles scale so the whole puzzle fills the board without scrolling.
  function fit() {
    const b = $("board"), cs = getComputedStyle(b);
    const w = b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = b.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let t;
    if (st.game === "kak" && kak) {
      const rows = kak.rows.length, k = kak.rows[0].nums.length;
      // Phones skip the equations beside each row so the tiles stay big enough to tap.
      const narrow = w < 640;
      b.classList.toggle("narrow", narrow);
      t = Math.min(h / (rows + (rows - 1) * 0.22), w / (k + 1 + 0.5 + (narrow ? 0 : 3.55) + (k + 2) * 0.12));
    } else if (st.game === "lg" && lg) {
      // The clues sit beside the grid (above it on phones). Names column about 1.7 boxes wide, headers about 1.2 tall.
      const ol = b.querySelector(".clues"), wrap = b.querySelector(".lgwrap");
      const row = wrap && getComputedStyle(wrap).flexDirection === "row";
      const gw = row ? w - ol.offsetWidth - 40 : w, gh = row ? h : h - ol.offsetHeight - 16;
      t = Math.min(gw / (lg.n + 1.7 + lg.n * 0.06), gh / (lg.n + 1.2 + lg.n * 0.06));
    } else if (st.game === "np" && np) {
      t = (Math.min(w, h) - 8) / np.n;
    } else if (st.game === "ift") {
      return;
    } else {
      // n number spots plus n - 1 narrower gaps (0.62) and the small grid gaps.
      const n = cw ? cw.n : 3, span = n + (n - 1) * 0.62 + (2 * n - 2) * 0.06;
      t = Math.min(w, h) / span;
    }
    b.style.setProperty("--t", Math.max(36, Math.min(160, Math.floor(t))) + "px");
  }
  new ResizeObserver(fit).observe($("board"));

  let hintOn = true;
  function newPuzzle() {
    drawControls();
    const g = st.game;
    $("pad").hidden = g !== "cw" && g !== "np";
    if (!$("pad").hidden) buildPad();
    $("check").hidden = g !== "lg";
    // The If-Then hint shows the four statement patterns; Hard (rule and fact) does not use it.
    const hintable = g === "ift" && st.level !== "hard";
    $("hintbtn").hidden = !hintable;
    $("hint").hidden = !hintable || !hintOn;
    $("hintbtn").textContent = hintOn ? "Hide hint" : "Show hint";
    if (hintable) drawHint();
    $("new").textContent = g === "ift" ? "Next question" : "New puzzle";
    $("show").textContent = g === "ift" ? "Show answer" : "Show answers";
    if (g === "kak") startKak();
    else if (g === "cw") startCw();
    else if (g === "ift") { $("rule").innerHTML = IF_RULE[st.level]; startIft(false); }
    else if (g === "lg") startLg();
    else startNp();
  }
  $("new").onclick = () => {
    // Next question keeps the If-Then score; switching level or puzzle starts it again.
    if (st.game === "ift") startIft(true); else newPuzzle();
  };
  $("check").onclick = () => checkLg();
  $("hintbtn").onclick = () => {
    hintOn = !hintOn;
    $("hint").hidden = !hintOn;
    $("hintbtn").textContent = hintOn ? "Hide hint" : "Show hint";
  };
  $("show").onclick = () => {
    const g = st.game;
    if (g === "kak") showKak();
    else if (g === "cw") showCw();
    else if (g === "ift") answerIft(null, true);
    else if (g === "lg") showLg();
    else showNp();
  };
  newPuzzle();
})();
</script>

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
