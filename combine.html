<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Combining Functions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Combining Functions (Math 30-1): f, g and h in any form, a combination in function notation,
   a table whose columns are the steps toward the answer (Calculate above each), and a graph that fills in point by point. */
:root { --h: #7a3fc4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --h: #b98cff; } }
:root[data-theme="dark"] { --h: #b98cff; }
.c-f { color: var(--pt); } .c-g { color: var(--orange); } .c-h { color: var(--h); } .c-r { color: var(--green); }
.v { font-family: var(--font-display); font-style: italic; font-weight: 800; padding-right: 0.08em; }
sup { font-size: 0.62em; line-height: 0; }
.sfrac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: 0.8em; line-height: 1.1; margin: 0 0.12em; }
.sfrac > span { padding: 0 0.2em; }
.sfrac > span:first-child { border-bottom: 0.1em solid currentColor; padding-bottom: 0.08em; }
.sfrac > span:last-child { padding-top: 0.08em; }
.rad-in { border-top: 0.09em solid currentColor; padding: 0.04em 0.12em 0; margin-left: 0.02em; }
.sv { color: var(--pt); }

header .tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tog[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.tools button { font-size: 1rem; min-height: 44px; }

.stage { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .stage { grid-template-columns: 1fr; } }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (min-width: 861px) and (min-height: 520px) {
  .stage > .side { overflow: hidden; }
  .side .tcard { flex: 1 1 auto; min-height: 44%; overflow: auto; }
  .side .build { flex: 0 1 auto; min-height: 0; max-height: 46%; overflow: auto; }
}

/* Functions: one box each across the top, then the combination */
.fnbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.fcard { flex: 0 1 auto; padding: 4px 12px; }
.fcard.findc { flex: 2 1 auto; border-color: var(--green); border-width: 2px; }
.fcard .fbox input { min-width: 12ch; }
.frow { display: flex; align-items: center; gap: 8px; font-family: var(--font-num); font-weight: 700; font-size: 1.55rem; min-width: 0; }
.fname { flex: none; white-space: nowrap; }
.fbox { flex: 1 1 auto; min-width: 0; }
.pretty { display: flex; align-items: center; min-height: 46px; padding: 0 8px; border: 2px dashed transparent; border-radius: 8px; cursor: text; white-space: nowrap; overflow-x: auto; }
.pretty:hover { border-color: var(--grid-major); }
.fbox input { width: 100%; height: 44px; padding: 0 10px; font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--pt); border-radius: 8px; }
.fbox:not(.editing) input { display: none; }
.fbox.editing .pretty { display: none; }
.fbox.bad input { border-color: var(--warn); }
.err { margin: 0 0 4px; color: var(--warn); font-family: var(--font-body); font-weight: 700; font-size: 1rem; }
.rm { flex: none; font-size: 1rem; padding: 6px 12px; }
.addh { flex: none; align-self: stretch; font-family: var(--font-num); font-size: 1.3rem; padding: 6px 18px; border: 2px dashed var(--grid-major); background: transparent; border-radius: 10px; }
.find { flex: none; font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; color: var(--green); }
.alt { color: var(--muted); margin-left: 0.5em; }
#pick { flex: none; font: inherit; font-family: var(--font-body); font-weight: 700; font-size: 1rem; padding: 8px; border-radius: 8px;
  border: 1px solid var(--grid-major); background: var(--chip); color: var(--ink); width: 6.2rem; }

/* Table */
.tcard { padding: 0; overflow-x: auto; }
@media (max-width: 860px) { .crow { flex-wrap: wrap; } }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-family: var(--font-num); font-weight: 700; text-align: center; }
thead { position: sticky; top: 0; z-index: 1; background: var(--sheet); }
th { padding: 6px 6px 4px; vertical-align: bottom; }
.heads th { font-size: 1.45rem; border-bottom: 3px solid var(--ink); white-space: nowrap; }
.heads th small { display: block; font-size: 0.68em; color: var(--muted); font-weight: 500; }
.heads th .eqn { display: block; font-size: 0.72em; color: var(--ink); font-weight: 700; margin-top: 2px; }
th:first-child, td:first-child { border-right: 3px solid var(--ink); }
th.top, td.top { background: color-mix(in srgb, var(--green) 9%, var(--sheet)); }
td { padding: 6px; border-bottom: 1px solid var(--grid); font-size: 1.85rem; white-space: nowrap; }
td small { display: block; font-size: 0.55em; color: var(--muted); font-weight: 500; line-height: 1.2; }
td.top b { color: var(--green); }
td.undef { color: var(--warn); font-size: 1.15rem; }
tbody tr { cursor: pointer; }
tbody tr.active td { background: color-mix(in srgb, var(--pt) 10%, var(--sheet)); }
tbody tr.active td.top { background: color-mix(in srgb, var(--green) 16%, var(--sheet)); }
td.xcell { color: var(--pt); }
td.new { animation: pop 0.45s ease-out; }
@keyframes pop { from { opacity: 0; transform: scale(0.7); } }
tr.blank td { cursor: default; background: transparent; }
td.hintcell { font-family: var(--font-body); font-weight: 400; font-size: 1.05rem; color: var(--muted); text-align: left; white-space: normal; }
td small.why { color: var(--warn); font-family: var(--font-body); font-weight: 700; }
#xin { width: 6ch; height: 48px; font-family: var(--font-num); font-weight: 700; font-size: 1.5rem; text-align: center; color: var(--ink);
  background: var(--paper); border: 2px solid var(--pt); border-radius: 8px; }
#xin.bad { border-color: var(--warn); }
.calc { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; min-height: 40px; padding: 4px 12px; }
.calc.next { background: var(--green); color: var(--sheet); border-color: var(--green); }
.calc:disabled { opacity: 0.35; cursor: default; }
.many .heads th { font-size: 1.15rem; } .many td { font-size: 1.5rem; } .many .calc { font-size: 0.9rem; padding: 6px 8px; } .many th, .many td { padding-inline: 3px; }
.nf { margin-top: 4px; font-size: 1.05rem; font-weight: 700; }
.nfbtn { font-family: var(--font-num); font-size: 1rem; font-weight: 700; padding: 4px 10px; color: var(--muted); background: transparent; border: 2px dashed var(--grid-major); white-space: nowrap; }
.nfbtn.set { color: var(--ink); border-style: solid; background: var(--sheet); }
.nf input { display: none; width: 100%; min-width: 9ch; height: 40px; font-family: var(--font-num); font-weight: 700; font-size: 1.05rem; text-align: center; color: var(--ink); background: var(--paper); border: 2px solid var(--pt); border-radius: 8px; }
.nf input.bad { border-color: var(--warn); }
.nf.editing .nfbtn { display: none; } .nf.editing input { display: block; }
td small.ck { margin-top: 2px; font-family: var(--font-body); font-weight: 700; font-size: 0.5em; }
small.ck.ok, .ckline.ok .ckw { color: var(--green); } small.ck.no, .ckline.no .ckw { color: var(--warn); }
.ckline { font-size: 1.1rem; padding-left: 1em; border-left: 3px solid var(--grid-major); }
.ckw { font-family: var(--font-body); }
.empty { padding: 18px 16px; color: var(--muted); font-family: var(--font-body); font-weight: 400; font-size: 1.1rem; text-align: left; }

/* Build: the new function put together from its parts, one short step at a time */
.build { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; }
.bbtn { align-self: flex-start; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; min-height: 48px; padding: 8px 16px;
  background: var(--green); color: var(--sheet); border-color: var(--green); }
.bbtn:hover { background: var(--sheet); color: var(--green); }
.bbtn .c-f, .bbtn .c-g, .bbtn .c-h { color: inherit; }
.bhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bhead .label { margin: 0; flex: 1 1 auto; }
.bhead button { font-size: 0.95rem; padding: 6px 12px; }
.bstep { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 0 10px; align-items: baseline; animation: rise 0.45s ease-out; }
.bstep .n { font-family: var(--font-display); font-weight: 800; color: var(--sheet); background: var(--muted); border-radius: 50%; width: 1.7rem; height: 1.7rem; display: inline-flex; align-items: center; justify-content: center; font-size: 0.95rem; }
.bstep .w { font-size: 1.05rem; font-weight: 700; }
.bstep .e { grid-column: 2; font-family: var(--font-num); font-weight: 700; font-size: 1.45rem; white-space: nowrap; overflow-x: auto; }
.bstep.final .e { color: var(--ink); background: color-mix(in srgb, var(--green) 14%, var(--sheet)); border: 2px solid var(--green); border-radius: 10px; padding: 2px 12px; justify-self: start; }
.bstep.final .n { background: var(--green); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
/* A part waiting to be put in (g(x)) swaps for what it equals ((x² − 3)). */
.sw { border-radius: 6px; padding: 0 2px; background: color-mix(in srgb, currentColor 12%, transparent); }
.sw .b { display: none; }
.go .sw .a { display: none; }
.go .sw .b { display: inline; animation: swapin 0.6s ease-out; }
@keyframes swapin { from { opacity: 0; filter: blur(3px); } }
.sw .b, .sw .b * { color: inherit; }

/* Board */
.board svg text { font-family: var(--font-num); font-weight: 700; }
.gm { stroke: var(--grid); stroke-width: 1; }
.ga { stroke: var(--muted); stroke-width: 2; }
.curve { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; opacity: 0.55; }
.curve.res { stroke-width: 4; opacity: 0.9; stroke: var(--green); }
.k-f { stroke: var(--pt); fill: var(--pt); } .k-g { stroke: var(--orange); fill: var(--orange); }
.k-h { stroke: var(--h); fill: var(--h); } .k-r { stroke: var(--green); fill: var(--green); }
.curve.k-f, .curve.k-g, .curve.k-h { fill: none; }
.cname { font-size: 24px; stroke: var(--sheet); stroke-width: 5px; paint-order: stroke; }
.pt { stroke: var(--sheet); stroke-width: 2.5; }
.pt.old { opacity: 0.45; }
.pt.now { animation: grow 0.4s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes grow { from { transform: scale(0); } }
.guide { stroke-width: 2.5; stroke-dasharray: 7 6; fill: none; }
.chipbg { fill: var(--sheet); stroke-width: 2; }
.chiptx { font-size: 19px; stroke: none; }
@media (prefers-reduced-motion: reduce) { td.new, .pt.now, .bstep, .go .sw .b { animation: none; } }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Combining Functions</h1></div>
    <div class="tools" id="tools"></div>
  </header>

  <section class="fnbar" id="fns"></section>

  <div class="stage">
    <div class="side">
      <section class="card tcard" id="tcard">
        <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
      </section>
      <section class="card build" id="build" aria-live="polite"></section>
    </div>
    <div class="board"><svg id="svg" viewBox="0 0 720 720" role="img" aria-label="Graph of the functions and the plotted points"></svg></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const minus = s => String(s).replace(/-/g, "−");

      el("path", { d, class: "curve " + cls }, plane);
      if (!name) return;
      const at = spots.reverse().find(q => names.every(b => Math.hypot(sx(q.x) - b.x, sy(q.y) - b.y) > 60));
      if (!at) return;
      names.push({ x: sx(at.x), y: sy(at.y) });
      el("text", { x: sx(at.x) - 8, y: sy(at.y) - 10, class: "cname " + cls, "text-anchor": "end" }, plane).textContent = name;
    };
    for (const k of used()) if (view[k]) curve(x => ev(fns[k].tree, x), "k-" + k, k);
    if (view.r) curve(x => evalNode(combo.top, x), "res", null);

    // Guides for the row being worked on.
    const row = rows[active];
    const guides = el("g", {}, plane);
    const chips = [];
    if (row) {
      for (const p of pts.filter(p => p.now)) {
        const k = p.k;
        if (p.kind === "fn") {
          el("line", { x1: sx(p.x), y1: sy(0), x2: sx(p.x), y2: sy(p.y), class: "guide k-" + k, "marker-end": `url(#arr-${k})` }, guides);
          chips.push({ p, k, text: `${p.col.node.f}(${numP(p.x)}) ${eqP(p.y)}` });
        } else {
          const n = p.col.node;
          if (n.k === "app" && n.arg.k !== "x") {
            const r = row.vals[p.col.key];
            el("line", { x1: sx(r.input), y1: sy(p.y), x2: sx(p.x), y2: sy(p.y), class: "guide k-r", "marker-end": "url(#arr-r)" }, guides);
          } else if (n.k === "bin") {
            el("line", { x1: sx(p.x), y1: sy(0), x2: sx(p.x), y2: sy(p.y), class: "guide k-r", "marker-end": "url(#arr-r)" }, guides);
          }
          chips.push({ p, k: "r", text: `${pc(combo.ast, p.x, {}, true)} ${eqP(p.y)}`, top: true });
        }
      }
    }
    const dots = el("g", {}, plane);
    // Older points first, the current row on top; result points last.
    const order = [...pts].sort((a, b) => (a.now - b.now) || ((a.kind === "top") - (b.kind === "top")));
    for (const p of order) {
      const cls = `pt k-${p.k}${p.now ? (p.col.key === justDone ? " now" : "") : p.kind === "fn" ? " old" : ""}`;
      el("circle", { cx: sx(p.x), cy: sy(p.y), r: p.kind === "top" ? (p.now ? 10 : 8) : p.now ? 8 : 5.5, class: cls }, dots);
    }
    // Label chips, nudged apart so they don't cover each other.
    const boxes = [];
    const lab = el("g", {});
    chips.sort((a, b) => (b.top ? 1 : 0) - (a.top ? 1 : 0));
    for (const c of chips) {
      const px = sx(c.p.x), py = sy(c.p.y);
      const g = el("g", {}, lab);
      const t = el("text", { x: 0, y: 0, class: "chiptx k-" + c.k }, g); t.textContent = c.text;
      const w = t.getComputedTextLength() + 16, h = 30;
      let x = px + 14, y = py - h / 2;
      if (x + w > S - 4) x = px - 14 - w;
      x = Math.max(4, x);
      y = Math.max(4, Math.min(S - h - 4, y));
      const y0 = y, hit = yy => boxes.some(b => x < b.x + b.w && x + w > b.x && yy < b.y + b.h && yy + h > b.y);
      for (let i = 1; i < 14 && hit(y); i++) y = Math.max(4, Math.min(S - h - 4, y0 + (i % 2 ? 1 : -1) * Math.ceil(i / 2) * (h + 4)));
      boxes.push({ x, y, w, h });
      const bg = el("rect", { x, y, width: w, height: h, rx: 7, class: "chipbg k-" + c.k }, g);
      bg.style.fill = "var(--sheet)";
      g.insertBefore(bg, t);
      t.setAttribute("x", x + 8); t.setAttribute("y", y + 21);
    }
  }

  // ---------- Header buttons ----------
  $("tools").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "newEx") return newExample();
    const k = b.dataset.t; view[k] = !view[k]; b.setAttribute("aria-pressed", view[k]); draw();
  });
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const nz = (a, b) => { let v; do v = ri(a, b); while (!v); return v; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const sg = v => (v < 0 ? " - " + -v : " + " + v);
  const co = a => (a === 1 ? "" : a === -1 ? "-" : String(a));
  const FORMS = [
    () => `${co(nz(-3, 3))}x${sg(nz(-5, 5))}`,
    () => `x^2${sg(nz(-5, 5))}`,
    () => `${co(pick([1, 2, -1]))}(x${sg(nz(-3, 3))})^2${sg(nz(-4, 4))}`,
    () => `(x${sg(nz(-4, 4))})(x${sg(nz(-4, 4))})`,
    () => `sqrt(x${sg(ri(1, 6))})`,
    () => `|x${sg(nz(-4, 4))}|`,
    () => `${pick([1, 2, 3, 6])}/(x${sg(nz(-4, 4))})`,
    () => `2^x`,
  ];
  const newExample = () => {
    const a = ri(0, FORMS.length - 1); let b; do b = ri(0, FORMS.length - 1); while (b === a);
    fns.f = { text: FORMS[a]() }; fns.g = { text: FORMS[b]() };
    if (fns.h) { let c; do c = ri(0, FORMS.length - 1); while (c === a || c === b); fns.h = { text: FORMS[c]() }; }
    for (const k of used()) fns[k].tree = parseFn(fns[k].text);
    renderFns();
    setCombo(pick(fns.h ? PRESETS3 : PRESETS2.slice(0, 8)));
    paintFns(); renderTable(); draw();
  };

  setCombo(comboText);
  renderFns();
  renderTable();
  draw();
})();
</script>

</body>
</html>
