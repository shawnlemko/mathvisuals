<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Composite Shapes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Composite Shapes: one shape stacked on another. Three columns: the calculation on the left (reading straight down,
   one block per shape), the picture in the middle, and the controls stacked on the right (Surface Area / Volume, then
   the Top and Bottom shapes). Clicking any part of the calculation lights up the part of the solid it calculates.
   Flat faces where the shapes join are hidden (not counted); that step lifts the top shape to show them. */
:root { --c-bot: #4f7fd9; --c-top: #9a63d6; --hl: #e08a00; --hide: #d23a3a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-bot: #7aa2ff; --c-top: #bb91f2; --hl: #ffb84d; --hide: #ff6b6b; } }
:root[data-theme="dark"] { --c-bot: #7aa2ff; --c-top: #bb91f2; --hl: #ffb84d; --hide: #ff6b6b; }
.wrap { max-width: 1500px; }
.main { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 260px); gap: 12px; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } .main > .board { order: 1; } .main > .panel { order: 2; } .main > .calc { order: 3; } }
.panel { gap: 10px; }
.board { padding: 0; overflow: hidden; position: relative; }
#view { display: block; width: 100%; height: min(70vh, 720px); min-height: 360px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#view.drag { cursor: grabbing; }
@media (min-width: 861px) and (min-height: 520px) { #view { flex: 1 1 auto; height: 100%; min-height: 0; } }
.turn { position: absolute; left: 14px; bottom: 10px; margin: 0; color: var(--muted); font-size: 0.95rem; pointer-events: none; }

/* Surface Area / Volume switch */
.master { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 6px; background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 14px; }
.master button { min-height: 50px; font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; border-radius: 10px; }
.master button[aria-pressed="true"] { background: var(--pt); color: var(--sheet); border-color: var(--pt); }

/* Shape pickers */
.shapes { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px; }
.pick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.pick + .pick { padding-top: 8px; border-top: 1px dashed var(--grid-major); }
.pick .who { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; min-width: 0; display: inline-flex; align-items: center; gap: 8px; }
.pick .who i, .step i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; flex: none; }
.pick select { flex: 1 1 0; min-width: 0; min-height: 40px; font: inherit; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 6px 4px 6px 8px; }
.dims { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.dim { display: flex; align-items: center; gap: 6px; }
.dim .dk { margin-right: auto; }
.dim .dk { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 1.4rem; min-width: 1em; text-align: center; }
.dim button { width: 34px; height: 34px; padding: 0; font-size: 1.4rem; line-height: 1; }
.dim output { font-family: var(--font-num); font-weight: 700; font-size: 1.4rem; min-width: 1.6em; text-align: center; }

/* Calculation: one line per step, one column per face, so every number sits under its formula. */
.calc { padding: 10px 12px; display: flex; flex-direction: column; overflow: hidden; --fs: 1.4rem; }
.eqn { flex: 1 1 auto; min-height: 0; overflow: auto; display: grid; justify-content: start; align-content: start; align-items: center; row-gap: 2px; font-family: var(--font-num); font-size: var(--fs); }
.blk { display: grid; grid-template-rows: subgrid; justify-content: start; align-items: center; }
.c { font: inherit; color: var(--ink); background: none; border: 2px solid transparent; border-radius: 8px; padding: 1px 4px; text-align: center; white-space: nowrap; line-height: 1.38; }
button.c { cursor: pointer; }
button.c:hover { border-color: var(--grid-major); }
button.c.on { border-color: var(--hl); background: color-mix(in srgb, var(--hl) 22%, var(--sheet)); }
.c.op { color: var(--muted); padding: 1px 2px; }
.c.lbl, .c.hdr { font-weight: 700; }
.c.hdr.top { color: var(--c-top); } .c.hdr.bot { color: var(--c-bot); }
.c.hdr { border-bottom: 3px solid currentColor; border-radius: 8px 8px 0 0; }
.c s { color: var(--hide); text-decoration-thickness: 3px; }
.c .red { color: var(--hide); }
.c.why { color: var(--hide); font-family: var(--font-body); font-weight: 700; font-size: 0.8em; text-align: left; padding-left: 6px; white-space: normal; line-height: 1.2; }
.c.gap { margin-top: 12px; }
.c.tot { text-align: left; padding-left: 14px; }
.c.sub { text-align: left; }
.c.tot b { background: var(--chip); border-radius: 8px; padding: 0 10px; font-size: 1.2em; }
.c.why, .c.warn { width: 0; min-width: 100%; }   /* a long note wraps instead of widening the columns */
.c.warn { color: var(--warn); font-family: var(--font-body); font-weight: 700; text-align: left; white-space: normal; }
.c.help { display: inline-flex; align-items: center; gap: 8px; border-color: var(--grid); }
.c.help i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
.c .frac { font-size: 0.72em; vertical-align: middle; line-height: 1.05; }
.c.later { visibility: hidden; }
.empty { margin: 6px 0; color: var(--muted); font-size: 1.2rem; font-weight: 700; }

/* Vertical height or slant height, for cones and pyramids */
.hchoice { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 100%; }
.hchoice button { font-size: 0.95rem; padding: 4px 8px; }
.hchoice button[aria-pressed="true"], .py-btn[aria-pressed="true"] { background: var(--pt); color: var(--sheet); border-color: var(--pt); }

/* Pythagoras, shown in the picture */
.py-btn { position: absolute; left: 12px; top: 12px; z-index: 2; font-family: var(--font-display); font-size: 1.1rem; padding: 10px 14px; }
.py { position: absolute; left: 12px; top: 66px; z-index: 1; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px; max-width: calc(100% - 24px); pointer-events: none; }
.py .blk { background: color-mix(in srgb, var(--sheet) 92%, transparent); border: 2px solid var(--hl); border-radius: 12px; padding: 8px 14px; font-family: var(--font-num); font-size: 1.25rem; }
.py .blk h3 { margin: 0 0 6px; font-family: var(--font-display); font-size: 1rem; display: flex; align-items: center; gap: 6px; }
.py .blk h3 i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
.py .parts { display: flex; align-items: flex-start; gap: 18px; }
.py .parts .rows + .rows { padding-left: 18px; border-left: 1px dashed var(--grid-major); }
.py .rows { display: grid; grid-template-columns: auto auto auto; column-gap: 8px; row-gap: 6px; align-items: center; }
.py .rows span:first-child { text-align: right; }
.py .frac { font-size: 0.72em; vertical-align: middle; line-height: 1.05; }

/* Next step, at the bottom */
.stepbar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--grid); }
.stepbar button { font-family: var(--font-display); font-size: 1.1rem; padding: 6px 16px; }
.stepbar #next { min-width: 11em; background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.stepbar #next:hover { background: var(--sheet); color: var(--pt); }
.stepbar button:disabled { opacity: 0.4; cursor: default; }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Composite Shapes</h1></div>
  </header>
  <div class="main">
    <div class="card calc" id="calc" aria-live="polite"><div class="eqn" id="eqn"></div>
      <div class="stepbar" id="stepbar">
        <button type="button" id="back">◀ Back</button>
        <button type="button" id="next">Next step ▶</button>
        <button type="button" id="all">Show all</button>
      </div>
    </div>
    <div class="board"><canvas id="view" role="img" aria-label="Composite shape. Drag to turn it."></canvas><p class="turn">Drag to turn</p>
      <button type="button" class="py-btn" id="py-btn" aria-pressed="false" hidden>Show Pythagoras</button><div class="py" id="py" hidden></div></div>
    <div class="panel">
      <div class="master" role="group" aria-label="Surface area or volume">
        <button type="button" data-mode="sa" aria-pressed="true">Surface Area</button>
        <button type="button" data-mode="vol" aria-pressed="false">Volume</button>
      </div>
      <div class="card shapes">
        <div class="pick"><span class="who"><i style="background:var(--c-top)"></i>Top</span><select id="sel-top" aria-label="Top shape"></select><div class="dims" id="dims-top"></div></div>
        <div class="pick"><span class="who"><i style="background:var(--c-bot)"></i>Bottom</span><select id="sel-bot" aria-label="Bottom shape"></select><div class="dims" id="dims-bot"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  // ---------- numbers ----------
  const PI = 3.14;
  const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
  const f = x => String(r2(x));
  const sq = x => f(x) + "²", cu = x => f(x) + "³";
  const fr = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
  const ans = v => `<span class="nw">= <b>${f(v)}</b></span>`;

  // ---------- shapes ----------
  const TYPES = {
    cyl:    { name: "Cylinder",           dims: ["r", "h"],      def: { r: 3, h: 5 } },
    cone:   { name: "Cone",               dims: ["r", "h"],      def: { r: 3, h: 4 } },
    prism:  { name: "Rectangular prism",  dims: ["l", "w", "h"], def: { l: 6, w: 4, h: 4 } },
    sqpyr:  { name: "Square pyramid",     dims: ["b", "h"],      def: { b: 6, h: 4 } },
    tripyr: { name: "Triangular pyramid", dims: ["b", "h"],      def: { b: 6, h: 5 } },
    sphere: { name: "Sphere",             dims: ["r"],           def: { r: 3 } },
    hemi:   { name: "Hemisphere",         dims: ["r"],           def: { r: 3 } }
  };
  const DIM_WORD = { r: "radius", h: "height", s: "slant height", l: "length", w: "width", b: "base side" };
  // A picker can be left blank (null): then only the other shape shows.
  const shapes = { top: { type: "cone", given: "h", d: { r: 3, h: 4 } }, bot: { type: "cyl", given: "h", d: { r: 3, h: 5 } } };
  let mode = "sa", sel = -1, shown = 1, pyOn = false;
  // Cones and pyramids can be given their vertical height h or their slant height s; Pythagoras finds the other.
  const POINT = { cone: 1, sqpyr: 1, tripyr: 1 };
  const usesS = sh => !!POINT[sh.type] && sh.given === "s";
  const dimsOf = sh => TYPES[sh.type].dims.map(k => k === "h" && usesS(sh) ? "s" : k);
  const triT = b => r2(Math.sqrt(b * b - (b / 2) ** 2));   // height of the equilateral base triangle
  // The short leg of the slant triangle: r, half the base side, or a third of the base triangle's height.
  const legOf = sh => sh.type === "cone" ? sh.d.r : sh.type === "sqpyr" ? sh.d.b / 2 : r2(triT(sh.d.b) / 3);
  const slantOK = sh => !usesS(sh) || sh.d.s > legOf(sh) + 1e-9;

  const N = 48;   // strips on curved surfaces
  const circlePts = r => Array.from({ length: N }, (_, k) => { const a = 2 * Math.PI * k / N; return [r * Math.cos(a), r * Math.sin(a)]; });
  // The flat face a shape stands on (in x, z). A sphere only touches at a point.
  function footprint(sh) {
    const d = sh.d;
    switch (sh.type) {
      case "cyl": case "cone": case "hemi": return { kind: "circle", r: d.r, pts: circlePts(d.r) };
      case "prism": return { kind: "poly", pts: [[-d.l / 2, -d.w / 2], [d.l / 2, -d.w / 2], [d.l / 2, d.w / 2], [-d.l / 2, d.w / 2]] };
      case "sqpyr": { const b = d.b / 2; return { kind: "poly", pts: [[-b, -b], [b, -b], [b, b], [-b, b]] }; }
      case "tripyr": { const R = d.b / Math.sqrt(3); return { kind: "poly", pts: [0, 1, 2].map(k => { const a = Math.PI / 2 + k * 2 * Math.PI / 3; return [R * Math.cos(a), R * Math.sin(a)]; }) }; }
    }
    return { kind: "point", pts: [[0, 0]] };
  }
  // Does face a fit inside face b (both centered)?
  function inside(a, b) {
    const e = 1e-6;
    if (b.kind === "circle") return a.kind === "circle" ? a.r <= b.r + e : a.pts.every(([x, z]) => Math.hypot(x, z) <= b.r + e);
    const P = b.pts, n = P.length;
    const dist = (x, z, i) => {
      const [ax, az] = P[i], [bx, bz] = P[(i + 1) % n], L = Math.hypot(bx - ax, bz - az);
      let nx = -(bz - az) / L, nz = (bx - ax) / L;
      if (-ax * nx - az * nz < 0) { nx = -nx; nz = -nz; }
      return (x - ax) * nx + (z - az) * nz;
    };
    if (a.kind === "circle") { for (let i = 0; i < n; i++) if (dist(0, 0, i) < a.r - e) return false; return true; }
    return a.pts.every(([x, z]) => { for (let i = 0; i < n; i++) if (dist(x, z, i) < -e) return false; return true; });
  }
  const height = sh => sh.type === "sphere" ? 2 * sh.d.r : sh.type === "hemi" ? sh.d.r : POINT[sh.type] ? derived(sh).h : sh.d.h;

  // ---------- 3D meshes ----------
  // Built standing on the flat face (y = 0, part "join"), going up. The bottom shape is flipped so its flat face
  // is on top, where the top shape sits. Parts: join, cap (the other flat end), side, fb / lr (prism walls).
  const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const vnorm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  function mesh(sh) {
    const d = sh.d, F = [], H = height(sh);
    const face = (P, n, part) => F.push({ P, n: vnorm(n), part });
    const ring = (pts, y) => pts.map(([x, z]) => [x, y, z]);
    const sphereBands = (M, phiMax, cy) => {
      const p = (i, k) => { const ph = phiMax * i / M, th = 2 * Math.PI * k / N; return [d.r * Math.sin(ph) * Math.cos(th), cy + d.r * Math.cos(ph), d.r * Math.sin(ph) * Math.sin(th)]; };
      for (let i = 0; i < M; i++) for (let k = 0; k < N; k++) {
        const ph = phiMax * (i + 0.5) / M, th = 2 * Math.PI * (k + 0.5) / N;
        face([p(i, k), p(i, k + 1), p(i + 1, k + 1), p(i + 1, k)], [Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th)], "side");
      }
    };
    switch (sh.type) {
      case "cyl": {
        const b = ring(circlePts(d.r), 0), t = ring(circlePts(d.r), H);
        face(b, [0, -1, 0], "join"); face(t, [0, 1, 0], "cap");
        for (let k = 0; k < N; k++) { const k2 = (k + 1) % N, a = 2 * Math.PI * (k + 0.5) / N; face([b[k], b[k2], t[k2], t[k]], [Math.cos(a), 0, Math.sin(a)], "side"); }
        break;
      }
      case "cone": {
        const b = ring(circlePts(d.r), 0), A = [0, H, 0];
        face(b, [0, -1, 0], "join");
        for (let k = 0; k < N; k++) { const k2 = (k + 1) % N, a = 2 * Math.PI * (k + 0.5) / N; face([b[k], b[k2], A], [H * Math.cos(a), d.r, H * Math.sin(a)], "side"); }
        break;
      }
      case "prism": {
        const fp = footprint(sh).pts, b = ring(fp, 0), t = ring(fp, H);
        face(b, [0, -1, 0], "join"); face(t, [0, 1, 0], "cap");
        const ns = [[0, 0, -1], [1, 0, 0], [0, 0, 1], [-1, 0, 0]];
        for (let i = 0; i < 4; i++) { const j = (i + 1) % 4; face([b[i], b[j], t[j], t[i]], ns[i], i % 2 ? "lr" : "fb"); }
        break;
      }
      case "sqpyr": case "tripyr": {
        const fp = footprint(sh).pts, b = ring(fp, 0), A = [0, H, 0], n = b.length;
        face(b, [0, -1, 0], "join");
        for (let i = 0; i < n; i++) {
          const p = b[i], q = b[(i + 1) % n];
          let nn = vcross(vsub(q, p), vsub(A, p));
          if (vdot(nn, [(p[0] + q[0]) / 2, 0, (p[2] + q[2]) / 2]) < 0) nn = nn.map(x => -x);
          face([p, q, A], nn, "side");
        }
        break;
      }
      case "sphere": sphereBands(16, Math.PI, d.r); break;
      case "hemi": face(ring(circlePts(d.r), 0), [0, -1, 0], "join"); sphereBands(8, Math.PI / 2, 0); break;
    }
    // Neighbours across each edge; a sharp fold is a crease (always drawn), a gentle one only on the outline.
    const key = p => p.map(v => v.toFixed(4)).join(",");
    const edges = new Map();
    F.forEach((fc, i) => {
      fc.E = fc.P.map((p, j) => {
        const ka = key(p), kb = key(fc.P[(j + 1) % fc.P.length]);
        if (ka === kb) return null;
        const ek = ka < kb ? ka + "|" + kb : kb + "|" + ka;
        if (!edges.has(ek)) edges.set(ek, []);
        edges.get(ek).push([i, j]);
        return { nb: -1, crease: true };
      });
    });
    edges.forEach(list => {
      if (list.length !== 2) return;
      const [[i, a], [j, b]] = list, smooth = vdot(F[i].n, F[j].n) > 0.9;
      F[i].E[a] = { nb: j, crease: !smooth }; F[j].E[b] = { nb: i, crease: !smooth };
    });
    return { F, H };
  }

  // ---------- steps ----------
  function derived(sh) {
    const d = sh.d, o = {};
    if (sh.type === "tripyr") { o.t = triT(d.b); o.in = r2(o.t / 3); }
    if (POINT[sh.type]) {
      o.leg = legOf(sh);
      if (usesS(sh)) { o.s = d.s; o.h = r2(Math.sqrt(Math.max(0, d.s * d.s - o.leg * o.leg))); }
      else { o.h = d.h; o.s = r2(Math.sqrt(d.h * d.h + o.leg * o.leg)); }
    }
    return o;
  }
  // The calculation is written the way it is on the board, one line per step, straight down:
  //   SA(total)    = SA(cone) + SA(cylinder)
  //   SA(cone)     = πrs + πr²                 formulas, one column per face
  //                = πrs + π̶r̶²                 covered faces struck out in red, and why
  //                = 3.14 × 3 × 5             numbers under each formula
  //                = 47.1                     values
  //   SA(cylinder) = ...                      the same for the other shape
  //   SA(total)    = 47.1 + 122.46
  //                = 169.56 units²
  // Every cell is a button; clicking it lights up the face (or solid) that column calculates.
  const SHORT = { cyl: "cylinder", cone: "cone", prism: "prism", sqpyr: "pyramid", tripyr: "pyramid", sphere: "sphere", hemi: "hemisphere" };
  const NAME = role => TYPES[shapes[role].type].name;
  function shortName(role) {
    const same = shapes.top && shapes.bot && SHORT[shapes.top.type] === SHORT[shapes.bot.type];
    return (same ? (role === "top" ? "top " : "bottom ") : "") + SHORT[shapes[role].type];
  }
  const circle = r => ({ sym: "πr²", sub: `3.14 × ${sq(r)}`, v: r2(PI * r * r) });

  // Faces of one shape, in the order they are usually written (top to bottom, curved side last).
  function saTerms(role) {
    const sh = shapes[role], d = sh.d, o = derived(sh), T = (part, x) => ({ role, part, ...x });
    const ends = (j, c) => role === "bot" ? [j, c] : [c, j];   // the join face is the top of the bottom shape
    switch (sh.type) {
      case "cyl": return [...ends(T("join", circle(d.r)), T("cap", circle(d.r))),
        T("side", { sym: "2πrh", sub: `2 × 3.14 × ${d.r} × ${d.h}`, v: r2(2 * PI * d.r * d.h) })];
      case "prism": { const lw = () => ({ sym: "lw", sub: `${d.l} × ${d.w}`, v: d.l * d.w });
        return [...ends(T("join", lw()), T("cap", lw())),
          T("fb", { sym: "2lh", sub: `2 × ${d.l} × ${d.h}`, v: 2 * d.l * d.h }),
          T("lr", { sym: "2wh", sub: `2 × ${d.w} × ${d.h}`, v: 2 * d.w * d.h })]; }
      case "cone": return [T("side", { sym: "πrs", sub: `3.14 × ${d.r} × ${f(o.s)}`, v: r2(PI * d.r * o.s) }), T("join", circle(d.r))];
      case "sqpyr": return [T("side", { sym: `4 × ${fr(1, 2)}bs`, sub: `4 × ${fr(1, 2)} × ${d.b} × ${f(o.s)}`, v: r2(2 * d.b * o.s) }),
        T("join", { sym: "b²", sub: sq(d.b), v: d.b * d.b })];
      case "tripyr": return [T("side", { sym: `3 × ${fr(1, 2)}bs`, sub: `3 × ${fr(1, 2)} × ${d.b} × ${f(o.s)}`, v: r2(1.5 * d.b * o.s) }),
        T("join", { sym: `${fr(1, 2)}bt`, sub: `${fr(1, 2)} × ${d.b} × ${f(o.t)}`, v: r2(d.b * o.t / 2) })];
      case "hemi": return [T("side", { sym: "2πr²", sub: `2 × 3.14 × ${sq(d.r)}`, v: r2(2 * PI * d.r * d.r) }), T("join", circle(d.r))];
      case "sphere": return [T("side", { sym: "4πr²", sub: `4 × 3.14 × ${sq(d.r)}`, v: r2(4 * PI * d.r * d.r) })];
    }
  }
  function volTerm(role) {
    const sh = shapes[role], d = sh.d, o = derived(sh), t = (sym, sub, v) => [{ role, sym, sub, v: r2(v) }];
    const th = fr(1, 3);
    switch (sh.type) {
      case "cyl": return t("πr²h", `3.14 × ${sq(d.r)} × ${d.h}`, PI * d.r * d.r * d.h);
      case "prism": return t("lwh", `${d.l} × ${d.w} × ${d.h}`, d.l * d.w * d.h);
      case "cone": return t(`${th}πr²h`, `${th} × 3.14 × ${sq(d.r)} × ${f(o.h)}`, PI * d.r * d.r * o.h / 3);
      case "sqpyr": return t(`${th}b²h`, `${th} × ${sq(d.b)} × ${f(o.h)}`, d.b * d.b * o.h / 3);
      case "tripyr": return t(`${th}(${fr(1, 2)}bt)h`, `${th} × ${fr(1, 2)} × ${d.b} × ${f(o.t)} × ${f(o.h)}`, d.b * o.t / 2 * o.h / 3);
      case "sphere": return t(`${fr(4, 3)}πr³`, `${fr(4, 3)} × 3.14 × ${cu(d.r)}`, 4 / 3 * PI * d.r ** 3);
      case "hemi": return t(`${fr(2, 3)}πr³`, `${fr(2, 3)} × 3.14 × ${cu(d.r)}`, 2 / 3 * PI * d.r ** 3);
    }
  }
  // Pythagoras, worked out in the picture: the base triangle's height t (triangular pyramid), and the slant height s
  // (when h is given) or the vertical height h (when s is given), in either mode. Each is one block of rows.
  function pyth(role) {
    const sh = shapes[role];
    if (!sh || !POINT[sh.type]) return null;
    const d = sh.d, o = derived(sh), blocks = [];
    const root = (lhs, form, a, b, minus, res) => {
      const op = minus ? "−" : "+";
      return [[lhs, `√(${form})`], ["", `√(${sq(a)} ${op} ${sq(b)})`], ["", `√(${f(a * a)} ${op} ${f(b * b)})`], ["", `<b>${f(res)}</b>`]];
    };
    const legSq = sh.type === "cone" ? "r²" : sh.type === "sqpyr" ? `(${fr("b", 2)})²` : `(${fr("t", 3)})²`;
    let tri = false, slant = null;
    if (sh.type === "tripyr") { tri = true; blocks.push(root("t", `b² − (${fr("b", 2)})²`, d.b, d.b / 2, true, o.t)); }
    const first = sh.type === "tripyr" ? [[fr("t", 3), `${fr(f(o.t), 3)} = <b>${f(o.in)}</b>`]] : [];
    // Always the one that was not given, in both Surface Area and Volume (Shawn 2026-10-20).
    if (!usesS(sh)) { slant = "s"; blocks.push([...first, ...root("s", `h² + ${legSq}`, o.h, o.leg, false, o.s)]); }
    else { slant = "h"; blocks.push([...first, ...root("h", `s² − ${legSq}`, o.s, o.leg, true, o.h)]); }

  }
  const pyAll = () => ["top", "bot"].map(pyth).filter(Boolean);

  // Work out what the join covers. Marks terms with cancel = "full" or "part" (part keeps the face minus the covered bit).
  function applyJoin(groups) {
    const tb = groups[0].terms.find(t => t.part === "join"), bb = groups[1].terms.find(t => t.part === "join");
    if (!tb || !bb) return {};
    const fa = footprint(shapes.bot), fb = footprint(shapes.top), topIn = inside(fb, fa), botIn = inside(fa, fb);
    if (!topIn && !botIn) return { warn: true };
    const small = topIn ? tb : bb, big = topIn ? bb : tb;
    small.cancel = "full";
    if (topIn && botIn) big.cancel = "full";
    else { big.cancel = "part"; big.minus = small; }
    const hidden = { focus: null, lift: true, hl: [], hide: [{ role: small.role }, { role: big.role, hole: small.role }] };
    const ring = big.cancel === "part" ? { role: big.role, focus: big.role, hl: [], ring: { role: big.role, hole: small.role } } : null;
    return { hidden, ring, why: `covered where the ${shortName("top")} sits on the ${shortName("bot")}` };
  }

  let ITEMS = [];
  function buildCalc() {
    ITEMS = [];
    const item = x => (ITEMS.push(x), ITEMS.length - 1);
    const sa = mode === "sa", P = sa ? "SA" : "V";
    const groups = ["top", "bot"].filter(role => shapes[role]).map(role => ({ role, terms: sa ? saTerms(role) : volTerm(role) }));
    if (!groups.length) return { cells: [], cols: 1, rows: 0 };
    const solo = groups.length === 1;
    const J = sa && !solo ? applyJoin(groups) : {};
    const counted = t => t.cancel !== "full";
    const value = t => t.cancel === "part" ? r2(t.v - t.minus.v) : t.v;

    // Items: what each cell lights up.
    groups.forEach(g => g.terms.forEach(t => {
      t.item = item(sa ? { role: t.role, focus: t.role, hl: [t.role + ":" + t.part] } : { role: t.role, focus: t.role, hl: [], whole: [t.role] });
      t.item2 = t.cancel === "full" ? item(J.hidden) : t.cancel === "part" ? item(J.ring) : t.item;
    }));
    const lit = terms => {
      const ts = terms.filter(counted);
      return { hl: sa ? ts.filter(t => t.cancel !== "part").map(t => t.role + ":" + t.part) : [], whole: sa ? [] : [...new Set(ts.map(t => t.role))],
               ring: ts.some(t => t.cancel === "part") ? J.ring.ring : undefined };
    };
    groups.forEach(g => { g.item = item({ role: g.role, focus: g.role, ...lit(g.terms) }); });
    const all = groups.flatMap(g => g.terms);
    const totalItem = item({ focus: null, ...lit(all) });
    const total = r2(all.filter(counted).reduce((m, t) => m + value(t), 0));

    // Columns: label | = | t | + | t | + | t | + | t | end. Each shape gets its own block of lines, one under the other,
    // so the work reads straight down and fits in a column beside the picture.
    const most = Math.max(...groups.map(g => g.terms.length), solo ? 1 : groups.length);
    let n = 0;
    const LBL = ++n, EQ = ++n, TC = [], OPC = [];
    for (let i = 0; i < most; i++) { if (i) OPC[i] = ++n; TC[i] = ++n; }
    const END = ++n;
    groups.forEach(g => g.terms.forEach((t, ti) => { t.col = TC[ti]; t.op = OPC[ti]; }));

    const cells = [];
    let row = 0, step = 0, blk = 0;
    const cell = (col, html, x = {}) => cells.push({ row, step, blk, col, html, ...x });
    const line = (newStep = true, gap = false) => { row++; if (newStep) step++; if (gap) { blk++; cells.push({ row, step, gap: true }); } };
    const pluses = (terms, show) => {   // "=" and the + signs, skipping signs next to blank cells
      cell(EQ, "=", { cls: "op" });
      let seen = false;
      terms.forEach(t => { if (!show(t)) return; if (seen) cell(t.op, "+", { cls: "op" }); seen = true; });
    };
    const name = g => `${P}(${shortName(g.role)})`;
    const units = sa ? "units²" : "units³";

    // SA(total) = SA(cone) + SA(cylinder)
    if (!solo) {
      line();
      cell(LBL, `${P}(total)`, { item: totalItem, cls: "lbl" });
      cell(EQ, "=", { cls: "op" });
      groups.forEach((g, gi) => { if (gi) cell(OPC[gi], "+", { cls: "op" }); cell(TC[gi], name(g), { item: g.item, cls: "hdr " + g.role }); });
    }
    // One block per shape: formulas, covered faces struck out, numbers, values.
    groups.forEach((g, gi) => {
      line(true, !solo);
      cell(LBL, name(g), { item: g.item, cls: "lbl hdr " + g.role });
      pluses(g.terms, () => true);
      g.terms.forEach(t => cell(t.col, t.sym, { item: t.item, cls: "sym" }));
      if (J.warn) {
        if (gi === groups.length - 1) { line(); cell(EQ, ""); cell(TC[0], "The top hangs over the edge. Make the top smaller or the bottom bigger.", { span: END - TC[0] + 1, cls: "warn" }); }
        return;
      }
      if (J.hidden && g.terms.some(t => t.cancel)) {
        line();
        pluses(g.terms, () => true);
        g.terms.forEach(t => {
          const html = t.cancel === "full" ? `<s>${t.sym}</s>` : t.cancel === "part" ? `${t.sym} <span class="red">− ${t.minus.sym}</span>` : t.sym;
          cell(t.col, html, { item: t.item2, cls: "sym" + (t.cancel ? " cut" : "") });
        });
        line(false);
        cell(TC[0], J.why, { item: item(J.hidden), span: END - TC[0] + 1, cls: "why" });
      }
      const left = g.terms.filter(counted);
      line();
      pluses(g.terms, counted);
      left.forEach(t => cell(t.col, t.cancel === "part" ? `${t.sub} − ${t.minus.sub}` : t.sub, { item: t.item2, cls: "num" }));
      line();
      pluses(g.terms, counted);
      const sub = r2(left.reduce((m, t) => m + value(t), 0));
      if (solo && left.length === 1) cell(left[0].col, `<b>${f(sub)}</b> ${units}`, { item: totalItem, cls: "tot", span: END - left[0].col + 1 });
      else {
        left.forEach(t => cell(t.col, f(value(t)), { item: t.item2, cls: "val" }));
        if (solo) cell(END, `= <b>${f(sub)}</b> ${units}`, { item: totalItem, cls: "tot" });
        else if (left.length > 1) { line(false); cell(EQ, "=", { cls: "op" }); cell(TC[0], f(sub), { item: g.item, cls: "sub", span: END - TC[0] + 1 }); }
      }
      g.sub = sub;
    });
    // SA(total) = 47.1 + 122.46
    //           = 169.56 units²
    if (!solo && !J.warn) {
      line(true, true);
      cell(LBL, `${P}(total)`, { item: totalItem, cls: "lbl" });
      cell(EQ, "=", { cls: "op" });
      groups.forEach((g, gi) => { if (gi) cell(OPC[gi], "+", { cls: "op" }); cell(TC[gi], f(g.sub), { item: g.item, cls: "val" }); });
      line(false);
      cell(EQ, "=", { cls: "op" });
      cell(TC[0], `<b>${f(total)}</b> ${units}`, { item: totalItem, cls: "tot", span: END - TC[0] + 1 });
    }
    return { cells, cols: n, rows: step };
  }

  // ---------- drawing ----------
  const cv = document.getElementById("view"), ctx = cv.getContext("2d");
  // Pastel solids with dark edges, the same in light and dark mode (like 3D Shapes and Nets).
  const COL = { bot: [143, 184, 242], top: [201, 167, 240], hl: [255, 190, 70], hide: [226, 70, 70], pale: [222, 227, 234], edge: [27, 39, 51] };
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const rgba = (c, k = 1, a = 1) => `rgba(${c.map(v => Math.max(0, Math.min(255, Math.round(v * k)))).join(",")},${a})`;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let BOT = [], TOP = [], Hb = 1, Ht = 1, lift = 0, liftGoal = 0, yaw = -0.6, pitch = 0.38, raf = 0;
  const L = vnorm([-0.35, 0.55, 0.75]);

  // A bottom shape on its own stands the right way up (it is only flipped to give the top a flat face to sit on).
  let soloBot = false;
  function buildWorld() {
    const none = { F: [], H: 0 }, mb = shapes.bot ? mesh(shapes.bot) : none, mt = shapes.top ? mesh(shapes.top) : none;
    soloBot = !!shapes.bot && !shapes.top;
    Hb = mb.H; Ht = mt.H;
    BOT = mb.F.map(fc => soloBot ? { ...fc, role: "bot" } : { ...fc, role: "bot", P: fc.P.map(p => [p[0], Hb - p[1], p[2]]), n: [fc.n[0], -fc.n[1], fc.n[2]] });
    TOP = mt.F.map(fc => ({ ...fc, role: "top", P: fc.P.map(p => [p[0], p[1] + Hb, p[2]]) }));

      [["h", "Vertical height"], ["s", "Slant height"]].forEach(([g, txt]) => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = txt; b.setAttribute("aria-pressed", String(sh.given === g));
        b.addEventListener("click", () => { if (sh.given === g) return; setGiven(sh, g); renderPick(role); rebuild(); });
        w.appendChild(b);
      });
      host.appendChild(w);
    }
    dimsOf(sh).forEach(key => {
      const w = document.createElement("div");
      w.className = "dim";
      w.innerHTML = `<span class="dk" title="${DIM_WORD[key]}">${key}</span><button type="button" aria-label="Smaller ${DIM_WORD[key]}">−</button><output aria-label="${DIM_WORD[key]}">${sh.d[key]}</output><button type="button" aria-label="Bigger ${DIM_WORD[key]}">+</button>`;
      const [minus, plus] = w.querySelectorAll("button");
      const change = dv => {
        const v = Math.max(1, Math.min(10, sh.d[key] + dv)), old = { ...sh.d };
        if (v === sh.d[key]) return;
        sh.d[key] = v;
        if (!slantOK(sh)) {   // s too short for its base: refuse a shorter s; a bigger base pushes s up
          if (key !== "s") while (!slantOK(sh) && sh.d.s < 10) sh.d.s++;
          if (!slantOK(sh)) { sh.d = old; return; }
        }
        renderPick(role); rebuild(false);
      };
      minus.addEventListener("click", () => change(-1)); plus.addEventListener("click", () => change(1));
      host.appendChild(w);
    });
  }
  ["top", "bot"].forEach(role => {
    const s = document.getElementById("sel-" + role);
    s.appendChild(new Option("", ""));   // blank: no shape here
    Object.entries(TYPES).forEach(([v, t]) => s.appendChild(new Option(t.name, v)));
    s.addEventListener("change", () => {
      const was = shapes[role];
      if (!s.value) shapes[role] = null;
      else {
        const sh = shapes[role] = { type: s.value, given: "h", d: { ...TYPES[s.value].def } };
        resize(role);
        if (POINT[sh.type] && was && was.given === "s") setGiven(sh, "s");   // keep the slant / vertical choice
      }
      renderPick(role); rebuild();
    });
    renderPick(role);
  });
  document.querySelectorAll(".master button").forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    document.querySelectorAll(".master button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    rebuild();
  }));

  // reset: start the calculation over at its first line (a new shape or mode); changing a number keeps the place.
  function rebuild(reset = true) {
    buildWorld();
    sel = -1; liftGoal = 0;
    if (reset) shown = 1;
    renderCalc();
    renderPy();
    const t = shapes.top && NAME("top"), b = shapes.bot && NAME("bot");
    cv.setAttribute("aria-label", t && b ? `${t} on top of a ${b.toLowerCase()}. Drag to turn it.` : (t || b) ? `${t || b}. Drag to turn it.` : "Pick a shape.");
    animate();
  }
  new ResizeObserver(fitCalc).observe(calcEl);

  let drag = null;
  cv.addEventListener("pointerdown", ev => { drag = { x: ev.clientX, y: ev.clientY }; cv.setPointerCapture(ev.pointerId); cv.classList.add("drag"); });
  cv.addEventListener("pointermove", ev => {
    if (!drag) return;
    yaw += (ev.clientX - drag.x) * 0.01;
    pitch = Math.max(-1.3, Math.min(1.3, pitch + (ev.clientY - drag.y) * 0.01));
    drag = { x: ev.clientX, y: ev.clientY };
    draw();
  });
  const end = () => { drag = null; cv.classList.remove("drag"); };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  new ResizeObserver(draw).observe(cv);
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  rebuild();
  if (document.fonts) document.fonts.ready.then(draw);
})();

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }

    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];

    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);

  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;

    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
