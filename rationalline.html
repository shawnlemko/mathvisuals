<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>The Infinite Rational Number Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* The Infinite Rational Number Line (Alberta Math 8: rational and irrational numbers).
   Pick a number, then zoom in ×10 again and again. Each zoom is a new number line under the last one,
   joined by a funnel from the piece the number is in. Rational numbers land on a mark (the decimal stops)
   or repeat; irrational numbers never land and never repeat. Between any two marks there are always more. */
.picks { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.picks .label { margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--sheet); color: var(--ink); font-family: var(--font-num); font-weight: 700; font-size: 1.5rem; padding: 6px 18px; min-height: 64px; min-width: 76px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--grid-major); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.seg .frac { font-size: 0.85em; }
@media (max-width: 600px) { .seg button { min-width: 0; padding: 4px 12px; font-size: 1.25rem; min-height: 56px; } }
.rl.main { grid-template-columns: minmax(0, 2.5fr) minmax(300px, 1fr); }
@media (max-width: 860px) { .rl.main { grid-template-columns: 1fr; } }

.readout { font-family: var(--font-num); font-weight: 700; font-size: 2.4rem; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; line-height: 1.1; }
.readout .sym { color: var(--orange); }
.readout.landed .sym, .readout.landed .dv { color: var(--green); }
.sym .frac > span:first-child { border-bottom-width: 3px; }
.note { font-size: 1.2rem; margin: 0; line-height: 1.4; }
.note + .note { margin-top: 8px; }
.note b { font-family: var(--font-num); }
.note .sq { font-family: var(--font-num); font-size: 1rem; color: var(--muted); display: block; white-space: nowrap; }
.note.big-idea { color: var(--pt); font-weight: 700; }
.rep { text-decoration: overline; text-decoration-thickness: 0.08em; }
.zoom { display: flex; flex-wrap: wrap; gap: 10px; }
.zoom button { flex: 1; font-size: 1.15rem; min-height: 52px; padding: 8px 14px; }
.rl .panel { gap: 12px; }
.rl .panel .card { padding: 14px; }
#zin { flex: 1 1 100%; background: var(--pt); color: var(--sheet); border-color: var(--pt); font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; }
#zin:disabled { background: var(--chip); color: var(--muted); border-color: var(--grid-major); cursor: not-allowed; }
.ri { display: flex; gap: 10px; }
.ri button { flex: 1; font-size: 1.2rem; min-height: 52px; }
.fb { margin: 10px 0 0; font-size: 1.1rem; line-height: 1.4; }
.fb.ok { color: var(--green); font-weight: 700; }
.fb.no { color: var(--warn); font-weight: 700; }
.fb .frac, .note .frac { vertical-align: middle; font-family: var(--font-num); }

.nl { stroke: var(--ink); stroke-width: 4; }
.arrow { fill: var(--ink); }
.tick { stroke: var(--ink); stroke-width: 3; }
.tick.end { stroke-width: 5; }
.tl { fill: var(--ink); font-family: var(--font-num); font-weight: 700; text-anchor: middle; }
.tl .new { fill: var(--pt); }
.zl { fill: var(--muted); font-family: var(--font-body); font-weight: 700; font-size: 26px; }
.funnel { fill: var(--pt); fill-opacity: 0.09; stroke: var(--pt); stroke-opacity: 0.45; stroke-width: 2; stroke-dasharray: 6 6; }
.piece { stroke: var(--pt); stroke-width: 12; stroke-linecap: round; stroke-opacity: 0.55; }
.dot { fill: var(--orange); stroke: var(--sheet); stroke-width: 4; }
.dot.landed { fill: var(--green); }
.chip rect { fill: var(--orange); }
.chip.landed rect { fill: var(--green); }
.chip text { fill: var(--sheet); font-family: var(--font-num); font-weight: 700; font-size: 34px; text-anchor: middle; }
.forever { fill: var(--muted); font-family: var(--font-body); font-weight: 700; font-size: 26px; text-anchor: middle; }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>The Infinite Rational Number Line</h1></div>
    <div class="picks">
      <p class="label">Pick a number</p>
      <div class="seg" id="picks" role="group" aria-label="Pick a number"></div>
    </div>
  </header>

  <div class="main rl">
    <div class="board"><svg id="svg" viewBox="0 0 1400 780" role="img" aria-label="Number lines, each one zoomed in ten times on the last"></svg></div>
    <div class="panel">
      <section class="card zoom">
        <button type="button" id="zin">Zoom in ×10</button>
        <button type="button" id="zout">Zoom out</button>
        <button type="button" id="reset">Start over</button>
      </section>
      <section class="card">
        <div class="readout" id="readout" aria-live="polite"></div>
        <div id="notes" style="margin-top:14px"></div>
      </section>
      <section class="card">
        <p class="label">Rational or irrational?</p>
        <div class="ri">
          <button type="button" data-ans="r">Rational</button>
          <button type="button" data-ans="i">Irrational</button>
        </div>
        <p class="fb" id="fb" aria-live="polite" hidden></p>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("svg");
  const MAX = 6;          // deepest zoom: millionths
  const X0 = 110, X1 = 1290, ROW = 190, ROWS = 4;

  // Each number as exact decimal digits, so the zooms never suffer rounding.
  // frac: digits after the point; stops: the decimal ends there; rep: the digits that repeat.
  const NUMS = [
    { id: "34", sym: [3, 4], neg: false, int: 0, frac: "75", stops: true, kind: "r" },
    { id: "23", sym: [2, 3], neg: false, int: 0, frac: "6666666", rep: "6", kind: "r" },
    { id: "m32", sym: [-3, 2], neg: true, int: 1, frac: "5", stops: true, kind: "r" },
    { id: "r9", sym: "√9", root: 9, neg: false, int: 3, frac: "", stops: true, kind: "r" },
    { id: "r2", sym: "√2", root: 2, neg: false, int: 1, frac: "4142135", kind: "i" },
    { id: "pi", sym: "π", neg: false, int: 3, frac: "1415926", kind: "i" }
  ];
  let num = NUMS[4], level = 0;

  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    parent.appendChild(e);
    return e;
  };
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const MINUS = "−";
  // A fraction stacked as a number over a number (never a slash).
  function frac(n, d) {
    const f = h("span", "frac");
    f.append(h("span", "", String(Math.abs(n))), h("span", "", String(d)));
    if (n >= 0) return f;
    const w = h("span"); w.append(MINUS, f); w.style.display = "inline-flex"; w.style.alignItems = "center"; return w;
  }
  const symNode = n => Array.isArray(n.sym) ? frac(n.sym[0], n.sym[1]) : document.createTextNode(n.sym);
  const symText = n => Array.isArray(n.sym) ? (n.sym[0] < 0 ? MINUS : "") + Math.abs(n.sym[0]) + "/" + n.sym[1] : n.sym;

  // Exact decimal text for the integer T divided by 10^k, e.g. (141, 2) → "1.41".
  function dec(T, k, neg) {
    let s = String(T);
    if (k > 0) { s = s.padStart(k + 1, "0"); s = s.slice(0, -k) + "." + s.slice(-k); }
    return (neg && T !== 0 ? MINUS : "") + s;
  }
  const landsAt = n => n.stops ? n.frac.length : Infinity; // the zoom where the number sits right on a mark
  const landed = () => level >= landsAt(num);
  const value = n => (n.neg ? -1 : 1) * Number(n.int + "." + (n.frac || "0"));

  // The line at zoom k: its 11 marks (as integers over 10^k, left to right) and where the number sits (0 to 1).
  function line(k) {
    if (k === 0) {
      const v = value(num);
      return { marks: Array.from({ length: 11 }, (_, j) => j - 5), k: 0, pos: (v + 5) / 10, piece: Math.floor(v) + 5, zero: true };
    }
    const P = Number(num.int + num.frac.slice(0, k - 1).padEnd(k - 1, "0")); // start of the window, over 10^(k-1)
    const rest = num.frac.slice(k - 1).padEnd(1, "0");
    const pos = Number("0." + rest);                        // place inside the window, 0 to 1
    const dnext = Number(rest[0]);                          // which tenth of the window holds the number
    let marks = Array.from({ length: 11 }, (_, j) => P * 10 + j);
    if (num.neg) { marks = marks.reverse(); return { marks, k, pos: 1 - pos, piece: 9 - dnext, neg: true }; }
    return { marks, k, pos, piece: dnext };
  }

  function draw() {
    svg.replaceChildren();
    const first = Math.max(0, level - (ROWS - 1));
    const n = level - first + 1;
    const top = (780 - n * ROW) / 2 + 92;
    const xs = j => X0 + (X1 - X0) * j / 10;
    for (let k = first; k <= level; k++) {
      const L = line(k), y = top + (k - first) * ROW, last = k === level;
      // Zoom label above the left end.
      el("text", { class: "zl", x: X0 - 70, y: y - 44 }, svg, k === 0 ? "Zoom ×1" : "Zoom ×" + String(10 ** k).replace(/\B(?=(\d{3})+(?!\d))/g, " "));
      el("line", { class: "nl", x1: X0 - 60, y1: y, x2: X1 + 60, y2: y }, svg);
      el("path", { class: "arrow", d: `M${X1 + 78} ${y} l-24 -13 v26 z` }, svg);
      el("path", { class: "arrow", d: `M${X0 - 78} ${y} l24 -13 v26 z` }, svg);
      // The piece holding the number, and the funnel down to the next zoom.
      if (k < level) {
        el("line", { class: "piece", x1: xs(L.piece), y1: y, x2: xs(L.piece + 1), y2: y }, svg);
        const y2 = y + ROW - 34;
        el("path", { class: "funnel", d: `M${xs(L.piece)} ${y + 78} L${xs(L.piece + 1)} ${y + 78} L${X1} ${y2} L${X0} ${y2} Z` }, svg);
      }
      // Marks and labels. Deep zooms label every second mark so the numbers stay large.
      const sparse = k >= 3;
      L.marks.forEach((T, j) => {
        const end = j === 0 || j === 10;
        el("line", { class: "tick" + (end ? " end" : ""), x1: xs(j), y1: y - (end ? 22 : 16), x2: xs(j), y2: y + (end ? 22 : 16) }, svg);
        if (sparse && j % 2) return;
        const s = L.zero ? (T < 0 ? MINUS + -T : String(T)) : dec(T, k, L.neg);
        const room = sparse ? 240 : 118;
        const fs = Math.min(40, room / (0.62 * s.length));
        const t = el("text", { class: "tl", x: xs(j), y: y + 30 + fs, "font-size": fs.toFixed(1) }, svg);
        // The digit this zoom added is blue, so students see one more digit each time.
        if (k > 0 && !end) { el("tspan", {}, t, s.slice(0, -1)); el("tspan", { class: "new" }, t, s.slice(-1)); }
        else t.textContent = s;
      });
      // The number itself.
      const land = last && landed();
      const cx = xs(L.pos * 10);
      el("circle", { class: "dot" + (land || (k >= landsAt(num)) ? " landed" : ""), cx, cy: y, r: 15 }, svg);
      if (last) {
        // The number's name in a chip above its dot; a fraction is stacked, a number over a number.
        const g = el("g", { class: "chip" + (land ? " landed" : "") }, svg);
        const isFrac = Array.isArray(num.sym), tall = isFrac ? 76 : 54;
        const w = isFrac ? (num.sym[0] < 0 ? 92 : 64) : Math.max(70, num.sym.length * 24 + 30);
        el("rect", { x: cx - w / 2, y: y - 38 - tall, width: w, height: tall, rx: 12 }, g);
        el("path", { d: `M${cx - 10} ${y - 39} L${cx + 10} ${y - 39} L${cx} ${y - 24} Z`, style: "fill:" + (land ? "var(--green)" : "var(--orange)") }, g);
        if (isFrac) {
          const fx = num.sym[0] < 0 ? cx + 10 : cx;
          if (num.sym[0] < 0) el("text", { x: cx - 26, y: y - 66, style: "font-size:30px" }, g, MINUS);
          el("text", { x: fx, y: y - 85, style: "font-size:30px" }, g, String(Math.abs(num.sym[0])));
          el("line", { x1: fx - 16, y1: y - 77, x2: fx + 16, y2: y - 77, style: "stroke:var(--sheet);stroke-width:4" }, g);
          el("text", { x: fx, y: y - 46, style: "font-size:30px" }, g, String(num.sym[1]));
        } else el("text", { x: cx, y: y - 53 }, g, num.sym);

  // Text for the panel.
  function panel() {
    const L = line(level), land = landed();
    const r = $("readout");
    r.classList.toggle("landed", land);
    const s = h("span", "sym"); s.append(symNode(num));
    const d = h("span", "dv");
    if (land) d.textContent = num.root ? String(num.int) : (num.neg ? MINUS : "") + num.int + (num.frac ? "." + num.frac : "");
    else if (level === 0) d.textContent = "?";
    else d.textContent = (num.neg ? MINUS : "") + num.int + "." + num.frac.slice(0, level) + "…";
    r.replaceChildren(s, h("span", "", "="), d);

    const notes = $("notes");
    notes.replaceChildren();

  function feedback(ans) {
    const fb = $("fb");
    fb.hidden = false;
    fb.replaceChildren();
    const ok = ans === num.kind;
    fb.className = "fb " + (ok ? "ok" : "no");

    if (num.kind === "i") {
      if (ok) add("Yes! The decimal never stops and never repeats. It can't be written as a fraction.");
      else add("Not quite. Zoom in more: the digits never stop and never repeat, so it is not a fraction.");
    } else if (num.root) {
      if (ok) add("Yes! 3 × 3 = 9, so √9 = 3, a whole number. 3 is a fraction too:", frac(3, 1));
      else add("Not quite. 3 × 3 = 9, so √9 = 3. Some square roots are whole numbers.");
    } else if (num.rep) {
      if (ok) add("Yes! The decimal repeats, and it is a fraction: a number over a number.");
      else add("Not quite. A decimal that repeats is rational: it is a fraction, a number over a number.");
    } else {
      if (ok) add("Yes! The decimal stops, and it is a fraction: a number over a number.");

    }

  function render() { draw(); panel(); }
  function pick(n) {
    num = n; level = 0; $("fb").hidden = true;
    [...$("picks").children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === n.id)));

  }

  NUMS.forEach(n => {
    const b = h("button");
    b.type = "button"; b.dataset.id = n.id;

  $("reset").addEventListener("click", () => { level = 0; render(); });
  document.querySelectorAll(".ri button").forEach(b => b.addEventListener("click", () => feedback(b.dataset.ans)));
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea")) return;
    if (e.key === "+" || e.key === "=" || e.key === "ArrowDown") { e.preventDefault(); $("zin").click(); }
    if (e.key === "-" || e.key === "ArrowUp") { e.preventDefault(); $("zout").click(); }
  });
  pick(num);
})();
</script>

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)

    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +

  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
