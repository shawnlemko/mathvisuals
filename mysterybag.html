<body>
<title>The Mystery Bag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Workbench look (Shawn 2026-11-27): the manipulative tools feel like real classroom materials, not a web form.
   Shared by every tool that links it, so the same pieces look the same everywhere:
   - .wb-board   the work area sits in a wooden frame (same wood as the puzzles' game board)
   - .wb-btn     chunky buttons that press down; add .go (green), .warm (orange), .dark (ink) for colour
   - .wb-card    a cream index card with ruled lines for the step-by-step work
   Pieces drawn in SVG come from workbench.js. Fixed colours, the same in light and dark mode. */
.wb {
  --wb-wood: #b97b43; --wb-rim: #7a4a22; --wb-cream: #fffaf0; --wb-rule: #d8e3ee; --wb-margin: #e8a0a0;
  --wb-ink: #23170c;
}
.wb .wb-board {
  background: linear-gradient(180deg, #dcab70, #b97b43);
  border: 6px solid var(--wb-rim); border-radius: 16px; padding: 8px;
  box-shadow: inset 0 0 30px rgba(60, 30, 10, 0.45), 0 8px 22px rgba(40, 20, 5, 0.22);
}
.wb .wb-board svg { display: block; border-radius: 10px; }
/* Pieces: the drop shadow makes them sit on the mat; a carried piece lifts. */
.wb .wb-body { filter: url(#wb-shadow); }
.wb .lift .wb-body, .wb .dragging .wb-body { filter: url(#wb-lift); }
.wb .wb-label { font-family: var(--font-num); font-weight: 700; letter-spacing: -0.06em; pointer-events: none; }
/* Chunky press-down buttons. */
.wb .wb-btn {
  font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: 0.01em;
  padding: 12px 16px; border-radius: 12px; cursor: pointer; color: #fff;
  background: linear-gradient(180deg, #4d7ce6, #2f5fd0); border: 0;
  box-shadow: 0 5px 0 #1d3f94, 0 7px 12px rgba(0, 0, 0, 0.2), inset 0 2px 0 rgba(255, 255, 255, 0.3);
  transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
}
.wb .wb-btn:hover { filter: brightness(1.06); }
.wb .wb-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1d3f94, 0 2px 4px rgba(0, 0, 0, 0.2), inset 0 2px 0 rgba(255, 255, 255, 0.3); }
.wb .wb-btn:focus-visible { outline: 3px solid #f2b705; outline-offset: 3px; }
.wb .wb-btn.go { background: linear-gradient(180deg, #34a873, #1f7a5a); box-shadow: 0 5px 0 #125240, 0 7px 12px rgba(0, 0, 0, 0.2), inset 0 2px 0 rgba(255, 255, 255, 0.3); }
.wb .wb-btn.warm { background: linear-gradient(180deg, #ef8a3e, #c2571a); box-shadow: 0 5px 0 #8a3a0d, 0 7px 12px rgba(0, 0, 0, 0.2), inset 0 2px 0 rgba(255, 255, 255, 0.3); }
.wb .wb-btn.dark { background: linear-gradient(180deg, #3a4a5a, #1b2733); box-shadow: 0 5px 0 #0b1118, 0 7px 12px rgba(0, 0, 0, 0.2), inset 0 2px 0 rgba(255, 255, 255, 0.2); }
.wb .wb-btn.go:active { box-shadow: 0 1px 0 #125240; } .wb .wb-btn.warm:active { box-shadow: 0 1px 0 #8a3a0d; } .wb .wb-btn.dark:active { box-shadow: 0 1px 0 #0b1118; }
/* Index card: cream, ruled lines, a red margin line; the writing stays dark in both modes. */
.wb .wb-card {
  color: var(--wb-ink); border: 0; border-radius: 6px;
  background:
    linear-gradient(90deg, transparent 0.55em, var(--wb-margin) 0.55em, var(--wb-margin) calc(0.55em + 2px), transparent calc(0.55em + 2px)),
    repeating-linear-gradient(180deg, transparent 0 calc(2.2em - 1px), var(--wb-rule) calc(2.2em - 1px) 2.2em),
    var(--wb-cream);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08), 0 6px 14px rgba(40, 20, 5, 0.18);
  transform: rotate(-0.4deg);
}
.wb .wb-card input { background: #fff; color: var(--wb-ink); }
/* Inside the wooden frame and on the cards the writing stays dark, even in dark mode (the mat is always cream). */
.wb .wb-board, .wb .wb-card { --ink: #1b2733; --line: #1b2733; --muted: #6b5a48; --pt: #2f5fd0; --green: #1f7a5a; --orange: #c2571a; --warn: #a3263c; --sheet: #fffaf0; --chip: #efe3cc; --grid: #e7dcc6; --grid-major: #c9b48f; }
/* Shared SVG parts that the tile tools already use: the work mat is paper, the tray is wood. */
.wb .ws-bg { fill: url(#wb-paper); filter: url(#wb-mat); }
.wb .tray-bg { fill: url(#wb-walnut); filter: url(#wb-tray); stroke: #5e3a1a; stroke-width: 5; }
.wb .trash .can { fill: #f3e6cc; stroke: #5a3818; } .wb .trash .rib { stroke: #5a3818; } .wb .trash .pad { stroke: rgba(58, 36, 16, 0.45); }
/* .wb-board.paper: the whole drawing area is the cream work mat (tools whose drawing has no background of its own). */
.wb .wb-board.paper svg { background: linear-gradient(180deg, #fffaf0, #f6ecd8); }
/* .wb-board.graph (Shawn 2026-11-28, graphing tools): the coordinate grid is printed graph paper clipped to a
   wooden clipboard. Fine blue lines, ink axes, points are glossy push pins that cast a small shadow. */
.wb .wb-board.graph { position: relative; overflow: visible; }
.wb .wb-board.graph svg { background: #fdfcf7; box-shadow: inset 0 0 0 1px rgba(60, 40, 20, 0.08); }
.wb .wb-board.graph { --sheet: #fdfcf7; }
.wb .wb-board.clip::before { content: ""; position: absolute; z-index: 3; left: 50%; top: -16px; width: 168px; height: 36px; transform: translateX(-50%);
  border-radius: 10px 10px 18px 18px; pointer-events: none;
  background: linear-gradient(180deg, #fbfcfd 0%, #d3d9df 38%, #9aa3ad 62%, #c4cbd2 100%);
  box-shadow: 0 5px 10px rgba(20, 20, 30, 0.35), inset 0 1px 0 #fff, inset 0 -2px 3px rgba(0, 0, 0, 0.25); }
.wb .wb-board.clip::after { content: ""; position: absolute; z-index: 4; left: 50%; top: -6px; width: 34px; height: 12px; transform: translateX(-50%);
  border-radius: 6px; background: #4a525b; box-shadow: inset 0 2px 2px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.6); pointer-events: none; }
.wb .mb-minor { stroke: #d3e2ef; stroke-width: 1; }
.wb .mb-major { stroke: #a8c3dc; stroke-width: 1.4; }
.wb .mb-axis { stroke: #1b2733; stroke-width: 2.6; stroke-linecap: round; }
.wb .mb-tick { fill: #1b2733; stroke: #fdfcf7; }
.wb .mb-line { stroke: #1b2733; stroke-width: 3.4; filter: url(#wb-sunk); }
.wb .mb-lbl-bg { fill: #fdfcf7; }
.wb .mb-handle .dot { fill: url(#wb-pin) #2f5fd0; stroke: #16327a; stroke-width: 1.5; filter: url(#wb-shadow); transition: r 0.15s ease-out; }
.wb .mb-handle .ring { stroke: #2f5fd0; opacity: 0.22; stroke-width: 2; }
.wb .mb-handle:hover .dot, .wb .mb-handle:focus-visible .dot, .wb .mb-handle.drag .dot { r: 16px; fill: url(#wb-pin) #2f5fd0; stroke: #f2b705; stroke-width: 3; filter: url(#wb-lift); }
.wb .mb-name { fill: #ffffff; }
.wb .mb-coord { fill: #2f5fd0; stroke: #fdfcf7; }
/* Buttons drawn on the board (Zero pair, Rotate, Duplicate, Delete) sit up off the mat like the HTML buttons. */
.wb :is(.zp, .tb) .bg { filter: url(#wb-shadow); }
</style>
<style>
:root { --red: #c8323c; --blue: #2f5fd0; --yellow: #f2b705; --yellow-ink: #9a6b00;
  --bag: #e8d3ae; --bag-line: #8a6a3a; --bag-dark: #5a4220; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --red: #ff6b74; --blue: #7aa2ff; --yellow: #ffd04a; --yellow-ink: #ffd04a;
  --bag: #3a2f22; --bag-line: #c8a46a; --bag-dark: #0b0805; } }
:root[data-theme="dark"] { --red: #ff6b74; --blue: #7aa2ff; --yellow: #ffd04a; --yellow-ink: #ffd04a;
  --bag: #3a2f22; --bag-line: #c8a46a; --bag-dark: #0b0805; }
.main { grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
.panel { gap: 14px; }

/* With / Without replacement switch */
.switch { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
.switch .side { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; line-height: 1.15; color: var(--muted);
  background: none; border: 0; padding: 4px; text-align: center; cursor: pointer; }
.switch .side.on { color: var(--ink); }
.switch .side:hover { color: var(--pt); }
.toggle { position: relative; width: 84px; height: 46px; border-radius: 999px; padding: 0; background: var(--pt); border: 0; }
.toggle::after { content: ""; position: absolute; top: 5px; left: 5px; width: 36px; height: 36px; border-radius: 50%; background: var(--sheet);
  transition: transform .25s ease; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.toggle[aria-checked="true"] { background: var(--orange); }
.toggle[aria-checked="true"]::after { transform: translateX(38px); }
.switch .side.on.without { color: var(--orange); }
.switch .side.on.with { color: var(--pt); }

/* Marble counts */
.counts { display: flex; flex-direction: column; gap: 8px; }
.count { display: grid; grid-template-columns: 30px minmax(0, 1fr) 48px 56px 48px; align-items: center; gap: 8px; }
.count .dot { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset -4px -4px 0 rgba(0,0,0,.18); }
.count .name { font-weight: 700; font-size: 1.15rem; }
.count output { font-family: var(--font-num); font-weight: 700; font-size: 1.7rem; text-align: center; }
.count button { font-size: 1.5rem; line-height: 1; padding: 6px 0; min-height: 44px; }
.count button:disabled { opacity: .35; cursor: default; }

.pull { width: 100%; font-family: var(--font-display); font-size: 1.4rem; padding: 14px; background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.pull:hover { background: var(--sheet); color: var(--pt); }
.pull:disabled { opacity: .5; cursor: default; background: var(--pt); color: var(--sheet); }

.calc { width: 100%; font-size: 1.1rem; padding: 10px; }
.runs { font-family: var(--font-num); font-size: 1.3rem; margin: 0; }
.runs b { font-size: 1.8rem; }
.tally { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.tally li { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; }
.tally li i { width: 18px; height: 18px; border-radius: 50%; display: inline-block; flex: none; }
.tally li b { margin-left: auto; font-family: var(--font-num); font-size: 1.25rem; }

/* Board drawing */
.bag-body { fill: var(--bag); stroke: var(--bag-line); stroke-width: 4; }
.bag-front { fill: none; stroke: var(--bag-line); stroke-width: 4; }
.bag-mouth { fill: var(--bag-dark); }
.bag-tie { fill: var(--bag-line); }
.hole { fill: none; stroke: var(--muted); stroke-width: 2.5; stroke-dasharray: 5 5; }
.slot { fill: none; stroke: var(--grid-major); stroke-width: 3; stroke-dasharray: 8 7; }
.slot-q { font-family: var(--font-display); font-weight: 800; font-size: 40px; fill: var(--grid-major); }
.slot-lbl { font-family: var(--font-display); font-weight: 800; font-size: 28px; fill: var(--ink); }
.note { font-family: var(--font-body); font-weight: 700; font-size: 22px; }
.note.back { fill: var(--pt); } .note.out { fill: var(--orange); }
.bag-count { font-family: var(--font-body); font-weight: 700; font-size: 30px; fill: var(--ink); }
.bag-count tspan.n { font-family: var(--font-num); font-size: 44px; }
.bag-count.flash tspan.n { fill: var(--orange); }

<script>
/* Workbench: shared physical pieces for the manipulative tools (Shawn 2026-11-27: "more analog, like a game").
   One set of pieces so every tool matches: a wooden tray (same wood as the puzzles' game board),
   a cream paper work mat, and thick glossy plastic algebra tiles and chips.
   Green positive, red negative with dark stripes (so they still read when printed in black and white).

   Workbench.defs(svg)                       adds the shared gradients, stripes, textures and shadows (once per svg)
   Workbench.tile(g, {w, h, neg, label, fs}) draws one plastic tile into group g (clears g first); label may end in ²
   Workbench.chip(g, {cx, cy, r, neg, label, fs}) draws one round counter
   Workbench.wood(parent, {x, y, w, h, rx}) and Workbench.paper(parent, {...}) draw a tray or a work mat
   Fixed colours, the same in light and dark mode, like the puzzles. */
const Workbench = (() => {
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const INK = "#14261b", INK_NEG = "#3a0d0a";

  function defs(svg) {
    if (svg.querySelector(":scope > defs.wb-defs")) return;
    const d = el("defs", { class: "wb-defs" });
    svg.insertBefore(d, svg.firstChild);
    const grad = (id, stops, x2 = 0, y2 = 1) => {
      const g = el("linearGradient", { id, x1: 0, y1: 0, x2, y2 }, d);
      stops.forEach(([o, c, a = 1]) => el("stop", { offset: o, "stop-color": c, "stop-opacity": a }, g));
    };
    // Plastic: lit from above, a little darker at the bottom edge.
    grad("wb-pos", [[0, "#6fe09d"], [0.55, "#3fbf74"], [1, "#24924f"]]);
    grad("wb-neg", [[0, "#ff8f86"], [0.55, "#ec564c"], [1, "#bf2f27"]]);
    grad("wb-gloss", [[0, "#ffffff", 0.55], [1, "#ffffff", 0]]);
    grad("wb-shade", [[0, "#000000", 0], [0.6, "#000000", 0], [1, "#000000", 0.18]]);
    grad("wb-wood", [[0, "#dcab70"], [1, "#b97b43"]]);
    grad("wb-paper", [[0, "#fffaf0"], [1, "#f6ecd8"]]);
    grad("wb-brass", [[0, "#f3dc8a"], [0.5, "#d2ab45"], [1, "#9a7b2f"]]);
    grad("wb-walnut", [[0, "#a86d3a"], [1, "#82512a"]]);
    // Glass marbles: one shading layer over any colour (light top-left, dark rim).
    const rg = el("radialGradient", { id: "wb-ball", cx: "38%", cy: "32%", r: "72%" }, d);
    [[0, "#fff", 0.6], [0.28, "#fff", 0], [0.72, "#000", 0], [1, "#000", 0.42]].forEach(([o, c, a]) => el("stop", { offset: o, "stop-color": c, "stop-opacity": a }, rg));
    // Push-pin heads for graph points: glossy blue, lit from the top left.
    const pin = el("radialGradient", { id: "wb-pin", cx: "35%", cy: "30%", r: "75%" }, d);
    [[0, "#b9ccff"], [0.35, "#4f7fe8"], [1, "#1a3a8f"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, pin));
    // Burlap for cloth bags: a woven tan pattern.
    const bp = el("pattern", { id: "wb-burlap", width: 8, height: 8, patternUnits: "userSpaceOnUse" }, d);
    el("rect", { width: 8, height: 8, fill: "#d9bd8c" }, bp);
    el("path", { d: "M0 2H8M0 6H8", stroke: "#b8955c", "stroke-width": 1.6, "stroke-opacity": 0.55 }, bp);
    el("path", { d: "M2 0V8M6 0V8", stroke: "#f0dcb4", "stroke-width": 1.2, "stroke-opacity": 0.5 }, bp);
    // Dark stripes on every negative piece (Shawn 2026-10-23, for black-and-white printing).
    const st = el("pattern", { id: "wb-stripe", width: 14, height: 14, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, d);
    el("rect", { x: 0, y: 0, width: 5, height: 14, fill: "#5a0f0a", "fill-opacity": 0.28 }, st);
    // Wood grain and paper fibre come from noise, so no image files are needed.
    const tex = (id, freq, opacity, tint) => {
      const f = el("filter", { id, x: 0, y: 0, width: 1, height: 1, "color-interpolation-filters": "sRGB" }, d);
      el("feTurbulence", { type: "fractalNoise", baseFrequency: freq, numOctaves: 3, seed: 7, result: "n" }, f);
      el("feColorMatrix", { in: "n", type: "matrix", values: `0 0 0 0 ${tint[0]}  0 0 0 0 ${tint[1]}  0 0 0 0 ${tint[2]}  0 0 0 ${opacity} 0`, result: "c" }, f);
      el("feComposite", { in: "c", in2: "SourceGraphic", operator: "in", result: "t" }, f);
      const m = el("feMerge", {}, f);
      el("feMergeNode", { in: "SourceGraphic" }, m);
      el("feMergeNode", { in: "t" }, m);
    };
    tex("wb-grain", "0.006 0.18", 0.55, [0.32, 0.17, 0.05]);
    tex("wb-fibre", "0.9", 0.12, [0.45, 0.35, 0.2]);
    // A paper mat or a tray sitting on the wooden frame: the texture plus a soft shadow under it.
    const sit = (id, from) => {
      const f = el("filter", { id, x: "-5%", y: "-5%", width: "110%", height: "115%", "color-interpolation-filters": "sRGB" }, d);
      [...d.querySelector("#" + from).children].forEach(c => f.appendChild(c.cloneNode(true)));
      const m = f.querySelector("feMerge");
      el("feDropShadow", { in: "SourceAlpha", dx: 0, dy: 6, stdDeviation: 7, "flood-color": "#2b1606", "flood-opacity": 0.45, result: "s" }, f);
      f.insertBefore(f.lastChild, m);
      m.insertBefore(el("feMergeNode", { in: "s" }), m.firstChild);
    };
    sit("wb-mat", "wb-fibre");
    sit("wb-tray", "wb-grain");
    // Soft shadow under a piece; a bigger one while it is being carried.
    const sh = (id, dy, blur, a) => {
      const f = el("filter", { id, x: "-20%", y: "-20%", width: "140%", height: "150%" }, d);
      el("feDropShadow", { dx: 0, dy, stdDeviation: blur, "flood-color": "#2b1606", "flood-opacity": a }, f);
    };
    sh("wb-shadow", 3, 2.5, 0.35);
    sh("wb-lift", 12, 8, 0.3);
    sh("wb-sunk", 1, 1.5, 0.25);
  }

  // A label like "x²" is drawn with a raised 2 (the font's ² glyph reads as a separate character).
  function text(parent, x, y, label, fs, fill) {
    const t = el("text", { x, y, "font-size": fs, fill, "text-anchor": "middle", "dominant-baseline": "central", class: "wb-label" }, parent);
    if (!label.endsWith("²")) { t.textContent = label; return t; }
    t.textContent = label.slice(0, -1);
    el("tspan", { dy: "-0.42em", "font-size": "0.62em" }, t).textContent = "2";
    return t;
  }

  function tile(g, { w, h, neg, label, fs, color }) {
    g.replaceChildren();
    const body = el("g", { class: "wb-body" }, g);
    const r = Math.min(9, Math.min(w, h) * 0.16), lip = Math.max(3, Math.min(6, Math.min(w, h) * 0.09));
    // Thick edge (the side of the tile), then the top face, then the shine.
    if (color) {
      // Any colour: the edge is the same colour darkened, the face is lit from above.
      el("rect", { x: 0, y: 0, width: w, height: h, rx: r, fill: color, class: "wb-edge" }, body);
      el("rect", { x: 0, y: 0, width: w, height: h, rx: r, fill: "#000", "fill-opacity": 0.3, "pointer-events": "none" }, body);
      el("rect", { x: 0, y: 0, width: w, height: h - lip, rx: r, fill: color }, body);
      el("rect", { x: 0, y: 0, width: w, height: h - lip, rx: r, fill: "url(#wb-shade)", "pointer-events": "none" }, body);
    } else {
      el("rect", { x: 0, y: 0, width: w, height: h, rx: r, fill: neg ? "#8f1f19" : "#16703b", class: "wb-edge" }, body);
      el("rect", { x: 0, y: 0, width: w, height: h - lip, rx: r, fill: `url(#wb-${neg ? "neg" : "pos"})` }, body);
    }
    if (neg) el("rect", { x: 0, y: 0, width: w, height: h - lip, rx: r, fill: "url(#wb-stripe)" }, body);
    el("rect", { x: 3, y: 3, width: w - 6, height: Math.min(h * 0.42, 70), rx: Math.max(2, r - 2), fill: "url(#wb-gloss)", "pointer-events": "none" }, body);
    el("rect", { x: 1, y: 1, width: w - 2, height: h - lip - 2, rx: r, fill: "none", stroke: "#ffffff", "stroke-opacity": 0.35, "stroke-width": 1.5, "pointer-events": "none" }, body);
    if (label) text(g, w / 2, (h - lip) / 2 + 1, label, fs, neg ? INK_NEG : INK);
  }

  function chip(g, { cx, cy, r, neg, label, fs }) {
    const body = el("g", { class: "wb-body" }, g);
    const lip = Math.max(3, r * 0.12);
    el("circle", { cx, cy: cy + lip / 2, r, fill: neg ? "#8f1f19" : "#16703b", class: "wb-edge" }, body);
    el("circle", { cx, cy: cy - lip / 2, r, fill: `url(#wb-${neg ? "neg" : "pos"})` }, body);
    if (neg) el("circle", { cx, cy: cy - lip / 2, r, fill: "url(#wb-stripe)" }, body);
    el("ellipse", { cx, cy: cy - lip / 2 - r * 0.42, rx: r * 0.62, ry: r * 0.36, fill: "url(#wb-gloss)", "pointer-events": "none" }, body);
    el("circle", { cx, cy: cy - lip / 2, r: r - 1, fill: "none", stroke: "#ffffff", "stroke-opacity": 0.35, "stroke-width": 1.5, "pointer-events": "none" }, body);
    if (label) text(g, cx, cy - lip / 2 + 1, label, fs || r, neg ? INK_NEG : INK);
  }

  // A glass marble of any colour, centred at 0, 0.
  function marble(g, { r, color }) {
    const body = el("g", { class: "wb-body" }, g);
    el("circle", { r, fill: color }, body);
    el("circle", { r, fill: "url(#wb-ball)" }, body);
    el("ellipse", { cx: -r * 0.36, cy: -r * 0.42, rx: r * 0.26, ry: r * 0.17, fill: "#fff", "fill-opacity": 0.85, transform: `rotate(-30 ${-r * 0.36} ${-r * 0.42})` }, body);
    return body;
  }

  // A wooden tray with a darker rim, like the puzzles' game board.
  function wood(parent, { x, y, w, h, rx = 14 }) {
    const g = el("g", { class: "wb-wood" }, parent);
    el("rect", { x, y, width: w, height: h, rx, fill: "url(#wb-wood)", filter: "url(#wb-grain)" }, g);
    el("rect", { x: x + 3, y: y + 3, width: w - 6, height: h - 6, rx: rx - 2, fill: "none", stroke: "#7a4a22", "stroke-width": 6 }, g);
    el("rect", { x: x + 7, y: y + 7, width: w - 14, height: h - 14, rx: rx - 5, fill: "none", stroke: "#ffffff", "stroke-opacity": 0.18, "stroke-width": 2 }, g);
    return g;
  }

  // A cream paper work mat with a faint fibre texture.
  function paper(parent, { x, y, w, h, rx = 10 }) {
    const g = el("g", { class: "wb-paper" }, parent);
    el("rect", { x, y, width: w, height: h, rx, fill: "url(#wb-paper)", filter: "url(#wb-fibre)" }, g);
    return g;
  }

  // One hidden page-wide copy of the defs, so pages that clear and redraw their SVG keep the shared materials.
  function pageDefs() {
    if (document.querySelector("svg.wb-page-defs")) return;
    const s = el("svg", { class: "wb-page-defs", width: 0, height: 0, "aria-hidden": "true", style: "position:absolute;width:0;height:0;overflow:hidden" });
    document.body.appendChild(s);
    defs(s);
  }
  if (document.body) pageDefs(); else document.addEventListener("DOMContentLoaded", pageDefs);

  return { defs, tile, chip, marble, wood, paper, text, pageDefs };
})();
</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const gcd = (a, b) => { while (b) [a, b] = [b, a % b]; return a; };
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const slow = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.2 : 1;
  const wait = ms => new Promise(r => setTimeout(r, ms * slow));
  const ease = k => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
  const tween = (ms, f) => new Promise(res => {
    const t0 = performance.now(), dur = Math.max(1, ms * slow);
    const step = now => { const k = Math.min(1, (now - t0) / dur); f(ease(k)); k < 1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });

  const COLORS = [
    { key: "red", fill: "var(--red)", ink: "var(--red)", glass: "#d8333d" },
    { key: "blue", fill: "var(--blue)", ink: "var(--blue)", glass: "#2f62d8" },
    { key: "yellow", fill: "var(--yellow)", ink: "var(--yellow-ink)", glass: "#f4b90a" },
  ];
  const C = Object.fromEntries(COLORS.map(c => [c.key, c]));
  const MAX = 10;
  const counts = { red: 3, blue: 5, yellow: 0 };
  let without = false, busy = false, runs = 0;
  let tally = new Map();

  // ---------- Stage ----------
  const svg = $("stage");
  Workbench.defs(svg);
  const BX = 240, R = 21, BIG = 36;       // bag center x, marble radius in the bag and pulled out
  const MOUTH = { x: BX, y: 86 };
  const SLOT = [{ x: 600, y: 205 }, { x: 830, y: 205 }];

  const bagG = el("g", {}, svg);
  el("path", { class: "bag-body", d: "M196,136 C110,170 40,270 40,420 C40,560 80,590 240,590 C400,590 440,560 440,420 C440,270 370,170 284,136 Z" }, bagG);
  const holeL = el("g", {}, bagG);
  const inL = el("g", {}, bagG);
  el("path", { class: "bag-body", d: "M192,128 L160,76 Q240,100 320,76 L288,128 Z" }, bagG);
  el("ellipse", { class: "bag-mouth", cx: BX, cy: 82, rx: 74, ry: 12 }, bagG);
  el("rect", { class: "bag-tie", x: 186, y: 124, width: 108, height: 16, rx: 8 }, bagG);
  const bagCount = el("text", { class: "bag-count", x: BX, y: 636, "text-anchor": "middle" }, svg);

  // Slots for the two pulls
  const slotL = el("g", {}, svg);
  SLOT.forEach((s, i) => {
    el("text", { class: "slot-lbl", x: s.x, y: 140, "text-anchor": "middle" }, slotL).textContent = i ? "2nd pull" : "1st pull";
    el("circle", { class: "slot", cx: s.x, cy: s.y, r: BIG + 6 }, slotL);
    el("text", { class: "slot-q", x: s.x, y: s.y + 14, "text-anchor": "middle" }, slotL).textContent = "?";
  });
  const noteL = el("g", {}, svg);   // put back / kept out
  const mathL = el("g", {}, svg);   // fractions and the product (Show/Hide calculations)
  const outL = el("g", {}, svg);    // marbles out of the bag, on top

  // Marble pile: rows fill from the bottom of the bag, each row centered.
  const ROWS = [{ y: 550, n: 6 }, { y: 504, n: 7 }, { y: 458, n: 8 }, { y: 412, n: 8 }, { y: 366, n: 8 }];
  function spots(n) {
    const out = [];
    for (const row of ROWS) {
      const k = Math.min(row.n, n - out.length);
      for (let i = 0; i < k; i++) out.push({ x: BX + (i - (k - 1) / 2) * 46, y: row.y });
      if (out.length >= n) break;
    }
    return out;
  }

  function marbleEl(color, parent) {
    const g = el("g", {}, parent);
    // Glass marbles from the shared workbench kit.
    Workbench.marble(g, { r: R, color: C[color].glass });
    return g;
  }
  const place = (g, x, y, s = 1) => g.setAttribute("transform", `translate(${x} ${y}) scale(${s})`);

  let marbles = [];  // { color, x, y, g, hole, inBag }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function fillBag() {
    holeL.replaceChildren(); inL.replaceChildren(); outL.replaceChildren(); mathL.replaceChildren(); noteL.replaceChildren();
    slotL.querySelectorAll(".slot-q").forEach(q => (q.style.display = ""));
    const colors = shuffle(COLORS.flatMap(c => Array(counts[c.key]).fill(c.key)));
    const sp = spots(colors.length);
    marbles = colors.map((color, i) => {
      const m = { color, x: sp[i].x, y: sp[i].y, inBag: true };
      m.g = marbleEl(color, inL); place(m.g, m.x, m.y);
      return m;
    });
    setBagCount(false);
  }

  const inBag = () => marbles.filter(m => m.inBag);
  function setBagCount(flash) {
    const n = inBag().length;
    bagCount.replaceChildren();
    const t = el("tspan", { class: "n" }, bagCount); t.textContent = n;
    el("tspan", {}, bagCount).textContent = n === 1 ? " marble in the bag" : " marbles in the bag";
    bagCount.classList.toggle("flash", flash);
    svg.setAttribute("aria-label", `A bag with ${n} marbles`);
  }

  // Fly a marble along a curve through the bag's mouth.
  function fly(g, from, to, s0, s1, ms) {
    const c = { x: (from.x + to.x) / 2, y: Math.min(from.y, to.y) - 160 };
    if (from.x < 460 && to.x < 460) c.x = BX;
    return tween(ms, k => {
      const u = 1 - k;
      place(g, u * u * from.x + 2 * u * k * c.x + k * k * to.x, u * u * from.y + 2 * u * k * c.y + k * k * to.y, s0 + (s1 - s0) * k);
    });
  }
  const shake = () => tween(420, k => bagG.setAttribute("transform", `rotate(${Math.sin(k * Math.PI * 6) * 3 * (1 - k)} ${BX} 590)`));

  // Draw a row of fractions and operators centered at x. items: [n, d, color] arrays or strings.
  function equation(items, cx, y, parent) {
    const fs = 46, cw = fs * 0.62;
    const w = items.map(it => (typeof it === "string" ? cw * it.length + 24 : cw * Math.max(String(it[0]).length, String(it[1]).length) + 18));
    let x = cx - w.reduce((a, b) => a + b, 0) / 2;
    items.forEach((it, i) => {
      const mid = x + w[i] / 2;
      if (typeof it === "string") {
        el("text", { class: "op", x: mid, y: y + 14, "text-anchor": "middle" }, parent).textContent = it;
      } else {
        const num = el("text", { class: "fr", x: mid, y: y - 12, "text-anchor": "middle" }, parent);
        num.textContent = it[0];
        if (it[2]) num.style.fill = C[it[2]].ink;
        el("line", { class: "fr-bar", x1: x + 4, x2: x + w[i] - 4, y1: y, y2: y }, parent);
        el("text", { class: "fr", x: mid, y: y + 44, "text-anchor": "middle" }, parent).textContent = it[1];
      }
      x += w[i];
    });
  }

  // ---------- One run: pull 2 marbles ----------
  let pulled = [];   // marble objects sitting in the slots
  async function putBack() {
    mathL.replaceChildren(); noteL.replaceChildren();
    const moving = pulled.filter(Boolean);
    outL.querySelectorAll(".ghost").forEach(g => g.remove());
    await Promise.all(moving.map(p => fly(p.m.g, p.at, p.m, BIG / R, 1, 450)));
    moving.forEach(p => { p.m.inBag = true; p.m.g.remove(); p.m.g = marbleEl(p.m.color, inL); place(p.m.g, p.m.x, p.m.y); });
    holeL.replaceChildren();
    pulled = [];
    slotL.querySelectorAll(".slot-q").forEach(q => (q.style.display = ""));
    setBagCount(false);
  }

  async function pullOne(i) {
    const pool = inBag();
    const m = pool[Math.floor(Math.random() * pool.length)];
    const same = pool.filter(p => p.color === m.color).length;
    await shake();
    m.inBag = false;
    m.hole = el("circle", { class: "hole", cx: m.x, cy: m.y, r: R }, holeL);
    m.g.remove(); m.g = marbleEl(m.color, outL); place(m.g, m.x, m.y);
    slotL.querySelectorAll(".slot-q")[i].style.display = "none";
    await fly(m.g, m, SLOT[i], 1, BIG / R, 850);
    equation([[same, pool.length, m.color]], SLOT[i].x, 330, mathL);
    pulled[i] = { m, at: SLOT[i] };
    return { m, n: same, d: pool.length };
  }

  // With replacement the marble drops back in (a faded copy stays in the slot); without, it stays out.
  async function settle(i, m) {
    if (!without) {
      const ghost = marbleEl(m.color, outL); ghost.classList.add("ghost");
      ghost.setAttribute("opacity", 0.35); place(ghost, SLOT[i].x, SLOT[i].y, BIG / R);
      await fly(m.g, SLOT[i], m, BIG / R, 1, 750);
      m.inBag = true; m.hole.remove();
      m.g.remove(); m.g = marbleEl(m.color, inL); place(m.g, m.x, m.y);
      pulled[i] = null;
      el("text", { class: "note back", x: SLOT[i].x, y: 272, "text-anchor": "middle" }, noteL).textContent = "put back";
      setBagCount(false);
    } else {
      el("text", { class: "note out", x: SLOT[i].x, y: 272, "text-anchor": "middle" }, noteL).textContent = "kept out";
      setBagCount(true);
    }
  }

  // Each press does one pull: 1st pull, then 2nd pull, then the next press starts a new run.
  let first = null;
  async function run() {
    if (busy) return;
    lock(true);
    if (!first) {
      if (pulled.length) await putBack();
      first = await pullOne(0);
      await wait(650);
      await settle(0, first.m);
      setPullLabel();
      return lock(false);
    }
    const a = first;
    const b = await pullOne(1);
    await wait(650);
    await settle(1, b.m);
    await wait(300);

    const n = a.n * b.n, d = a.d * b.d, g = gcd(n, d);
    const t = el("text", { class: "ptitle", x: 700, y: 470, "text-anchor": "middle" }, mathL);
    t.textContent = `P(${a.m.color}, then ${b.m.color})`;
    const items = [[a.n, a.d, a.m.color], "×", [b.n, b.d, b.m.color], "=", [n, d]];
    if (g > 1) items.push("=", [n / g, d / g]);
    equation(items, 700, 560, mathL);

    runs++;
    const key = a.m.color + "," + b.m.color;
    tally.set(key, (tally.get(key) || 0) + 1);
    drawTally();
    first = null;
    setPullLabel();
    lock(false);
  }
  const setPullLabel = () => ($("pull").textContent = first ? "Pull the 2nd marble" : "Pull the 1st marble");

  // ---------- Panel ----------
  function drawTally() {
    $("runs").textContent = runs;
    const ul = $("tally"); ul.replaceChildren();
    [...tally].sort((x, y) => y[1] - x[1]).forEach(([k, v]) => {
      const [c1, c2] = k.split(",");
      const li = document.createElement("li");
      li.innerHTML = `<i style="background:${C[c1].fill}"></i><i style="background:${C[c2].fill}"></i> ${cap(c1)}, then ${c2} <b>${v}</b>`;
      ul.appendChild(li);
    });
  }

  const countsBox = $("counts");
  COLORS.forEach(c => {
    const row = document.createElement("div");
    row.className = "count";
    row.innerHTML = `<span class="dot" style="background:${c.fill}"></span><span class="name">${cap(c.key)}</span>
      <button type="button" data-c="${c.key}" data-d="-1" aria-label="One less ${c.key}">−</button>
      <output id="n-${c.key}"></output>
      <button type="button" data-c="${c.key}" data-d="1" aria-label="One more ${c.key}">+</button>`;
    countsBox.appendChild(row);
  });

  function lock(on) {
    busy = on;
    const total = COLORS.reduce((s, c) => s + counts[c.key], 0);
    $("pull").disabled = on || total < 2;
    countsBox.querySelectorAll("button").forEach(b => {
      const v = counts[b.dataset.c] + +b.dataset.d;
      b.disabled = on || v < 0 || v > MAX;
    });
    COLORS.forEach(c => ($("n-" + c.key).textContent = counts[c.key]));
    [$("toggle"), $("sideWith"), $("sideWithout")].forEach(b => (b.disabled = on));
  }

  // A new bag or a new rule is a new experiment, so the runs start over.
  function restart() { pulled = []; first = null; runs = 0; tally = new Map(); fillBag(); drawTally(); setPullLabel(); lock(false); }

  countsBox.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || busy) return;
    counts[b.dataset.c] = Math.max(0, Math.min(MAX, counts[b.dataset.c] + +b.dataset.d));
    restart();
  });

  function setMode(w) {
    if (busy || w === without) return;
    without = w;
    $("toggle").setAttribute("aria-checked", w);
    $("sideWith").classList.toggle("on", !w);
    $("sideWithout").classList.toggle("on", w);
    restart();
  }
  $("toggle").addEventListener("click", () => setMode(!without));
  $("sideWith").addEventListener("click", () => setMode(false));
  $("sideWithout").addEventListener("click", () => setMode(true));
  $("pull").addEventListener("click", run);
  $("calc").addEventListener("click", e => {
    const show = mathL.style.display === "none";
    mathL.style.display = show ? "" : "none";
    e.target.textContent = show ? "Hide calculations" : "Show calculations";
    e.target.setAttribute("aria-pressed", show);
  });

  restart();
})();
</script>

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
