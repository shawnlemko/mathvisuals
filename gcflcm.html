<title>GCF and LCM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* GCF and LCM: type 2 or 3 whole numbers (2 to 999) and step through one of two strategies.
   Factor Tree splits each number into primes and lines matching primes up. The GCF is the primes every number
   has in common (green); the LCM uses each prime the most times any one number has it (orange). Explanations use
   the math (shared primes, most copies, powers), never the column layout (Shawn).
   Practice tab: students type each number's primes (Factor Tree) or the prime to divide by and the new row (Ladder),
   then the GCF and LCM; each Check gives a short hint, never the answer.
   Ladder divides by primes the numbers share; GCF = the left side, LCM = the L (left side and bottom row).
   With 3 numbers the ladder keeps going for the LCM with primes that go into two of them, bringing the other down.
   The ladder sits on the left; the white space on the right coaches each step: the answer to the last question,
   then the next question ("What prime number can 12 and 18 both be divided by?"), and at the end a GCF box and an
   LCM box that say what each one means. Each prime has its own color in every view. */
:root { --p2: #2f5fd0; --p3: #7a3fc0; --p5: #0f7f8c; --p7: #b8326f; --p11: #8a6a12; --p13: #4a5bb0; --px: #5b6b7a; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --p2: #7aa2ff; --p3: #b58cff; --p5: #4fd0dc; --p7: #ff7fb5; --p11: #e0c060; --p13: #9aa8ff; --px: #9aabbb; }
}
:root[data-theme="dark"] { --p2: #7aa2ff; --p3: #b58cff; --p5: #4fd0dc; --p7: #ff7fb5; --p11: #e0c060; --p13: #9aa8ff; --px: #9aabbb; }

.tabs { display: inline-flex; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.tabs button { border: 0; border-radius: 0; background: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; min-height: 50px; padding: 8px 14px; }
.tabs button + button { border-left: 2px solid var(--grid-major); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
#part { display: flex; }
#part button { flex: 1; font-size: 1.3rem; }
#part button[data-p="gcf"][aria-pressed="true"] { background: var(--green); }
#part button[data-p="lcm"][aria-pressed="true"] { background: var(--orange); }
.tabs button:disabled { color: var(--muted); opacity: 0.55; cursor: not-allowed; }

.main { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); }
.board { padding: 6px; }
.panel { gap: 12px; }
.panel .card { padding: 12px 14px; }
.nums { display: flex; gap: 10px; }
.nums input { width: 100%; min-width: 0; height: 64px; font-family: var(--font-num); font-weight: 700; font-size: 2.1rem; color: var(--ink); background: var(--paper); border: 2px solid var(--grid-major); border-radius: 10px; text-align: center; }
.nums input::placeholder { color: var(--grid-major); }
.err { margin: 8px 0 0; color: var(--warn); font-weight: 700; }
.go { display: flex; gap: 8px; margin-top: 12px; }
#next { flex: 1; font-size: 1.25rem; min-height: 56px; background: var(--pt); color: var(--sheet); border: 2px solid var(--pt); }
#next:hover { background: var(--sheet); color: var(--pt); }
#next:disabled, #back:disabled { background: var(--chip); color: var(--muted); border-color: var(--grid-major); cursor: not-allowed; }
#back, #again { min-height: 56px; }
@media (min-width: 861px) and (min-height: 520px) {
  .wrap .panel { overflow: hidden; }
  .panel .steps { flex: 1 1 auto; min-height: 80px; overflow-y: auto; }
}
.steps ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; }
.steps li { color: var(--muted); font-size: 0.95rem; }
.steps li.now { color: var(--ink); font-size: 1.2rem; font-weight: 700; }
.steps li .m { font-family: var(--font-num); }
.ok { color: var(--green); } .no { color: var(--warn); }
.arow { display: flex; align-items: center; gap: 14px; }
.arow + .arow { margin-top: 6px; }
.alab { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; width: 3.2em; }
.alab.g { color: var(--green); } .alab.l { color: var(--orange); }
.aval { font-family: var(--font-num); font-weight: 700; font-size: 2.1rem; }
.aval.wait { color: var(--muted); }
.aval button { font-family: var(--font-body); font-size: 1rem; }
#hide { margin-top: 10px; }
#hide[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }

/* Board */
.p2 { --c: var(--p2); } .p3 { --c: var(--p3); } .p5 { --c: var(--p5); } .p7 { --c: var(--p7); } .p11 { --c: var(--p11); } .p13 { --c: var(--p13); } .px { --c: var(--px); }
.num { font-family: var(--font-num); font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.num.pr { fill: var(--c); }
.num.dn { fill: var(--muted); }
.ring { fill: var(--sheet); stroke: var(--c); stroke-width: 4; }
.br { stroke: var(--muted); stroke-width: 3; stroke-linecap: round; }
.cell { fill: var(--c); fill-opacity: 0.12; stroke: var(--c); stroke-width: 3; }
.lbl { font-family: var(--font-display); font-weight: 800; fill: var(--ink); dominant-baseline: central; }
.lbl.g, .num.g { fill: var(--green); } .lbl.l, .num.l { fill: var(--orange); }
.say { font-family: var(--font-display); font-weight: 800; fill: var(--ink); text-anchor: middle; }
.say.g { fill: var(--green); } .say.l { fill: var(--orange); }
.hint-t { font-family: var(--font-body); fill: var(--muted); text-anchor: middle; }
.sep { stroke: var(--grid-major); stroke-width: 2; stroke-dasharray: 6 8; }
.gbox { fill: var(--green); fill-opacity: 0.1; stroke: var(--green); stroke-width: 4; }
.gbox.big { fill-opacity: 0.2; stroke-width: 7; }
.lbox { fill: var(--orange); fill-opacity: 0.1; stroke: var(--orange); stroke-width: 5; stroke-linejoin: round; }
.rule { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
.coach { font-family: var(--font-body); color: var(--ink); font-size: 30px; line-height: 1.3; height: 100%; display: flex; flex-direction: column; gap: 22px; }
.coach .a { font-weight: 700; }
.coach .a b { font-size: 40px; }
.coach .a .m { font-family: var(--font-num); font-size: 27px; color: var(--muted); display: block; margin-top: 4px; }
.coach .q { font-family: var(--font-display); font-weight: 800; font-size: 38px; line-height: 1.2; color: var(--pt); border-left: 8px solid var(--pt); padding-left: 18px; }
.coach .q small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 26px; color: var(--muted); margin-top: 6px; }
.coach .box { border: 4px solid var(--c); border-radius: 14px; padding: 10px 18px; font-size: 26px; line-height: 1.25; }
.coach .box.g { --c: var(--green); } .coach .box.l { --c: var(--orange); }
.coach .box h3 { margin: 0 0 2px; font-family: var(--font-display); font-weight: 800; font-size: 40px; color: var(--c); }
.coach .box ul { margin: 2px 0 0; padding-left: 1.1em; }
.coach .box li b { color: var(--c); }
.coach .box .sk { font-weight: 700; margin-top: 2px; }
.coach .box .sk b { color: var(--c); }
.coach .tight .box { font-size: 24px; padding: 8px 16px; }
.coach .tight .box h3 { font-size: 36px; }
.coach .tight { gap: 10px; }
.coach .box .op { font-weight: 700; font-size: 30px; color: var(--c); margin-bottom: 6px; }
.coach .boxes { margin-top: auto; display: flex; flex-direction: column; gap: 14px; }
/* Practice */
body.practicing #back, body.practicing #next, body.practicing #stepsCard, body.practicing #ansCard { display: none; }
.board > svg[hidden] { display: none; }
.practice { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 22px; display: flex; flex-direction: column; gap: 10px; }
.ptop { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-weight: 700; color: var(--muted); }
.tabs.sm button { font-size: 1rem; min-height: 44px; padding: 6px 14px; }
.pq { margin: 6px 0 0; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1.25; color: var(--pt); text-wrap: balance; }
.phint { margin: 0; color: var(--muted); font-size: 1.05rem; }
.prow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 8px; }
.pl { font-family: var(--font-num); font-weight: 700; font-size: 2rem; min-width: 4.2em; text-align: right; }
.pl.g { color: var(--green); font-family: var(--font-display); } .pl.l { color: var(--orange); font-family: var(--font-display); }
.pin { width: 6.5rem; height: 3.4rem; font-family: var(--font-num); font-weight: 700; font-size: 1.8rem; color: var(--ink); background: var(--paper); border: 2px solid var(--grid-major); border-radius: 10px; text-align: center; }
.pin.wide { width: min(22rem, 100%); text-align: left; padding: 0 12px; }
.pin.good { border-color: var(--green); }
.pin.bad { border-color: var(--warn); }
.chk { font-size: 1.1rem; min-height: 3.2rem; padding: 6px 18px; background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.chk:hover { background: var(--sheet); color: var(--pt); }
#pstop { font-size: 1.05rem; min-height: 3.2rem; }
.fb { margin: 0; font-weight: 700; font-size: 1.2rem; min-height: 1.5em; }
.fb.ok { color: var(--green); } .fb.no { color: var(--warn); }
.lwrap { display: flex; flex-wrap: wrap; gap: 24px 36px; align-items: flex-start; }
.lwrap .lside { flex: 1 1 18rem; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.lad { display: grid; align-items: center; font-family: var(--font-num); font-weight: 700; font-size: 2.3rem; }
.lad .ld { text-align: center; padding: 6px 4px; min-height: 4.2rem; display: flex; align-items: center; justify-content: center; }
.lad .ld span { color: var(--c); }
.lad .ln { text-align: center; padding: 6px 8px; min-height: 4.2rem; display: flex; align-items: center; justify-content: center; }
.lad .ln.bar { border-bottom: 4px solid var(--ink); }
.lad .ln.first { border-left: 4px solid var(--ink); }
.lad .ln.dn { color: var(--muted); }
.lad .pin { width: 100%; max-width: 5.6rem; }
.lad .pin.d { width: 4rem; }
.lad .ing { background: color-mix(in srgb, var(--green) 18%, transparent); }
.lad .inl { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--orange) 12%, transparent); }
.pdone { font-family: var(--font-display); font-weight: 800; font-size: 2rem; }
.pdone.g { color: var(--green); } .pdone.l { color: var(--orange); }
/* Logic */
.arc { fill: none; stroke: var(--c); stroke-width: 4; stroke-linecap: round; }
.num.fc { fill: var(--c); }
.pairs { font-family: var(--font-num); font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.pairs tspan { fill: var(--c); }
.head { font-family: var(--font-display); font-weight: 800; fill: var(--ink); dominant-baseline: central; }
.cring { fill: none; stroke: var(--green); stroke-width: 4; }
.lring { fill: var(--orange); fill-opacity: 0.14; stroke: var(--orange); stroke-width: 5; }
.lline { stroke: var(--orange); stroke-width: 4; stroke-dasharray: 2 10; stroke-linecap: round; }
.hop { fill: none; stroke: var(--grid-major); stroke-width: 3; stroke-linecap: round; }
.hop.gap { stroke-dasharray: 4 8; }
.hopt { font-family: var(--font-num); font-weight: 700; fill: var(--muted); text-anchor: middle; }

@media (prefers-reduced-motion: reduce) { .fresh { animation: none; } }

<div class="wrap">

    <h1>GCF and LCM</h1></div>
    <div class="tabs" id="tabs" role="group" aria-label="Strategy">
      <button type="button" data-m="tree" aria-pressed="true">Factor Tree</button>

    </div>

  <div class="main">
    <div class="board"><svg id="svg" viewBox="0 0 1200 860" role="img" aria-label="GCF and LCM steps"></svg><div class="practice" id="prac" hidden></div></div>
    <div class="panel">
      <section class="card" id="partCard" hidden>
        <p class="label">Find</p>
        <div class="tabs" id="part" role="group" aria-label="Find">
          <button type="button" data-p="gcf" aria-pressed="true">GCF</button>
          <button type="button" data-p="lcm" aria-pressed="false">LCM</button>

          <input id="n1" type="text" inputmode="numeric" autocomplete="off" aria-label="First number" value="12">
          <input id="n2" type="text" inputmode="numeric" autocomplete="off" aria-label="Second number" value="18">

        <div class="arow" id="gcfRow"><span class="alab g">GCF</span><span class="aval" id="gcf"></span></div>
        <div class="arow" id="lcmRow"><span class="alab l">LCM</span><span class="aval" id="lcm"></span></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("svg");
  const W = 1200, H = 860;
  let logicPart = "gcf";
  let mode = "tree", nums = [], plan = null, step = 0, fwd = false;
  let hideAns = false, shown = { gcf: false, lcm: false };

  // ---------- helpers ----------
  const el = (tag, attrs, parent = svg, at) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (fwd && at === step) e.classList.add("fresh");
    parent.appendChild(e);
    return e;
  };
  const txt = (s, attrs, parent, at) => { const t = el("text", attrs, parent, at); t.textContent = s; return t; };
  const isPrime = n => { if (n < 2) return false; for (let d = 2; d * d <= n; d++) if (n % d === 0) return false; return true; };
  const factor = n => { const f = []; for (let d = 2; d * d <= n; d++) while (n % d === 0) { f.push(d); n /= d; } if (n > 1) f.push(n); return f; };
  const gcd = (a, b) => b ? gcd(b, a % b) : a;
  const lcm = (a, b) => a / gcd(a, b) * b;
  const fmt = n => n.toLocaleString("en-US");
  const list = a => a.length < 2 ? String(a[0]) : a.length === 2 ? `${a[0]} and ${a[1]}` : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
  const pc = p => [2, 3, 5, 7, 11, 13].includes(p) ? "p" + p : "px";
  // Answers can be hidden so students predict first.
  const A = (k, v) => hideAns && !shown[k] ? "?" : fmt(v);
  // "2 × 3 = 6", or just "6" for a single factor.
  // Long products (more than 6 primes) are grouped with exponents: 2⁹ × 3² × 5 × 11.
  const sup = e => String(e).replace(/\d/g, d => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d]);
  const short = ps => ps.length <= 6 ? ps.join(" × ") : [...new Set(ps)].map(p => { const e = ps.filter(q => q === p).length; return e > 1 ? p + sup(e) : p; }).join(" × ");
  // Powers form: 2 × 2 × 3 → 2² × 3.
  const pw = ps => [...new Set(ps)].map(p => { const e = ps.filter(q => q === p).length; return e > 1 ? p + sup(e) : p; }).join(" × ");
  const word = c => ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"][c] || String(c);
  // Skip counting up to the LCM: "8, 16, 24". Long lists keep the first three and the last.
  const skip = (v, L) => {
    const last = hideAns && !shown.lcm ? "?" : `<b>${fmt(L)}</b>`, c = L / v;
    const head = []; for (let i = 1; i < Math.min(c, c > 6 ? 4 : c); i++) head.push(fmt(i * v));
    return head.join(", ") + (c > 6 ? ", …, " : head.length ? ", " : "") + last;
  };
  const prod = (ps, k, v) => ps.length > 1 ? `${short(ps)} = ${A(k, v)}` : A(k, v);
  const m = s => `<span class="m">${s}</span>`;
  const fr = at => fwd && at === step ? " fresh" : "";
  // Wrapped text on the board (questions, explainers) as HTML inside the SVG, so it scales with the board.
  const coach = (x, y, w, h, html) => {
    const fo = el("foreignObject", { x, y, width: w, height: h });
    const d = document.createElement("div");
    d.className = "coach"; d.innerHTML = html;
    fo.appendChild(d);
  };

  // ---------- Factor Tree ----------
  function buildTree(n) {
    if (isPrime(n)) return { n, kids: [] };
    let d = Math.floor(Math.sqrt(n));
    while (n % d) d--;
    return { n, kids: [buildTree(d), buildTree(n / d)] };
  }
  const leafCount = t => t.kids.length ? leafCount(t.kids[0]) + leafCount(t.kids[1]) : 1;
  const depthOf = t => t.kids.length ? 1 + Math.max(depthOf(t.kids[0]), depthOf(t.kids[1])) : 0;

  function treePlan(ns, g, L) {
    const trees = ns.map(buildTree);
    const D = Math.max(...trees.map(depthOf)), levels = Math.max(1, D);
    const Ls = trees.map(t => Math.max(leafCount(t), 2)), sumL = Ls.reduce((a, b) => a + b);
    const TOP = 50, BOT = 300, gapY = D ? (BOT - TOP) / D : 0;
    const nodes = [];
    let x = 30, minLw = 999;
    trees.forEach((t, i) => {
      const w = 1140 * Ls[i] / sumL, lw = w / leafCount(t);
      minLw = Math.min(minLw, lw);
      let li = 0;
      const place = (node, d, parent) => {
        const r = { n: node.n, d, prime: !node.kids.length, parent, y: TOP + d * gapY };
        nodes.push(r);
        if (!node.kids.length) r.x = x + (li++ + 0.5) * lw;
        else { const a = place(node.kids[0], d + 1, r), b = place(node.kids[1], d + 1, r); r.x = (a.x + b.x) / 2; }
        return r;
      };
      place(t, 0, null);
      x += w;
    });
    const fs = Math.max(26, Math.min(46, minLw * 0.42, D ? gapY * 0.42 : 46));

    // Prime columns: one column per copy of a prime; a number fills the copies it has.
    const counts = ns.map(n => { const c = {}; factor(n).forEach(p => c[p] = (c[p] || 0) + 1); return c; });
    const primes = [...new Set(ns.flatMap(factor))].sort((a, b) => a - b);
    const cols = [];
    primes.forEach(p => {
      const mx = Math.max(...counts.map(c => c[p] || 0));
      for (let j = 0; j < mx; j++) cols.push({ p, j, full: counts.every(c => (c[p] || 0) > j) });
    });
    const gP = cols.filter(c => c.full).map(c => c.p), lP = cols.map(c => c.p);

    const steps = [{ say: () => `Start with ${list(ns)}.` }];
    for (let k = 1; k <= levels; k++) {
      steps.push({ say: () => {
        if (!D) return `${list(ns)} ${ns.length > 1 ? "are" : "is"} prime already. Circle them.`;
        if (k === 1) { const pr = ns.filter(isPrime); return "Split each number into two factors. Circle the primes." + (pr.length ? ` ${list(pr)} ${pr.length > 1 ? "are" : "is"} already prime.` : ""); }
        return k === levels ? "Every branch now ends in a circled prime." : "Keep splitting. Circle each prime.";
      } });
    }
    const T = steps.length;
    steps.push({ say: () => "Write each number as a product of primes. Matching primes line up.<br>" + ns.map(n => { const f = factor(n), p = pw(f); return m(`${n} = ${f.join(" × ")}${p !== f.join(" × ") ? " = " + p : ""}`); }).join("<br>") });
    const G = steps.length;
    steps.push({ say: () => gP.length ? `GCF: the primes every number has in common. ${m(prod(gP, "gcf", g))}` : `No prime is in every number, so GCF = ${A("gcf", g)}.` });
    const LC = steps.length;
    steps.push({ say: () => `LCM: use each prime the most times any one number has it. ${m(`${pw(lP)} = ${A("lcm", L)}`)}` });

    function draw(k) {
      const lev = Math.min(k, levels);
      for (const r of nodes) if (r.parent && r.d <= lev) {
        const p = r.parent, dx = r.x - p.x, dy = r.y - p.y, len = Math.hypot(dx, dy), s0 = fs * 0.85, s1 = fs * 0.9;
        el("line", { class: "br", x1: p.x + dx * s0 / len, y1: p.y + dy * s0 / len, x2: r.x - dx * s1 / len, y2: r.y - dy * s1 / len }, svg, r.d);
      }
      for (const r of nodes) if (r.d <= lev) {
        const at = r.d === 0 ? 0 : r.d;
        const g0 = el("g", {}, svg, at);
        const ring = k >= 1 && r.prime;
        if (ring) el("circle", { class: "ring " + pc(r.n), cx: r.x, cy: r.y, r: Math.max(fs * 0.85, String(r.n).length * fs * 0.33 + 10) }, g0, r.d === 0 ? 1 : at);
        txt(r.n, { class: "num" + (ring ? " pr " + pc(r.n) : ""), x: r.x, y: r.y, "font-size": fs }, g0);
      }
      if (k < T) return;

      el("line", { class: "sep", x1: 20, y1: 356, x2: 1180, y2: 356 });
      const rowH = Math.min(84, 470 / (ns.length + 2)), TY = 376;
      const colW = Math.min(80, 460 / cols.length), cs = Math.min(colW, rowH) * 0.84;
      const cx = i => 250 + (i + 0.5) * colW;
      const ry = i => TY + (i + 0.5) * rowH;
      const cfs = p => Math.min(cs * 0.6, cs * 1.5 / String(p).length);
      const cell = (i, p, parent, at) => {
        el("rect", { class: "cell " + pc(p), x: cx(i) - cs / 2, y: -cs / 2, width: cs, height: cs, rx: 8 }, parent, at);
        txt(p, { class: "num pr " + pc(p), x: cx(i), y: 0, "font-size": cfs(p) }, parent, at);
      };
      if (k >= G) cols.forEach((c, i) => { if (c.full) el("rect", { class: "gbox", x: cx(i) - colW / 2 + 2, y: TY + 3, width: colW - 4, height: ns.length * rowH - 6, rx: 10 }, svg, G); });
      ns.forEach((n, r) => {
        const row = el("g", {}, el("g", { transform: `translate(0 ${ry(r)})` }), T);
        txt(`${n} =`, { class: "lbl", x: 230, y: 0, "text-anchor": "end", "font-size": Math.min(40, rowH * 0.55) }, row);
        cols.forEach((c, i) => { if ((counts[r][c.p] || 0) > c.j) cell(i, c.p, row); });
      });
      const fsA = Math.min(42, rowH * 0.58);
      if (k >= G) {
        const row = el("g", {}, el("g", { transform: `translate(0 ${ry(ns.length)})` }), G);
        txt("GCF =", { class: "lbl g", x: 230, y: 0, "text-anchor": "end", "font-size": fsA }, row);
        cols.forEach((c, i) => { if (c.full) cell(i, c.p, row); });
        if (!gP.length) txt("1", { class: "lbl g", x: 262, y: 0, "font-size": fsA }, row);
      }
      if (k >= LC) {
        const row = el("g", {}, el("g", { transform: `translate(0 ${ry(ns.length + 1)})` }), LC);
        txt("LCM =", { class: "lbl l", x: 230, y: 0, "text-anchor": "end", "font-size": fsA }, row);
        cols.forEach((c, i) => cell(i, c.p, row));
      }
      let html = '<div class="boxes">';
      if (k >= G) html += `<div class="box g${fr(G)}"><h3>GCF = ${A("gcf", g)}</h3>` + (gP.length > 1 ? `<div class="op">${prod(gP, "gcf", g)}</div>` : "") +
        (gP.length ? `The GCF is the smallest pieces (primes) that are in common: ${list(ns)} ${ns.length === 2 ? "both" : "all"} have ${gP.join(" × ")} inside them.` : `No prime piece is in common, so the GCF is 1.`) + "</div>";
      if (k >= LC) {
        const most = primes.map(p => { const c = Math.max(...counts.map(cc => cc[p] || 0)), i = counts.findIndex(cc => (cc[p] || 0) === c);
          return `<li><b>${word(c)} ${p}${c > 1 ? "s" : ""}</b>, because ${ns[i]} = ${pw(factor(ns[i]))}</li>`; }).join("");
        const pf = pw(lP);
        html += `<div class="box l${fr(LC)}"><h3>LCM = ${A("lcm", L)}</h3>` +
          `<div class="op">${pf} = ${A("lcm", L)}</div>` +
          `For each prime, use the most copies any one number has:<ul>${most}</ul></div>`;
      }
      coach(740, 368, 445, 488, html.replace('class="boxes"', 'class="boxes tight"') + "</div>");
    }
    return { steps, draw, gcfAt: G, lcmAt: LC };
  }

  // ---------- Ladder ----------
  function ladderPlan(ns, g, L) {
    const n = ns.length, rows = [ns.slice()], divs = [], down = [ns.map(() => false)];
    const firstPrime = (cur, test) => { const top = Math.max(...cur); for (let p = 2; p <= top; p++) if (isPrime(p) && test(p)) return p; return 0; };
    let cur = ns.slice();
    for (;;) {
      const p = firstPrime(cur, p => cur.every(v => v % p === 0));
      if (!p) break;
      cur = cur.map(v => v / p); divs.push(p); rows.push(cur); down.push(cur.map(() => false));
    }
    const p1 = divs.length;
    if (n > 2) for (;;) {
      const p = firstPrime(cur, p => cur.filter(v => v % p === 0).length >= 2);
      if (!p) break;
      down.push(cur.map(v => v % p !== 0));
      cur = cur.map(v => v % p ? v : v / p); divs.push(p); rows.push(cur);
    }
    const bottom = rows[rows.length - 1];
    const lF = divs.concat(bottom.filter(v => v > 1));

    const steps = [{ r: 1, say: () => "Write the numbers in a row." }];
    for (let i = 0; i < p1; i++) steps.push({ r: i + 2, say: () => `${divs[i]} goes into ${list(rows[i])}. Divide each by ${divs[i]}.` });
    const G = steps.length;
    steps.push({ r: p1 + 1, say: () => (n === 2 ? `No prime goes into both ${list(rows[p1])}. ` : `No prime goes into all of ${list(rows[p1])}. `) +
      (p1 ? `GCF: multiply the left side. ${m(prod(divs.slice(0, p1), "gcf", g))}` : `GCF = ${A("gcf", g)}.`) });
    for (let i = p1; i < divs.length; i++) {
      const yes = rows[i].filter((v, j) => !down[i + 1][j]), no = rows[i].filter((v, j) => down[i + 1][j]);
      steps.push({ r: i + 2, say: () => (i === p1 ? "For the LCM, keep going with primes that go into two numbers. " : "") +
        `${divs[i]} goes into ${list(yes)}. Divide ${yes.length > 1 ? "those" : "it"}` + (no.length ? `, bring ${list(no)} down.` : ".") });
    }
    const LC = steps.length;
    steps.push({ r: rows.length, say: () => (n > 2 && divs.length > p1 ? "No prime goes into two of them now. " : "") +
      `LCM: multiply the L, the left side and the bottom row. ${m(prod(lF, "lcm", L))}` });

    // Coaching on the right: the answer to the last question, then the next question.
    const all = vals => n === 2 ? `both ${list(vals)}` : `all of ${list(vals)}`;
    const qAll = vals => `What prime number can ${n === 2 ? `${vals[0]} and ${vals[1]} both` : `${list(vals)} all`} be divided by?`;
    const q2 = vals => `What prime number can at least two of ${list(vals)} be divided by?`;
    const divLine = (i, skip) => rows[i].map((v, j) => skip[j] ? `${v} comes down` : `${v} ÷ ${divs[i]} = ${rows[i + 1][j]}`).join("<br>");
    const coachAt = k => {
      if (k === 0) return { q: qAll(rows[0]) + "<small>Try 2, then 3, 5, 7 …</small>" };
      if (k < G) { const i = k - 1; return { a: `<b>${divs[i]}</b> ✓ Divide each one by ${divs[i]}.<span class="m">${divLine(i, down[i + 1])}</span>`, q: qAll(rows[i + 1]) }; }
      if (k === G) return { a: `None! Only 1 divides ${all(rows[p1])}, so stop.`,
        q: n > 2 ? "For the LCM, keep going. " + q2(rows[p1]) : "What do you get when you multiply the L, the left side and the bottom row?" };
      if (k < LC) { const i = p1 + (k - G - 1), no = rows[i].filter((v, j) => down[i + 1][j]);
        return { a: `<b>${divs[i]}</b> ✓ Divide the ones it goes into. Bring ${list(no)} down.<span class="m">${divLine(i, down[i + 1])}</span>`, q: q2(rows[i + 1]) }; }
      return { a: n > 2 ? `None! No prime divides two of ${list(bottom)}, so stop.` : "" };
    };

    function draw(k) {
      const s = steps[k], newRow = k > 0 && steps[k - 1].r < s.r, R = rows.length, rowH = Math.min(120, 780 / R), fs = Math.min(64, rowH * 0.6), TOP = 30;
      const divX = 70, barX = 120, colW = n === 3 ? 150 : 190;
      const colX = j => barX + 90 + j * colW, rightX = colX(n - 1) + 85;
      const y = i => TOP + (i + 0.5) * rowH;
      const halfW = Math.max(40, String(Math.max(...divs, 2)).length * fs * 0.32 + 12);
      if (k >= G && p1) el("rect", { class: "gbox", x: divX - halfW, y: TOP + 4, width: halfW * 2, height: p1 * rowH - 8, rx: 12 }, svg, G);
      if (k >= LC) {
        const x1 = divX - halfW - 6, x2 = divX + halfW + 6, yT = TOP, yB0 = TOP + (R - 1) * rowH, yB1 = TOP + R * rowH;
        el("path", { class: "lbox", d: `M${x1} ${yT} H${x2} V${yB0} H${rightX} V${yB1} H${x1} Z` }, svg, LC);
      }
      for (let i = 0; i < s.r; i++) {
        rows[i].forEach((v, j) => {
          const dn = down[i][j];
          const gg = el("g", {}, svg, newRow && i + 1 === s.r ? k : -1);
          txt(fmt(v), { class: "num" + (dn ? " dn" : ""), x: colX(j), y: y(i), "font-size": fs }, gg);
          if (dn) txt("↓", { class: "num dn", x: colX(j) - fs * 1.05, y: y(i), "font-size": fs * 0.6 }, gg);
        });
        if (i + 1 < s.r) {
          const at = newRow && i + 2 === s.r ? k : -1;
          txt(divs[i], { class: "num pr " + pc(divs[i]), x: divX, y: y(i), "font-size": fs }, svg, at);
          el("line", { class: "rule", x1: barX, y1: y(i) - rowH * 0.42, x2: barX, y2: y(i) + rowH * 0.5 }, svg, at);
          el("line", { class: "rule", x1: barX, y1: y(i) + rowH * 0.5, x2: rightX, y2: y(i) + rowH * 0.5 }, svg, at);
        }
      }
      const c = coachAt(k);
      let html = `<div class="${fr(k).trim()}">` + (c.a ? `<div class="a">${c.a}</div>` : "") + "</div>";
      if (c.q) html += `<div class="q${fr(k)}">${c.q}</div>`;
      html += '<div class="boxes">';
      const gl = divs.slice(0, p1);
      if (k >= G) html += `<div class="box g${fr(G)}"><h3>GCF = ${A("gcf", g)}</h3>` + (gl.length > 1 ? `<div class="op">${prod(gl, "gcf", g)}</div>` : "") +
        (gl.length ? "Multiply the left side. " : "No prime divides them all. ") + `The GCF is the <b>greatest</b> number that divides into ${list(ns)}.</div>`;
      if (k >= LC) html += `<div class="box l${fr(LC)}"><h3>LCM = ${A("lcm", L)}</h3>${lF.length > 1 ? `<div class="op">${prod(lF, "lcm", L)}</div>` : ""}` +
        `Multiply the L. The LCM is the first number you reach when you count by ${list(ns.map(v => v + "s"))}:` +
        ns.map(v => `<div class="sk">${v}s: ${skip(v, L)}</div>`).join("") + "</div>";
      coach(Math.max(rightX + 40, 560), 20, 1185 - Math.max(rightX + 40, 560), 830, html + "</div>");
    }
    return { steps, draw, gcfAt: G, lcmAt: LC };
  }

  // ---------- Logic ----------
  // GCF: list every factor of each number in a line, with an arc joining each factor pair (1 × 12, 2 × 6, 3 × 4).
  // Circle the factors in common; the greatest one is the GCF.
  // LCM: skip count each number in a row. The first number in every list is the LCM.
  function logicPlan(ns, g, L) {
    const n = ns.length;
    const facs = ns.map(v => { const f = []; for (let d = 1; d <= v; d++) if (v % d === 0) f.push(d); return f; });
    const common = facs[0].filter(d => facs.every(f => f.includes(d)));
    const pairsOf = v => { const ps = []; for (let d = 1; d * d <= v; d++) if (v % d === 0) ps.push([d, v / d]); return ps; };
    const PCOL = ["p2", "p3", "p5", "p7", "p11", "p13"];
    const both = n === 2 ? "both" : "all the";
    // Shawn: GCF or LCM, one at a time (the switch in the panel). The other part's step numbers are Infinity.
    const steps = [{ say: () => `Start with ${list(ns)}.` }];
    let C = Infinity, G = Infinity, M = Infinity, LC = Infinity;
    if (logicPart === "gcf") {
      ns.forEach(v => steps.push({ say: () => `Factors of ${v}: ${m(pairsOf(v).map(([a, b]) => `${a} × ${b}`).join(", "))}` }));
      C = steps.length;
      steps.push({ say: () => `Circle the factors in common: ${m(list(common))}` });
      G = steps.length;
      steps.push({ say: () => `GCF: the greatest factor in common. ${m(`GCF = ${A("gcf", g)}`)}` });
    } else {
      M = steps.length;
      ns.forEach(v => steps.push({ say: () => `Count by ${v}s: ${m(skip(v, L))}` }));
      LC = steps.length;
      steps.push({ say: () => `LCM: the first number in ${n === 2 ? "both lists" : "every list"}. ${m(`LCM = ${A("lcm", L)}`)}` });
    }

    const BOT = 600; // rows above, coaching below
    function drawFactors(k) {
      const rowH = Math.min(270, BOT / n);
      const maxN = Math.max(...facs.map(f => f.length)), maxLen = String(Math.max(...ns)).length;
      const cw = Math.min(120, 1100 / maxN), fs = Math.max(16, Math.min(50, cw * 0.82 / (maxLen * 0.62), rowH * 0.22));
      ns.forEach((v, r) => {
        const top = 10 + r * rowH, yHead = top + 20, yN = top + rowH - 80, yP = yN + fs * 0.6 + 26;
        txt(`Factors of ${v}`, { class: "head", x: 24, y: yHead, "font-size": 30 }, svg, 0);
        if (k < r + 1) return;
        const f = facs[r], x0 = 600 - (f.length * cw) / 2, x = i => x0 + (i + 0.5) * cw;
        const ps = pairsOf(v), archH = yN - fs * 0.6 - (yHead + 26), span0 = x(f.length - 1) - x(0);
        const row = el("g", {}, svg, r + 1);
        ps.forEach(([a, b], j) => {
          const xa = x(f.indexOf(a)), xb = x(f.indexOf(b)), y = yN - fs * 0.6, c = PCOL[j % PCOL.length];
          if (a === b) { const w = cw * 0.28; el("path", { class: "arc " + c, d: `M${xa - w} ${y} A${w} ${Math.max(18, archH * 0.18)} 0 0 1 ${xa + w} ${y}` }, row); }
          else { const ry = Math.max(16, archH * (xb - xa) / (span0 || 1)); el("path", { class: "arc " + c, d: `M${xa} ${y} A${(xb - xa) / 2} ${ry} 0 0 1 ${xb} ${y}` }, row); }
        });
        const colOf = d => PCOL[ps.findIndex(p => p.includes(d)) % PCOL.length];
        f.forEach((d, i) => {
          if (k >= C && common.includes(d)) {
            const big = k >= G && d === g && !(hideAns && !shown.gcf), w = Math.max(cw * 0.9, String(d).length * fs * 0.62 + 16), h = fs * 1.25;
            el("rect", { class: big ? "gbox big" : "cring", x: x(i) - w / 2, y: yN - h / 2, width: w, height: h, rx: 12 }, svg, big ? G : C);
          }
          txt(d, { class: "num fc " + colOf(d), x: x(i), y: yN, "font-size": fs }, row);
        });
        const t = el("text", { class: "pairs", x: 600, y: yP, "font-size": Math.min(30, fs * 0.75) }, row);
        ps.forEach(([a, b], j) => {
          const s1 = document.createElementNS(NS, "tspan"); s1.setAttribute("class", PCOL[j % PCOL.length]); s1.textContent = `${a} × ${b}`;
          if (j) s1.setAttribute("dx", Math.min(30, fs * 0.75) * 1.4);
          t.appendChild(s1);
        });
      });
    }
    function drawMultiples(k) {
      const rowH = Math.min(250, BOT / n);
      const cnt = ns.map(v => L / v + 1), maxLen = Math.max(...ns.map(v => fmt(L + v).length));
      const cells = Math.max(5, Math.min(18, Math.floor(1100 / (maxLen * 0.62 * 36 + 24))));
      // Short lists sit on one shared scale, like a number line, so the LCM lines up in a column in every row.
      // Long lists are evenly spaced and shortened with …
      const lined = Math.max(...cnt) <= cells, mn = Math.min(...ns), span = L + Math.max(...ns);
      const cw = lined ? Math.min(220, 1100 * mn / span) : 1100 / cells;
      const fs = Math.max(18, Math.min(60, cw * 0.72 / (maxLen * 0.62), rowH * 0.32));
      const lx = val => 40 + (val - mn) / (span - mn) * (1100 - cw) + cw / 2;
      let lcmX = 0;
      const rings = [];
      ns.forEach((v, r) => {
        const top = 10 + r * rowH, yHead = top + 20, yN = top + rowH - 50;
        txt(`Count by ${v}s`, { class: "head", x: 24, y: yHead, "font-size": 30 }, svg, 0);
        if (k < M + r) return;
        // Every multiple up to one past the LCM; a long list keeps the start, then …, the LCM and one more.
        const items = [];
        if (cnt[r] <= cells) for (let i = 1; i <= cnt[r]; i++) items.push(i * v);
        else { for (let i = 1; i <= cells - 3; i++) items.push(i * v); items.push(null, L, L + v); }
        const row = el("g", {}, svg, M + r);
        const x = i => lined ? lx(items[i]) : 40 + (i + 0.5) * cw;
        items.forEach((val, i) => {
          if (i) {
            const gap = val === null || items[i - 1] === null, pad = Math.min(cw * 0.12, (x(i) - x(i - 1)) * 0.12), xa = x(i - 1) + pad, xb = x(i) - pad, y = yN - fs * 0.62, ry = Math.min(30, rowH * 0.14);
            el("path", { class: "hop" + (gap ? " gap" : ""), d: `M${xa} ${y} A${(xb - xa) / 2} ${ry} 0 0 1 ${xb} ${y}` }, row);
            if (i === 1) txt(`+${fmt(v)}`, { class: "hopt", x: (xa + xb) / 2, y: y - ry - 10, "font-size": Math.min(26, fs * 0.6) }, row);
          }
          if (val === L && k >= LC && !(hideAns && !shown.lcm)) {
            const w = Math.max(cw * 0.9, fmt(L).length * fs * 0.62 + 16), h = fs * 1.3;
            lcmX = x(i); rings.push([yN - h / 2, yN + h / 2]);
            el("rect", { class: "lring", x: x(i) - w / 2, y: yN - h / 2, width: w, height: h, rx: 12 }, svg, LC);
          }
          txt(val === null ? "…" : fmt(val), { class: "num" + (val === null ? " dn" : ""), x: x(i), y: yN, "font-size": fs }, row);
        });
      });
      if (lined && lcmX) for (let r = 1; r < rings.length; r++) el("line", { class: "lline", x1: lcmX, y1: rings[r - 1][1] + 6, x2: lcmX, y2: rings[r][0] - 6 }, svg, LC);
    }
    const coachAt = k => {
      if (logicPart === "gcf") {
        if (k === 0) return { q: `What pairs of numbers multiply to make ${ns[0]}?<small>Start with 1 × ${ns[0]}.</small>` };
        if (k < n) return { q: `Now find the factor pairs of ${ns[k]}.` };
        if (k < C) return { q: `Which factors are in ${both} lists?<small>Look for the greatest factor in common.</small>` };
        if (k === C) return { a: `In common: <b>${list(common)}</b>`, q: "Which factor in common is the greatest?" };
        return {};
      }
      if (k === 0) return { q: `Count by ${ns[0]}s.<small>Add ${ns[0]} each time.</small>` };
      if (k < LC) return k - M < n - 1 ? { q: `Now count by ${ns[k - M + 1]}s.` } :
        { q: n === 2 ? "Look through both lists. What is the first number in both?" : "Look through all the lists. What is the first number in all of them?" };
      return {};
    };
    function draw(k) {
      if (logicPart === "gcf") drawFactors(k); else drawMultiples(k);
      el("line", { class: "sep", x1: 20, y1: BOT + 14, x2: 1180, y2: BOT + 14 });
      const c = coachAt(k);
      let html = (c.a ? `<div class="a${fr(k)}">${c.a}</div>` : "") + (c.q ? `<div class="q${fr(k)}">${c.q}</div>` : "") + '<div class="boxes">';
      if (k === G) html += `<div class="box g${fr(G)}"><h3>GCF = ${A("gcf", g)}</h3>The GCF is the greatest factor that ${list(ns)} have in common.</div>`;
      if (k >= LC) html += `<div class="box l${fr(LC)}"><h3>LCM = ${A("lcm", L)}</h3>The LCM is the lowest number in ${n === 2 ? "both lists" : "every list"}: the first one you reach when you count by ${list(ns.map(v => v + "s"))}.</div>`;
      coach(24, BOT + 26, 1152, H - BOT - 30, html + "</div>");
    }
    return { steps, draw, gcfAt: G, lcmAt: LC };
  }

  // ---------- Practice ----------
  // Students do the work: type each number's primes (Factor Tree) or the prime to divide by and the new row (Ladder),
  // then the GCF and LCM. Every check gives a short hint instead of the answer.
  let pm = "tree", pr = null;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const readInt = s => { s = String(s).trim().replace(/,/g, ""); return /^\d+$/.test(s) ? +s : NaN; };
  function parseFactors(s) {
    s = s.trim().replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, t => "^" + [...t].map(c => "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c)).join("")).replace(/\s*\^\s*/g, "^");
    if (!s) return [];
    const out = [];
    for (const part of s.split(/\s*[×xX*·•,]\s*|\s+/).filter(Boolean)) {
      const mm = /^(\d+)(?:\^(\d+))?$/.exec(part);
      if (!mm || +(mm[2] || 1) > 20) return null;
      for (let e = 0; e < +(mm[2] || 1); e++) out.push(+mm[1]);
    }
    return out;
  }
  const say = (el0, ok, html) => { el0.className = "fb " + (ok ? "ok" : "no"); el0.innerHTML = (ok ? "✓ " : "") + html; };
  const allOf = ns => ns.length === 2 ? `both ${list(ns)}` : `all of ${list(ns)}`;

  function checkGcf(v, ns, g, why) {
    if (!Number.isInteger(v)) return [false, "Type a whole number."];
    if (v === g) return [true, why];
    const miss = ns.find(n => n % v);
    if (miss !== undefined) return [false, `${v} does not go into ${miss}.`];
    return [false, `${v} goes into ${list(ns)}, but it is not the greatest. Did you use every prime they share?`];
  }
  function checkLcm(v, ns, L, why, hint) {
    if (!Number.isInteger(v)) return [false, "Type a whole number."];
    if (v === L) return [true, why];
    const miss = ns.find(n => v % n);
    if (miss !== undefined) return [false, `${miss} does not go into ${fmt(v)}. ${hint}`];
    return [false, `${list(ns)} ${ns.length === 2 ? "both" : "all"} go into ${fmt(v)}, but there is a smaller one. ${hint}`];
  }

  function pracStart() {
    const box = $("prac");
    if (!nums.length) { box.innerHTML = '<p class="pq">Type two or three numbers.</p>'; return; }
    const ns = nums, g = ns.reduce(gcd), L = ns.reduce(lcm);
    pr = { ns, g, L };
    const top = `<div class="ptop"><span>Practice with</span><div class="tabs sm" id="pmTabs">` +
      `<button type="button" data-p="tree" aria-pressed="${pm === "tree"}">Factor Tree</button>` +
      `<button type="button" data-p="ladder" aria-pressed="${pm === "ladder"}">Ladder</button></div></div>`;
    box.innerHTML = top + '<div id="pbody"></div>';
    $("pmTabs").onclick = e => { const b = e.target.closest("button"); if (b) { pm = b.dataset.p; pracStart(); } };
    (pm === "tree" ? treePractice : ladderPractice)($("pbody"));
  }
  // Enter in a practice box presses the Check button on its row.
  const onEnter = (inp, fn) => inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); fn(); } });

  function treePractice(body) {
    const { ns, g, L } = pr;
    body.innerHTML = '<p class="pq">Write each number as a product of primes.</p><p class="phint">Use × or x between primes. Powers like 2^2 work too.</p>' +
      ns.map((n, i) => `<div class="prow"><span class="pl">${n} =</span><input class="pin wide" id="pf${i}" autocomplete="off" aria-label="Primes of ${n}"><button type="button" class="chk" data-i="${i}">Check</button><span class="fb" id="pff${i}"></span></div>`).join("") +
      `<div id="pgl" hidden>
        <p class="pq">Which primes do ${ns.length === 2 ? "both" : "all the"} numbers have in common? Multiply them.</p>
        <div class="prow"><span class="pl g">GCF =</span><input class="pin" id="pg" inputmode="numeric" autocomplete="off" aria-label="GCF"><button type="button" class="chk" id="pgc">Check</button><span class="fb" id="pgf"></span></div>
        <div id="pll" hidden>
          <p class="pq">For each prime, what is the most times any one number has it? Multiply those.</p>
          <div class="prow"><span class="pl l">LCM =</span><input class="pin" id="pl" inputmode="numeric" autocomplete="off" aria-label="LCM"><button type="button" class="chk" id="plc">Check</button><span class="fb" id="plf"></span></div>
        </div>
      </div>`;
    const good = ns.map(() => false);
    const counts = ns.map(n => { const c = {}; factor(n).forEach(p => c[p] = (c[p] || 0) + 1); return c; });
    const primes = [...new Set(ns.flatMap(factor))].sort((a, b) => a - b);
    const gP = [], lP = [];
    primes.forEach(p => { const lo = Math.min(...counts.map(c => c[p] || 0)), hi = Math.max(...counts.map(c => c[p] || 0));
      for (let j = 0; j < lo; j++) gP.push(p); for (let j = 0; j < hi; j++) lP.push(p); });
    const checkRow = i => {
      const n = ns[i], inp = $("pf" + i), fb = $("pff" + i), f = parseFactors(inp.value);
      let ok = false, msg;
      if (f === null) msg = "Type primes with × between them, like 2 × 2 × 3.";
      else if (!f.length) msg = `Type the primes that multiply to ${n}.`;
      else if (f.includes(1) || f.includes(0)) msg = "Leave out 1. It is not prime.";
      else if (f.some(p => !isPrime(p))) { const c = f.find(p => !isPrime(p)); msg = `${c} is not prime. Split it into primes.`; }
      else { const pv = f.reduce((a, b) => a * b, 1);
        if (pv !== n) msg = `Those multiply to ${fmt(pv)}, not ${n}.`;
        else { ok = true; msg = `${n} = ${pw(f.slice().sort((a, b) => a - b))}`; } }
      say(fb, ok, msg); inp.classList.toggle("good", ok); inp.classList.toggle("bad", !ok);
      good[i] = ok;
      if (good.every(Boolean)) $("pgl").hidden = false;
      const next = good.findIndex(x => !x);
      if (ok) (next >= 0 ? $("pf" + next) : $("pg")).focus();
    };
    ns.forEach((n, i) => onEnter($("pf" + i), () => checkRow(i)));
    body.querySelectorAll("button.chk[data-i]").forEach(b => b.onclick = () => checkRow(+b.dataset.i));
    const checkG = () => {
      const why = gP.length ? `${list(ns)} ${ns.length === 2 ? "both" : "all"} have ${pw(gP)} inside them.` : "No prime is in all of them, so the GCF is 1.";
      const [ok, msg] = checkGcf(readInt($("pg").value), ns, g, why);
      say($("pgf"), ok, msg); $("pg").classList.toggle("good", ok); $("pg").classList.toggle("bad", !ok);
      if (ok) { $("pll").hidden = false; $("pl").focus(); }
    };
    const checkL = () => {
      const [ok, msg] = checkLcm(readInt($("pl").value), ns, L, `${pw(lP)} = ${fmt(L)}`, "Use each prime the most times any one number has it.");
      say($("plf"), ok, msg); $("pl").classList.toggle("good", ok); $("pl").classList.toggle("bad", !ok);
    };
    $("pgc").onclick = checkG; onEnter($("pg"), checkG);
    $("plc").onclick = checkL; onEnter($("pl"), checkL);
    $("pf0").focus();
  }

  function ladderPractice(body) {
    const { ns, g, L } = pr, n = ns.length;
    const st = { rows: [ns.slice()], divs: [], downs: [ns.map(() => false)], phase: 1, p1: 0, stage: "div", gOk: false, lOk: false, msg: null };
    const cur = () => st.rows[st.rows.length - 1];
    const anyAll = () => cur().some(() => true) && (() => { for (let p = 2; p <= Math.max(...cur()); p++) if (isPrime(p) && cur().every(v => v % p === 0)) return true; return false; })();
    const anyTwo = () => { for (let p = 2; p <= Math.max(...cur()); p++) if (isPrime(p) && cur().filter(v => v % p === 0).length >= 2) return true; return false; };
    const stopLabel = () => st.phase === 1 ? (n === 2 ? "No prime goes into both" : "No prime goes into all three") : "No prime goes into two";

    function draw() {
      const R = st.rows.length;
      let grid = `<div class="lad" style="grid-template-columns: 4.2rem repeat(${n}, minmax(4.6rem, 6.5rem))">`;
      for (let i = 0; i < R; i++) {
        const last = i === R - 1, hasDiv = i < st.divs.length, active = last && st.stage === "div";
        const inG = st.gOk && i < st.p1, inL = st.lOk && (hasDiv || last);
        grid += `<div class="ld${inG ? " ing" : ""}${inL ? " inl" : ""}">` + (hasDiv ? `<span class="${pc(st.divs[i])}">${st.divs[i]}</span>` : active ? `<input class="pin d" id="pd" inputmode="numeric" autocomplete="off" aria-label="Prime to divide by">` : "") + "</div>";
        st.rows[i].forEach((v, j) => {
          grid += `<div class="ln${hasDiv || active ? " bar" : ""}${j === 0 && (hasDiv || active) ? " first" : ""}${st.downs[i][j] ? " dn" : ""}${st.lOk && last ? " inl" : ""}">${st.downs[i][j] ? "↓ " : ""}${fmt(v)}</div>`;
        });
        if (active) {
          grid += '<div class="ld"></div>';
          st.rows[i].forEach((v, j) => { grid += `<div class="ln"><input class="pin q" id="pq${j}" inputmode="numeric" autocomplete="off" aria-label="New number under ${v}"></div>`; });
        }
      }
      grid += "</div>";
      let side = "";
      if (st.stage === "div") {
        side = `<p class="pq">${st.phase === 1 ? `What prime number can ${n === 2 ? `${cur()[0]} and ${cur()[1]} both` : `${list(cur())} all`} be divided by?`
          : `What prime number can at least two of ${list(cur())} be divided by?`}</p>` +
          `<p class="phint">${st.phase === 1 ? "Type it on the left, then divide each number and write the new row." : "Divide the ones it goes into. Bring the other number down."}</p>` +
          `<div class="prow"><button type="button" class="chk" id="pdc">Check</button><button type="button" id="pstop">${stopLabel()}</button></div>`;
      } else if (st.stage === "gcf") {
        side = `<p class="pq">What do you get when you multiply the left side?</p>
          <div class="prow"><span class="pl g">GCF =</span><input class="pin" id="pg" inputmode="numeric" autocomplete="off" aria-label="GCF"><button type="button" class="chk" id="pgc">Check</button></div>`;
      } else if (st.stage === "lcm") {
        side = `<p class="pq">What do you get when you multiply the L, the left side and the bottom row?</p>
          <div class="prow"><span class="pl l">LCM =</span><input class="pin" id="pl" inputmode="numeric" autocomplete="off" aria-label="LCM"><button type="button" class="chk" id="plc">Check</button></div>`;
      }
      const done = [];
      if (st.gOk) done.push(`<div class="pdone g">GCF = ${fmt(g)}</div>`);
      if (st.lOk) done.push(`<div class="pdone l">LCM = ${fmt(L)}</div><p class="phint">${fmt(L)} is the first number you reach when you count by ${list(ns.map(v => v + "s"))}.</p>`);
      body.innerHTML = `<div class="lwrap">${grid}<div class="lside">${side}<p class="fb" id="pfb"></p>${done.join("")}</div></div>`;
      if (st.msg) say($("pfb"), st.msg[0], st.msg[1]);
      wire();
    }

    function wire() {
      if (st.stage === "div") {
        const check = () => {
          const p = readInt($("pd").value), row = cur();
          const qs = row.map((v, j) => $("pq" + j));
          qs.forEach(q => q.classList.remove("bad"));
          $("pd").classList.remove("bad");
          const bad = (el0, msg) => { if (el0) el0.classList.add("bad"); say($("pfb"), false, msg); (el0 || $("pd")).focus(); };
          if (!Number.isInteger(p)) return bad($("pd"), "Type a prime number on the left to divide by.");
          if (!isPrime(p)) return bad($("pd"), `${p} is not prime. Try 2, 3, 5, 7 …`);
          if (st.phase === 1) { const miss = row.find(v => v % p); if (miss !== undefined) return bad($("pd"), `${p} does not go into ${miss}.`); }
          else { const c = row.filter(v => v % p === 0).length; if (c < 2) return bad($("pd"), `${p} goes into ${c ? "only one" : "none"} of them. It needs to go into two.`); }
          for (let j = 0; j < row.length; j++) {
            const v = row[j], want = v % p ? v : v / p, q = readInt(qs[j].value);
            if (qs[j].value.trim() === "") return bad(qs[j], `Now write the new row: divide each number by ${p}.`);
            if (q !== want) return bad(qs[j], v % p ? `${p} does not go into ${v}, so bring ${v} down.` : `${v} ÷ ${p} is not ${esc(qs[j].value.trim())}.`);
          }
          st.divs.push(p); st.downs.push(row.map(v => v % p !== 0)); st.rows.push(row.map(v => v % p ? v : v / p));
          if (st.phase === 1) st.p1 = st.divs.length;
          st.msg = [true, `${p} works. ${row.map((v, j) => v % p ? `${v} comes down` : `${v} ÷ ${p} = ${v / p}`).join(", ")}.`];
          draw(); $("pd").focus();
        };
        const stop = () => {
          if (st.phase === 1 ? anyAll() : anyTwo()) { say($("pfb"), false, `Not yet. A prime still goes into ${st.phase === 1 ? allOf(cur()) : "two of " + list(cur())}.`); return; }
          st.msg = [true, st.phase === 1 ? `Right, nothing but 1 goes into ${allOf(cur())}. Stop.` : `Right, no prime goes into two of ${list(cur())}. Stop.`];
          st.stage = st.phase === 1 ? "gcf" : "lcm"; draw(); (st.stage === "gcf" ? $("pg") : $("pl")).focus();
        };
        $("pdc").onclick = check; $("pstop").onclick = stop;
        body.querySelectorAll(".lad input").forEach(i => onEnter(i, check));
      } else if (st.stage === "gcf") {
        const check = () => {
          const left = st.divs.slice(0, st.p1);
          const why = left.length ? `${left.join(" × ")} = ${fmt(g)}. It is the greatest number that divides into ${list(ns)}.` : "Nothing is on the left, so the GCF is 1.";
          const [ok, msg] = checkGcf(readInt($("pg").value), ns, g, why);
          if (!ok) { say($("pfb"), false, msg + (left.length ? " Multiply the numbers on the left side." : "")); $("pg").classList.add("bad"); return; }
          st.gOk = true; st.msg = [true, why + (n > 2 ? " For the LCM, keep going with primes that go into two of them." : "")];
          if (n > 2) { st.phase = 2; st.stage = "div"; } else st.stage = "lcm";
          draw(); (st.stage === "div" ? $("pd") : $("pl")).focus();
        };
        $("pgc").onclick = check; onEnter($("pg"), check);
      } else if (st.stage === "lcm") {
        const check = () => {
          const v = readInt($("pl").value), bottom = cur().filter(x => x > 1), Lf = st.divs.concat(bottom);
          const leftOnly = st.divs.reduce((a, b) => a * b, 1);
          if (v === leftOnly && v !== L) { say($("pfb"), false, "That is only the left side. Multiply the bottom row too."); $("pl").classList.add("bad"); return; }
          const [ok, msg] = checkLcm(v, ns, L, "", "Multiply every number in the L.");
          if (!ok) { say($("pfb"), false, msg); $("pl").classList.add("bad"); return; }
          st.lOk = true; st.stage = "done"; st.msg = [true, `${Lf.join(" × ")} = ${fmt(L)}`]; draw();
        };
        $("plc").onclick = check; onEnter($("pl"), check);
      }
    }
    draw();
    $("pd").focus();
  }

  // ---------- page ----------
  function readNums() {
    const vals = ["n1", "n2", "n3"].map(id => $(id).value.trim()).filter(s => s);
    if (vals.length < 2) return { err: "Type at least two numbers." };
    const ns = vals.map(s => /^\d+$/.test(s) ? +s : NaN);
    if (ns.some(v => !(v >= 2 && v <= 999))) return { err: "Use whole numbers from 2 to 999." };
    return { ns };
  }

  function update() {
    const r = readNums();
    $("err").hidden = !r.err; $("err").textContent = r.err || "";
    shown = { gcf: false, lcm: false };
    if (r.err) { plan = null; nums = []; }
    else nums = r.ns;
    const L = nums.length ? nums.reduce(lcm) : 0, g = nums.length ? nums.reduce(gcd) : 0;
    const prac = mode === "practice", logic = mode === "logic";
    $("partCard").hidden = !logic;
    $("gcfRow").hidden = logic && logicPart !== "gcf";
    $("lcmRow").hidden = logic && logicPart !== "lcm";
    document.body.classList.toggle("practicing", prac);
    svg.toggleAttribute("hidden", prac); $("prac").hidden = !prac;
    if (prac) { plan = null; pracStart(); return; }
    if (nums.length) plan = ({ tree: treePlan, ladder: ladderPlan, logic: logicPlan })[mode](nums, g, L);
    step = 0; fwd = false;
    render();
  }

  function setMode(m, quiet) {
    mode = m;
    $("tabs").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === m)));
    if (!quiet) update();
  }

  function render() {
    svg.replaceChildren();
    if (!plan) {
      txt("Type two or three numbers.", { class: "hint-t", x: W / 2, y: H / 2, "font-size": 44 });
      $("say").innerHTML = ""; $("gcf").textContent = ""; $("lcm").textContent = "";
      $("next").disabled = $("back").disabled = true;
      return;
    }
    plan.draw(step);
    $("say").innerHTML = plan.steps.slice(0, step + 1).map((s, i) => `<li${i === step ? ' class="now"' : ""}>${s.say()}</li>`).join("");
    const card = $("stepsCard"); card.scrollTop = card.scrollHeight;
    const g = nums.reduce(gcd), L = nums.reduce(lcm);
    answer("gcf", g, plan.gcfAt);
    answer("lcm", L, plan.lcmAt);
    $("next").disabled = step >= plan.steps.length - 1;
    $("back").disabled = step === 0;
  }

  function answer(k, v, at) {
    const box = $(k);
    box.className = "aval";
    if (step < at) { box.textContent = "?"; box.classList.add("wait"); return; }
    if (hideAns && !shown[k]) {
      box.replaceChildren();
      const b = document.createElement("button");
      b.type = "button"; b.textContent = "Show " + k.toUpperCase();
      b.onclick = () => { shown[k] = true; fwd = false; render(); };
      box.appendChild(b);
      return;
    }
    box.textContent = fmt(v);
  }

  const go = d => {
    if (!plan) return;
    const s = Math.max(0, Math.min(plan.steps.length - 1, step + d));
    if (s === step) return;
    fwd = d > 0; step = s; render();
  };
  $("next").onclick = () => go(1);
  $("back").onclick = () => go(-1);
  $("again").onclick = () => { if (mode === "practice") return pracStart(); step = 0; fwd = false; shown = { gcf: false, lcm: false }; render(); };
  $("hide").onclick = () => {
    hideAns = !hideAns; shown = { gcf: false, lcm: false };
    $("hide").setAttribute("aria-pressed", String(hideAns));
        fwd = false; render();
  };
  $("part").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    logicPart = b.dataset.p;
    $("part").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    update();
  });
  $("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b && !b.disabled) setMode(b.dataset.m); });
  ["n1", "n2", "n3"].forEach(id => $(id).addEventListener("input", update));
  document.addEventListener("keydown", e => {
    if (e.target.matches("input")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  });
  update();
})();
</script>

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)

    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +

    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
