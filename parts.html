<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Building Foundations of Parts (K-6 and 7-9, Number; Shawn 2026-11-08). Eight tools on one page, one tab at a time:
   1 The Whole Matters, 2 Fraction of a Set, 3 Growing Number Line, 4 Equivalence Stack, 5 Hundred Grid,
   6 Part of a Part (multiply), 7 How Many Fit? (divide), 8 Parts Truck Problems (card generator that reuses tools 1 to 7 as models).
   Rules from Shawn: fractions always stacked, never a slash or the division sign (division is a fraction bar; a complex fraction's
   main bar is longer and thicker). Every tool has Show answer (hidden by default) and Reset in the same spot.
   White background, dark text, one accent colour (blue). Shaded = light blue with dark blue stripes so it still reads in black and white. */
:root { --paper: #ffffff; --acc: #2f5fd0; --acc-dark: #1d3f99; --acc-soft: #c9d6f6; --grey: #cfd6de; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #ffffff; --sheet: #ffffff; --grid: #dbe5ee; --grid-major: #b9c9d8; --ink: #1b2733; --muted: #5b6b7a; --line: #1b2733;
    --green: #1f7a5a; --orange: #c2571a; --pt: #2f5fd0; --pt-ring: #ffffff; --chip: #eaf0f6; --warn: #a3263c; color-scheme: light;
  }
}
:root[data-theme="dark"] {
  --paper: #ffffff; --sheet: #ffffff; --grid: #dbe5ee; --grid-major: #b9c9d8; --ink: #1b2733; --muted: #5b6b7a; --line: #1b2733;
  --green: #1f7a5a; --orange: #c2571a; --pt: #2f5fd0; --pt-ring: #ffffff; --chip: #eaf0f6; --warn: #a3263c; color-scheme: light;
}
h1 { font-size: clamp(1.4rem, 2.4vw, 2.1rem); }
header { margin-bottom: 8px; }

/* Tab bar: one button per tool. */
.tabs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
.tabs button { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 4px 8px; border: 2px solid var(--grid-major); border-radius: 12px;
  background: var(--sheet); text-align: left; line-height: 1.1; font-size: 0.92rem; }
.tabs .n { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--chip); font-family: var(--font-num); font-size: 1.05rem; }
.tabs button[aria-selected="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
.tabs button[aria-selected="true"] .n { background: #fff; color: var(--acc); }
@media (max-width: 1100px) { .tabs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 560px) { .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
@media (max-width: 860px) { .stage { grid-template-columns: 1fr; } }
@media (min-width: 861px) and (min-height: 520px) {
  .wrap > .tool { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .wrap > .tool > .stage { flex: 1 1 auto; min-height: 0; align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .stage > .panel { overflow-y: auto; }
  .board { justify-content: flex-start; }
}

/* Board: the visual, then the symbols right under it. */
.board { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; }
.board svg { touch-action: none; }
svg text { fill: var(--ink); font-family: var(--font-num); font-weight: 700; }
svg text.w { font-family: var(--font-body); }
svg text.mu { fill: var(--muted); }
svg text.ac, svg .ac text { fill: var(--acc-dark); }
svg text.wa { fill: var(--warn); }
svg text.wh { fill: #fff; }
svg .bar { stroke: var(--ink); }
svg .ac .bar { stroke: var(--acc-dark); }
svg .mu .bar { stroke: var(--muted); }
svg .mu text { fill: var(--muted); }
.halo, svg .halo text { paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
.slide { animation: slide 0.9s ease both; }
@keyframes slide { from { transform: translate(var(--dx), var(--dy)); opacity: 0.4; } }
@media (prefers-reduced-motion: reduce) { .slide { animation: none; } }

.sym { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px 2px; border-top: 1px dashed var(--grid-major);
  font-size: clamp(1.2rem, 1.7vw, 1.9rem); text-align: center; }
.sym .m { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.2em 0.4em; font-weight: 700; line-height: 1.15; }
.board > svg { min-height: 55%; }
@media (min-width: 861px) and (min-height: 520px) { .sym { min-height: 0; overflow-y: auto; } }
.sym .work { font-size: 0.85em; }
.sym .t { font-size: 0.72em; color: var(--muted); max-width: 60ch; }
.sym .t b { color: var(--ink); }
.sym .wa { color: var(--warn); }
.fr { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; vertical-align: middle; font-weight: 700; }
.fr > :first-child { border-bottom: 0.07em solid currentColor; padding: 0 0.12em 0.04em; }
.fr > :last-child { padding: 0.04em 0.12em 0; }
.mx { display: inline-flex; align-items: center; gap: 0.08em; vertical-align: middle; }
/* Complex fraction: the main bar is longer and thicker than the inner bars. */
.cf { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; }
.cf > :first-child { border-bottom: 0.13em solid currentColor; padding: 0 0.45em 0.08em; }
.cf > :last-child { padding: 0.08em 0.45em 0; }
.rep { text-decoration: overline; text-decoration-thickness: 0.07em; }
.qm { display: inline-grid; place-items: center; min-width: 1.4em; padding: 0 0.2em; border: 3px dashed var(--grid-major); border-radius: 10px; color: var(--muted); line-height: 1.2; }
.hid { font-family: var(--font-body); font-size: 0.7em; color: var(--muted); font-style: italic; }
/* Worked steps: one step per line, = signs lined up, step names in a column on the right. */
.work { display: grid; grid-template-columns: auto auto auto; column-gap: 0.45em; row-gap: 0.3em; align-items: center; font-weight: 700; }
.work .wl { justify-self: end; display: flex; align-items: center; gap: 0.3em; }
.work .wr { justify-self: start; display: flex; align-items: center; gap: 0.3em; }
.work .wn { justify-self: start; font-family: var(--font-body); font-weight: 400; font-size: 0.6em; color: var(--muted); padding-left: 0.8em; text-align: left; }

/* Panel: controls on top, Show answer and Reset always at the bottom. */
.panel { display: flex; flex-direction: column; gap: 12px; padding: 14px; }
.panel .label { margin: 0 0 6px; }
.ctrls { display: flex; flex-direction: column; gap: 10px; }
.panel button { min-height: 48px; font-size: 1rem; border-radius: 10px; border: 2px solid var(--grid-major); background: var(--sheet); }
.panel button:hover { border-color: var(--acc); }
.panel button:disabled { opacity: 0.4; cursor: default; }
.panel button[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
.seg { display: flex; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1 1 0; border: 0; border-radius: 0; min-height: 48px; padding: 4px 6px; font-size: 0.95rem; }
.seg button + button { border-left: 2px solid var(--grid-major); }
.stprow { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; gap: 8px; }
.stprow button { font-size: 1.6rem; line-height: 1; padding: 0; }
.stprow output { text-align: center; font-family: var(--font-num); font-weight: 700; font-size: 1.6rem; display: flex; justify-content: center; }
.fp { display: grid; gap: 4px; justify-items: stretch; }
.fpbar { height: 4px; background: var(--ink); border-radius: 2px; margin: 0 58px; }
.sl { display: grid; grid-template-columns: minmax(0, 1fr) 2.2em; gap: 8px; align-items: center; }
.sl output { font-family: var(--font-num); font-weight: 700; font-size: 1.4rem; text-align: right; }
input[type=range] { height: 40px; accent-color: var(--acc); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { flex: 1 1 auto; font-size: 1.05rem; padding: 4px 10px; display: inline-flex; align-items: center; justify-content: center; gap: 0.3em; }
.presets .fr, .presets .cf { font-size: 0.85em; }
.big { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem !important; min-height: 56px !important; }
.go { background: var(--acc) !important; border-color: var(--acc) !important; color: #fff; }
.layers { display: grid; gap: 5px; }
.layers button { display: flex; align-items: center; gap: 10px; text-align: left; min-height: 46px; padding: 4px 10px; }
.layers .n { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--chip); color: var(--ink); font-family: var(--font-num); flex: none; }
.layers button.top { outline: 3px solid var(--acc-dark); outline-offset: 1px; }
.foot { position: sticky; bottom: -14px; background: var(--sheet); padding-bottom: 2px; z-index: 1; margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 6px; border-top: 1px dashed var(--grid-major); }
.foot button { min-height: 56px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.hint { margin: 0; color: var(--muted); font-size: 0.9rem; }

/* Parts Truck: the card sits on top of the board, the model under it when shown. */
#tab8 .sym { order: -1; border-top: 0; flex: 1 1 auto; justify-content: center; }
#tab8 .board.withmodel .sym { flex: 0 1 auto; min-height: 0; overflow-y: auto; border-bottom: 1px dashed var(--grid-major); padding-bottom: 8px; }
#tab8 .board:not(.withmodel) > svg { display: none; }
.tcard { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 0.5em; }
.tcard .th svg { display: inline-block; width: 40px; height: 24px; flex: none; }
.tcard .th { font-family: var(--font-display); font-weight: 800; font-size: 0.75em; color: var(--acc-dark); display: flex; align-items: center; justify-content: center; gap: 0.4em; }
.tcard .tp { font-family: var(--font-body); font-size: 1.05em; line-height: 1.6; }
.tcard .tp .fr { font-size: 0.95em; margin: 0 0.1em; }
.board.withmodel .tcard .tp { font-size: 0.85em; }
.tcard .ta { display: flex; flex-direction: column; align-items: center; gap: 0.4em; font-size: 0.9em; }
.tcard .end { font-family: var(--font-body); font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.3em; }
</style>

<script>
(function () {

/* =====================================================================

const T1 = {
  name: "The Whole Matters",

/* =====================================================================
   TAB 2: FRACTION OF A SET
   ===================================================================== */
const T2 = {
  name: "Fraction of a Set",
  def: () => ({ N: 12, n: 2, d: 3, step: 0, show: false }),
  fix(S) { S.N = clamp(S.N, 1, 36); S.d = clamp(S.d, 2, 12); S.n = clamp(S.n, 1, S.d); S.step = clamp(S.step, 0, 2); },

    const nx = btn(P, "", () => t.set({ step: t.S.step >= 2 ? 0 : t.S.step + 1 }), "big go");

    return best;
  },
  draw(svg, S) {
    const W = 1000, H = 540; svg.setAttribute("viewBox", `0 0 ${W} ${H + 20}`);
    const { N, n, d } = S, ok = N % d === 0, q = Math.floor(N / d), r = N % d;
    const grouped = S.step >= 1;
    const sizes = grouped ? Array(d).fill(q).concat(r ? [r] : []) : [N];

          fill: shaded ? "#e6ecfb" : "#fff", stroke: left ? WARN : INK, "stroke-width": left ? 4 : 4, "stroke-dasharray": left ? "10 7" : "none" }, svg);

      }
      for (let i = 0; i < sz; i++) {
        const x = cx - bw / 2 + (i % L.kc + 0.5) * s, y = cy - bh / 2 + (Math.floor(i / L.kc) + 0.5) * s;
        E("circle", { cx: x, cy: y, r: rad, fill: shaded ? ACC : "#fff", stroke: shaded ? ACCD : (left ? WARN : INK), "stroke-width": 4 }, svg);

/* =====================================================================

const T4 = {

  },
  lines(S) { return S.mode === "common" ? [S.pb, S.qb, lcm(S.pb, S.qb)] : [S.d0, S.d1, S.d2, S.d3].slice(0, S.cnt); },

/* =====================================================================
   TAB 5: HUNDRED GRID
   ===================================================================== */
const fillN = c => Array.from({ length: 100 }, (_, i) => i < c ? 1 : 0); // cells numbered down each column, left to right
const T5 = {
  name: "Hundred Grid",
  def: () => ({ A: fillN(0), B: fillN(0), cmp: 0, tenths: 0, show: false }),
  controls(P, t) {
    seg(t, P, "cmp", [[0, "One grid"], [1, "Compare"]], "Mode");

    presets(t, P, "Preset", [["0.6 and 0.58", { A: fillN(60), B: fillN(58), cmp: 1 }], ["0.35", { A: fillN(35), cmp: 0 }]]);
    P.appendChild(el(`<p class="hint">Tap or drag across squares to shade. Drag over shaded squares to clear them.</p>`));
  },
  draw(svg, S) {
    const grids = S.cmp ? [["A", 40, 70, 500], ["B", 620, 70, 500]] : [["A", 30, 30, 540]];
    svg.setAttribute("viewBox", S.cmp ? "0 0 1160 600" : "0 0 600 600");
    grids.forEach(([key, gx, gy, size]) => {
      const c = size / 10, arr = S[key];
      if (S.cmp) T(svg, gx + size / 2, 34, "Grid " + key, 30, "w");
      for (let i = 0; i < 100; i++) {
        const col = Math.floor(i / 10), row = i % 10;
        E("rect", { x: gx + col * c, y: gy + row * c, width: c, height: c, fill: arr[i] ? "url(#pk-sh)" : "#fff", stroke: GRID, "stroke-width": 1.5 }, svg);
      }
      for (let k = 1; k < 10; k++) E("line", { x1: gx + k * c, x2: gx + k * c, y1: gy, y2: gy + size, stroke: S.tenths ? INK : MUTED, "stroke-width": S.tenths ? 3 : 1.5 }, svg);
      E("rect", { x: gx, y: gy, width: size, height: size, fill: "none", stroke: INK, "stroke-width": 4 }, svg);
    });
    return { grids };
  },
  cellAt(t, p) {
    for (const [key, gx, gy, size] of t.geo.grids || []) {
      if (p.x >= gx && p.x < gx + size && p.y >= gy && p.y < gy + size) { const c = size / 10; return { key, col: Math.floor((p.x - gx) / c), row: Math.floor((p.y - gy) / c) }; }
    }
    return null;
  },
  paint(t, h, v) {
    const arr = t.S[h.key].slice();
    if (t.S.tenths) for (let r = 0; r < 10; r++) arr[h.col * 10 + r] = v; else arr[h.col * 10 + h.row] = v;
    t.set({ [h.key]: arr });
  },
  down(t, p) {
    const h = T5.cellAt(t, p); if (!h) return false;
    const arr = t.S[h.key];
    const v = t.S.tenths ? (arr.slice(h.col * 10, h.col * 10 + 10).every(x => x) ? 0 : 1) : (arr[h.col * 10 + h.row] ? 0 : 1);
    t.drag5 = { key: h.key, v, last: { x: p.x, y: p.y } }; T5.paint(t, h, v); return true;
  },
  move(t, p) {
    if (!t.drag5) return;
    // Fill in every square between the last point and this one, so a fast swipe leaves no gaps.
    const l = t.drag5.last || p, n = Math.max(1, Math.ceil(Math.hypot(p.x - l.x, p.y - l.y) / 10));
    for (let i = 1; i <= n; i++) { const h = T5.cellAt(t, { x: l.x + (p.x - l.x) * i / n, y: l.y + (p.y - l.y) * i / n }); if (h && h.key === t.drag5.key) T5.paint(t, h, t.drag5.v); }
    t.drag5.last = { x: p.x, y: p.y };
  },
  readout(c, show) {
    const dec = c % 10 === 0 && c > 0 && c < 100 ? `${tenth(c / 10)} = ${hund(c)}` : hund(c);
    return `${F(c, 100)} = ${show ? `${c && c < 100 && gcd(c, 100) > 1 ? MX(c, 100) + " = " : ""}${dec} = ${c}%` : Q}`;
  },
  sym(S) {
    const a = S.A.reduce((s, x) => s + x, 0);
    if (!S.cmp) return `<div class="t">Shaded squares out of 100</div><div class="m">${T5.readout(a, S.show)}</div><div class="t">${S.show ? "Fraction, simplest form, decimal and percent" : "Show answer for simplest form, decimal and percent."}</div>`;
    const b = S.B.reduce((s, x) => s + x, 0);
    const cmp = a === b ? "=" : a > b ? "&gt;" : "&lt;";
    const note = (a % 10 === 0 && a < 100 && a > 0) ? ` ${tenth(a / 10)} = ${hund(a)}: ${a / 10} tenths cover the same space as ${a} hundredths.` : "";
    return `<div class="m" style="font-size:.85em">A: ${T5.readout(a, S.show)}</div><div class="m" style="font-size:.85em">B: ${T5.readout(b, S.show)}</div>` +
      `<div class="m">Which grid shows more? ${S.show ? `${hund(a)} ${cmp} ${hund(b)}` : Q}</div>${S.show && note ? `<div class="t">${note}</div>` : ""}`;
  }
};

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
