<body>
<title>Absolute Value, Reciprocal and Radical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
:root { --ok: #1f7a5a; --ok-bg: #e3f4ec; --bad: #c0263c; --bad-bg: #fbe7ea; --pink: #c2338a; --purple: #7a3fc4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok: #4cc49a; --ok-bg: #12352a; --bad: #ff7d93; --bad-bg: #3a1820; --pink: #ff7ac8; --purple: #b98cff; } }
:root[data-theme="dark"] { --ok: #4cc49a; --ok-bg: #12352a; --bad: #ff7d93; --bad-bg: #3a1820; --pink: #ff7ac8; --purple: #b98cff; }
.main { grid-template-columns: minmax(0, 1fr) clamp(400px, 36vw, 680px); gap: 14px; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
h1 { font-size: clamp(1.4rem, 2.6vw, 2rem); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.seg { display: inline-flex; flex: none; }
.seg button { border-radius: 0; padding: 8px 14px; font-size: 1.05rem; }
.seg button:first-child { border-radius: 8px 0 0 8px; }
.seg button:last-child { border-radius: 0 8px 8px 0; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.type-seg button { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.type-seg button[aria-pressed="true"] { background: var(--pt); border-color: var(--pt); }
.new-btn { background: var(--pt); color: var(--sheet); border-color: var(--pt); font-size: 1.1rem; padding: 10px 18px; }
.new-btn:hover { background: var(--sheet); color: var(--pt); }
.panel { gap: 8px; }
.card { padding: 10px 14px; }
.label { margin-bottom: 2px; }
.eqbig { margin: 0 0 6px; font-family: var(--font-num); font-weight: 700; font-size: 1.7rem; line-height: 1.3; display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px; }
.eqbig:last-child { margin-bottom: 0; }
.eqbig.goal { color: var(--green); }
.eqbig .frac { font-size: 0.85em; }
.frac.sm { font-size: 0.8em; vertical-align: middle; }
i { font-style: italic; }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 8px 14px; }
.step.now { border: 2px solid var(--pt); }
.step h3 { margin: 0 0 2px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; display: flex; gap: 10px; align-items: baseline; }
.step h3 .n { flex: none; display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--pt); color: var(--sheet); font-size: 0.9rem; }
.step p { margin: 0; font-size: 1.05rem; line-height: 1.4; }
.step p + p, .step p + .work, .step .work + p, .step .work + .work { margin-top: 6px; }
.sub { font-weight: 700; color: var(--muted); }
/* Vertical work: one line per step, = signs lined up, step names in their own column. */
.work { display: grid; grid-template-columns: auto auto auto minmax(8.5em, 1fr); align-items: center; gap: 4px 10px; font-family: var(--font-num); font-weight: 700; font-size: 1.25rem; }
.work .wl { text-align: right; white-space: nowrap; }
.work .wr { white-space: nowrap; }
.work .wn { font-family: var(--font-body); font-weight: 400; font-size: 0.9rem; color: var(--muted); padding-left: 8px; border-left: 2px solid var(--grid); }
.note { color: var(--orange); font-weight: 700; }
.verdict-ok { color: var(--ok); font-weight: 700; }
.verdict-bad { color: var(--bad); font-weight: 700; }
.mathline { font-family: var(--font-num); font-weight: 700; font-size: 1.25rem; }
.piece { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-num); font-weight: 700; font-size: 1.2rem; }
.piece .rows { display: grid; grid-template-columns: auto auto; gap: 4px 16px; border-left: 3px solid var(--ink); border-radius: 12px 0 0 12px; padding: 4px 0 4px 12px; }
.piece .cond { color: var(--muted); }
.actions { display: flex; gap: 8px; align-items: center; flex: none; position: sticky; bottom: 0; z-index: 2; background: var(--paper); padding-top: 4px; box-shadow: 0 -8px 8px -4px var(--paper); }
.actions button { font-size: 1.15rem; padding: 10px 16px; }
.next-btn { background: var(--pt); color: var(--sheet); border-color: var(--pt); flex: 1 1 auto; }
.next-btn:hover { background: var(--sheet); color: var(--pt); }
.next-btn:disabled, .actions button:disabled { opacity: 0.45; cursor: default; }
.count { color: var(--muted); font-weight: 700; white-space: nowrap; }
.check-btn { background: var(--orange); color: var(--sheet); border-color: var(--orange); flex: 1 1 auto; }
.check-btn:hover { background: var(--sheet); color: var(--orange); }
.todo { margin: 0; padding-left: 1.2em; font-size: 1.1rem; line-height: 1.45; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; font-weight: 700; }
.hint { margin-top: 6px; }
.ansrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-family: var(--font-num); font-weight: 700; font-size: 1.35rem; }
input.ans { font: inherit; font-family: var(--font-num); font-weight: 700; font-size: 1.3rem; flex: 1 1 8em; min-width: 0; padding: 4px 10px; border: 2px solid var(--grid-major); border-radius: 8px; background: var(--sheet); color: var(--ink); }
input.ans.ok { border-color: var(--ok); background: var(--ok-bg); }
input.ans.bad { border-color: var(--bad); background: var(--bad-bg); }
.fb { display: none; }
.fb.on { display: block; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; margin: 0 0 4px; }
.tips { margin: 0; padding-left: 1.1em; font-size: 1.02rem; line-height: 1.4; }
.tips li + li { margin-top: 4px; }
.tips .good { list-style: "✓  "; }
.tips .good::marker { color: var(--ok); }
.tips .miss { list-style: "✗  "; }
.tips .miss::marker { color: var(--bad); }
.tally { margin: 0; color: var(--muted); font-weight: 700; }
/* Board drawing */
.g-minor { stroke: var(--grid); stroke-width: 1; }
.g-axis { stroke: var(--muted); stroke-width: 2.5; }
.g-tick { fill: var(--ink); font-family: var(--font-num); font-size: 15px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.g-ax { font-family: var(--font-num); font-weight: 700; font-style: italic; font-size: 22px; fill: var(--ink); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; }
.c-f { fill: none; stroke: var(--pt); stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
.c-f.ghost { stroke-width: 3; stroke-dasharray: 9 7; opacity: 0.6; }
.c-res { fill: none; stroke: var(--green); stroke-width: 5.5; stroke-linejoin: round; stroke-linecap: round; }
.c-res.half { stroke-width: 4; stroke-dasharray: 10 8; opacity: 0.75; }
.c-line { fill: none; stroke: var(--orange); stroke-width: 4.5; stroke-linecap: round; }
.c-ans { fill: none; stroke: var(--green); stroke-width: 5; stroke-dasharray: 12 8; }
.c-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawin 1.4s ease-out forwards; }
@keyframes drawin { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .c-draw { animation: none; stroke-dashoffset: 0; } }
.a-blue { fill: var(--pt); } .a-green { fill: var(--green); } .a-orange { fill: var(--orange); }
.asy { stroke: var(--bad); stroke-width: 3.5; stroke-dasharray: 3 7; stroke-linecap: round; }
.asy.user { stroke: var(--purple); stroke-width: 4; stroke-dasharray: 10 6; }
.asy.user.bad { stroke: var(--bad); }
.asy.user.ok { stroke: var(--ok); }
.guide { stroke: var(--pink); stroke-width: 2.5; stroke-dasharray: 8 6; opacity: 0.8; }
.arrowline { stroke: var(--orange); stroke-width: 3; stroke-dasharray: 6 5; }
.d { stroke: var(--sheet); stroke-width: 3; }
.d.zero { fill: var(--orange); }
.d.blue { fill: var(--pt); }
.d.green { fill: var(--green); }
.d.user { fill: var(--purple); }
.d.user.ok { fill: var(--ok); }
.d.user.bad { fill: var(--bad); }
.ring { fill: none; stroke: var(--pink); stroke-width: 3.5; }
.ring.ok { stroke: var(--green); }
.ring.miss { stroke: var(--green); stroke-dasharray: 5 4; }
.ring.bad { stroke: var(--bad); }
.xmark { stroke: var(--bad); stroke-width: 4; stroke-linecap: round; }
.lbl { font-family: var(--font-num); font-weight: 700; font-size: 19px; paint-order: stroke; stroke: var(--sheet); stroke-width: 6px; stroke-linejoin: round; fill: var(--ink); }
.lbl.zero { fill: var(--orange); } .lbl.blue { fill: var(--pt); } .lbl.green { fill: var(--green); } .lbl.red { fill: var(--bad); } .lbl.pink { fill: var(--pink); } .lbl.orange { fill: var(--orange); }
#svg.click { cursor: crosshair; }
[hidden] { display: none !important; }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Absolute Value, Reciprocal and Radical</h1></div>
    <div class="tools">
      <div class="seg type-seg" id="typeSeg" role="group" aria-label="Topic">
        <button data-v="abs" aria-pressed="true">Absolute Value</button><button data-v="rec" aria-pressed="false">Reciprocal</button><button data-v="rad" aria-pressed="false">Radical</button>
      </div>
      <div class="seg" id="subSeg" role="group" aria-label="Graphs or equations">
        <button data-v="graph" aria-pressed="true">Graphs</button><button data-v="eq" aria-pressed="false">Equations</button>
      </div>
      <div class="seg" id="kindSeg" role="group" aria-label="Kind of function">
        <button data-v="lin" aria-pressed="true">Linear</button><button data-v="quad" aria-pressed="false">Quadratic</button>
      </div>
      <div class="seg" id="viewSeg" role="group" aria-label="Learning or practice">
        <button data-v="learn" aria-pressed="true">Learning</button><button data-v="practice" aria-pressed="false">Practice</button>
      </div>
      <button class="new-btn" id="newBtn">New question</button>
    </div>
  </header>

  <div class="main">
    <div class="board">
      <svg id="svg" role="img" aria-label="Coordinate grid"></svg>
    </div>
    <div class="panel">
      <div class="card" id="eqCard"></div>
      <div id="learnPanel" class="panel">
        <div class="steps" id="steps"></div>
        <div class="actions">
          <button id="backBtn">Back</button>
          <button class="next-btn" id="nextBtn">Next step</button>
          <span class="count" id="count"></span>
        </div>
      </div>
      <div id="pracPanel" class="panel" hidden>
        <div class="card" id="placeCard">
          <p class="label">Click the grid to place</p>
          <ul class="todo" id="todo"></ul>
          <div class="row" id="toolRow">
            <span>Placing:</span>
            <div class="seg" id="toolSeg" role="group" aria-label="What a click places">
              <button data-v="asy" aria-pressed="true">Vertical asymptote</button><button data-v="pt" aria-pressed="false">Invariant point</button>
            </div>
          </div>
          <p class="hint">Click something again to remove it.</p>
        </div>
        <div class="card" id="typeCard">
          <p class="label">Type every solution</p>
          <div class="ansrow"><i>x</i> = <input class="ans" id="ans" autocomplete="off" aria-label="Solutions" placeholder="like 2, −3"><button id="noneBtn">No solution</button></div>
          <p class="hint">Use a comma between solutions.</p>
        </div>
        <div class="actions">
          <button class="check-btn" id="checkBtn">Check</button>
          <button id="showBtn">Show me</button>
        </div>
        <div class="card fb" id="fb"><p class="score" id="fbHead"></p><ul class="tips" id="tips"></ul></div>
        <div class="steps" id="solution"></div>
        <p class="tally" id="tally"></p>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const rnd = n => Math.floor(Math.random() * n);
  const pick = a => a[rnd(a.length)];
  const range = (a, b) => { const out = []; for (let i = a; i <= b; i++) out.push(i); return out; };
  const fmt = n => (n < 0 ? "−" + Math.abs(n) : String(n));
  const isInt = v => Math.abs(v - Math.round(v)) < 1e-9;
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
  const close = (a, b) => Math.abs(a - b) < 1e-6;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Writing numbers and expressions ---------- */
  const X = "<i>x</i>";
  function rat(v) { for (let q = 1; q <= 12; q++) if (isInt(v * q)) return [Math.round(v * q), q]; return null; }
  const fracH = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
  function numH(v) { // exact when it can be: 3, −5/2; otherwise ≈ 2.4
    if (isInt(v)) return fmt(Math.round(v));
    const r = rat(v);
    if (r) return (r[0] < 0 ? "−" : "") + fracH(Math.abs(r[0]), r[1]);
    return "≈ " + fmt(Math.round(v * 10) / 10);
  }
  function numT(v) { // board labels: 3, 2.5, ≈2.4
    if (isInt(v)) return fmt(Math.round(v));
    if (isInt(v * 100)) return fmt(Math.round(v * 100) / 100);
    return "≈" + fmt(Math.round(v * 10) / 10);
  }
  const ptT = (x, y) => `(${numT(x)}, ${numT(y)})`;
  function coefH(m) {
    if (m === 1) return ""; if (m === -1) return "−";
    if (isInt(m)) return fmt(m);
    const [p, q] = rat(m);
    return (p < 0 ? "−" : "") + `<span class="frac sm"><span>${Math.abs(p)}</span><span>${q}</span></span>`;
  }
  const constH = c => (c > 0 ? ` + ${c}` : c < 0 ? ` − ${-c}` : "");
  const linH = (m, b) => `${coefH(m)}${X}${constH(b)}`;
  const inH = h => (h === 0 ? X : `${X} ${h > 0 ? "−" : "+"} ${Math.abs(h)}`);
  const sqH = h => (h === 0 ? `${X}²` : `(${inH(h)})²`);
  const quadH = (a, h, k) => `${a === 1 ? "" : "−"}${sqH(h)}${constH(k)}`;
  const radH = p => `<span>√<span style="text-decoration:overline">${p === 0 ? X : `${X}${constH(p)}`}</span></span>`;
  function polyH(b, c) { // x² + bx + c
    let s = `${X}²`;
    if (b) s += ` ${b > 0 ? "+" : "−"} ${Math.abs(b) === 1 ? "" : Math.abs(b)}${X}`;
    return s + constH(c);
  }
  const radT = p => (p === 0 ? "√x" : `√(x${constH(p)})`);
  const linT = q => `x${constH(q)}`;
  const factorH = r => (r === 0 ? X : `(${inH(r)})`);

  /* ---------- Functions ---------- */
  function lin(m, b) { return { kind: "lin", m, b, f: x => m * x + b, html: linH(m, b) }; }
  function quad(a, h, k) { return { kind: "quad", a, h, k, f: x => a * (x - h) ** 2 + k, html: quadH(a, h, k) }; }
  // Every x with f(x) = v, smallest first.
  function solve(F, v) {
    if (F.kind === "lin") return [(v - F.b) / F.m];
    const c = (v - F.k) / F.a;
    if (c < -1e-9) return [];
    if (Math.abs(c) < 1e-9) return [F.h];
    return [F.h - Math.sqrt(c), F.h + Math.sqrt(c)];
  }
  const inGrid = x => Math.abs(x) <= R + 1e-9;

  // Vertical work for f(x) = v, as rows [left, right, step name]. note: a sentence when there is no solution.
  function solveWork(F, v) {
    const rows = [], out = { rows, note: "" };
    if (F.kind === "lin") {
      const { m, b } = F, rhs = v - b, x = rhs / m;
      rows.push([F.html, fmt(v), `Set f(x) = ${fmt(v)}`]);
      if (b) rows.push([`${coefH(m)}${X}`, fmt(rhs), b > 0 ? `Subtract ${b} from both sides` : `Add ${-b} to both sides`]);
      if (m === -1) rows.push([X, fmt(-rhs), "Multiply both sides by −1"]);
      else if (isInt(m) && m !== 1) {
        rows.push([X, fracH(fmt(rhs), fmt(m)), `Divide both sides by ${fmt(m)}`]);
        if (!(m > 0 && gcd(rhs, m) === 1 && rhs !== 0)) rows.push([X, numH(x), "Simplify"]);
      } else if (!isInt(m)) {
        const [p, q] = rat(m);
        rows.push([X, numH(x), `Multiply both sides by ${fmt(q * Math.sign(p) / Math.abs(p))}`]);
      }
      return out;
    }
    const { a, h, k } = F, c = (v - k) / a, sq = sqH(h);
    rows.push([F.html, fmt(v), `Set f(x) = ${fmt(v)}`]);
    if (k) rows.push([`${a === 1 ? "" : "−"}${sq}`, fmt(v - k), k > 0 ? `Subtract ${k} from both sides` : `Add ${-k} to both sides`]);
    if (a === -1) rows.push([sq, fmt(c), "Multiply both sides by −1"]);
    if (c < 0) { out.note = "A square can never be negative, so there is no solution here."; return out; }
    const s = Math.sqrt(c), sH = isInt(s) ? fmt(Math.round(s)) : `√${c}`;
    if (c === 0) {
      rows.push([inH(h), "0", "Take the square root"]);
      if (h) rows.push([X, fmt(h), h > 0 ? `Add ${h} to both sides` : `Subtract ${-h} from both sides`]);
      return out;
    }
    rows.push([inH(h), `±${sH}`, "Take the square root"]);
    if (h) rows.push([X, `${fmt(h)} ± ${sH}`, h > 0 ? `Add ${h} to both sides` : `Subtract ${-h} from both sides`]);
    const xs = solve(F, v);
    if (h || isInt(s)) rows.push([X, `${numH(xs[0])} or ${numH(xs[1])}`, isInt(s) ? "Simplify" : "Estimate"]);
    return out;
  }
  const workH = rows => `<div class="work">${rows.map(([l, r, n]) => `<span class="wl">${l}</span><span class="we">=</span><span class="wr">${r}</span><span class="wn">${n || ""}</span>`).join("")}</div>`;
  const solvedH = w => workH(w.rows) + (w.note ? `<p class="note">${w.note}</p>` : "");

  /* ---------- Making questions ---------- */
  function genAbsGraph(practice, kind) {
    for (;;) {
      if (kind === "lin") {
        const m = pick(practice ? [1, 2, 3, -1, -2, -3, 0.5, -0.5] : [1, 2, 3, -1, -2, -3]), r = pick(range(-5, 5));
        if (r === 0 || !isInt(m * r)) continue;
        const b = -m * r;
        if (Math.abs(b) > 10) continue;
        return lin(m, b);
      }
      const a = pick([1, -1]), d = pick([1, 2, 3]), h = pick(range(-4, 4));
      if (Math.abs(h) + d > 8) continue;
      return quad(a, h, -a * d * d);
    }
  }
  function genRec(practice, kind) {
    for (;;) {
      if (kind === "lin") {
        const m = pick(practice ? [1, -1, 2, -2, 0.5, -0.5] : [1, -1, 2, -2]), r = pick(range(-3, 3));
        if (!isInt(m * r)) continue;
        const b = -m * r;
        if (Math.abs(b) > 10) continue;
        return lin(m, b);
      }
      const a = pick([1, -1]), h = pick(range(-4, 4)), c = pick(["two", "two", "two", "one", "none", "none"]);
      const k = c === "two" ? -a * pick([1, 4, 9]) : c === "one" ? 0 : a * pick([1, 2, 3]);
      if (c === "two" && Math.abs(h) + Math.sqrt(Math.abs(k)) > 5) continue;
      if (c !== "two" && Math.abs(h) > 3) continue;
      return quad(a, h, k);
    }
  }
  function genAbsEq(kind) {
    for (;;) {
      const noSol = Math.random() < 0.15;
      if (kind === "lin") {
        const m = pick([1, 2, 3, -1, -2]), r = pick(range(-4, 4)), b = -m * r;
        if (Math.abs(b) > 9) continue;
        const c = noSol ? -pick([1, 2, 3, 4]) : pick(range(1, 8));
        const xs = [(c - b) / m, (-c - b) / m];
        if (!noSol && xs.some(x => !inGrid(x) || !rat(x) || rat(x)[1] > 2)) continue;
        return { F: lin(m, b), c, sols: noSol ? [] : xs.sort((p, q) => p - q) };
      }
      const a = pick([1, -1]), h = pick(range(-3, 3)), k = -a * pick([1, 4, 9]);
      const c = noSol ? -pick([1, 2, 3]) : pick(range(1, 9));
      if (noSol) return { F: quad(a, h, k), c, sols: [] };
      const F = quad(a, h, k), xs = [...solve(F, c), ...solve(F, -c)];
      if (!xs.length || xs.some(x => !isInt(x) || !inGrid(x))) continue;
      return { F, c, sols: [...new Set(xs.map(Math.round))].sort((p, q) => p - q) };
    }
  }
  function genRad() {
    for (;;) {
      const q = pick(range(-4, 3)), r1 = pick(range(-5, 7)), r2 = 1 - 2 * q - r1;
      if (r1 === r2) continue;
      const p = q * q - r1 * r2;
      if (Math.abs(p) > 9) continue;
      const roots = [r1, r2].sort((x, y) => x - y), valid = roots.map(r => r + q >= 0);
      if (!valid.some(Boolean)) continue;
      if (valid.every(Boolean) && Math.random() < 0.75) continue; // mostly one extraneous root
      if (roots.some(r => !inGrid(r) || Math.abs(r + q) > 9)) continue;
      return { p, q, roots, valid, sols: roots.filter((r, i) => valid[i]) };
    }
  }

  /* ---------- Board ---------- */
  const svg = $("svg");
  // Grids count by 1 with every line labeled: −10 to 10, or −6 to 6 for reciprocals so the small values near the x-axis can be seen.
  const PAD = 30, SIZE = 660;
  let R = 10, U = 30;
  const setScale = () => { R = S.type === "rec" ? 6 : 10; U = (SIZE - 2 * PAD) / (2 * R); };
  svg.setAttribute("viewBox", `0 0 ${SIZE} ${SIZE}`);
  const sx = x => PAD + (x + R) * U, sy = y => PAD + (R - y) * U;
  let L = {};
  function drawGrid() {
    svg.textContent = "";
    const defs = el("defs", {}, svg);
    ["blue", "green", "orange"].forEach(c => {
      const mk = el("marker", { id: `ar-${c}`, viewBox: "0 0 10 10", refX: 6, refY: 5, markerWidth: 3.6, markerHeight: 3.6, orient: "auto-start-reverse" }, defs);
      el("path", { d: "M0,0 L10,5 L0,10 z", class: `a-${c}` }, mk);
    });
    ["grid", "guides", "curve", "result", "marks", "user", "labels"].forEach(n => (L[n] = el("g", {}, svg)));
    const g = L.grid;
    for (let i = -R; i <= R; i++) {
      el("line", { x1: sx(i), y1: sy(-R), x2: sx(i), y2: sy(R), class: i ? "g-minor" : "g-axis" }, g);
      el("line", { x1: sx(-R), y1: sy(i), x2: sx(R), y2: sy(i), class: i ? "g-minor" : "g-axis" }, g);
    }
    for (let i = -R; i <= R; i++) {
      if (!i) continue;
      el("text", { x: sx(i), y: sy(0) + 19, class: "g-tick", "text-anchor": "middle" }, g).textContent = fmt(i);
      el("text", { x: sx(0) - 5, y: sy(i) + 5, class: "g-tick", "text-anchor": "end" }, g).textContent = fmt(i);
    }
    el("text", { x: sx(R) - 2, y: sy(0) - 8, class: "g-ax", "text-anchor": "end" }, g).textContent = "x";
    el("text", { x: sx(0) + 8, y: sy(R) + 18, class: "g-ax" }, g).textContent = "y";
  }
  // Draws y = fn(x) inside the grid. It breaks where fn is undefined or jumps (an asymptote);
  // ends that leave the grid get arrows.
  function curve(fn, layer, cls, arrow, from = -R, to = R, draw = false) {
    const N = 1600, pieces = [];
    let cur = null, prev = null;
    for (let i = 0; i <= N; i++) {
      const x = from + (to - from) * i / N, y = fn(x), ok = Number.isFinite(y), inside = ok && Math.abs(y) <= R;
      if (prev && prev.ok && ok && Math.abs(y - prev.y) > R) { cur = null; prev = { x, y, ok, inside }; continue; }
      if (prev && prev.ok && ok && inside !== prev.inside) {
        const lim = (inside ? prev.y : y) > 0 ? R : -R, t = (lim - prev.y) / (y - prev.y), bx = prev.x + t * (x - prev.x);
        if (inside) { cur = [[bx, lim]]; pieces.push(cur); } else if (cur) { cur.push([bx, lim]); cur = null; }
      }
      if (inside) { if (!cur) { cur = []; pieces.push(cur); } cur.push([x, y]); } else cur = null;
      prev = { x, y, ok, inside };
    }
    const edge = ([x, y]) => Math.abs(Math.abs(x) - R) < 0.02 || Math.abs(Math.abs(y) - R) < 0.02;
    pieces.forEach(pts => {
      if (pts.length < 2) return;
      const attrs = { d: "M" + pts.map(([x, y]) => `${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join("L"), class: cls + (draw ? " c-draw" : "") };
      if (draw) attrs.pathLength = 1;
      if (arrow && edge(pts[0])) attrs["marker-start"] = `url(#ar-${arrow})`;
      if (arrow && edge(pts[pts.length - 1])) attrs["marker-end"] = `url(#ar-${arrow})`;
      el("path", attrs, layer);
    });
  }
  const dot = (x, y, cls, layer = L.marks, r = 8) => el("circle", { cx: sx(x), cy: sy(y), r, class: `d ${cls}` }, layer);
  const ring = (x, y, cls = "", layer = L.marks) => el("circle", { cx: sx(x), cy: sy(y), r: 12, class: `ring ${cls}` }, layer);
  const vline = (x, cls, layer = L.guides) => el("line", { x1: sx(x), y1: sy(R), x2: sx(x), y2: sy(-R), class: cls }, layer);
  const hline = (y, cls, layer = L.guides) => el("line", { x1: sx(-R), y1: sy(y), x2: sx(R), y2: sy(y), class: cls }, layer);
  function xmark(x, y, layer = L.marks) {
    const X0 = sx(x), Y0 = sy(y), s = 9;
    el("line", { x1: X0 - s, y1: Y0 - s, x2: X0 + s, y2: Y0 + s, class: "xmark" }, layer);
    el("line", { x1: X0 - s, y1: Y0 + s, x2: X0 + s, y2: Y0 - s, class: "xmark" }, layer);
  }
  function label(x, y, text, cls = "", dy = -16, anchor) {
    const X0 = sx(x);
    let a = anchor || "middle";
    if (!anchor && X0 > SIZE - 80) a = "end";
    if (!anchor && X0 < 80) a = "start";
    const t = el("text", { x: X0, y: Math.min(SIZE - 8, Math.max(20, sy(y) + dy)), class: `lbl ${cls}`, "text-anchor": a }, L.labels);
    t.textContent = text;
    return t;
  }
  // Nudge labels up or down until they stop overlapping.
  function spread() {
    const placed = [];
    L.labels.querySelectorAll("text").forEach(t => {
      const y0 = +t.getAttribute("y");
      for (const d of [0, 24, -24, 48, -48, 72, -72]) {
        t.setAttribute("y", y0 + d);
        const b = t.getBBox();
        if (!placed.some(p => b.x < p.x + p.width + 4 && p.x < b.x + b.width + 4 && b.y < p.y + p.height && p.y < b.y + b.height)) break;
        if (d === -72) t.setAttribute("y", y0);
      }
      placed.push(t.getBBox());
    });
  }
  function animate(ms, fn) {
    if (reduceMotion) return fn(1);
    const t0 = performance.now(), id = ++animId;
    const tick = now => {
      if (id !== animId) return;
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  let animId = 0;

  /* ---------- State ---------- */
  const S = { type: "abs", sub: "graph", kind: "lin", view: "learn", step: 0, tool: "asy", placed: [], done: false, checked: false, right: 0, total: 0 };
  let Q = null; // the current question

  function newQuestion() {
    animId++;
    setScale();
    const practice = S.view === "practice";
    if (S.type === "abs" && S.sub === "graph") Q = { F: genAbsGraph(practice, S.kind) };
    else if (S.type === "abs") Q = genAbsEq(S.kind);
    else if (S.type === "rec") Q = { F: genRec(practice, S.kind) };
    else Q = genRad();
    S.step = 0; S.placed = []; S.marks = null; S.done = false; S.shown = false; S.checked = false;
    Q.steps = buildSteps();
    if (practice) Q.targets = buildTargets();
    $("ans").value = ""; $("ans").className = "ans";
    $("fb").classList.remove("on");
    $("solution").textContent = "";
    render(false);
  }

  /* ---------- Learning steps ---------- */
  // Each step: title, html for the panel, and draw(animate) that adds its part to the board.
  function buildSteps() {
    if (S.type === "abs" && S.sub === "graph") return absGraphSteps();
    if (S.type === "abs") return absEqSteps();
    if (S.type === "rec") return recSteps();
    return radSteps();
  }
  function drawF(cls = "c-f") { curve(Q.F.f, L.curve, cls, "blue"); }

  function absGraphSteps() {
    const F = Q.F, zs = solve(F, 0), steps = [];
    steps.push({ title: "Graph y = f(x)", html: `<p>Start with the graph of f(x).</p>`, draw() { drawF(); } });
    steps.push({ title: "Find the x-intercepts", html: `<p>On the x-axis y = 0, and |0| = 0, so these points stay where they are. They are invariant points.</p>${solvedH(solveWork(F, 0))}`,
      draw() { zs.forEach(z => { dot(z, 0, "zero"); label(z, 0, ptT(z, 0), "zero", 30); }); } });
    steps.push({ title: "Above the x-axis: it stays", html: `<p>There y is already positive. The absolute value does not change it.</p>`,
      draw() { curve(x => (F.f(x) >= 0 ? F.f(x) : NaN), L.result, "c-res", "green"); } });
    // An example point below the x-axis to follow as it flips.
    let ex = null;
    for (const x of range(-9, 9).sort((p, q) => Math.abs(p) - Math.abs(q))) {
      const y = F.f(x);
      if (isInt(y) && y <= -2 && y >= -9) { ex = { x, y }; break; }
    }
    steps.push({ title: "Below the x-axis: reflect it", html: `<p>There y is negative. The absolute value makes it positive, so that part reflects in the x-axis.</p>` +
      (ex ? `<p class="mathline">(${fmt(ex.x)}, ${fmt(ex.y)}) → (${fmt(ex.x)}, ${fmt(-ex.y)})</p>` : ""),
      draw(go) {
        L.curve.querySelectorAll("path").forEach(p => p.classList.add("ghost"));
        const g = el("g", {}, L.result);
        const paint = t => { g.textContent = ""; curve(x => { const y = F.f(x); return y >= 0 ? NaN : -y * (2 * t - 1); }, g, "c-res", "green"); };
        if (go) animate(1100, paint); else paint(1);
        if (ex) {
          el("line", { x1: sx(ex.x), y1: sy(ex.y) - 10, x2: sx(ex.x), y2: sy(-ex.y) + 12, class: "arrowline", "marker-end": "url(#ar-orange)" }, L.marks);
          dot(ex.x, ex.y, "blue"); dot(ex.x, -ex.y, "green");
          label(ex.x, ex.y, ptT(ex.x, ex.y), "blue", 30);
          label(ex.x, -ex.y, ptT(ex.x, -ex.y), "green");
        }
      } });
    steps.push({ title: "Write it as a piecewise function", html: `<p>Use f(x) where the graph was above the x-axis, and −(f(x)) where it was below.</p>${pieceH()}<p>Range: y ≥ 0</p>`, draw() {} });
    return steps;
  }
  function pieceH() {
    const F = Q.F, zs = solve(F, 0).map(numH), f = F.html, neg = `−(${f})`;
    let rows;
    if (F.kind === "lin") {
      const up = F.m > 0;
      rows = [[f, `${X} ${up ? "≥" : "≤"} ${zs[0]}`], [neg, `${X} ${up ? "<" : ">"} ${zs[0]}`]];
    } else if (F.a > 0) rows = [[f, `${X} ≤ ${zs[0]} or ${X} ≥ ${zs[1]}`], [neg, `${zs[0]} < ${X} < ${zs[1]}`]];
    else rows = [[f, `${zs[0]} ≤ ${X} ≤ ${zs[1]}`], [neg, `${X} < ${zs[0]} or ${X} > ${zs[1]}`]];
    return `<div class="piece">y = <span class="rows">${rows.map(([e, c]) => `<span>${e},</span><span class="cond">${c}</span>`).join("")}</span></div>`;
  }

  function recSteps() {
    const F = Q.F, zs = solve(F, 0).filter(inGrid), steps = [];
    const inv = [1, -1].flatMap(v => solve(F, v).filter(inGrid).map(x => ({ x, y: v })));
    steps.push({ title: "Graph y = f(x)", html: `<p>Start with the graph of f(x).</p>`, draw() { drawF(); } });
    steps.push({ title: "Vertical asymptotes", html: zs.length
      ? `<p>1 over 0 has no value. So wherever f(x) = 0, the reciprocal graph has a vertical asymptote.</p>${solvedH(solveWork(F, 0))}`
      : `<p>1 over 0 has no value, so look for where f(x) = 0.</p>${solvedH(solveWork(F, 0))}<p>f(x) is never 0, so there is no vertical asymptote.</p>`,
      draw() { zs.forEach(z => { vline(z, "asy"); label(z, R, `x = ${numT(z)}`, "red", 24); }); } });
    steps.push({ title: "Horizontal asymptote y = 0", html: `<p>When f(x) is far from 0, 1 over f(x) is very close to 0. The graph gets close to the x-axis but never touches it.</p>` +
      workH([[fracH(1, 10), "0.1", "f(x) = 10"], [fracH(1, 100), "0.01", "f(x) = 100"]]),
      draw() { hline(0, "asy"); label(-R, 0, "y = 0", "red", -10, "start"); } });
    steps.push({ title: "Invariant points: y = 1 and y = −1", html: `<p>1 over 1 is 1, and 1 over −1 is −1. So where f(x) = 1 or −1, the point stays.</p>` +
      `<p class="sub">Where f(x) = 1</p>${solvedH(solveWork(F, 1))}<p class="sub">Where f(x) = −1</p>${solvedH(solveWork(F, -1))}`,
      draw() {
        hline(1, "guide"); hline(-1, "guide");
        label(R, 1, "y = 1", "pink", -8, "end"); label(R, -1, "y = −1", "pink", 22, "end");
        inv.forEach(p => { ring(p.x, p.y); label(p.x, p.y, ptT(p.x, p.y), "pink", p.y > 0 ? -18 : 32); });
      } });
    if (F.kind === "quad" && F.k !== 0) {
      steps.push({ title: "The vertex", html: `<p>The vertex (${fmt(F.h)}, ${fmt(F.k)}) has y = ${fmt(F.k)}. On the reciprocal graph the y-value is 1 over ${fmt(F.k)}.</p>` +
        workH([["y", fracH(1, fmt(F.k)), "1 over the y-value"]].concat(isInt(1 / F.k) ? [] : [["y", numT(1 / F.k).replace("≈", "≈ "), "As a decimal"]])),
        draw() {
          dot(F.h, F.k, "blue"); label(F.h, F.k, ptT(F.h, F.k), "blue", F.k > 0 ? -16 : 32);
          dot(F.h, 1 / F.k, "green"); label(F.h, 1 / F.k, ptT(F.h, 1 / F.k), "green", F.k > 0 ? 32 : -16);
        } });
    }
    steps.push({ title: "Sketch the reciprocal graph", html: `<p>Where f(x) is above the x-axis, 1 over f(x) is above too. Where f(x) is below, so is 1 over f(x).</p><p>Each branch passes through the invariant points and bends toward the asymptotes.</p>`,
      draw(go) { curve(x => 1 / F.f(x), L.result, "c-res", "green", -R, R, go); } });
    return steps;
  }

  function absEqSteps() {
    const { F, c } = Q, steps = [];
    const absF = x => Math.abs(F.f(x));
    steps.push({ title: "Graph both sides", html: `<p>The solutions are the x-values where y = |f(x)| meets y = ${fmt(c)}.</p>`,
      draw() { curve(absF, L.result, "c-res", "green"); hline(c, "c-line", L.curve); label(-R, c, `y = ${fmt(c)}`, "orange", c >= 0 ? -10 : 24, "start"); } });
    if (c < 0) {
      steps.push({ title: "An absolute value is never negative", html: `<p>|f(x)| is always 0 or more, so it can never equal ${fmt(c)}. The graphs never meet.</p><p class="note">No solution</p>`, draw() {} });
      return steps;
    }
    const mark = xs => xs.filter(inGrid).forEach(x => { dot(x, c, "zero"); label(x, c, `x = ${numT(x)}`, "zero"); });
    const w1 = solveWork(F, c), w2 = solveWork(F, -c);
    steps.push({ title: `Case 1: the inside equals ${fmt(c)}`, html: solvedH(w1), draw() { mark(solve(F, c)); } });
    steps.push({ title: `Case 2: the inside equals ${fmt(-c)}`, html: `<p>|${fmt(-c)}| is also ${c}, so the inside could be ${fmt(-c)}.</p>${solvedH(w2)}`, draw() {
      mark(solve(F, -c));
      curve(F.f, L.curve, "c-f ghost", "blue");
    } });
    steps.push({ title: "Solutions", html: `<p>Both cases together give every point where the graphs meet.</p><p class="mathline">${X} = ${Q.sols.map(numH).join(" or ")}</p>`, draw() {
      Q.sols.forEach(x => el("line", { x1: sx(x), y1: sy(c), x2: sx(x), y2: sy(0), class: "arrowline" }, L.guides));
    } });
    return steps;
  }

  function radSteps() {
    const { p, q, roots, valid } = Q, steps = [];
    const left = radH(p), right = linH(1, q);
    const sqrtF = x => (x + p >= -1e-9 ? Math.sqrt(Math.max(0, x + p)) : NaN);
    const B = 2 * q - 1, C = q * q - p;
    steps.push({ title: "Graph both sides", html: `<p>The solutions are the x-values where y = ${radT(p)} meets y = ${linT(q)}.</p>`,
      draw() {
        curve(sqrtF, L.result, "c-res", "green", Math.max(-R, -p), R);
        curve(x => x + q, L.curve, "c-line", "orange");
        dot(-p, 0, "green", L.marks, 6);
      } });
    steps.push({ title: "Square both sides", html: workH([[left, right, "Start"], [inH(-p), q === 0 ? `${X}²` : `(${right})²`, "Square both sides"], [inH(-p), polyH(2 * q, q * q), "Expand"]]) +
      `<p>Squaring also solves y = −${radT(p)}, the dashed bottom half. That is where extraneous roots come from.</p>`,
      draw() { curve(x => -sqrtF(x), L.result, "c-res half", "green", Math.max(-R, -p), R); label(R, -sqrtF(R), "−√", "green", 28, "end"); } });
    steps.push({ title: "Solve the quadratic", html: workH([["0", polyH(B, C), "Move everything to one side"],
      ["0", `${factorH(roots[0])}${factorH(roots[1])}`, "Factor"], [X, `${fmt(roots[0])} or ${fmt(roots[1])}`, "Set each factor to 0"]]),
      draw() { roots.forEach(r => { dot(r, r + q, "blue", L.marks, 7); label(r, r + q, `x = ${fmt(r)}`, "blue"); }); } });
    const checks = roots.map((r, i) => {
      const s = Math.sqrt(r + p), t = r + q;
      return `<p class="sub">Check x = ${fmt(r)}</p>` + workH([[`√${r + p}`, fmt(s), "Left side"], [`${fmt(r)}${constH(q)}`, fmt(t), "Right side"]]) +
        (valid[i] ? `<p class="verdict-ok">${fmt(s)} = ${fmt(t)}, so x = ${fmt(r)} works.</p>` : `<p class="verdict-bad">${fmt(s)} ≠ ${fmt(t)}, so x = ${fmt(r)} is extraneous.</p>`);
    }).join("");
    steps.push({ title: "Check each answer in the original", html: checks, draw() {
      L.labels.textContent = "";
      roots.forEach((r, i) => {
        if (valid[i]) { ring(r, r + q, "ok", L.marks); label(r, r + q, `x = ${fmt(r)} ✓`, "green"); }
        else { xmark(r, r + q); label(r, r + q, `x = ${fmt(r)} extraneous`, "red", 32); }
      });
    } });
    steps.push({ title: "Solution", html: `<p>Only answers that work in the original equation count.</p><p class="mathline">${X} = ${Q.sols.map(fmt).join(" or ")}</p>`, draw() {} });
    return steps;
  }

  /* ---------- Practice targets (graph practice) ---------- */
  function buildTargets() {
    const F = Q.F;
    if (S.type === "abs" && S.sub === "graph") {
      const t = solve(F, 0).map(x => ({ x, y: 0, name: "x-intercept" }));
      if (F.kind === "quad") t.push({ x: F.h, y: Math.abs(F.k), name: "vertex" });
      const y0 = Math.abs(F.f(0));
      if (y0 <= R && !t.some(p => close(p.x, 0))) t.push({ x: 0, y: y0, name: "y-intercept" });
      return { pts: t, asy: [] };
    }
    if (S.type === "rec") {
      const pts = [1, -1].flatMap(v => solve(F, v).filter(inGrid).map(x => ({ x, y: v, name: "invariant point" })));
      return { pts, asy: solve(F, 0).filter(inGrid) };
    }
    return null;
  }

  /* ---------- Panel ---------- */
  function eqCardH() {
    if (S.type === "rad") return `<p class="label">Solve</p><div class="eqbig"><span>${radH(Q.p)} = ${linH(1, Q.q)}</span></div>`;
    const f = `<div class="eqbig"><span>f(${X}) =</span><span>${Q.F.html}</span></div>`;
    if (S.type === "abs" && S.sub === "eq") return `<p class="label">Solve</p><div class="eqbig"><span>|${Q.F.html}| = ${fmt(Q.c)}</span></div>`;
    const goal = S.type === "abs" ? `<div class="eqbig goal"><span>y = |f(${X})|</span></div>` : `<div class="eqbig goal">y = ${fracH(1, `f(${X})`)}</div>`;
    return `<p class="label">Start with</p>${f}<p class="label">Graph</p>${goal}`;
  }
  const stepH = (s, i, now) => `<div class="step${now ? " now" : ""}"><h3><span class="n">${i + 1}</span><span>${s.title}</span></h3>${s.html}</div>`;

  function render(go) {
    animId++;
    const practice = S.view === "practice", graphPractice = practice && Q.targets;
    $("eqCard").innerHTML = eqCardH();
    $("learnPanel").hidden = practice;
    $("pracPanel").hidden = !practice;
    drawGrid();
    if (!practice) {
      Q.steps.slice(0, S.step + 1).forEach((s, i) => s.draw(go && i === S.step));
      $("steps").innerHTML = Q.steps.slice(0, S.step + 1).map((s, i) => stepH(s, i, i === S.step)).join("");
      $("backBtn").disabled = S.step === 0;
      $("nextBtn").disabled = S.step === Q.steps.length - 1;
      $("count").textContent = `Step ${S.step + 1} of ${Q.steps.length}`;
      const now = $("steps").lastElementChild;
      if (now) now.scrollIntoView({ block: "nearest" });
    } else {
      $("placeCard").hidden = !graphPractice;
      $("typeCard").hidden = !!graphPractice;
      if (graphPractice) drawGraphPractice(); else drawEqPractice();
      $("tally").textContent = S.total ? `Correct: ${S.right} of ${S.total}` : "";
    }
    svg.classList.toggle("click", !!graphPractice && !S.done);
    spread();
  }

  function drawGraphPractice() {
    const F = Q.F, T = Q.targets, rec = S.type === "rec";
    drawF();
    if (rec) { hline(1, "guide"); hline(-1, "guide"); label(R, 1, "y = 1", "pink", -8, "end"); label(R, -1, "y = −1", "pink", 22, "end"); }
    $("toolRow").hidden = !rec;
    const nA = T.asy.length, nP = T.pts.length;
    const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
    if (rec) $("todo").innerHTML = `<li>${plural(nA, "vertical asymptote", "vertical asymptotes")}</li><li>${plural(nP, "invariant point", "invariant points")} (where y = 1 or y = −1)</li>`;
    else {
      const names = T.pts.map(p => p.name), cnt = n => names.filter(x => x === n).length;
      $("todo").innerHTML = ["x-intercept", "vertex", "y-intercept"].filter(cnt).map(n => `<li>${cnt(n) === 1 ? "the " + n : cnt(n) + " " + n + "s"} of y = |f(x)|</li>`).join("");
    }
    const marks = S.marks || {};
    S.placed.forEach((it, i) => {
      const st = marks[i] || "";
      if (it.asy) vline(it.x, `asy user ${st}`, L.user);
      else dot(it.x, it.y, `user ${st}`, L.user);
    });
    if (S.done) {
      curve(rec ? x => 1 / F.f(x) : x => Math.abs(F.f(x)), L.result, "c-ans", "green");
      if (S.shown) {
        T.asy.forEach(x => { if (!S.placed.some(it => it.asy && close(it.x, x))) vline(x, "asy"); });
        T.pts.forEach(p => { if (!S.placed.some(it => !it.asy && close(it.x, p.x) && close(it.y, p.y))) ring(p.x, p.y, "miss"); });
      }
      T.pts.forEach(p => label(p.x, p.y, ptT(p.x, p.y), "green", p.y > 0 || (p.y === 0 && !rec) ? -18 : 32));
      T.asy.forEach(x => label(x, R, `x = ${numT(x)}`, "red", 24));
    }
  }

  function drawEqPractice() {
    if (!S.done) {
      // Only the graphs; the solving is up to the student.
      Q.steps[0].draw(false);
      return;
    }
    Q.steps.forEach(s => s.draw(false));
  }

  /* ---------- Clicking in graph practice ---------- */
  function planeAt(evt) {
    const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: (p.x - PAD) / U - R, y: R - (p.y - PAD) / U };
  }
  svg.addEventListener("pointerdown", evt => {
    if (S.view !== "practice" || !Q.targets || S.done) return;
    const raw = planeAt(evt);
    if (Math.abs(raw.x) > R + 0.5 || Math.abs(raw.y) > R + 0.5) return;
    const rec = S.type === "rec", T = Q.targets;
    if (rec && S.tool === "asy") {
      let x = Math.round(raw.x);
      T.asy.forEach(a => { if (Math.abs(raw.x - a) < 0.5) x = a; });
      const i = S.placed.findIndex(it => it.asy && close(it.x, x));
      if (i >= 0) S.placed.splice(i, 1); else S.placed.push({ asy: true, x });
    } else {
      let x = Math.round(raw.x), y = Math.round(raw.y);
      if (rec) { // invariant points need not sit on whole numbers: snap onto f(x) = ±1 when close
        const cands = [1, -1].flatMap(v => solve(Q.F, v).map(cx => ({ x: cx, y: v })));
        let best = null, bd = 0.6;
        cands.forEach(c => { const d = Math.hypot(c.x - raw.x, c.y - raw.y); if (d < bd) { bd = d; best = c; } });
        if (best) ({ x, y } = best);
      }
      const i = S.placed.findIndex(it => !it.asy && close(it.x, x) && close(it.y, y));
      if (i >= 0) S.placed.splice(i, 1); else S.placed.push({ x, y });
    }
    S.marks = null;
    $("fb").classList.remove("on");
    render(false);
  });

  /* ---------- Checking ---------- */
  function score(ok) {
    if (!S.checked) { S.checked = true; S.total++; if (ok) S.right++; }
  }
  function feedback(ok, tips) {
    $("fbHead").textContent = ok ? "Correct!" : "Not quite.";
    $("fbHead").style.color = ok ? "var(--ok)" : "var(--bad)";
    $("tips").innerHTML = tips.map(([good, t]) => `<li class="${good ? "good" : "miss"}">${t}</li>`).join("");
    $("fb").classList.add("on");
  }
  function checkGraph() {
    const T = Q.targets, rec = S.type === "rec", tips = [], marks = {};
    S.placed.forEach((it, i) => {
      const ok = it.asy ? T.asy.some(x => close(x, it.x)) : T.pts.some(p => close(p.x, it.x) && close(p.y, it.y));
      marks[i] = ok ? "ok" : "bad";
      if (!ok) {
        if (it.asy) tips.push([false, `x = ${numT(it.x)} is not an asymptote: f(${numT(it.x)}) is not 0.`]);
        else if (!rec && close(it.y, Q.F.f(it.x)) && it.y < 0) tips.push([false, `${ptT(it.x, it.y)} is below the x-axis. On y = |f(x)| it reflects up to ${ptT(it.x, -it.y)}.`]);
        else tips.push([false, `${ptT(it.x, it.y)} is not one of the points.`]);
      }
    });
    const missA = T.asy.filter(x => !S.placed.some(it => it.asy && close(it.x, x)));
    const missP = T.pts.filter(p => !S.placed.some(it => !it.asy && close(it.x, p.x) && close(it.y, p.y)));
    if (missA.length) tips.push([false, `Missing ${missA.length === 1 ? "a vertical asymptote" : missA.length + " vertical asymptotes"}. Where does f(x) = 0?`]);
    missP.forEach(p => tips.push([false, rec ? "Missing an invariant point. Where does f(x) = 1 or −1?" : p.name === "x-intercept" ? "Missing an x-intercept. Where does f(x) = 0?" : p.name === "vertex" ? "Missing the vertex. Find the vertex of f(x), then make its y-value positive." : "Missing the y-intercept. Find f(0), then make it positive."]));
    const ok = !tips.length;
    if (ok) { tips.push([true, "Every point and asymptote is right. Here is the whole graph."]); S.done = true; }
    S.marks = marks;
    score(ok);
    feedback(ok, tips);
    render(false);
  }
  function readList(s) {
    s = s.replace(/[−–—]/g, "-").replace(/x\s*=/gi, "").trim().toLowerCase();
    if (!s || /^no|none|∅/.test(s)) return /^no|none|∅/.test(s) ? [] : null;
    const parts = s.split(/,|;|\bor\b|\band\b/).map(t => t.trim()).filter(Boolean);
    const out = [];
    for (const t of parts) {
      let m = t.match(/^(-?\d*\.?\d+)\s*\/\s*(\d*\.?\d+)$/);
      if (m) { out.push(+m[1] / +m[2]); continue; }
      if (!/^-?(\d+\.?\d*|\.\d+)$/.test(t)) return undefined;
      out.push(+t);
    }
    return out;
  }
  function checkEq() {
    const got = readList($("ans").value);
    if (got === null || got === undefined) {
      feedback(false, [[false, got === null ? "Type your solutions, or press No solution." : "Type numbers like 2, −3 or 5/2, with commas between them."]]);
      return;
    }
    const want = Q.sols, has = v => got.some(g => Math.abs(g - v) < 0.01);
    const tips = [];
    const extra = got.filter(g => !want.some(w => Math.abs(g - w) < 0.01));
    const miss = want.filter(w => !has(w));
    if (S.type === "rad") {
      extra.forEach(g => {
        const i = Q.roots.findIndex(r => Math.abs(r - g) < 0.01);
        if (i >= 0) tips.push([false, `x = ${fmt(Q.roots[i])} is extraneous. Put it into the original equation: the left side is ${fmt(Math.sqrt(Q.roots[i] + Q.p))} but the right side is ${fmt(Q.roots[i] + Q.q)}.`]);
        else tips.push([false, `x = ${numT(g)} does not solve the equation. Square both sides and solve the quadratic.`]);
      });
      if (miss.length) tips.push([false, want.length === 1 ? "Missing the solution. Square both sides, solve, then check." : "Missing a solution. Check both answers from the quadratic."]);
    } else {
      if (Q.c < 0 && got.length) tips.push([false, `An absolute value is never negative, so it can't equal ${fmt(Q.c)}.`]);
      else {
        extra.forEach(g => tips.push([false, `x = ${numT(g)} does not work: |f(${numT(g)})| is ${numT(Math.abs(Q.F.f(g)))}, not ${fmt(Q.c)}.`]));
        if (miss.length) tips.push([false, !got.length ? "There is a solution. Solve both cases." : `Missing ${miss.length === 1 ? "a solution" : miss.length + " solutions"}. Did you solve both cases: the inside equals ${fmt(Q.c)} and the inside equals ${fmt(-Q.c)}?`]);
      }
    }
    const ok = !tips.length;
    $("ans").className = "ans " + (ok ? "ok" : "bad");
    if (ok) { tips.push([true, want.length ? "Here are the graphs and every step." : "No solution. Here is why."]); S.done = true; showSolution(); }
    score(ok);
    feedback(ok, tips);
    render(false);
  }
  function showSolution() {
    $("solution").innerHTML = Q.steps.map((s, i) => stepH(s, i, false)).join("");
  }
  $("checkBtn").addEventListener("click", () => { if (S.done) return; Q.targets ? checkGraph() : checkEq(); });
  $("showBtn").addEventListener("click", () => {
    if (S.done) return;
    score(false);
    S.done = true; S.shown = true;
    if (!Q.targets) { $("ans").value = Q.sols.length ? Q.sols.map(numT).join(", ") : "no solution"; showSolution(); }
    feedback(false, [[true, Q.targets ? "The green dashed graph is the answer. Dashed rings and red lines are what you were missing." : "Read the steps below."]]);
    $("fbHead").textContent = "Here it is.";
    $("fbHead").style.color = "var(--pt)";
    render(false);
  });
  $("noneBtn").addEventListener("click", () => { $("ans").value = "no solution"; $("ans").focus(); });
  $("ans").addEventListener("keydown", e => { if (e.key === "Enter") $("checkBtn").click(); });

  /* ---------- Controls ---------- */
  function segInit(id, key, after) {
    $(id).addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      S[key] = b.dataset.v;
      $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      after();
    });
  }
  function syncHeader() {
    $("subSeg").hidden = S.type !== "abs";
    $("kindSeg").hidden = S.type === "rad";
  }
  const fresh = () => { S.shown = false; syncHeader(); newQuestion(); };
  segInit("typeSeg", "type", fresh);
  segInit("subSeg", "sub", fresh);
  segInit("kindSeg", "kind", fresh);
  segInit("viewSeg", "view", fresh);
  segInit("toolSeg", "tool", () => {});
  $("newBtn").addEventListener("click", fresh);
  $("nextBtn").addEventListener("click", () => { if (S.step < Q.steps.length - 1) { S.step++; render(true); } });
  $("backBtn").addEventListener("click", () => { if (S.step > 0) { S.step--; render(false); } });
  document.addEventListener("keydown", e => {
    if (S.view !== "learn" || e.target.closest("input")) return;
    if (e.key === "ArrowRight") $("nextBtn").click();
    if (e.key === "ArrowLeft") $("backBtn").click();
  });

  syncHeader();
  newQuestion();
})();
</script>

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression

    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);

    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }

  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
