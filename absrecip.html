<body>
<title>Absolute Value, Reciprocal and Radical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
:root { --ok: #1f7a5a; --ok-bg: #e3f4ec; --bad: #c0263c; --bad-bg: #fbe7ea; --pink: #c2338a; --purple: #7a3fc4; --shown-bg: #e6eefc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok: #4cc49a; --ok-bg: #12352a; --bad: #ff7d93; --bad-bg: #3a1820; --pink: #ff7ac8; --purple: #b98cff; --shown-bg: #1a2a4a; } }
:root[data-theme="dark"] { --ok: #4cc49a; --ok-bg: #12352a; --bad: #ff7d93; --bad-bg: #3a1820; --pink: #ff7ac8; --purple: #b98cff; --shown-bg: #1a2a4a; }
.main { grid-template-columns: minmax(0, 1fr) clamp(410px, 37vw, 690px); gap: 14px; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
h1 { font-size: clamp(1.4rem, 2.6vw, 2rem); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.seg { display: inline-flex; flex: none; }
.seg button { border-radius: 0; padding: 8px 14px; font-size: 1.05rem; }
.seg button:first-child { border-radius: 8px 0 0 8px; }
.seg button:last-child { border-radius: 0 8px 8px 0; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.type-seg button { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.type-seg button[aria-pressed="true"] { background: var(--pt); border-color: var(--pt); }
.new-btn { background: var(--pt); color: var(--sheet); border-color: var(--pt); font-size: 1.1rem; padding: 10px 18px; }
.new-btn:hover { background: var(--sheet); color: var(--pt); }
.panel { gap: 8px; }
.card { padding: 10px 14px; }
.label { margin-bottom: 2px; }
.eqbig { margin: 0 0 4px; font-family: var(--font-num); font-weight: 700; font-size: 1.6rem; line-height: 1.3; }
.eqbig:last-child { margin-bottom: 0; }
.eqbig.goal { color: var(--green); }
.frac { vertical-align: middle; }
.frac > span:first-child { align-self: stretch; text-align: center; }
.frac.sm { font-size: 0.8em; }
.rad { white-space: nowrap; }
.rad > span { border-top: 2px solid currentColor; padding: 0 2px; }
.own { display: flex; gap: 8px; align-items: center; }
.own input { font: inherit; font-family: var(--font-num); font-weight: 700; font-size: 1.15rem; flex: 1 1 auto; min-width: 0; padding: 4px 10px; border: 2px solid var(--grid-major); border-radius: 8px; background: var(--sheet); color: var(--ink); }
.own button { flex: none; }
.own-msg { margin: 4px 0 0; font-size: 0.92rem; color: var(--muted); }
.own-msg.bad { color: var(--bad); font-weight: 700; }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 8px 14px; }
.step.now { border: 2px solid var(--pt); }
.step h3 { margin: 0 0 2px; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; display: flex; gap: 10px; align-items: baseline; }
.step h3 .n { flex: none; display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--pt); color: var(--sheet); font-size: 0.9rem; }
.step p { margin: 0; font-size: 1.05rem; line-height: 1.4; }
.step > * + * { margin-top: 6px; }
.sub { font-weight: 700; color: var(--muted); }
/* Vertical work: one line per step, = signs lined up, step names in their own column. */
.work { display: grid; grid-template-columns: auto auto auto minmax(8.5em, 1fr); align-items: center; gap: 4px 10px; font-family: var(--font-num); font-weight: 700; font-size: 1.2rem; }
.work .wl { text-align: right; white-space: nowrap; }
.work .wr { white-space: nowrap; }
.work .wn { font-family: var(--font-body); font-weight: 400; font-size: 0.88rem; color: var(--muted); padding-left: 8px; border-left: 2px solid var(--grid); }
.aside { font-size: 0.92rem !important; color: var(--muted); border-left: 3px solid var(--grid-major); padding-left: 8px; font-style: italic; }
.note { color: var(--orange); font-weight: 700; }
.yes { color: var(--ok); font-weight: 700; }
.no { color: var(--bad); font-weight: 700; }
.mathline { font-family: var(--font-num); font-weight: 700; font-size: 1.25rem; }
.piece { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-num); font-weight: 700; font-size: 1.15rem; }
.piece .rows { display: grid; grid-template-columns: auto auto; gap: 4px 16px; border-left: 3px solid var(--ink); border-radius: 12px 0 0 12px; padding: 4px 0 4px 12px; }
.piece .cond { color: var(--muted); }
/* Table of values */
table.tv { border-collapse: collapse; font-family: var(--font-num); font-weight: 700; font-size: 1.15rem; }
table.tv th { font-size: 1rem; padding: 3px 12px; border-bottom: 2px solid var(--ink); text-align: center; white-space: nowrap; }
table.tv td { padding: 3px 12px; text-align: center; border-top: 1px solid var(--grid); white-space: nowrap; }
table.tv th + th, table.tv td + td { border-left: 1px solid var(--grid); }
table.tv th:last-child, table.tv td:last-child { color: var(--green); }
table.tv tr.now td { background: var(--chip); }
table.tv input { font: inherit; width: 4.2em; text-align: center; padding: 1px 4px; border: 2px solid var(--grid-major); border-radius: 6px; background: var(--sheet); color: var(--ink); }
table.tv input.ok { border-color: var(--ok); background: var(--ok-bg); }
table.tv input.bad { border-color: var(--bad); background: var(--bad-bg); }
table.tv input.shown { border-color: var(--pt); background: var(--shown-bg); }
.actions { display: flex; gap: 8px; align-items: center; flex: none; position: sticky; bottom: 0; z-index: 2; background: var(--paper); padding-top: 4px; box-shadow: 0 -8px 8px -4px var(--paper); }
.actions button { font-size: 1.15rem; padding: 10px 16px; }
.next-btn { background: var(--pt); color: var(--sheet); border-color: var(--pt); flex: 1 1 auto; }
.next-btn:hover { background: var(--sheet); color: var(--pt); }
.actions button:disabled { opacity: 0.45; cursor: default; }
.count { color: var(--muted); font-weight: 700; white-space: nowrap; }
.check-btn { background: var(--orange); color: var(--sheet); border-color: var(--orange); flex: 1 1 auto; }
.check-btn:hover { background: var(--sheet); color: var(--orange); }
.todo { margin: 0; padding-left: 1.3em; font-size: 1.05rem; line-height: 1.4; }
.ansrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-family: var(--font-num); font-weight: 700; font-size: 1.35rem; }
input.ans { font: inherit; font-family: var(--font-num); font-weight: 700; font-size: 1.3rem; flex: 1 1 8em; min-width: 0; padding: 4px 10px; border: 2px solid var(--grid-major); border-radius: 8px; background: var(--sheet); color: var(--ink); }
input.ans.ok { border-color: var(--ok); background: var(--ok-bg); }
input.ans.bad { border-color: var(--bad); background: var(--bad-bg); }
.fb { display: none; }
.fb.on { display: block; }
.score { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; margin: 0 0 4px; }
.tips { margin: 0; padding-left: 1.1em; font-size: 1.02rem; line-height: 1.4; }
.tips li + li { margin-top: 4px; }
.tips .good { list-style: "✓  "; }
.tips .good::marker { color: var(--ok); }
.tips .miss { list-style: "✗  "; }
.tips .miss::marker { color: var(--bad); }
.tally { margin: 0; color: var(--muted); font-weight: 700; }
/* Board drawing */
.g-minor { stroke: var(--grid); stroke-width: 1; }
.g-axis { stroke: var(--muted); stroke-width: 2.5; }
.g-tick { fill: var(--ink); font-family: var(--font-num); font-size: 15px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.g-ax { font-family: var(--font-num); font-weight: 700; font-style: italic; font-size: 22px; fill: var(--ink); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; }
.c-f { fill: none; stroke: var(--pt); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
.c-f.ghost { stroke-width: 3; stroke-dasharray: 9 7; opacity: 0.55; }
.c-base { fill: none; stroke: var(--muted); stroke-width: 3; stroke-dasharray: 9 7; }
.c-res { fill: none; stroke: var(--green); stroke-width: 5.5; stroke-linejoin: round; stroke-linecap: round; }
.c-res.half { stroke-width: 4; stroke-dasharray: 10 8; opacity: 0.75; }
.c-line { fill: none; stroke: var(--orange); stroke-width: 4.5; stroke-linecap: round; }
.c-ans { fill: none; stroke: var(--green); stroke-width: 5; stroke-dasharray: 12 8; }
.c-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawin 1.3s ease-out forwards; }
@keyframes drawin { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .c-draw { animation: none; stroke-dashoffset: 0; } }
.a-blue { fill: var(--pt); } .a-green { fill: var(--green); } .a-orange { fill: var(--orange); } .a-muted { fill: var(--muted); }
.asy { stroke: var(--bad); stroke-width: 3.5; stroke-dasharray: 3 7; stroke-linecap: round; }
.guide { stroke: var(--pink); stroke-width: 2.5; stroke-dasharray: 8 6; opacity: 0.8; }
.arrowline { stroke: var(--orange); stroke-width: 3; stroke-dasharray: 6 5; }
.dropline { stroke: var(--orange); stroke-width: 2.5; stroke-dasharray: 5 5; }
.d { stroke: var(--sheet); stroke-width: 3; }
.d.zero { fill: var(--orange); }
.d.blue { fill: var(--pt); }
.d.green { fill: var(--green); }
.d.base { fill: var(--muted); }
.d.now { stroke: var(--ink); stroke-width: 3; }
.d.user { fill: var(--purple); }
.d.user.ok { fill: var(--ok); }
.d.user.bad { fill: var(--bad); }
.ring { fill: none; stroke: var(--green); stroke-width: 3.5; }
.ring.miss { stroke-dasharray: 5 4; }
.xmark { stroke: var(--bad); stroke-width: 4; stroke-linecap: round; }
.lbl { font-family: var(--font-num); font-weight: 700; font-size: 18px; paint-order: stroke; stroke: var(--sheet); stroke-width: 6px; stroke-linejoin: round; fill: var(--ink); }
.lbl.zero { fill: var(--orange); } .lbl.blue { fill: var(--pt); } .lbl.green { fill: var(--green); } .lbl.red { fill: var(--bad); } .lbl.pink { fill: var(--pink); } .lbl.orange { fill: var(--orange); } .lbl.muted { fill: var(--muted); }
#svg.click { cursor: crosshair; }
[hidden] { display: none !important; }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Absolute Value, Reciprocal and Radical</h1></div>
    <div class="tools">
      <div class="seg type-seg" id="typeSeg" role="group" aria-label="Topic">
        <button data-v="abs" aria-pressed="true">Absolute Value</button><button data-v="rec" aria-pressed="false">Reciprocal</button><button data-v="rad" aria-pressed="false">Radical</button>
      </div>
      <div class="seg" id="subSeg" role="group" aria-label="Graphs or equations">
        <button data-v="graph" aria-pressed="true">Graphs</button><button data-v="eq" aria-pressed="false">Equations</button>
      </div>
      <div class="seg" id="viewSeg" role="group" aria-label="Learning or practice">
        <button data-v="learn" aria-pressed="true">Learning</button><button data-v="practice" aria-pressed="false">Practice</button>
      </div>
      <button class="new-btn" id="newBtn">New question</button>
    </div>

      `<p>When f(x) is far from 0, 1 over f(x) is close to 0, so y = 0 is a horizontal asymptote.</p>`,
      draw() {
        zs.forEach(z => { vline(z, "asy"); label(z, R, `x = ${numT(z)}`, "red", 22); });
        hline(0, "asy"); label(-R, 0, "y = 0", "red", -10, "start");
      } });
    steps.push({ table: true, title: "Make a table of key points", html: `<p>Find where f(x) is 1, −1, 2, −2, ½ and −½. Then flip each y-value: 1 over f(x). Where f(x) = 1 or −1, the point stays (invariant points).</p>`,
      draw() { hline(1, "guide"); hline(-1, "guide"); } });
    steps.push(...rowSteps(rows, (o, go, now) => { dot(o.x, o.f, "blue", L.marks, 6); dot(o.x, o.y, "green" + (now ? " now" : "")); }));
    steps.push({ title: "Join the points", html: `<p>Where f(x) is above the x-axis, so is 1 over f(x). Each branch goes through the points and bends toward the asymptotes.</p>`,
      draw(go) { curve(x => 1 / F.f(x), L.result, "c-res", "green", -R, R, go); } });
    return steps;
  }

  function radGraphSteps() {
    const F = Q, rows = Q.rows = radRows(F), steps = [];
    const base = [[0, 0], [1, 1], [4, 2], [9, 3]];
    steps.push({ title: "Start with y = √x", html: `<p>Its key points come from perfect squares: (0, 0), (1, 1), (4, 2) and (9, 3).</p>`,
      draw() { curve(x => (x >= 0 ? Math.sqrt(x) : NaN), L.base, "c-base", "muted", 0, R); base.forEach(([x, y]) => dot(x, y, "base", L.base, 6)); } });
    const hk = `<p>Here a = ${numT(F.a)}, b = ${numT(F.b)}, h = ${numT(F.h)}, k = ${numT(F.k)}.</p>`;
    steps.push({ table: true, title: "Make a table of key points", html: `<p>Choose x so the inside of the root is 0, 1, 4 and 9. Those roots come out evenly.</p>${hk}`,
      draw() {} });
    steps.push(...rowSteps(rows, (o, go, now) => dot(o.x, o.y, "green" + (now ? " now" : ""))));
    const start = rows[0];
    const dom = F.b > 0 ? `x ≥ ${numT(F.h)}` : `x ≤ ${numT(F.h)}`, rng = F.a > 0 ? `y ≥ ${numT(F.k)}` : `y ≤ ${numT(F.k)}`;
    steps.push({ title: "Join the points", html: `<p>The graph starts at (${numT(F.h)}, ${numT(F.k)}) and curves away through the points.</p><p class="mathline">Domain: ${dom}</p><p class="mathline">Range: ${rng}</p>`,
      draw(go) {
        curve(F.f, L.result, "c-res", "green", F.b > 0 ? Math.max(-R, F.h) : -R, F.b > 0 ? R : Math.min(R, F.h), go);
        label(start.x, start.y, ptT(start.x, start.y), "green", F.a > 0 ? 30 : -16);
      } });
    return steps;
  }

  function graphBoth(F) {
    curve(F.lf, L.curve, "c-f", "blue");
    curve(F.rf, L.result, "c-line", "orange");
  }
  function solsH(sols) { return sols.length ? `<p class="mathline"><i>x</i> = ${sols.map(numH).join(" or ")}</p>` : `<p class="note">No solution</p>`; }
  function checkRowsH(F, xs, valid) {
    return xs.map((x, i) => {
      const l = F.lf(x), r = F.rf(x);
      return `<p class="sub">Check x = ${numT(x)}</p>` + workH([["Left side", "=", Number.isFinite(l) ? numT(Math.round(l * 1e4) / 1e4) : "no value", ""], ["Right side", "=", Number.isFinite(r) ? numT(Math.round(r * 1e4) / 1e4) : "no value", ""]]) +
        (valid[i] ? `<p class="yes">They match, so x = ${numT(x)} works.</p>` : `<p class="no">They don't match, so x = ${numT(x)} is extraneous.</p>`);
    }).join("");
  }
  function markSols(F, xs, valid) {
    xs.forEach((x, i) => {
      const y = F.rf(x);
      if (valid[i]) { ring(x, y); label(x, y, `x = ${numT(x)} ✓`, "green"); el("line", { x1: sx(x), y1: sy(Math.max(-R, Math.min(R, y))), x2: sx(x), y2: sy(0), class: "dropline" }, L.guides); }
      else { xmark(x, y); label(x, y, `x = ${numT(x)} extraneous`, "red", 30); }
    });
  }
  function specialEqSteps() {
    const F = Q, steps = [], abs = F.kind === "abseq";
    steps.push({ title: "Graph both sides", html: `<p>The left side is blue and the right side is orange. The solutions are where they meet.</p>${abs ? "" : `<p class="aside">Extra for the teacher: students don't need to know these graphs in Math 20-1. They only help show why the answer works.</p>`}`, draw() { graphBoth(F); } });
    if (F.iso.length > 1) steps.push({ title: abs ? "Get the absolute value by itself" : "Get the root by itself", html: workH(F.iso), draw() {} });
    if (abs && F.noneReason === "neg") {
      steps.push({ title: "An absolute value is never negative", html: `<p>|…| is always 0 or more, so it can never equal a negative number.</p><p class="note">No solution</p>`, draw() {} });
      return steps;
    }
    if (abs) {
      F.cases.forEach((c, i) => steps.push({ title: i ? "Case 2: the inside is the negative" : "Case 1: the inside is the positive", html: (i ? `<p>|−a| = a too, so the inside could be the negative of the right side.</p>` : "") + workH(c.rows) + (c.sol.note ? `<p class="note">${c.sol.note}</p>` : ""), draw() {} }));
    } else {
      F.cases.forEach(c => steps.push({ title: "Square both sides and solve", html: workH(c.rows) + (c.sol.note ? `<p class="note">${c.sol.note}</p>` : "") +
        `<p>Squaring also solves the bottom half, y = −√(…), dashed. That is where extraneous roots come from.</p>`,
        draw() { curve(x => -F.lf(x), L.curve, "c-f ghost", "blue"); } }));
    }
    const needCheck = !abs || deg(F.r) > 0;
    if (F.cands.length && needCheck) steps.push({ title: "Check each answer in the original", html: checkRowsH(F, F.cands, F.valid), draw() { markSols(F, F.cands, F.valid); } });
    steps.push({ title: "Solution", html: `${needCheck ? "<p>Only answers that work in the original equation count.</p>" : "<p>Both cases together give every point where the graphs meet.</p>"}${solsH(F.sols)}`,
      draw() { if (!needCheck) markSols(F, F.sols, F.sols.map(() => true)); } });
    return steps;
  }
  function ratEqSteps() {
    const F = Q, steps = [];
    const lcdH = F.npv.map(factorH).join("") || "1";
    steps.push({ title: "Graph both sides", html: `<p>The left side is blue and the right side is orange. The solutions are where they meet.</p><p class="aside">Extra for the teacher: students don't need to know these graphs in Math 20-1. They only help show why the answer works.</p>`, draw() { graphBoth(F); } });
    steps.push({ title: "Non-permissible values", html: `<p>A denominator can't be 0, so x can't be ${F.npv.map(numT).join(" or ")}.</p>`,
      draw() { F.npv.forEach(z => { if (Math.abs(z) <= R) { vline(z, "asy"); label(z, R, `x ≠ ${numT(z)}`, "red", 22); } }); } });
    steps.push({ title: "Multiply both sides by the common denominator", html: workH([[astH(F.orig.L), "=", astH(F.orig.R), "Start"], [polyH(F.ln), "=", polyH(F.rn), `Multiply both sides by ${lcdH.replace(/<\/?i>/g, "")}`], [polyH(F.P0), "=", "0", "Move everything to one side"], ...F.sol.rows]) +
      (F.sol.note ? `<p class="note">${F.sol.note}</p>` : ""), draw() {} });
    if (F.cands.length) steps.push({ title: "Reject non-permissible values", html: F.cands.map((x, i) => F.valid[i] ? `<p class="yes">x = ${numT(x)} is allowed.</p>` : `<p class="no">x = ${numT(x)} makes a denominator 0, so it is extraneous.</p>`).join(""),
      draw() { markSols(F, F.cands, F.valid); } });
    steps.push({ title: "Solution", html: solsH(F.sols), draw() {} });
    return steps;
  }

  /* ================= Rendering ================= */
  const stepH = (s, i, now) => `<div class="step${now ? " now" : ""}"><h3><span class="n">${i + 1}</span><span>${s.title}</span></h3>${s.html}</div>`;
  function stepsPanelH(upto) {
    const cards = [];
    let n = 0;
    Q.steps.slice(0, upto + 1).forEach((s, i) => {
      if (s.row !== undefined) return;
      const rowsShown = s.table ? Q.steps.slice(0, upto + 1).filter(t => t.row !== undefined).length : 0;
      const now = i === upto || (s.table && Q.steps[upto].row !== undefined);
      cards.push(stepH({ title: s.title, html: s.html + (s.table && rowsShown ? tableH(Q.rows, rowsShown, false) : "") }, n++, now));
    });
    return cards.join("");
  }
  function eqCardH() {
    if (S.sub === "eq") return `<p class="label">Solve</p><p class="eqbig">${Q.html}</p>`;
    if (S.type === "rad") return `<p class="label">Graph</p><p class="eqbig goal">y = ${Q.html}</p>`;
    const goal = S.type === "abs" ? `y = |f(<i>x</i>)|` : `y = ${fracH(1, "f(<i>x</i>)")}`;
    return `<p class="label">Start with</p><p class="eqbig">f(<i>x</i>) = ${Q.html}</p><p class="label">Graph</p><p class="eqbig goal">${goal}</p>`;
  }
  function load(text, F) {
    animId++;
    Q = F; Q.text = text;
    Q.steps = buildSteps();
    if (S.sub === "graph") Q.rows = Q.rows || rowsOf(Q);
    S.step = 0; S.placed = []; S.marks = null; S.done = false; S.shown = false; S.checked = false;
    $("ans").value = ""; $("ans").className = "ans";
    $("fb").classList.remove("on");
    $("solution").textContent = "";
    $("ownIn").value = text.replace(/-/g, "−");
    $("ownMsg").textContent = HELP[S.type][S.sub];
    $("ownMsg").classList.remove("bad");
    if (S.view === "practice" && S.sub === "graph") $("pracTable").innerHTML = tableH(Q.rows, Q.rows.length, true);
    render(false);
  }
  function newQuestion(first) {
    R = S.type === "rec" && S.sub === "graph" ? 6 : 10;
    U = (SIZE - 2 * PAD) / (2 * R);
    const q = first ? { text: EXAMPLES[S.type][S.sub], F: build(EXAMPLES[S.type][S.sub]) } : randomText(S.view === "practice");
    load(q.text, q.F);
  }
  function render(go) {
    animId++;
    const practice = S.view === "practice";
    $("eqCard").innerHTML = eqCardH();
    $("ownCard").hidden = practice;
    $("learnPanel").hidden = practice;
    $("pracPanel").hidden = !practice;
    drawGrid();
    if (!practice) {
      Q.steps.slice(0, S.step + 1).forEach((s, i) => s.draw(go && i === S.step, i === S.step));
      // Earlier table rows lose their "now" ring.
      $("steps").innerHTML = stepsPanelH(S.step);
      $("backBtn").disabled = S.step === 0;
      $("nextBtn").disabled = S.step === Q.steps.length - 1;
      $("count").textContent = `Step ${S.step + 1} of ${Q.steps.length}`;
      L.marks.querySelectorAll(".d.now").forEach((d, i, all) => { if (i < all.length - 1 || Q.steps[S.step].row === undefined) d.classList.remove("now"); });
      const now = $("steps").querySelector(".step.now");
      if (now) now.scrollIntoView({ block: "nearest" });
    } else {
      $("tableCard").hidden = S.sub !== "graph";
      $("typeCard").hidden = S.sub === "graph";
      if (S.sub === "graph") drawGraphPractice(); else if (S.done) Q.steps.forEach(s => s.draw(false)); else Q.steps[0].draw(false);
      $("tally").textContent = S.total ? `Correct: ${S.right} of ${S.total}` : "";
    }
    svg.classList.toggle("click", practice && S.sub === "graph" && !S.done);
    $("undoBtn").hidden = !(practice && S.sub === "graph");
    $("undoBtn").disabled = S.done || !S.placed.length;
    spread();
  }

  /* ================= Graph practice: fill the table, plot the points ================= */
  function drawGraphPractice() {
    if (S.type === "rad") { curve(x => (x >= 0 ? Math.sqrt(x) : NaN), L.base, "c-base", "muted", 0, R); [[0, 0], [1, 1], [4, 2], [9, 3]].forEach(([x, y]) => dot(x, y, "base", L.base, 6)); }
    else curve(Q.f, L.curve, "c-f", "blue");
    if (S.type === "rec") { roots(Q.p).forEach(z => Math.abs(z) <= R && vline(z, "asy")); hline(0, "asy"); }
    const m = S.marks || {};
    S.placed.forEach((p, i) => dot(p.x, p.y, "user " + (m[i] || ""), L.user));
    if (S.done) {
      const fn = S.type === "abs" ? x => Math.abs(Q.f(x)) : S.type === "rec" ? x => 1 / Q.f(x) : Q.f;
      curve(fn, L.result, "c-ans", "green", S.type === "rad" && Q.b > 0 ? Math.max(-R, Q.h) : -R, S.type === "rad" && Q.b < 0 ? Math.min(R, Q.h) : R);
      Q.rows.forEach(o => { if (!S.placed.some(p => near(p.x, o.x) && near(p.y, o.y))) ring(o.x, o.y, "miss"); });
    }
  }
  const step = () => (Q.rows.every(o => isInt(o.x) && isInt(o.y)) ? 1 : 0.5);
  svg.addEventListener("pointerdown", evt => {
    if (S.view !== "practice" || S.sub !== "graph" || S.done) return;
    const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const st = step(), x = Math.round(((p.x - PAD) / U - R) / st) * st, y = Math.round((R - (p.y - PAD) / U) / st) * st;
    if (Math.abs(x) > R || Math.abs(y) > R) return;
    const i = S.placed.findIndex(q => near(q.x, x) && near(q.y, y));
    if (i >= 0) S.placed.splice(i, 1); else S.placed.push({ x, y });
    S.marks = null; $("fb").classList.remove("on");
    render(false);
  });

  /* ================= Checking ================= */
  function score(ok) { if (!S.checked) { S.checked = true; S.total++; if (ok) S.right++; } }
  function feedback(head, color, tips) {
    $("fbHead").textContent = head; $("fbHead").style.color = color;
    $("tips").innerHTML = tips.map(([good, t]) => `<li class="${good ? "good" : "miss"}">${t}</li>`).join("");
    $("fb").classList.add("on");
  }
  function readNum(s) {
    s = s.replace(/[−–—]/g, "-").replace(/\s+/g, "");
    let m = s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
    if (m) return +m[2] ? +m[1] / +m[2] : NaN;
    return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? +s : NaN;
  }
  function readList(s) {
    s = s.replace(/[−–—]/g, "-").replace(/x\s*=/gi, "").trim().toLowerCase();
    if (/^(no|none|∅)/.test(s)) return [];
    if (!s) return null;
    const out = [];
    for (const t of s.split(/,|;|\bor\b|\band\b/).map(u => u.trim()).filter(Boolean)) { const v = readNum(t); if (Number.isNaN(v)) return undefined; out.push(v); }
    return out;
  }
  function checkGraph() {
    const tips = [], rows = Q.rows;
    let tableOk = true;
    rows.forEach((o, i) => {
      const inp = $("tv" + i), v = readNum(inp.value);
      const ok = Math.abs(v - o.y) < 0.011;
      inp.className = ok ? "ok" : "bad";
      if (!ok) tableOk = false;
    });
    if (!tableOk) tips.push([false, S.type === "abs" ? "Some y-values are wrong. y is |f(x)|: make f(x) positive." : S.type === "rec" ? "Some y-values are wrong. y is 1 over f(x): 1 over 2 is ½, 1 over ½ is 2." : "Some y-values are wrong. Multiply the root by a, then add k."]);
    const marks = {};
    S.placed.forEach((p, i) => (marks[i] = rows.some(o => near(o.x, p.x) && near(o.y, p.y)) ? "ok" : "bad"));
    const missing = rows.filter(o => !S.placed.some(p => near(p.x, o.x) && near(p.y, o.y))).length, extra = Object.values(marks).filter(v => v === "bad").length;
    if (missing) tips.push([false, `${missing} ${missing === 1 ? "point from the table is" : "points from the table are"} not plotted yet.`]);
    if (extra) tips.push([false, `${extra} ${extra === 1 ? "point is" : "points are"} not in the table (red).`]);
    S.marks = marks;
    const ok = !tips.length;
    score(ok);
    if (ok) { S.done = true; tips.push([true, "Every value and point is right. Here is the graph."]); }
    feedback(ok ? "Correct!" : "Not quite.", ok ? "var(--ok)" : "var(--bad)", tips);
    render(false);
  }
  function checkEq() {
    const got = readList($("ans").value);
    if (got === null || got === undefined) { feedback("Not yet.", "var(--bad)", [[false, got === null ? "Type your solutions, or press No solution." : "Type numbers like 2, −3 or 5/2, with commas between them."]]); return; }
    const want = Q.sols, tips = [];
    const extra = got.filter(g => !want.some(w => Math.abs(g - w) < 0.011)), miss = want.filter(w => !got.some(g => Math.abs(g - w) < 0.011));
    extra.forEach(g => {
      const ext = (Q.cands || []).find(c => Math.abs(c - g) < 0.011);
      if (ext !== undefined) tips.push([false, S.type === "rec" ? `x = ${numT(ext)} is extraneous: it makes a denominator 0.` : `x = ${numT(ext)} is extraneous. Check it in the original equation.`]);
      else tips.push([false, `x = ${numT(g)} does not solve the equation.`]);
    });
    if (miss.length) tips.push([false, S.type === "abs" ? "Missing a solution. Did you solve both cases?" : `Missing ${miss.length === 1 ? "a solution" : miss.length + " solutions"}.`]);
    const ok = !tips.length;
    $("ans").className = "ans " + (ok ? "ok" : "bad");
    score(ok);
    if (ok) { S.done = true; showSolution(); tips.push([true, "Here are the graphs and every step."]); }
    feedback(ok ? "Correct!" : "Not quite.", ok ? "var(--ok)" : "var(--bad)", tips);
    render(false);
  }
  function showSolution() {
    $("solution").innerHTML = Q.steps.filter(s => s.row === undefined).map((s, i) => stepH({ title: s.title, html: s.html + (s.table ? tableH(Q.rows, Q.rows.length, false) : "") }, i, false)).join("");
  }
  $("checkBtn").addEventListener("click", () => { if (!S.done) (S.sub === "graph" ? checkGraph : checkEq)(); });
  $("showBtn").addEventListener("click", () => {
    if (S.done) return;
    score(false);
    S.done = true; S.shown = true;
    if (S.sub === "graph") Q.rows.forEach((o, i) => { const inp = $("tv" + i); inp.value = numT(o.y); inp.className = "shown"; });
    else $("ans").value = Q.sols.length ? Q.sols.map(numT).join(", ") : "no solution";
    showSolution();
    feedback("Here it is.", "var(--pt)", [[true, S.sub === "graph" ? "The table is filled in. Dashed rings show points you hadn't plotted." : "Read the steps below."]]);
    render(false);
  });
  $("undoBtn").addEventListener("click", () => { if (S.done || !S.placed.length) return; S.placed.pop(); S.marks = null; $("fb").classList.remove("on"); render(false); });
  $("noneBtn").addEventListener("click", () => { $("ans").value = "no solution"; $("ans").focus(); });
  $("ans").addEventListener("keydown", e => { if (e.key === "Enter") $("checkBtn").click(); });

  /* ================= Typing your own ================= */
  function own() {
    const text = $("ownIn").value.trim();
    if (!text) return;
    try {
      R = S.type === "rec" && S.sub === "graph" ? 6 : 10;
      U = (SIZE - 2 * PAD) / (2 * R);
      const F = build(text);
      if (S.sub === "graph" && rowsOf(F).length < 2) throw new Error("Too few key points fit on the grid. Try smaller numbers.");
      load(text, F);
    } catch (e) {
      $("ownMsg").textContent = (e.message && e.message.length > 12 ? e.message + " " : "I couldn't read that. ") + HELP[S.type][S.sub];
      $("ownMsg").classList.add("bad");
    }
  }
  $("ownBtn").addEventListener("click", own);
  $("ownIn").addEventListener("keydown", e => { if (e.key === "Enter") own(); });

  /* ================= Controls ================= */
  function segInit(id, key) {
    $(id).addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      S[key] = b.dataset.v;
      $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      // Radical is equations only (Shawn 2026-10-30).
      if (S.type === "rad") S.sub = "eq";
      $("subSeg").hidden = S.type === "rad";
      $("subSeg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === S.sub ? "true" : "false"));
      $("typeSeg").querySelector('[data-v="rec"]').textContent = S.sub === "eq" ? "Rational" : "Reciprocal";
      $("ownLabel").textContent = S.sub === "graph" ? (S.type === "rad" ? "Type your own: y =" : "Type your own: f(x) =") : "Type your own equation";
      newQuestion(S.view === "learn");
    });
  }
  segInit("typeSeg", "type");
  segInit("subSeg", "sub");
  segInit("viewSeg", "view");
  $("newBtn").addEventListener("click", () => newQuestion(false));
  $("nextBtn").addEventListener("click", () => { if (S.step < Q.steps.length - 1) { S.step++; render(true); } });
  $("backBtn").addEventListener("click", () => { if (S.step > 0) { S.step--; render(false); } });
  document.addEventListener("keydown", e => {
    if (S.view !== "learn" || e.target.closest("input")) return;
    if (e.key === "ArrowRight") $("nextBtn").click();
    if (e.key === "ArrowLeft") $("backBtn").click();
  });
  $("ownLabel").textContent = "Type your own: f(x) =";
  newQuestion(true);
})();
</script>

<script>
/* French for words that appear on many pages. Page-only words go in i18n/<page>.js. Canadian French math terms. */
window.I18N_COMMON = {
  "Return to Main Page": "Retour à la page principale",
  "{0} Return to Main Page": "{0} Retour à la page principale",
  "Check": "Vérifier",
  "Check answer": "Vérifier la réponse",

  "Start over": "Recommencer",

    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
