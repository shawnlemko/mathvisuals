<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script data-goatcounter="https://shawnlemko.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<title>How AI Guesses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* How AI Guesses (grades 7-10, Stats/Probability). A simulation, no real AI: built-in examples show what a
   language model and a picture guesser do with probability.
   Learning walks five parts with Next step / Back:
     1 Count it yourself: tallies of the word after "slice of" in 10 sentences become chances (5/10, 3/10, 2/10).
     2 Roll the next word: a spinner sized by the chances builds "My ___ ___ a slice of ___." one word at a time.
     3 Creativity dial: a 0 (Safe) to 2 (Wild) slider reshapes the chances (count to the power 1/dial, shared out).
     4 Fair data: tap he / she / they in 10 "The doctor said ..." sentences and watch the guess change.
     5 Picture guesser: clue toggles give points; each point doubles an animal's score; chance = score over total.
       The mystery photo gives fox 128/145 (88%), and it is really a cat.
   Practice: mixed questions with Check, Show me and Next question; fractions in two stacked boxes, any equivalent
   fraction accepted. */
:root { --c-orange: #c2571a; --c-blue: #2f5fd0; --c-purple: #8650c8; --c-green: #1f7a5a; --c-teal: #0e7c86; --c-pink: #c23a7a; --c-brown: #8a6a2a; --fur-o: #e8873a; --fur-g: #a3abb4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-orange: #f08a4b; --c-blue: #7aa2ff; --c-purple: #b38cf0; --c-green: #4cc49a; --c-teal: #4cc3cc; --c-pink: #f07ab0; --c-brown: #d2b070; --fur-o: #e8873a; --fur-g: #8d96a0; } }
:root[data-theme="dark"] { --c-orange: #f08a4b; --c-blue: #7aa2ff; --c-purple: #b38cf0; --c-green: #4cc49a; --c-teal: #4cc3cc; --c-pink: #f07ab0; --c-brown: #d2b070; --fur-o: #e8873a; --fur-g: #8d96a0; }
.main { grid-template-columns: minmax(0, 1.6fr) minmax(330px, 1fr); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.seg-btns { display: inline-flex; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg-btns button { border: 0; border-radius: 0; background: var(--sheet); color: var(--ink); font-size: 1.1rem; min-height: 48px; padding: 6px 16px; cursor: pointer; }
.seg-btns button + button { border-left: 2px solid var(--grid-major); }
.seg-btns button.on { background: var(--pt); color: var(--sheet); }
.parts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
.parts button { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 3px 2px; min-height: 50px; font-size: 0.85rem; line-height: 1.15;
  background: var(--sheet); color: var(--muted); border: 2px solid var(--grid-major); border-radius: 10px; cursor: pointer; }
.parts button b { font-family: var(--font-num); font-size: 1.25rem; color: var(--ink); }
.parts button.on { border-color: var(--pt); background: var(--pt); color: var(--sheet); }
.parts button.on b { color: var(--sheet); }
.parts button.done b::after { content: " ✓"; color: var(--green); font-size: 0.9rem; }
.parts button.on.done b::after { color: var(--sheet); }
.plabel { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.ptitle { font-family: var(--font-display); font-weight: 800; font-size: 1.65rem; line-height: 1.2; color: var(--pt); margin: 0 0 8px; }
.idea { border: 3px solid var(--green); background: color-mix(in srgb, var(--green) 12%, var(--sheet)); border-radius: 12px; padding: 8px 14px; margin-bottom: 12px; }
.idea span { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--green); font-weight: 800; }
.idea p { margin: 2px 0 0; font-size: 1.2rem; font-weight: 700; line-height: 1.35; }
.say { font-size: 1.2rem; margin: 0 0 8px; line-height: 1.45; }
.say b { color: var(--pt); }
.ctrls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.ctrls:empty { display: none; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns button, .nav button { font-size: 1.1rem; min-height: 50px; padding: 8px 16px; cursor: pointer; }
button.go { background: var(--pt); color: var(--sheet); border-color: var(--pt); font-weight: 700; }
button:disabled { opacity: 0.45; cursor: default; }
.nav { display: flex; align-items: center; gap: 10px; border-top: 1px dashed var(--grid-major); padding-top: 12px; }
.nav .go { margin-left: auto; }
.nav span { color: var(--muted); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 1.05rem; background: var(--sheet); color: var(--ink); border: 2px solid var(--grid-major); padding: 6px 12px; cursor: pointer; }
.chips button.on { border-color: var(--green); background: color-mix(in srgb, var(--green) 18%, var(--sheet)); }
.chips button.on::before { content: "✓"; color: var(--green); font-weight: 800; }
.chips button:not(.on)::before { content: "○"; color: var(--muted); }
.chips.lock button { cursor: default; }
.dial { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.dial input { width: 100%; accent-color: var(--pt); height: 34px; }
.dial span { font-weight: 700; color: var(--muted); }
.picks { display: flex; flex-wrap: wrap; gap: 6px; min-height: 2em; }
.picks span { font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 2px solid currentColor; font-size: 1.05rem; }
.mathtbl { display: grid; grid-template-columns: auto auto auto auto; gap: 0 18px; justify-content: start; align-items: center; font-family: var(--font-num); font-size: 1.15rem; }
.mathtbl .k { font-family: var(--font-body); font-weight: 700; color: var(--muted); font-size: 0.8rem; line-height: 1.2; }
.mathtbl .frac { font-size: 0.95rem; line-height: 1.05; }
.note { color: var(--muted); margin: 0; font-size: 0.95rem; }
.toggle { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 700; }
.toggle input { width: 20px; height: 20px; accent-color: var(--pt); }
.learned { margin: 0; padding-left: 1.3em; font-size: 1.1rem; }
.learned li + li { margin-top: 4px; }
.got { font-weight: 700; color: var(--green); }
/* Practice */
.q { font-size: 1.3rem; font-weight: 700; margin: 0 0 12px; line-height: 1.4; }
.q .w { font-family: var(--font-display); font-weight: 800; }
.ans { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.fin { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.fin .ln { width: 86px; height: 3px; background: var(--ink); border-radius: 2px; }
.ans input { font-family: var(--font-num); font-weight: 700; font-size: 1.8rem; width: 3.4ch; height: 58px; text-align: center; color: var(--ink); background: var(--paper); border: 2px solid var(--grid-major); border-radius: 10px; }
.ans input.wide { width: 4.4ch; }
.ans .unit { font-size: 1.2rem; color: var(--muted); font-weight: 700; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.choices button { font-size: 1.15rem; min-height: 52px; padding: 6px 16px; background: var(--sheet); color: var(--ink); border: 2px solid var(--grid-major); cursor: pointer; }
.choices button.right { border-color: var(--green); background: color-mix(in srgb, var(--green) 20%, var(--sheet)); }
.choices button.wrong { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--sheet)); }
.fb { margin: 6px 0 0; font-size: 1.15rem; font-weight: 700; min-height: 1.5em; }
.fb.ok { color: var(--green); } .fb.no { color: var(--warn); }
.work { font-size: 1.15rem; margin-top: 6px; }
.work .eqs { display: grid; grid-template-columns: auto auto auto; gap: 8px 10px; align-items: center; justify-content: start; font-family: var(--font-num); font-size: 1.3rem; }
.work .eqs .nm { font-family: var(--font-body); font-size: 0.95rem; color: var(--muted); font-weight: 700; padding-left: 10px; }
.score { margin: 10px 0 0; color: var(--muted); }
.score b { color: var(--ink); font-family: var(--font-num); font-size: 1.3rem; }
/* Board */
#svg { user-select: none; }
.sent { font-family: var(--font-body); font-size: 27px; fill: var(--ink); }
.sent .so { font-weight: 700; }
.sent .nw { font-weight: 700; }
.cap { font-family: var(--font-display); font-weight: 800; font-size: 26px; fill: var(--muted); }
.tw { font-family: var(--font-display); font-weight: 800; font-size: 34px; }
.big { font-family: var(--font-num); font-weight: 700; font-size: 36px; fill: var(--ink); }
.fr { font-family: var(--font-num); font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.barbg { fill: var(--chip); }
.prompt { font-family: var(--font-display); font-weight: 800; font-size: 38px; fill: var(--ink); text-anchor: middle; }
.blank { fill: var(--muted); }
.wl { font-family: var(--font-display); font-weight: 800; font-size: 25px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.hist { font-family: var(--font-body); font-size: 23px; fill: var(--ink); }
.pron { cursor: pointer; }
.pron:focus-visible rect { stroke-width: 6; }
.pron text { font-family: var(--font-display); font-weight: 800; font-size: 25px; text-anchor: middle; dominant-baseline: central; }
.pct { font-family: var(--font-num); font-weight: 700; font-size: 25px; fill: var(--ink); text-anchor: middle; }
.guess { fill: color-mix(in srgb, var(--pt) 10%, var(--sheet)); stroke: var(--pt); stroke-width: 3; }
.ink { stroke: var(--ink); stroke-width: 3; }
.lbl { font-family: var(--font-display); font-weight: 800; font-size: 30px; text-anchor: middle; dominant-baseline: central; }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>How AI Guesses</h1></div>
    <div class="tools">
      <div class="seg-btns" role="group" aria-label="Mode" id="modes">
        <button type="button" data-mode="learn" class="on">Learning</button><button type="button" data-mode="practice">Practice</button>
      </div>
    </div>
  </header>

  <div class="main">
    <div class="board"><svg id="svg" viewBox="0 0 1000 700" role="img" aria-label="How AI guesses"></svg></div>

    <div class="panel">
      <section class="card" id="learnCard">
        <div class="parts" id="parts" role="group" aria-label="Parts"></div>
        <p class="plabel" id="plabel"></p>
        <p class="ptitle" id="ptitle"></p>
        <p class="say" id="say" aria-live="polite"></p>
        <div class="ctrls" id="ctrls"></div>
        <div class="idea" id="idea" hidden><span>Big idea</span><p id="ideaText"></p></div>
        <div class="nav">
          <button type="button" id="back">Back</button>
          <span id="stepnum"></span>
          <button type="button" class="go" id="next">Next step</button>
        </div>
      </section>

      <section class="card" id="pracCard" hidden>
        <p class="q" id="pq"></p>
        <div id="pans"></div>
        <div class="btns">
          <button type="button" class="go" id="pcheck">Check</button>
          <button type="button" id="pshow">Show me</button>
          <button type="button" id="pnext">Next question</button>
        </div>
        <p class="fb" id="pfb" aria-live="polite"></p>
        <div class="work" id="pwork"></div>
        <p class="score">Correct: <b id="pright">0</b> of <b id="ptried">0</b></p>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const svg = $("svg");

      s += `<rect x="${x}" y="${y}" width="265" height="108" rx="14" style="fill:${tint(c, 14)};stroke:${c}" stroke-width="3"/>`;
      s += `<circle cx="${x + 38}" cy="${y + 34}" r="15" style="fill:${c}"/><path d="M${x + 14} ${y + 84} q24 -46 48 0 z" style="fill:${c}"/>`;
      s += `<text x="${x + 76}" y="${y + 42}" style="fill:${c};font-size:28px;text-anchor:start">${WHO[w].w}</text>`;
      s += `<text x="${x + 76}" y="${y + 82}" class="hist" style="fill:${sc.col};font-weight:700;font-size:23px;dominant-baseline:auto;text-anchor:start;font-family:var(--font-body)">${sc.w}</text></g>`;
    });
    s += `<line x1="585" x2="585" y1="20" y2="680" stroke="var(--grid)" stroke-width="3"/>`;
    s += `<text class="cap" x="790" y="40" text-anchor="middle" style="font-size:24px">Heart attack signs in the data</text>`;
    const n = SIGNS.map((_, k) => sg.filter(x => x === k).length);
    if (S.step >= 1) SIGNS.forEach((g, k) => {
      const y = 62 + k * 86, on = S.step >= 2 && MARIA.includes(k);
      s += `<text class="tw" x="605" y="${y + 30}" style="fill:${g.col};font-size:27px">${g.w}${on ? " ★" : ""}</text>`;
      s += sfrac(950, y + 38, n[k], 10, 25, g.col);
      s += `<rect class="barbg" x="605" y="${y + 46}" width="290" height="18" rx="6"/><rect x="605" y="${y + 46}" width="${29 * n[k]}" height="18" rx="6" style="fill:${g.col}"/>`;
    });
    if (S.step >= 2) {
      const m = MARIA.reduce((a, k) => a + n[k], 0), ok = m >= 3;
      s += `<rect class="guess" x="600" y="418" width="385" height="268" rx="14"/>`;
      s += `<text class="cap" x="792" y="452" text-anchor="middle" style="font-size:24px;fill:var(--ink)">Maria comes in</text>`;
      s += `<text class="hist" x="792" y="488" text-anchor="middle" style="font-size:22px">★ very tired, upset stomach, jaw pain</text>`;
      s += `<text class="hist" x="616" y="540" style="font-size:22px">In the data, her signs show up</text>`;
      s += sfrac(940, 545, m, 10, 26, "var(--ink)");
      s += `<text class="hist" x="616" y="572" style="font-size:20px;fill:var(--muted)">AI warns at 3 out of 10 or more</text>`;
      s += `<text class="lbl" x="792" y="640" style="fill:${ok ? "var(--green)" : "var(--warn)"};font-size:28px">${ok ? "AI: Get help now! ✓" : "AI: You're fine. Go home. ✗"}</text>`;
    }
    return s;
  }
  function drawP5() {
    const f = S.step >= 2 && S.step <= 3 ? MYSTERY : S.clue, c = chances(f);
    let s = "";
    if (S.step >= 2 && S.step <= 3) {
      s += `<rect x="15" y="100" width="540" height="480" rx="16" fill="none" stroke="var(--muted)" stroke-width="3" stroke-dasharray="12 8"/>`;
      s += `<text class="cap" x="285" y="80" text-anchor="middle">Mystery photo</text>`;
    }
    s += animal(f);
    if (S.step === 3) s += `<rect x="140" y="600" width="300" height="70" rx="14" style="fill:${tint("var(--green)", 20)};stroke:var(--green)" stroke-width="4"/><text class="lbl" x="290" y="636" style="fill:var(--green)">Real animal: CAT</text>`;
    s += `<line x1="585" x2="585" y1="20" y2="680" stroke="var(--grid)" stroke-width="3"/>`;
    s += animalBars(c, S.step === 3 ? { real: 0, wrong: 2 } : {});
    return s;
  }

  // ---------- Learning: controls ----------
  function ctrlsHTML() {
    const p = S.part, st = S.step;
    if (p === 0 && st === 1) return `<div class="btns"><button type="button" class="go" data-act="count1" ${S.counted >= 10 ? "disabled" : ""}>Count next</button><button type="button" data-act="countAll" ${S.counted >= 10 ? "disabled" : ""}>Count all</button><button type="button" data-act="count0">Start over</button></div>`;
    if (p === 0 && st === 2) return `<div class="eq">chance = ${hf("times the word came next", "all the sentences")}</div>`;
    if (p === 1) {
      const done = st > 0 && S.spin.words.length === 3;
      return `<div class="btns"><button type="button" class="go" data-act="spin">${done ? "Start a new sentence" : "Spin"}</button>${st === 2 ? `<button type="button" data-act="spin3">Make a whole sentence</button>` : ""}</div>`;
    }
    if (p === 2) return `<div class="btns"><button type="button" data-act="dial0">0 Safe</button><button type="button" data-act="dial1">1 Normal</button><button type="button" data-act="dial2">2 Wild</button></div>
      <div class="dial"><span>Safe</span><input type="range" id="dial" min="0" max="2" step="0.1" value="${S.dial}" aria-label="Creativity dial"><span>Wild</span></div>
      <div class="btns"><button type="button" class="go" data-act="pick10">Pick 10 words</button></div>
      <div class="picks" id="picks">${S.picks.map(i => `<span style="color:${DIAL[i].col}">${DIAL[i].w}</span>`).join("")}</div>`;
    if (p === 3 && st >= 3) return `<div class="btns"><button type="button" data-act="unfair">Unfair data</button><button type="button" data-act="fair">Fair data</button></div>`;
    if (p === 4) {
      if (st === 4) return `<ol class="learned"><li>AI counts patterns in its data.</li><li>It picks the next word by chance, like a spinner.</li><li>A creativity dial changes the chances.</li><li>Data that leaves people out makes AI miss them.</li><li>AI can be very sure and still be wrong. Check its answers!</li></ol>`;
      const lock = st >= 2, f = lock ? MYSTERY : S.clue, c = chances(f);
      let h = st === 3 ? "" : `<div class="chips${lock ? " lock" : ""}">${CLUES.map(k => `<button type="button" data-clue="${k.k}" class="${f[k.k] ? "on" : ""}" ${lock ? 'aria-disabled="true"' : ""}>${k.name}</button>`).join("")}</div>`;
      if (st === 1) h += `<p class="note">Made AI guess dog: <span class="got">${S.saw.dog ? "✓" : "…"}</span> &nbsp; fox: <span class="got">${S.saw.fox ? "✓" : "…"}</span></p>`;
      if (st === 3) return h;
      h += `<div class="btns" style="align-items:center;gap:8px 16px">${st === 2 ? `<button type="button" class="go" data-act="reveal">Reveal the real animal</button>` : ""}<label class="toggle"><input type="checkbox" id="mathT" ${S.math ? "checked" : ""}> Show the math</label></div>`;
      if (S.math) {
        h += `<div class="mathtbl"><span class="k">Animal</span><span class="k">Points</span><span class="k">Score<br>(×2 per point)</span><span class="k">Chance<br>(score over total)</span>`;
        ANIMALS.forEach((a, i) => (h += `<b style="color:${a.col}">${a.w}</b><span>${c.pts[i]}</span><span>${c.sc[i]}</span><span>${hf(c.sc[i], c.tot)}</span>`));
        h += `</div>`;
      }
      return h;
    }
    return "";
  }

  function renderLearn() {
    const P = PARTS[S.part];
    $("parts").innerHTML = PARTS.map((q, i) => `<button type="button" data-part="${i}" class="${i === S.part ? "on" : ""} ${S.seen[i] ? "done" : ""}"><b>${i + 1}</b>${q.short}</button>`).join("");
    $("plabel").textContent = `Part ${S.part + 1} of 5 · ${P.title}`;
    $("ptitle").textContent = P.q;
    $("idea").hidden = S.step !== P.ideaAt;
    $("ideaText").textContent = P.idea;
    $("say").innerHTML = P.steps[S.step];
    $("ctrls").innerHTML = ctrlsHTML();
    $("stepnum").textContent = `Step ${S.step + 1} of ${P.steps.length}`;
    $("back").disabled = S.part === 0 && S.step === 0;
    const last = S.step === P.steps.length - 1;
    $("next").textContent = last ? (S.part === 4 ? "Done" : "Next part →") : "Next step";
    $("next").disabled = last && S.part === 4;
    drawLearn();
    const d = $("dial");
    if (d) d.addEventListener("input", () => { S.dial = +d.value; S.picks = []; drawLearn(); $("picks").innerHTML = ""; });
    const m = $("mathT");
    if (m) m.addEventListener("change", () => { S.math = m.checked; renderLearn(); });
  }
  function drawLearn() {
    const p = S.part;
    svg.innerHTML = p === 0 ? drawP1() : p === 1 ? drawP2() : p === 2 ? drawDial(DIAL, S.dial, "a slice of ___") : p === 3 ? drawP4() : drawP5();
  }

  function enterStep() {
    const p = S.part, st = S.step;
    if (p === 0 && st === 1 && S.counted === 0) S.counted = 0;
    if (p === 0 && st >= 2) S.counted = 10;
    if (p === 1) { S.spin.words = []; S.spin.hi = null; }
    if (p === 2) { S.dial = st === 1 ? 0 : st === 2 ? 2 : 1; S.picks = []; }
    if (p === 3 && st <= 2) S.who = UNFAIR.slice();
    if (p === 3 && st === 4) S.who = FAIR.slice();
    if (p === 4 && st === 1) S.saw = { dog: false, fox: false };
    renderLearn();
  }
  function go(dir) {
    if (S.spin.busy) return;
    const n = PARTS[S.part].steps.length;
    if (dir > 0) {
      if (S.step < n - 1) S.step++;
      else if (S.part < 4) { S.seen[S.part] = true; S.part++; S.step = 0; }
      else return;
    } else {
      if (S.step > 0) S.step--;
      else if (S.part > 0) { S.part--; S.step = PARTS[S.part].steps.length - 1; }
      else return;
    }
    if (S.part === 4 && S.step === 4) S.seen[4] = true;
    enterStep();
  }

  // Spinner animation: the needle turns 2 to 3 times and stops inside the picked wedge.
  function spinTo(rows, cb, ms = 1300) {
    const i = pickW(rows.map(r => r.n)), target = angleIn(rows, i);
    const start = S.spin.deg, base = start - (start % 360);
    const end = base + 360 * (2 + rnd(2)) + target;
    S.spin.busy = true; S.spin.hi = null;
    const t0 = performance.now();
    (function frame(t) {
      const k = Math.min(1, (t - t0) / ms), e = 1 - (1 - k) ** 3;
      S.spin.deg = start + (end - start) * e;
      const nd = $("needle");
      if (nd) nd.setAttribute("transform", `rotate(${S.spin.deg} ${SP.cx} ${SP.cy})`);
      if (k < 1) requestAnimationFrame(frame);
      else { S.spin.deg = end % 360; S.spin.busy = false; S.spin.hi = i; cb(i); }
    })(t0);
  }
  function doSpin(then) {
    const sp = S.spin;
    if (sp.busy) return;
    if (S.step === 0) {
      sp.words = [];
      drawLearn();
      spinTo(SLOTS[2].rows, i => { sp.words = [null, null, i]; sp.words.length = 3; renderLearn(); then && then(); });
      return;
    }
    if (sp.words.length === 3) { sp.words = []; sp.hi = null; renderLearn(); if (!then) return; }
    const slot = sp.words.length;
    spinTo(SLOTS[slot].rows, i => {
      sp.words.push(i);
      if (sp.words.length === 3) sp.hist.push(`My ${SLOTS[0].rows[sp.words[0]].w} ${SLOTS[1].rows[sp.words[1]].w} a slice of ${SLOTS[2].rows[sp.words[2]].w}.`);
      renderLearn();
      then && then();
    }, then ? 650 : 1300);
  }
  function spinWhole() {
    const sp = S.spin;
    if (sp.busy) return;
    sp.words = []; sp.hi = null; renderLearn();
    const next = () => { if (sp.words.length < 3) setTimeout(() => doSpin(next), 150); };
    doSpin(next);
  }

  $("learnCard").addEventListener("click", e => {
    const pb = e.target.closest("[data-part]");
    if (pb && !S.spin.busy) { S.seen[S.part] = S.seen[S.part] || S.step === PARTS[S.part].steps.length - 1; S.part = +pb.dataset.part; S.step = 0; enterStep(); return; }
    const cb = e.target.closest("[data-clue]");
    if (cb && S.step < 2) {
      const k = cb.dataset.clue; S.clue[k] = !S.clue[k];
      const c = chances(S.clue), top = c.p.indexOf(Math.max(...c.p));
      if (S.step === 1) { if (top === 1) S.saw.dog = true; if (top === 2) S.saw.fox = true; }
      renderLearn(); return;
    }
    const a = e.target.closest("[data-act]");
    if (!a) return;
    const act = a.dataset.act;
    if (act === "count1") S.counted = Math.min(10, S.counted + 1);
    if (act === "countAll") S.counted = 10;
    if (act === "count0") S.counted = 0;
    if (act === "spin") return doSpin();
    if (act === "spin3") return spinWhole();
    if (act.startsWith("dial") && act.length === 5) { S.dial = +act[4]; S.picks = []; }
    if (act === "pick10") S.picks = Array.from({ length: 10 }, () => pickW(dialChances(DIAL, S.dial)));
    if (act === "unfair") S.who = UNFAIR.slice();
    if (act === "fair") S.who = FAIR.slice();
    if (act === "reveal") { S.step = 3; }
    renderLearn();
  });
  $("back").addEventListener("click", () => go(-1));
  $("next").addEventListener("click", () => go(1));
  function flipPron(g) {
    if (S.mode !== "learn" || S.part !== 3 || S.step < 3) return;
    const i = +g.dataset.i; S.who[i] = S.who[i] === "M" ? "W" : "M";
    renderLearn();
    const ng = svg.querySelector(`[data-i="${i}"]`); if (ng) ng.focus();
  }
  svg.addEventListener("click", e => { const g = e.target.closest(".pron"); if (g) flipPron(g); });
  svg.addEventListener("keydown", e => { const g = e.target.closest(".pron"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); flipPron(g); } });
  document.addEventListener("keydown", e => {
    if (S.mode !== "learn" || e.target.closest("input, .pron")) return;
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
  });

  // ---------- Practice ----------
  const CTX = [
    { lead: "a slice of", words: ["pizza", "cake", "bread", "cheese"] },
    { lead: "I like to play", words: ["soccer", "hockey", "chess", "tag"] },
    { lead: "My pet is a", words: ["dog", "cat", "fish", "bird"] },
    { lead: "Today it is", words: ["sunny", "rainy", "cold", "windy"] }];
  const BIAS = ["The pilot said", "The nurse said", "The coach said", "The engineer said", "The chef said"];
  const DIALS = [
    { lead: "a slice of ___", rows: DIAL },
    { lead: "I like to play ___", rows: [["soccer", 40], ["hockey", 25], ["chess", 15], ["tag", 10], ["piano", 6], ["dragons", 3], ["broccoli", 1]].map(([w, n], i) => ({ w, n, col: COLS[i] })) },
    { lead: "My pet is a ___", rows: [["dog", 40], ["cat", 25], ["fish", 15], ["hamster", 10], ["bird", 6], ["snake", 3], ["dinosaur", 1]].map(([w, n], i) => ({ w, n, col: COLS[i] })) }];
  const SPLITS = [[5, 3, 2], [6, 3, 1], [4, 4, 2], [7, 2, 1], [5, 4, 1], [6, 2, 2], [4, 3, 3]];
  const Q = { q: null, done: false, right: 0, tried: 0, last: "" };

  function counts(k, lo, hi) {
    for (;;) { const a = Array.from({ length: k }, () => lo + rnd(hi - lo + 1)); const m = Math.max(...a); if (a.filter(x => x === m).length === 1) return a; }
  }
  function makeQ() {
    const types = ["frac", "most", "spin", "dial", "bias", "pic"].filter(t => t !== Q.last);
    const t = types[rnd(types.length)]; Q.last = t;
    if (t === "frac" || t === "most") {
      const c = CTX[rnd(CTX.length)], k = 3 + rnd(2), ns = counts(k, 1, 7);
      const rows = c.words.slice(0, k).map((w, i) => ({ w, n: ns[i], col: COLS[[0, 2, 1, 3][i]] }));
      const total = ns.reduce((a, b) => a + b, 0);
      if (t === "most") return { t, rows, lead: c.lead, ask: `AI counted the words after <span class="w">“${c.lead}”</span>. Which word will AI most likely pick next?`, kind: "choice", opts: rows.map(r => r.w), ans: rows[ns.indexOf(Math.max(...ns))].w };
      const i = rnd(k);
      return { t, rows, lead: c.lead, ask: `AI counted the words after <span class="w">“${c.lead}”</span>. What is the chance AI picks <span class="w" style="color:${rows[i].col}">${rows[i].w}</span>?`, kind: "frac", n: rows[i].n, d: total, i };
    }
    if (t === "bias") {
      const lead = "Patients in the data", men = 5 + rnd(5), women = 1 + rnd(men - 2);
      const rows = [{ w: "men", col: WHO.M.col, n: men }, { w: "women", col: WHO.W.col, n: women }];
      if (Math.random() < 0.5) return { t, rows, lead, ask: `An AI was trained on these heart attack patients. How many more <span class="w" style="color:${WHO.W.col}">women</span> would make men and women equal?`, kind: "num", ans: men - women, sub: true };
      return { t, rows, lead, ask: `An AI was trained on these heart attack patients. What fraction of the patients are <span class="w" style="color:${WHO.W.col}">women</span>?`, kind: "frac", n: women, d: men + women, i: 1, frac2: true };
    }
    if (t === "spin") {
      const c = CTX[rnd(CTX.length)], sp = shuffle(SPLITS[rnd(SPLITS.length)].slice());
      const rows = c.words.slice(0, 3).map((w, i) => ({ w, n: sp[i], col: COLS[[0, 2, 1][i]] }));
      const times = [10, 20, 30, 50, 100][rnd(5)], i = rnd(3);
      return { t, rows, lead: c.lead, times, i, ask: `AI spins this spinner <b>${times}</b> times. About how many times will it pick <span class="w" style="color:${rows[i].col}">${rows[i].w}</span>?`, kind: "num", ans: rows[i].n * times / 10 };
    }
    if (t === "dial") {
      const d = DIALS[rnd(DIALS.length)], rare = d.rows[6].w, top = d.rows[0].w, v = rnd(3);
      if (v === 0) return { t, d, ask: `The creativity dial is turned down to <b>0 (Safe)</b>. Which word will AI pick?`, kind: "choice", opts: shuffle(d.rows.slice(0, 4).map(r => r.w)), ans: top, why: `At 0, the top word gets all of the chance, so AI always picks ${top}.` };
      if (v === 1) return { t, d, ask: `AI wrote <span class="w">“${d.lead.replace("___", rare)}”</span>. Was the creativity dial probably low or high?`, kind: "choice", opts: ["Low (Safe)", "High (Wild)"], ans: "High (Wild)", why: `${rare} had a tiny counted chance. A high dial makes rare words more likely.` };
      return { t, d, ask: `Which dial setting gives <span class="w" style="color:${d.rows[6].col}">${rare}</span> the biggest chance?`, kind: "choice", opts: ["0 Safe", "1 Normal", "2 Wild"], ans: "2 Wild", why: `The higher the dial, the bigger the chance for rare words like ${rare}.` };
    }
    // picture
    if (Math.random() < 0.4) {
      const a = ANIMALS[2];
      return { t: "pic", f: MYSTERY, sure: true, ask: `AI is 88% sure this photo is a <span class="w" style="color:${a.col}">fox</span>. Is it for sure a fox?`, kind: "choice", opts: ["Yes, 88% is very high", "No, AI can still be wrong"], ans: "No, AI can still be wrong", why: "88% is a chance, not a promise. 12% of the time a guess like this is wrong. This one was a cat!" };
    }
    let f, c;
    do { f = Object.fromEntries(CLUES.map(k => [k.k, Math.random() < 0.5])); c = chances(f); } while (Math.max(...c.p) < 0.6);
    const top = c.p.indexOf(Math.max(...c.p));
    return { t: "pic", f, ask: "Look at the clues in this picture. Which animal will AI guess?", kind: "choice", opts: ANIMALS.map(a => a.w), ans: ANIMALS[top].w, why: `The clues give ${ANIMALS[top].w} the most points, so it gets the biggest chance (${pct(c.p[top])}).` };
  }

  function drawQ() {
    const q = Q.q, show = Q.done;
    let s = "";
    if (q.t === "frac" || q.t === "most" || q.t === "bias") {
      s += `<text class="cap" x="500" y="56" text-anchor="middle">Word after “${q.lead}”</text>`;
      const rowH = q.rows.length === 4 ? 150 : 180;
      s += table(q.rows, { x: 200, y: 90, w: 600, rowH, tally: true, count: show, frac: show && q.kind === "frac", bar: show, hi: show && q.i != null ? q.i : null });
    } else if (q.t === "spin") {
      s += `<text class="prompt" x="500" y="66">${q.lead} ___</text>`;
      s += spinner(500, 380, 270, q.rows, show ? q.i : null);
      s += `<circle cx="500" cy="380" r="14" fill="var(--ink)"/>`;
    } else if (q.t === "dial") {
      s += drawDial(q.d.rows, 1, q.d.lead, { hideDial: true, noBase: true });
      s += `<text class="cap" x="960" y="66" text-anchor="end" style="font-size:24px">counted chances (dial at 1)</text>`;
    } else {
      s += animal(q.f) + `<line x1="585" x2="585" y1="20" y2="680" stroke="var(--grid)" stroke-width="3"/>`;
      s += animalBars(chances(q.f), { hide: !q.sure && !show, real: q.sure && show ? 0 : undefined, wrong: q.sure && show ? 2 : undefined });
      if (q.sure && show) s += `<rect x="140" y="600" width="300" height="70" rx="14" style="fill:${tint("var(--green)", 20)};stroke:var(--green)" stroke-width="4"/><text class="lbl" x="290" y="636" style="fill:var(--green)">Real animal: CAT</text>`;
      if (!q.sure) s += `<text class="cap" x="285" y="620" text-anchor="middle" style="font-size:22px">Clues: ${CLUES.filter(k => q.f[k.k]).map(k => k.name.toLowerCase()).join(", ") || "none"}</text>`;
    }
    svg.innerHTML = s;
  }

  function newQ() {
    Q.q = makeQ(); Q.done = false; Q.counted = false;
    const q = Q.q;
    $("pq").innerHTML = q.ask;
    $("pfb").textContent = ""; $("pfb").className = "fb"; $("pwork").innerHTML = "";
    let h = "";
    if (q.kind === "frac") h = `<div class="ans"><div class="fin"><input id="aN" type="text" inputmode="numeric" autocomplete="off" data-pad aria-label="Top number"><span class="ln"></span><input id="aD" type="text" inputmode="numeric" autocomplete="off" data-pad aria-label="Bottom number"></div></div>`;
    if (q.kind === "num") h = `<div class="ans"><input id="aX" class="wide" type="text" inputmode="numeric" autocomplete="off" data-pad aria-label="Answer"><span class="unit">${q.sub ? "more women" : "times"}</span></div>`;
    if (q.kind === "choice") h = `<div class="choices">${q.opts.map(o => `<button type="button" data-opt="${o}">${o}</button>`).join("")}</div>`;
    $("pans").innerHTML = h;
    $("pcheck").hidden = q.kind === "choice";
    $("pshow").disabled = false;
    drawQ();
    const f = $("pans").querySelector("input"); if (f && matchMedia("(pointer: fine)").matches) f.focus();

  function score(ok) { if (!Q.counted) { Q.counted = true; Q.tried++; if (ok) Q.right++; } $("pright").textContent = Q.right; $("ptried").textContent = Q.tried; }
  function fb(ok, msg) { $("pfb").className = "fb " + (ok ? "ok" : "no"); $("pfb").innerHTML = msg; }
  function workFor(q) {
    if (q.kind === "frac") {
      const g = gcd(q.n, q.d);
      return `<div class="eqs"><span>chance</span><span>=</span><span>${hf(q.n, q.d)}<span class="nm">${q.frac2 ? "women over all patients" : q.rows[q.i].w + " count over all"}</span></span>` +
        (g > 1 ? `<span></span><span>=</span><span>${hf(q.n / g, q.d / g)}<span class="nm">simplify</span></span>` : "") + `</div>`;
    }
    if (q.t === "spin") {
      const r = q.rows[q.i];
      return `<div class="eqs"><span>chance</span><span>=</span><span>${hf(r.n, 10)}</span>
        <span>times</span><span>=</span><span>${hf(r.n, 10)} × ${q.times}<span class="nm">chance × spins</span></span>
        <span></span><span>=</span><span>${hf(r.n * q.times, 10)}</span>
        <span></span><span>=</span><span>${q.ans}</span></div><p class="note">About ${q.ans}. Spins are random, so it could be a little more or less.</p>`;
    }
    if (q.sub) { const he = q.rows[0].n, she = q.rows[1].n; return `<div class="eqs"><span>more women</span><span>=</span><span>${he} − ${she}<span class="nm">men − women</span></span><span></span><span>=</span><span>${q.ans}</span></div>`; }
    return `<p>${q.why || ""}</p>`;
  }
  function finish(showWork) { Q.done = true; drawQ(); if (showWork) $("pwork").innerHTML = workFor(Q.q); }
  function check() {
    const q = Q.q; if (!q || q.kind === "choice") return;
    if (q.kind === "frac") {
      const n = parseInt($("aN").value, 10), d = parseInt($("aD").value, 10);
      if (!n || !d) return fb(false, "Fill in both boxes.");
      if (n * q.d === d * q.n) { score(true); fb(true, `Yes! ${q.n} out of ${q.d}.`); return finish(true); }
      score(false);
      if (n === q.d && d === q.n) return fb(false, "Flip it: the top is the count for that word, the bottom is all the tallies.");
      if (n === q.n) return fb(false, `The top is right. For the bottom, count every tally, not just one row.`);
      return fb(false, "Not yet. Count the tallies in that row, then count all the tallies.");
    }
    const x = parseFloat($("aX").value);
    if (isNaN(x)) return fb(false, "Type a number.");
    if (x === q.ans) { score(true); fb(true, "Yes!"); return finish(true); }
    score(false);
    if (q.t === "spin") fb(false, `Not yet. The chance is ${q.rows[q.i].n} out of 10. What is that part of ${q.times}?`);
    else fb(false, "Not yet. How many more women would match the number of men?");
  }
  function showMe() {
    const q = Q.q; score(false);
    if (q.kind === "frac") { $("aN").value = q.n; $("aD").value = q.d; }
    if (q.kind === "num") $("aX").value = q.ans;
    if (q.kind === "choice") $("pans").querySelectorAll("[data-opt]").forEach(b => b.dataset.opt === q.ans && b.classList.add("right"));
    fb(true, "Here's how:"); finish(true);
  }
  $("pans").addEventListener("click", e => {
    const b = e.target.closest("[data-opt]"); if (!b || Q.done) return;
    const ok = b.dataset.opt === Q.q.ans;
    b.classList.add(ok ? "right" : "wrong");
    if (ok) { score(true); fb(true, "Yes!"); finish(true); }
    else { score(false); fb(false, "Not quite. Try another one, or tap Show me."); }
  });
  $("pans").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  $("pcheck").addEventListener("click", check);
  $("pshow").addEventListener("click", showMe);
  $("pnext").addEventListener("click", newQ);

  // ---------- Mode ----------
  $("modes").addEventListener("click", e => {
    const b = e.target.closest("[data-mode]"); if (!b || S.spin.busy) return;
    S.mode = b.dataset.mode;
    $("modes").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    $("learnCard").hidden = S.mode !== "learn";
    $("pracCard").hidden = S.mode !== "practice";
    if (S.mode === "learn") renderLearn(); else newQ();
  });

  enterStep();
})();
</script>
<script>
/* Keypad: a big on-screen number pad for tablets, shared by the K-6 tools.
   Opt in per box: <input data-pad>            digits only
                   <input data-pad="dec">      digits and a decimal point
                   <input data-pad="neg">      digits and a minus sign
                   <input data-pad="dec neg">  both
   When a box is tapped with a finger or pen, the iPad keyboard stays away and this pad opens beside the box.
   A mouse click still uses the normal keyboard. Each key is sent to the box as a real key press (keydown, then
   input), so the tool's own typing rules still apply; ✓ sends Enter. Boxes made later are picked up too.
   Steppers: <input data-step min="1" max="20"> gets big − and + buttons on its sides (data-step="below": under it).
   They count by 1 inside min and max and send input and change, like typing would. */
(function () {
  const css = `
.kpad { position: fixed; z-index: 1000; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px;
  width: 260px; background: var(--sheet, #fff); border: 3px solid var(--grid-major, #b9c9d8); border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.kpad[hidden] { display: none; }
.kpad button { font-family: var(--font-num, inherit); font-size: 2rem; font-weight: 700; height: 62px; padding: 0; margin: 0;
  border-radius: 12px; border: 2px solid var(--grid-major, #b9c9d8); background: var(--paper, #f5f8fb); color: var(--ink, #1b2733);
  touch-action: manipulation; }
.kpad button:active { background: var(--chip, #eaf0f6); border-color: var(--pt, #2f5fd0); }
.kpad .kp-ok { background: var(--green, #1f7a5a); border-color: var(--green, #1f7a5a); color: var(--sheet, #fff); }
.kpad .kp-x { grid-column: 3; font-size: 1.3rem; height: 40px; }
.kpad .kp-wide { grid-column: span 2; }
.kstep { display: inline-flex; align-items: center; gap: 8px; }
.kstep.below { display: inline-grid; grid-template-columns: 1fr 1fr; }
.kstep.below > input { grid-column: 1 / -1; order: -1; width: auto !important; }
.kstep > button { font-family: var(--font-num, inherit); font-size: 2rem; font-weight: 700; line-height: 1; min-width: 52px; height: 52px; padding: 0;
  border-radius: 12px; border: 2px solid var(--grid-major, #b9c9d8); background: var(--paper, #f5f8fb); color: var(--pt, #2f5fd0); touch-action: manipulation; }
.kstep > button:active { background: var(--chip, #eaf0f6); border-color: var(--pt, #2f5fd0); }`;
  const st = document.createElement("style");
  st.textContent = css;
  document.head.appendChild(st);

  const pad = document.createElement("div");
  pad.className = "kpad"; pad.hidden = true;
  pad.setAttribute("role", "group"); pad.setAttribute("aria-label", "Number keys");
  let box = null, touch = false;

  function key(label, k, cls) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.dataset.k = k;
    if (cls) b.className = cls;
    if (k === "Backspace") b.setAttribute("aria-label", "Delete");
    if (k === "Enter") b.setAttribute("aria-label", "Done");
    if (k === "Close") b.setAttribute("aria-label", "Close keypad");
    return b;
  }
  function draw(kind) {
    const dec = /dec/.test(kind), neg = /neg/.test(kind);
    pad.textContent = "";
    pad.append(key("✕", "Close", "kp-x"));
    for (const n of [7, 8, 9, 4, 5, 6, 1, 2, 3]) pad.append(key(String(n), String(n)));
    // Bottom rows: 0 with the extra keys (. or −) beside it, then delete and ✓.
    const extra = [];
    if (neg) extra.push(key("−", "-"));
    if (dec) extra.push(key(".", "."));
    pad.append(key("0", "0", extra.length ? "" : "kp-wide"));
    if (extra.length === 2) { pad.append(...extra); pad.append(key("⌫", "Backspace")); pad.append(key("✓", "Enter", "kp-ok kp-wide")); }
    else { if (extra.length) pad.append(extra[0]); pad.append(key("⌫", "Backspace")); pad.append(key("✓", "Enter", "kp-ok kp-wide")); pad.lastChild.style.gridColumn = "1 / -1"; }
  }

  // The boxes that go together (hour and minute, top and bottom of a fraction), so the pad covers none of them.
  function area() {
    let p = box.parentElement;
    for (let i = 0; i < 3 && p && p.parentElement; i++) {
      if (p.querySelectorAll("input[data-pad]").length > 1) break;
      p = p.parentElement;
    }
    const els = [...(p ? p.querySelectorAll("input[data-pad]") : [box])].filter(e => e.offsetParent).map(e => e.closest(".kstep") || e);
    const rs = (els.length ? els : [box]).map(e => e.getBoundingClientRect());

    let x, y;
    if (r.right + g + w <= W) { x = r.right + g; y = r.top + r.height / 2 - h / 2; }
    else if (r.left - g - w >= 0) { x = r.left - g - w; y = r.top + r.height / 2 - h / 2; }
    else { x = r.left + r.width / 2 - w / 2; y = r.bottom + g + h <= H ? r.bottom + g : r.top - g - h; }
    pad.style.left = Math.max(4, Math.min(W - w - 4, x)) + "px";
    pad.style.top = Math.max(4, Math.min(H - h - 4, y)) + "px";
  }
  function open(el) {
    if (box !== el || pad.hidden) { box = el; draw(el.dataset.pad || ""); }
    if (!pad.isConnected) document.body.appendChild(pad);
    pad.hidden = false; place();
  }
  function close() { pad.hidden = true; box = null; }

  // A finger or pen tap on a pad box: no iPad keyboard, and the pad opens once the box has focus.
  document.addEventListener("pointerdown", e => {
    if (pad.contains(e.target)) return;
    const el = e.target.closest && e.target.closest("input[data-pad]");
    touch = e.pointerType !== "mouse";
    // Every pad box at once, so a box the tool moves focus to next (like the next digit) also skips the keyboard.
    document.querySelectorAll("input[data-pad]").forEach(b => b.setAttribute("inputmode", touch ? "none" : b.dataset.pad.includes("dec") ? "decimal" : "numeric"));
    if (!el && !pad.hidden) close();
  }, true);
  document.addEventListener("focusin", e => {
    const el = e.target;
    if (el.matches && el.matches("input[data-pad]") && touch && !el.readOnly && !el.disabled) { el.setAttribute("inputmode", "none"); open(el); }
    else if (!pad.contains(el)) close();
  });
  addEventListener("resize", place);
  addEventListener("scroll", place, true);

  // Keys never take focus from the box.
  pad.addEventListener("pointerdown", e => e.preventDefault());
  pad.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || !box) return;
    const k = b.dataset.k;
    if (k === "Close") { close(); return; }
    const el = box;
    const ev = new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true });
    if (el.dispatchEvent(ev)) {
      if (k === "Enter") {
        el.dispatchEvent(new KeyboardEvent("keyup", { key: k, bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
        if (el.form && el.form.requestSubmit) el.form.requestSubmit();
      } else {
        const v = el.value;
        let s = v.length, t = v.length;
        // Keys go at the end, unless the tool has selected the box's text (then they replace it).
        try { if (el.selectionStart != null && el.selectionStart !== el.selectionEnd) { s = el.selectionStart; t = el.selectionEnd; } } catch (_) {}
        let nv, at;
        if (k === "Backspace") { if (s === t) s = Math.max(0, s - 1); nv = v.slice(0, s) + v.slice(t); at = s; }
        else {
          const max = el.maxLength > 0 ? el.maxLength : Infinity;
          if (v.length - (t - s) >= max) return;
          nv = v.slice(0, s) + k + v.slice(t); at = s + 1;
        }
        el.value = nv;
        try { el.setSelectionRange(at, at); } catch (_) {}
        el.dispatchEvent(new InputEvent("input", { bubbles: true, data: k === "Backspace" ? null : k, inputType: k === "Backspace" ? "deleteContentBackward" : "insertText" }));
      }
    }
    // The tool may have moved focus to another box (or away); follow it.
    requestAnimationFrame(() => {
      const a = document.activeElement;
      if (a && a.matches && a.matches("input[data-pad]")) open(a);
      else if (a !== el) close();
      else place();
    });
  });

  // − and + buttons around a number box.
  function stepper(el) {
    const wrap = document.createElement("span");
    wrap.className = "kstep" + (el.dataset.step === "below" ? " below" : "");
    el.replaceWith(wrap);
    const btn = (label, d, name) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label; b.setAttribute("aria-label", name);
      b.addEventListener("click", () => {
        const lo = el.hasAttribute("min") ? +el.getAttribute("min") : -Infinity, hi = el.hasAttribute("max") ? +el.getAttribute("max") : Infinity;
        const v = parseFloat(el.value.replace("−", "-"));
        const nv = isNaN(v) ? Math.max(lo, Math.min(hi, 0)) : Math.max(lo, Math.min(hi, Math.round(v) + d));
        el.value = String(nv);
        el.dispatchEvent(new Event("input", { bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
      });
      return b;
    };
    wrap.append(btn("−", -1, "One less"), el, btn("+", 1, "One more"));
  }
  document.querySelectorAll("input[data-step]").forEach(stepper);
})();

  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
