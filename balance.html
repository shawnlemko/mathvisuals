<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Balancing Equations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Balancing Equations: drag x boxes and 1 weights onto a pan balance, then press Start solving.
   The tool finds the whole number x that balances the scale (kept hidden) and from then on the scale tips by real weight:
   doing an operation to both sides keeps it level, doing it to one side (or dragging a piece on or off) tips it and flashes
   an error. A bar model under the scale shows the same two sides as bars, with removed pieces fading out in red and
   division splitting each bar into equal groups. Boxes blue, weights orange. A red −1 weight is a negative one (Shawn): it pulls
   its pan up by 1, a 1 and a −1 on the same side make a zero pair, and in the bar model it covers the end of the bar it takes
   away from. Errors use the darker warning red.
   A Scale / Algebra tiles switch in the header (Shawn 2026-10-23) swaps the balance for two tile mats: x tiles and 1 tiles in
   the Algebra Tile Builder colours (green positive, red negative), the red ones striped so they print without colour. The bar
   model and steps work the same in both views. x can be any fraction, negative or zero (Shawn: integer solutions); a
   negative x is laid over the end of its bar in the bar model, like the red −1s.
   −x pieces (nx, Shawn 2026-10-23, for −2x = 4) are red striped x boxes / x tiles; x and −x make a zero pair, and
   Divide by can be a negative number, which turns every piece into its opposite. */
:root { --neg: rgb(239,107,107); --neg-ink: #1b2733; } /* same red as negative algebra tiles and integer chips, both themes */
.main { grid-template-columns: minmax(0, 1fr) clamp(220px, 18vw, 290px); }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
.board { padding: 8px; }
.board.err { animation: errflash 0.45s ease-in-out 3; }
@keyframes errflash { 50% { border-color: var(--warn); box-shadow: 0 0 0 5px var(--warn); } }

.eqn { font-family: var(--font-num); font-weight: 700; font-size: 54px; fill: var(--ink); text-anchor: middle; }
.eqn .ne { fill: var(--warn); }
.typed { display: flex; align-items: center; justify-content: center; gap: 10px; height: 100%; }
.typed input { width: 0; flex: 1 1 0; min-width: 0; height: 74px; font-family: var(--font-num); font-weight: 700; font-size: 44px; text-align: center;
  color: var(--ink); background: var(--paper); border: 3px solid var(--grid-major); border-radius: 12px; padding: 0 6px; user-select: text; -webkit-user-select: text; }
.typed input:focus { outline: none; border-color: var(--pt); }
.typed input.bad { border-color: var(--warn); }
.typed input:disabled { background: transparent; border-color: transparent; opacity: 1; -webkit-text-fill-color: var(--ink); }
.typed span { font-family: var(--font-num); font-weight: 700; font-size: 52px; color: var(--ink); }
.typed span.ne { color: var(--warn); }
.msg { font-family: var(--font-body); font-weight: 700; font-size: 28px; text-anchor: middle; }
.msg.bad { fill: var(--warn); } .msg.good { fill: var(--green); } .msg.hint { fill: var(--muted); font-weight: 400; }
.post { fill: var(--muted); }
.beam { fill: var(--ink); }
.beam.tip { fill: var(--warn); }
.plate { fill: var(--muted); }
.stem { stroke: var(--muted); stroke-width: 8; stroke-linecap: round; }
.pivot { fill: var(--sheet); stroke: var(--ink); stroke-width: 4; }
.ground { stroke: var(--grid-major); stroke-width: 4; stroke-linecap: round; }
.xbox rect { fill: #5cbf7a; stroke: var(--ink); stroke-width: 2; }
.xbox.neg rect { fill: url(#pat-tneg); }
.xbox.neg text { fill: #1b2733; font-size: 26px; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
.xbox text { fill: #1b2733; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 34px; text-anchor: middle; dominant-baseline: central; }
.wt circle { fill: #5cbf7a; stroke: var(--ink); stroke-width: 2; }
.wt path { fill: var(--orange); stroke: var(--ink); stroke-width: 2; }
.wt text { fill: #1b2733; font-family: var(--font-num); font-weight: 700; font-size: 17px; text-anchor: middle; dominant-baseline: central; }
.piece { cursor: grab; }
.wt.frac rect { fill: #5cbf7a; stroke: var(--ink); stroke-width: 2; }
.wt.frac text { font-size: 18px; }
.wt.neg circle, .wt.neg path, .wt.neg rect { fill: url(#pat-tneg); }
.wt.neg text { fill: var(--neg-ink); font-size: 13px; letter-spacing: -1px; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
.wt.frac.neg text { font-size: 18px; letter-spacing: 0; }
.piece.enter > * { animation: drop 0.4s ease-out; }
@keyframes drop { from { transform: translateY(-40px); opacity: 0; } }
.piece.leave > *, .seg.leave { animation: leave 1.2s ease-in forwards; }
.optag text { font-family: var(--font-num); font-weight: 700; font-size: 44px; fill: var(--green); text-anchor: middle; paint-order: stroke; stroke: var(--sheet); stroke-width: 6px; }
.optag .tagbar { stroke: var(--green); stroke-width: 5; stroke-linecap: round; }
.cancel { stroke: var(--orange); stroke-width: 4; stroke-linecap: round; }
.fbar { stroke: var(--ink); stroke-width: 3; }
.optag { animation: optag 1.6s ease-out forwards; }
@keyframes optag { 0% { opacity: 0; transform: translateY(12px); } 15%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.piece.leave rect, .piece.leave path, .piece.leave circle, .piece.leave .tl rect, .seg.leave rect, .seg.leave.one rect, .seg.leave.x rect, .seg.leave.nx rect, .seg.leave.neg rect { fill: var(--warn); }
@keyframes leave { 0%, 40% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-36px); } }

.side { font-family: var(--font-body); font-weight: 700; font-size: 24px; fill: var(--muted); text-anchor: end; dominant-baseline: central; }
.seg rect { stroke: var(--ink); stroke-width: 2; }
/* Bars print well in black and white (Shawn): light fills with a pattern, dark text. x = slanted lines, ones = dots, −1s = crosshatch. */
/* Bars use the same fills as the pieces on the left (Shawn): solid for positive pieces, the red stripes for every negative
   piece, so x and −x (and 1 and −1) still look different on a black and white print. */
.seg.x rect, .seg.one rect { fill: #5cbf7a; } /* green positives, as on the scale and the tiles (Shawn) */
.seg.nx rect, .seg.neg rect { fill: url(#pat-tneg); stroke-width: 2.5; }
.seg text { paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
.zero { stroke: var(--ink); stroke-width: 3; }
.seg text { fill: #1b2733; font-family: var(--font-num); font-weight: 700; font-size: 30px; text-anchor: middle; dominant-baseline: central; }
.seg text.small { font-size: 22px; }
.seg.x text, .seg.nx text { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 34px; }
.seg.x text.small, .seg.nx text.small { font-size: 24px; }
.seg line { stroke: rgba(0,0,0,0.35); stroke-width: 1.5; }
.mismatch { stroke: var(--warn); stroke-width: 4; stroke-dasharray: 8 6; }
.divider { stroke: var(--ink); stroke-width: 4; stroke-dasharray: 8 6; }
.mmlbl { fill: var(--warn); font-family: var(--font-body); font-weight: 700; font-size: 22px; }

.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -50%); }
.ops { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg-btns { display: inline-flex; align-self: flex-start; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg-btns button { border: 0; border-radius: 0; background: var(--sheet); font-size: 1.05rem; min-height: 46px; padding: 6px 12px; }
.seg-btns button + button { border-left: 2px solid var(--grid-major); }
.seg-btns button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.seg-btns button.xv { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 1.3rem; }
.amt { display: inline-flex; align-items: center; gap: 6px; }
.amt button { width: 46px; min-height: 46px; font-size: 1.4rem; padding: 0; }
.amt output { font-family: var(--font-num); font-weight: 700; font-size: 2rem; min-width: 2ch; text-align: center; }
.both { background: var(--green); color: #fff; border-color: var(--green); font-size: 1.25rem; min-height: 58px; }
.seg-btns.col { flex-direction: column; align-self: stretch; }
.seg-btns.col button + button { border-left: 0; border-top: 2px solid var(--grid-major); }
.big { min-height: 54px; font-size: 1.2rem; padding: 10px 18px; }
#go { background: var(--green); color: #fff; border-color: var(--green); }
.note { margin: 0; font-weight: 700; font-size: 1.05rem; }
.note:empty { display: none; }
.note.bad { color: var(--warn); } .note.good { color: var(--green); }
.tray-bg { fill: var(--chip); stroke: var(--grid-major); stroke-width: 2; }
.src { cursor: grab; }
.trayl { font-family: var(--font-body); font-weight: 700; font-size: 20px; fill: var(--muted); text-anchor: middle; }
.split { stroke: var(--grid-major); stroke-width: 2; }
.st { font-family: var(--font-num); font-weight: 700; font-size: 32px; fill: var(--ink); }
.st.op { font-size: 24px; fill: var(--green); }
.st.op { font-size: 30px; }
.st.op.bad, .st.ne { fill: var(--warn); }
.st-op.fresh { animation: fresh 0.6s ease-out; }
@keyframes fresh { from { opacity: 0; transform: translateY(-10px); } }
/* View switch in the header */
.viewsw { display: inline-flex; }
.viewsw button { border-radius: 0; font-size: 1.1rem; padding: 10px 18px; min-height: 48px; }
.viewsw button:first-child { border-radius: 10px 0 0 10px; }
.viewsw button:last-child { border-radius: 0 10px 10px 0; }
.viewsw button + button { border-left: 0; }
.viewsw button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
/* Algebra tiles: same colours as the Algebra Tile Builder in both themes; red tiles are striped for black and white printing. */
.mat { fill: var(--sheet); stroke: var(--grid-major); stroke-width: 3; }
.mat.bad { stroke: var(--warn); stroke-width: 5; }
.mateq { font-family: var(--font-num); font-weight: 700; font-size: 56px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.mateq.ne { fill: var(--warn); }
.tl rect { stroke: #1b2733; stroke-width: 2.5; }
.tl.pos rect { fill: #5cbf7a; }
.tl.neg rect { fill: url(#pat-tneg); }
.tl text { fill: #1b2733; font-family: var(--font-num); font-weight: 700; font-size: 18px; letter-spacing: -0.04em; text-anchor: middle; dominant-baseline: central; }
.tl.x text { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 24px; }
.tl.neg text { font-size: 15px; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.tl.frac text { font-size: 15px; }
.tl.neg.x text { font-size: 17px; letter-spacing: -0.08em; }
@media (prefers-reduced-motion: reduce) { .board.err, .piece.enter > *, .piece.leave > *, .seg.leave { animation-duration: 0.01s; } }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Balancing Equations</h1></div>
    <div class="viewsw" id="view" role="group" aria-label="View">
      <button type="button" data-view="scale" aria-pressed="true">Scale</button>
      <button type="button" data-view="tiles" aria-pressed="false">Algebra tiles</button>
    </div>
  </header>

  <div class="main">
    <div class="board" id="board"><svg id="svg" viewBox="0 0 1200 700" role="img" aria-label="Pan balance with pieces to drag, a bar model and the solving steps"></svg></div>
    <div class="panel">
      <section class="card" id="build">
        <div class="row"><button type="button" class="big" id="go">Start solving</button><button type="button" class="big" id="clear">Start over</button></div>
        <p class="note bad" id="buildnote"></p>
      </section>
      <section class="card ops" id="solve" hidden>
        <div class="seg-btns col" id="opk" role="group" aria-label="Operation">
          <button type="button" data-k="sub" aria-pressed="true">Subtract</button>
          <button type="button" data-k="add" aria-pressed="false">Add</button>
          <button type="button" data-k="div" aria-pressed="false">Divide by</button>
        </div>
        <div class="row">
          <span class="amt"><button type="button" id="minus" aria-label="Less">−</button><output id="n">1</output><button type="button" id="plus" aria-label="More">+</button></span>
          <div class="seg-btns" id="what" role="group" aria-label="What">
            <button type="button" data-w="one" aria-pressed="true">ones</button>
            <button type="button" data-w="x" class="xv" aria-pressed="false">x</button>
          </div>
        </div>
        <button type="button" class="both" id="both">Both sides</button>
        <p class="note" id="note"></p>
        <div class="row"><button type="button" id="undo">Undo</button><button type="button" id="restart">Start over</button></div>
      </section>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("svg"), board = $("board");
  const PX = 345, PY = 410, ARM = 200, PLATE = 250, STEM = 16, SPLIT = 680;
  const BOX = 52, WT_W = 30, WT_H = 30, GAP = 4; // 1 and −1 pieces are circles WT_W across
  const BAR_X = 800, BAR_W = 370, BAR_H = 66, BAR_Y = { L: 34, R: 120 }, STEP_Y = 260;
  const MAX_X = 6, MAX_ONE = 24, NOMINAL_X = 4;
  // Algebra tiles view: two mats side by side, an x tile is TX_W by TX_H, a 1 tile TU square.
  const MAT = { L: 22, R: 358 }, MAT_W = 300, MAT_Y = 190, MAT_H = 325, MAT_MID = 340, TU = 28, TX_W = 28, TX_H = 96, TGAP = 4;

  // L and R hold the count of x boxes and the ones on each side. Ones are counted in pieces of size 1/D so dividing
  // can leave fractions (7 split 3 ways = 7/3) while every number stays a whole number. neg counts the red −1 weights the
  // same way. xv = { p, q } is the hidden x = p/q with q > 0 (null while building); x can be any fraction, negative or 0 (Shawn).
  let S = { L: { x: 0, nx: 0, one: 0, neg: 0 }, R: { x: 0, nx: 0, one: 0, neg: 0 }, D: 1 }, xv = null, history = [], steps = [];
  let angle = 0, target = 0, anim = null;
  let fx = null; // pending animation: { leave: {L:{x,one},R:{...}}, enter: {...}, div: {L:n,R:n} }
  let kind = "sub", what = "one", n = 1, view = "scale";

  const el = (tag, attrs, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  const txt = (s, attrs, parent) => { const t = el("text", attrs, parent); t.textContent = s; return t; };
  const clone = o => JSON.parse(JSON.stringify(o));
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const fmtN = v => v < 0 ? "−" + -v : String(v);
  const fracStr = (n, d) => { if (n < 0) return "−" + fracStr(-n, d); const g = gcd(n, d); n /= g; d /= g; return d === 1 ? String(n) : `${n}/${d}`; };
  const weightPath = (x, y) => { // kettlebell-style weight, top-left at x, y
    const w = WT_W, h = WT_H;
    return `M${x + w * 0.3},${y + 9} a${w * 0.2},7 0 0 1 ${w * 0.4},0 L${x + w - 2},${y + h} L${x + 2},${y + h} Z M${x + w * 0.38},${y + 9} a${w * 0.12},4 0 0 0 ${w * 0.24},0`;
  };

  const sideStr = (s, D = S.D) => {
    let out = s.x ? (s.x === 1 ? "" : s.x) + "x" : "";
    if (s.nx) out += (out ? " − " : "−") + (s.nx === 1 ? "" : s.nx) + "x";
    if (s.one || (!s.x && !s.nx && !s.neg)) out += (out ? " + " : "") + fracStr(s.one, D);
    if (s.neg) out += (out ? " − " : "−") + fracStr(s.neg, D);
    return out;
  };
  const weight = s => (s.x - s.nx) * xv.p * S.D + (s.one - s.neg) * xv.q; // weight times q·D, a whole number
  const balanced = () => xv === null || weight(S.L) === weight(S.R);
  const isX = (a, b) => a.x === 1 && !a.nx && !a.one && !a.neg && !b.x && !b.nx && !(b.one && b.neg); // x alone = one number
  const solved = () => xv !== null && balanced() && (isX(S.L, S.R) || isX(S.R, S.L));
  const isEmpty = s => !s.x && !s.nx && !s.one && !s.neg;

  // ---------- Drawing ----------
  let gScale, gScaleBase, gBeam, gPan = {}, gBars, gTop, gSteps, gTray, gTiles, inp = {}, eqSign;
  function layout() {
    svg.innerHTML = "";
    // Typing boxes for each side above the balance (Shawn). Typing builds the pans; dragging rewrites the boxes.
    const fo = el("foreignObject", { x: 10, y: 14, width: SPLIT - 30, height: 84 });
    const row = document.createElement("div"); row.className = "typed"; fo.appendChild(row);
    ["L", "R"].forEach((side, i) => {
      const t = document.createElement("input");
      t.type = "text"; t.autocomplete = "off"; t.spellcheck = false;
      t.setAttribute("aria-label", side === "L" ? "Left side" : "Right side");
      t.addEventListener("input", () => typed(side));
      t.addEventListener("focus", () => t.select());
      t.addEventListener("blur", () => { t.classList.remove("bad"); render(); }); // a box left unreadable goes back to what the pan shows
      inp[side] = t; row.appendChild(t);
      if (!i) { eqSign = document.createElement("span"); eqSign.textContent = "="; row.appendChild(eqSign); }
    });
    gTop = el("g", {});
    el("line", { x1: SPLIT, y1: 20, x2: SPLIT, y2: 680, class: "split" });
    el("line", { x1: SPLIT + 20, y1: STEP_Y - 40, x2: 1180, y2: STEP_Y - 40, class: "split" });
    gScaleBase = el("g", {});
    el("line", { x1: PX - 170, y1: 490, x2: PX + 170, y2: 490, class: "ground" }, gScaleBase);
    el("path", { d: `M${PX},${PY} L${PX - 58},490 L${PX + 58},490 Z`, class: "post" }, gScaleBase);
    gTray = el("g", {});
    gTiles = el("g", {});
    gSteps = el("g", {});
    gScale = el("g", {});
    gBeam = el("g", {}, gScale);
    gPan.L = el("g", {}, gScale);
    gPan.R = el("g", {}, gScale);
    el("circle", { cx: PX, cy: PY, r: 11, class: "pivot" }, gScale);
    // Print-friendly bar fills: a light colour with a pattern, so the parts stay different in black and white.
    const defs = el("defs", {});
    const pat = (id, bg, draw) => {
      const p = el("pattern", { id, width: 14, height: 14, patternUnits: "userSpaceOnUse" }, defs);
      el("rect", { width: 14, height: 14, fill: bg }, p); draw(p);
    };
    pat("pat-x", "#e3ebfb", p => ["M-2,2 L2,-2", "M0,14 L14,0", "M12,16 L16,12"].forEach(d => el("path", { d, stroke: "#2f5fd0", "stroke-width": 2 }, p)));
    pat("pat-one", "#fcebdf", p => el("circle", { cx: 7, cy: 7, r: 2.2, fill: "#c2571a" }, p));
    pat("pat-neg", "#fde2e2", p => ["M0,7 L14,7", "M7,0 L7,14"].forEach(d => el("path", { d, stroke: "#c0392b", "stroke-width": 1.6 }, p)));
    // Red tiles and −1 weights: the algebra tile red with dark stripes, so they still look different from green on a black and white print.
    const sp = el("pattern", { id: "pat-tneg", width: 9, height: 9, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
    el("rect", { width: 9, height: 9, fill: "#ef6b6b" }, sp);
    el("rect", { width: 3.5, height: 9, fill: "#8f2424" }, sp);
    gBars = el("g", {});
  }

  // Tray right under the balance or the mats: drag these onto a side.
  function drawTray() {
    gTray.innerHTML = "";
    el("rect", { x: PX - 150, y: 530, width: 300, height: 140, rx: 14, class: "tray-bg" }, gTray);
    if (view === "tiles") {
      [["x", PX - 132, 538, 1.05], ["nx", PX - 84, 538, 1.05], ["one", PX - 20, 556, 1.5], ["neg", PX + 66, 556, 1.5]].forEach(([type, x, y, k]) => {
        const so = el("g", { class: "src", "data-type": type, transform: `translate(${x},${y}) scale(${k})` }, gTray);
        tileG(so, type);
      });
      txt("Drag onto a side", { x: PX, y: 658, class: "trayl" }, gTray);
      return;
    }
    [["x", PX - 140], ["nx", PX - 66]].forEach(([type, x]) => {
      const sx = el("g", { class: "src", "data-type": type, transform: `translate(${x},${562}) scale(1.08)` }, gTray);
      xBox(sx, type === "nx");
    });
    [["one", PX + 14], ["neg", PX + 86]].forEach(([type, x]) => {
      const so = el("g", { class: "src", "data-type": type, transform: `translate(${x},${566}) scale(1.6)` }, gTray);
      chip(so, type === "neg");
    });
    txt("Drag onto the scale", { x: PX, y: 658, class: "trayl" }, gTray);
  }

  // A 1 (orange) or −1 (red striped) circle for the scale, top-left at 0, 0.
  function chip(parent, neg) {
    const w = el("g", { class: neg ? "wt neg" : "wt" }, parent);
    el("circle", { cx: WT_W / 2, cy: WT_W / 2, r: WT_W / 2 - 1 }, w);
    txt(neg ? "−1" : "1", { x: WT_W / 2, y: WT_W / 2 + 1 }, w);
    return w;
  }

  // An x box for the scale (blue), or a −x box (red striped), top-left at 0, 0.
  function xBox(parent, neg) {
    const b = el("g", { class: "xbox" + (neg ? " neg" : "") }, parent);
    el("rect", { x: 0, y: 0, width: BOX, height: BOX, rx: 5 }, b);
    txt(neg ? "−x" : "x", { x: BOX / 2, y: BOX / 2 }, b);
    return b;
  }

  // One algebra tile with its top-left corner at 0, 0: an x tile (tall), a 1 or a red striped −1. frac is a piece of a 1 left by dividing.
  function tileG(parent, type, frac) {
    const isx = type === "x" || type === "nx", w = frac ? 50 : isx ? TX_W : TU, h = isx ? TX_H : TU;
    const g = el("g", { class: "tl " + (type === "neg" || type === "nx" ? "neg" : "pos") + (isx ? " x" : "") + (frac ? " frac" : "") }, parent);
    el("rect", { x: 0, y: 0, width: w, height: h, rx: 3 }, g);
    txt(frac || { x: "x", nx: "−x", neg: "−1", one: "1" }[type], { x: w / 2, y: h / 2 + 1 }, g);
    return g;
  }

  // Lay tiles on a mat: a row of x tiles, then the 1s, then the −1s under them so zero pairs are easy to see.
  // Positions are from the group's middle (x) and top (y), at tile size 1; rows wrap to fit the mat when drawn k times bigger.
  function placeTiles(s, k) {
    const whole = Math.floor(s.one / S.D), rest = s.one % S.D, wholeN = Math.floor(s.neg / S.D), restN = s.neg % S.D;
    const groups = [
      Array.from({ length: s.x }, (_, i) => ({ t: "x", i, w: TX_W, h: TX_H })).concat(Array.from({ length: s.nx }, (_, i) => ({ t: "nx", i, w: TX_W, h: TX_H }))),
      Array.from({ length: whole }, (_, i) => ({ t: "one", i, w: TU, h: TU })).concat(rest ? [{ t: "frac", i: 0, w: 50, h: TU, label: fracStr(rest, S.D) }] : []),
      Array.from({ length: wholeN }, (_, i) => ({ t: "neg", i, w: TU, h: TU })).concat(restN ? [{ t: "frac", neg: true, i: 0, w: 50, h: TU, label: "−" + fracStr(restN, S.D) }] : [])
    ].filter(gp => gp.length);
    const inner = (MAT_W - 24) / k, items = [];
    let y = 0;
    groups.forEach(gp => {
      const rows = []; let row = [], used = 0;
      gp.forEach(it => { if (row.length && used + it.w > inner) { rows.push(row); row = []; used = 0; } row.push(it); used += it.w + TGAP; });
      rows.push(row);
      rows.forEach(r => {
        let x = -r.reduce((a, it) => a + it.w + TGAP, -TGAP) / 2;
        r.forEach(it => { it.x = x; it.y = y; x += it.w + TGAP; items.push(it); });
        y += Math.max(...r.map(it => it.h)) + TGAP;
      });
      y += 10;
    });
    return { items, h: Math.max(0, y - 10 - TGAP) };
  }

  function drawTiles() {
    gTiles.innerHTML = "";
    if (view !== "tiles") return;
    const bad = !balanced();
    // Tiles are drawn as big as both mats allow (up to 1.6 times), the same size on both sides.
    let k = 1.6;
    while (k > 1 && ["L", "R"].some(side => placeTiles(S[side], k).h * k > MAT_H - 30)) k -= 0.05;
    ["L", "R"].forEach(side => {
      const mx = MAT[side], cx = mx + MAT_W / 2;
      const { items, h } = placeTiles(S[side], k), top = MAT_Y + (MAT_H - h * k) / 2;
      el("rect", { x: mx, y: MAT_Y, width: MAT_W, height: MAT_H, rx: 14, class: "mat" + (bad ? " bad" : "") }, gTiles);
      const s = S[side], enter = fx && fx.enter && fx.enter[side], divN = fx && fx.div && fx.div[side];
      const whole = Math.floor(s.one / S.D), wholeN = Math.floor(s.neg / S.D);
      const leave = divN ? { x: s.x - s.x / divN, nx: s.nx - s.nx / divN, one: whole - Math.floor(whole / divN), neg: wholeN - Math.floor(wholeN / divN) } : fx && fx.leave && fx.leave[side];
      items.forEach(it => {
        const at = `translate(${cx + it.x * k},${top + it.y * k}) scale(${k})`;
        if (it.t === "frac") return tileG(el("g", { transform: at }, gTiles), it.neg ? "neg" : "one", it.label);
        const count = it.t === "x" ? s.x : it.t === "nx" ? s.nx : it.t === "neg" ? wholeN : whole;
        let cls = "piece";
        if (leave && it.i >= count - leave[it.t]) cls += " leave";
        if (enter && it.i >= count - enter[it.t]) cls += " enter";
        tileG(el("g", { class: cls, "data-side": side, "data-type": it.t, transform: at }, gTiles), it.t);
      });
      if (fx && fx.tag && fx.tag[side]) { // the operation pops up over each mat it is done to
        const tg = el("g", { class: "optag" }, gTiles), t = fx.tag[side];
        if (typeof t === "number") {
          el("line", { x1: cx - 34, y1: MAT_Y - 44, x2: cx + 34, y2: MAT_Y - 44, class: "tagbar" }, tg);
          txt(fmtN(t), { x: cx, y: MAT_Y - 4 }, tg);
        } else txt(t, { x: cx, y: MAT_Y - 10 }, tg);
      }
    });
    txt(bad ? "≠" : "=", { x: MAT_MID, y: MAT_Y + MAT_H / 2, class: "mateq" + (bad ? " ne" : "") }, gTiles);
  }

  function drawTop() {
    gTop.innerHTML = "";
    const empty = isEmpty(S.L) && isEmpty(S.R);
    ["L", "R"].forEach(side => {
      const t = inp[side];
      t.disabled = xv !== null; // while solving the boxes just show the equation; changes happen on the scale
      const sd = S[side];
      if (document.activeElement !== t) { t.value = isEmpty(sd) ? "" : sideStr(sd); t.classList.remove("bad"); }
    });
    eqSign.textContent = balanced() ? "=" : "≠"; eqSign.className = balanced() ? "" : "ne";
    if (xv === null) {
      if (inp.L.classList.contains("bad") || inp.R.classList.contains("bad")) txt("Type it like 2x + 3 or x − 4", { x: PX, y: 132, class: "msg bad" }, gTop);
      else if (empty) txt("Type, or drag pieces onto both sides", { x: PX, y: 132, class: "msg hint" }, gTop);
      return;
    }
    if (!balanced()) { txt("Not balanced!", { x: PX, y: 132, class: "msg bad" }, gTop); txt("Do the same thing to both sides.", { x: PX, y: 166, class: "msg bad" }, gTop); }
    else if (solved()) txt(`Balanced! x = ${fracStr(xv.p, xv.q)}`, { x: PX, y: 132, class: "msg good" }, gTop);
  }

  // Read a typed side like "2x + 3", "x+x+5", "x − 4" or "7". Whole numbers only; a number after − becomes red −1 weights
  // (no negative x boxes). null if it can't be read.
  function parseSide(str) {
    str = str.replace(/\s+/g, "").replace(/X/g, "x").replace(/[−–]/g, "-");
    const out = { x: 0, nx: 0, one: 0, neg: 0 };
    if (!str) return out;
    const terms = str.match(/[+-]?[^+-]+/g) || [];
    if (terms.join("") !== str) return null;
    for (const term of terms) {
      const neg = term[0] === "-", t = term.replace(/^[+-]/, "");
      let m;
      if ((m = t.match(/^(\d*)x$/))) out[neg ? "nx" : "x"] += m[1] === "" ? 1 : +m[1];
      else if (/^\d+$/.test(t)) out[neg ? "neg" : "one"] += +t;
      else return null;
    }
    return out.x <= MAX_X && out.nx <= MAX_X && out.one <= MAX_ONE && out.neg <= MAX_ONE ? out : null;
  }
  function typed(side) {
    const t = inp[side], v = parseSide(t.value);
    t.classList.toggle("bad", !v);
    if (v) { S[side] = v; $("buildnote").textContent = ""; }
    render();
  }

  // Lay pieces on a plate: x boxes, then 1s, then −1s, each kind starting its own rows, stacking upward.
  // Lots of pieces are drawn smaller (down to half size) so they never pile into the messages above.
  const PAN_ROOM = 190;
  function placePieces(s) {
    const whole = Math.floor(s.one / S.D), rest = s.one % S.D, wholeN = Math.floor(s.neg / S.D), restN = s.neg % S.D;
    const groups = [
      Array.from({ length: s.x }, (_, i) => ({ t: "x", i, w: BOX, h: BOX })).concat(Array.from({ length: s.nx }, (_, i) => ({ t: "nx", i, w: BOX, h: BOX }))),
      Array.from({ length: whole }, (_, i) => ({ t: "one", i, w: WT_W, h: WT_H })).concat(rest ? [{ t: "frac", i: 0, w: 52, h: 26, label: fracStr(rest, S.D) }] : []),
      Array.from({ length: wholeN }, (_, i) => ({ t: "neg", i, w: WT_W, h: WT_H })).concat(restN ? [{ t: "frac", neg: true, i: 0, w: 60, h: 26, label: "−" + fracStr(restN, S.D) }] : [])
    ].filter(gp => gp.length);
    const lay = k => {
      const inner = (PLATE - 16) / k, items = [];
      let base = 0;
      groups.forEach(gp => {
        const rows = []; let row = [], used = 0;
        gp.forEach(it => { if (row.length && used + it.w > inner) { rows.push(row); row = []; used = 0; } row.push(it); used += it.w + GAP; });
        rows.push(row);
        rows.forEach(r => {
          const w = r.reduce((a, it) => a + it.w + GAP, -GAP), h = Math.max(...r.map(it => it.h));
          let x = -w / 2;
          r.forEach(it => { it.x = x; it.y = base - it.h; x += it.w + GAP; items.push(it); });
          base -= h + GAP;
        });
      });
      return { items, h: -base };
    };
    let k = 1, out = lay(1);
    while (k > 0.5 && out.h * k > PAN_ROOM) { k -= 0.05; out = lay(k); }
    out.items.forEach(it => { it.x *= k; it.y *= k; it.k = k; });
    return out.items;
  }

  function drawPans() {
    ["L", "R"].forEach(side => {
      const g = gPan[side]; g.innerHTML = "";
      el("line", { x1: 0, y1: 0, x2: 0, y2: -STEM, class: "stem" }, g);
      el("rect", { x: -PLATE / 2, y: -STEM - 10, width: PLATE, height: 10, rx: 5, class: "plate" }, g);
      const s = S[side], enter = fx && fx.enter && fx.enter[side], divN = fx && fx.div && fx.div[side];
      const whole = Math.floor(s.one / S.D), wholeN = Math.floor(s.neg / S.D);
      // Dividing keeps one group: 1/n of the boxes and of the weights; the rest lift off.
      const leave = divN ? { x: s.x - s.x / divN, nx: s.nx - s.nx / divN, one: whole - Math.floor(whole / divN), neg: wholeN - Math.floor(wholeN / divN) } : fx && fx.leave && fx.leave[side];
      const items = placePieces(s);
      // The operation (−3, + x, or a bar over 3 for dividing) appears over each pan it is done to while the pieces move.
      if (fx && fx.tag && fx.tag[side]) {
        const top = Math.min(-STEM - 10, ...items.map(it => it.y - STEM - 10));
        const tg = el("g", { class: "optag" }, g);
        const t = fx.tag[side];
        if (typeof t === "number") { // dividing: fraction style, a bar with the number under it (no ÷ sign, per Shawn)
          el("line", { x1: -34, y1: top - 52, x2: 34, y2: top - 52, class: "tagbar" }, tg);
          txt(fmtN(t), { x: 0, y: top - 12 }, tg);
        } else txt(t, { x: 0, y: top - 18 }, tg);
      }
      items.forEach(it => {
        const count = it.t === "x" ? s.x : it.t === "nx" ? s.nx : it.t === "neg" ? wholeN : whole;
        if (it.t === "frac") { // the part of a weight left after dividing; it can't be dragged
          const fg = el("g", { class: "wt frac" + (it.neg ? " neg" : ""), transform: `translate(${it.x},${it.y - STEM - 10}) scale(${it.k})` }, g);
          el("rect", { x: 0, y: 0, width: it.w, height: it.h, rx: 6 }, fg);
          txt(it.label, { x: it.w / 2, y: it.h / 2 + 1 }, fg);
          return;
        }
        let cls = "piece";
        if (leave && it.i >= count - leave[it.t]) cls += " leave";
        if (enter && it.i >= count - enter[it.t]) cls += " enter";
        const pg = el("g", { class: cls, "data-side": side, "data-type": it.t, transform: `translate(${it.x},${it.y - STEM - 10}) scale(${it.k})` }, g);
        if (it.t === "x" || it.t === "nx") xBox(pg, it.t === "nx");
        else {
          chip(pg, it.t === "neg");
        }
      });
    });
  }

  function placeScale() {
    const r = angle * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    // Positive angle: left side down.
    const L = { x: PX - ARM * c, y: PY + ARM * s }, R = { x: PX + ARM * c, y: PY - ARM * s };
    gBeam.innerHTML = "";
    el("rect", { x: PX - ARM - 10, y: PY - 7, width: 2 * ARM + 20, height: 14, rx: 7, class: "beam" + (balanced() ? "" : " tip"), transform: `rotate(${-angle} ${PX} ${PY})` }, gBeam);
    gPan.L.setAttribute("transform", `translate(${L.x},${L.y - 7})`);
    gPan.R.setAttribute("transform", `translate(${R.x},${R.y - 7})`);
  }

  function setTilt() {
    if (xv === null || balanced()) target = 0;
    else { const d = (weight(S.L) - weight(S.R)) / (xv.q * S.D); target = Math.sign(d) * Math.min(12, 5 + Math.abs(d) * 0.6); }
    if (anim) return;
    const stepT = () => {
      const diff = target - angle;
      if (Math.abs(diff) < 0.05) { angle = target; placeScale(); anim = null; return; }
      angle += diff * 0.14; placeScale(); anim = requestAnimationFrame(stepT);
    };
    anim = requestAnimationFrame(stepT);
  }

  // Bar model: each side is a bar of x pieces (length x) and one block of ones (length = count). Red −1s are a red block
  // laid over the end of the bar, covering what they take away, so the uncovered part is the side's value. When a side
  // is below zero the red runs past a zero line drawn to the left.
  function drawBars() {
    gBars.innerHTML = "";
    const D = S.D, shown = fx && fx.before ? [S.L, S.R, fx.before.L, fx.before.R] : [S.L, S.R];
    // While building, x is drawn long enough that red −1s cover at most a third of the x boxes.
    const xl = xv !== null ? xv.p / xv.q : Math.max(NOMINAL_X, ...shown.filter(s => s.x).map(s => 3 * (s.neg / D + s.nx * NOMINAL_X) / s.x));
    // A negative x takes away, so its pieces are laid over the end of the bar like the red −1s.
    const xa = Math.abs(xl), xNeg = xl < 0;
    // x pieces worth more than 0 make the bar longer; the others (−x when x > 0, x when x < 0) cover its end.
    const addT = xNeg ? "nx" : "x", subT = xNeg ? "x" : "nx", lbl = { x: "x", nx: "−x" };
    const pos = s => s[addT] * xa + s.one / D, ng = s => s.neg / D + s[subT] * xa;
    // A side worth less than 0 is mirrored: its negative parts make a bar going left from 0 and its positive parts cover
    // the far end, so the uncovered part still runs from 0 to the side's value.
    const below = s => ng(s) > pos(s) + 1e-9;
    const over = Math.max(0, ...shown.map(s => below(s) ? ng(s) : 0));
    const u = BAR_W / (Math.max(1, ...shown.map(s => below(s) ? 0 : pos(s))) + over), X0 = BAR_X + over * u;
    const ends = {};
    if (over) {
      el("line", { x1: X0, y1: BAR_Y.L - 12, x2: X0, y2: BAR_Y.R + BAR_H + 12, class: "zero" }, gBars);
      txt("0", { x: X0, y: BAR_Y.R + BAR_H + 22, class: "side", "text-anchor": "middle" }, gBars);
    }
    ["L", "R"].forEach(side => {
      const y = BAR_Y[side], s = fx && fx.before ? fx.before[side] : S[side];
      txt(side === "L" ? "Left" : "Right", { x: BAR_X - 14, y: y + BAR_H / 2, class: "side" }, gBars);
      const leave = (fx && fx.leave && fx.leave[side]) || cnt(0, 0);
      const divN = (fx && fx.div && fx.div[side]) || 0;
      // Each group (one, or n when dividing) lists the parts that add (plus) and the parts that take away (minus).
      const groups = [];
      if (divN) for (let gI = 0; gI < divN; gI++) {
        const g = { plus: [], minus: [] };
        for (let i = 0; i < s[addT] / divN; i++) g.plus.push({ t: addT, len: xa, label: lbl[addT], leave: gI > 0 });
        if (s.one) g.plus.push({ t: "one", len: s.one / D / divN, label: fracStr(s.one, D * divN), leave: gI > 0 });
        if (s.neg) g.minus.push({ t: "neg", len: s.neg / D / divN, label: fracStr(s.neg, D * divN), leave: gI > 0 });
        for (let i = 0; i < s[subT] / divN; i++) g.minus.push({ t: subT, len: xa, label: lbl[subT], leave: gI > 0 });
        groups.push(g);
      } else {
        const g = { plus: [], minus: [] };
        for (let i = 0; i < s[addT]; i++) g.plus.push({ t: addT, len: xa, label: lbl[addT], leave: i >= s[addT] - leave[addT] });
        const keep = s.one - leave.one * D;
        if (keep) g.plus.push({ t: "one", len: keep / D, label: fracStr(keep, D) });
        if (leave.one) g.plus.push({ t: "one", len: leave.one, label: String(leave.one), leave: true });
        const keepN = s.neg - leave.neg * D; // red −1s that are leaving sit at the far end
        if (leave.neg) g.minus.push({ t: "neg", len: leave.neg, label: String(leave.neg), leave: true });
        if (keepN) g.minus.push({ t: "neg", len: keepN / D, label: fracStr(keepN, D) });
        for (let i = 0; i < s[subT]; i++) g.minus.push({ t: subT, len: xa, label: lbl[subT], leave: i < leave[subT] });
        groups.push(g);
      }
      const mirror = below(s), segs = [], negs = [], cuts = [];
      let c = 0; // position along the number line, in units
      groups.forEach((g, gI) => {
        if (gI) cuts.push(c);
        const [bar, cov] = mirror ? [g.minus, g.plus] : [g.plus, g.minus];
        if (!mirror) {
          bar.forEach(it => { segs.push({ ...it, at: c }); c += it.len; });
          let e = c; cov.forEach(it => { e -= it.len; negs.push({ ...it, at: e }); });
        } else {
          bar.forEach(it => { c -= it.len; segs.push({ ...it, at: c }); });
          let e = c; cov.forEach(it => { negs.push({ ...it, at: e }); e += it.len; });
        }
      });
      negs.forEach(n => { n.a = X0 + n.at * u; n.b = X0 + (n.at + n.len) * u; });
      const block = (t, x, len, label, gone, isCover) => {
        // A cover sits in the lower part of the bar it covers, so the bar's own labels stay readable in the upper part.
        const w = len * u, ticks = t !== "x" && t !== "nx" && u >= 7, top = isCover ? 30 : 0, bot = isCover ? 4 : 0;
        const g = el("g", { class: "seg " + t + (gone ? " leave" : "") }, gBars);
        el("rect", { x, y: y + top, width: w, height: BAR_H - top - bot }, g);
        if (ticks) for (let k = 1; k < len - 1e-9; k++) el("line", { x1: x + k * u, y1: y + BAR_H - bot - 12, x2: x + k * u, y2: y + BAR_H - bot }, g);
        const covered = !isCover && negs.some(n => n.a < x + w - 0.5 && n.b > x + 0.5);
        const ly = isCover ? y + top + (BAR_H - top - bot) / 2 : covered ? y + 16 : y + BAR_H / 2 - (ticks ? 5 : 0);
        if (w >= 26) txt(t === "neg" ? "−" + label : label, { x: x + w / 2, y: ly, class: isCover || covered ? "small" : "" }, g);
      };
      segs.forEach(sg => block(sg.t, X0 + sg.at * u, sg.len, sg.label, sg.leave));
      negs.forEach(n => block(n.t, n.a, n.len, n.label, n.leave, true));
      cuts.forEach(cx => { // group dividers
        const gx = X0 + cx * u;
        el("line", { x1: gx, y1: y - 8, x2: gx, y2: y + BAR_H + 8, class: "divider" }, gBars);
      });
      ends[side] = X0 + (pos(S[side]) - ng(S[side])) * u;
    });
    if (xv !== null && !balanced() && !fx) {
      const far = Math.max(ends.L, ends.R);
      el("line", { x1: far, y1: BAR_Y.L - 10, x2: far, y2: BAR_Y.R + BAR_H + 10, class: "mismatch" }, gBars);
      const shortSide = ends.L < ends.R ? "L" : "R";
      el("line", { x1: ends[shortSide], y1: BAR_Y[shortSide] + BAR_H / 2, x2: far, y2: BAR_Y[shortSide] + BAR_H / 2, class: "mismatch" }, gBars);
    }
  }

  function render() {
    const tiles = view === "tiles";
    gScale.style.display = gScaleBase.style.display = tiles ? "none" : "";
    board.classList.toggle("tiles", tiles);
    drawTop(); drawPans(); drawTiles(); drawBars(); drawSteps(); placeScale(); setTilt(); panel();
  }

  // Solving steps, right of the balance under the bar model. Only the latest lines that fit are shown.
  function drawSteps() {
    gSteps.innerHTML = "";
    const EQ = SPLIT + 255; // the equals signs line up here; each operation sits under the side it was done to
    const h = st => st.op ? (st.op.div ? 104 : 50) : 46;
    let used = 0, from = steps.length;
    while (from > 0 && used + h(steps[from - 1]) <= 680 - STEP_Y) used += h(steps[--from]);
    let y = STEP_Y;
    steps.slice(from).forEach((st, k) => {
      const last = from + k === steps.length - 2;
      if (st.op && st.op.div) { // both sides written over the divisor, with the matching numbers crossed out
        const g = el("g", { class: "st-op" + (last ? " fresh" : "") }, gSteps);
        fracSide(g, st.op.L, st.op.D, st.op.div, EQ - 28, y + 10, true);
        txt("=", { x: EQ, y: y + 32, class: "st", "text-anchor": "middle" }, g);
        fracSide(g, st.op.R, st.op.D, st.op.div, EQ + 28, y + 10, false);
        el("line", { x1: EQ - 200, y1: y + 72, x2: EQ + 200, y2: y + 72, class: "split" }, g);
        y += 104; return;
      }
      if (st.op) {
        const g = el("g", { class: "st-op" + (last ? " fresh" : "") }, gSteps);
        const cls = "st op" + (st.bad ? " bad" : "");
        if (st.op.L) txt(st.op.L, { x: EQ - 28, y: y - 4, class: cls, "text-anchor": "end" }, g);
        if (st.op.R) txt(st.op.R, { x: EQ + 28, y: y - 4, class: cls }, g);
        el("line", { x1: EQ - 200, y1: y + 8, x2: EQ + 200, y2: y + 8, class: "split" }, g);
        y += 50; return;
      }
      txt(st.eq.l, { x: EQ - 28, y, class: "st", "text-anchor": "end" }, gSteps);
      txt(st.eq.ne ? "≠" : "=", { x: EQ, y, class: "st" + (st.eq.ne ? " ne" : ""), "text-anchor": "middle" }, gSteps);
      txt(st.eq.r, { x: EQ + 28, y, class: "st" }, gSteps);
      y += 46;
    });
  }

  // One side as a fraction over n. A single term like 3x over 3 gets the 3s crossed out to show them cancelling.
  function fracSide(g, side, D, n, x, y, alignRight) {
    const num = txt(sideStr(side, D), { x: 0, y, class: "st", "text-anchor": "middle" }, g);
    const den = txt(fmtN(n), { x: 0, y: y + 46, class: "st", "text-anchor": "middle" }, g);
    const w = Math.max(num.getComputedTextLength(), den.getComputedTextLength()) + 18;
    const cx = alignRight ? x - w / 2 : x + w / 2;
    num.setAttribute("x", cx); den.setAttribute("x", cx);
    el("line", { x1: cx - w / 2, y1: y + 13, x2: cx + w / 2, y2: y + 13, class: "fbar" }, g);
    if ((n > 0 ? side.x === n && !side.nx : side.nx === -n && !side.x) && !side.one && !side.neg) {
      const k = n === -1 ? 1 : fmtN(n).length, a = num.getExtentOfChar(0), b = num.getExtentOfChar(k - 1), d = den.getBBox();
      el("line", { x1: a.x - 2, y1: a.y + a.height - 4, x2: b.x + b.width + 2, y2: a.y + 6, class: "cancel" }, g);
      el("line", { x1: d.x - 2, y1: d.y + d.height - 4, x2: d.x + d.width + 2, y2: d.y + 6, class: "cancel" }, g);
    }
  }

  // ---------- Panel ----------
  function panel() {
    const solving = xv !== null;
    $("build").hidden = solving; $("solve").hidden = !solving;
    $("n").textContent = fmtN(n);
    $("what").hidden = kind === "div";
    document.querySelectorAll("#opk button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === kind));
    document.querySelectorAll("#what button").forEach(b => b.setAttribute("aria-pressed", b.dataset.w === what));
    $("undo").disabled = !history.length;
  }
  const eqStr = () => ({ l: sideStr(S.L), r: sideStr(S.R), ne: !balanced() });
  const note = (t, cls = "bad") => { const p = $("note"); p.textContent = t; p.className = "note " + cls; };

  function flash() { board.classList.remove("err"); void board.offsetWidth; board.classList.add("err"); }

  // Apply a change. `leave`/`enter` say which pieces animate; the state switches once the leaving pieces have faded.
  let busy = false;
  function commit(next, label, opts = {}) {
    if (busy) return;
    if (xv !== null) history.push({ S: clone(S), steps: clone(steps) });
    const finish = () => {
      S = next; fx = opts.enter ? { enter: opts.enter, tag: opts.tag } : null;
      if (xv !== null && label) {
        steps.push({ op: label, bad: !balanced() });
        steps.push({ eq: eqStr() });
        if (!balanced()) flash();
      }
      render(); fx = null; busy = false;
      if (xv !== null) note("");
    };
    if (opts.leave || opts.div) {
      busy = true; fx = { before: clone(S), leave: opts.leave, div: opts.div, tag: opts.tag };
      drawPans(); drawTiles(); drawBars();
      setTimeout(finish, 1300);
    } else finish();
  }

  const cnt = (x, one, neg = 0, nx = 0) => ({ x, nx, one, neg });
  const opOn = (sides, t) => Object.fromEntries(sides.map(s => [s, t]));
  function operate(where) {
    note("");
    const sides = where === "both" ? ["L", "R"] : [where];
    const next = clone(S), names = { L: "left side", R: "right side" };
    const wName = what === "x" ? (n === 1 ? "x" : n + "x") : String(n);
    if (kind === "div") {
      if (n === 0 || n === 1) return note("Pick a number other than 0 or 1 to divide by.");
      const m = Math.abs(n), flip = n < 0; // dividing by a negative also turns every piece into its opposite
      for (const s of sides) {
        if (isEmpty(S[s])) return note(`The ${names[s]} is empty.`);
        if (S[s].x % m || S[s].nx % m) return note(`The x pieces on the ${names[s]} can't split into ${m} equal groups.`);
      }
      // Count the ones in pieces n times smaller, then the divided sides keep their count. Reduce afterwards.
      const div = {};
      next.D = S.D * m;
      ["L", "R"].forEach(s => {
        const c = S[s];
        if (sides.includes(s)) { next[s] = flip ? cnt(c.nx / m, c.neg, c.one, c.x / m) : cnt(c.x / m, c.one, c.neg, c.nx / m); if (m > 1) div[s] = m; }
        else next[s] = cnt(c.x, c.one * m, c.neg * m, c.nx);
      });
      const g = [next.L.one, next.R.one, next.L.neg, next.R.neg].reduce(gcd, next.D);
      next.D /= g; ["L", "R"].forEach(s => { next[s].one /= g; next[s].neg /= g; });
      return commit(next, { div: n, L: clone(S.L), R: clone(S.R), D: S.D }, { div: m > 1 ? div : null, tag: opOn(sides, n) });
    }
    const leave = {}, enter = {}, D = S.D;
    for (const s of sides) {
      if (what === "x") { // x first cancel −x as zero pairs, like the ones
        const c = S[s];
        if ((kind === "add" ? c.x + n - Math.min(n, c.nx) : c.nx + n - Math.min(n, c.x)) > MAX_X) return note(`The ${names[s]} is too full.`);
      } else { // ones first cancel the opposite kind as zero pairs; only what is left over is added
        const ones = Math.floor(S[s].one / D), negs = Math.floor(S[s].neg / D);
        if ((kind === "add" ? ones + n - Math.min(n, negs) : negs + n - Math.min(n, ones)) > MAX_ONE) return note(`The ${names[s]} is too full.`);
      }
    }
    sides.forEach(s => {
      const c = S[s];
      if (what === "x") {
        if (kind === "sub") { const k = Math.min(n, c.x); next[s] = cnt(c.x - k, c.one, c.neg, c.nx + n - k); leave[s] = cnt(k, 0); enter[s] = cnt(0, 0, 0, n - k); }
        else { const k = Math.min(n, c.nx); next[s] = cnt(c.x + n - k, c.one, c.neg, c.nx - k); leave[s] = cnt(0, 0, 0, k); enter[s] = cnt(n - k, 0); }
      } else if (kind === "add") { // adding 1s takes red −1s away in zero pairs first
        const k = Math.min(n, Math.floor(c.neg / D));
        next[s] = cnt(c.x, c.one + (n - k) * D, c.neg - k * D, c.nx); leave[s] = cnt(0, 0, k); enter[s] = cnt(0, n - k);
      } else { // taking away 1s past what is there leaves red −1s
        const k = Math.min(n, Math.floor(c.one / D));
        next[s] = cnt(c.x, c.one - k * D, c.neg + (n - k) * D, c.nx); leave[s] = cnt(0, k); enter[s] = cnt(0, 0, n - k);
      }
    });
    const sign = kind === "sub" ? "−" : "+";
    const tag = opOn(sides, `${sign} ${wName}`);
    const leaving = Object.values(leave).some(c => c.x || c.nx || c.one || c.neg);
    commit(next, tag, { leave: leaving ? leave : null, enter, tag });
  }

  document.querySelectorAll("#opk button").forEach(b => b.onclick = () => { kind = b.dataset.k; if (kind === "div" && n === 1) n = 2; if (kind !== "div" && n < 1) n = Math.max(1, -n); panel(); });
  document.querySelectorAll("#what button").forEach(b => b.onclick = () => { what = b.dataset.w; panel(); });
  // Divide by can go below zero (−1, −2, ...), skipping 0 and 1; the others count from 1.
  $("minus").onclick = () => { n = kind === "div" ? (n === 2 ? -1 : Math.max(-30, n - 1)) : Math.max(1, n - 1); panel(); };
  $("plus").onclick = () => { n = kind === "div" ? (n === -1 ? 2 : Math.min(30, n + 1)) : Math.min(30, n + 1); panel(); };
  $("both").onclick = () => operate("both");
  $("undo").onclick = () => {
    if (busy || !history.length) return;
    const h = history.pop(); S = h.S; steps = h.steps; note(""); render();
  };
  const reset = () => { S = { L: cnt(0, 0), R: cnt(0, 0), D: 1 }; xv = null; history = []; steps = []; $("buildnote").textContent = ""; note(""); render(); };
  $("clear").onclick = reset; $("restart").onclick = reset;

  $("go").onclick = () => {
    const a = (S.L.x - S.L.nx) - (S.R.x - S.R.nx), b = (S.R.one - S.R.neg) - (S.L.one - S.L.neg), bn = $("buildnote");
    if (!S.L.x && !S.R.x && !S.L.nx && !S.R.nx) return bn.textContent = view === "tiles" ? "Put at least one x tile on a side." : "Put at least one x box on the scale.";
    if (isEmpty(S.L) || isEmpty(S.R)) return bn.textContent = "Put something on both sides.";
    if (a === 0) return bn.textContent = b === 0 ? "Both sides are the same. Change one side." : "This scale can never balance. Change one side.";
    let p = b, q = a;
    if (q < 0) { p = -p; q = -q; }
    const g = gcd(p, q);
    xv = { p: p / g, q: q / g }; bn.textContent = ""; steps = [{ eq: eqStr() }]; history = [];
    render();
  };

  // ---------- Dragging ----------
  let drag = null;
  function startDrag(e, type, from) {
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const gh = document.createElement("div"); gh.className = "ghost";
    const scale = svg.getScreenCTM() ? svg.getScreenCTM().a : 1;
    const isx = type === "x" || type === "nx", tw = isx ? TX_W : TU, th = isx ? TX_H : TU;
    gh.innerHTML = view === "tiles"
      ? `<svg width="${(tw + 4) * scale}" height="${(th + 4) * scale}" viewBox="-2 -2 ${tw + 4} ${th + 4}"><g class="tl ${type === "neg" || type === "nx" ? "neg" : "pos"}${isx ? " x" : ""}"><rect x="0" y="0" width="${tw}" height="${th}" rx="3"/><text x="${tw / 2}" y="${th / 2 + 1}">${{ x: "x", nx: "−x", neg: "−1", one: "1" }[type]}</text></g></svg>`
      : type === "nx"
      ? `<svg width="${BOX * scale}" height="${BOX * scale}" viewBox="0 0 ${BOX} ${BOX}"><g class="xbox neg"><rect x="1" y="1" width="${BOX - 2}" height="${BOX - 2}" rx="5"/><text x="${BOX / 2}" y="${BOX / 2}">−x</text></g></svg>`
      : type === "x"
      ? `<svg width="${BOX * scale}" height="${BOX * scale}" viewBox="0 0 ${BOX} ${BOX}"><g class="xbox"><rect x="1" y="1" width="${BOX - 2}" height="${BOX - 2}" rx="5"/><text x="${BOX / 2}" y="${BOX / 2}">x</text></g></svg>`
      : `<svg width="${(WT_W + 2) * scale}" height="${(WT_H + 2) * scale}" viewBox="-1 -1 ${WT_W + 2} ${WT_H + 2}"><g class="wt${type === "neg" ? " neg" : ""}"><circle cx="${WT_W / 2}" cy="${WT_W / 2}" r="${WT_W / 2 - 1}"/><text x="${WT_W / 2}" y="${WT_W / 2 + 1}">${type === "neg" ? "−1" : "1"}</text></g></svg>`;
    document.body.appendChild(gh);
    drag = { type, from, gh, id: e.pointerId };
    moveGhost(e);
  }
  const moveGhost = e => { if (drag) { drag.gh.style.left = e.clientX + "px"; drag.gh.style.top = e.clientY + "px"; } };
  function dropSide(e) {
    const r = svg.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return null;
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    if (p.x > SPLIT || p.y > 520) return null; // off the balance
    return p.x < (view === "tiles" ? MAT_MID : PX) ? "L" : "R";
  }
  addEventListener("pointermove", moveGhost);
  addEventListener("pointerup", e => {
    if (!drag) return;
    const { type, from } = drag; drag.gh.remove(); drag = null;
    const to = dropSide(e);
    if (to === from || busy) return;
    const next = clone(S), names = { L: "left side", R: "right side" };
    const step = type === "x" || type === "nx" ? 1 : S.D;
    if (from && next[from][type] < step) return;
    if (to && next[to][type] / step + 1 > (type === "x" || type === "nx" ? MAX_X : MAX_ONE)) { if (xv !== null) note(`The ${names[to]} is too full.`); else $("buildnote").textContent = `That side is full.`; return; }
    const one = { x: "x", nx: "(−x)", neg: "(−1)", one: "1" }[type];
    const unit = { x: cnt(1, 0), nx: cnt(0, 0, 0, 1), neg: cnt(0, 0, 1), one: cnt(0, 1) }[type];
    if (from && to) { // moved across
      next[from][type] -= step; next[to][type] += step;
      commit(next, { [from]: `− ${one}`, [to]: `+ ${one}` }, { enter: { [to]: unit } });
    } else if (from) {
      next[from][type] -= step;
      commit(next, { [from]: `− ${one}` });
    } else if (to) {
      next[to][type] += step;
      commit(next, { [to]: `+ ${one}` }, { enter: { [to]: unit } });
    }
  });
  addEventListener("pointercancel", () => { if (drag) { drag.gh.remove(); drag = null; } });
  svg.addEventListener("pointerdown", e => {
    const p = e.target.closest(".piece, .src");
    if (p && !busy) startDrag(e, p.dataset.type, p.dataset.side || null);
  });

  document.querySelectorAll("#view button").forEach(b => b.onclick = () => {
    if (busy) return;
    view = b.dataset.view;
    document.querySelectorAll("#view button").forEach(o => o.setAttribute("aria-pressed", o === b));
    drawTray(); render();
  });

  layout();
  drawTray();
  render();
})();
</script>

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
