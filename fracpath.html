<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<title>Fraction and Decimal Pathway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Fraction and Decimal Pathway (Shawn 2026-10-17): four modules in developmental order, each with
   Watch (I do) / Try together (We do) / On my own (You do).
   Colors carry meaning everywhere: indigo = the unit (the fraction itself), amber = sub-partitions and tenths,
   sky = hundredths and the second addend, pink = thousandths, violet = overlap (product), emerald = mastery only. */
:root {
  --paper: #f1f5f9; --sheet: #ffffff; --ink: #0f172a; --muted: #475569; --grid: #e2e8f0; --grid-major: #cbd5e1; --chip: #e8edf3;
  --pt: #4f46e5; --warn: #b91c1c;
  --unit: #4338ca; --unit-fill: #4f46e5; --unit-soft: #c7d2fe;
  --sub: #b45309; --sub-fill: #f59e0b; --sub-soft: #fde68a;
  --hund: #0369a1; --hund-fill: #0ea5e9; --hund-soft: #bae6fd;
  --thou: #be185d; --thou-fill: #ec4899;
  --prod: #6d28d9; --prod-fill: #7c3aed;
  --ok: #047857; --ok-fill: #10b981; --ok-soft: #d1fae5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b1220; --sheet: #111a2e; --ink: #e5e9f0; --muted: #94a3b8; --grid: #1e293b; --grid-major: #334155; --chip: #1a2438;
    --pt: #818cf8; --warn: #f87171;
    --unit: #a5b4fc; --unit-fill: #6366f1; --unit-soft: #312e81;
    --sub: #fbbf24; --sub-fill: #f59e0b; --sub-soft: #5b3a0a;
    --hund: #7dd3fc; --hund-fill: #0ea5e9; --hund-soft: #0c4a6e;
    --thou: #f9a8d4; --thou-fill: #ec4899;
    --prod: #c4b5fd; --prod-fill: #8b5cf6;
    --ok: #34d399; --ok-fill: #10b981; --ok-soft: #064e3b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b1220; --sheet: #111a2e; --ink: #e5e9f0; --muted: #94a3b8; --grid: #1e293b; --grid-major: #334155; --chip: #1a2438;
  --pt: #818cf8; --warn: #f87171;
  --unit: #a5b4fc; --unit-fill: #6366f1; --unit-soft: #312e81;
  --sub: #fbbf24; --sub-fill: #f59e0b; --sub-soft: #5b3a0a;
  --hund: #7dd3fc; --hund-fill: #0ea5e9; --hund-soft: #0c4a6e;
  --thou: #f9a8d4; --thou-fill: #ec4899;
  --prod: #c4b5fd; --prod-fill: #8b5cf6;
  --ok: #34d399; --ok-fill: #10b981; --ok-soft: #064e3b; color-scheme: dark;
}
h1 { font-size: clamp(1.3rem, 2.1vw, 2rem); }
header { margin-bottom: 10px; }
svg.ic, .board svg.ic { display: inline-block; width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.18em; }

/* Module tabs: the top navigation, one module at a time. */
.mods { display: flex; flex-wrap: wrap; gap: 6px; }
.mods button { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 14px 4px 6px; border-radius: 12px;
  border: 2px solid var(--grid-major); background: var(--sheet); text-align: left; line-height: 1.1; }
.mods button .n { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--chip);
  font-family: var(--font-num); font-size: 1.1rem; }
.mods button small { display: block; font-weight: 600; color: var(--muted); font-size: 0.78rem; }
.mods button.on { border-color: var(--pt); background: color-mix(in srgb, var(--pt) 12%, var(--sheet)); }
.mods button.on .n { background: var(--pt); color: var(--sheet); }
.mods button.done .n { background: var(--ok-fill); color: #fff; }

.main { grid-template-columns: minmax(0, 1.75fr) minmax(290px, 1fr); gap: 16px; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }

/* Board: the visual, then the symbols right under it (no split attention), then the controls. */
.board { display: flex; flex-direction: column; gap: 4px; padding: 6px 10px 8px; }
.board > #svg { flex: 1 1 auto; min-height: 0; }
.board.novis > #svg, .board.novis .ctl { display: none; }
.board.novis .sym { flex: 1 1 auto; justify-content: center; border-top: 0; }
.board.novis .row.task { font-size: clamp(2.2rem, 4vw, 3.8rem); }
/* Try together: the live readout shrinks a little so the model keeps its room above the answer row. */
.board:has(.row.task) .row:not(.task) { font-size: clamp(1.25rem, 1.7vw, 1.8rem); }
.board:has(.row.task) .ul { font-size: 1rem; padding: 2px 12px; }
svg text { fill: var(--ink); font-family: var(--font-num); font-weight: 700; }
svg .w { font-family: var(--font-body); }
.halo { paint-order: stroke; stroke: var(--sheet); stroke-width: 6px; stroke-linejoin: round; }
.f-unit { fill: var(--unit-fill); } .f-sub { fill: var(--sub-fill); } .f-hund { fill: var(--hund-fill); } .f-thou { fill: var(--thou-fill); }
.f-prod { fill: var(--prod-fill); } .f-usoft { fill: var(--unit-soft); } .f-ssoft { fill: var(--sub-soft); } .f-sheet { fill: var(--sheet); }
.f-warn { fill: var(--warn); } .f-none { fill: none; } .f-paper { fill: var(--paper); }
svg text.t-unit { fill: var(--unit); } svg text.t-sub { fill: var(--sub); } svg text.t-hund { fill: var(--hund); } svg text.t-thou { fill: var(--thou); }
svg text.t-prod { fill: var(--prod); } svg text.t-muted { fill: var(--muted); } svg text.t-warn { fill: var(--warn); } svg text.t-on { fill: #fff; }
.s-unit { stroke: var(--unit); } .s-sub { stroke: var(--sub-fill); } .s-hund { stroke: var(--hund); } .s-ink { stroke: var(--ink); } .s-muted { stroke: var(--muted); }
.s-grid { stroke: var(--grid-major); } .s-warn { stroke: var(--warn); } .s-sheet { stroke: var(--sheet); } .s-prod { stroke: var(--prod); } .s-on { stroke: #fff; } .s-thou { stroke: var(--thou); }
.hit { cursor: pointer; }

.sym { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 4px 2px; border-top: 1px dashed var(--grid-major); }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.25em 0.45em; font-family: var(--font-num); font-weight: 700;
  font-size: clamp(1.5rem, 2.2vw, 2.3rem); line-height: 1.15; }
.row .op { color: var(--muted); }
.ul { font-family: var(--font-body); font-weight: 700; font-size: clamp(1.05rem, 1.25vw, 1.3rem); background: var(--chip); border-radius: 999px; padding: 4px 16px; text-align: center; }
.fr { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; vertical-align: middle; }
.fr > :first-child { border-bottom: 0.08em solid currentColor; padding: 0 0.14em 0.05em; }
.fr > :last-child { padding: 0.05em 0.14em 0; }
.fi { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-family: var(--font-num); font-weight: 700; font-size: 0.85em; line-height: 1; margin: 0 0.1em; }
.fi > :first-child { border-bottom: 2px solid currentColor; padding: 0 2px 1px; }
.fi > :last-child { padding: 1px 2px 0; }
.mixed { display: inline-flex; align-items: center; gap: 0.08em; }
.c-unit { color: var(--unit); } .c-sub { color: var(--sub); } .c-hund { color: var(--hund); } .c-thou { color: var(--thou); } .c-prod { color: var(--prod); } .c-warn { color: var(--warn); }
.pv { display: inline-flex; align-items: flex-start; }
.pv > span { display: inline-flex; flex-direction: column; align-items: center; padding: 0 0.3em; }
.pv small { font-family: var(--font-body); font-size: 0.32em; color: var(--muted); letter-spacing: 0.02em; }
.flash { animation: flash 1s ease-out; border-radius: 6px; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--sub-fill) 60%, transparent); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }

input.box { font: inherit; width: 2.4ch; text-align: center; border: 3px solid var(--pt); border-radius: 10px; background: var(--paper); color: var(--ink); padding: 0 0.08em; margin: 0.04em 0; }
input.box.wide { width: 4.4ch; }
input.box:disabled { border-style: dashed; border-color: var(--grid-major); background: var(--grid); }
input.box.bad { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--paper)); }
input.box.good { border-color: var(--ok); background: var(--ok-soft); }
.unit-word { font-family: var(--font-body); font-size: 0.5em; color: var(--muted); }
.lockmsg { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-body); font-size: 1rem; color: var(--muted); }
button.go { background: var(--pt); color: var(--sheet); border: 2px solid var(--pt); min-height: 52px; font-size: 1.15rem; padding: 6px 18px; border-radius: 12px; display: inline-flex; align-items: center; gap: 8px; }
button.go:hover { background: var(--sheet); color: var(--pt); }
button:disabled { opacity: 0.45; cursor: default; }
button.choice { font: inherit; font-family: var(--font-num); min-width: 2.6em; min-height: 1.8em; padding: 0.1em 0.5em; border-radius: 14px; border: 3px solid var(--grid-major); background: var(--sheet); }
button.choice:hover { border-color: var(--pt); }
button.choice.bad { border-color: var(--warn); } button.choice.good { border-color: var(--ok); background: var(--ok-soft); }
button.choice.sm { font-family: var(--font-body); font-size: 0.55em; }

.ctl { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 22px; padding: 4px 0 0; }
.grp { display: inline-flex; align-items: center; gap: 8px; }
.gl { font-weight: 700; color: var(--muted); }
.ctl button { min-height: 52px; min-width: 52px; font-size: 1.2rem; border-radius: 12px; border: 2px solid var(--grid-major); background: var(--sheet); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.ctl button.pri { background: var(--unit-fill); color: #fff; border-color: var(--unit-fill); }
.ctl button.amb { border-color: var(--sub-fill); }
.ctl button.sky { border-color: var(--hund-fill); }
.ctl .val { font-family: var(--font-num); font-weight: 700; font-size: 1.45rem; min-width: 2ch; text-align: center; }

/* Coach panel */
.panel { gap: 12px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--grid-major); border-radius: 12px; overflow: hidden; flex: none; }
.seg.op3 { border-radius: 10px; }
.seg button { border: 0; border-radius: 0; background: var(--sheet); min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; font-size: 1.02rem; padding: 4px 6px; }
.seg button + button { border-left: 2px solid var(--grid-major); }
.seg button small { font-weight: 600; color: var(--muted); font-size: 0.74rem; }
.seg button.on { background: var(--pt); color: var(--sheet); }
.seg button.on small { color: inherit; opacity: 0.85; }
.idea { margin: 0; font-size: 1rem; color: var(--muted); }
.idea b { color: var(--ink); }
.coach { display: flex; flex-direction: column; gap: 12px; }
.say { margin: 0; font-size: 1.2rem; line-height: 1.45; }
.stepno { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.think { border-left: 5px solid var(--sub-fill); background: color-mix(in srgb, var(--sub-fill) 10%, var(--sheet)); border-radius: 0 10px 10px 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.think p { margin: 0; font-size: 1.08rem; }
.think .q { font-weight: 700; display: flex; gap: 8px; align-items: flex-start; }
.think button { align-self: flex-start; }
.nav { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.nav button, .bigbtn { min-height: 54px; font-size: 1.15rem; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.checks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 1.08rem; }
.checks li { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.checks li .dot { flex: none; width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; border: 2px solid var(--grid-major); font-weight: 700; font-size: 0.95rem; }
.checks li.now { color: var(--ink); font-weight: 700; }
.checks li.now .dot { border-color: var(--pt); color: var(--pt); }
.checks li.did .dot { background: var(--ok-fill); border-color: var(--ok-fill); color: #fff; }
.hintline { margin: 0; font-size: 1.05rem; color: var(--ink); background: var(--chip); border-radius: 10px; padding: 8px 12px; }
.fb { border-radius: 12px; padding: 10px 14px; font-size: 1.08rem; line-height: 1.45; border: 2px solid var(--grid-major); background: var(--sheet); }
.fb p { margin: 0; } .fb p + p { margin-top: 6px; }
.fb.ok { border-color: var(--ok); background: var(--ok-soft); }
.fb.bad { border-color: var(--warn); }
.fb.trap { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--sheet)); }
.fb .tag { display: inline-block; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--warn); }
.fb.ok .tag { color: var(--ok); }
.mastery { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; color: var(--muted); }
.mastery i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ok); display: inline-block; }
.mastery i.on { background: var(--ok-fill); border-color: var(--ok-fill); }
.mastery b { color: var(--ok); }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; }
.btnrow button { flex: 1 1 auto; }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
      <h1>Fraction and Decimal Pathway</h1></div>
    <nav class="mods" id="mods" aria-label="Modules"></nav>
  </header>
  <div class="main">
    <section class="board" id="board">
      <svg id="svg" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Visual model"></svg>
      <div class="sym" id="sym" aria-live="polite"></div>
      <div class="ctl" id="ctl"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </div>
</div>

<script>
(() => {
  /* ---------- language, numbers, words ---------- */
  const lang = () => { if (window.I18N) return I18N.lang; try { return localStorage.getItem("mv-lang") === "fr" ? "fr" : "en"; } catch (e) { return "en"; } };
  const tx = (en, fr) => (lang() === "fr" ? fr : en);
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  const lcm = (a, b) => a / gcd(a, b) * b;
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const F = v => +(+v).toFixed(2);
  const near = (a, b) => Math.abs(a - b) < 1e-9;
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  const places = (n, d) => { for (let p = 0; p <= 4; p++) if ((n * 10 ** p) % d === 0) return p; return 3; };
  const decStr = (n, d) => (n / d).toFixed(places(n, d));
  const parseNum = s => { s = String(s ?? "").trim().replace(",", "."); return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? Number(s) : NaN; };
  const pickNew = (list, last) => { let p; do p = rnd(list); while (list.length > 1 && JSON.stringify(p) === JSON.stringify(last)); return p; };

  // Unit names: "fourths", "hundredths"; French "quarts", "centièmes".
  const ORD = ["", "", "half", "third", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth", "tenth", "eleventh", "twelfth", "thirteenth",
    "fourteenth", "fifteenth", "sixteenth", "seventeenth", "eighteenth", "nineteenth"];
  const TW = { 20: "twent", 30: "thirt", 40: "fort", 50: "fift", 60: "sixt", 70: "sevent", 80: "eight", 90: "ninet" };
  function ordEn(d) {
    if (d === 100) return "hundredth"; if (d === 1000) return "thousandth"; if (d < 20) return ORD[d];
    if (d > 99) return d + "th";
    const t = Math.floor(d / 10) * 10, o = d % 10;
    return o ? TW[t] + "y-" + (o === 1 ? "first" : o === 2 ? "second" : ORD[o]) : TW[t] + "ieth";
  }
  const CFR = ["", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize", "dix-sept", "dix-huit", "dix-neuf"];
  const TFR = { 20: "vingt", 30: "trente", 40: "quarante", 50: "cinquante", 60: "soixante" };
  function cardFr(n) {
    if (n < 20) return CFR[n]; if (n === 100) return "cent"; if (n === 1000) return "mille";
    if (n < 70) { const t = Math.floor(n / 10) * 10, o = n % 10; return TFR[t] + (o === 0 ? "" : o === 1 ? " et un" : "-" + CFR[o]); }
    if (n < 80) return n === 71 ? "soixante et onze" : "soixante-" + CFR[n - 60];
    if (n < 100) return "quatre-vingt" + (n === 80 ? "" : "-" + CFR[n - 80]);
    return String(n);
  }
  function ordFr(d) {
    if (d === 2) return "demi"; if (d === 3) return "tiers"; if (d === 4) return "quart";
    let c = cardFr(d);
    if (c.endsWith("cinq")) c += "u"; else if (c.endsWith("neuf")) c = c.slice(0, -1) + "v"; else if (c.endsWith("e")) c = c.slice(0, -1);
    return c + "ième";
  }
  function unit(d, n) {
    if (d === 1) return tx(n === 1 ? "whole" : "wholes", Math.abs(n) >= 2 ? "entiers" : "entier");
    if (lang() === "fr") { const w = ordFr(d); return Math.abs(n) >= 2 && !w.endsWith("s") ? w + "s" : w; }
    const w = ordEn(d); return n === 1 ? w : w === "half" ? "halves" : w + "s";
  }
  const uph = (n, d) => `${n} ${unit(d, n)}`;
  const AND = () => tx("and", "et");
  function mixedWords(n, d) {
    const w = Math.floor(n / d), r = n % d;
    if (!w) return uph(r, d);
    return `${w} ${unit(1, w)}` + (r ? ` ${AND()} ${uph(r, d)}` : "");
  }

  /* ---------- HTML and SVG helpers ---------- */
  const IC = {
    lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
    left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>',
    bulb: '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2Z"/>',
    next: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    split: '<path d="M12 3v18"/><path d="M5 3v18"/><path d="M19 3v18"/>'
  };
  const ic = k => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
  const fr = (n, d, cn = "", cd = "") => d === 1 && !cd ? `<span class="${cn}">${n}</span>` : `<span class="fr"><span class="${cn}">${n}</span><span class="${cd || cn}">${d}</span></span>`;
  const fi = (n, d, c = "") => `<span class="fi ${c}"><span>${n}</span><span>${d}</span></span>`;
  const mixedHTML = (w, r, d) => `<span class="mixed">${w}${fr(r, d)}</span>`;

  function txt(x, y, s, o = {}) {
    return `<text x="${F(x)}" y="${F(y)}" text-anchor="${o.a || "middle"}" font-size="${o.s || 22}" class="${o.c || ""}">${s}</text>`;
  }
  // A stacked fraction drawn in the SVG, its bar at height y. col: unit, sub, hund, prod, warn, on (white), "" (ink).
  function sfrac(x, y, n, d, size = 26, col = "") {
    const w = Math.max(String(n).length, String(d).length) * size * 0.62 + 10;
    const tc = col ? "t-" + col : "", sc = col ? "s-" + col : "s-ink";
    return `<g>${txt(x, y - size * 0.2, n, { s: size, c: tc + (col === "on" ? "" : " halo") })}<line x1="${F(x - w / 2)}" x2="${F(x + w / 2)}" y1="${y}" y2="${y}" class="${sc}" stroke-width="${F(size / 10)}"/>${txt(x, y + size * 0.95, d, { s: size, c: tc + (col === "on" ? "" : " halo") })}</g>`;
  }
  // Interval arc from x1 to x2, apex h above the line at y: shows a distance, not a tick count.
  const arc = (x1, x2, y, h, cls, w) => `<path d="M${F(x1)} ${y} Q ${F((x1 + x2) / 2)} ${F(y - 2 * h)} ${F(x2)} ${y}" class="${cls} f-none" stroke-width="${w}" stroke-linecap="round"/>`;
  const line = (x1, y1, x2, y2, cls, w, dash) => `<line x1="${F(x1)}" y1="${F(y1)}" x2="${F(x2)}" y2="${F(y2)}" class="${cls}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`;
  const rect = (x, y, w, h, cls, sw = 0, extra = "") => `<rect x="${F(x)}" y="${F(y)}" width="${F(Math.max(0, w))}" height="${F(h)}" class="${cls}" stroke-width="${sw}" ${extra}/>`;
  const dot = (x, y, cls = "f-unit") => `<circle cx="${F(x)}" cy="${F(y)}" r="12" class="${cls} s-sheet" stroke-width="4"/>`;

  /* ---------- app state ---------- */
  const app = {
    mod: 1, mode: "watch", step: 0, reveal: false,
    prob: null, open: false, vals: {}, marks: {}, fb: null, done: false, err: false, scaffold: false, overlay: null, choice: null,
    streak: {}, last: {}
  };
  let mastered = {};
  try { mastered = JSON.parse(localStorage.getItem("fracpath-mastery") || "{}") || {}; } catch (e) {}
  const saveMastery = () => { try { localStorage.setItem("fracpath-mastery", JSON.stringify(mastered)); } catch (e) {} };
  // Changed numbers glow for a moment so the eye follows the link between the model and the symbols.
  const fl = (key, v) => { const was = app.last[key]; app.last[key] = v; return was !== undefined && was !== v ? " flash" : ""; };

  const S = {
    1: { d: 4, n: 3 },
    2: { n: 3, d: 4, k: 1 },
    3: { v: 75, cmp: null },
    4: { op: "add",
      add: { a: 1, b: 2, c: 1, d: 3, sg: "+", k1: 1, k2: 1, dec: false },
      mult: { a: 2, b: 3, c: 3, d: 4, dec: false },
      div: { D: [3, 2], q: [1, 4], h: 0, dec: true } }
  };

  // Answer boxes. In Try together they stay locked until the model is built.
  const locked = () => app.mode === "guided" && !app.open;
  const box = (k, wide) => `<input class="box${wide ? " wide" : ""}${app.marks[k] ? " " + app.marks[k] : ""}" data-k="${k}" value="${esc(app.vals[k] ?? "")}" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="${tx("answer", "réponse")}"${locked() || app.done ? " disabled" : ""}>`;
  const frBox = (k, den) => `<span class="fr"><span>${box(k)}</span><span>${den}</span></span>`;
  const checkBtn = () => locked()
    ? `<span class="lockmsg">${ic("lock")} ${tx("Build it in the model first", "Construis-le d’abord dans le modèle")}</span>`
    : app.done ? "" : `<button class="go" data-g="check">${ic("check")} ${tx("Check", "Vérifier")}</button>`;
  const choiceBtn = (i, html, sm) => `<button class="choice${sm ? " sm" : ""}${app.choice === i ? (app.done ? " good" : " bad") : ""}" data-choice="${i}"${app.done ? " disabled" : ""}>${html}</button>`;
  const num = k => parseNum(app.vals[k]);
  const res = (ok, msg, bad = [], trap = false) => ({ ok, msg, bad, trap });

  /* ======================================================================
     MODULE 1: Unit iteration and magnitude
     ====================================================================== */
  const X0 = 70, X1 = 930, LW = X1 - X0;
  const D1 = [2, 3, 4, 5, 6, 8, 10, 12];
  const M1 = {
    name: () => tx("Build fractions", "Construire des fractions"), grades: () => tx("Grades 3–4", "3e et 4e année"),
    idea: () => tx("<b>The bottom number names the unit.</b> The top number counts how many units.", "<b>Le dénominateur nomme l’unité.</b> Le numérateur compte les unités."),
    draw() {
      if (app.overlay && app.overlay.type === "unitcmp") return drawUnitCmp(app.overlay);
      const { d, n } = S[1], ww = LW / 3, pw = ww / d, yB = 66, hB = 96, yL = 330, xn = X0 + n * pw;
      let o = "";
      for (let w = 0; w < 3; w++) o += txt(X0 + ww * (w + 0.5), 50, tx("1 whole", "1 entier"), { s: 20, c: "t-muted w" });
      for (let i = 0; i < 3 * d; i++) {
        const x = X0 + i * pw, on = i < n;
        o += rect(x, yB, pw, hB, (on ? "f-unit" : "f-sheet") + " s-unit hit", 2);
        if (on && pw >= 58) o += sfrac(x + pw / 2, yB + hB / 2 + 2, i + 1, d, 24, "on");
        else if (on && pw >= 24) o += txt(x + pw / 2, yB + hB / 2 + 8, i + 1, { s: 20, c: "t-on" });
      }
      for (let w = 0; w < 3; w++) o += rect(X0 + w * ww, yB, ww, hB, "f-none s-ink", 6);
      o += rect(X0 - 20, yB - 6, LW + 40, hB + 12, "f-none hit", 0, 'fill-opacity="0" style="fill:transparent"');
      if (n > 0) o += line(xn, yB + hB, xn, yL, "s-unit", 3, "8 6");
      if (n > 0) o += arc(X0, xn, yL, Math.min(110, 30 + (xn - X0) * 0.14), "s-unit", 5);
      for (let i = 0; i < n; i++) o += arc(X0 + i * pw, X0 + (i + 1) * pw, yL, Math.min(24, pw * 0.3), "s-unit", 2.5);
      o += line(X0 - 16, yL, X1 + 16, yL, "s-ink", 4);
      for (let i = 0; i <= 3 * d; i++) {
        const x = X0 + i * pw, whole = i % d === 0;
        o += line(x, yL - (whole ? 20 : 11), x, yL + (whole ? 20 : 11), "s-ink", whole ? 4 : 2.5);
        if (whole) o += txt(x, yL + 56, i / d, { s: 32 });
      }
      o += rect(X0 - 20, yL - 50, LW + 40, 100, "hit", 0, 'style="fill:transparent"');
      o += dot(xn, yL);
      if (!(app.mode === "solo")) o += sfrac(xn, yL + 112, n, d, 30, "unit");
      return o;
    },
    point(x, y, first) {
      const s = S[1], pw = LW / 3 / s.d; let n;
      if (y < 200) { const i = Math.floor((x - X0) / pw); n = i + 1; if (first && n === s.n) n = i; }
      else n = Math.round((x - X0) / pw);
      n = clamp(n, 0, 3 * s.d);
      if (n === s.n) return false;
      s.n = n; return true;
    },
    controls() {
      const { d } = S[1];
      return `<div class="grp"><span class="gl">${tx("Unit", "Unité")}</span><button data-act="d-" aria-label="${tx("bigger unit", "unité plus grande")}">−</button><span class="val c-unit">${fi(1, d)}</span><button data-act="d+" aria-label="${tx("smaller unit", "unité plus petite")}">+</button></div>
        <div class="grp"><button data-act="n-">− ${fi(1, d)}</button><button class="pri" data-act="n+">+ ${fi(1, d)}</button></div>`;
    },
    act(a) {
      const s = S[1];
      if (a === "d-" || a === "d+") { s.d = D1[clamp(D1.indexOf(s.d) + (a === "d+" ? 1 : -1), 0, D1.length - 1)]; s.n = Math.min(s.n, 3 * s.d); }
      if (a === "n+") s.n = Math.min(3 * s.d, s.n + 1);
      if (a === "n-") s.n = Math.max(0, s.n - 1);
    },
    live() {
      const { n, d } = S[1];
      let h = `<div class="row">${fr(n, d, "c-unit" + fl("1n", n), "c-unit" + fl("1d", d))}<span class="op">=</span><span class="ul">${uph(n, d)}</span>`;
      if (n >= d && n > 0) h += `<span class="op">=</span><span class="ul">${mixedWords(n, d)}</span>`;
      return h + "</div>";
    },
    steps: () => [
      { set: () => Object.assign(S[1], { d: 4, n: 0 }),
        say: tx(`Here is 1 whole cut into 4 equal parts. Each part is 1 fourth, written ${fi(1, 4)}.`, `Voici 1 entier coupé en 4 parties égales. Chaque partie est 1 quart, qui s’écrit ${fi(1, 4)}.`),
        ask: [tx("Why must the parts be equal?", "Pourquoi les parties doivent-elles être égales?"), tx("A fourth is a size. If the parts were different sizes, “1 fourth” would not name one amount.", "Un quart est une grandeur. Si les parties n’étaient pas égales, « 1 quart » ne nommerait pas une seule quantité.")] },
      { set: () => Object.assign(S[1], { d: 4, n: 1 }),
        say: tx("Start at 0. Take one hop of 1 fourth. The arc shows the distance from 0.", "Pars de 0. Fais un bond de 1 quart. L’arc montre la distance depuis 0.") },
      { set: () => Object.assign(S[1], { d: 4, n: 3 }),
        say: tx("Iterate (repeat) the unit: 2 fourths, 3 fourths. The top number counts the units.", "Itère (répète) l’unité : 2 quarts, 3 quarts. Le numérateur compte les unités.") },
      { set: () => Object.assign(S[1], { d: 4, n: 4 }),
        say: tx(`4 fourths fill the whole and land on 1. ${fi(4, 4)} = 1.`, `4 quarts remplissent l’entier et arrivent à 1. ${fi(4, 4)} = 1.`),
        ask: [tx(`Why is ${fi(4, 4)} the same as 1?`, `Pourquoi ${fi(4, 4)} est-il égal à 1?`), tx("4 fourths cover the whole bar and land exactly on 1 on the number line.", "4 quarts couvrent toute la barre et arrivent exactement à 1 sur la droite numérique.")] },
      { set: () => Object.assign(S[1], { d: 4, n: 5 }),
        say: tx("Keep going past 1! 5 fourths = 1 whole and 1 fourth. A fraction can be more than 1.", "Continue après 1! 5 quarts = 1 entier et 1 quart. Une fraction peut être plus grande que 1.") },
      { set: () => Object.assign(S[1], { d: 8, n: 5 }),
        say: tx("Same top number, smaller unit: 5 eighths stops much closer to 0 than 5 fourths.", "Même numérateur, unité plus petite : 5 huitièmes s’arrête beaucoup plus près de 0 que 5 quarts."),
        ask: [tx(`Which is bigger, ${fi(5, 4)} or ${fi(5, 8)}? Why?`, `Lequel est le plus grand, ${fi(5, 4)} ou ${fi(5, 8)}? Pourquoi?`), tx(`${fi(5, 4)}. Fourths are bigger units than eighths, so 5 fourths reach farther from 0.`, `${fi(5, 4)}. Les quarts sont des unités plus grandes que les huitièmes, donc 5 quarts vont plus loin de 0.`)] }
    ],
    // Try together: build the fraction first, then write it as a mixed number (or find what is missing to make 1).
    guided() {
      const p = pickNew([[7, 3], [5, 4], [9, 4], [11, 5], [2, 3], [7, 6], [5, 2], [8, 3], [3, 4], [7, 4], [4, 5], [13, 6]].map(([n, d]) => ({ n, d })), app.prob);
      Object.assign(S[1], { d: rnd(D1.filter(x => x !== p.d && x <= 6)), n: 0 });
      return p;
    },
    gAsk: p => tx(`Build ${fi(p.n, p.d)} on the bar or the number line.`, `Construis ${fi(p.n, p.d)} sur la barre ou la droite numérique.`),
    gDone: p => S[1].d === p.d && S[1].n === p.n,
    gHint(p) {
      const s = S[1];
      if (s.d !== p.d) return tx(`Your unit is ${fi(1, s.d)}. ${fi(p.n, p.d)} counts ${unit(p.d, 2)}: change the unit.`, `Ton unité est ${fi(1, s.d)}. ${fi(p.n, p.d)} compte des ${unit(p.d, 2)} : change l’unité.`);
      if (s.n < p.n) return tx(`${uph(s.n, p.d)} so far. Keep iterating.`, `${uph(s.n, p.d)} jusqu’ici. Continue d’itérer.`);
      return tx(`That is ${uph(s.n, p.d)}. Too far: go back.`, `C’est ${uph(s.n, p.d)}. Trop loin : recule.`);
    },
    task(p) {
      if (p.n > p.d) return `${fr(p.n, p.d, "c-unit")}<span class="op">=</span>${box("w")}<span class="unit-word">${tx("wholes", "entiers")}</span><span class="op">${AND()}</span>${frBox("r", p.d)}`;
      return `${fr(p.n, p.d, "c-unit")}<span class="op">+</span>${frBox("r", p.d)}<span class="op">=</span>1`;
    },
    gCheck(p) {
      const w = Math.floor(p.n / p.d), r = p.n % p.d;
      if (p.n < p.d) {
        const v = num("r");
        return v === p.d - p.n ? res(true, tx(`${uph(p.n, p.d)} + ${uph(p.d - p.n, p.d)} = ${uph(p.d, p.d)} = 1 whole.`, `${uph(p.n, p.d)} + ${uph(p.d - p.n, p.d)} = ${uph(p.d, p.d)} = 1 entier.`))

      if (near(x, I.quot)) return res(true, tx(`${uph(I.DU, I.U)} ÷ ${uph(I.qU, I.U)}`, "").replace(/.*/, "") + tx(`${I.quot} hops of ${p.dec ? decStr(...p.q) : uph(p.q[0], p.q[1])} fit. ${uph(I.DU, I.U)} is ${I.quot} groups of ${uph(I.qU, I.U)}.`, `${I.quot} bonds de ${p.dec ? decStr(...p.q) : uph(p.q[0], p.q[1])} entrent. ${uph(I.DU, I.U)}, c’est ${I.quot} groupes de ${uph(I.qU, I.U)}.`));
      if (near(x, I.D * I.q) || near(x, I.q / I.D)) return res(false, tx("Watch out: the answer counts how many hops fit, so it is bigger than you think. Count the hops on the number line.", "Attention : la réponse compte combien de bonds entrent. Compte les bonds sur la droite numérique."), ["x"], true);
      return res(false, tx(`Put both in the same unit: ${uph(I.DU, I.U)} and ${uph(I.qU, I.U)}. How many groups of ${I.qU} make ${I.DU}?`, `Mets les deux dans la même unité : ${uph(I.DU, I.U)} et ${uph(I.qU, I.U)}. Combien de groupes de ${I.qU} font ${I.DU}?`), ["x"]);
    },
    scaffold(p, trap) {
      if (p.op === "add") { const L = lcm(p.b, p.d); M4.load("add", p, { k1: L / p.b, k2: L / p.d }); if (trap && trap.type) app.overlay = trap; }
      if (p.op === "mult") M4.load("mult", p, { a: p.a, b: p.b, c: p.c, d: p.d });
      if (p.op === "div") M4.load("div", p, { h: 0 });
    }
  };
  // Re-entering a guided add problem: remember the common unit the student chose when it unlocked.
  function drawAdd() {
    const s = S[4].add, ww = 400, yA = 76, hA = 84, yS = 290, U1 = s.b * s.k1, U2 = s.d * s.k2, match = U1 === U2;
    let o = "";
    const bar = (x0, n, d, k, fill) => {
      let g = rect(x0, yA, n / d * ww, hA, fill) + rect(x0 + n / d * ww, yA, ww - n / d * ww, hA, "f-sheet");
      if (k > 1) for (let j = 1; j < d * k; j++) if (j % k) g += line(x0 + j * ww / (d * k), yA, x0 + j * ww / (d * k), yA + hA, "s-sub", d * k > 40 ? 1 : 2.5);
      for (let i = 1; i < d; i++) g += line(x0 + i * ww / d, yA, x0 + i * ww / d, yA + hA, "s-ink", d > 20 ? 1.5 : 3.5);
      return g + rect(x0, yA, ww, hA, "f-none s-ink", 6);
    };
    o += bar(70, s.a, s.b, s.k1, "f-unit") + bar(570, s.c, s.d, s.k2, "f-hund");
    o += txt(520, yA + hA / 2 + 16, s.sg, { s: 48, c: "t-muted" });
    const lab = (x, n, d, k, col) => s.dec ? txt(x, 50, decStr(n, d), { s: 30, c: "t-" + col }) :
      sfrac(x - (k > 1 ? 36 : 0), 38, n, d, 24, col) + (k > 1 ? txt(x, 48, "=", { s: 26, c: "t-muted" }) + sfrac(x + 40, 38, n * k, d * k, 24, "sub") : "");
    o += lab(70 + ww / 2, s.a, s.b, s.k1, "unit") + lab(570 + ww / 2, s.c, s.d, s.k2, "hund");
    // Result bar on the same scale, 2 wholes long.
    o += txt(70, yS - 22, s.sg === "+" ? tx("Together", "Ensemble") : tx("What is left", "Ce qui reste"), { s: 20, a: "start", c: "w t-muted" });
    o += rect(70 + ww, yS, ww, hA, "f-paper s-grid", 2, 'stroke-dasharray="8 6"');
    const A = s.a / s.b, B = s.c / s.d;
    if (match) {
      const U = U1, pw = ww / U, p = s.a * s.k1, q = s.c * s.k2;
      if (s.sg === "+") for (let i = 0; i < p + q; i++) o += rect(70 + i * pw, yS, pw, hA, (i < p ? "f-unit" : "f-hund") + " s-sheet", U > 40 ? 0.6 : 2);
      else for (let i = 0; i < p; i++) o += rect(70 + i * pw, yS, pw, hA, (i < p - q ? "f-unit" : "f-paper") + " s-sheet", U > 40 ? 0.6 : 2) + (i >= p - q ? line(70 + i * pw, yS + hA, 70 + (i + 1) * pw, yS, "s-warn", U > 40 ? 1 : 3) : "");
      const r = s.sg === "+" ? p + q : p - q, xe = 70 + r * pw;
      o += line(xe, yS - 10, xe, yS + hA + 20, "s-ink", 3);
      o += s.dec ? txt(xe, yS + hA + 56, decStr(r, U), { s: 32 }) : sfrac(xe, yS + hA + 56, r, U, 30);
    } else {
      if (s.sg === "+") o += rect(70, yS, A * ww, hA, "f-unit") + rect(70 + A * ww, yS, B * ww, hA, "f-hund");
      else o += rect(70, yS, (A - B) * ww, hA, "f-unit") + rect(70 + (A - B) * ww, yS, B * ww, hA, "f-paper s-warn", 3, 'stroke-dasharray="6 5"');
      const xe = 70 + (s.sg === "+" ? A + B : A - B) * ww;
      o += txt(xe, yS + hA + 60, "?", { s: 52, c: "t-warn" });
      o += txt(xe, yS + hA + 96, tx("What unit?", "Quelle unité?"), { s: 20, c: "w t-warn" });
    }
    o += rect(70, yS, ww, hA, "f-none s-ink", 6);
    if (app.overlay && app.overlay.type === "sumtrap") {
      const n = app.overlay.n ?? (s.a + s.c), m = app.overlay.m ?? (s.b + s.d), xw = 70 + Math.min(n / m, 2) * ww;
      o += line(70, yS - 50, xw, yS - 50, "s-warn", 5) + line(xw, yS - 64, xw, yS + hA + 8, "s-warn", 4, "8 5");
      o += sfrac(xw + 40, yS - 56, n, m, 22, "warn") + txt(xw + 76, yS - 46, "✗", { s: 28, c: "t-warn" });
    }
    return o;
  }
  function drawMult() {
    const s = S[4].mult, sx = 300, sy = 80, ss = 380, cw = ss / s.b, rh = ss / s.d;
    let o = "";
    for (let i = 0; i < s.b; i++) for (let j = 0; j < s.d; j++) {
      const A = i < s.a, C = j < s.c;
      o += rect(sx + i * cw, sy + j * rh, cw, rh, A && C ? "f-prod" : A ? "f-usoft" : C ? "f-ssoft" : "f-sheet");
    }
    for (let i = 1; i < s.b; i++) o += line(sx + i * cw, sy, sx + i * cw, sy + ss, "s-unit", 3);
    for (let j = 1; j < s.d; j++) o += line(sx, sy + j * rh, sx + ss, sy + j * rh, "s-sub", 3);
    o += rect(sx, sy, ss, ss, "f-none s-ink hit", 6);
    o += rect(sx, sy, ss, ss, "hit", 0, 'style="fill:transparent"');
    if (s.a) o += s.dec ? txt(sx + s.a * cw / 2, 56, decStr(s.a, s.b), { s: 28, c: "t-unit" }) : sfrac(sx + s.a * cw / 2, 40, s.a, s.b, 24, "unit");
    if (s.c) o += s.dec ? txt(sx - 50, sy + s.c * rh / 2 + 10, decStr(s.c, s.d), { s: 28, c: "t-sub" }) : sfrac(sx - 44, sy + s.c * rh / 2, s.c, s.d, 24, "sub");
    o += txt(sx + ss / 2, sy + ss + 36, tx("1 whole · tap a square to shade up to it", "1 entier · touche un carré pour colorier jusqu’à lui"), { s: 20, c: "w t-muted" });
    if (s.a && s.c) {
      o += txt(840, 205, tx("overlap", "chevauchement"), { s: 20, c: "w t-muted" });
      o += sfrac(840, 262, s.a * s.c, s.b * s.d, 40, "prod");
      o += txt(840, 360, `${s.b} × ${s.d} = ${s.b * s.d}`, { s: 20, c: "t-muted" });
      o += txt(840, 386, tx("pieces in 1 whole", "morceaux dans 1 entier"), { s: 17, c: "w t-muted" });
    }
    return o;
  }
  function drawDiv() {
    const s = S[4].div, I = divInfo(s), x0 = 70, px = 860 / I.R, yL = 330, xD = x0 + I.D * px;
    let o = "";
    o += rect(x0, 110, I.D * px, 60, "f-unit") + rect(x0, 110, I.D * px, 60, "f-none s-ink", 4);
    o += s.dec ? txt((x0 + xD) / 2, 96, decStr(...s.D), { s: 30, c: "t-unit" }) : sfrac((x0 + xD) / 2, 70, ...s.D, 26, "unit");
    o += line(xD, 170, xD, yL, "s-unit", 3, "8 6");
    o += line(x0 - 16, yL, x0 + 860 + 16, yL, "s-ink", 4);
    const nq = Math.floor(I.R / I.q + 1e-9);
    for (let k = 1; k <= nq; k++) { const x = x0 + k * I.q * px; o += line(x, yL - 10, x, yL + 10, "s-sub", 3); }
    for (let w = 0; w <= I.R; w++) { const x = x0 + w * px; o += line(x, yL - 20, x, yL + 20, "s-ink", 4) + txt(x, yL + 58, w, { s: 32 }); }
    for (let i = 0; i < s.h; i++) {
      const xa = x0 + i * I.q * px, xb = x0 + (i + 1) * I.q * px, over = (i + 1) * I.q > I.D + 1e-9, hh = Math.min(60, (xb - xa) * 0.45 + 14);
      o += arc(xa, xb, yL, hh, over ? "s-warn" : "s-sub", 4);
      o += txt((xa + xb) / 2, yL - hh - 10, i + 1, { s: 22, c: (over ? "t-warn" : "t-sub") + " halo" });
    }
    o += rect(x0 - 20, 230, 900, 160, "hit", 0, 'style="fill:transparent"');
    o += s.dec ? txt(500, 470, `${tx("1 hop", "1 bond")} = ${decStr(...s.q)}`, { s: 22, c: "w t-sub" }) : txt(490, 478, `${tx("1 hop", "1 bond")} =`, { s: 22, a: "end", c: "w t-sub" }) + sfrac(520, 470, ...s.q, 22, "sub");
    return o;
  }

  const MODS = { 1: M1, 2: M2, 3: M3, 4: M4 };
  const cur = () => MODS[app.mod];
  const mkey = () => app.mod === 4 ? "4" + S[4].op : String(app.mod);

  /* ---------- flow ---------- */
  function clearTask() { Object.assign(app, { vals: {}, marks: {}, fb: null, done: false, err: false, scaffold: false, overlay: null, choice: null, open: false }); }
  function setMode(m) {
    app.mode = m; clearTask(); app.prob = null; app.step = 0; app.reveal = false;
    if (m === "watch") applyStep();
    if (m === "guided") app.prob = cur().guided();
    if (m === "solo") app.prob = cur().solo();
  }
  function applyStep() { app.overlay = null; const st = cur().steps()[app.step]; st && st.set(); }
  function newProblem() {
    clearTask();
    app.prob = app.mode === "guided" ? cur().guided() : cur().solo();
  }
  function afterModel() {
    if (app.mode === "guided" && !app.open && app.prob && cur().gDone(app.prob)) {
      app.open = true;
      if (app.prob.op === "add") app.prob.U = S[4].add.b * S[4].add.k1;
    }
  }
  function check() {
    if (app.done) return;
    app.overlay = null;
    const r = app.mode === "guided" ? cur().gCheck(app.prob) : cur().sCheck(app.prob);
    app.marks = {};
    r.bad.forEach(k => (app.marks[k] = "bad"));
    const key = mkey();
    if (r.ok) {
      Object.keys(app.vals).forEach(k => (app.marks[k] = "good"));
      app.done = true;
      app.fb = { kind: "ok", html: r.msg };
      if (app.mode === "solo") {
        app.streak[key] = (app.streak[key] || 0) + 1;
        if (app.streak[key] >= 5 && !mastered[key]) { mastered[key] = true; saveMastery(); app.fb.mastered = true; }
      }
    } else {
      app.err = true;
      if (app.mode === "solo") app.streak[key] = 0;
      app.fb = { kind: r.trap ? "trap" : "bad", html: r.msg };
      if (r.trap) {
        if (app.mode === "solo") { app.scaffold = true; cur().scaffold(app.prob, r.trap); }
        if (typeof r.trap === "object" && r.trap.type) app.overlay = r.trap;
      }
    }
    render();
  }

  /* ---------- rendering ---------- */
  const $mods = document.getElementById("mods"), $board = document.getElementById("board"), $svg = document.getElementById("svg"),
    $sym = document.getElementById("sym"), $ctl = document.getElementById("ctl"), $panel = document.getElementById("panel");

  function renderMods() {
    $mods.innerHTML = [1, 2, 3, 4].map(i => {
      const done = Object.keys(mastered).some(k => k[0] === String(i) && mastered[k]);
      return `<button class="${app.mod === i ? "on" : ""}${done ? " done" : ""}" data-g="mod" data-v="${i}" aria-pressed="${app.mod === i}"><span class="n">${done ? ic("check") : i}</span><span>${MODS[i].name()}<small>${MODS[i].grades()}</small></span></button>`;
    }).join("");
  }

  function renderBoard() {
    const novis = app.mode === "solo" && !app.scaffold;
    $board.classList.toggle("novis", novis);
    if (!novis) $svg.innerHTML = cur().draw();
    let h = "";
    const showLive = app.mode !== "solo" || app.scaffold;
    if (showLive && !(app.overlay && app.mod !== 4)) h += cur().live();
    if (app.mode === "guided") h += `<div class="row task">${cur().task(app.prob)}${checkBtn()}</div>`;
    if (app.mode === "solo") {
      const t = cur().sTask(app.prob), isChoice = t.includes('class="choice');
      h += `<div class="row task">${t}${isChoice ? "" : checkBtn()}</div>`;
    }
    $sym.innerHTML = h;
    const showCtl = !novis && !(app.mode === "solo") && !(app.overlay && app.mod !== 4);
    $ctl.innerHTML = showCtl ? cur().controls() : "";
    $ctl.hidden = !showCtl;
  }

  function renderPanel() {
    const M = cur();
    let h = `<div class="seg" role="group" aria-label="${tx("Mode", "Mode")}">
      ${[["watch", tx("Watch", "Observer"), tx("I do", "Je fais")], ["guided", tx("Try together", "Ensemble"), tx("We do", "Nous faisons")], ["solo", tx("On my own", "Seul"), tx("You do", "Tu fais")]]
        .map(([m, a, b], i) => `<button class="${app.mode === m ? "on" : ""}" data-g="mode" data-v="${m}" aria-pressed="${app.mode === m}">${i + 1}. ${a}<small>${b}</small></button>`).join("")}</div>`;
    if (app.mod === 4) h += `<div class="seg op3" role="group" aria-label="${tx("Operation", "Opération")}">${["add", "mult", "div"].map(op =>
      `<button class="${S[4].op === op ? "on" : ""}" data-g="op" data-v="${op}" aria-pressed="${S[4].op === op}">${opName(op)}${mastered["4" + op] ? `<small>${ic("check")}</small>` : ""}</button>`).join("")}</div>`;
    h += `<p class="idea">${M.idea()}</p><div class="coach card">`;
    if (app.mode === "watch") {
      const steps = M.steps(), st = steps[app.step], last = app.step === steps.length - 1;
      h += `<p class="stepno">${tx("Worked example", "Exemple résolu")} · ${tx("Step", "Étape")} ${app.step + 1} ${tx("of", "sur")} ${steps.length}</p><p class="say">${st.say}</p>`;
      if (st.ask) h += `<div class="think"><p class="q">${ic("bulb")} <span>${st.ask[0]}</span></p>${app.reveal ? `<p>${st.ask[1]}</p>` : `<button data-g="reveal">${tx("Think first, then show an answer", "Réfléchis, puis affiche une réponse")}</button>`}</div>`;
      if (last && !st.ask) h += `<p class="hintline">${tx("Your turn to explore: tap the model or use the buttons under it.", "À toi d’explorer : touche le modèle ou utilise les boutons dessous.")}</p>`;
      h += `<div class="nav"><button data-g="back"${app.step === 0 ? " disabled" : ""}>${ic("left")} ${tx("Back", "Retour")}</button>
        ${last ? `<button class="go" data-g="mode" data-v="guided">${tx("Try one together", "Essayons ensemble")} ${ic("next")}</button>` : `<button class="go" data-g="next">${tx("Next step", "Étape suivante")} ${ic("right")}</button>`}</div>`;
    }
    if (app.mode === "guided") {
      const p = app.prob;
      h += `<p class="say">${M.gAsk(p)}</p><ol class="checks">
        <li class="${app.open ? "did" : "now"}"><span class="dot">${app.open ? ic("check") : 1}</span>${tx("Build it in the model", "Construis-le dans le modèle")}</li>
        <li class="${app.done ? "did" : app.open ? "now" : ""}"><span class="dot">${app.done ? ic("check") : 2}</span>${tx("Write the numbers", "Écris les nombres")}</li></ol>`;
      if (!app.open) h += `<p class="hintline">${M.gHint(p)}</p>`;
    }
    if (app.mode === "solo") {
      const n = Math.min(5, app.streak[mkey()] || 0);
      h += `<p class="say">${M.sAsk(app.prob)}</p>
        <div class="mastery">${[0, 1, 2, 3, 4].map(i => `<i class="${i < n ? "on" : ""}"></i>`).join("")} ${mastered[mkey()] ? `<b>${ic("check")} ${tx("Mastered", "Maîtrisé")}</b>` : tx("5 in a row = mastered", "5 de suite = maîtrisé")}</div>`;
    }
    if (app.fb) {
      const tag = app.fb.kind === "ok" ? tx("Correct", "Bonne réponse") : app.fb.kind === "trap" ? tx("Look at the picture", "Regarde l’image") : tx("Not yet", "Pas encore");
      h += `<div class="fb ${app.fb.kind}"><span class="tag">${tag}</span><p>${app.fb.html}</p>${app.fb.mastered ? `<p><b class="c-ok">${tx("Mastered! 5 in a row.", "Maîtrisé! 5 de suite.")}</b></p>` : ""}</div>`;
    }
    if (app.mode !== "watch") {
      h += `<div class="btnrow">`;
      if (app.mode === "solo" && (app.err || app.scaffold) && !app.done) h += `<button class="bigbtn" data-g="scaffold">${ic("eye")} ${app.scaffold ? tx("Hide visual scaffold", "Masquer le modèle") : tx("Show visual scaffold", "Afficher le modèle")}</button>`;
      h += `<button class="bigbtn${app.done ? " go" : ""}" data-g="new">${app.done ? tx("Next problem", "Problème suivant") + " " + ic("next") : tx("New problem", "Nouveau problème")}</button></div>`;
    }
    h += "</div>";
    if (app.toast) { h += `<p class="hintline">${app.toast}</p>`; app.toast = null; }
    $panel.innerHTML = h;
  }

  function render() { renderMods(); renderBoard(); renderPanel(); }

  /* ---------- events ---------- */
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-g]"), act = e.target.closest("[data-act]"), ch = e.target.closest("[data-choice]");
    if (ch && !app.done) { app.choice = +ch.dataset.choice; check(); return; }
    if (act) {
      if (app.mode === "solo" && !app.scaffold) return;
      cur().act(act.dataset.act); if (app.mode === "watch" && act.dataset.act !== "ex") app.overlay = null; afterModel(); render(); return;
    }
    if (!g) return;
    const k = g.dataset.g, v = g.dataset.v;
    if (k === "mod") { app.mod = +v; setMode(app.mode); }
    if (k === "mode") setMode(v);
    if (k === "op") { S[4].op = v; setMode(app.mode); }
    if (k === "next") { app.step++; app.reveal = false; applyStep(); }
    if (k === "back") { app.step = Math.max(0, app.step - 1); app.reveal = false; applyStep(); }
    if (k === "reveal") app.reveal = true;
    if (k === "check") { check(); return; }
    if (k === "new") newProblem();
    if (k === "scaffold") { app.scaffold = !app.scaffold; if (app.scaffold) cur().scaffold(app.prob, false); else app.overlay = null; }
    render();
  });
  document.addEventListener("input", e => {
    const b = e.target.closest("input.box"); if (!b) return;
    app.vals[b.dataset.k] = b.value;
    document.querySelectorAll(`input.box[data-k="${b.dataset.k}"]`).forEach(o => { if (o !== b) o.value = b.value; o.classList.remove("bad"); });
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.closest("input.box")) { e.preventDefault(); check(); }
  });
  // Tap or drag on the model. Pointer math goes through getScreenCTM so it works at any size.
  let dragging = false;
  const toSvg = e => { const pt = $svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform($svg.getScreenCTM().inverse()); };
  const canTouch = () => app.mode !== "solo" && !(app.overlay && app.mod !== 4) && !(app.mod === 3 && S[3].cmp);
  function onPoint(e, first) {
    if (!canTouch() || !cur().point) return;
    const p = toSvg(e);
    if (cur().point(p.x, p.y, first)) { if (app.mode === "watch") app.overlay = null; afterModel(); render(); }
  }
  $svg.addEventListener("pointerdown", e => { dragging = true; try { $svg.setPointerCapture(e.pointerId); } catch (err) {} onPoint(e, true); });
  $svg.addEventListener("pointermove", e => { if (dragging) onPoint(e, false); });
  ["pointerup", "pointercancel"].forEach(t => $svg.addEventListener(t, () => (dragging = false)));
  window.addEventListener("langchange", render);

  setMode("watch");
  render();
})();
</script>

window.I18N_COMMON = {

<script>
/* French for Fraction and Decimal Pathway (fracpath.html). Almost all text (steps, feedback, unit language) is built in French by the page itself. */
window.I18N_PAGE = {
  "Fraction and Decimal Pathway": "Parcours fractions et décimales",
  "Modules": "Modules",
  "Visual model": "Modèle visuel"
};
</script>
<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
