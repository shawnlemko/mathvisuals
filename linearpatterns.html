<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Patterns to y = mx + b</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Patterns to y = mx + b (grades 5 to 8): four modules from a growing tile pattern to the equation.
   1 Patterns (pattern + table), 2 Tables (table + pattern), 3 Graphs (graph + table), 4 Equation Studio (one source + the equation).
   Each module has Explore (sliders, worked example), Guided Build (concept steps unlock the equation) and Practice.
   Colors carry meaning everywhere: b (start, Step 0, y-intercept) is always amber, m (growth, Δy/Δx, slope) is always indigo.
   Anything tagged k-m or k-b pulses while the student points at m or b in an equation. */
:root { --amber: #b45309; --amber-t: #f59e0b; --amber-bg: #fef3c7; --indigo: #4338ca; --indigo-t: #6366f1; --indigo-bg: #e0e7ff; --blank: #cbd5e1; --ok: #15803d; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --amber: #fbbf24; --amber-t: #f59e0b; --amber-bg: #3b2a0a; --indigo: #a5b4fc; --indigo-t: #818cf8; --indigo-bg: #23214f; --blank: #475569; --ok: #4ade80; }
}
:root[data-theme="dark"] { --amber: #fbbf24; --amber-t: #f59e0b; --amber-bg: #3b2a0a; --indigo: #a5b4fc; --indigo-t: #818cf8; --indigo-bg: #23214f; --blank: #475569; --ok: #4ade80; }
.wrap { max-width: 1500px; }
header { margin-bottom: 8px; }
h1 i, .v { font-style: italic; font-family: var(--font-display); }
.seg { display: inline-flex; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; flex: none; }
.seg button { border: 0; border-radius: 0; background: var(--sheet); font-family: var(--font-display); font-size: 1.05rem; min-height: 44px; padding: 6px 14px; }
.seg button + button { border-left: 2px solid var(--grid-major); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
header .seg button { font-size: 1.15rem; min-height: 48px; padding: 6px 18px; }

/* Module tabs */
.mods { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.mods button { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 1.1rem; min-height: 46px; padding: 6px 16px 6px 8px; background: var(--sheet); border: 2px solid var(--grid-major); border-radius: 12px; }
.mods button .n { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--chip); font-weight: 800; }
.mods button[aria-current="true"] { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
.mods button[aria-current="true"] .n { background: var(--sheet); color: var(--ink); }

/* Work area: one or two representations, then the panel */
.stage { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) minmax(15rem, 20rem) minmax(20rem, 25rem); }
.stage.two { grid-template-columns: minmax(0, 1fr) minmax(21rem, 27rem); }
@media (max-width: 860px) { .stage, .stage.two { grid-template-columns: 1fr; } .board svg { max-height: 70vh; } }
#paneA { position: relative; }
.side { display: flex; flex-direction: column; min-height: 0; }
.side > svg { flex: 1 1 auto; min-height: 0; width: 100%; }
.side h2, .board h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0 0 6px; }
.gbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 2px 2px 8px; flex: none; }
.gbar p { margin: 0; color: var(--muted); font-weight: 700; }
.msg { margin: auto; max-width: 30ch; text-align: center; font-size: 1.3rem; font-weight: 700; color: var(--muted); }

/* Panel */
.panel { gap: 12px; }
.pc { display: flex; flex-direction: column; gap: 12px; }
.slider { grid-template-columns: 6.5rem minmax(0, 1fr) 3rem; }
.slider label { line-height: 1.2; }
.slider.m label, .slider.m output { color: var(--indigo); }
.slider.b label, .slider.b output { color: var(--amber); }
input[type=range].m { accent-color: var(--indigo-t); }
input[type=range].b { accent-color: var(--amber-t); }
.eqbig { text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; line-height: 1.2; padding: 8px; border: 2px solid var(--grid-major); border-radius: 12px; background: var(--sheet); }
.chips { display: flex; justify-content: center; gap: 10px; margin-top: 6px; font-family: var(--font-num); font-size: 1.15rem; }
.chips span { padding: 2px 10px; border-radius: 8px; cursor: default; }
.chips .c-m { background: var(--indigo-bg); } .chips .c-b { background: var(--amber-bg); }
.c-m, .eq-m { color: var(--indigo); font-weight: 800; }
.c-b, .eq-b { color: var(--amber); font-weight: 800; }
[data-hl] { cursor: pointer; border-radius: 6px; }
.eqbig .hint { font-family: var(--font-body); font-weight: 400; }
.callout { background: var(--chip); border-radius: 10px; padding: 12px 14px; font-size: 1.05rem; }
.callout p { margin: 0; }
.callout p + p, .callout p + .calc, .callout .calc + p { margin-top: 8px; }
.calc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--font-num); font-weight: 700; font-size: 1.3rem; }
.frac { vertical-align: middle; }
.lbl { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0; }
.big-btn { font-family: var(--font-display); font-size: 1.2rem; padding: 10px 16px; background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.big-btn:hover { background: var(--sheet); color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.score { margin: 0; font-weight: 700; color: var(--muted); }

/* Equation boxes: y = [m]x + [b] */
.eqin { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font-family: var(--font-display); font-weight: 800; font-size: 2rem; }
.eqin input, .num { width: 3.4em; font-family: var(--font-num); font-weight: 700; font-size: 1.6rem; text-align: center; color: var(--ink); background: var(--sheet); border: 3px solid var(--grid-major); border-radius: 8px; padding: 2px 4px; }
.eqin input.m, .num.m { border-color: var(--indigo-t); color: var(--indigo); }
.eqin input.b, .num.b { border-color: var(--amber-t); color: var(--amber); }
.eqin input.text { width: 9em; font-size: 1.5rem; text-align: left; padding: 4px 10px; }
.ask { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 700; font-size: 1.1rem; }

/* Guided tasks: one open at a time, the rest locked */
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.task { border: 2px solid var(--grid); border-radius: 10px; padding: 8px 12px; }
.task .th { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; }
.task .th .n { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--chip); font-size: 0.95rem; flex: none; }
.task.now { border-color: var(--ink); }
.task.now .th .n { background: var(--ink); color: var(--sheet); }
.task.done .th .n { background: var(--ok); color: var(--sheet); }
.task.lock { opacity: 0.55; }
.task .tb { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.task .tb p { margin: 0; }
.task .sum { margin-left: auto; font-family: var(--font-num); font-size: 1rem; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 52px; height: 48px; font-size: 1.6rem; }
.stepper output { min-width: 2.2em; text-align: center; font-family: var(--font-num); font-weight: 700; font-size: 1.8rem; color: var(--amber); }
.brush button[data-act="brush:b"][aria-pressed="true"] { background: var(--amber-t); color: #1b2733; }
.brush button[data-act="brush:m"][aria-pressed="true"] { background: var(--indigo-t); color: #fff; }

/* Feedback */
.fb:empty { display: none; }
.fb { border-radius: 10px; padding: 10px 12px; border: 2px solid var(--grid-major); font-size: 1.05rem; display: flex; flex-direction: column; gap: 8px; }
.fb p { margin: 0; }
.fb.good { border-color: var(--ok); }
.fb.good > p:first-child { color: var(--ok); font-weight: 800; font-size: 1.2rem; }
.fb.bad { border-color: var(--warn); }
.fb.bad > p:first-child { color: var(--warn); font-weight: 800; }
.zoomcard { position: absolute; top: 12px; right: 12px; z-index: 5; width: min(360px, 70%); max-height: calc(100% - 24px); display: flex; flex-direction: column; gap: 6px; background: var(--sheet); border: 3px solid var(--indigo-t); border-radius: 12px; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); animation: zoomIn 0.6s ease both; transform-origin: top right; }
.zoomcard .zoom { width: 100%; min-height: 0; flex: 1 1 auto; }
.zoomcard .zoom .dot { fill: var(--ink); }
@keyframes zoomIn { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* Table of values: Δx arrows on the left, Δy arrows on the right */
.tv { display: grid; grid-template-columns: 4.8rem minmax(3.5rem, 1fr) minmax(3.5rem, 1fr) 4.8rem; font-family: var(--font-num); font-weight: 700; margin: auto; width: 100%; max-width: 30rem; }
.tv .hd { text-align: center; font-family: var(--font-display); font-size: 1.2rem; padding: 6px 2px; background: var(--chip); border: 2px solid var(--grid-major); }
.tv .hd.y { border-left: 0; }
.tv .hd.d { background: none; border: 0; color: var(--indigo); font-size: 1.1rem; align-self: end; }
.tv .c { text-align: center; font-size: 1.6rem; padding: 6px 2px; border: 2px solid var(--grid-major); border-top: 0; min-height: 3.1rem; display: flex; align-items: center; justify-content: center; background: var(--sheet); }
.tv .c.y { border-left: 0; }
.side .tv .c { font-size: 1.4rem; min-height: 2.7rem; }
.tv .c.zero { background: var(--amber-bg); color: var(--amber); }
.tv .c.q { color: var(--muted); border-style: dashed; }
.tv .c.sel { box-shadow: inset 0 0 0 3px var(--ink); }
.tv .c.tap { cursor: pointer; }
.tv .c.far { border-top: 2px solid var(--grid-major); }
.tv .gap { grid-column: 2 / span 2; text-align: center; color: var(--muted); font-size: 1.3rem; line-height: 1; padding: 2px; }
.tv .c input { width: 3.2em; font: inherit; font-size: 1.3rem; text-align: center; color: var(--amber); background: var(--sheet); border: 3px solid var(--amber-t); border-radius: 6px; }
.arr { position: relative; display: flex; align-items: center; }
.arr .br { position: absolute; top: 25%; bottom: 25%; width: 14px; border: 3px solid var(--indigo-t); }
.arr.l { justify-content: flex-start; padding-left: 2px; }
.arr.l .br { right: 4px; border-right: 0; border-radius: 12px 0 0 12px; }
.arr.r { justify-content: flex-end; padding-right: 2px; }
.arr.r .br { left: 4px; border-left: 0; border-radius: 0 12px 12px 0; }
.arr .br::after { content: ""; position: absolute; bottom: -8px; border: 6px solid transparent; }
.arr.l .br::after { right: -9px; border-left: 9px solid var(--indigo-t); }
.arr.r .br::after { left: -9px; border-right: 9px solid var(--indigo-t); }
.arr .t { position: relative; color: var(--indigo); font-size: 1.15rem; background: var(--paper); border-radius: 6px; padding: 0 2px; }
.arr.l .t { margin-right: 18px; } .arr.r .t { margin-left: 18px; }
.arr input { width: 3em; font: inherit; font-size: 1.1rem; text-align: center; color: var(--indigo); background: var(--sheet); border: 3px solid var(--indigo-t); border-radius: 6px; }
.arr.warn .br { border-color: var(--warn); } .arr.warn .t { color: var(--warn); }

<script>
(function () {
"use strict";
const $ = s => document.querySelector(s);
const MINUS = "−";
const fmt = n => n < 0 ? MINUS + (-n) : String(n);
const sgn = n => n < 0 ? MINUS + (-n) : "+" + n;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const num = v => { const t = String(v ?? "").replace(/[−–]/g, "-").replace(/\s+/g, ""); return /^[+-]?\d+$/.test(t) ? parseInt(t, 10) : NaN; };
const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const pt = (x, y) => `(${fmt(x)}, ${fmt(y)})`;
const Y = (q, x) => q.m * x + q.b;

// Slider defaults for Explore, one set per module. Modules 1 and 2 are tile patterns, so m and b stay positive there.
const EX = { 1: { m: 3, b: 2 }, 2: { m: 3, b: 2, dx: 2 }, 3: { m: 2, b: 1 }, 4: { m: -2, b: 7, src: "pattern" } };
const RANGE = { 1: { m: [1, 5], b: [0, 8] }, 2: { m: [1, 5], b: [0, 8] }, 3: { m: [-4, 5], b: [-5, 8] }, 4: { m: [-4, 5], b: [-5, 8] } };
const S = { mod: 1, mode: "explore", q: null, solved: 0, brush: "b", view: "dots", pair: null, pick: null, scaffold: false, trap: null, sel: null, src4: "mix", fb: null };

/* ---------- Questions ---------- */
// Up to 4 x values (multiples of dx, not 0) whose points fit the −10 to 10 grid, on one side of the y-axis.
function lineRows(m, b, dx) {
  const side = dir => { const r = []; for (let k = 1; k <= 10; k++) { const x = dir * k * dx; if (Math.abs(x) > 10 || Math.abs(m * x + b) > 10) break; r.push(x); } return r; };
  const pos = side(1), neg = side(-1);
  if (pos.length >= 3) return pos.slice(0, 4);
  if (neg.length >= 3) return neg.slice(0, 4).reverse();
  return pos.length >= neg.length ? pos : neg.reverse();
}
const patternOk = (m, b) => b >= 0 && (m >= 0 || b >= -3 * m);
function genPattern(neg) {
  if (neg && Math.random() < 0.35) { const m = pick([-1, -2]); return { m, b: rnd(-3 * m, 8), dx: 1, rows: [1, 2, 3], src: "pattern" }; }
  const m = rnd(1, 4); let b; do b = rnd(1, 6); while (b === m);
  return { m, b, dx: 1, rows: [1, 2, 3], src: "pattern" };
}
function genTable() {
  const dx = pick([1, 2, 3, 5]), m = rnd(1, dx === 5 ? 3 : 5); let b; do b = rnd(0, 8); while (b === m || b === m * dx);
  return { m, b, dx, rows: [dx, 2 * dx, 3 * dx, 4 * dx], src: "table" };
}
function genLine(src, dxs) {
  for (;;) {
    const dx = pick(dxs), m = Math.random() < 0.4 ? -rnd(1, 4) : rnd(1, 5), b = rnd(-5, 8);
    if (b === m || b === 0) continue;
    const rows = lineRows(m, b, dx);
    if (rows.length >= 3 && rows.every(x => x % dx === 0)) return { m, b, dx, rows, src };
  }
}
function newQ() {
  let q;
  if (S.mod === 1) q = genPattern(false);
  else if (S.mod === 2) q = genTable();
  else if (S.mod === 3) q = genLine("graph", S.mode === "guided" ? [1, 1, 2] : [1, 2, 3]);
  else {
    const src = S.mode === "practice" && S.src4 === "mix" ? pick(["pattern", "table", "graph"]) : S.mode === "practice" ? S.src4 : EX[4].src;
    q = src === "pattern" ? genPattern(true) : src === "table" ? genLine("table", [1, 2, 3]) : genLine("graph", [1, 2, 3]);
  }
  q.task = 0; q.vals = {}; q.paint = {}; q.s0 = 0; q.pair = null; q.yHit = null; q.done = false;
  S.q = q; S.trap = null; S.fb = null; S.pick = null; S.scaffold = false; S.sel = null;
  if (S.mod === 3) S.view = "dots";
}
// The model on screen: Explore uses the sliders, the other modes use the question.
function model() {
  if (S.mode !== "explore") return S.q;
  const e = EX[S.mod], dx = S.mod === 2 ? e.dx : 1;
  const src = S.mod === 4 ? e.src : S.mod === 3 ? "graph" : S.mod === 2 ? "table" : "pattern";
  const rows = S.mod === 1 || (S.mod === 4 && src === "pattern") ? [1, 2, 3] : S.mod === 2 ? [dx, 2 * dx, 3 * dx, 4 * dx] : lineRows(e.m, e.b, 1);
  return { m: e.m, b: e.b, dx, rows, src };
}
const nearest = q => q.rows.slice().sort((a, b) => Math.abs(a) - Math.abs(b))[0];

/* ---------- Equation ---------- */
function eqHTML(m, b, chips = true) {
  let s = `<span class="v">y</span> = `;
  if (m !== 0) s += `<span class="eq-m k-m" data-hl="m">${m === 1 ? "" : m === -1 ? MINUS : fmt(m)}<span class="v">x</span></span>`;
  if (m === 0) s += `<span class="eq-b k-b" data-hl="b">${fmt(b)}</span>`;
  else if (b !== 0) s += ` ${b < 0 ? MINUS : "+"} <span class="eq-b k-b" data-hl="b">${Math.abs(b)}</span>`;
  if (chips) s += `<div class="chips"><span class="c-m k-m" data-hl="m">m = ${fmt(m)}</span><span class="c-b k-b" data-hl="b">b = ${fmt(b)}</span></div>`;
  return s;
}
function parseEq(s) {
  s = String(s || "").replace(/[−–]/g, "-").replace(/\s+/g, "").toLowerCase();
  const mm = s.match(/^y=(.+)$/); if (!mm) return null;
  let rhs = mm[1]; if (!/^[+-]/.test(rhs)) rhs = "+" + rhs;
  const terms = rhs.match(/[+-][^+-]+/g); if (!terms || terms.join("") !== rhs) return null;
  let m = 0, b = 0;
  for (const t of terms) {
    const sg = t[0] === "-" ? -1 : 1, body = t.slice(1);
    if (/^\d*x$/.test(body)) m += sg * (body === "x" ? 1 : parseInt(body, 10));
    else if (/^\d+$/.test(body)) b += sg * parseInt(body, 10);
    else return null;
  }
  return { m, b };
}

/* ---------- Pattern figures ---------- */
// Columns of one figure. Growing: the amber core, then x indigo groups of m. Shrinking (m < 0): b amber tiles in
// columns of |m|; each step takes one column away (drawn as dashed indigo tiles with an ×).
function figCols(m, b, x) {
  const cols = [];
  if (m >= 0) {
    if (b > 0) { if (b <= 5) cols.push({ n: b, k: "b" }); else { const h = Math.ceil(b / 2); cols.push({ n: h, k: "b" }, { n: b - h, k: "b" }); } }
    if (m > 0) for (let i = 0; i < x; i++) cols.push({ n: m, k: "m" });
  } else {
    const k = -m, full = Math.floor(b / k), r = b % k;
    if (r) cols.push({ n: r, k: "b" });
    for (let i = 0; i < full; i++) cols.push({ n: k, k: i >= full - x ? "gone" : "b" });

}
const buildCols = n => { const c = []; while (n > 0) { c.push({ n: Math.min(5, n), k: "b" }); n -= 5; } return c; };
// figs: [{x, label, kind: show | paint | blank | build | back, n0}]
function figsSVG(m, b, figs, o = {}) {
  const T = 34, gap = 6, coreGap = o.plain ? 6 : 20, figGap = 80;
  figs.forEach(f => {
    f.cols = f.kind === "build" ? buildCols(f.n0) : f.kind === "back" && m > 0 ? figCols(m, b, 1) : figCols(m, b, f.x);
  });
  const H = Math.max(2, ...figs.flatMap(f => f.cols.map(c => c.n)));
  let X = 60, body = ""; // room on each side for the Step labels
  figs.forEach((f, fi) => {
    const x0 = X; let x = X, g = "";
    f.cols.forEach((c, ci) => {
      if (ci > 0) x += c.k === "m" && f.cols[ci - 1].k === "b" ? coreGap : gap;
      let cls = c.k;
      if (f.kind === "paint") cls = S.q.paint[fi + ":" + ci] || "blank";
      if (f.kind === "blank") cls = "blank";
      const leaving = f.kind === "back" && ci === f.cols.length - 1;
      const kcls = cls === "b" ? " k-b" : cls === "m" || cls === "gone" ? " k-m" : "";
      let tiles = "";
      for (let j = 0; j < c.n; j++) {
        const ty = 10 + (H - 1 - j) * T;
        tiles += `<rect class="tile ${cls}" x="${x + 1.5}" y="${ty + 1.5}" width="${T - 3}" height="${T - 3}" rx="4"/>`;
        if (cls === "gone") tiles += `<path class="gone-x" d="M${x + 9} ${ty + 9}L${x + T - 9} ${ty + T - 9}M${x + T - 9} ${ty + 9}L${x + 9} ${ty + T - 9}"/>`;
      }
      const pk = f.kind === "paint" && !o.locked ? ` data-p="${fi}:${ci}"` : "";
      // Stepping back from Step 1: a growing pattern loses its last group, a shrinking one gets its column back.
      g += `<g class="col${kcls}${leaving && m > 0 ? " leaving" : ""}"${pk}>${tiles}</g>`;
      if (leaving) g += `<text class="f-note pop" style="animation-delay:.9s" x="${x + T / 2}" y="${10 + (H - c.n) * T - 8}">${sgn(-m)}</text>`;
      x += T;
    });
    if (!f.cols.length) x += T;
    const w = x - x0;
    if (f.kind === "build" || f.kind === "back" || (f.x === 0 && o.frame0)) g += `<rect class="frame" x="${x0 - 5}" y="5" width="${w + 10}" height="${H * T + 10}" rx="8"/>`;
    const cnt = f.kind === "build" ? f.n0 : m * f.x + b;
    g += `<text class="f-lab" x="${x0 + w / 2}" y="${H * T + 46}">${f.label}</text>`;
    if (o.counts && f.kind !== "build" && f.kind !== "back") g += `<text class="f-cnt" x="${x0 + w / 2}" y="${H * T + 72}">${cnt} ${cnt === 1 ? "tile" : "tiles"}</text>`;
    if (f.kind === "back") g += `<text class="f-cnt" x="${x0 + w / 2}" y="${H * T + 72}">?</text>`;
    body += `<g>${g}</g>`;
    X = x + figGap;
  });
  const W = X - figGap + 60, Hh = H * T + 84;

}

/* ---------- Table of values ---------- */
// rows: [{x, y, kind: given | zero | far, show: "num" | "q" | "input", key, sel, anim}]
// arrows: [{i, dx, dy, show: "label" | "input", zero, warn, anim}] between rows i and i + 1.
function tableHTML(rows, arrows, o = {}) {
  let s = `<div class="tv">`;
  s += `<div class="hd d">Δx</div><div class="hd">${o.xName || "x"}</div><div class="hd y">${o.yName || "y"}</div><div class="hd d">Δy</div>`;

  const at = [];
  rows.forEach((w, i) => {
    if (w.kind === "far") { s += `<div class="gap" style="grid-row:${r}">⋮</div>`; r++; }
    at[i] = r;
    const cls = (w.kind === "zero" ? " zero k-b" : "") + (w.show === "q" ? " q" : "") + (w.sel ? " sel" : "") + (o.tap ? " tap" : "") + (w.anim ? " appear" : "");
    const tap = o.tap ? ` data-row="${w.x}"` : "";

    r++;

    const r0 = at[a.i], cls = (a.zero ? " zero k-b" : " k-m") + (a.warn ? " warn" : "") + (a.anim ? " appear" : "");
    const lx = a.show === "input" ? `<input data-k="adx" inputmode="numeric" aria-label="Change in x" value="${val("adx")}">` : sgn(a.dx);
    const ly = a.show === "input" ? `<input data-k="ady" inputmode="numeric" aria-label="Change in y" value="${val("ady")}">` : a.qy ? "?" : sgn(a.dy);
    s += `<div class="arr l${cls}" style="grid-row:${r0} / span 2;grid-column:1"><span class="br"></span><span class="t">${lx}</span></div>`;
    s += `<div class="arr r${cls}" style="grid-row:${r0} / span 2;grid-column:4"><span class="br"></span><span class="t">${ly}</span></div>`;
  });

}
const val = k => S.q && S.q.vals[k] != null ? String(S.q.vals[k]).replace(/"/g, "") : "";

/* ---------- Coordinate grid ---------- */
const C = 34, P = 26, N = 10, GW = 2 * N * C + 2 * P;
const gx = x => P + (x + N) * C, gy = y => P + (N - y) * C;
// o: {m, b, pts, line, pair, showB, yTap, pickable, back, warn}
function graphSVG(o) {
  const { m, b } = o;
  let s = `<svg viewBox="0 0 ${GW} ${GW}" id="graph" role="img" aria-label="Coordinate grid from −10 to 10">
  <defs>${["m", "w", "b"].map(k => `<marker id="ah-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path class="ah-${k}" d="M0,0L10,5L0,10z"/></marker>`).join("")}

  for (let i = -N; i <= N; i++) s += `<line class="g-line" x1="${gx(i)}" y1="${gy(N)}" x2="${gx(i)}" y2="${gy(-N)}"/><line class="g-line" x1="${gx(-N)}" y1="${gy(i)}" x2="${gx(N)}" y2="${gy(i)}"/>`;
  s += `<line class="g-axis" x1="${gx(-N)}" y1="${gy(0)}" x2="${gx(N)}" y2="${gy(0)}"/><line class="g-axis" x1="${gx(0)}" y1="${gy(N)}" x2="${gx(0)}" y2="${gy(-N)}"/>`;
  for (let i = -N; i <= N; i++) {
    if (i === 0) continue;
    s += `<text class="g-tick" x="${gx(i)}" y="${gy(0) + 18}" text-anchor="middle">${fmt(i)}</text>`;
    s += `<text class="g-tick" x="${gx(0) - 5}" y="${gy(i) + 5}" text-anchor="end">${fmt(i)}</text>`;
  }
  s += `<text class="g-tick" x="${gx(0) - 5}" y="${gy(0) + 18}" text-anchor="end">0</text>`;
  s += `<text class="g-name" x="${gx(N) + 4}" y="${gy(0) - 8}" text-anchor="end">x</text><text class="g-name" x="${gx(0) + 10}" y="${gy(N) + 18}">y</text>`;
  if (o.yTap) for (let y = -N; y <= N; y++) s += `<rect class="ytap" data-y="${y}" x="${gx(0) - C / 2}" y="${gy(y) - C / 2}" width="${C}" height="${C}" rx="8"><title>(0, ${fmt(y)})</title></rect>`;
  if (o.line) s += `<line class="g-ln" clip-path="url(#gclip)" x1="${gx(-N - 1)}" y1="${gy(m * (-N - 1) + b)}" x2="${gx(N + 1)}" y2="${gy(m * (N + 1) + b)}"/>`;
  if (o.pair) {
    const [xa, xb] = o.pair.slice().sort((p, q) => p - q), ya = m * xa + b, yb = m * xb + b;
    const w = o.warn ? "w" : "m", wc = o.warn ? " warn" : "";
    s += `<g class="k-m"><polygon class="tri" points="${gx(xa)},${gy(ya)} ${gx(xb)},${gy(ya)} ${gx(xb)},${gy(yb)}"/>`;
    s += `<line class="tri-l" x1="${gx(xa)}" y1="${gy(ya)}" x2="${gx(xb) - 6}" y2="${gy(ya)}" marker-end="url(#ah-m)"/>`;
    if (yb !== ya) s += `<line class="tri-l${wc}" x1="${gx(xb)}" y1="${gy(ya)}" x2="${gx(xb)}" y2="${gy(yb) + (yb > ya ? 6 : -6)}" marker-end="url(#ah-${w})"/>`;
    const below = yb > ya;
    s += `<text class="g-lab m" x="${(gx(xa) + gx(xb)) / 2}" y="${gy(ya) + (below ? 26 : -12)}" text-anchor="middle">run ${sgn(xb - xa)}</text>`;
    s += `<text class="g-lab ${o.warn ? "w" : "m"}" x="${gx(xb) + 10}" y="${(gy(ya) + gy(yb)) / 2 + 6}">rise ${yb === ya ? "0" : sgn(yb - ya)}</text>`;

    s += `</g>`;

    { t: "Colour the pattern", sum: "✓", body: () => `<p>Amber: the core that stays the same in every step. Indigo: the groups that grow. Tap a column to colour it.</p><div class="seg brush" role="group" aria-label="Brush"><button type="button" data-act="brush:b" aria-pressed="${S.brush === "b"}">Amber: stays</button><button type="button" data-act="brush:m" aria-pressed="${S.brush === "m"}">Indigo: grows</button></div><button type="button" class="big-btn" data-act="check">Check colours</button>` },
    { t: "Build Step 0", sum: `<span class="c-b">${q.b} tiles</span>`, body: () => `<p>Step 0 comes one step before Step 1. Build it with − and +.</p><div class="stepper"><button type="button" data-act="s0:-1" aria-label="One tile fewer">−</button><output>${q.s0}</output><button type="button" data-act="s0:1" aria-label="One tile more">+</button></div><button type="button" class="big-btn" data-act="check">Check Step 0</button>` },
    { t: "Write the rule", sum: `<span class="c-m">m = ${q.m}</span> <span class="c-b">b = ${q.b}</span>`, body: eqBoxes },
    { t: "Predict Step 50", sum: `${Y(q, 50)}`, body: () => `<p>How many tiles are in Step 50?</p><div class="ask"><input class="num" data-k="s50" inputmode="numeric" aria-label="Tiles in Step 50" value="${val("s50")}"> <span>tiles</span></div><button type="button" class="big-btn" data-act="check">Check</button>` },
  ];
  if (S.mod === 2) return [
    { t: "Read the jumps", sum: `<span class="c-m">${sgn(q.dx)}, ${sgn(q.m * q.dx)}</span>`, body: () => `<p>Between the first two rows, how much does x jump (left arrow) and how much does y jump (right arrow)? Type them on the arrows.</p><button type="button" class="big-btn" data-act="check">Check jumps</button>` },
    { t: "Find the unit rate", sum: `<span class="c-m">m = ${q.m}</span>`, body: () => `<p>The unit rate is the change in y for each 1 in x.</p><div class="calc"><span class="c-m">m</span> = ${frac("Δy", "Δx")} = ${frac(q.m * q.dx, q.dx)} = <input class="num m" data-k="mr" inputmode="numeric" aria-label="Unit rate" value="${val("mr")}"></div><button type="button" class="big-btn" data-act="check">Check</button>` },
    { t: "Work back to x = 0", sum: `<span class="c-b">b = ${q.b}</span>`, body: () => `<p>Go back one jump from the first row. Type y for x = 0 in the amber row of the table.</p><button type="button" class="big-btn" data-act="check">Check</button>` },
    { t: "Write the rule", sum: "", body: eqBoxes },
  ];
  if (S.mod === 3) return [
    { t: "Draw a slope triangle", sum: `<span class="c-m">m = ${q.m}</span>`, body: () => q.pair ? `<p>Count from the left point to the right point.</p><div class="ask"><span>run</span> <input class="num m" data-k="run" inputmode="numeric" aria-label="run" value="${val("run")}"> <span>rise</span> <input class="num m" data-k="rise" inputmode="numeric" aria-label="rise" value="${val("rise")}"></div><button type="button" class="big-btn" data-act="check">Check</button>` : `<p>Tap two points on the graph.</p>` },
    { t: "Find the y-intercept", sum: `<span class="c-b">b = ${q.b}</span>`, body: () => `<p>Tap the y-axis where the line crosses it (x = 0). Tip: switch on the continuous line.</p>` },
    { t: "Write the rule", sum: "", body: eqBoxes },
  ];
  const prompts = {
    pattern: ["How many tiles does each step add? (Use a negative if tiles are taken away.)", "How many tiles are in Step 0?"],
    table: ["How much does y change for each 1 in x?", "What is y when x = 0?"],
    graph: ["What is rise over run?", "Where does the line cross the y-axis?"],
  }[q.src];
  return [
    { t: "Find m", sum: `<span class="c-m">m = ${q.m}</span>`, body: () => `<p>${prompts[0]}</p><div class="ask"><span class="c-m">m =</span> <input class="num m" data-k="m4" inputmode="numeric" aria-label="m" value="${val("m4")}"></div><button type="button" class="big-btn" data-act="check">Check</button>` },
    { t: "Find b", sum: `<span class="c-b">b = ${q.b}</span>`, body: () => `<p>${prompts[1]}</p><div class="ask"><span class="c-b">b =</span> <input class="num b" data-k="b4" inputmode="numeric" aria-label="b" value="${val("b4")}"></div><button type="button" class="big-btn" data-act="check">Check</button>` },
    { t: "Write the equation", sum: "", body: () => `<div class="eqin"><input class="text" data-k="eq" aria-label="Equation" placeholder="y = " value="${val("eq")}"></div><button type="button" class="big-btn" data-act="check">Check</button>` },
  ];
}
function guidedPanel() {
  const q = S.q, list = tasks();
  let s = `<div class="pc">`;
  if (S.mod === 4) s += `<p class="lbl">Start from</p>` + srcSeg("src", q.src, [["pattern", "Pattern"], ["table", "Table"], ["graph", "Graph"]]);
  s += `<ol class="tasks">`;
  list.forEach((k, i) => {
    const st = i < q.task ? "done" : i === q.task ? "now" : "lock";
    s += `<li class="task ${st}"><div class="th"><span class="n">${st === "done" ? "✓" : i + 1}</span><span>${k.t}</span>${st === "done" && k.sum ? `<span class="sum">${k.sum}</span>` : st === "lock" ? `<span class="sum" aria-label="Locked">🔒</span>` : ""}</div>${st === "now" ? `<div class="tb">${k.body()}</div>` : ""}</li>`;
  });
  s += `</ol><div id="fb"></div>`;
  if (q.done) s += `<div class="eqbig">${eqHTML(q.m, q.b)}<div class="hint" style="font-size:1rem">Point at m or b to see it in the ${MOD_SRC[S.mod] || q.src}.</div></div><button type="button" class="big-btn" data-act="new">New ${S.mod === 1 ? "pattern" : "question"}</button>`;
  return s + `</div>`;
}
function practicePanel() {
  const q = S.q;
  const what = { pattern: "Write the equation for this pattern. x is the step number and y is the number of tiles.", table: "Write the equation for this table.", graph: "Write the equation for this line." }[q.src];
  let s = `<div class="pc">`;
  if (S.mod === 4) s += `<p class="lbl">Questions from</p>` + srcSeg("src4", S.src4, [["mix", "Mixed"], ["pattern", "Pattern"], ["table", "Table"], ["graph", "Graph"]]);
  s += `<p>${what}</p>`;
  s += S.mod === 4 ? `<div class="eqin"><input class="text" data-k="eq" aria-label="Equation" placeholder="y = " value="${val("eq")}"></div><button type="button" class="big-btn" data-act="check">Check</button>` : eqBoxes();
  s += `<div id="fb"></div>`;
  if (q.done) s += `<div class="eqbig">${eqHTML(q.m, q.b)}</div>`;
  const scafName = q.src === "pattern" ? "colours" : q.src === "table" ? (S.mod === 2 ? "jumps and pattern" : "jumps") : "slope triangle";
  s += `<div class="row"><button type="button" data-act="scaffold" aria-pressed="${S.scaffold}">${S.scaffold ? "Hide" : "Show"} ${scafName}</button><button type="button" class="${q.done ? "big-btn" : ""}" data-act="new">New question</button></div>`;
  s += `<p class="score">Solved: ${S.solved}</p></div>`;
  return s;
}

/* ---------- Checking ---------- */
function done(msg) { S.q.task++; S.trap = null; setFb(true, [msg]); render(); }
function checkGuided() {
  const q = S.q, v = q.vals;
  if (q.done) return;
  const t = q.task;
  if (S.mod === 1) {
    if (t === 0) {
      const figsCols = [1, 2, 3].map(x => figCols(q.m, q.b, x));
      let blank = false, wrong = 0;
      figsCols.forEach((cols, fi) => {
        let nb = 0, nm = 0;
        cols.forEach((c, ci) => { const p = q.paint[fi + ":" + ci]; if (!p) blank = true; else if (p === "b") nb += c.n; else nm += c.n; });
        if (nb !== q.b || nm !== q.m * (fi + 1)) wrong++;
      });
      if (blank) return setFb(false, ["Colour every column first."]);
      if (wrong) return setFb(false, ["Not quite.", "The amber core must be the same size in Step 1, Step 2 and Step 3. Indigo is the part that grows each step."]);
      return done("Yes! The core stays the same and one more group grows each step.");
    }
    if (t === 1) {
      if (q.s0 === q.b) return done(q.b === 1 ? "Step 0 has 1 tile: only the core." : `Step 0 has ${q.b} tiles: only the core.`);
      if (q.s0 === Y(q, 1)) { setFb(false, ["That is Step 1.", "Step 0 comes one step before: take one indigo group away."]); S.trap = { kind: "step1", x0: 1 }; return drawReps(); }
      return setFb(false, [`Each step adds ${q.m} tiles. Step 0 has one group fewer than Step 1.`]);
    }
    if (t === 2) return checkEqBoxes();
    if (t === 3) {
      const n = num(v.s50);
      if (n === Y(q, 50)) { q.done = true; q.task = 4; S.trap = null; setFb(true, ["Correct!", `${q.m} × 50 + ${q.b} = ${Y(q, 50)}`]); return render(); }
      if (n === 50 * Y(q, 1)) return setFb(false, ["Only the groups repeat 50 times. The core is added once."]);
      return setFb(false, [`Use the rule: ${q.m} × 50 + ${q.b}.`]);
    }
  }
  if (S.mod === 2) {
    if (t === 0) {
      const a = num(v.adx), c = num(v.ady), msgs = [];
      if (a !== q.dx) msgs.push("Δx: how much does x go up from one row to the next?");
      if (c !== q.m * q.dx) msgs.push("Δy: how much does y go up from one row to the next?");
      return msgs.length ? setFb(false, msgs) : done("Yes! Those are the jumps.");
    }
    if (t === 1) {
      const n = num(v.mr);
      if (n === q.m) return done(`m = ${q.m}: y goes up ${q.m} for each 1 in x.`);
      const d = diagnose(q, n, q.b, { m: true, b: false });
      setFb(false, d.msgs, d.extra); return applyTrap(d);
    }
    if (t === 2) {
      const n = num(v.y0);
      if (n === q.b) return done(`b = ${q.b}: the start, when x = 0.`);
      const d = diagnose(q, q.m, n, { m: false, b: true });
      if (d.trap && d.trap.kind === "step1") d.msgs = [`${n} is y when x = ${q.dx}.`, `Go back one jump: subtract Δy = ${q.m * q.dx}.`];
      setFb(false, d.msgs); return applyTrap(d);
    }
    if (t === 3) return checkEqBoxes();
  }
  if (S.mod === 3) {
    if (t === 0) {
      if (!q.pair) return setFb(false, ["Tap two points on the graph first."]);
      const [xa, xb] = q.pair.slice().sort((p, r) => p - r), run = xb - xa, rise = Y(q, xb) - Y(q, xa);
      const r1 = num(v.run), r2 = num(v.rise), msgs = [];
      if (r1 !== run) msgs.push("Run: count the steps right from the left point to the right point.");
      if (r2 !== rise) {
        if (r2 === -rise && rise < 0) { msgs.push("Check the sign of the rise. Read from left to right: the line goes down, so the rise is negative."); S.trap = { kind: "neg" }; drawReps(); }
        else if (r2 === -rise && rise > 0) msgs.push("Check the sign of the rise. The line goes up from left to right, so the rise is positive.");
        else msgs.push("Rise: count the steps up or down to the right point.");
      }
      if (msgs.length) return setFb(false, msgs);
      S.q.task++; S.trap = null; setFb(true, [`Yes! Slope:`, `<span class="calc">m = ${frac("rise", "run")} = ${frac(fmt(rise), run)} = ${fmt(q.m)}</span>`]); return render();
    }
    if (t === 2) return checkEqBoxes();
  }
  if (S.mod === 4) {
    if (t === 0) { const n = num(v.m4); if (n === q.m) return done(`m = ${fmt(q.m)}`); const d = diagnose(q, n, q.b, { m: true, b: false }); setFb(false, d.msgs, d.extra); return applyTrap(d); }
    if (t === 1) { const n = num(v.b4); if (n === q.b) return done(`b = ${fmt(q.b)}`); const d = diagnose(q, q.m, n, { m: false, b: true }); setFb(false, d.msgs); return applyTrap(d); }
    if (t === 2) return checkTyped();
  }
}
function finish() { S.q.done = true; S.trap = null; S.q.task = 99; if (S.mode === "practice") S.solved++; setFb(true, ["Correct!", "Point at m or b to see where they are."]); render(); }
function checkEqBoxes() {
  const q = S.q, mIn = num(q.vals.em), bIn = num(q.vals.eb);
  if (Number.isNaN(mIn) || Number.isNaN(bIn)) return setFb(false, ["Type a whole number in each box."]);
  const d = diagnose(q, mIn, bIn);
  if (d.ok) return S.mode === "guided" && S.mod === 1 ? done("Correct! Now use the rule to jump far ahead.") : finish();
  setFb(false, d.msgs, d.extra); applyTrap(d);
}
function checkTyped() {
  const q = S.q, p = parseEq(q.vals.eq);
  if (!p) return setFb(false, ["Write it as y = mx + b, for example y = 3x + 2."]);
  const d = diagnose(q, p.m, p.b);
  if (d.ok) return finish();
  setFb(false, d.msgs, d.extra); applyTrap(d);
}

/* ---------- Render and events ---------- */
function render() {
  document.querySelectorAll("#modBtns button").forEach(b => b.setAttribute("aria-current", String(b.dataset.act === "mod:" + S.mod)));
  document.querySelectorAll("#modeBtns button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.act === "mode:" + S.mode)));
  drawReps();
  renderPanel();
}
function setMode() { S.trap = null; S.fb = null; S.pair = null; S.pick = null; S.sel = null; S.scaffold = false; if (S.mode !== "explore") newQ(); render(); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) {
    const row = e.target.closest("[data-row]");
    if (row) { S.sel = +row.dataset.row; drawReps(); }
    return;
  }
  const [a, v] = el.dataset.act.split(":");
  if (a === "mod") { S.mod = +v; S.view = "dots"; setMode(); }
  else if (a === "mode") { S.mode = v; setMode(); }
  else if (a === "src") { if (S.mode === "explore") { EX[4].src = v; S.pair = null; render(); } else { EX[4].src = v; newQ(); render(); } }
  else if (a === "src4") { S.src4 = v; newQ(); render(); }
  else if (a === "dx") { EX[2].dx = +v; S.sel = null; render(); }
  else if (a === "view") { S.view = v; drawReps(); }
  else if (a === "brush") { S.brush = v; renderPanel(); }
  else if (a === "s0") { S.q.s0 = Math.max(0, Math.min(15, S.q.s0 + +v)); S.trap = null; drawReps(); renderPanel(); }
  else if (a === "check") { S.mode === "guided" ? checkGuided() : S.mod === 4 ? checkTyped() : checkEqBoxes(); }
  else if (a === "new") { newQ(); render(); }
  else if (a === "unzoom") { S.trap = null; drawReps(); }
  else if (a === "scaffold") { S.scaffold = !S.scaffold; render(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.s) {
    EX[S.mod][t.dataset.s] = +t.value; $("#o-" + t.dataset.s).textContent = fmt(+t.value);
    S.pair = null; S.pick = null; S.sel = null; drawReps(); updateExplain();
  } else if (t.dataset.k && S.q) S.q.vals[t.dataset.k] = t.value;
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.k) { e.preventDefault(); $("#panel [data-act=check]") ? $("#panel [data-act=check]").click() : checkGuided(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest(".pt")) { e.preventDefault(); tapPoint(+e.target.closest(".pt").dataset.x); }
});
// Pointing at m or b pulses it everywhere; a tap holds the pulse for a few seconds on touch screens.
document.addEventListener("pointerover", e => { const h = e.target.closest("[data-hl]"); if (h && e.pointerType === "mouse") document.body.classList.add("hl-" + h.dataset.hl); const p = e.target.closest(".pt"); if (p) showTip(+p.dataset.x); });
document.addEventListener("pointerout", e => { const h = e.target.closest("[data-hl]"); if (h && e.pointerType === "mouse") document.body.classList.remove("hl-" + h.dataset.hl); const p = e.target.closest(".pt"); if (p) { const t = $("#tip"); if (t) t.setAttribute("visibility", "hidden"); } });

let painting = false;
function paintAt(el) {
  const c = el && el.closest && el.closest(".col[data-p]"); if (!c) return;
  if (S.q.paint[c.dataset.p] === S.brush) return;
  S.q.paint[c.dataset.p] = S.brush; S.fb = null; const fb = $("#fb"); if (fb) fb.innerHTML = "";
  drawReps();
}
$("#paneA").addEventListener("pointerdown", e => {
  const h = e.target.closest("[data-hl]"); if (h && e.pointerType !== "mouse") flash([h.dataset.hl]);
  if (e.target.closest(".col[data-p]")) { painting = true; paintAt(e.target); e.preventDefault(); return; }
  const p = e.target.closest(".pt"); if (p) { tapPoint(+p.dataset.x); return; }
  const yt = e.target.closest(".ytap"); if (yt) tapY(+yt.dataset.y);
});
document.addEventListener("pointerdown", e => { const h = e.target.closest("#panel [data-hl]"); if (h && e.pointerType !== "mouse") flash([h.dataset.hl]); });
document.addEventListener("pointermove", e => { if (painting) paintAt(document.elementFromPoint(e.clientX, e.clientY)); });
document.addEventListener("pointerup", () => { painting = false; });

function tapPoint(x) {
  const q = model(), ex = S.mode === "explore";
  if (S.mod === 3 && S.mode === "guided" && q.task === 1 && x === 0) return tapY(Y(q, 0));
  const pickable = ex ? (S.mod === 3 || (S.mod === 4 && q.src === "graph")) : S.mod === 3 && S.mode === "guided" && q.task === 0;
  if (!pickable) return;
  if (S.pick === null || S.pick === x) { S.pick = x; drawReps(); return; }
  const pair = [S.pick, x]; S.pick = null;
  if (ex) { S.pair = pair; drawReps(); updateExplain(); }
  else { q.pair = pair; q.vals.run = q.vals.rise = ""; S.fb = null; S.trap = null; drawReps(); renderPanel(); }
}
function tapY(y) {
  const q = S.q; if (!q || S.mod !== 3 || q.task !== 1) return;
  if (y === q.b) return done(`b = ${fmt(q.b)}: the line crosses the y-axis at ${pt(0, q.b)}.`);
  const x0 = nearest(q);
  if (y === Y(q, x0)) { setFb(false, [`${fmt(y)} is y when x = ${fmt(x0)}.`, "The y-intercept is where x = 0. Watch the steps back to the y-axis."]); S.trap = { kind: "step1", x0 }; return drawReps(); }
  setFb(false, ["That is not where the line crosses. Switch on the continuous line to see it."]);
}

newQ(); render();
})();
</script>

 "Patterns to y = mx + b": "Des régularités à y = mx + b",
 "Patterns to {0} = {1} + {2}": "Des régularités à {0} = {1} + {2}",
 "Explore": "Explorer", "Guided Build": "Construction guidée", "Practice": "Pratique",
 "{0}Patterns": "{0}Régularités", "{0}Tables": "{0}Tables de valeurs", "{0}Graphs": "{0}Graphiques", "{0}Equation Studio": "{0}Atelier d’équations",
 "Mode": "Mode", "Modules": "Modules", "Brush": "Pinceau", "Start from": "Partir de", "Show": "Afficher", "Locked": "Verrouillé",
 "Tile pattern": "Régularité de tuiles", "Coordinate grid from {n} to {n}": "Plan cartésien de {n} à {n}", "Point ({n}, {n})": "Point ({n}, {n})", "Zoomed grid": "Quadrillage agrandi",

<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {

        if (fr == null) return false;

    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];

      const m = part.match(/^\{(\d+)\}$/);

      else if (part) out.push(document.createTextNode(part));
    });

    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }

    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });

    const orig = C2D[fn];

  });

  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
</body>
</html>
