<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Elastic Double Number Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Elastic Double Number Line: a quantity line (0 to the whole) locked above a 0% to 100% line.
   One vertical slider crosses both; the top value at the slider lights up. Changing the whole stretches the top line's numbers. */
.entry { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 32px; }
.whole { display: inline-flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; }
.money { display: inline-flex; align-items: center; border: 2px solid var(--orange); border-radius: 10px; padding: 0 10px; background: var(--paper); }
.money span { font-family: var(--font-num); font-weight: 700; font-size: 2.2rem; color: var(--orange); }
.money input { width: 6ch; height: 60px; font-family: var(--font-num); font-weight: 700; font-size: 2.2rem; color: var(--ink); background: transparent; border: 0; text-align: center; -moz-appearance: textfield; }
.money input::-webkit-inner-spin-button, .money input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.say { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; font-family: var(--font-num); font-weight: 700; font-size: 2.6rem; }
.say .pct { color: var(--pt); }
.say .part { color: var(--orange); background: color-mix(in srgb, var(--orange) 16%, transparent); border-radius: 10px; padding: 0 12px; }
.say .of { color: var(--muted); font-family: var(--font-body); font-size: 0.6em; }
#reset { margin-left: auto; font-size: 1.15rem; min-height: 56px; padding: 10px 18px; }
.err { margin: 10px 0 0; color: var(--warn); font-weight: 700; font-size: 1.2rem; }
.entry-card { margin-bottom: 16px; }

.board { padding: 10px; }
#svg { cursor: ew-resize; }
.rail { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
.fill-top { stroke: var(--orange); stroke-width: 14; stroke-linecap: butt; opacity: 0.55; }
.fill-bot { stroke: var(--pt); stroke-width: 14; stroke-linecap: butt; opacity: 0.55; }
.tick { stroke: var(--ink); stroke-width: 3; }
.tick.end { stroke-width: 5; }
.link { stroke: var(--grid-major); stroke-width: 1.5; stroke-dasharray: 4 6; }
.tl { fill: var(--ink); font-family: var(--font-num); font-weight: 700; font-size: 30px; text-anchor: middle; }
.tl.top { fill: var(--orange); }
.tl.bot { fill: var(--pt); }
.tl.end { font-size: 36px; }
.tl.lit { fill: var(--sheet); }
.lit-bg.top { fill: var(--orange); }
.lit-bg.bot { fill: var(--pt); }
.side-name { fill: var(--muted); font-family: var(--font-display); font-weight: 800; font-size: 26px; text-anchor: end; }
.slider-line { stroke: var(--ink); stroke-width: 5; }
.knob { fill: var(--sheet); stroke: var(--ink); stroke-width: 5; }
.grip { stroke: var(--ink); stroke-width: 3; }
#svg:focus { outline: none; }
#svg:focus-visible .knob { stroke: var(--pt); stroke-width: 7; }
.dot.top { fill: var(--orange); stroke: var(--sheet); stroke-width: 4; }
.dot.bot { fill: var(--pt); stroke: var(--sheet); stroke-width: 4; }
@media (max-width: 600px) { .say { font-size: 1.9rem; } .whole { font-size: 1.2rem; } #reset { margin-left: 0; } }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Elastic Double Number Line</h1></div>
  </header>

  <section class="card entry-card">
    <div class="entry">
      <label class="whole" for="whole">100% is
        <span class="money"><span>$</span><input id="whole" type="number" inputmode="decimal" min="0" step="any"></span>
      </label>
      <div class="say" id="say" aria-live="polite"></div>
      <button type="button" id="reset">Start over</button>
    </div>
    <p class="err" id="err" hidden></p>
  </section>

  <div class="board"><svg id="svg" viewBox="0 90 1200 290" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-label="Percent slider on two number lines locked together: dollars on top, percent on the bottom"></svg></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const svg = $("svg");
  const X0 = 150, X1 = 1130, TOP_Y = 150, BOT_Y = 290;
  const x = p => X0 + (X1 - X0) * p / 100;
  let pct = 25, whole = 80, shown = 80, anim = 0;

  const el = (tag, attrs, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  // Money with commas, at most 2 decimal places, no trailing zeros ($20, $12.5 shows as $12.50).
  const money = v => {
    const r = Math.round(v * 100) / 100;
    const cents = Math.abs(r % 1) > 1e-9;
    return "$" + r.toLocaleString("en-US", { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: 2 });
  };

  // A label, with a filled pill behind it when it is the lit one.
  function lit(text, cx, y, cls) {
    {
      const w = text.length * 36 * 0.62 + 28;
      el("rect", { class: "lit-bg " + cls, x: Math.min(Math.max(cx - w / 2, 4), 1196 - w), y: y - 38, width: w, height: 50, rx: 10 });
      el("text", { class: "tl lit end", x: Math.min(Math.max(cx, 4 + w / 2), 1196 - w / 2), y }).textContent = text;
    }
  }

  function draw() {
    svg.replaceChildren();
    const part = shown * pct / 100;
    el("text", { class: "side-name", x: X0 - 40, y: TOP_Y + 9 }).textContent = "$";
    el("text", { class: "side-name", x: X0 - 40, y: BOT_Y + 9 }).textContent = "%";

    // Dashed links show the two lines are locked together every 10%.
    for (let k = 0; k <= 10; k++) el("line", { class: "link", x1: x(k * 10), y1: TOP_Y, x2: x(k * 10), y2: BOT_Y });

    el("line", { class: "rail", x1: X0, y1: TOP_Y, x2: X1, y2: TOP_Y });
    el("line", { class: "rail", x1: X0, y1: BOT_Y, x2: X1, y2: BOT_Y });
    if (pct > 0) {
      el("line", { class: "fill-top", x1: X0, y1: TOP_Y, x2: x(pct), y2: TOP_Y });
      el("line", { class: "fill-bot", x1: X0, y1: BOT_Y, x2: x(pct), y2: BOT_Y });
    }

    // Top labels sit above the top line, percent labels below the bottom line. Thin the top labels if money is wide.
    const topWidest = Math.max(...Array.from({ length: 11 }, (_, k) => money(shown * k / 10).length));
    const topStep = topWidest * 30 * 0.62 + 14 <= (X1 - X0) / 10 ? 1 : 2;
    const litTopW = money(part).length * 36 * 0.62 + 28;
    const litBotW = (pct + "%").length * 36 * 0.62 + 28;
    for (let k = 0; k <= 10; k++) {
      const p = k * 10, end = k === 0 || k === 10, cx = x(p);
      el("line", { class: "tick" + (end ? " end" : ""), x1: cx, y1: TOP_Y - (end ? 18 : 13), x2: cx, y2: TOP_Y + (end ? 18 : 13) });
      el("line", { class: "tick" + (end ? " end" : ""), x1: cx, y1: BOT_Y - (end ? 18 : 13), x2: cx, y2: BOT_Y + (end ? 18 : 13) });
      if (p === pct) continue; // the lit labels show this one
      const tTop = money(shown * p / 100), tBot = p + "%";
      const clear = (w, t) => Math.abs(cx - x(pct)) > w / 2 + t.length * (end ? 36 : 30) * 0.31 + 6;
      if ((k % topStep === 0 || end) && clear(litTopW, tTop)) el("text", { class: "tl top" + (end ? " end" : ""), x: cx, y: TOP_Y - 34 }).textContent = tTop;
      if (clear(litBotW, tBot)) el("text", { class: "tl bot" + (end ? " end" : ""), x: cx, y: BOT_Y + 58 }).textContent = tBot;
    }

    // The slider: one vertical bar through both lines with a knob to grab, and the matching values lit up.
    const g = el("g", { class: "slider" });
    svg.setAttribute("aria-valuenow", pct);
    svg.setAttribute("aria-valuetext", `${pct}% is ${money(part)}`);
    const sx = x(pct);
    el("line", { class: "slider-line", x1: sx, y1: TOP_Y - 30, x2: sx, y2: BOT_Y + 22 }, g);
    el("circle", { class: "dot top", cx: sx, cy: TOP_Y, r: 13 }, g);
    el("circle", { class: "dot bot", cx: sx, cy: BOT_Y, r: 13 }, g);
    const ky = (TOP_Y + BOT_Y) / 2;
    el("rect", { class: "knob", x: sx - 22, y: ky - 32, width: 44, height: 64, rx: 12 }, g);
    for (const d of [-8, 0, 8]) el("line", { class: "grip", x1: sx - 10, y1: ky + d, x2: sx + 10, y2: ky + d }, g);
    lit(money(part), sx, TOP_Y - 34, "top");
    lit(pct + "%", sx, BOT_Y + 58, "bot");
  }

  function readout() {
    $("say").innerHTML = `<span class="pct">${pct}%</span><span class="of">of</span><span>${money(whole)}</span><span>=</span><span class="part">${money(whole * pct / 100)}</span>`;
  }

  // Changing the whole stretches the top line: its numbers slide smoothly to the new values.
  function stretchTo(v) {
    whole = v;
    readout();
    cancelAnimationFrame(anim);
    const from = shown, t0 = performance.now(), dur = 450;
    const step = now => {
      const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
      shown = from + (whole - from) * e;
      if (t === 1) shown = whole;
      draw();
      if (t < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }

  function setPct(p) {
    p = Math.max(0, Math.min(100, Math.round(p)));
    if (p === pct) return;
    pct = p;
    readout();
    draw();
  }

  $("whole").addEventListener("input", () => {
    const raw = $("whole").value, v = +raw;
    const bad = raw === "" || !isFinite(v) || v <= 0 || v > 1e7;
    $("err").hidden = !bad;
    if (bad) { $("err").textContent = "Type an amount bigger than 0 for 100%."; return; }
    stretchTo(v);
  });

  // Drag anywhere on the board: the slider jumps there and follows, snapping to whole percents.
  const toPct = e => {
    const m = svg.getScreenCTM().inverse();
    const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(m);
    return (pt.x - X0) / (X1 - X0) * 100;
  };
  let dragging = false;
  svg.addEventListener("pointerdown", e => { dragging = true; svg.setPointerCapture(e.pointerId); setPct(toPct(e)); e.preventDefault(); });
  svg.addEventListener("pointermove", e => { if (dragging) setPct(toPct(e)); });
  ["pointerup", "pointercancel"].forEach(t => svg.addEventListener(t, () => { dragging = false; }));
  svg.addEventListener("keydown", e => {
    const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 10, PageDown: -10 }[e.key];
    if (e.key === "Home") setPct(0); else if (e.key === "End") setPct(100); else if (d) setPct(pct + d); else return;
    e.preventDefault();
  });

  $("reset").addEventListener("click", () => {
    $("whole").value = 80; $("err").hidden = true;
    pct = 25; whole = 80; shown = 80;
    cancelAnimationFrame(anim); readout(); draw();
  });
  $("reset").click();
})();
</script>

</body>
</html>
