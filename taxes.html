<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Canadian Income Tax, Alberta (grades 10-12; Shawn 2026-10-22: Math 30-3, pay stub AND tax return, employment income only).
   The language is the hard part, so every step names ONE word, shows it on the income bar and adds it to the Words card.
   Simplified 2026 numbers, rounded (stated on the page):
     CPP 5.95% of pay over $3 500, up to $74 600 (CPP2 left out); EI 1.63% of pay up to $68 900;
     federal 14% / 20.5% / 26% / 29% / 33% at $58 500, $117 000, $181 500, $258 500;
     Alberta 8% / 10% / 12% / 13% / 14% / 15% at $61 200, $154 300, $185 100, $246 800, $370 200;
     credits = (basic personal amount + CPP + EI) × lowest rate: federal $16 500 × 14%, Alberta $22 800 × 8%.
     Other credits (Canada employment amount, CPP enhanced part) are left out.
   Pay stub view (whole year): gross, CPP, EI, income tax (from the payroll tables, given), net pay, each of 26 paycheques.
   Tax return view: gross, deductions, taxable income, federal brackets, Alberta brackets, credits, tax owed,
   refund or balance owing, marginal vs average rate. Past steps shrink to their answers in a So far strip; the work area shows only the current step.
   Practice: one question at a time that is the next step of the walk-through (CPP, net pay, taxable income,
   federal bracket tax, refund or owing), with feedback for the usual mistakes, Hint, Show me.
   Colours: income blue, deductions grey, CPP purple, EI teal, tax orange, credits gold, net pay / refund green, owing red. */
:root { --cgr: #2f5fd0; --cded: #6b7785; --ccpp: #7a4cc2; --cei: #0f8585; --ctax: #c2571a; --ccr: #a07800; --cnet: #1f7a5a; --cowe: #a3263c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cgr: #7aa2ff; --cded: #9aa6b2; --ccpp: #b48cf0; --cei: #4cc4c4; --ctax: #f08a4b; --ccr: #e0b43c; --cnet: #4cc49a; --cowe: #ff7d93; } }
:root[data-theme="dark"] { --cgr: #7aa2ff; --cded: #9aa6b2; --ccpp: #b48cf0; --cei: #4cc4c4; --ctax: #f08a4b; --ccr: #e0b43c; --cnet: #4cc49a; --cowe: #ff7d93; }
@media (min-width: 861px) { .main { grid-template-columns: minmax(0, 1.9fr) minmax(320px, 1fr); } }
.seg-btns { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--grid-major); border-radius: 10px; overflow: hidden; }
.seg-btns button { border: 0; border-radius: 0; background: var(--sheet); color: var(--ink); font: inherit; font-size: 1.1rem; min-height: 48px; padding: 6px 14px; cursor: pointer; }
.seg-btns button + button { border-left: 2px solid var(--grid-major); }
.seg-btns button.on { background: var(--pt); color: var(--sheet); font-weight: 700; }
header .seg-btns button { font-size: 1.2rem; padding: 6px 20px; }
.wide { display: flex; width: 100%; }
.wide button { flex: 1 1 0; padding: 6px 8px; font-size: 1.05rem; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (min-width: 861px) and (min-height: 520px) { .side { overflow-y: auto; } }
.panel { gap: 12px; }
.card { padding: 12px 14px; }
.card .label { margin: 0 0 6px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.story { font-size: 1.25rem; line-height: 1.45; margin: 0; }
.story b { font-family: var(--font-num); }
.story [class^="k-"], .say b, .bkeys b, .sofar > span { white-space: nowrap; }
.model { margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--grid-major); color: var(--muted); font-size: 0.95rem; line-height: 1.4; }
.steplbl { margin: 0; color: var(--muted); font-weight: 700; font-size: 0.95rem; }
.sttl { margin: 0 0 4px; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; }
.say { font-size: 1.25rem; margin: 0; min-height: 3em; line-height: 1.45; }
.say b { font-family: var(--font-num); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns button { font: inherit; font-size: 1.1rem; min-height: 52px; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--grid-major); background: var(--sheet); color: var(--ink); cursor: pointer; }
.btns button.go { background: var(--pt); color: var(--sheet); border-color: var(--pt); font-weight: 700; }
.btns button:disabled { opacity: 0.45; cursor: default; }
.k-gr { color: var(--cgr); font-weight: 700; } .k-ded { color: var(--cded); font-weight: 700; } .k-cpp { color: var(--ccpp); font-weight: 700; }
.k-ei { color: var(--cei); font-weight: 700; } .k-tax { color: var(--ctax); font-weight: 700; } .k-cr { color: var(--ccr); font-weight: 700; }
.k-net { color: var(--cnet); font-weight: 700; } .k-owe { color: var(--cowe); font-weight: 700; }
/* Words card: each word appears when its step does; the newest is highlighted. */
.words { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.words li { line-height: 1.35; padding: 4px 8px; border-radius: 8px; border-left: 5px solid currentColor; }
.words li b { display: block; font-size: 1.1rem; }
.words li span { color: var(--ink); font-weight: 400; font-size: 1rem; }
.words li.now { background: var(--chip); }
/* Practice answers */
.arow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.2fr); align-items: center; gap: 8px; margin-bottom: 8px; }
.arow label { font-weight: 700; font-size: 1.1rem; }
.unit { font-family: var(--font-num); font-weight: 700; font-size: 1.8rem; }
.big-in { font-family: var(--font-num); font-weight: 700; font-size: 1.8rem; color: var(--ink); background: var(--paper); border: 2px solid var(--grid-major); border-radius: 10px; height: 58px; width: 100%; min-width: 0; padding: 0 10px; text-align: right; }
.big-in.bad { border-color: var(--warn); }
.big-in.ok { border-color: var(--green); color: var(--green); }
.choice { margin-bottom: 8px; }
.choice.bad { border-color: var(--warn); }
.fb { margin: 8px 0 0; font-size: 1.2rem; font-weight: 700; min-height: 1.45em; }
.fb.ok { color: var(--green); } .fb.no { color: var(--warn); } .fb.hint { color: var(--muted); }
.score { font-size: 1.1rem; color: var(--muted); margin: 4px 0 0; }
.score b { color: var(--ink); font-family: var(--font-num); font-size: 1.35rem; }

/* Board: the boxes, the picture (income bars), then the work. */
.board { gap: 12px; padding: 12px 16px; }
@media (min-width: 861px) and (min-height: 520px) { .board { justify-content: flex-start; } }
.inputs { display: flex; flex-wrap: wrap; gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 2px; padding: 4px 12px 8px; border-radius: 10px; background: var(--chip); border-left: 6px solid currentColor; }
.fld label { font-size: 0.9rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.fld .box { display: flex; align-items: center; gap: 4px; font-family: var(--font-num); font-weight: 700; font-size: 1.6rem; }
.fld input { font: inherit; color: inherit; width: 5.2em; min-width: 0; height: 2.5rem; padding: 0 8px; border: 2px solid var(--grid-major); border-radius: 8px; background: var(--sheet); text-align: right; }
.fld input.bad { border-color: var(--warn); }
.fld input[readonly] { border-color: transparent; background: transparent; padding: 0 2px; width: auto; field-sizing: content; }
.warnline { color: var(--warn); font-weight: 700; font-size: 1.1rem; margin: 0; }
.pic { flex: none; display: flex; flex-direction: column; gap: 8px; }
.brow { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); align-items: center; gap: 4px 10px; }
.brow .bl { font-weight: 700; font-size: 1.05rem; text-align: right; line-height: 1.2; }
.track { position: relative; height: 46px; }
.fill { display: flex; height: 100%; border-radius: 8px; overflow: hidden; border: 2px solid var(--grid-major); transition: width 0.35s ease; }
.fill > div { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; white-space: nowrap; color: #fff; font-family: var(--font-num); font-weight: 700; font-size: 1.1rem; padding: 0 4px; transition: flex-grow 0.35s ease; }
.fill > div + div { border-left: 2px solid var(--sheet); }
.s-gr { background: var(--cgr); } .s-ded { background: repeating-linear-gradient(135deg, var(--cded) 0 8px, color-mix(in srgb, var(--cded) 70%, var(--sheet)) 8px 16px); }
.s-cpp { background: var(--ccpp); } .s-ei { background: var(--cei); } .s-tax { background: var(--ctax); } .s-cr { background: var(--ccr); }
.s-net { background: var(--cnet); } .s-owe { background: repeating-linear-gradient(135deg, var(--cowe) 0 8px, color-mix(in srgb, var(--cowe) 75%, var(--sheet)) 8px 16px); }
/* Bracket slices: lighter for low rates, darker for higher rates. */
.fill > .b0, .fill > .b1, .fill > .b2, .fill > .b3, .fill > .b4, .fill > .b5 { color: var(--ink); }
.b0 { background: color-mix(in srgb, var(--ctax) 30%, var(--sheet)); } .b1 { background: color-mix(in srgb, var(--ctax) 55%, var(--sheet)); }
.b2 { background: color-mix(in srgb, var(--ctax) 75%, var(--sheet)); } .b3, .b4, .b5 { background: var(--ctax); }
.fill > .hot { outline: 4px solid var(--ink); outline-offset: -4px; }
.pays { background-image: repeating-linear-gradient(90deg, transparent 0 calc(100% / 26 - 2px), var(--sheet) calc(100% / 26 - 2px) calc(100% / 26)); }
:root[data-theme="dark"] .fill > div { color: #0f161d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fill > div { color: #0f161d; } }
.bkeys { grid-column: 2; display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 1rem; margin-top: -2px; }
.bkeys b { font-family: var(--font-num); }

.body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.work { --wf: 30px; font-size: var(--wf); display: grid; grid-template-columns: max-content max-content max-content minmax(0, 1fr); align-content: start; align-items: center; column-gap: 0.35em; row-gap: 0.25em; overflow: hidden; min-height: 0; flex: 1 1 auto; font-family: var(--font-num); font-weight: 700; padding-top: 0.2em; }

.frac { display: inline-flex; flex-direction: column; text-align: center; vertical-align: middle; line-height: 1.1; }
.frac > span:first-child { border-bottom: 0.08em solid currentColor; padding: 0 0.15em 0.04em; }

<script>
(function () {
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const isFr = () => document.documentElement.lang === "fr";

  // ---------- numbers ----------
  const r2 = v => Math.round(v * 100 + 1e-9) / 100;
  const trim = (v, d) => { const s = (+v).toFixed(d); return s.includes(".") ? s.replace(/0+$/, "").replace(/\.$/, "") : s; };
  // Thousands get a space once there are 5 or more digits (12 500).
  const grp = s => { const [i, f] = s.split("."); return (i.length >= 5 ? i.replace(/\B(?=(\d{3})+$)/g, " ") : i) + (f != null ? "." + f : ""); };
  const mnum = v => Number.isInteger(r2(v)) ? String(r2(v)) : r2(v).toFixed(2);
  function money(v) { const s = grp(mnum(v)); return isFr() ? s.replace(".", ",") + " $" : "$" + s; }
  const pct = r => { const s = trim(r * 100, 2); return (isFr() ? s.replace(".", ",") : s) + "%"; };
  const rd = r => { const s = trim(r, 4); return isFr() ? s.replace(".", ",") : s; };   // a rate as a decimal: 0.205
  const fr = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
  const K = (k, s) => `<span class="k-${k}">${s}</span>`;
  const B = s => `<b>${s}</b>`;
  const OP = s => ` <span class="op">${s}</span> `;
  const num = s => { const v = parseFloat(String(s).replace(/\s/g, "").replace(",", ".").replace(/^\$/, "")); return isFinite(v) ? v : NaN; };

  // ---------- the model: simplified 2026 numbers, rounded ----------
  const P = {
    cppRate: 0.0595, cppEx: 3500, cppMax: 74600, eiRate: 0.0163, eiMax: 68900, pays: 26,
    fed: [[58500, 0.14], [117000, 0.205], [181500, 0.26], [258500, 0.29], [Infinity, 0.33]],
    ab: [[61200, 0.08], [154300, 0.10], [185100, 0.12], [246800, 0.13], [370200, 0.14], [Infinity, 0.15]],
    fedBPA: 16500, abBPA: 22800
  };
  function slices(T, br) {
    const out = []; let lo = 0;
    for (const [hi, r] of br) {
      if (T <= lo) break;
      const amt = Math.min(T, hi) - lo;
      out.push({ lo, top: Math.min(T, hi), amt, r, tax: r2(amt * r) });
      lo = hi;
    }
    return out;
  }
  const sum = a => r2(a.reduce((t, x) => t + x.tax, 0));
  function calc(G, D, paid) {
    const cppBase = Math.max(0, Math.min(G, P.cppMax) - P.cppEx);
    const cpp = r2(P.cppRate * cppBase), ei = r2(P.eiRate * Math.min(G, P.eiMax));
    const T = Math.max(0, r2(G - D));
    const fs = slices(T, P.fed), as = slices(T, P.ab);
    const fb = sum(fs), ab = sum(as);
    const fca = r2(P.fedBPA + cpp + ei), aca = r2(P.abBPA + cpp + ei);
    const fcr = r2(fca * P.fed[0][1]), acr = r2(aca * P.ab[0][1]);
    const ft = Math.max(0, r2(fb - fcr)), at = Math.max(0, r2(ab - acr));
    const owed = r2(ft + at), diff = r2(paid - owed);
    const net = r2(G - cpp - ei - paid);
    const topF = (fs[fs.length - 1] || { r: P.fed[0][1] }).r, topA = (as[as.length - 1] || { r: P.ab[0][1] }).r;
    return { G, D, paid, cpp, cppBase, ei, T, fs, as, fb, ab, fca, aca, fcr, acr, ft, at, owed, diff, net,
      per: r2(net / P.pays), marg: topF + topA, topF, topA, avg: G > 0 ? owed / G : 0 };
  }
  // Tax taken off the pay stubs: payroll does not know about the RRSP, so it is close to the tax with no deductions.
  const paidFor = (G, off) => Math.max(0, Math.round((calc(G, 0, 0).owed + off) / 10) * 10);

  // ---------- words ----------
  const WORDS = {
    gross: ["gr", "Gross income", "All the money you earned before anything is taken off."],
    cpp: ["cpp", "CPP", "Canada Pension Plan. Saved from your pay for when you retire."],
    ei: ["ei", "EI", "Employment Insurance. Pays you for a while if you lose your job."],
    tax: ["tax", "Income tax", "Money paid to Canada and to Alberta from your income."],
    net: ["net", "Net pay", "What you take home. Gross pay minus everything taken off."],
    ded: ["ded", "Deduction", "Taken off your income before tax is figured. Example: RRSP savings."],
    taxable: ["gr", "Taxable income", "The income that tax is figured on. Gross income minus deductions."],
    bracket: ["tax", "Tax bracket", "A slice of income. Each slice is taxed at its own rate."],
    prov: ["tax", "Provincial tax", "Alberta's own tax, with its own brackets."],
    credit: ["cr", "Tax credit", "Taken off your tax, not your income."],
    owed: ["tax", "Tax owed", "The tax you really owe for the year."],
    paid: ["tax", "Tax paid", "Tax already taken off your pay stubs."],
    refund: ["net", "Refund", "Money back. You paid more than you owe."],
    owe: ["owe", "Balance owing", "Money you still pay. You paid less than you owe."],
    marg: ["tax", "Marginal rate", "The rate on your next dollar earned."],
    avg: ["tax", "Average rate", "Total tax as a part of your income."]
  };

  // ---------- the steps ----------
  // Each step: title, words it adds, what to say, and its work lines {l, r, n, keep, cl}.
  // When a step is in the past, only its keep lines stay (labelled cl if given).
  function stubSteps(c) {
    const cppTop = c.G > P.cppMax, eiTop = c.G > P.eiMax;
    return [
      { t: "Gross income", w: ["gross"], say: `<span>Start with everything earned at the job in one year: ${B(money(c.G))}.</span>`,
        lines: [{ l: "Gross income", r: K("gr", money(c.G)), n: "Everything earned", keep: 1 }] },
      { t: "CPP", w: ["cpp"], say: `<span>CPP is ${B("5.95%")} of pay. The first ${B(money(P.cppEx))} of the year has no CPP.</span>`,
        lines: [{ l: "CPP", r: `${rd(P.cppRate)}${OP("×")}(${cppTop ? money(P.cppMax) : K("gr", money(c.G))}${OP("−")}${money(P.cppEx)})`,
                  n: cppTop ? `<span>Stops at ${B(money(P.cppMax))}</span>` : `<span>${B("5.95%")} of pay over ${B(money(P.cppEx))}</span>` },
                { l: "", r: K("cpp", money(c.cpp)), keep: 1, cl: "CPP" }] },
      { t: "EI", w: ["ei"], say: `<span>EI is ${B("1.63%")} of pay${eiTop ? ", up to " + B(money(P.eiMax)) : ""}.</span>`,
        lines: [{ l: "EI", r: `${rd(P.eiRate)}${OP("×")}${eiTop ? money(P.eiMax) : K("gr", money(c.G))}`,
                  n: eiTop ? `<span>Stops at ${B(money(P.eiMax))}</span>` : `<span>${B("1.63%")} of pay</span>` },
                { l: "", r: K("ei", money(c.ei)), keep: 1, cl: "EI" }] },
      { t: "Income tax", w: ["tax"], say: `<span>The employer takes off income tax using the payroll tax tables: ${B(money(c.paid))}. The tax return checks it later.</span>`,
        lines: [{ l: "Income tax", r: K("tax", money(c.paid)), n: "From the payroll tax tables", keep: 1 }] },
      { t: "Net pay", w: ["net"], say: `<span>Take everything off the gross income. What is left is the net pay: ${B(money(c.net))}.</span>`,
        lines: [{ l: "Net pay", r: `${K("gr", money(c.G))}${OP("−")}${K("cpp", money(c.cpp))}${OP("−")}${K("ei", money(c.ei))}${OP("−")}${K("tax", money(c.paid))}`, n: "Gross − everything taken off" },
                { l: "", r: K("net", money(c.net)), keep: 1, cl: "Net pay" }] },
      { t: "Each paycheque", w: [], say: `<span>Paid every 2 weeks means ${B(P.pays)} paycheques a year. Each one is ${B(money(c.per))}.</span>`,
        lines: [{ l: "Each paycheque", r: fr(K("net", money(c.net)), P.pays), n: "26 paycheques a year" },
                { l: "", r: K("net", money(c.per)), keep: 1, cl: "Each paycheque" }] }
    ];
  }
  function bracketLines(sl, name, total, key) {
    const L = [];
    if (sl.length === 1) {
      L.push({ l: name, r: `${rd(sl[0].r)}${OP("×")}${K("gr", money(sl[0].amt))}`, n: `<span>${B(pct(sl[0].r))} on all of it</span>` });
      L.push({ l: "", r: K("tax", money(total)), keep: 1, cl: name });
      return L;
    }
    sl.forEach((s, i) => {
      L.push({ l: `Slice ${i + 1}`, r: `${rd(s.r)}${OP("×")}${money(s.amt)}`,
        n: i === 0 ? `<span>${B(pct(s.r))} on the first ${B(money(s.amt))}</span>` : `<span>${B(pct(s.r))} on the next ${B(money(s.amt))}</span>` });
      L.push({ l: "", r: money(s.tax) });
    });
    L.push({ l: name, r: sl.map(s => money(s.tax)).join(OP("+")), n: "Add the slices" });
    L.push({ l: "", r: K("tax", money(total)), keep: 1, cl: name });
    return L;
  }
  function retSteps(c) {
    const two = c.fs.length > 1, edgeF = money(P.fed[0][0]);
    const resultLine = c.diff > 0 ? { l: "Refund", r: K("net", money(c.diff)), n: "Money back", keep: 1 }
      : c.diff < 0 ? { l: "Balance owing", r: K("owe", money(-c.diff)), n: "Still to pay", keep: 1 }
      : { l: "Even", r: money(0), n: "Nothing back, nothing owing", keep: 1 };
    return [
      { t: "Gross income", w: ["gross"], say: `<span>Start with everything earned at the job in one year: ${B(money(c.G))}.</span>`,
        lines: [{ l: "Gross income", r: K("gr", money(c.G)), n: "Everything earned", keep: 1 }] },
      { t: "Deductions", w: ["ded"], say: `<span>A deduction is taken off the income before any tax is figured. Here it is RRSP savings: ${B(money(c.D))}.</span>`,
        lines: [{ l: "Deductions", r: K("ded", money(c.D)), n: "RRSP savings", keep: 1 }] },
      { t: "Taxable income", w: ["taxable"], say: `<span>Tax is only figured on what is left: ${B(money(c.T))}. The grey part is never taxed.</span>`,
        lines: [{ l: "Taxable income", r: `${K("gr", money(c.G))}${OP("−")}${K("ded", money(c.D))}`, n: "Gross income − deductions" },
                { l: "", r: K("gr", money(c.T)), keep: 1, cl: "Taxable income" }] },
      { t: "Federal tax brackets", w: ["bracket"], say: two
          ? `<span>Cut the taxable income into slices. Only the dollars above ${B(edgeF)} are taxed at ${B(pct(c.fs[1].r))}. The first ${B(edgeF)} is still taxed at ${B(pct(c.fs[0].r))}.</span>`
          : `<span>Cut the taxable income into slices. All of it fits in the first slice, so all of it is taxed at ${B(pct(c.fs[0] ? c.fs[0].r : P.fed[0][1]))}.</span>`,
        lines: bracketLines(c.fs, "Federal bracket tax", c.fb) },
      { t: "Alberta tax brackets", w: ["prov"], say: `<span>Alberta taxes the same income again, with its own slices. Its first slice is ${B(money(P.ab[0][0]))} at ${B(pct(P.ab[0][1]))}.</span>`,
        lines: bracketLines(c.as, "Alberta bracket tax", c.ab) },
      { t: "Tax credits", w: ["credit"], say: `<span>A deduction lowers your income. A credit lowers your tax. Everyone gets a basic personal amount, and CPP and EI paid count too.</span>`,
        lines: [{ l: "Federal amounts", r: `${money(P.fedBPA)}${OP("+")}${K("cpp", money(c.cpp))}${OP("+")}${K("ei", money(c.ei))}`, n: "Basic amount + CPP + EI" },
                { l: "", r: money(c.fca) },
                { l: "Federal credit", r: `${rd(P.fed[0][1])}${OP("×")}${money(c.fca)}`, n: `<span>Lowest federal rate, ${B(pct(P.fed[0][1]))}</span>` },
                { l: "", r: K("cr", money(c.fcr)), keep: 1, cl: "Federal credit" },
                { l: "Alberta amounts", r: `${money(P.abBPA)}${OP("+")}${K("cpp", money(c.cpp))}${OP("+")}${K("ei", money(c.ei))}`, n: "Basic amount + CPP + EI" },
                { l: "", r: money(c.aca) },
                { l: "Alberta credit", r: `${rd(P.ab[0][1])}${OP("×")}${money(c.aca)}`, n: `<span>Lowest Alberta rate, ${B(pct(P.ab[0][1]))}</span>` },
                { l: "", r: K("cr", money(c.acr)), keep: 1, cl: "Alberta credit" }] },
      { t: "Tax owed", w: ["owed"], say: `<span>Take each credit off its tax, then add federal and Alberta. Tax owed for the year: ${B(money(c.owed))}.</span>`,
        lines: [{ l: "Federal tax", r: `${K("tax", money(c.fb))}${OP("−")}${K("cr", money(c.fcr))}`, n: c.fb - c.fcr < 0 ? "Bracket tax − credit, but not below 0" : "Bracket tax − credit" },
                { l: "", r: money(c.ft) },
                { l: "Alberta tax", r: `${K("tax", money(c.ab))}${OP("−")}${K("cr", money(c.acr))}`, n: c.ab - c.acr < 0 ? "Bracket tax − credit, but not below 0" : "Bracket tax − credit" },
                { l: "", r: money(c.at) },
                { l: "Tax owed", r: `${money(c.ft)}${OP("+")}${money(c.at)}`, n: "Federal + Alberta" },
                { l: "", r: K("tax", money(c.owed)), keep: 1, cl: "Tax owed" }] },
      { t: c.diff > 0 ? "Refund" : c.diff < 0 ? "Balance owing" : "Even", w: ["paid", c.diff < 0 ? "owe" : "refund"],
        say: c.diff > 0 ? `<span>The pay stubs took off ${B(money(c.paid))}, but only ${B(money(c.owed))} is owed. The extra ${B(money(c.diff))} comes back as a refund.</span>`
          : c.diff < 0 ? `<span>The pay stubs took off ${B(money(c.paid))}, but ${B(money(c.owed))} is owed. The other ${B(money(-c.diff))} is a balance owing.</span>`
          : `<span>The pay stubs took off exactly what is owed. No refund, nothing owing.</span>`,
        lines: [{ l: "Difference", r: `${K("tax", money(c.paid))}${OP("−")}${K("tax", money(c.owed))}`, n: "Tax paid − tax owed" },
                Object.assign({}, resultLine)] },
      { t: "Marginal and average rate", w: ["marg", "avg"],
        say: `<span>The next dollar earned is taxed at ${B(pct(c.marg))}, but the whole income is taxed at only ${B(pct(Math.round(c.avg * 1000) / 1000))} on average.</span>`,
        lines: [{ l: "Marginal rate", r: `${pct(c.topF)}${OP("+")}${pct(c.topA)}`, n: "Federal + Alberta, top slices" },
                { l: "", r: pct(c.marg), keep: 1, cl: "Marginal rate" },
                { l: "Average rate", r: fr(K("tax", money(c.owed)), K("gr", money(c.G))), n: "Tax owed over gross income" },
                { l: "", r: rd(Math.round(c.avg * 10000) / 10000) },
                { l: "", r: pct(Math.round(c.avg * 1000) / 1000), keep: 1, cl: "Average rate" }] }
    ];
  }

  // ---------- the picture ----------
  // One row: a label and a bar whose width is its share of the scale. segs: [{v, s (class), t (text inside)}].
  function row(label, scale, segs, keys, extra) {
    const tot = segs.reduce((t, x) => t + x.v, 0);
    const w = scale > 0 ? Math.max(0.5, Math.min(100, tot / scale * 100)) : 0;
    const inner = segs.filter(x => x.v > 0).map(x => {
      const share = x.v / scale;
      const txt = x.t && share * 100 >= Math.max(7, String(x.t).replace(/<[^>]+>/g, "").length * 1.3) ? x.t : "";
      return `<div class="${x.s}" style="flex:${x.v} 1 0">${txt}</div>`;
    }).join("");
    return `<div class="brow"><div class="bl">${label}</div><div class="track"><div class="fill${extra ? " " + extra : ""}" style="width:${w}%">${inner}</div></div>${
      keys ? `<div class="bkeys">${keys}</div>` : ""}</div>`;
  }
  const key = (k, v, label) => `<span class="k-${k}">${B(v)} ${label}</span>`;
  function bracketRow(name, sl, scale, hot) {
    return row(name, scale, sl.map((s, i) => ({ v: s.amt, s: "b" + Math.min(i, 5) + (hot && i === sl.length - 1 ? " hot" : ""), t: pct(s.r) })),
      sl.map(s => `<span class="k-tax">${B(pct(s.r))} → ${B(money(s.tax))}</span>`).join(""));
  }
  function picture(view, c, s) {
    if (s === 0) return "";
    if (view === "stub") {
      const rest = r2(c.G - (s >= 2 ? c.cpp : 0) - (s >= 3 ? c.ei : 0) - (s >= 4 ? c.paid : 0));
      const segs = [{ v: Math.max(0, rest), s: s >= 5 ? "s-net" : "s-gr", t: s >= 5 ? money(c.net) : money(rest) }];
      if (s >= 2) segs.push({ v: c.cpp, s: "s-cpp", t: "CPP" });
      if (s >= 3) segs.push({ v: c.ei, s: "s-ei", t: "EI" });
      if (s >= 4) segs.push({ v: c.paid, s: "s-tax", t: money(c.paid) });
      const keys = [key("gr", money(c.G), "gross")];
      if (s >= 2) keys.push(key("cpp", money(c.cpp), "CPP"));
      if (s >= 3) keys.push(key("ei", money(c.ei), "EI"));
      if (s >= 4) keys.push(key("tax", money(c.paid), "income tax"));
      if (s >= 5) keys.push(key("net", money(c.net), "net pay"));
      let h = row(s >= 5 ? "Gross pay" : "Gross income", c.G, segs, keys.join(""));
      if (s >= 6) h += row("26 paycheques", c.G, [{ v: Math.max(0, c.net), s: "s-net pays", t: "" }], key("net", money(c.per), "each"));
      return h;
    }
    if (s <= 5 || s === 9) {
      const segs = s >= 2 ? [{ v: c.T, s: "s-gr", t: s >= 3 ? money(c.T) : "" }, { v: c.D, s: "s-ded", t: "" }] : [{ v: c.G, s: "s-gr", t: money(c.G) }];
      const keys = s >= 2 ? key("gr", money(c.G), "gross") + key("ded", money(c.D), "deductions") + (s >= 3 ? key("gr", money(c.T), "taxable") : "") : "";
      // Step 9 keeps only the bracket rows, with the top slices outlined (the next dollar lands there).
      let h = s === 9 ? "" : row(s >= 3 ? "Taxable income" : "Gross income", c.G, segs, keys);
      if (s >= 4 && c.T > 0) h += bracketRow("Federal", c.fs, c.G, s === 9);
      if (s >= 5 && c.T > 0) h += bracketRow("Alberta", c.as, c.G, s === 9);
      return h;
    }
    if (s <= 7) {
      const scale = Math.max(c.fb, c.ab, 1);
      return row("Federal tax", scale, [{ v: c.ft, s: "s-tax", t: s >= 7 ? money(c.ft) : "" }, { v: Math.min(c.fcr, c.fb), s: "s-cr", t: "credit" }],
               key("tax", money(c.fb), "bracket tax") + key("cr", money(c.fcr), "credit") + (s >= 7 ? key("tax", money(c.ft), "owed") : ""))
        + row("Alberta tax", scale, [{ v: c.at, s: "s-tax", t: s >= 7 ? money(c.at) : "" }, { v: Math.min(c.acr, c.ab), s: "s-cr", t: "credit" }],
               key("tax", money(c.ab), "bracket tax") + key("cr", money(c.acr), "credit") + (s >= 7 ? key("tax", money(c.at), "owed") : ""));
    }
    // s === 8: tax paid next to tax owed; the gap is the refund or the balance owing.
    const scale = Math.max(c.paid, c.owed, 1);
    const paidSegs = c.diff > 0 ? [{ v: c.owed, s: "s-tax", t: "" }, { v: c.diff, s: "s-net", t: money(c.diff) }] : [{ v: c.paid, s: "s-tax", t: money(c.paid) }];
    const owedSegs = c.diff < 0 ? [{ v: c.paid, s: "s-tax", t: "" }, { v: -c.diff, s: "s-owe", t: money(-c.diff) }] : [{ v: c.owed, s: "s-tax", t: money(c.owed) }];
    return row("Tax paid", scale, paidSegs, key("tax", money(c.paid), "paid") + (c.diff > 0 ? key("net", money(c.diff), "refund") : ""))
      + row("Tax owed", scale, owedSegs, key("tax", money(c.owed), "owed") + (c.diff < 0 ? key("owe", money(-c.diff), "balance owing") : ""));
  }

  // ---------- state ----------
  let mode = "learn", view = "stub", step = 0, lastShown = 0;
  let q = { name: "Maya", G: 68000, D: 3000, paid: paidFor(68000, 0) };
  const NAMES = ["Sam", "Maya", "Liam", "Priya", "Noah", "Aiyana", "Owen", "Sofia", "Ethan", "Amara", "Jonah", "Mei"];
  const GROSS = [32000, 38000, 42000, 45000, 48000, 52000, 56000, 60000, 64000, 68000, 72000, 76000, 85000];
  const DEDS = [500, 1000, 1500, 2000, 2500, 3000, 4000, 5000];
  const OFFS = [-600, -400, -200, 0, 0, 200, 300, 500];
  function newExample(gList) {
    let n;
    do {
      const G = pick(gList || GROSS);
      n = { name: pick(NAMES), G, D: pick(DEDS), paid: paidFor(G, pick(OFFS)) };
    } while (n.G === q.G && n.D === q.D);
    q = n;
  }

  // ---------- practice questions: each is the next step of a walk-through ----------
  // view, step shown before, step that answers it.
  const PQ = {
    cpp:     { view: "stub", before: 1, at: 2, lbl: "CPP", k: "cpp", val: c => c.cpp, hint: "CPP = 0.0595 × (gross income − $3 500)" },
    net:     { view: "stub", before: 4, at: 5, lbl: "Net pay", k: "net", val: c => c.net, hint: "Net pay = gross − CPP − EI − income tax" },
    taxable: { view: "ret", before: 2, at: 3, lbl: "Taxable income", k: "gr", val: c => c.T, hint: "Taxable income = gross income − deductions" },
    fed:     { view: "ret", before: 3, at: 4, lbl: "Federal bracket tax", k: "tax", val: c => c.fb, hint: "14% on the first $58 500, then 20.5% on the rest. Add the slices." },
    refund:  { view: "ret", before: 7, at: 8, lbl: "Amount", k: "tax", val: c => Math.abs(c.diff), hint: "Compare tax paid with tax owed. Find the difference." }
  };
  let pq = "refund", pr = { right: 0, total: 0, done: false, choice: "" };

  // ---------- drawing ----------
  let warnMsg = "";
  const curView = () => mode === "practice" ? PQ[pq].view : view;
  const stepsOf = (v, c) => v === "stub" ? stubSteps(c) : retSteps(c);
  function storyHtml(c) {
    const who = `<span class="who">${q.name}</span>`;
    if (mode === "learn") return view === "stub"
      ? `<span>${who} earns ${K("gr", money(c.G))} a year at a job in Alberta. How much is taken off, and how much does ${who} take home?</span>`
      : `<span>${who} earned ${K("gr", money(c.G))} and saved ${K("ded", money(c.D))} in an RRSP. The pay stubs took off ${K("tax", money(c.paid))} in income tax. Refund or balance owing?</span>`;
    if (pq === "cpp") return `<span>${who} earns ${K("gr", money(c.G))} a year. How much CPP is taken off?</span>`;
    if (pq === "net") return `<span>${who} earns ${K("gr", money(c.G))}. The pay stubs take off ${K("cpp", money(c.cpp))} CPP, ${K("ei", money(c.ei))} EI and ${K("tax", money(c.paid))} income tax. Find the net pay for the year.</span>`;
    if (pq === "taxable") return `<span>${who} earned ${K("gr", money(c.G))} and has ${K("ded", money(c.D))} in deductions. Find the taxable income.</span>`;
    if (pq === "fed") return `<span>${who} has a taxable income of ${K("gr", money(c.T))}. Find the federal tax on the brackets, before credits.</span>`;
    return `<span>${who} owes ${K("tax", money(c.owed))} in tax for the year. The pay stubs already took off ${K("tax", money(c.paid))}. Refund or balance owing? How much?</span>`;
  }
  function render() {
    const learn = mode === "learn", v = curView();
    $("#learn").hidden = !learn; $("#practice").hidden = learn; $("#viewCard").hidden = !learn;
    $$("#modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
    $$("#views button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
    $("#fldD").hidden = v === "stub";
    $("#lblP").textContent = v === "stub" ? "Income tax taken off" : "Tax paid on pay stubs";
    for (const [id, k] of [["#inG", "G"], ["#inD", "D"], ["#inP", "paid"]]) {
      const el = $(id); el.readOnly = !learn;
      if (document.activeElement !== el) el.value = grp(mnum(q[k]));
    }
    const w = $("#warn"); w.hidden = !warnMsg; w.textContent = warnMsg;
    if (warnMsg) { $("#sofar").hidden = true; $("#pic").innerHTML = ""; $("#work").innerHTML = ""; $("#say").innerHTML = ""; $("#sttl").textContent = ""; $("#steplbl").textContent = ""; $("#story").innerHTML = ""; return; }

    const c = calc(q.G, q.D, q.paid);
    $("#story").innerHTML = storyHtml(c);
    const S = stepsOf(v, c), total = S.length;
    // Practice hides the line that gives the answer away until Show me (or a correct answer).
    $("#pic").innerHTML = picture(v, c, step);
    // Past steps shrink to their answers in the "So far" strip; the work area shows only the current step.
    const past = [];
    S.slice(0, Math.max(0, step - 1)).forEach(st => st.lines.filter(r => r.keep).forEach(r => past.push(r)));
    $("#sofar").hidden = !past.length;
    $("#sofar").innerHTML = past.map(r => `<span><span class="sl">${r.cl || r.l}</span> ${r.r}</span>`).join("");
    const nw = step > lastShown ? " new" : "";
    $("#work").innerHTML = step === 0 ? "" : S[step - 1].lines.map(r =>
      `<div class="l${nw}">${r.l}</div><div class="e${nw}">=</div><div class="r${nw}">${r.r}</div><div class="n${nw}">${r.n || ""}</div>`).join("");

    // Words: every word met so far, newest first and highlighted.
    const met = [];
    S.slice(0, step).forEach((st, i) => st.w.forEach(k => met.unshift([k, i + 1 === step])));
    $("#words").innerHTML = met.length
      ? met.map(([k, now]) => `<li class="k-${WORDS[k][0]}${now ? " now" : ""}"><b>${WORDS[k][1]}</b><span>${WORDS[k][2]}</span></li>`).join("")
      : `<li class="k-gr"><span>New words appear here, one step at a time.</span></li>`;

    if (learn) {
      $("#steplbl").textContent = step === 0 ? "Start" : `Step ${step} of ${total}`;
      $("#sttl").textContent = step === 0 ? (v === "stub" ? "Pay stub" : "Tax return") : S[step - 1].t;
      $("#say").innerHTML = step === 0
        ? (v === "stub" ? "<span>A pay stub shows what is taken off your pay before you get it. Press Next step.</span>"
                        : "<span>A tax return checks if the right amount of tax was paid for the year. Press Next step.</span>")
        : S[step - 1].say;
      $("#next").disabled = step >= total; $("#back").disabled = step === 0; $("#all").disabled = step >= total;
    } else {
      $("#ansLbl").textContent = PQ[pq].lbl; $("#ansLbl").className = "k-" + PQ[pq].k;
      $("#choice").hidden = pq !== "refund";
      $$("#choice button").forEach(b => b.classList.toggle("on", b.dataset.c === pr.choice));
      $("#showme").disabled = step >= PQ[pq].at;
    }
    lastShown = step;
    fit();
    requestAnimationFrame(fit);   // again once the French switch has swapped the words
  }

  // Shrink the work until it fits the board.
  function fit() {
    const el = $("#work");
    if (window.innerWidth <= 860 || window.innerHeight < 520) { el.style.removeProperty("--wf"); return; }
    let f = 34; el.style.setProperty("--wf", f + "px");
    while (f > 14 && (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)) { f -= 1; el.style.setProperty("--wf", f + "px"); }
  }

  // ---------- Learn: typing in the boxes ----------
  function readInputs() {
    const G = num($("#inG").value), D = num($("#inD").value), paid = num($("#inP").value);
    $("#inG").classList.toggle("bad", !(G > 0)); $("#inD").classList.toggle("bad", !(D >= 0 && D < G)); $("#inP").classList.toggle("bad", !(paid >= 0));
    if (!(G > 0 && G <= 1000000 && D >= 0 && D < G && paid >= 0 && paid < G)) { warnMsg = "Type an income greater than 0, with deductions and tax paid smaller than the income."; render(); return; }
    warnMsg = "";
    q = { name: q.name, G: r2(G), D: r2(D), paid: r2(paid) };
    render();
  }
  ["#inG", "#inD", "#inP"].forEach(id => {
    $(id).addEventListener("input", () => { if (mode === "learn") { lastShown = step; readInputs(); } });
    $(id).addEventListener("change", () => { if (mode === "learn" && !warnMsg) render(); });
  });

  // ---------- buttons ----------
  const totalSteps = () => stepsOf(curView(), calc(q.G, q.D, q.paid)).length;
  $("#next").onclick = () => { if (step < totalSteps()) { step++; render(); } };
  $("#back").onclick = () => { if (step > 0) { step--; lastShown = step; render(); } };
  $("#all").onclick = () => { step = totalSteps(); render(); };
  $("#newex").onclick = () => { newExample(); warnMsg = ""; step = 0; lastShown = 0; render(); };
  $$("#modes button").forEach(b => b.onclick = () => {
    if (mode === b.dataset.mode) return;
    mode = b.dataset.mode; warnMsg = "";
    if (mode === "practice") startPractice(); else { step = 0; lastShown = 0; render(); }
  });
  $$("#views button").forEach(b => b.onclick = () => { view = b.dataset.view; step = 0; lastShown = 0; render(); });

  // ---------- Practice ----------
  const ORDER = ["cpp", "net", "taxable", "fed", "refund"];
  function startPractice() {
    // Cycle through the five kinds so a class sees each one.
    pq = ORDER[(ORDER.indexOf(pq) + 1) % ORDER.length];
    let c;
    do {
      newExample(pq === "fed" ? [64000, 68000, 72000, 76000, 85000, 95000] : GROSS);
      c = calc(q.G, q.D, q.paid);
    } while (pq === "refund" && Math.abs(c.diff) < 1);
    step = PQ[pq].before; lastShown = step; pr.done = false; pr.choice = "";
    $("#ans").value = ""; $("#ans").classList.remove("bad", "ok"); $("#choice").classList.remove("bad");
    $("#fb").textContent = ""; $("#fb").className = "fb";
    render();
  }
  function feedback(c, g) {
    const near = (a, b) => Math.abs(a - b) < 0.006;
    const want = PQ[pq].val(c);
    if (pq === "refund") {
      const rightC = c.diff > 0 ? "refund" : "owe";
      const okC = pr.choice === rightC, okA = near(g, want);
      if (!pr.choice) return [false, "Choose Refund or Balance owing."];
      if (!okC) return [false, c.diff > 0 ? "More tax was paid than is owed, so money comes back: a refund." : "Less tax was paid than is owed, so money is still owed: a balance owing."];
      if (!okA) return [false, "Find the difference: tax paid − tax owed."];
      return [true, ""];
    }
    if (near(g, want)) return [true, ""];
    if (pq === "cpp" && near(g, r2(c.G * P.cppRate))) return [false, "First take off the $3 500 that has no CPP."];
    if (pq === "net" && near(g, r2(c.G - c.cpp - c.ei))) return [false, "Also take off the income tax."];
    if (pq === "taxable" && near(g, r2(c.G + c.D))) return [false, "Deductions are taken off, not added."];
    if (pq === "fed" && c.fs.length > 1 && near(g, r2(c.T * c.fs[c.fs.length - 1].r))) return [false, "Only the part above $58 500 is taxed at 20.5%. Each slice has its own rate."];
    if (pq === "fed" && near(g, r2(c.T * c.fs[0].r))) return [false, "The part above $58 500 is taxed at 20.5%, not 14%."];
    return [false, "Not quite. Try Hint."];
  }
  $$("#choice button").forEach(b => b.onclick = () => { pr.choice = b.dataset.c; $("#choice").classList.remove("bad"); render(); });
  $("#check").onclick = () => {
    const c = calc(q.G, q.D, q.paid), g = num($("#ans").value);
    if (isNaN(g)) { $("#fb").className = "fb no"; $("#fb").textContent = "Type your answer in the box."; return; }
    const [ok, msg] = feedback(c, g);
    $("#ans").classList.toggle("ok", ok); $("#ans").classList.toggle("bad", !ok);
    $("#choice").classList.toggle("bad", pq === "refund" && !ok && pr.choice !== (c.diff > 0 ? "refund" : "owe"));
    if (!pr.done) { pr.total++; if (ok) pr.right++; pr.done = true; }
    $("#right").textContent = pr.right; $("#total").textContent = pr.total;
    $("#fb").className = "fb " + (ok ? "ok" : "no");
    $("#fb").textContent = ok ? "Correct!" : msg;
    if (ok) { step = PQ[pq].at; render(); }
  };
  $("#ans").addEventListener("keydown", e => { if (e.key === "Enter") $("#check").click(); });
  $("#hint").onclick = () => { $("#fb").className = "fb hint"; $("#fb").textContent = PQ[pq].hint; };
  $("#showme").onclick = () => { step = PQ[pq].at; render(); };
  $("#newq").onclick = startPractice;

  window.addEventListener("resize", fit);
  window.addEventListener("langchange", render);
  render();
})();
</script>

</script>
<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
