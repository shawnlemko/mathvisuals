<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Linear Contexts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* Linear Contexts: a table of values on the left, plotted as ordered pairs on a first-quadrant grid.
   Headings are editable (e.g. n and C) and name the axes. Each axis has its own scale and max inputs;
   the grid grows past the largest value so points never sit on the edge. */
.wrap { max-width: 1400px; }
.lc { display: grid; grid-template-columns: minmax(300px, 470px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .lc { grid-template-columns: 1fr; } }
/* Fit the window: the table scrolls inside its card, Draw line stays in view. */
@media (min-width: 861px) and (min-height: 520px) { .lc > .card { display: flex; flex-direction: column; overflow: hidden; } .tvs { flex: 1 1 auto; min-height: 0; overflow-y: auto; } .fit { flex: none; } }
table.tv { width: 100%; border-collapse: collapse; font-family: var(--font-num); }
.tv th, .tv td { border: 2px solid var(--grid-major); padding: 0; }
.tv th { background: var(--chip); }
.tv input { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink); text-align: center; padding: 8px 6px; }
.tv th input { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 2rem; color: var(--pt); }
.tv td input { font-family: var(--font-num); font-weight: 700; font-size: 1.7rem; }
.tv input:focus-visible { outline: 3px solid var(--pt); outline-offset: -3px; }
.tv input.bad { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
/* The plot keeps its shape and fits the screen height, so the whole grid shows on a projector. */
.plot { position: relative; width: min(100%, calc((100vh - 130px) * 860 / 760)); min-width: min(100%, 480px); margin: 0 auto; }
.scale { position: absolute; display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--muted); font-size: 1.05rem; white-space: nowrap; }
.scale label { display: flex; align-items: center; gap: 6px; } .scale label + label { margin-left: 10px; }
.scale input::placeholder { color: var(--muted); opacity: 0.7; }
#syBox { left: 4px; top: 2px; } #sxBox { right: 4px; bottom: 2px; }
.scale input { width: 4em; font-family: var(--font-num); font-weight: 700; font-size: 1.3rem; text-align: center; color: var(--ink); background: var(--sheet); border: 2px solid var(--grid-major); border-radius: 6px; padding: 2px 4px; }
.g-line { stroke: var(--grid); stroke-width: 1; }
.g-axis { stroke: var(--ink); stroke-width: 3; }
.g-tick { fill: var(--ink); font-family: var(--font-num); font-size: 22px; font-weight: 700; }
.g-name { fill: var(--pt); font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 34px; }
.g-pt { fill: var(--pt); stroke: var(--sheet); stroke-width: 3; }
.fit { margin-top: 16px; text-align: center; }
.fit button { width: 100%; font-family: var(--font-display); font-size: 1.4rem; padding: 12px 16px; background: var(--pt); color: var(--sheet); border-color: var(--pt); }
.fit button:hover { background: var(--sheet); color: var(--pt); }
.fit p { margin: 12px 0 0; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; color: var(--warn); }
.g-fit { stroke: var(--orange); stroke-width: 4; stroke-linecap: round; }
.g-pt.hit { fill: var(--green); transform-box: fill-box; transform-origin: center; }
.g-pair.hit { fill: var(--green); }
/* Build function: the start value (green) and the rate of change (orange) build y = mx + b one step at a time. */
.fit button.alt { margin-top: 10px; background: var(--sheet); color: var(--pt); }
.fit button.alt:hover { background: var(--chip); }
.fn { margin-top: 12px; text-align: left; }
.fn-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 2px; }
.fn-cap { font-weight: 700; color: var(--muted); font-size: 1rem; }
.fn-val { font-family: var(--font-num); font-weight: 700; font-size: 1.35rem; }
.fn-row.start .fn-val { color: var(--green); } .fn-row.rate .fn-val { color: var(--orange); }
.fn-row.bad .fn-val, .fn-row.bad .fn-cap { color: var(--warn); }
.fn-eq { margin-top: 8px; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; padding: 6px 8px; border: 2px solid var(--grid-major); border-radius: 10px; overflow-wrap: anywhere; }
.fn-eq.long { font-size: 1.4rem; }
.fn-eq i { font-style: italic; color: var(--pt); }
.e-rate { color: var(--orange); } .e-start { color: var(--green); }
.e-blank { display: inline-block; width: 1.4em; height: 1em; vertical-align: -0.1em; border: 2px dashed var(--muted); border-radius: 6px; }
.g-run, .g-rise { stroke: var(--orange); stroke-width: 4; stroke-linecap: round; }
.g-back { stroke: var(--green); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 8; }
.g-run.bad, .g-rise.bad { stroke: var(--warn); }
.mk-rate { fill: var(--orange); } .mk-back { fill: var(--green); } .mk-bad { fill: var(--warn); }
.g-dlab { font-family: var(--font-num); font-size: 24px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 6px; stroke-linejoin: round; }
.g-dlab.rate { fill: var(--orange); } .g-dlab.back { fill: var(--green); } .g-dlab.bad { fill: var(--warn); }
.g-start { fill: none; stroke: var(--green); stroke-width: 5; transform-box: fill-box; transform-origin: center; }
.g-startpt { fill: var(--green); stroke: var(--sheet); stroke-width: 3; }
/* Development column (Shawn): each row written as start value + rate × input, ending in the equation. */
.tv th.dev, .tv td.dev { font-family: var(--font-num); font-weight: 700; font-size: 1.25rem; padding: 0 8px; white-space: nowrap; text-align: left; }
.tv th.dev { font-family: var(--font-display); font-style: italic; font-size: 1.6rem; color: var(--pt); }
.tv td.dev .s { color: var(--green); } .tv td.dev .r { color: var(--orange); }
.deq { margin: 10px 0 0; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; }
.deq i { color: var(--pt); } .deq .s { color: var(--green); } .deq .r { color: var(--orange); }
.g-pair { fill: var(--pt); font-family: var(--font-num); font-size: 22px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 6px; stroke-linejoin: round; }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>Linear Contexts</h1></div>
  </header>

  <div class="lc">
    <div class="card">
      <div class="tvs"><table class="tv">
        <thead><tr>
          <th><input id="hx" value="x" maxlength="12" aria-label="First column heading (horizontal axis)"></th>
          <th><input id="hy" value="y" maxlength="12" aria-label="Second column heading (vertical axis)"></th>
          <th class="dev" id="hdev">y =</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div class="deq" id="deq" aria-live="polite" hidden></div>
      <div class="fit">
        <button type="button" id="fitBtn" aria-pressed="false">Draw line</button>
        <p id="fitNote" aria-live="polite" hidden>Not linear</p>
        <button type="button" id="buildBtn" class="alt">Build function</button>
        <div class="fn" id="fn" aria-live="polite" hidden></div>
      </div>
    </div>
    <div class="board" id="board">
      <div class="plot">
        <svg id="svg" role="img" aria-label="First-quadrant grid showing the table values as ordered pairs"></svg>
        <div class="scale" id="sxBox"><label>scale <input id="sx" type="number" min="0" step="any" value="1" aria-label="Horizontal axis scale"></label><label>max <input id="mx" type="number" min="0" step="any" aria-label="Horizontal axis maximum (blank fits the values)"></label></div>
        <div class="scale" id="syBox"><label>scale <input id="sy" type="number" min="0" step="any" value="1" aria-label="Vertical axis scale"></label><label>max <input id="my" type="number" min="0" step="any" aria-label="Vertical axis maximum (blank fits the values)"></label></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    parent.appendChild(e);
    return e;
  };
  // Plain decimals without float noise (0.1 + 0.2 shows as 0.3).
  const num = v => String(+v.toFixed(6));

  // Plot area inside the SVG viewBox.
  const W = 860, H = 760, L = 110, R = 40, T = 70, B = 120;
  const PW = W - L - R, PH = H - T - B;
  const svg = $("svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  // Table: always at least MIN rows, and one blank row after the last filled one.
  const MIN = 8, rows = $("rows");
  function addRow() {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input inputmode="decimal" autocomplete="off"></td><td><input inputmode="decimal" autocomplete="off"></td><td class="dev"></td>`;
    rows.appendChild(tr);
  }
  for (let i = 0; i < MIN; i++) addRow();
  const filled = tr => [...tr.querySelectorAll("input")].some(i => i.value.trim() !== "");
  function tidyRows() {
    if (filled(rows.lastElementChild)) addRow();
  }

  // A cell is a number, blank, or bad (not a number, or negative: this grid is the first quadrant).
  function parse(input) {
    const s = input.value.trim().replace("−", "-");
    if (s === "") { input.classList.remove("bad"); return null; }
    const v = Number(s);
    const ok = Number.isFinite(v) && v >= 0;
    input.classList.toggle("bad", !ok);
    return ok ? v : undefined;
  }

  // Grid extent per axis: at least 10 squares, and always one square of room past the largest value.
  const squaresFor = (maxV, step) => Math.max(10, Math.ceil(maxV / step + 1 - 1e-9));
  // Label every k-th line, k from 1, 2, 5, 10, ... so labels never crowd each other.
  const kFor = (pxPerSquare, need) => { for (const k of [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000]) if (pxPerSquare * k >= need) return k; return 1000; };

  function scaleOf(id) {
    const v = Number($(id).value);
    const ok = Number.isFinite(v) && v > 0;
    $(id).classList.toggle("bad", !ok);
    return ok ? v : 1;
  }

  // A typed max sets where the axis ends (blank fits the values). Points beyond it still grow the grid so none disappear.
  function squaresWith(id, maxV, step) {
    const auto = squaresFor(maxV, step), v = Number($(id).value), blank = $(id).value.trim() === "";
    const ok = blank || (Number.isFinite(v) && v > 0);
    $(id).classList.toggle("bad", !ok);
    $(id).placeholder = num(auto * step);
    if (blank || !ok) return auto;
    return Math.max(1, Math.ceil(v / step - 1e-9), Math.ceil(maxV / step + 1 - 1e-9) * (maxV > v ? 1 : 0));
  }

  // ---- Build function (Shawn): animate how the start value and the rate of change make the function ----
  // build = how many steps are showing. With n = 0 in the table the start value comes first;
  // otherwise the rate comes first, then the table is walked back to n = 0 to find the start value.
  let build = 0, animStep = null;
  const MINUS = "−";
  // Numbers as written on the board: up to 4 decimals, otherwise a fraction like 1/3; a real minus sign.
  function fmt(v) {
    let s = null;
    if (Math.abs(v * 1e4 - Math.round(v * 1e4)) < 1e-6) s = num(v);
    else for (let q = 2; q <= 12 && s == null; q++) if (Math.abs(v * q - Math.round(v * q)) < 1e-6) s = `${Math.round(v * q)}/${q}`;
    return (s ?? num(+v.toFixed(3))).replace("-", MINUS);
  }
  const signed = v => (v > 0 ? "+" : "") + fmt(v);
  const paren = v => v < 0 ? `(${fmt(v)})` : fmt(v);
  const same = (a, b) => Math.abs(a - b) <= 1e-6 * (1 + Math.abs(a) + Math.abs(b));

  // Table sorted by x; the change between each row and the next; linear when every change has the same rate.
  function model(pts) {
    const rowsX = [];
    let twoValues = null;
    for (const p of [...pts].sort((a, b) => a.x - b.x)) {
      const q = rowsX[rowsX.length - 1];
      if (q && same(q.x, p.x)) { if (!same(q.y, p.y)) twoValues = p.x; continue; }
      rowsX.push(p);
    }
    const pairs = rowsX.slice(1).map((p, i) => ({ a: rowsX[i], b: p, run: p.x - rowsX[i].x, rise: p.y - rowsX[i].y }));
    pairs.forEach(q => q.rate = q.rise / q.run);
    const m = pairs.length ? pairs[0].rate : 0;
    const linear = pairs.length > 0 && twoValues == null && pairs.every(q => same(q.rate, m));
    const first = rowsX[0], b = first ? first.y - m * first.x : 0, hasZero = !!first && same(first.x, 0);
    let steps = [];
    if (pairs.length && twoValues == null) steps = hasZero ? ["start", "rate", "fn"] : ["rate", "start", "fn"];
    if (!linear) steps = steps.slice(0, steps.indexOf("rate") + 1);
    return { rowsX, pairs, m, b, first, linear, hasZero, twoValues, steps };
  }

  // Draws the steps on the board. Only the step just added (animStep) animates.
  function drawBuild(g, md, shown, X, Y) {
    const motion = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    const defs = el("defs", {}, g);
    for (const k of ["rate", "back", "bad"]) {
      const mk = el("marker", { id: "mk-" + k, viewBox: "0 0 10 10", refX: 7, refY: 5, markerWidth: 4.5, markerHeight: 4.5, orient: "auto" }, defs);
      el("path", { d: "M0 0L10 5L0 10z", class: "mk-" + k }, mk);
    }
    const clip = el("clipPath", { id: "buildClip" }, defs);
    el("rect", { x: L - 4, y: T - 4, width: PW + 8, height: PH + 8 }, clip);
    const arrows = el("g", { "clip-path": "url(#buildClip)" }, g);
    // An arrow grows out of its start; a label fades in once its arrow is drawn.
    const arrow = (x1, y1, x2, y2, cls, mk, play, delay, dur) => {
      const a = el("line", { x1, y1, x2, y2, class: cls, "marker-end": `url(#mk-${mk})` }, arrows);
      if (play && motion) {
        a.style.transformBox = "view-box"; a.style.transformOrigin = `${x1}px ${y1}px`;
        const k = Math.abs(x2 - x1) > Math.abs(y2 - y1) ? "scaleX(0)" : "scaleY(0)";
        a.animate([{ transform: k }, { transform: "none" }], { duration: dur, delay, easing: "ease-out", fill: "backwards" });
      }
    };
    const label = (x, y, txt, cls, anchor, play, delay) => {
      const t = el("text", { x, y, class: "g-dlab " + cls, "text-anchor": anchor }, g, txt);
      if (play && motion) t.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay, fill: "backwards" });
    };
    const DOT = 15; // arrows stop short of the dots so the arrowheads show

    if (shown.has("rate")) {
      // A staircase between each row and the next: rise up (or down) first, then run across (Shawn).
      const play = animStep === "rate", per = Math.min(1100, 6000 / md.pairs.length);
      md.pairs.forEach((q, i) => {
        const ok = same(q.rate, md.m), cls = ok ? "rate" : "bad";
        const px = X(q.a.x), py = Y(q.a.y), cx = X(q.b.x), qy = Y(q.b.y), d = i * per;
        const up = qy <= py, wide = cx - px, tall = Math.abs(qy - py);
        if (tall > DOT + 8) arrow(px, py + (up ? -DOT : DOT), px, qy, "g-rise" + (ok ? "" : " bad"), ok ? "rate" : "bad", play, d, per * 0.4);
        if (wide > DOT + 8) arrow(px, qy, cx - DOT, qy, "g-run" + (ok ? "" : " bad"), ok ? "rate" : "bad", play, d + per * 0.45, per * 0.4);
        if (wide >= 44 || i === 0) {
          const right = px < L + PW - 90;
          label(px + (right ? -12 : 12), (py + qy) / 2 + 8, signed(q.rise), cls, right ? "end" : "start", play, d + per * 0.3);
          label((px + cx) / 2, qy + (up ? -14 : 30), signed(q.run), cls, "middle", play, d + per * 0.75);
        }
      });
    }
    if (shown.has("start")) {
      const play = animStep === "start", sx0 = X(0), sy0 = Y(md.b);
      let wait = 0;
      if (!md.hasZero) {
        // Walk back from the first row to n = 0 at the same rate (dashed: it is not in the table).
        const f = md.first, px = X(f.x), py = Y(f.y), up = sy0 < py, dur = 700;
        // Rise first, then run, like the staircase.
        if (Math.abs(sy0 - py) > DOT + 8) arrow(px, py + (up ? -DOT : DOT), px, sy0, "g-back", "back", play, 0, dur);
        if (px - sx0 > 30) arrow(px, sy0, sx0 + 24, sy0, "g-back", "back", play, dur, dur);
        label(px + 12, (py + sy0) / 2 + 8, signed(-f.x * md.m), "back", "start", play, dur * 0.6);
        label((px + sx0) / 2, sy0 + (up ? -14 : 30), signed(-f.x), "back", "middle", play, dur * 1.6);
        wait = dur * 2;
        el("circle", { cx: sx0, cy: sy0, r: 11, class: "g-startpt" }, g);
      }
      const ring = el("circle", { cx: sx0, cy: sy0, r: 22, class: "g-start" }, g);
      if (play && motion) ring.animate([{ transform: "scale(0)" }, { transform: "scale(1.6)", offset: 0.5 }, { transform: "scale(1)" }], { duration: 800, delay: wait, easing: "ease-out", fill: "backwards" });
      if (!md.hasZero) label(sx0 + 16, sy0 + (sy0 < T + 40 ? 34 : -14), `(0, ${fmt(md.b)})`, "back", "start", play, wait + 300);
    }
  }

  // The side panel: one row per step and the function filling in as each part is found.
  function showPanel(md, shown) {
    const box = $("fn");
    box.hidden = !build && !buildMsg;
    box.textContent = "";
    if (buildMsg) { const r = document.createElement("div"); r.className = "fn-row bad"; r.innerHTML = `<span class="fn-cap"></span>`; r.firstChild.textContent = buildMsg; box.appendChild(r); }
    const hx = $("hx").value.trim() || "x", hy = $("hy").value.trim() || "y";
    const row = (cls, cap, val) => {
      const r = document.createElement("div"); r.className = "fn-row " + cls;
      const c = document.createElement("span"); c.className = "fn-cap"; c.textContent = cap;
      const v = document.createElement("span"); v.className = "fn-val"; v.textContent = val;
      r.append(c, v); box.appendChild(r);
    };
    for (const s of md.steps) {
      if (!shown.has(s)) continue;
      if (s === "start") {
        if (md.hasZero) row("start", `Start value (${hx} = 0)`, fmt(md.b));
        else row("start", "Start value", `${fmt(md.first.y)} ${MINUS} ${fmt(md.first.x)} × ${paren(md.m)} = ${fmt(md.b)}`);
      } else if (s === "rate") {
        const q = md.pairs[0];
        if (md.linear) row("rate", "Rate of change", `${fmt(q.rise)} ÷ ${fmt(q.run)} = ${fmt(md.m)}`);
        else {
          const rates = md.pairs.map(p => fmt(p.rate)).filter((r, i, a) => a.indexOf(r) === i).slice(0, 3);
          row("rate bad", "Rate changes: not linear", rates.join(", "));
        }
      }
    }
    if (!build || !md.linear) return;
    // y = mx + b with blanks for the parts not found yet; a multi-letter heading reads "5 × hours".
    const eq = document.createElement("div"); eq.className = "fn-eq";
    const put = (txt, cls, tag = "span") => { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = txt; eq.appendChild(e); return e; };
    const knowM = shown.has("rate"), knowB = shown.has("start"), m = md.m, b = md.b;
    put(hy, "", "i"); put(" = ");
    // Start value first, then the rate, the same order as the development column: C = 5 + 2n.
    const short = hx.length === 1;
    if (!knowB) put("", "e-blank"); else put(fmt(b), "e-start");
    if (knowM && same(m, 0)) { /* no rate term */ }
    else {
      put(knowM && m < 0 ? ` ${MINUS} ` : " + ");
      if (!knowM) put("", "e-blank");
      else {
        const a = Math.abs(m), c = fmt(a);
        if (!same(a, 1)) put(short && c.includes("/") ? `(${c})` : c, "e-rate");
        if (!short && !same(a, 1)) put(" × ");
      }
      put(hx, "", "i");
    }
    eq.classList.toggle("long", eq.textContent.length > 12);
    box.appendChild(eq);
    if (animStep && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      // The part just found pops into the function; the last step pops the whole function.
      const pops = animStep === "fn" ? [eq] : eq.querySelectorAll(animStep === "rate" ? ".e-rate" : ".e-start");
      const late = animStep === "fn" ? 1200 : animStep === "start" && !md.hasZero ? 1500 : 700;
      pops.forEach(e => { if (e !== eq) e.style.display = "inline-block"; e.animate([{ transform: "scale(0.4)", opacity: 0 }, { transform: "scale(1.3)", opacity: 1, offset: 0.6 }, { transform: "scale(1)" }], { duration: 600, delay: late, easing: "ease-out", fill: "backwards" }); });
    }
  }
  let buildMsg = "";

  // Development column: once the table is linear, each row reads start + rate(input), e.g. C = 5 + 2(3),
  // and the equation under the table generalizes it: C = 5 + 2n.
  function showDev(md) {
    const hx = $("hx").value.trim() || "x", hy = $("hy").value.trim() || "y";
    $("hdev").textContent = hy + " =";
    const span = (txt, cls) => { const e = document.createElement("span"); if (cls) e.className = cls; e.textContent = txt; return e; };
    const termOf = (xTxt, isVar) => {
      const m = md.m, a = Math.abs(m), parts = [];
      if (same(m, 0)) return parts;
      parts.push(span(m < 0 ? ` ${MINUS} ` : " + "));
      const coef = fmt(a), frac = coef.includes("/");
      if (isVar) {
        if (!same(a, 1)) parts.push(span(frac ? `(${coef})` : coef, "r"));
        if (hx.length > 1 && !same(a, 1)) parts.push(span(" × "));
        parts.push(Object.assign(document.createElement("i"), { textContent: hx }));
      } else parts.push(span(frac ? `(${coef})` : coef, "r"), span(`(${xTxt})`));
      return parts;
    };
    for (const tr of rows.children) {
      const cell = tr.querySelector("td.dev"), [a, b] = tr.querySelectorAll("input");
      cell.textContent = "";
      if (!md.linear || a.value.trim() === "" || b.value.trim() === "") continue;
      const x = parse(a); if (x == null) continue;
      cell.append(span(fmt(md.b), "s"));
      if (!same(x, 0)) cell.append(...termOf(fmt(x), false));
    }
    const deq = $("deq");
    deq.hidden = !md.linear || build > 0; // while building, the panel below shows the equation deq.textContent = "";
    if (md.linear) {
      deq.append(Object.assign(document.createElement("i"), { textContent: hy }), span(" = "), span(fmt(md.b), "s"), ...termOf("", "i"));
    }
  }

  function currentPts() {
    const pts = [];
    for (const tr of rows.children) {
      const [a, b] = tr.querySelectorAll("input");
      const x = parse(a), y = parse(b);
      if (x != null && y != null) pts.push({ x, y });
    }
    return pts;
  }

  function render() {
    tidyRows();
    const pts = currentPts();
    const md = model(pts), steps = md.steps;
    showDev(md);
    if (build > steps.length) build = steps.length;
    if (!animStep) setBuildBtn(steps);
    const shown = new Set(steps.slice(0, build)), fnShown = shown.has("fn");
    const sx = scaleOf("sx"), sy = scaleOf("sy");
    const maxX = Math.max(0, ...pts.map(p => p.x));
    // While building, the grid also reaches the start value so the work-back can land on the axis.
    const maxY = Math.max(0, ...pts.map(p => p.y), build && md.linear ? md.b : 0);
    const nx = Math.min(400, squaresWith("mx", maxX, sx)), ny = Math.min(400, squaresWith("my", maxY, sy));
    const cw = PW / nx, ch = PH / ny;
    const X = v => L + v / sx * cw, Y = v => T + PH - v / sy * ch;

    svg.textContent = "";
    const g = el("g", {}, svg);
    const lx = Math.max(1, Math.ceil(4 / cw)), ly = Math.max(1, Math.ceil(4 / ch));
    for (let i = lx; i <= nx; i += lx) el("line", { x1: L + i * cw, y1: T, x2: L + i * cw, y2: T + PH, class: "g-line" }, g);
    for (let j = ly; j <= ny; j += ly) el("line", { x1: L, y1: T + PH - j * ch, x2: L + PW, y2: T + PH - j * ch, class: "g-line" }, g);
    el("line", { x1: L, y1: T + PH, x2: L + PW + 14, y2: T + PH, class: "g-axis" }, g);
    el("line", { x1: L, y1: T + PH, x2: L, y2: T - 14, class: "g-axis" }, g);

    // Tick labels: x labels need room for their width, y labels for their height.
    const wide = Math.max(num(nx * sx).length, 1) * 14 + 12;
    const kx = kFor(cw, wide), ky = kFor(ch, 26);
    el("text", { x: L - 10, y: T + PH + 30, class: "g-tick", "text-anchor": "end" }, g, "0");
    for (let i = kx; i <= nx; i += kx) el("text", { x: L + i * cw, y: T + PH + 32, class: "g-tick", "text-anchor": "middle" }, g, num(i * sx));
    for (let j = ky; j <= ny; j += ky) el("text", { x: L - 12, y: T + PH - j * ch + 8, class: "g-tick", "text-anchor": "end" }, g, num(j * sy));

    // Axis names come from the table headings.
    const hx = $("hx").value.trim() || "x", hy = $("hy").value.trim() || "y";
    el("text", { x: L + PW / 2, y: H - 30, class: "g-name", "text-anchor": "middle" }, g, hx);
    el("text", { x: 34, y: T + PH / 2, class: "g-name", "text-anchor": "middle", transform: `rotate(-90 34 ${T + PH / 2})` }, g, hy);

    // Line of best fit (least squares). "Not linear" when it misses any point.
    // Drawing order: points, then the line over them, then the ordered-pair labels on top.
    let fit = null, missed = false;
    const onLine = new Set();
    if ((showFit || fnShown) && pts.length >= 2) {
      const n = pts.length, mx = pts.reduce((a, p) => a + p.x, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;
      const sxx = pts.reduce((a, p) => a + (p.x - mx) ** 2, 0), sxy = pts.reduce((a, p) => a + (p.x - mx) * (p.y - my), 0);
      if (sxx < 1e-9 * (1 + maxX)) { // every x is the same: a vertical line through all of them
        fit = { x1: X(mx), y1: T + PH, x2: X(mx), y2: T };
        pts.forEach(p => onLine.add(p));
      } else {
        const m = sxy / sxx, c = my - m * mx, x2 = nx * sx;
        pts.forEach(p => { if (Math.abs(p.y - (m * p.x + c)) <= 1e-6 * (1 + Math.abs(p.y))) onLine.add(p); });
        missed = onLine.size < n;
        fit = { x1: X(0), y1: Y(c), x2: X(x2), y2: Y(m * x2 + c) };
      }
    }
    $("fitNote").hidden = !(showFit && missed);

    const dots = pts.map(p => el("circle", { cx: X(p.x), cy: Y(p.y), r: onLine.has(p) ? 13 : 10, class: onLine.has(p) ? "g-pt hit" : "g-pt" }, g));
    let line = null;
    if (fit) {
      const clip = el("clipPath", { id: "plotClip" }, el("defs", {}, g));
      el("rect", { x: L, y: T, width: PW, height: PH }, clip);
      line = el("line", { ...fit, class: "g-fit", "clip-path": "url(#plotClip)", pathLength: 1 }, g);
    }
    if (build) drawBuild(g, md, shown, X, Y);
    showPanel(md, shown);
    // Labels flip left or below near the right and top edges.
    for (const p of pts) {
      const px = X(p.x), py = Y(p.y);
      const left = px > L + PW - 150, below = py < T + 40;
      el("text", { x: px + (left ? -16 : 16), y: py + (below ? 34 : -14), class: onLine.has(p) ? "g-pair hit" : "g-pair", "text-anchor": left ? "end" : "start" }, g, `(${num(p.x)}, ${num(p.y)})`);
    }

    // On a button press, the line sweeps across and each point it hits pops into green as the line reaches it.
    if ((animate || animStep === "fn") && line && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const DUR = 1400, css = getComputedStyle(svg), blue = css.getPropertyValue("--pt").trim(), green = css.getPropertyValue("--green").trim();
      line.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: DUR, easing: "ease-in-out", fill: "backwards" });
      line.style.strokeDasharray = "1";
      const len = Math.hypot(fit.x2 - fit.x1, fit.y2 - fit.y1) || 1;
      pts.forEach((p, i) => {
        if (!onLine.has(p)) return;
        const along = Math.hypot(X(p.x) - fit.x1, Y(p.y) - fit.y1) / len;
        const delay = Math.min(1, along) * DUR * 0.9;
        dots[i].animate([
          { fill: blue, transform: "scale(0.77)" },
          { fill: green, transform: "scale(1.9)", offset: 0.35 },
          { fill: green, transform: "scale(0.9)", offset: 0.7 },
          { fill: green, transform: "scale(1)" }
        ], { duration: 700, delay, easing: "ease-out", fill: "backwards" });
      });
    }
  }

  // Enter moves down a column, like a spreadsheet.
  rows.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
    e.preventDefault();
    const td = e.target.parentElement, col = [...td.parentElement.children].indexOf(td);
    tidyRows();
    const next = td.parentElement.nextElementSibling;
    if (next) next.children[col].querySelector("input").focus();
  });
  let showFit = false;
  $("fitBtn").addEventListener("click", () => {
    showFit = !showFit;
    $("fitBtn").textContent = showFit ? "Hide line" : "Draw line";
    $("fitBtn").setAttribute("aria-pressed", String(showFit));
    build = 0; buildMsg = ""; setBuildBtn();
    animate = showFit; render(); animate = false;
  });
  // Build function walks one step per press; the label names the next step.
  const NAMES = { start: "start value", rate: "rate of change", fn: "the function" };
  function setBuildBtn(steps) {
    const btn = $("buildBtn");
    if (!build) btn.textContent = "Build function";
    else btn.textContent = build < steps.length ? `Next: ${NAMES[steps[build]]}` : "Clear";
  }
  $("buildBtn").addEventListener("click", () => {
    const pts = currentPts(), steps = model(pts).steps;
    buildMsg = "";
    if (!build && !steps.length) buildMsg = pts.length < 2 ? "Type at least two rows." : "One input has two outputs: not a function.";
    else if (build >= steps.length) build = 0;
    else { build++; animStep = steps[build - 1]; }
    if (showFit) { showFit = false; $("fitBtn").textContent = "Draw line"; $("fitBtn").setAttribute("aria-pressed", "false"); }
    render(); animStep = null;
    setBuildBtn(steps);
  });
  let animate = false;
  document.addEventListener("input", () => { buildMsg = ""; render(); });
  render();
})();
</script>

<script>
/* French for Linear Contexts (contexts.html). */
window.I18N_PAGE = {
 "Linear Contexts": "Contextes linéaires",
 "First column heading (horizontal axis)": "Titre de la première colonne (axe horizontal)",
 "Second column heading (vertical axis)": "Titre de la deuxième colonne (axe vertical)",
 "Draw line": "Tracer la droite",
 "Hide line": "Masquer la droite",
 "Not linear": "Non linéaire",
 "Build function": "Construire la fonction",
 "First-quadrant grid showing the table values as ordered pairs": "Quadrillage du premier quadrant montrant les valeurs du tableau en couples ordonnés",
 "scale {0}": "échelle {0}",
 "max {0}": "max {0}",
 "Horizontal axis scale": "Échelle de l’axe horizontal",
 "Horizontal axis maximum (blank fits the values)": "Maximum de l’axe horizontal (vide : s’ajuste aux valeurs)",
 "Vertical axis scale": "Échelle de l’axe vertical",
 "Vertical axis maximum (blank fits the values)": "Maximum de l’axe vertical (vide : s’ajuste aux valeurs)",
 "Type at least two rows.": "Tape au moins deux rangées.",
 "Start value": "Valeur initiale",
 "start value": "valeur initiale",
 "Rate of change": "Taux de variation",
 "rate of change": "taux de variation",
 "Rate changes: not linear": "Le taux change : non linéaire",
 "the function": "la fonction",
 "~Start value \\((.+) = 0\\)": "Valeur initiale ($1 = 0)",
 "~Next: (.+)": "Suivant : $1",
 "One input has two outputs: not a function.": "Une entrée a deux sorties : ce n’est pas une fonction."
};
</script>
<script>
/* English / French switch shared by every page (build.py adds it to each built page).
   The pages are written in English. In French, every visible string that appears in the dictionaries
   (i18n/common.js for all pages, i18n/<page>.js for one page) is swapped, and switched back for English.
   The choice is remembered across pages in localStorage ("mv-lang").

   Dictionary entries:
     "Exact text": "Texte exact"
     "Slope = {n}": "Pente = {n}"          {n} stands for any number in the live text
     "{0} over {1} Lab": "Labo {0} sur {1}" an element mixing text and child elements: {0}, {1} are its child
                                            elements in order; French may reorder them (the elements themselves move)
     "~Score: (.+)": "Pointage : $1"        a leading ~ makes the key a regular expression
   Text the page changes later is translated as it appears (a MutationObserver), so readouts stay French. */
(function () {
  const KEY = "mv-lang";
  const dict = Object.assign({}, window.I18N_COMMON || {}, window.I18N_PAGE || {});
  const res = [];
  for (const k in dict) if (k[0] === "~") res.push([new RegExp("^" + k.slice(1) + "$"), dict[k]]);
  const NUM = /(?<![{\w])[−-]?\d+(?:[.,]\d+)?(?![}])/g; // numbers, but not the {0} placeholders
  const norm = s => s.replace(/\s+/g, " ").trim();

  function tr(s) {
    const k = norm(s);
    if (!k || !/[A-Za-z]/.test(k)) return null;
    if (Object.prototype.hasOwnProperty.call(dict, k)) return dict[k];
    const nums = k.match(NUM);
    if (nums) {
      const t = dict[k.replace(NUM, "{n}")];
      if (t != null) { let i = 0; return t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
    }
    for (const [re, out] of res) {
      const m = k.match(re);
      if (m) return out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; });
    }
    // Feedback built from several sentences: translate each one.
    const parts = k.split(/(?<=[.!?])\s+(?=\S)/);
    if (parts.length > 1) {
      const t = parts.map(p => tr(p));
      if (t.every(x => x != null)) return t.join(" ");
    }
    return null;
  }
  // Keep the spaces around a text node so words do not run together.
  const wrapSpace = (orig, t) => orig.match(/^\s*/)[0] + t + orig.match(/\s*$/)[0];

  let lang = "en";
  try { lang = localStorage.getItem(KEY) === "fr" ? "fr" : "en"; } catch (e) {}

  const ATTRS = ["title", "aria-label", "placeholder", "alt"];
  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE"]);

  function doText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) return; // already ours
    n.__en = n.nodeValue;
    const t = tr(n.__en);
    if (t == null) { n.__fr = undefined; return; }
    n.__fr = wrapSpace(n.__en, t);
    n.nodeValue = n.__fr;
  }
  function undoText(n) {
    if (n.__fr !== undefined && n.nodeValue === n.__fr) n.nodeValue = n.__en;
    n.__fr = undefined;
  }

  // An element mixing words and child elements ("<b>A</b> is on the line") is matched as one template.
  function templateOf(el) {
    let hasText = false, hasEl = false, i = 0, s = "";
    for (const c of el.childNodes) {
      if (c.nodeType === 3) { s += c.nodeValue; if (/[A-Za-z]/.test(c.nodeValue)) hasText = true; }
      else if (c.nodeType === 1) { s += "{" + i++ + "}"; hasEl = true; }
    }
    return hasText && hasEl ? norm(s) : null;
  }
  function doTemplate(el) {
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) return true;
    el.__frNodes = null;
    const key = templateOf(el);
    if (!key) return false;
    let fr = dict[key];
    if (fr == null) {
      const nums = key.match(NUM), t = nums && dict[key.replace(NUM, "{n}")];
      if (t != null) { let i = 0; fr = t.replace(/\{n\}/g, () => nums[i++] ?? ""); }
      else {
        for (const [re, out] of res) { const m = key.match(re); if (m) { fr = out.replace(/\$(\d)/g, (_, d) => { const g = m[+d] ?? ""; return tr(g) ?? g; }); break; } }
        if (fr == null) return false;
      }
    }
    const orig = [...el.childNodes];
    const kids = orig.filter(c => c.nodeType === 1);
    const out = [];
    fr.split(/(\{\d+\})/).forEach(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if (m) { if (kids[+m[1]]) out.push(kids[+m[1]]); }
      else if (part) out.push(document.createTextNode(part));
    });
    const first = orig.find(c => c.nodeType === 3), last = [...orig].reverse().find(c => c.nodeType === 3);
    if (out[0] && out[0].nodeType === 3 && first) out[0].nodeValue = first.nodeValue.match(/^\s*/)[0] + out[0].nodeValue.replace(/^\s+/, "");
    const e = out[out.length - 1];
    if (e && e.nodeType === 3 && last) e.nodeValue = e.nodeValue.replace(/\s+$/, "") + last.nodeValue.match(/\s*$/)[0];
    el.__enNodes = orig;
    el.replaceChildren(...out);
    el.__frNodes = [...el.childNodes];
    kids.forEach(walk);
    return true;
  }
  function undoTemplate(el) {
    if (!el.__enNodes) return;
    if (el.__frNodes && el.__frNodes.length === el.childNodes.length && el.__frNodes.every((c, i) => c === el.childNodes[i])) el.replaceChildren(...el.__enNodes);
    el.__enNodes = el.__frNodes = null;
  }

  function doAttrs(el) {
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      const mine = el.__frAttr && el.__frAttr[a];
      if (mine !== undefined && v === mine) continue;
      const t = tr(v);
      if (t == null) continue;
      (el.__enAttr ||= {})[a] = v;
      (el.__frAttr ||= {})[a] = t;
      el.setAttribute(a, t);
    }
    if (el.tagName === "INPUT" && (el.type === "button" || el.type === "submit") && el.value) {
      const t = tr(el.value);
      if (t != null && el.value !== t) { el.__enVal = el.value; el.value = t; }
    }
  }
  function undoAttrs(el) {
    if (el.__frAttr) for (const a in el.__frAttr) if (el.getAttribute(a) === el.__frAttr[a]) el.setAttribute(a, el.__enAttr[a]);
    el.__frAttr = el.__enAttr = null;
    if (el.__enVal !== undefined) { el.value = el.__enVal; el.__enVal = undefined; }
  }

  function walk(node) {
    if (node.nodeType === 3) { doText(node); return; }
    if (node.nodeType !== 1 || node.id === "lang-switch") return;
    if (SKIP.has(node.tagName)) { if (node.tagName === "TEXTAREA") doAttrs(node); return; } // a text box's label, never what is typed
    doAttrs(node);
    if (doTemplate(node)) return;
    for (const c of [...node.childNodes]) walk(c);
  }
  function unwalk(node) {
    if (node.nodeType === 3) { undoText(node); return; }
    if (node.nodeType !== 1) return;
    undoAttrs(node);
    if (SKIP.has(node.tagName)) return;
    undoTemplate(node);
    for (const c of [...node.childNodes]) unwalk(c);
  }

  // Watch for text the page writes later (readouts, feedback, new rows) while French is on.
  let busy = false;
  const mo = new MutationObserver(recs => {
    if (busy || lang !== "fr") return;
    busy = true;
    const seen = new Set();
    for (const r of recs) {
      const t = r.type === "characterData" ? r.target : r.type === "attributes" ? r.target : r.target;
      if (r.type === "childList") { seen.add(r.target); r.addedNodes.forEach(n => seen.add(n)); }
      else seen.add(t.nodeType === 3 && t.parentNode && t.parentNode.__enNodes ? t.parentNode : t);
    }
    seen.forEach(n => { if (n.isConnected) walk(n); });
    mo.takeRecords();
    busy = false;
  });
  const watch = () => mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });

  // Canvas drawings: translate words passed to fillText / strokeText.
  const C2D = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
  if (C2D) ["fillText", "strokeText", "measureText"].forEach(fn => {
    const orig = C2D[fn];
    C2D[fn] = function (s, ...rest) { if (lang === "fr" && typeof s === "string") { const t = tr(s); if (t != null) s = t; } return orig.call(this, s, ...rest); };
  });

  let titleEn = document.title;
  function apply() {
    busy = true;
    document.documentElement.lang = lang;
    if (lang === "fr") { titleEn = document.title; const t = tr(titleEn); if (t != null) document.title = t; walk(document.body); }
    else { unwalk(document.body); document.title = titleEn; }
    mo.takeRecords();
    busy = false;
    sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    window.dispatchEvent(new CustomEvent("langchange", { detail: lang }));
  }

  // The switch: a small pill at the top centre of the page, in its own strip above the content.
  const st = document.createElement("style");
  st.textContent =
    // Room is kept above each page so the switch never sits on a title; fit-the-window pages shrink by the same amount.
    "body{padding-top:40px}@media (min-width:861px) and (min-height:520px){html body .wrap{height:calc(100vh - 40px);height:calc(100dvh - 40px)}}" +
    "#lang-switch{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;gap:2px;padding:3px;" +
    "background:var(--sheet,#fff);border:2px solid var(--grid-major,#b9c9d8);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}" +
    "#lang-switch button{font:700 .85rem var(--font-body,system-ui,sans-serif);letter-spacing:.04em;border:0;border-radius:999px;" +
    "padding:3px 12px;min-height:26px;background:transparent;color:var(--muted,#5b6b7a);cursor:pointer}" +
    "#lang-switch button[aria-pressed=true]{background:var(--pt,#2f5fd0);color:var(--sheet,#fff)}" +
    "#lang-switch button:focus-visible{outline:3px solid var(--pt,#2f5fd0);outline-offset:2px}" +
    "@media print{#lang-switch{display:none}}";
  document.head.appendChild(st);
  const sw = document.createElement("div");
  sw.id = "lang-switch";
  sw.setAttribute("role", "group");
  sw.setAttribute("aria-label", "Language / Langue");
  sw.innerHTML = '<button type="button" data-lang="en" lang="en" title="English">EN</button><button type="button" data-lang="fr" lang="fr" title="Français">FR</button>';
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(KEY, lang); } catch (err) {}
    apply();
  });
  document.body.appendChild(sw);

  window.I18N = { tr: s => (lang === "fr" ? tr(s) ?? s : s), get lang() { return lang; } };
  watch();
  if (lang === "fr") apply();
  else sw.querySelector('[data-lang="en"]').setAttribute("aria-pressed", "true"), sw.querySelector('[data-lang="fr"]').setAttribute("aria-pressed", "false");
  // Another tab switched language: follow it.
  window.addEventListener("storage", e => { if (e.key === KEY && (e.newValue === "fr" ? "fr" : "en") !== lang) { lang = e.newValue === "fr" ? "fr" : "en"; apply(); } });
})();
</script>
