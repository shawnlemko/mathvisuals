<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>3D Shapes and Nets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* MathBoard: shared look for the concept visuals.
   Layout: graph-paper board on the left, a readout panel on the right; stacks on phones.
   Concept pages link this file and add only their own small <style> if needed. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --grid: #dbe5ee;
  --grid-major: #b9c9d8;
  --ink: #1b2733;
  --muted: #5b6b7a;
  --line: #1b2733;
  --green: #1f7a5a;
  --orange: #c2571a;
  --pt: #2f5fd0;
  --pt-ring: #ffffff;
  --chip: #eaf0f6;
  --warn: #a3263c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
    --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
    --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
    --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161d; --sheet: #151f29; --grid: #1f2c38; --grid-major: #2e3f50;
  --ink: #e6edf3; --muted: #9aabbb; --line: #e6edf3;
  --green: #4cc49a; --orange: #f08a4b; --pt: #7aa2ff; --pt-ring: #151f29;
  --chip: #1d2935; --warn: #ff7d93; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Text grows a little on big screens (projectors, smartboards) so it reads from the back of the room. */
html { font-size: clamp(16px, 0.55vw + 9px, 21px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; margin-bottom: 14px; }
/* Return button and title share one row to leave the screen for the visual. */
header > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
/* Every tool page has this at the top-left, linking to index.html (the main page). */
a.main-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; min-height: 48px;
  background: var(--pt); color: var(--sheet); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
  text-decoration: none; border-radius: 10px; border: 2px solid var(--pt); flex: none; }
a.main-btn span { font-size: 1.3rem; line-height: 1; }
a.main-btn:hover { background: var(--sheet); color: var(--pt); }
a.main-btn:focus-visible { outline: 3px solid var(--pt); outline-offset: 3px; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
/* Fit the window: on laptops, projectors and tablets in landscape the page fills the screen with no scrolling.
   The visual takes all the height left under the header and scales with the window; the panel scrolls only if it must. */
@media (min-width: 861px) and (min-height: 520px) {
  body .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-block: 12px; padding-inline: 20px; }
  .wrap > * { flex: none; }
  /* The work area under the header (.main, or a tool's own grid: .stage, .bp, .lc) takes the rest of the height. */
  .wrap > :is(.main, .board, .stage, .bp, .lc) { flex: 1 1 auto; min-height: 0; }
  .wrap > :is(.main, .stage, .bp, .lc), .wrap > section > .stage { align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .wrap .board > svg { flex: 1 1 auto; min-height: 0; height: 100%; max-height: none; }
  :is(.main, .stage, .bp, .lc) > :not(.board) { overflow-y: auto; min-height: 0; }
}
.board { background: var(--sheet); border: 1px solid var(--grid-major); border-radius: 10px; padding: 8px; }
.board svg { display: block; width: 100%; height: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; min-width: 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.c-green { color: var(--green); font-weight: 700; }
.c-orange { color: var(--orange); font-weight: 700; }
.c-pt { color: var(--pt); font-weight: 700; }

/* Math readout */
.points { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-num); font-size: 1.35rem; margin-bottom: 12px; }
.points b { color: var(--pt); }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.45rem; }
.eq + .eq { margin-top: 10px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 4px 3px; }
.frac > span:last-child { padding: 3px 4px 0; }
.var { font-style: italic; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.answer { display: inline-flex; align-items: center; gap: 10px; background: var(--chip); border-radius: 8px; padding: 6px 14px; font-size: 2rem; font-weight: 700; }
.answer.warn { color: var(--warn); font-size: 1.45rem; }
.answer.hidden { color: var(--muted); font-style: italic; }
.dec { color: var(--muted); font-size: 1.15rem; }
.verdict { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-major); }
.pill { flex: none; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 2px solid currentColor; }
.verdict p { margin: 0; min-width: 0; }

/* Controls */
.slider { display: grid; grid-template-columns: 56px minmax(0, 1fr) 52px; align-items: center; gap: 10px; }
.slider + .slider { margin-top: 10px; }
.slider label { font-weight: 700; }
.slider output { font-family: var(--font-num); font-weight: 700; text-align: right; font-size: 1.5rem; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--pt); }
input[type=range].green { accent-color: var(--green); }
input[type=range].orange { accent-color: var(--orange); }
.hint { margin: 10px 0 0; color: var(--muted); font-size: 0.9rem; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: var(--chip); border: 1px solid var(--grid-major); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--pt); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--pt); outline-offset: 2px; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { width: 18px; height: 18px; accent-color: var(--pt); }

/* Board drawing (classes MathBoard.js applies) */
.mb-minor { stroke: var(--grid); stroke-width: 1; }
.mb-major { stroke: var(--grid-major); stroke-width: 1; }
.mb-axis { stroke: var(--muted); stroke-width: 2; }
/* Sized to read from the back of a classroom on a projector. */
.mb-tick { fill: var(--ink); font-family: var(--font-num); font-size: 17px; font-weight: 700; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.mb-line { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.mb-seg { stroke-width: 4; stroke-dasharray: 9 6; }
.mb-seg.green { stroke: var(--green); } .mb-seg.orange { stroke: var(--orange); }
.mb-fill { fill-opacity: 0.08; stroke: none; }
.mb-fill.green { fill: var(--green); } .mb-fill.orange { fill: var(--orange); }
.mb-lbl { font-family: var(--font-num); font-size: 22px; font-weight: 700; fill: var(--ink); }
.mb-lbl.green { fill: var(--green); } .mb-lbl.orange { fill: var(--orange); }
.mb-lbl-bg { fill: var(--sheet); fill-opacity: 0.92; }
.mb-arrow.green { fill: var(--green); } .mb-arrow.orange { fill: var(--orange); }
.mb-handle { cursor: grab; outline: none; }
.mb-handle.drag { cursor: grabbing; }
.mb-handle .hit { fill: transparent; }
.mb-handle .dot { fill: var(--pt); stroke: var(--pt-ring); stroke-width: 3; }
.mb-handle:focus-visible .dot, .mb-handle.drag .dot { stroke: var(--pt); stroke-width: 4; fill: var(--pt-ring); }
.mb-handle .ring { fill: none; stroke: var(--pt); stroke-width: 2; opacity: 0.35; }
.mb-coord { font-family: var(--font-num); font-size: 20px; font-weight: 700; fill: var(--pt); paint-order: stroke; stroke: var(--sheet); stroke-width: 5px; stroke-linejoin: round; }
.mb-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; fill: var(--sheet); pointer-events: none; }
</style>
<style>
/* 3D Shapes and Nets: pick a solid, drag the picture to turn it, and slide to unfold it into its net.
   Each face hangs off a parent face by a hinge edge; the slider turns every hinge by the same fraction
   of its fold angle, so at 0 it is the closed solid and at 1 every face lies flat in the base's plane. */
.wrap { max-width: 1400px; }
.main { grid-template-columns: minmax(0, 1fr) minmax(0, 300px); }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
.board { padding: 0; overflow: hidden; }
#view { display: block; width: 100%; height: min(72vh, 760px); min-height: 360px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#view.drag { cursor: grabbing; }
/* Fit the window: the picture takes the full height of the board. */
@media (min-width: 861px) and (min-height: 520px) { #view { flex: 1 1 auto; height: 100%; min-height: 0; } }
.picks { display: flex; flex-direction: column; gap: 8px; }
.picks.row { flex-direction: row; flex-wrap: wrap; }
.picks button { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; min-height: 52px; padding: 10px 14px; text-align: left; }
.picks.row button { flex: 1 1 calc(50% - 8px); text-align: center; font-size: 1.1rem; }
.picks button[aria-pressed="true"] { background: var(--pt); border-color: var(--pt); color: var(--sheet); }
.unfold-ends { display: flex; justify-content: space-between; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; margin-bottom: 4px; }
#unfold { height: 40px; }
</style>

<div class="wrap">
  <header>
    <div><a class="main-btn" href="index.html"><span aria-hidden="true">←</span> Return to Main Page</a>
    <h1>3D Shapes and Nets</h1></div>
  </header>
  <div class="main">
    <div class="board"><canvas id="view" role="img" aria-label="3D shape. Drag to turn it."></canvas></div>
    <div class="panel">
      <div class="card">
        <div class="unfold-ends"><span>3D shape</span><span>Net</span></div>
        <input type="range" id="unfold" min="0" max="1000" value="0" aria-label="Unfold into a net">
      </div>
      <div class="card">
        <p class="label">Shape</p>
        <div class="picks" id="shapes"></div>
      </div>
      <div class="card" id="baseCard" hidden>
        <p class="label">Pyramid base</p>
        <div class="picks row" id="bases"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  // ---------- small 3D helpers ----------
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const mulR = (A, B) => { const C = new Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) C[i * 3 + j] = A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j]; return C; };
  const appR = (R, p) => [R[0] * p[0] + R[1] * p[1] + R[2] * p[2], R[3] * p[0] + R[4] * p[1] + R[5] * p[2], R[6] * p[0] + R[7] * p[1] + R[8] * p[2]];
  const apply = (M, p) => add(appR(M.R, p), M.T);
  const compose = (A, B) => ({ R: mulR(A.R, B.R), T: add(appR(A.R, B.T), A.T) });
  const IDENT = { R: [1, 0, 0, 0, 1, 0, 0, 0, 1], T: [0, 0, 0] };
  function rotAbout(a, u, th) {          // rotation by th about the line through a with unit direction u
    const c = Math.cos(th), s = Math.sin(th), k = 1 - c, [x, y, z] = u;
    const R = [c + x * x * k, x * y * k - z * s, x * z * k + y * s,
               y * x * k + z * s, c + y * y * k, y * z * k - x * s,
               z * x * k - y * s, z * y * k + x * s, c + z * z * k];
    return { R, T: sub(a, appR(R, a)) };
  }

  // ---------- solids ----------
  // Each solid: V (vertices, y up, base on y = 0), F (faces: v = vertex indices, c = color slot, smooth = curved surface),
  // tree (child face -> parent face; the root is face 0, the base, which stays put).
  const N = 48;   // strips used for curved surfaces
  const ring = (r, y, n, a0) => Array.from({ length: n }, (_, i) => { const a = a0 + i * 2 * Math.PI / n; return [r * Math.sin(a), y, r * Math.cos(a)]; });

  function rectPrism() {
    const w = 4, d = 2.5, h = 3;
    const V = [[-w/2, 0, -d/2], [w/2, 0, -d/2], [w/2, 0, d/2], [-w/2, 0, d/2], [-w/2, h, -d/2], [w/2, h, -d/2], [w/2, h, d/2], [-w/2, h, d/2]];
    const F = [{ v: [0, 1, 2, 3], c: 0 }, { v: [3, 2, 6, 7], c: 1 }, { v: [0, 1, 5, 4], c: 1 }, { v: [1, 2, 6, 5], c: 2 }, { v: [0, 3, 7, 4], c: 2 }, { v: [4, 5, 6, 7], c: 0 }];
    return { V, F, tree: [[1, 0], [2, 0], [3, 0], [4, 0], [5, 2]] };
  }
  function triPrism() {
    const L = 5, s = 3, ht = s * Math.sqrt(3) / 2;
    const V = [[-L/2, 0, s/2], [-L/2, 0, -s/2], [-L/2, ht, 0], [L/2, 0, s/2], [L/2, 0, -s/2], [L/2, ht, 0]];
    const F = [{ v: [0, 1, 4, 3], c: 1 }, { v: [1, 2, 5, 4], c: 1 }, { v: [2, 0, 3, 5], c: 1 }, { v: [0, 1, 2], c: 0 }, { v: [3, 4, 5], c: 0 }];
    return { V, F, tree: [[1, 0], [2, 0], [3, 0], [4, 0]] };
  }
  function pyramid(base) {
    let B, h = 3.2;
    if (base === 4) B = [[-1.5, 0, -1.5], [1.5, 0, -1.5], [1.5, 0, 1.5], [-1.5, 0, 1.5]];
    else if (base === "rect") B = [[-2.1, 0, -1.3], [2.1, 0, -1.3], [2.1, 0, 1.3], [-2.1, 0, 1.3]];
    else { const side = base === 3 ? 3.4 : base === 5 ? 2.3 : 2; B = ring(side / (2 * Math.sin(Math.PI / base)), 0, base, Math.PI); }
    const n = B.length, V = B.concat([[0, h, 0]]);
    const F = [{ v: B.map((_, i) => i), c: 0 }];
    const tree = [];
    for (let i = 0; i < n; i++) { F.push({ v: [i, (i + 1) % n, n], c: base === "rect" ? 1 + (i % 2) : 1 }); tree.push([i + 1, 0]); }
    return { V, F, tree };
  }
  // Curved solids: the strip at index K (on the far side) hinges on the base; the rest chain off it both ways.
  const K = N / 2;
  function chain(first) {
    const tree = [[first + K, 0]];
    for (let j = 1; j <= N / 2; j++) tree.push([first + (K + j) % N, first + (K + j - 1) % N]);
    for (let j = 1; j < N / 2; j++) tree.push([first + (K - j + N) % N, first + (K - j + 1 + N) % N]);
    return tree;
  }
  function cylinder() {
    const r = 1.4, h = 3.4, a0 = -Math.PI / N;
    const V = ring(r, 0, N, a0).concat(ring(r, h, N, a0));
    const F = [{ v: [...Array(N).keys()], c: 0 }];
    for (let i = 0; i < N; i++) F.push({ v: [i, (i + 1) % N, N + (i + 1) % N, N + i], c: 1, smooth: true });
    F.push({ v: [...Array(N).keys()].map(i => N + i), c: 0 });
    const tree = chain(1);
    tree.push([N + 1, 1 + K]);
    return { V, F, tree };
  }
  function cone() {
    const r = 1.7, h = 3.4, a0 = -Math.PI / N;
    const V = ring(r, 0, N, a0).concat([[0, h, 0]]);
    const F = [{ v: [...Array(N).keys()], c: 0 }];
    for (let i = 0; i < N; i++) F.push({ v: [i, (i + 1) % N, N], c: 1, smooth: true });
    return { V, F, tree: chain(1) };
  }

  // Prepare a solid: outward normals, the hinge (axis and fold angle) for each child, edge neighbours, draw order of the tree.
  function prepare(S) {
    const cen = S.V.reduce((m, p) => add(m, p), [0, 0, 0]).map(x => x / S.V.length);
    S.F.forEach(f => {
      const P = f.v.map(i => S.V[i]);
      let n = [0, 0, 0];
      for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; n = add(n, cross(a, b)); }
      n = norm(n);
      const fc = P.reduce((m, p) => add(m, p), [0, 0, 0]).map(x => x / P.length);
      if (dot(n, sub(fc, cen)) < 0) n = n.map(x => -x);
      f.n = n;
      f.nb = new Array(f.v.length).fill(-1);
      f.hinge = new Array(f.v.length).fill(false);
    });
    const key = (a, b) => a < b ? a + "," + b : b + "," + a;
    const edges = new Map();
    S.F.forEach((f, fi) => f.v.forEach((a, i) => {
      const k = key(a, f.v[(i + 1) % f.v.length]);
      if (!edges.has(k)) edges.set(k, []);
      edges.get(k).push([fi, i]);
    }));
    edges.forEach(list => { if (list.length === 2) { const [[f1, i1], [f2, i2]] = list; S.F[f1].nb[i1] = f2; S.F[f2].nb[i2] = f1; } });
    S.order = [];
    S.tree.forEach(([c, p]) => {
      const fc = S.F[c], fp = S.F[p];
      const i = fc.nb.indexOf(p);
      const a = S.V[fc.v[i]], b = S.V[fc.v[(i + 1) % fc.v.length]];
      const u = norm(sub(b, a));
      fc.parent = p; fc.axisA = a; fc.axisU = u;
      fc.fold = Math.atan2(dot(cross(fc.n, fp.n), u), dot(fc.n, fp.n));
      fc.hinge[i] = true;
      fp.hinge[fp.nb.indexOf(c)] = true;
      S.order.push(c);
    });
    return S;
  }

  const SOLIDS = {
    rect: () => rectPrism(), tri: () => triPrism(), pyr: b => pyramid(b), cyl: () => cylinder(), cone: () => cone()
  };
  const SHAPES = [["rect", "Rectangular Prism"], ["tri", "Triangular Prism"], ["pyr", "Pyramid"], ["cyl", "Cylinder"], ["cone", "Cone"]];
  const BASES = [[3, "Triangle"], [4, "Square"], ["rect", "Rectangle"], [5, "Pentagon"], [6, "Hexagon"]];
  // Pastel fills with dark edges, the same in light and dark mode (like the fraction strip tiles).
  const FILLS = ["#8fb8f2", "#f7b267", "#9fd89a"];
  const EDGE = "#1b2733";

  // ---------- state ----------
  const YAW0 = -0.6, PITCH0 = 0.42;
  let shape = "rect", base = 4, S, t = 0, yaw = YAW0, pitch = PITCH0, fitR = 1, netW = 1, netD = 1;

  // Face positions for unfold amount u (0 closed, 1 flat): returns per-face world points and rotations.
  function pose(u) {
    const M = new Array(S.F.length);
    M[0] = IDENT;
    S.order.forEach(c => { const f = S.F[c]; M[c] = compose(M[f.parent], rotAbout(f.axisA, f.axisU, u * f.fold)); });
    return S.F.map((f, i) => ({ P: f.v.map(v => apply(M[i], S.V[v])), R: M[i].R }));
  }
  function bounds(faces) {
    let lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
    faces.forEach(f => f.P.forEach(p => { for (let k = 0; k < 3; k++) { lo[k] = Math.min(lo[k], p[k]); hi[k] = Math.max(hi[k], p[k]); } }));
    return { c: lo.map((x, k) => (x + hi[k]) / 2), r: Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) / 2 };
  }
  function load() {
    S = prepare(SOLIDS[shape](base));
    fitR = Math.max(...[0, 0.25, 0.5, 0.75, 1].map(u => bounds(pose(u)).r));
    // Size the picture so the flat net (lying in the base plane) fills the board; the solid keeps that scale.
    const xs = [], zs = [];
    pose(1).forEach(f => f.P.forEach(p => { xs.push(p[0]); zs.push(p[2]); }));
    netW = Math.max(...xs) - Math.min(...xs); netD = Math.max(...zs) - Math.min(...zs);
    draw();
  }

  // ---------- drawing ----------
  const cv = document.getElementById("view"), ctx = cv.getContext("2d");
  const ease = x => x * x * (3 - 2 * x);
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const ch = s => Math.round(Math.min(255, ((n >> s) & 255) * k));
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  }
  function draw() {
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const faces = pose(t), { c } = bounds(faces);
    // The view tips toward straight-on as the net opens, so the flat net faces the class.
    const e = ease(t), yw = yaw - e * YAW0, pt = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch + e * (Math.PI / 2 - PITCH0)));
    const cy = Math.cos(yw), sy = Math.sin(yw), cp = Math.cos(pt), sp = Math.sin(pt);
    const view = p => { const x = p[0] * cy + p[2] * sy, z = -p[0] * sy + p[2] * cy, y = p[1]; return [x, y * cp - z * sp, y * sp + z * cp]; };
    const D = fitR * 6, scale = Math.min(W / netW, H / netD) * 0.9;
    const proj = q => { const k = D / (D - q[2]) * scale; return [W / 2 + q[0] * k, H / 2 - q[1] * k]; };
    const L = norm([-0.35, 0.55, 0.75]);
    const items = faces.map((f, i) => {
      const Q = f.P.map(p => view(sub(p, c)));
      const n = view(appR(f.R, S.F[i].n));
      return { i, Q, n, z: Q.reduce((m, q) => m + q[2], 0) / Q.length, front: n[2] > 0 };
    });
    const front = items.map(it => it.front);
    items.sort((a, b) => a.z - b.z);
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    items.forEach(it => {
      const f = S.F[it.i], pts = it.Q.map(proj);
      const col = shade(FILLS[f.c], 0.62 + 0.42 * Math.abs(dot(it.n, L)));
      ctx.beginPath();
      pts.forEach((p, k) => k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.closePath();
      ctx.fillStyle = col; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.beginPath();
      pts.forEach((p, k) => {
        const nb = f.nb[k];
        let hard = nb < 0 || !f.smooth || !S.F[nb].smooth || front[nb] !== front[it.i] || (!f.hinge[k] && t > 0.001);
        if (hard) { const q = pts[(k + 1) % pts.length]; ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); }
      });
      ctx.strokeStyle = EDGE; ctx.lineWidth = 2.5; ctx.stroke();
    });
  }

  // ---------- controls ----------
  function picks(host, list, get, set) {
    host.innerHTML = "";
    list.forEach(([v, name]) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = name;
      b.setAttribute("aria-pressed", String(get() === v));
      b.addEventListener("click", () => { set(v); host.querySelectorAll("button").forEach((x, k) => x.setAttribute("aria-pressed", String(list[k][0] === v))); });
      host.appendChild(b);
    });
  }
  const baseCard = document.getElementById("baseCard");
  picks(document.getElementById("shapes"), SHAPES, () => shape, v => { shape = v; baseCard.hidden = v !== "pyr"; load(); });
  picks(document.getElementById("bases"), BASES, () => base, v => { base = v; load(); });
  const slider = document.getElementById("unfold");
  slider.addEventListener("input", () => { t = slider.value / 1000; draw(); });

  let drag = null;
  cv.addEventListener("pointerdown", ev => { drag = { x: ev.clientX, y: ev.clientY }; cv.setPointerCapture(ev.pointerId); cv.classList.add("drag"); });
  cv.addEventListener("pointermove", ev => {
    if (!drag) return;
    yaw += (ev.clientX - drag.x) * 0.01;
    pitch = Math.max(-1.5, Math.min(1.5, pitch + (ev.clientY - drag.y) * 0.01));
    drag = { x: ev.clientX, y: ev.clientY };
    draw();
  });
  const end = () => { drag = null; cv.classList.remove("drag"); };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  new ResizeObserver(draw).observe(cv);
  load();
})();
</script>

</body>
</html>
